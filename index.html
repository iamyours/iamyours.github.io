<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>风水课程分镜展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* 类型选择器 */
        .type-selector {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .type-selector.sticky {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-radius: 0;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
        }

        .type-selector.sticky h2 {
            display: none;
        }

        .type-selector.sticky .type-buttons {
            gap: 5px;
            justify-content: center;
        }

        .type-selector.sticky .type-btn {
            min-width: auto;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 6px;
        }

        .type-selector h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .type-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .type-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .type-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .type-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        /* 部分选择器 */
        .part-selector {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            transition: all 0.3s;
        }

        .part-selector.show {
            display: block;
        }

        .part-selector.sticky {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 100%;
            z-index: 999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-radius: 0;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
        }

        .part-selector.sticky .part-info {
            display: none;
        }

        .part-selector.sticky .part-buttons {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 5px;
            grid-template-columns: none;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .part-selector.sticky .part-buttons::-webkit-scrollbar {
            display: none;
        }

        .part-selector.sticky .part-btn {
            flex: 0 0 auto;
            padding: 6px 12px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .part-selector.sticky .part-btn-title {
            font-size: 13px;
            margin-bottom: 0;
        }

        .part-selector.sticky .part-btn-info {
            display: none;
        }

        /* 占位符，防止内容跳动 */
        .type-placeholder,
        .part-placeholder {
            display: none;
        }

        .type-placeholder.active,
        .part-placeholder.active {
            display: block;
            height: 0;
            margin-bottom: 30px;
        }

        /* 手机端优化 */
        @media (max-width: 768px) {
            .type-selector.sticky .type-buttons {
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }

            .type-selector.sticky .type-buttons::-webkit-scrollbar {
                display: none;
            }

            .type-selector.sticky .type-btn {
                flex: 0 0 auto;
                min-width: auto;
                padding: 6px 10px;
                font-size: 12px;
            }

            .part-selector.sticky .part-btn {
                padding: 6px 10px;
                font-size: 12px;
            }

            .part-selector.sticky .part-btn-title {
                font-size: 12px;
            }
        }

        .part-info {
            margin-bottom: 15px;
        }

        .part-info h3 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }

        .part-info p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .part-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .part-btn {
            padding: 12px;
            background: #f0f0f0;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .part-btn:hover {
            background: #e0e0e0;
        }

        .part-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .part-btn-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .part-btn-info {
            font-size: 12px;
            opacity: 0.8;
        }

        /* 图片网格 */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .image-grid {
                grid-template-columns: 1fr;
            }
        }

        .image-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .image-card:hover {
            transform: translateY(-5px);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 比例 */
            background: #f0f0f0;
            overflow: hidden;
        }

        .image-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.6) 70%, transparent 100%);
            color: white;
            font-size: 14px;
            line-height: 1.6;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .image-info {
            padding: 15px;
        }

        .image-title {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }

        .image-time {
            font-size: 12px;
            color: #999;
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 16px;
            opacity: 0.8;
        }

        /* 部分分隔符样式 */
        .part-separator {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏯 风水课程分镜展示</h1>

        <!-- 类型选择器占位符 -->
        <div class="type-placeholder" id="typePlaceholder"></div>

        <!-- 类型选择器 -->
        <div class="type-selector" id="typeSelector">
            <h2>选择版本</h2>
            <div class="type-buttons" id="typeButtons"></div>
        </div>

        <!-- 部分选择器占位符 -->
        <div class="part-placeholder" id="partPlaceholder"></div>

        <!-- 部分选择器 -->
        <div class="part-selector" id="partSelector">
            <div class="part-info" id="partInfo"></div>
            <div class="part-buttons" id="partButtons"></div>
        </div>

        <!-- 加载状态 -->
        <div class="loading" id="loading">加载中</div>

        <!-- 图片网格 -->
        <div class="image-grid" id="imageGrid"></div>
    </div>

    <script>
        // 配置：本地开发模式
        let IS_LOCAL_DEV = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        IS_LOCAL_DEV = true;
        // API配置
        const API_BASE = IS_LOCAL_DEV 
            ? '.' // 本地开发时使用当前目录
            : 'https://iamyours.oss-cn-shanghai.aliyuncs.com/images/风水/课程1';
        
        const STYLE_LIST_URL = IS_LOCAL_DEV 
            ? './json/style_list_local.json' 
            : 'https://iamyours.oss-cn-shanghai.aliyuncs.com/images/风水/课程1/style_list.json';
        
        let currentStyleData = null;
        let currentPartIndex = 0;
        let isLoadingMore = false;
        let loadedParts = new Set(); // 记录已加载的部分
        
        console.log('运行模式:', IS_LOCAL_DEV ? '本地开发' : '线上环境');
        console.log('API地址:', API_BASE);
        console.log('样式列表URL:', STYLE_LIST_URL);

        // 滚动监听 - 悬浮固定
        let typeSelectorOriginalTop = 0;
        let partSelectorOriginalTop = 0;
        let sectionObserver = null;

        window.addEventListener('scroll', () => {
            handleStickyHeaders();
            updateActiveTab();
        });

        // 更新当前激活的tab
        function updateActiveTab() {
            if (!currentStyleData || !document.querySelector('.part-selector.sticky')) return;
            
            const imageCards = document.querySelectorAll('.image-card');
            if (imageCards.length === 0) return;
            
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const windowHeight = window.innerHeight;
            const viewportCenter = scrollTop + windowHeight / 3; // 使用视口上1/3作为判断点
            
            // 找到当前视口中心对应的图片卡片
            let currentPartIndex = 0;
            let minDistance = Infinity;
            
            imageCards.forEach((card) => {
                const cardTop = card.offsetTop;
                const cardBottom = cardTop + card.offsetHeight;
                const cardCenter = (cardTop + cardBottom) / 2;
                const distance = Math.abs(cardCenter - viewportCenter);
                
                if (distance < minDistance && cardTop < viewportCenter && cardBottom > scrollTop) {
                    minDistance = distance;
                    // 从卡片的data属性中获取部分索引
                    const partIndex = parseInt(card.getAttribute('data-part-index'));
                    if (!isNaN(partIndex)) {
                        currentPartIndex = partIndex;
                    }
                }
            });
            
            // 更新tab选中状态（只在自动滚动时更新，不影响手动点击）
            if (currentPartIndex !== window.lastActivePartIndex && !isLoadingMore) {
                window.lastActivePartIndex = currentPartIndex;
                const partButtons = document.querySelectorAll('.part-btn');
                partButtons.forEach((btn, index) => {
                    btn.classList.toggle('active', index === currentPartIndex);
                });
            }
        }

        function handleStickyHeaders() {
            const typeSelector = document.getElementById('typeSelector');
            const partSelector = document.getElementById('partSelector');
            const typePlaceholder = document.getElementById('typePlaceholder');
            const partPlaceholder = document.getElementById('partPlaceholder');
            
            if (!typeSelectorOriginalTop) {
                typeSelectorOriginalTop = typeSelector.offsetTop;
            }
            
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            // 类型选择器和部分选择器合并悬浮
            const shouldSticky = scrollTop > typeSelectorOriginalTop - 10;
            
            if (shouldSticky) {
                // 两个选择器都悬浮，但是叠加在一起
                typeSelector.classList.add('sticky');
                typePlaceholder.classList.add('active');
                
                if (partSelector.classList.contains('show')) {
                    partSelector.classList.add('sticky');
                    partSelector.style.top = '42px'; // 紧贴在类型选择器下方
                    partPlaceholder.classList.add('active');
                    
                    // 计算总高度
                    const totalHeight = typeSelector.offsetHeight + partSelector.offsetHeight;
                    typePlaceholder.style.height = totalHeight + 30 + 'px';
                } else {
                    typePlaceholder.style.height = typeSelector.offsetHeight + 30 + 'px';
                }
            } else {
                typeSelector.classList.remove('sticky');
                partSelector.classList.remove('sticky');
                typePlaceholder.classList.remove('active');
                partPlaceholder.classList.remove('active');
            }
        }

        // 无限滚动 - 已禁用，因为一次性加载所有内容
        function handleInfiniteScroll() {
            // 不再需要无限滚动，因为所有内容已一次性加载
            return;
        }

        function loadNextPart() {
            // 不再需要，因为所有内容已一次性加载
            return;
        }

        // 追加图片到现有网格 - 已不再使用，保留以防需要
        function appendImages(partIndex) {
            // 此函数已不再使用，因为改为一次性加载所有内容
            console.warn('appendImages 已废弃，所有内容已一次性加载');
        }

        // 初始化
        async function init() {
            try {
                showLoading(true);
                const response = await fetch(STYLE_LIST_URL);
                const styleList = await response.json();
                
                renderTypeButtons(styleList);
                
                // 默认加载第一个类型
                if (styleList.length > 0) {
                    loadStyleData(styleList[0].url);
                }
            } catch (error) {
                showError('加载类型列表失败: ' + error.message);
            }
        }

        // 渲染类型按钮
        function renderTypeButtons(styleList) {
            const container = document.getElementById('typeButtons');
            container.innerHTML = '';
            
            styleList.forEach((style, index) => {
                const btn = document.createElement('button');
                btn.className = 'type-btn' + (index === 0 ? ' active' : '');
                btn.textContent = style.name;
                btn.onclick = () => {
                    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadStyleData(style.url);
                };
                container.appendChild(btn);
            });
        }

        // 加载风格数据
        async function loadStyleData(url) {
            try {
                showLoading(true);
                
                // 如果是本地开发模式，且URL是远程地址，则转换为本地文件
                let fetchUrl = url;
                if (IS_LOCAL_DEV && url.startsWith('http')) {
                    // 提取文件名，使用本地文件
                    const fileName = url.split('/').pop();
                    fetchUrl = `./json/${fileName}`;
                    console.log('本地模式，加载本地文件:', fetchUrl);
                }
                
                const response = await fetch(fetchUrl);
                currentStyleData = await response.json();
                
                renderPartButtons();
                showPartSelector(true);
                
                // 默认显示第一部分
                currentPartIndex = 0;
                renderImages(0);
            } catch (error) {
                showError('加载数据失败: ' + error.message);
                console.error('详细错误:', error);
            }
        }

        // 渲染部分按钮
        function renderPartButtons() {
            const container = document.getElementById('partButtons');
            container.innerHTML = '';
            
            currentStyleData.forEach((part, index) => {
                const btn = document.createElement('div');
                btn.className = 'part-btn' + (index === 0 ? ' active' : '');
                btn.innerHTML = `
                    <div class="part-btn-title">${part.名称}</div>
                    <div class="part-btn-info">${part.切片总数}个分镜 | ${part.时长}</div>
                `;
                btn.onclick = () => {
                    // 立即更新按钮状态
                    document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    // 更新当前索引
                    currentPartIndex = index;
                    window.lastActivePartIndex = index;
                    
                    // 滚动到对应部分
                    const separator = document.getElementById(`part-separator-${index}`);
                    if (separator) {
                        // 计算悬浮导航栏的总高度
                        const typeSelector = document.getElementById('typeSelector');
                        const partSelector = document.getElementById('partSelector');
                        let navHeight = 0;
                        
                        if (typeSelector.classList.contains('sticky')) {
                            navHeight += typeSelector.offsetHeight;
                        }
                        if (partSelector.classList.contains('sticky')) {
                            navHeight += partSelector.offsetHeight;
                        }
                        
                        // 添加额外的间距
                        navHeight += 20;
                        
                        // 获取分隔符的位置
                        const separatorTop = separator.getBoundingClientRect().top + window.pageYOffset;
                        
                        // 滚动到正确位置
                        window.scrollTo({
                            top: separatorTop - navHeight,
                            behavior: 'smooth'
                        });
                    }
                };
                container.appendChild(btn);
            });
            
            // 重置悬浮位置
            partSelectorOriginalTop = 0;
        }

        // 渲染图片 - 一次性加载所有部分
        function renderImages(partIndex) {
            const container = document.getElementById('imageGrid');
            
            // 更新部分信息（显示第一个部分的信息）
            const firstPart = currentStyleData[0];
            const infoContainer = document.getElementById('partInfo');
            infoContainer.innerHTML = `
                <h3>${firstPart.名称}</h3>
                <p>主题: ${firstPart.主题} | 时长: ${firstPart.时长} | 共${firstPart.切片总数}个分镜</p>
            `;
            
            container.innerHTML = '';
            showLoading(false);
            
            // 重置已加载部分记录
            loadedParts.clear();
            
            // 一次性加载所有部分
            currentStyleData.forEach((part, index) => {
                if (!part.切片内容 || part.切片内容.length === 0) {
                    return;
                }
                
                loadedParts.add(index);
                
                // 添加分隔标题
                const separator = document.createElement('div');
                separator.id = `part-separator-${index}`;
                separator.className = 'part-separator';
                separator.style.gridColumn = '1 / -1';
                separator.style.padding = '20px';
                separator.style.textAlign = 'center';
                separator.style.color = 'white';
                separator.style.fontSize = '20px';
                separator.style.fontWeight = 'bold';
                separator.innerHTML = `📍 ${part.名称}`;
                container.appendChild(separator);
                
                // 添加该部分的所有图片
                part.切片内容.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    card.setAttribute('data-part-index', index);
                    card.innerHTML = `
                        <div class="image-wrapper">
                            <img src="${item.图片地址}" 
                                 alt="${item.标题}" 
                                 loading="lazy"
                                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22%3E%3Crect fill=%22%23ddd%22 width=%22400%22 height=%22300%22/%3E%3Ctext fill=%22%23999%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22%3E图片加载失败%3C/text%3E%3C/svg%3E'">
                            <div class="image-caption">${item.文案}</div>
                        </div>
                        <div class="image-info">
                            <div class="image-title">${item.名称} - ${item.标题}</div>
                            <div class="image-time">${item.时间}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
            
            // 重置激活索引
            window.lastActivePartIndex = partIndex;
            
            console.log('已一次性加载所有部分:', Array.from(loadedParts).sort((a,b) => a-b));
        }

        // 显示/隐藏加载状态
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('imageGrid').style.display = show ? 'none' : 'grid';
        }

        // 显示/隐藏部分选择器
        function showPartSelector(show) {
            const selector = document.getElementById('partSelector');
            if (show) {
                selector.classList.add('show');
            } else {
                selector.classList.remove('show');
            }
        }

        // 显示错误
        function showError(message) {
            showLoading(false);
            const container = document.getElementById('imageGrid');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
