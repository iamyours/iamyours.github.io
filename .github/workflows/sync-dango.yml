name: Sync dango-travel

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [dango-updated]

permissions:
  contents: write

concurrency:
  group: sync-dango-travel
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Mirror deployable site from dango-travel
        run: |
          set -euo pipefail
          rm -rf /tmp/dango-travel
          git clone --depth 1 --branch main https://github.com/iamyours/dango-travel.git /tmp/dango-travel
          short="$(git -C /tmp/dango-travel rev-parse --short=7 HEAD)"
          echo "dango-travel@${short}"

          # Same set as dango-travel .github/workflows/pages.yml copies into _site,
          # plus ads.txt when the upstream root has one.
          # README.md stays. screenshots/, .github/, and other non-site files are not copied.
          # If upstream has no ads.txt, master's copy is left in place.
          rm -rf assets koi
          mkdir -p assets koi
          cp -a /tmp/dango-travel/index.html ./index.html
          cp -a /tmp/dango-travel/.nojekyll ./.nojekyll
          cp -a /tmp/dango-travel/assets/. ./assets/
          cp -a /tmp/dango-travel/koi/. ./koi/
          if [[ -f /tmp/dango-travel/ads.txt ]]; then
            cp -a /tmp/dango-travel/ads.txt ./ads.txt
          else
            echo "Upstream has no ads.txt; leaving master's ads.txt unchanged."
          fi

          git add -A -- index.html .nojekyll assets koi
          if [[ -f /tmp/dango-travel/ads.txt ]]; then
            git add -A -- ads.txt
          fi
          if git diff --cached --quiet; then
            echo "No changes; skip commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync dango-travel@${short}"
          git push origin HEAD:master
