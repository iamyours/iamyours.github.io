{

<body>
<a href="../" style="position:fixed;top:12px;left:12px;z-index:1000;padding:6px 14px;border-radius:999px;background:rgba(251,244,226,0.85);color:#3a2e24;font:600 14px/1.4 'PingFang SC','Noto Sans SC',sans-serif;text-decoration:none;border:1.5px solid rgba(58,46,36,0.4)">← 返回 3D 作品</a>
<div class="title">豌豆射手 · 体素挂件</div>
<div class="hud" id="hud">🧟 击退僵尸：0　🌱 豌豆：0</div>
<div class="panel">
  <button class="btn" id="btnAuto" type="button">🤖 自动射击：关</button>
  <button class="btn" id="btnShake" type="button">👋 摇一摇</button>
  <button class="btn on" id="btnSound" type="button">🔊 音效：开</button>
</div>
<div class="hint">点击发射豌豆 · 长按连射 · 拖动植物甩一甩 · 拖动空白处旋转 · 滚轮/双指缩放 · 空格射击</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 基础工具 ================= */
// 可复现伪随机
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261021);
const rr = (a, b) => a + (b - a) * rand();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const wrapPi = a => Math.atan2(Math.sin(a), Math.cos(a));
const _c = new THREE.Color();
// 颜色微抖动，营造体素块的手工质感
function jit(hex, amt = 0.07) {
  _c.setHex(hex).multiplyScalar(1 + (rand() * 2 - 1) * amt);
  return _c.getHex();
}

/* ================= 渲染器 / 场景 / 相机 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(4.2, 2.0, 7.6);
if (camera.aspect < 0.8) camera.position.multiplyScalar(1.45);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 18;
controls.maxPolarAngle = 1.72;
controls.rotateSpeed = 0.7;
controls.update();

// 灯光
scene.add(new THREE.HemisphereLight(0xe6f6ff, 0x6a8a3a, 0.75));
const sun = new THREE.DirectionalLight(0xfff0d4, 2.6);
sun.position.set(5, 9, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbfe0ff, 0.5);
fill.position.set(-6, 3, -4);
scene.add(fill);

/* ================= 体素工具 ================= */
const voxGeo = new RoundedBoxGeometry(1, 1, 1, 1, 0.14);
const plainBox = new THREE.BoxGeometry(1, 1, 1);

// 体素集合：整数网格去重，可剔除被完全包裹的内部体素
class VoxelSet {
  constructor() { this.map = new Map(); this.items = []; }
  k(x, y, z) { return x + ',' + y + ',' + z; }
  set(x, y, z, c) {
    const key = this.k(x, y, z), o = this.map.get(key);
    if (o) { o.c = c; return o; }
    const it = { x, y, z, c };
    this.map.set(key, it); this.items.push(it);
    return it;
  }
  get(x, y, z) { return this.map.get(this.k(x, y, z)); }
  has(x, y, z) { return this.map.has(this.k(x, y, z)); }
  surface() {
    return this.items.filter(({ x, y, z }) => !(
      this.has(x + 1, y, z) && this.has(x - 1, y, z) && this.has(x, y + 1, z) &&
      this.has(x, y - 1, z) && this.has(x, y, z + 1) && this.has(x, y, z - 1)));
  }
}
// 把体素列表转成 InstancedMesh（size 为单个体素边长）
function voxelMesh(items, size, material, geo = voxGeo) {
  const mesh = new THREE.InstancedMesh(geo, material, items.length);
  const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(), col = new THREE.Color();
  items.forEach((it, i) => {
    p.set(it.x * size, it.y * size, it.z * size);
    s.set(size * (it.sx || 1), size * (it.sy || 1), size * (it.sz || 1));
    m.compose(p, q, s);
    mesh.setMatrixAt(i, m);
    mesh.setColorAt(i, col.setHex(it.c));
  });
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
const stdMat = (p = {}) => new THREE.MeshStandardMaterial({ roughness: 0.62, metalness: 0, envMapIntensity: 0.55, ...p });
const plantMat = stdMat();

/* ================= 草坪展台（植物大战僵尸风格棋盘草地） ================= */
const GROUND_Y = -2.0, LAWN_HALF = 3.25;
{
  const T = 0.5, N = 13, grass = [], dirt = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const x = (i - 6), z = (j - 6);
    const light = (i + j) % 2 === 0;
    grass.push({ x, y: (GROUND_Y - 0.1) / T, z, sy: 0.4, c: jit(light ? 0x8bd24c : 0x70bd3d, 0.04) });
    dirt.push({ x, y: (GROUND_Y - 0.45) / T, z, sy: 0.98, c: jit((i + j) % 3 ? 0x8c5a2e : 0x7a4d27, 0.06) });
    const edge = i === 0 || j === 0 || i === N - 1 || j === N - 1;
    if (edge && rand() < 0.6) dirt.push({ x, y: (GROUND_Y - 0.85) / T, z, sx: 0.92, sy: 0.6, sz: 0.92, c: jit(0x6b4322, 0.06) });
  }
  const g = voxelMesh(grass, T, stdMat({ roughness: 0.85 }));
  g.castShadow = false;
  scene.add(g);
  const d = voxelMesh(dirt, T, stdMat({ roughness: 0.95 }));
  d.receiveShadow = false;
  scene.add(d);

  // 小草与小花
  const tufts = [], m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const col = new THREE.Color(), cols = [];
  for (let n = 0; n < 90; n++) {
    const x = rr(-3.1, 3.1), z = rr(-3.1, 3.1);
    if (Math.hypot(x + 2, z) < 0.5) continue;
    const blades = 2 + Math.floor(rand() * 3);
    for (let b = 0; b < blades; b++) {
      const h = rr(0.08, 0.18);
      q.setFromEuler(e.set(rr(-0.3, 0.3), rr(0, 3), rr(-0.3, 0.3)));
      m.compose(new THREE.Vector3(x + rr(-0.05, 0.05), GROUND_Y + h / 2, z + rr(-0.05, 0.05)), q, new THREE.Vector3(0.035, h, 0.035));
      tufts.push(m.clone()); cols.push(jit(0x4f9e2e, 0.12));
    }
  }
  for (let n = 0; n < 10; n++) {
    const x = rr(-3, 3), z = rr(-3, 3);
    if (Math.hypot(x, z) < 1.3 || Math.hypot(x + 2, z) < 0.5) continue;
    q.identity();
    m.compose(new THREE.Vector3(x, GROUND_Y + 0.07, z), q, new THREE.Vector3(0.025, 0.14, 0.025));
    tufts.push(m.clone()); cols.push(0x3f8a26);
    const fc = rand() < 0.5 ? 0xffe14d : 0xffffff;
    for (const [dx, dz] of [[0.04, 0], [-0.04, 0], [0, 0.04], [0, -0.04]]) {
      m.compose(new THREE.Vector3(x + dx, GROUND_Y + 0.15, z + dz), q, new THREE.Vector3(0.045, 0.03, 0.045));
      tufts.push(m.clone()); cols.push(fc);
    }
    m.compose(new THREE.Vector3(x, GROUND_Y + 0.16, z), q, new THREE.Vector3(0.04, 0.04, 0.04));
    tufts.push(m.clone()); cols.push(0xffa62b);
  }
  const tm = new THREE.InstancedMesh(plainBox, stdMat({ roughness: 0.8 }), tufts.length);
  tufts.forEach((mm, i) => { tm.setMatrixAt(i, mm); tm.setColorAt(i, col.setHex(cols[i])); });
  tm.castShadow = true;
  scene.add(tm);
}

/* ================= 木质挂架 ================= */
const PIVOT = new THREE.Vector3(0, 2.2, 0);
const metalMat = new THREE.MeshStandardMaterial({ color: 0xe6c35c, metalness: 0.95, roughness: 0.28 });
{
  const S = 0.2, wood = [];
  const wc = k => jit(k % 2 ? 0xa8733f : 0x93602f, 0.05);
  // 底座
  for (let x = -2; x <= 1; x++) for (let z = -2; z <= 1; z++)
    wood.push({ x: (-2.0 + (x + 0.5) * S) / S, y: (GROUND_Y + 0.08) / S, z: ((z + 0.5) * S) / S, sy: 0.8, c: jit(0x7f512a, 0.05) });
  // 立柱（2x2 截面）
  for (let k = 0; k < 24; k++) for (const dx of [-0.5, 0.5]) for (const dz of [-0.5, 0.5])
    wood.push({ x: -2.0 / S + dx, y: (GROUND_Y + 0.26 + k * S) / S, z: dz, c: wc(k) });
  // 横梁
  for (let k = 0; k < 11; k++) for (const dz of [-0.5, 0.5])
    wood.push({ x: (-1.7 + k * S) / S, y: 2.75 / S, z: dz, c: wc(k + 1) });
  // 斜撑（阶梯体素）
  for (let k = 0; k < 3; k++) wood.push({ x: (-1.7 + k * S) / S, y: (2.15 + k * S) / S, z: 0, c: wc(k) });
  scene.add(voxelMesh(wood, S, stdMat({ roughness: 0.8 })));

  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.36, 12), metalMat);
  rod.position.set(0, 2.47, 0);
  rod.castShadow = true;
  scene.add(rod);
  const hook = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.018, 10, 24), metalMat);
  hook.position.set(0, PIVOT.y + 0.04, 0);
  hook.rotation.y = Math.PI / 2;
  hook.castShadow = true;
  scene.add(hook);
}

/* ================= 远处体素云朵 ================= */
const cloudRoot = new THREE.Group();
scene.add(cloudRoot);
{
  const items = [];
  for (let c = 0; c < 7; c++) {
    const a = c / 7 * Math.PI * 2 + rr(-0.3, 0.3), r = rr(12, 17), y = rr(3.5, 7);
    const cx = Math.cos(a) * r, cz = Math.sin(a) * r;
    const n = 6 + Math.floor(rand() * 6);
    for (let k = 0; k < n; k++) {
      const dx = Math.round(rr(-3, 3)), dy = Math.round(rr(0, 1.2)) * (Math.abs(dx) < 2 ? 1 : 0), dz = Math.round(rr(-1, 1));
      items.push({ x: cx / 0.6 + dx, y: y / 0.6 + dy, z: cz / 0.6 + dz, c: jit(0xffffff, 0.03) });
    }
  }
  const cm = voxelMesh(items, 0.6, stdMat({ roughness: 1, envMapIntensity: 0.9, emissive: 0x9aa8b8, emissiveIntensity: 0.25 }));
  cm.castShadow = cm.receiveShadow = false;
  cloudRoot.add(cm);
}

/* ================= 豌豆射手挂件 ================= */
const V = 0.1;
const HEAD_Y = -1.8;
const pendant = new THREE.Group();
pendant.position.copy(PIVOT);
scene.add(pendant);
const headGroup = new THREE.Group();
headGroup.position.y = HEAD_Y;
pendant.add(headGroup);
const headInner = new THREE.Group();
headGroup.add(headInner);

const G_TOP = 0x8fe35f, G_MID = 0x6fcf48, G_LOW = 0x52aa37, G_DARK = 0x3d8a2a;
const headSet = new VoxelSet();
{
  const RX = 5.8, RY = 5.4, RZ = 5.6;
  for (let x = -6; x <= 6; x++) for (let y = -6; y <= 6; y++) for (let z = -6; z <= 6; z++) {
    if ((x / RX) ** 2 + (y / RY) ** 2 + (z / RZ) ** 2 > 1) continue;
    headSet.set(x, y, z, jit(y >= 3 ? G_TOP : y <= -3 ? G_LOW : G_MID, 0.06));
  }
  // 后脑勺翘起的小叶片
  for (let i = 0; i < 8; i++) {
    const z = -4 - i;
    const y = Math.round(3 + i * 0.75 - i * i * 0.045);
    const w = Math.round(2.3 * Math.sin(Math.PI * (i + 1) / 9));
    for (let x = -w; x <= w; x++) {
      const c = x === 0 ? G_DARK : jit(0x5cbf3f, 0.06);
      headSet.set(x, y, z, c);
      if (i < 3) headSet.set(x, y - 1, z, c);
    }
  }
  headInner.add(voxelMesh(headSet.surface(), V, plantMat));
}

// 眼睛：贴合头部曲面的黑色体素 + 高光，独立分组便于眨眼
const eyes = [];
{
  const eyeMat = stdMat({ roughness: 0.2, envMapIntensity: 1.0 });
  for (const sg of [-1, 1]) {
    const ex = 2.1 * sg, ey = 2.6, rx = 1.45, ry = 1.95;
    const g = new THREE.Group();
    g.position.set(ex * V, ey * V, 0);
    const items = [];
    for (let x = Math.ceil(ex - rx); x <= Math.floor(ex + rx); x++) {
      for (let y = Math.ceil(ey - ry); y <= Math.floor(ey + ry); y++) {
        if (((x - ex) / rx) ** 2 + ((y - ey) / ry) ** 2 > 1) continue;
        let zs = -1;
        for (let z = 7; z >= 0; z--) if (headSet.has(x, y, z)) { zs = z; break; }
        if (zs < 0) continue;
        const hl = x === Math.round(ex) - 1 && y === 3;
        items.push({ x: x - ex, y: y - ey, z: zs + 0.55, sz: 0.55, c: hl ? 0xffffff : 0x141414 });
      }
    }
    g.add(voxelMesh(items, V, eyeMat));
    headInner.add(g);
    eyes.push(g);
  }
}

// 炮管嘴：中空圆筒 + 外翻唇边
const snoutGroup = new THREE.Group();
snoutGroup.position.set(0, -1.5 * V, 3 * V);
headInner.add(snoutGroup);
const snoutTip = new THREE.Object3D();
snoutTip.position.z = 8.2 * V;
snoutGroup.add(snoutTip);
{
  const ss = new VoxelSet();
  const HOLE = 1.45;
  for (let z = 0; z <= 7; z++) for (let x = -4; x <= 4; x++) for (let y = -4; y <= 4; y++) {
    const r = Math.hypot(x, y);
    const lip = z >= 6;
    if (r > (lip ? 3.15 : 2.45)) continue;
    if (z >= 4 && r <= HOLE) continue;
    let c;
    if (z === 3 && r <= HOLE) c = 0x1b3510;
    else if (lip) c = jit(r < 2.1 ? 0x469c2f : 0x5cbf3f, 0.05);
    else c = jit(y > 0 ? G_TOP : G_MID, 0.05);
    ss.set(x, y, z, c);
  }
  snoutGroup.add(voxelMesh(ss.surface(), V, plantMat));
}

// 头顶挂环 + 链条
{
  const eyelet = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.02, 10, 28), metalMat);
  eyelet.position.y = 0.6;
  eyelet.castShadow = true;
  headGroup.add(eyelet);
  const top = HEAD_Y + 0.6 + 0.075;
  const n = 8, pitch = -top / n;
  const linkGeo = new THREE.TorusGeometry(0.045, 0.012, 8, 20);
  for (let i = 0; i < n; i++) {
    const l = new THREE.Mesh(linkGeo, metalMat);
    l.scale.y = 1.7;
    l.position.y = -(i + 0.5) * pitch;
    l.rotation.y = i % 2 ? 0 : Math.PI / 2;
    l.castShadow = true;
    pendant.add(l);
  }
}

// 茎
{
  const st = new VoxelSet();
  for (let y = -21; y >= -38; y--) {
    const t = (-21 - y) / 17;
    const ox = Math.round(Math.sin(t * Math.PI) * 0.9);
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
      if (Math.abs(dx) + Math.abs(dz) > 1 && y > -35) continue;
      st.set(ox + dx, y, dz, jit(dx < 0 || dz > 0 ? 0x5cbf3f : 0x4caa36, 0.05));
    }
  }
  pendant.add(voxelMesh(st.surface(), V, plantMat));
}

// 底部四片叶子
const leaves = [];
for (let k = 0; k < 4; k++) {
  const g = new THREE.Group();
  g.position.set(0, -3.78, 0);
  g.rotation.y = k * Math.PI / 2 + Math.PI / 4 + rr(-0.15, 0.15);
  const tilt = new THREE.Group();
  tilt.rotation.z = rr(0.06, 0.18);
  g.add(tilt);
  const ls = new VoxelSet();
  for (let i = 1; i <= 10; i++) {
    const w = Math.round(2.7 * Math.sin(Math.PI * (i - 0.3) / 10.6));
    const y = Math.round(0.03 * i * i - 0.12 * i);
    for (let z = -w; z <= w; z++) {
      const c = z === 0 ? 0x3f9a2e : Math.abs(z) === w ? jit(0x4aa836) : jit(0x63c943);
      ls.set(i, y, z, c);
    }
  }
  tilt.add(voxelMesh(ls.items, V, plantMat));
  pendant.add(g);
  leaves.push({ g: tilt, base: tilt.rotation.z, ph: rand() * 6.28 });

  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);

}

  ensureAudio();
  soundOn = !soundOn;
  btnSound.textContent = `${soundOn ? '🔊' : '🔈'} 音效：${soundOn ? '开' : '关'}`;
  btnSound.classList.toggle('on', soundOn);
  btnSound.blur();
});

/* ================= 动画循环 ================= */
const easeOutBack = t => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2;
updateHud(false);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  headGroup.getWorldPosition(headWorld);

  // —— 决定看向哪里 ——
  if (autoMode) {
    const z = nearestZombie();
    if (z) {
      aim.zombie = z;
      aim.target.copy(z.g.position);
      autoTimer -= dt;
      if (autoTimer <= 0) { requestShot(); autoTimer = 0.55; }
    } else aim.target.copy(camera.position);
  } else if (aim.zombie && aim.zombie.alive) {
    aim.target.copy(aim.zombie.g.position);
  } else if (time - aim.lastInput > 3.5) {
    // 闲置：盯着最近的僵尸，没有就看着你
    const z = nearestZombie(4.2);
    if (z) { aim.zombie = z; aim.target.copy(z.g.position); }
    else aim.target.copy(camera.position);
  }
  aim.cur.lerp(aim.target, 1 - Math.exp(-dt * 8));
  {
    const dx = aim.cur.x - headWorld.x, dy = aim.cur.y - headWorld.y, dz = aim.cur.z - headWorld.z;
    if (dx * dx + dz * dz > 1e-4) phys.twT = Math.atan2(dx, dz);
    const pitch = Math.atan2(dy, Math.hypot(dx, dz));
    headGroup.rotation.x += (-clamp(pitch, -0.6, 0.55) - headGroup.rotation.x) * (1 - Math.exp(-dt * 8));
  }

  updatePhys(dt, time);

  // —— 射击 ——
  if (ptr.down && !ptr.onPlant && !ptr.moved && !ptr.hold && performance.now() - ptr.t0 > 280) {
    ptr.hold = true;
    controls.enabled = false; // 长按连射期间锁定视角
  }
  if (ptr.hold && time - lastShot > 0.14) requestShot();
  if (wantShot) {
    shotWait -= dt;
    if (time - lastShot >= 0.12) {
      snoutTip.getWorldPosition(_tip);
      snoutForward(_fwd);
      const want = _v2.copy(aim.target).sub(_tip).normalize();
      if (_fwd.dot(want) > 0.94 || shotWait <= 0) { fire(time); wantShot = false; }
    }
  }

  // —— 豌豆飞行与碰撞 ——
  for (let i = peas.length - 1; i >= 0; i--) {
    const p = peas[i], pos = p.mesh.position;
    p.life -= dt;
    p.v.y -= PEA_G * dt;
    pos.addScaledVector(p.v, dt);
    p.mesh.rotation.x += dt * 10;
    p.mesh.rotation.y += dt * 7;
    let dead = p.life <= 0;
    if (!dead) {
      for (const z of zombies) {
        if (z.alive && z.spawnT > 0.3 && pos.distanceTo(z.g.position) < ZOMBIE_R * z.g.scale.x + PEA_R) {
          hitZombie(z, pos, p.v);
          dead = true;
          break;
        }
      }
    }
    if (!dead && pos.y < GROUND_Y + PEA_R && Math.abs(pos.x) < LAWN_HALF && Math.abs(pos.z) < LAWN_HALF) {
      pos.y = GROUND_Y + PEA_R;
      splat(pos, 8, 1.4);
      sfx.splat();
      dead = true;
    }
    if (!dead && pos.y < -12) dead = true;
    if (dead) removePea(i);
  }

  // —— 僵尸 ——
  for (const z of zombies) {
    if (!z.alive) {
      z.respawn -= dt;
      if (z.respawn <= 0) spawnZombie(z);
      continue;
    }
    z.spawnT = Math.min(1, z.spawnT + dt * 1.6);
    z.rv += (-z.speed - z.rv) * (1 - Math.exp(-dt * 1.2));
    z.radius = Math.min(7, z.radius + z.rv * dt);
    z.angle += z.orbit * dt;
    const bob = Math.sin(time * 1.8 + z.ph) * 0.15;
    z.g.position.set(Math.cos(z.angle) * z.radius, z.y + bob, Math.sin(z.angle) * z.radius);
    if (z.radius < 1.5 && z.rv < 0) {
      // 僵尸撞上来：挂件被撞得乱晃，僵尸被弹开
      z.rv = 3.2;
      z.wob = 1;
      _v3.set(-Math.cos(z.angle), 0, -Math.sin(z.angle));
      applyImpulse(headWorld, _v3);
      face.scared = 1.6;
      sfx.bonk();
    }
    z.g.scale.setScalar(Math.max(0.001, easeOutBack(z.spawnT)));
    z.g.lookAt(headWorld);
    z.wob = Math.max(0, z.wob - dt * 2.5);
    z.inner.rotation.z = Math.sin(time * 2.3 + z.ph) * 0.12 + Math.sin(time * 30) * 0.2 * z.wob;
    z.inner.scale.set(1 + 0.15 * z.wob, 1 - 0.12 * z.wob, 1 + 0.15 * z.wob);
    z.flash = Math.max(0, z.flash - dt * 5);
    z.mat.emissiveIntensity = z.flash * 0.7;
  }

  // —— 表情与形变 ——
  face.nextBlink -= dt;
  if (face.nextBlink <= 0) { face.blinkT = 0.16; face.nextBlink = 2 + Math.random() * 3; }
  face.blinkT = Math.max(0, face.blinkT - dt);
  face.closeHold = Math.max(0, face.closeHold - dt);
  face.scared = Math.max(0, face.scared - dt);
  let open = face.closeHold > 0 ? 0.1 : face.blinkT > 0 ? Math.abs(face.blinkT - 0.08) / 0.08 : 1;
  open = Math.max(0.1, open);
  const big = 1 + Math.min(1, face.scared) * 0.22;
  for (const e of eyes) e.scale.set(big, open * big, 1);
  headInner.position.x = face.scared > 0 ? Math.sin(time * 60) * 0.014 * Math.min(1, face.scared) : 0;
  face.sqv += (-140 * face.sqx - 7 * face.sqv) * dt;
  face.sqx += face.sqv * dt;
  const sq = clamp(face.sqx, -0.35, 0.35);
  fireKick *= Math.exp(-dt * 9);
  const k = fireKick;
  headInner.scale.set(1 + sq * 0.5 + 0.04 * k, 1 - sq - 0.03 * k, 1 + sq * 0.5);
  headInner.position.z = -0.08 * k;
  snoutGroup.scale.set(1 + 0.3 * k, 1 + 0.3 * k, 1 - 0.28 * k);
  headGroup.position.y = HEAD_Y + Math.sin(time * 2.2) * 0.012;
  for (const l of leaves) l.g.rotation.z = l.base + Math.sin(time * 1.6 + l.ph) * 0.05 + clamp(phys.vx * 0.05, -0.1, 0.1);

  cloudRoot.rotation.y += dt * 0.01;
  updateDebris(dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
<script src="../prompt-panel.js" data-id="peashooter-kiro-opus"></script>
