<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:,">
<title>鹈鹕骑单车 · 阳光环形小路</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #cfe6f5;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; touch-action: none; outline: none; }
  .back {
    position: fixed; top: 14px; left: 14px; z-index: 20;
    padding: 7px 14px; border-radius: 999px;
    background: rgba(255, 247, 228, 0.78);
    color: #4b3a2a; font-size: 14px; text-decoration: none; letter-spacing: .5px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 3px 12px rgba(60, 40, 20, 0.15);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background .2s, transform .2s;
  }
  .back:hover { background: rgba(255, 247, 228, 0.95); transform: translateY(-1px); }
  .ui {
    position: fixed; top: 14px; right: 14px; z-index: 20;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  #followBtn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
    font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 1px;
    color: #2f4a44; background: rgba(255, 250, 238, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 4px 16px rgba(30, 60, 60, 0.18);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background .25s, color .25s, transform .15s, box-shadow .25s;
  }
  #followBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(30, 60, 60, 0.24); }
  #followBtn:active { transform: translateY(1px) scale(.98); }
  #followBtn .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #b9c4c0; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08);
    transition: background .25s, box-shadow .25s;
  }
  #followBtn.active { background: rgba(22, 150, 138, 0.92); color: #fff; border-color: rgba(255,255,255,.5); }
  #followBtn.active .dot { background: #ffd56a; box-shadow: 0 0 0 3px rgba(255, 213, 106, .35); }
  .speed {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(255, 250, 238, 0.72); color: #4b3a2a; font-size: 13px;
    border: 1px solid rgba(255,255,255,.7);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .speed input { width: 110px; accent-color: #16968a; }
  .hint {
    position: fixed; left: 14px; bottom: 14px; z-index: 10;
    padding: 6px 12px; border-radius: 999px; font-size: 12px; color: #3d4b40;
    background: rgba(255, 250, 238, 0.6);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    pointer-events: none; transition: opacity 1s;
  }
  @media (max-width: 600px) {
    .back { font-size: 13px; padding: 6px 12px; top: 10px; left: 10px; }
    .ui { top: 10px; right: 10px; }
    #followBtn { font-size: 14px; padding: 8px 13px; }
    .speed input { width: 84px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<a class="back" href="../">← 返回 3D 作品</a>
<div class="ui">
  <button id="followBtn" type="button" aria-pressed="false"><span class="dot"></span>镜头跟随</button>
  <label class="speed">速度 <input id="speed" type="range" min="0.3" max="2" step="0.05" value="1"></label>
</div>
<div class="hint" id="hint">拖动旋转 · 滚轮 / 双指缩放</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------ *
 *  基础工具
 * ------------------------------------------------------------------ */
const V3 = THREE.Vector3;
const v = (x, y, z) => new V3(x, y, z);
const UP = v(0, 1, 0);
const lerp = THREE.MathUtils.lerp;
const clamp = THREE.MathUtils.clamp;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
let seed = 20241020;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rand();

const isMobile = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 600;

/* ------------------------------------------------------------------ *
 *  渲染器 / 场景 / 相机
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const FOG_COLOR = 0xd6e9f4;
scene.fog = new THREE.Fog(FOG_COLOR, 70, 280);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 1200);
const OVERVIEW_POS = v(9, 8.5, 30);
const OVERVIEW_TARGET = v(0, 0.8, 3);
camera.position.copy(OVERVIEW_POS);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(OVERVIEW_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.485;
controls.minDistance = 2;
controls.maxDistance = 90;
controls.update();

/* ------------------------------------------------------------------ *
 *  天空（渐变 Shader）+ 环境光照贴图
 * ------------------------------------------------------------------ */
const SUN_DIR = v(0.5, 0.68, 0.38).normalize();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    sunDir: { value: SUN_DIR },
    cTop: { value: new THREE.Color(0x3f86d4) },
    cMid: { value: new THREE.Color(0x8fc4ec) },
    cHor: { value: new THREE.Color(FOG_COLOR) },
    cLow: { value: new THREE.Color(0x9fbf8a) }
  },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 sunDir, cTop, cMid, cHor, cLow;
    varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      float h = d.y;
      vec3 col = mix(cHor, cMid, smoothstep(0.0, 0.22, h));
      col = mix(col, cTop, smoothstep(0.22, 0.95, h));
      col = mix(col, cLow, smoothstep(0.0, -0.25, h));
      float s = max(dot(d, normalize(sunDir)), 0.0);
      col += vec3(1.0, 0.92, 0.75) * (pow(s, 900.0) * 4.0 + pow(s, 60.0) * 0.35 + pow(s, 6.0) * 0.12);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 48, 24), skyMat);
sky.frustumCulled = false;
sky.renderOrder = -10;
scene.add(sky);

{ // 用天空生成 PMREM 环境贴图，让金属/水面有真实的天空反射
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat));
  const g = new THREE.Mesh(new THREE.CircleGeometry(49, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x5f8f3c }));
  g.position.y = -3;
  envScene.add(g);
  scene.environment = pmrem.fromScene(envScene, 0.035).texture;
  pmrem.dispose();
}

/* ------------------------------------------------------------------ *
 *  灯光
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xd8ecff, 0x6b8f45, 0.45);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.7);
sun.position.copy(SUN_DIR).multiplyScalar(70);
sun.castShadow = true;
const SM = isMobile ? 2048 : 4096;
sun.shadow.mapSize.set(SM, SM);
Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 20, far: 150 });
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);

/* ------------------------------------------------------------------ *
 *  程序化贴图
 * ------------------------------------------------------------------ */
function canvasTexture(size, draw, repeat = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
// 可平铺绘制：靠近边缘的元素在对侧重复绘制
function wrapDraw(size, x, y, r, fn) {
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
    const px = x + dx * size, py = y + dy * size;
    if (px + r < 0 || px - r > size || py + r < 0 || py - r > size) continue;
    fn(px, py);
  }
}
const grassTex = canvasTexture(512, (g, S) => {
  g.fillStyle = '#6aa845'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 1400; i++) {
    const x = rr(0, S), y = rr(0, S), r = rr(6, 26);
    g.fillStyle = `hsla(${rr(78, 112)}, ${rr(35, 60)}%, ${rr(30, 52)}%, ${rr(0.08, 0.22)})`;
    wrapDraw(S, x, y, r, (px, py) => { g.beginPath(); g.arc(px, py, r, 0, TAU); g.fill(); });
  }
  g.lineCap = 'round';
  for (let i = 0; i < 9000; i++) {
    const x = rr(0, S), y = rr(0, S), l = rr(3, 8), a = rr(-0.6, 0.6) - Math.PI / 2;
    g.strokeStyle = `hsla(${rr(75, 115)}, ${rr(40, 70)}%, ${rr(26, 58)}%, ${rr(0.35, 0.8)})`;
    g.lineWidth = rr(0.8, 1.8);
    wrapDraw(S, x, y, l, (px, py) => {
      g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); g.stroke();
    });
  }
}, 110);
const pathTex = canvasTexture(512, (g, S) => {
  g.fillStyle = '#d7bf8d'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 900; i++) {
    const x = rr(0, S), y = rr(0, S), r = rr(8, 30);
    g.fillStyle = `hsla(${rr(30, 42)}, ${rr(30, 50)}%, ${rr(58, 78)}%, ${rr(0.1, 0.25)})`;
    wrapDraw(S, x, y, r, (px, py) => { g.beginPath(); g.arc(px, py, r, 0, TAU); g.fill(); });
  }
  for (let i = 0; i < 2600; i++) {
    const x = rr(0, S), y = rr(0, S), r = rr(0.8, 3.2);
    g.fillStyle = `hsla(${rr(20, 45)}, ${rr(5, 30)}%, ${rr(35, 85)}%, ${rr(0.5, 0.95)})`;
    wrapDraw(S, x, y, r, (px, py) => { g.beginPath(); g.ellipse(px, py, r, r * rr(0.6, 1), rr(0, 3), 0, TAU); g.fill(); });
  }
}, 13);

/* ------------------------------------------------------------------ *
 *  地形：平坦草地 + 远处起伏的山丘
 * ------------------------------------------------------------------ */
const PATH_R = 14;          // 环形路半径
const PATH_W = 2.5;         // 路宽
const POND = { x: -2.6, z: -1.8, r: 3.1 };

function terrainH(x, z) {
  const r = Math.hypot(x, z);
  const k = smooth(40, 105, r);
  if (k <= 0) return 0;
  const n = (Math.sin(x * 0.043) * Math.cos(z * 0.051) * 0.5 + 0.5) * 1.0
          + (Math.sin(x * 0.017 + z * 0.023 + 1.3) * 0.5 + 0.5) * 1.4
          + Math.sin(x * 0.09 - z * 0.07) * 0.18;
  return k * (n * 9 + 1.5);
}
{
  const geo = new THREE.PlaneGeometry(520, 520, 180, 180).rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  const col = new Float32Array(p.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const h = terrainH(x, z);
    p.setY(i, h);
    const n = Math.sin(x * 0.21 + Math.sin(z * 0.13) * 2) * 0.5 + Math.sin(z * 0.17 - x * 0.05) * 0.5;
    const r = Math.hypot(x, z);
    c.setHSL(0.26 + n * 0.02 - h * 0.0015, 0.5, 0.5 + n * 0.06 + h * 0.004);
    // 靠近小路处草色略带暖黄
    const nearPath = 1 - smooth(1.2, 3.2, Math.abs(r - PATH_R));
    c.lerp(new THREE.Color(0.75, 0.68, 0.42), nearPath * 0.25);
    const k = 1.9;
    col[i * 3] = c.r * k; col[i * 3 + 1] = c.g * k; col[i * 3 + 2] = c.b * k;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    map: grassTex, vertexColors: true, roughness: 0.96, metalness: 0
  }));
  ground.receiveShadow = true;
  scene.add(ground);
}

/* 环形小路 */
{
  const geo = new THREE.RingGeometry(PATH_R - PATH_W / 2, PATH_R + PATH_W / 2, 200, 4).rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  const col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const r = Math.hypot(p.getX(i), p.getZ(i));
    const t = Math.abs(r - PATH_R) / (PATH_W / 2);
    const k = 1.0 - 0.18 * t * t;
    col[i * 3] = k; col[i * 3 + 1] = k * 0.98; col[i * 3 + 2] = k * 0.95;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const path = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    map: pathTex, vertexColors: true, roughness: 0.92,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
  }));
  path.position.y = 0.012;
  path.receiveShadow = true;
  scene.add(path);

  // 路边石子
  const stoneGeo = new THREE.DodecahedronGeometry(1, 0);
  const stoneMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85, flatShading: true });
  const count = isMobile ? 260 : 420;
  const stones = new THREE.InstancedMesh(stoneGeo, stoneMat, count);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new V3(), pos = new V3(), e = new THREE.Euler(), c = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const side = i % 2 ? 1 : -1;
    const a = (i / count) * TAU + rr(-0.01, 0.01);
    const r = PATH_R + side * (PATH_W / 2 + rr(-0.05, 0.18));
    const sz = rr(0.06, 0.16);
    pos.set(Math.cos(a) * r, sz * 0.3, Math.sin(a) * r);
    e.set(rr(0, 3), rr(0, 3), rr(0, 3)); q.setFromEuler(e);
    s.set(sz * rr(1, 1.6), sz * rr(0.5, 0.8), sz * rr(0.9, 1.3));
    m.compose(pos, q, s);
    stones.setMatrixAt(i, m);
    c.setHSL(rr(0.07, 0.12), rr(0.05, 0.15), rr(0.55, 0.78));
    stones.setColorAt(i, c);
  }
  stones.receiveShadow = true;
  scene.add(stones);
}

/* ------------------------------------------------------------------ *
 *  池塘
 * ------------------------------------------------------------------ */
const timeU = { value: 0 };
{
  const shape = (scale) => {
    const g = new THREE.CircleGeometry(1, 64).rotateX(-Math.PI / 2);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i);
      const a = Math.atan2(z, x);
      const k = (1 + 0.12 * Math.sin(3 * a + 0.5) + 0.06 * Math.sin(5 * a + 1.7)) * scale;
      p.setX(i, x * k * 1.25); p.setZ(i, z * k);
    }
    return g;
  };
  const shore = new THREE.Mesh(shape(POND.r + 0.55), new THREE.MeshStandardMaterial({ color: 0xb59a6a, roughness: 1 }));
  shore.position.set(POND.x, 0.015, POND.z);
  shore.receiveShadow = true;
  const waterMat = new THREE.MeshStandardMaterial({
    color: 0x3b8fb6, roughness: 0.06, metalness: 0.25, transparent: true, opacity: 0.92
  });
  // 轻微的水面波纹（扰动法线）
  waterMat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = timeU;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nuniform float uTime;')
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
        {
          vec2 w = vWPos.xz;
          float nx = sin(w.x * 3.1 + uTime * 1.6) * 0.5 + sin(w.y * 4.3 - uTime * 1.2 + w.x) * 0.5;
          float nz = cos(w.y * 2.7 + uTime * 1.4) * 0.5 + cos(w.x * 3.9 + uTime * 1.1 - w.y) * 0.5;
          vec3 pn = normalize(vec3(nx * 0.06, 1.0, nz * 0.06));
          normal = normalize((viewMatrix * vec4(pn, 0.0)).xyz);
        }`);
  };
  const water = new THREE.Mesh(shape(POND.r), waterMat);
  water.position.set(POND.x, 0.035, POND.z);
  water.receiveShadow = true;
  scene.add(shore, water);

  // 睡莲叶
  const padMat = new THREE.MeshStandardMaterial({ color: 0x4f9a3a, roughness: 0.6, side: THREE.DoubleSide });
  const flowerMat = new THREE.MeshStandardMaterial({ color: 0xffc2d6, roughness: 0.6 });
  for (let i = 0; i < 9; i++) {
    const a = rr(0, TAU), r = rr(0.6, POND.r * 0.8);
    const pad = new THREE.Mesh(new THREE.CircleGeometry(rr(0.22, 0.38), 14, 0.25, TAU - 0.5).rotateX(-Math.PI / 2), padMat);
    pad.position.set(POND.x + Math.cos(a) * r * 1.2, 0.045, POND.z + Math.sin(a) * r * 0.9);
    pad.rotation.y = rr(0, TAU);
    pad.receiveShadow = true;
    scene.add(pad);
    if (i % 3 === 0) {
      const f = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.1, 7), flowerMat);
      f.position.copy(pad.position).add(v(0.05, 0.05, 0.03));
      f.rotation.x = Math.PI;
      scene.add(f);
    }
  }
  // 芦苇
  const reedMat = new THREE.MeshStandardMaterial({ color: 0x6f9a3c, roughness: 0.8 });
  const tailMat = new THREE.MeshStandardMaterial({ color: 0x6b4426, roughness: 0.9 });
  const reedGeo = new THREE.CylinderGeometry(0.012, 0.018, 1, 5).translate(0, 0.5, 0);
  const catGeo = new THREE.CapsuleGeometry(0.035, 0.16, 3, 6);
  for (let c = 0; c < 3; c++) {
    const a = 2.2 + c * 0.55;
    const cx = POND.x + Math.cos(a) * (POND.r + 0.1) * 1.25, cz = POND.z + Math.sin(a) * (POND.r + 0.1);
    for (let i = 0; i < 7; i++) {
      const h = rr(0.8, 1.4);
      const reed = new THREE.Mesh(reedGeo, reedMat);
      reed.scale.y = h;
      reed.position.set(cx + rr(-0.35, 0.35), 0, cz + rr(-0.35, 0.35));
      reed.rotation.set(rr(-0.12, 0.12), 0, rr(-0.12, 0.12));
      reed.castShadow = true;
      scene.add(reed);
      if (rand() > 0.35) {
        const ct = new THREE.Mesh(catGeo, tailMat);
        ct.position.y = h * 0.86;
        ct.scale.y = 1 / h;
        reed.add(ct);
      }
    }
  }
}

/* ------------------------------------------------------------------ *
 *  岩石、草丛、小花
 * ------------------------------------------------------------------ */
const isFree = (x, z, pad = 0) => {
  const r = Math.hypot(x, z);
  if (Math.abs(r - PATH_R) < PATH_W / 2 + 0.25 + pad) return false;
  const px = (x - POND.x) / 1.25, pz = z - POND.z;
  if (Math.hypot(px, pz) < POND.r + 0.9 + pad) return false;
  return true;
};
{
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x9a978f, roughness: 0.9, flatShading: true });
  const rockGeo = new THREE.DodecahedronGeometry(1, 0);
  const spots = [];
  for (let i = 0; i < 14; i++) { const a = rr(0, TAU); spots.push([POND.x + Math.cos(a) * (POND.r + 0.5) * 1.25, POND.z + Math.sin(a) * (POND.r + 0.5), rr(0.15, 0.4)]); }
  for (let i = 0; i < 16; i++) {
    const a = rr(0, TAU), r = rand() > 0.5 ? rr(4, 11) : rr(17.5, 34);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (isFree(x, z, 0.4)) spots.push([x, z, rr(0.2, 0.7)]);
  }
  for (const [x, z, s] of spots) {
    const rock = new THREE.Mesh(rockGeo, rockMat);
    rock.position.set(x, s * 0.25, z);
    rock.scale.set(s * rr(1, 1.5), s * rr(0.55, 0.85), s * rr(0.9, 1.3));
    rock.rotation.set(rr(0, 1), rr(0, TAU), rr(0, 1));
    rock.castShadow = rock.receiveShadow = true;
    scene.add(rock);
  }

  // 草丛（带随风摆动）
  const blades = [];
  for (let i = 0; i < 5; i++) {
    const b = new THREE.ConeGeometry(0.022, rr(0.2, 0.32), 3, 1).translate(0, 0.13, 0);
    b.rotateZ(rr(-0.35, 0.35)); b.rotateX(rr(-0.35, 0.35));
    b.translate(rr(-0.05, 0.05), 0, rr(-0.05, 0.05));
    blades.push(b);
  }
  const tuftGeo = mergeGeometries(blades);
  const tuftMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
  tuftMat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = timeU;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
      #else
        vec3 ip = vec3(0.0);
      #endif
      float sway = sin(uTime * 1.7 + ip.x * 0.35 + ip.z * 0.27) * 0.18 * position.y;
      transformed.x += sway; transformed.z += sway * 0.6;`);
  };
  const N = isMobile ? 1600 : 3200;
  const tufts = new THREE.InstancedMesh(tuftGeo, tuftMat, N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new V3(), pos = new V3(), c = new THREE.Color();
  let n = 0, guard = 0;
  while (n < N && guard++ < N * 6) {
    const a = rr(0, TAU);
    // 在小路边缘附近更密集
    const r = rand() < 0.35 ? PATH_R + (rand() > 0.5 ? 1 : -1) * (PATH_W / 2 + 0.2 + Math.abs(rr(0, 1) * rr(0, 1.8))) : Math.sqrt(rand()) * 40;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (!isFree(x, z, -0.1)) continue;
    const sc = rr(0.7, 1.5);
    pos.set(x, 0, z); q.setFromAxisAngle(UP, rr(0, TAU)); s.set(sc, sc * rr(0.8, 1.3), sc);
    m.compose(pos, q, s); tufts.setMatrixAt(n, m);
    c.setHSL(rr(0.22, 0.3), rr(0.45, 0.65), rr(0.32, 0.48)); tufts.setColorAt(n, c);
    n++;
  }
  tufts.count = n;
  tufts.receiveShadow = true;
  scene.add(tufts);

  // 小野花
  const FN = isMobile ? 260 : 460;
  const stemGeo = new THREE.CylinderGeometry(0.008, 0.01, 0.22, 4).translate(0, 0.11, 0);
  const headGeo = new THREE.IcosahedronGeometry(0.045, 0).translate(0, 0.23, 0);
  const stems = new THREE.InstancedMesh(stemGeo, new THREE.MeshStandardMaterial({ color: 0x4c8a2e, roughness: 0.9 }), FN);
  const heads = new THREE.InstancedMesh(headGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, flatShading: true }), FN);
  const palette = [0xffffff, 0xfff1a8, 0xffd23f, 0xff9ebb, 0xc9a7ff, 0xffffff, 0xff7b6b];
  n = 0; guard = 0;
  while (n < FN && guard++ < FN * 8) {
    const a = rr(0, TAU), r = Math.sqrt(rand()) * 34;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (!isFree(x, z, 0.1)) continue;
    const sc = rr(0.7, 1.3);
    pos.set(x, 0, z); q.setFromAxisAngle(UP, rr(0, TAU)); s.set(sc, sc, sc);
    m.compose(pos, q, s); stems.setMatrixAt(n, m); heads.setMatrixAt(n, m);
    c.setHex(palette[(rand() * palette.length) | 0]); heads.setColorAt(n, c);
    n++;
  }
  stems.count = heads.count = n;
  scene.add(stems, heads);
}

/* ------------------------------------------------------------------ *
 *  低多边形树
 * ------------------------------------------------------------------ */
const swayers = [];
{
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a5a36, roughness: 0.9, flatShading: true });
  const leafMats = [0x4e9a3a, 0x5fae45, 0x3f8a3a, 0x78b648, 0x5a9c2e].map(c =>
    new THREE.MeshStandardMaterial({ color: c, roughness: 0.82, flatShading: true }));
  const pickLeaf = () => leafMats[(rand() * leafMats.length) | 0];

  function pine(s) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12 * s, 0.2 * s, 1.3 * s, 6).translate(0, 0.65 * s, 0), trunkMat);
    g.add(trunk);
    const crown = new THREE.Group();
    const mat = pickLeaf();
    for (let i = 0; i < 3; i++) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry((1.35 - i * 0.33) * s, (1.7 - i * 0.2) * s, 7), mat);
      cone.position.y = (1.0 + i * 0.85) * s + 0.85 * s;
      cone.rotation.y = rr(0, 1);
      crown.add(cone);
    }
    g.add(crown);
    return { g, crown };
  }
  function roundTree(s) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14 * s, 0.22 * s, 1.8 * s, 6).translate(0, 0.9 * s, 0), trunkMat);
    g.add(trunk);
    const crown = new THREE.Group();
    const mat = pickLeaf();
    const main = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2 * s, 0), mat);
    main.position.y = 2.4 * s;
    crown.add(main);
    for (let i = 0; i < 3; i++) {
      const b = new THREE.Mesh(new THREE.IcosahedronGeometry(rr(0.55, 0.8) * s, 0), mat);
      const a = i / 3 * TAU + rr(0, 1);
      b.position.set(Math.cos(a) * 0.8 * s, rr(1.9, 2.8) * s, Math.sin(a) * 0.8 * s);
      b.rotation.set(rr(0, 3), rr(0, 3), 0);
      crown.add(b);
    }
    g.add(crown);
    return { g, crown };
  }
  function bush(s) {
    const g = new THREE.Group();
    const mat = pickLeaf();
    for (let i = 0; i < 3; i++) {
      const b = new THREE.Mesh(new THREE.IcosahedronGeometry(rr(0.35, 0.55) * s, 0), mat);
      b.position.set(rr(-0.4, 0.4) * s, 0.3 * s, rr(-0.4, 0.4) * s);
      b.scale.y = 0.8;
      g.add(b);
    }
    return { g, crown: null };
  }

  const placed = [];
  const tryPlace = (rMin, rMax, minGap, pad) => {
    for (let k = 0; k < 80; k++) {
      const a = rr(0, TAU), r = rr(rMin, rMax);
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (!isFree(x, z, pad)) continue;
      if (placed.some(p => Math.hypot(p[0] - x, p[1] - z) < minGap)) continue;
      placed.push([x, z]);
      return [x, z];
    }
    return null;
  };
  const add = (obj, x, z) => {
    obj.g.position.set(x, 0, z);
    obj.g.rotation.y = rr(0, TAU);
    obj.g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(obj.g);
    if (obj.crown) swayers.push({ o: obj.crown, ph: rr(0, TAU), amp: rr(0.012, 0.025) });
  };
  for (let i = 0; i < 6; i++) { const p = tryPlace(4.5, 10.2, 3.5, 1.4); if (p) add(rand() > 0.5 ? roundTree(rr(0.8, 1.1)) : pine(rr(0.8, 1.05)), p[0], p[1]); }
  for (let i = 0; i < 20; i++) { const p = tryPlace(18.5, 32, 3.6, 2.4); if (p) add(rand() > 0.45 ? pine(rr(0.9, 1.5)) : roundTree(rr(0.9, 1.4)), p[0], p[1]); }
  for (let i = 0; i < 14; i++) { const p = tryPlace(3, 32, 2.2, 0.8); if (p) add(bush(rr(0.8, 1.3)), p[0], p[1]); }

  // 远处山丘上的小树林（实例化）
  const coneG = new THREE.ConeGeometry(1.4, 3.6, 6).translate(0, 3.4, 0);
  const trunkG = new THREE.CylinderGeometry(0.2, 0.3, 1.7, 5).translate(0, 0.85, 0);
  const paint = (g, hex) => {
    const c = new THREE.Color(hex), n = g.attributes.position.count, a = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(a, 3));
    return g;
  };
  const farGeo = mergeGeometries([paint(coneG, 0x4d8f3a), paint(trunkG, 0x7a5230)]);
  const FT = isMobile ? 120 : 220;
  const far = new THREE.InstancedMesh(farGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, flatShading: true }), FT);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new V3(), pos = new V3(), c = new THREE.Color();
  for (let i = 0; i < FT; i++) {
    const a = rr(0, TAU), r = rr(42, 150);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const sc = rr(0.8, 1.8);
    pos.set(x, terrainH(x, z) - 0.2, z); q.setFromAxisAngle(UP, rr(0, TAU)); s.set(sc, sc * rr(0.9, 1.3), sc);
    m.compose(pos, q, s); far.setMatrixAt(i, m);
    c.setHSL(0, 0, rr(0.75, 1.15)); far.setColorAt(i, c);
  }
  scene.add(far);
}

const clouds = [];

/* ------------------------------------------------------------------ *
 *  自行车
 *  局部坐标：+X 前进方向，+Y 向上，+Z 骑手右侧（链条一侧）
 * ------------------------------------------------------------------ */
const WHEEL_R = 0.363;
const REAR = v(-0.56, WHEEL_R, 0);
const FRONT = v(0.6, WHEEL_R, 0);
const BB = v(0, 0.3, 0);                    // 中轴
const ST_TOP = v(-0.16, 0.76, 0);
const HT_TOP = v(0.44, 0.86, 0);
const STEER_DIR = new V3().subVectors(FRONT, HT_TOP).normalize();   // 沿前叉向下
const HT_BOT = HT_TOP.clone().addScaledVector(STEER_DIR, 0.15);
const SEAT_DIR = new V3().subVectors(ST_TOP, BB).normalize();
const POST_TOP = ST_TOP.clone().addScaledVector(SEAT_DIR, 0.11);
const SADDLE_TOP = v(POST_TOP.x - 0.01, POST_TOP.y + 0.05, 0);
const RING_R = 0.11, COG_R = 0.05;          // 牙盘 / 飞轮节圆半径
const GEAR = COG_R / RING_R;                // 曲柄转角 = 车轮转角 * GEAR
const CRANK_R = 0.16, CHAIN_Z = 0.1, PEDAL_Z = 0.205;

const M = {
  frame: new THREE.MeshStandardMaterial({ color: 0x149b8f, metalness: 0.35, roughness: 0.32 }),
  cream: new THREE.MeshStandardMaterial({ color: 0xf4ead2, metalness: 0.1, roughness: 0.45 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xe6e9ee, metalness: 1.0, roughness: 0.2 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x2c2f35, metalness: 0.6, roughness: 0.45 }),
  tire: new THREE.MeshStandardMaterial({ color: 0x1e1e20, roughness: 0.92 }),
  gum: new THREE.MeshStandardMaterial({ color: 0xc89a62, roughness: 0.8 }),
  leather: new THREE.MeshStandardMaterial({ color: 0x7b4a2a, roughness: 0.55 }),
  wicker: new THREE.MeshStandardMaterial({ color: 0xc89455, roughness: 0.85 }),
  red: new THREE.MeshStandardMaterial({ color: 0xe0442e, roughness: 0.3, metalness: 0.1 })
};
// 编织篮纹理
M.wicker.map = canvasTexture(128, (g, S) => {
  g.fillStyle = '#c38c4c'; g.fillRect(0, 0, S, S);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const off = (y % 2) * 8;
    g.fillStyle = (x + y) % 2 ? '#d9a868' : '#b07a3e';
    g.fillRect(x * 16 + off - 8, y * 16 + 2, 14, 12);
  }
}, 1);
M.wicker.map.repeat.set(4, 1);

function cylBetweenGeo(a, b, r, seg = 8, r2 = r) {
  const d = new V3().subVectors(b, a);
  const len = d.length();
  const g = new THREE.CylinderGeometry(r2, r, len, seg, 1);
  const q = new THREE.Quaternion().setFromUnitVectors(UP, d.normalize());
  g.applyMatrix4(new THREE.Matrix4().compose(a.clone().addScaledVector(d, len * 0.5), q, v(1, 1, 1)));
  return g;
}
const tube = (a, b, r, mat, seg = 12) => new THREE.Mesh(cylBetweenGeo(a, b, r, seg), mat);
const ball = (p, r, mat) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat); m.position.copy(p); return m; };

const bikeRoot = new THREE.Group();     // 世界位置 + 朝向
const leanGroup = new THREE.Group();    // 转弯侧倾
const bike = new THREE.Group();         // 自行车局部坐标系
bikeRoot.add(leanGroup); leanGroup.add(bike);
scene.add(bikeRoot);

function makeWheel(withCog) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.TorusGeometry(0.335, 0.028, 12, 72), M.tire));
  const wall = new THREE.Mesh(new THREE.TorusGeometry(0.318, 0.02, 8, 72), M.gum);
  g.add(wall);
  g.add(new THREE.Mesh(new THREE.TorusGeometry(0.305, 0.011, 8, 72), M.chrome));
  const spokes = [];
  const NS = 24;
  for (let i = 0; i < NS; i++) {
    const a = i / NS * TAU;
    const side = i % 2 ? 1 : -1;
    const ha = a + side * 0.35;
    spokes.push(cylBetweenGeo(v(Math.cos(ha) * 0.032, Math.sin(ha) * 0.032, side * 0.032), v(Math.cos(a) * 0.3, Math.sin(a) * 0.3, 0), 0.0028, 4));
  }
  g.add(new THREE.Mesh(mergeGeometries(spokes), M.chrome));
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.09, 14).rotateX(Math.PI / 2), M.chrome);
  g.add(hub);
  for (const s of [-1, 1]) {
    const fl = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.008, 18).rotateX(Math.PI / 2), M.chrome);
    fl.position.z = s * 0.034; g.add(fl);
  }
  const valve = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.04, 6), M.chrome);
  valve.position.set(0, 0.29, 0); g.add(valve);
  if (withCog) {
    const parts = [new THREE.CylinderGeometry(COG_R - 0.004, COG_R - 0.004, 0.007, 24).rotateX(Math.PI / 2)];
    const teeth = 16;
    for (let i = 0; i < teeth; i++) {
      const a = i / teeth * TAU;
      const t = new THREE.BoxGeometry(0.009, 0.012, 0.006);
      t.rotateZ(a - Math.PI / 2); t.translate(Math.cos(a) * COG_R, Math.sin(a) * COG_R, 0);
      parts.push(t);
    }
    const cog = new THREE.Mesh(mergeGeometries(parts), M.dark);
    cog.position.z = CHAIN_Z;
    g.add(cog);
    const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.22, 8).rotateX(Math.PI / 2), M.chrome);
    g.add(axle);
  }
  return g;
}

/* 车架 */
{
  const F = M.frame;
  const tubes = [
    [ST_TOP, HT_TOP, 0.022], [BB, HT_BOT, 0.026], [BB, ST_TOP, 0.023],
    [HT_TOP.clone().addScaledVector(STEER_DIR, -0.02), HT_BOT.clone().addScaledVector(STEER_DIR, 0.02), 0.03]
  ];
  for (const [a, b, r] of tubes) bike.add(tube(a, b, r, F));
  for (const s of [-1, 1]) {
    bike.add(tube(v(BB.x - 0.02, BB.y, s * 0.035), v(REAR.x, REAR.y, s * 0.065), 0.012, F, 8));
    bike.add(tube(v(ST_TOP.x + 0.01, ST_TOP.y - 0.03, s * 0.025), v(REAR.x, REAR.y, s * 0.065), 0.011, F, 8));
    bike.add(ball(v(REAR.x, REAR.y, s * 0.065), 0.016, F));
  }
  bike.add(ball(ST_TOP, 0.026, F), ball(HT_TOP, 0.031, F), ball(HT_BOT, 0.031, F));
  const shell = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.09, 16).rotateX(Math.PI / 2), F);
  shell.position.copy(BB); bike.add(shell);
  // 座管 + 鞍座
  bike.add(tube(ST_TOP, POST_TOP, 0.015, M.chrome));
  const sg = new THREE.SphereGeometry(1, 24, 14);
  const sp = sg.attributes.position;
  for (let i = 0; i < sp.count; i++) {
    const x = sp.getX(i), y = sp.getY(i), z = sp.getZ(i);
    const w = 0.42 + 0.58 * smooth(0.7, -0.5, x);
    sp.setXYZ(i, x * 0.15, (y > 0 ? y : y * 0.6) * 0.035, z * 0.1 * w);
  }
  sg.computeVertexNormals();
  const saddle = new THREE.Mesh(sg, M.leather);
  saddle.position.set(POST_TOP.x - 0.01, POST_TOP.y + 0.018, 0);
  bike.add(saddle);
  for (const s of [-1, 1]) {
    const spring = new THREE.Mesh(new THREE.TorusGeometry(0.014, 0.004, 6, 12).rotateY(Math.PI / 2), M.chrome);
    spring.position.set(POST_TOP.x - 0.09, POST_TOP.y + 0.0, s * 0.04);
    spring.scale.set(1, 1.4, 1);
    bike.add(spring);
  }
  // 后挡泥板 + 尾灯
  const rf = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.016, 6, 40, 2.05), M.cream);
  rf.position.copy(REAR); rf.rotation.z = 1.25; rf.scale.z = 3.0;
  bike.add(rf);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.035, 0.05), M.red);
  tail.position.set(REAR.x - 0.385, REAR.y + 0.14, 0); tail.rotation.z = -0.35;
  bike.add(tail);
  // 链罩下方的支撑小件
  const kick = tube(v(BB.x - 0.08, BB.y - 0.02, -0.07), v(BB.x - 0.2, 0.02, -0.16), 0.008, M.chrome, 6);
  bike.add(kick);
}

/* 后轮 */
const rearWheel = makeWheel(true);
rearWheel.position.copy(REAR);
bike.add(rearWheel);

/* 转向组：前叉、前轮、车把、车篮 */
const steer = new THREE.Group();
steer.position.copy(HT_TOP);
bike.add(steer);
const STEER_AXIS = STEER_DIR.clone().negate();
const L = (p) => p.clone().sub(HT_TOP);   // 转向组局部坐标
const BAR_PTS = [
  v(0.355, 0.99, -0.3), v(0.415, 0.985, -0.225), v(0.462, 0.958, -0.11), v(0.47, 0.952, 0),
  v(0.462, 0.958, 0.11), v(0.415, 0.985, 0.225), v(0.355, 0.99, 0.3)
];
const GRIP_R = v(0.385, 0.988, 0.265), GRIP_L = v(0.385, 0.988, -0.265);
const frontWheel = makeWheel(false);
{
  const crown = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.03, 0.14), M.frame);
  crown.position.copy(L(HT_BOT)).addScaledVector(STEER_DIR, 0.02);
  crown.rotation.z = Math.atan2(STEER_DIR.y, STEER_DIR.x) + Math.PI / 2;
  steer.add(crown);
  for (const s of [-1, 1]) {
    const a = L(HT_BOT).addScaledVector(STEER_DIR, 0.02); a.z = s * 0.058;
    const b = L(FRONT); b.z = s * 0.058;
    steer.add(tube(a, b, 0.014, M.frame, 8));
  }
  frontWheel.position.copy(L(FRONT));
  steer.add(frontWheel);
  // 立管 + 车把
  const stemTop = STEER_DIR.clone().multiplyScalar(-0.085);
  steer.add(tube(v(0, 0, 0), stemTop, 0.017, M.chrome));
  steer.add(tube(stemTop, L(BAR_PTS[3]), 0.016, M.chrome));
  steer.add(ball(stemTop, 0.019, M.chrome));
  const barCurve = new THREE.CatmullRomCurve3(BAR_PTS.map(L));
  steer.add(new THREE.Mesh(new THREE.TubeGeometry(barCurve, 40, 0.012, 8, false), M.chrome));
  for (const gp of [GRIP_R, GRIP_L]) {

const chainPath = (() => {
  const C1 = new THREE.Vector2(BB.x, BB.y), C2 = new THREE.Vector2(REAR.x, REAR.y);
  const D = C1.distanceTo(C2);
  const u = C2.clone().sub(C1).divideScalar(D);
  const n = new THREE.Vector2(-u.y, u.x);
  const s = (RING_R - COG_R) / D, c = Math.sqrt(1 - s * s);
  const mA = u.clone().multiplyScalar(-s).addScaledVector(n, c);
  const mB = u.clone().multiplyScalar(-s).addScaledVector(n, -c);
  const mTop = mA.y > mB.y ? mA : mB, mBot = mA.y > mB.y ? mB : mA;
  const pts = [];
  const md = (x) => ((x % TAU) + TAU) % TAU;
  const arc = (C, r, from, to, via, segs) => {
    const a0 = Math.atan2(from.y, from.x), a1 = Math.atan2(to.y, to.x), av = Math.atan2(via.y, via.x);
    let delta = md(a1 - a0);
    if (md(av - a0) > delta) delta -= TAU;
    for (let i = 1; i < segs; i++) {
      const a = a0 + delta * i / segs;
      pts.push(new THREE.Vector2(C.x + Math.cos(a) * r, C.y + Math.sin(a) * r));
    }
  };
  pts.push(C1.clone().addScaledVector(mTop, RING_R), C2.clone().addScaledVector(mTop, COG_R));
  arc(C2, COG_R, mTop, mBot, u, 18);
  pts.push(C2.clone().addScaledVector(mBot, COG_R), C1.clone().addScaledVector(mBot, RING_R));
  arc(C1, RING_R, mBot, mTop, u.clone().negate(), 30);
  const cum = [0];
  for (let i = 1; i <= pts.length; i++) cum.push(cum[i - 1] + pts[i % pts.length].distanceTo(pts[i - 1]));
  const total = cum[pts.length];
  return {
    total,
    at(sv, outP) { // 返回角度，写入位置
      sv = ((sv % total) + total) % total;
      let lo = 0, hi = pts.length;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= sv) lo = mid; else hi = mid; }
      const a = pts[lo], b = pts[(lo + 1) % pts.length];
      const t = (sv - cum[lo]) / (cum[lo + 1] - cum[lo]);
      outP.set(lerp(a.x, b.x, t), lerp(a.y, b.y, t), CHAIN_Z);
      return Math.atan2(b.y - a.y, b.x - a.x);
    }
  };
})();

const _d = new V3(), _n = new V3(), _bx = new V3(), _by = new V3(), _bz = new V3(), _m4 = new THREE.Matrix4();
function solveIK(A, T, L1, L2, pole, outMid) {
  _d.subVectors(T, A);
  const dist = clamp(_d.length(), Math.abs(L1 - L2) + 1e-3, (L1 + L2) * 0.9995);
  _d.normalize();
  const cosA = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
  const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
  _n.copy(pole).addScaledVector(_d, -pole.dot(_d)).normalize();
  outMid.copy(A).addScaledVector(_d, L1 * cosA).addScaledVector(_n, L1 * sinA);
}
function pointSeg(mesh, A, B) {
  mesh.position.copy(A);
  _by.subVectors(B, A).normalize();
  mesh.quaternion.setFromUnitVectors(UP, _by);
}
// 扁平段：Y 沿段方向，X 朝向 ref（如向下），Z 为法线
function orientFlat(obj, A, B, ref) {
  _by.subVectors(B, A).normalize();
  _bx.copy(ref).addScaledVector(_by, -ref.dot(_by)).normalize();
  _bz.crossVectors(_bx, _by);
  _m4.makeBasis(_bx, _by, _bz);
  obj.quaternion.setFromRotationMatrix(_m4);
  obj.position.copy(A);
}

  const a = -this.k * (this.x - target) - this.c * this.v + force;
  this.v += a * dt; this.x += this.v * dt; return this.x;
} });

let nextBump = 3, nextSquawk = 5, squawkT = -1;
let yaw = 0;
const pedalPos = [new V3(), new V3()];
const hip = new V3(), kneeP = new V3(), ankleP = new V3(), shoulderP = new V3(), elbowP = new V3(), wristP = new V3();
const gripTmp = new V3(), linkP = new V3(), heelOff = new V3();
const KNEE_POLE = [v(1, 0.35, -0.3), v(1, 0.35, 0.3)];
const ELBOW_POLE = [v(-0.35, -0.6, -0.8), v(-0.35, -0.6, 0.8)];
const DOWN = v(0, -1, 0);
const linkM = new THREE.Matrix4(), linkQ = new THREE.Quaternion(), linkS = v(1, 1, 1), ZA = v(0, 0, 1);
const easeInOut = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  elapsed += dt;
  timeU.value = elapsed;

  /* --- 行进 --- */
  const speed = BASE_SPEED * speedMul;
  distTravel += speed * dt;
  const psi = distTravel / PATH_R;
  bikeRoot.position.set(Math.cos(psi) * PATH_R, 0.012, -Math.sin(psi) * PATH_R);
  yaw = psi + Math.PI / 2;
  bikeRoot.rotation.y = yaw;

  const wheelAng = distTravel / WHEEL_R;
  const crankAng = wheelAng * GEAR;
  const cadence = speed / WHEEL_R * GEAR;    // 曲柄角速度
  rearWheel.rotation.z = -wheelAng;
  frontWheel.rotation.z = -wheelAng;
  crank.rotation.z = -crankAng;

  // 转弯侧倾 + 转向（随踩踏轻微摆动）
  const lean = Math.atan(speed * speed / (9.81 * PATH_R));
  leanGroup.rotation.x = -lean + Math.sin(crankAng) * 0.012 * speedMul;
  const steerAng = Math.atan(1.16 / PATH_R) + Math.sin(crankAng + 0.6) * 0.022;
  steer.quaternion.setFromAxisAngle(STEER_AXIS, steerAng);
  steer.updateMatrix();

  // 链条
  const travel = crankAng * RING_R;
  for (let i = 0; i < LINKS; i++) {
    const ang = chainPath.at(i * LINK_SP - travel, linkP);
    linkQ.setFromAxisAngle(ZA, ang);
    linkS.set(1, 1, i % 2 ? 1 : 0.7);
    linkM.compose(linkP, linkQ, linkS);
    chain.setMatrixAt(i, linkM);
  }
  chain.instanceMatrix.needsUpdate = true;

  /* --- 随机颠簸、鸣叫 --- */
  let bumpForce = 0;
  if (elapsed > nextBump) { nextBump = elapsed + rr(2.2, 5.5); bumpForce = 1; joltS.v -= 0.5 * speedMul; pouchS.v += 2.4 * speedMul; headS.v += 1.6; pouchSway.v += rr(-1.5, 1.5); }
  if (elapsed > nextSquawk) { nextSquawk = elapsed + rr(5, 10); squawkT = 0; }
  joltS.step(0, 0, dt);

  /* --- 躯干起伏 --- */
  const bobA = 0.014 * Math.min(1.4, speedMul + 0.2);
  torso.position.set(0.004 * Math.sin(crankAng * 2), bobA * (0.5 + 0.5 * Math.cos(crankAng * 2)) + joltS.x * 0.6, 0);
  torso.rotation.set(0.045 * Math.sin(crankAng), 0.03 * Math.sin(crankAng), 0.02 * Math.cos(crankAng * 2) + joltS.x * 0.4);
  torso.updateMatrix();
  const bodyAcc = -bobA * 0.5 * 4 * cadence * cadence * Math.cos(crankAng * 2);

  // 头部（弹簧滞后）+ 东张西望
  const nod = headS.step(0.05 * Math.sin(crankAng * 2 - 0.9), -bodyAcc * 2.2, dt);
  head.rotation.set(
    0.05 * Math.sin(crankAng) + 0.08 * Math.sin(elapsed * 0.37),
    0.22 * Math.sin(elapsed * 0.31) * Math.sin(elapsed * 0.13 + 1),
    -nod - 0.03
  );
  // 下颌：平时微张，偶尔张大嘴
  let jawTarget = 0.03 + 0.025 * Math.max(0, Math.sin(elapsed * 1.3)) ** 4;
  if (squawkT >= 0) {
    squawkT += dt;
    jawTarget += 0.38 * Math.sin(Math.min(1, squawkT / 0.9) * Math.PI) * (0.75 + 0.25 * Math.sin(squawkT * 30));
    if (squawkT > 0.9) squawkT = -1;
  }
  jaw.rotation.z = -Math.max(0, jawS.step(jawTarget, 0, dt));
  // 喉囊：受身体加速度、颠簸驱动的阻尼弹簧
  const pz = pouchS.step(0, -bodyAcc * 2.5 + nod * 3, dt);
  pouch.scale.set(1 - pz * 0.15, clamp(1 + pz, 0.6, 1.6), 1 - pz * 0.25);
  const sway = pouchSway.step(0, -Math.cos(crankAng) * cadence * 0.35 - torso.rotation.x * 8, dt);
  pouch.rotation.x = clamp(sway * 0.25, -0.5, 0.5);

  /* --- 脚踏 + 腿 --- */
  const aR = -crankAng;
  for (let i = 0; i < 2; i++) {
    const s = i === 0 ? 1 : -1;            // 0: 右  1: 左
    const a = aR + (s > 0 ? 0 : Math.PI);
    const pp = pedalPos[i].set(BB.x + Math.cos(a) * CRANK_R, BB.y + Math.sin(a) * CRANK_R, s * PEDAL_Z);
    const ankling = 0.16 * Math.sin(a + 0.5) - 0.05;
    const ped = pedals[i];
    ped.position.copy(pp);
    ped.rotation.z = ankling;
    const leg = legs[s > 0 ? 1 : 0];
    leg.foot.position.copy(pp);
    leg.foot.rotation.z = ankling;
    // 踝关节位置 = 脚踏 + 旋转后的偏移
    heelOff.set(-0.065, 0.065, 0).applyAxisAngle(ZA, ankling);
    ankleP.copy(pp).add(heelOff);
    hip.copy(leg.local).applyMatrix4(torso.matrix).add(SADDLE_TOP);
    solveIK(hip, ankleP, LEG_L1, LEG_L2, KNEE_POLE[s > 0 ? 1 : 0], kneeP);
    pointSeg(leg.thigh, hip, kneeP);
    pointSeg(leg.shin, kneeP, ankleP);
    leg.knee.position.copy(kneeP);
    leg.ankle.position.copy(ankleP);
  }

  /* --- 翅膀握把 --- */
  for (const w of wings) {
    const si = w.s > 0 ? 1 : 0;
    shoulderP.copy(w.local).applyMatrix4(torso.matrix).add(SADDLE_TOP);
    gripTmp.copy(w.s > 0 ? GRIP_R : GRIP_L).sub(HT_TOP).applyMatrix4(steer.matrix);
    wristP.copy(gripTmp).add(v(0.005, 0.03, 0));
    solveIK(shoulderP, wristP, WING_L1, WING_L2, ELBOW_POLE[si], elbowP);
    orientFlat(w.upper, shoulderP, elbowP, DOWN);
    orientFlat(w.fore, elbowP, wristP, DOWN);
    w.shoulder.position.copy(shoulderP);
    w.shoulder.quaternion.copy(w.upper.quaternion);
    w.elbow.position.copy(elbowP);
    orientFlat(w.hand, wristP, _d.copy(wristP).sub(elbowP).add(wristP), DOWN);
  }

  /* --- 环境动画 --- */
  for (const t of swayers) {
    t.o.rotation.z = Math.sin(elapsed * 0.9 + t.ph) * t.amp;
    t.o.rotation.x = Math.cos(elapsed * 0.7 + t.ph) * t.amp * 0.7;
  }
  cloudRoot.rotation.y += dt * 0.004;
  for (const c of clouds) c.g.position.y = c.y + Math.sin(elapsed * 0.15 + c.ph) * 1.2;

  /* --- 摄像机 --- */
  if (trans) {
    trans.t = Math.min(1, trans.t + dt / trans.dur);
    const k = easeInOut(trans.t);
    if (follow) {
      tmpTarget.set(bikeRoot.position.x, 1.05, bikeRoot.position.z);
      tmpPos.copy(FOLLOW_OFF).applyAxisAngle(UP, yaw).add(tmpTarget);
    } else {
      tmpPos.copy(OVERVIEW_POS); tmpTarget.copy(OVERVIEW_TARGET);
    }
    camera.position.lerpVectors(trans.fromPos, tmpPos, k);
    controls.target.lerpVectors(trans.fromTarget, tmpTarget, k);
    camera.lookAt(controls.target);
    if (trans.t >= 1) { trans = null; controls.enabled = true; }
  } else if (follow) {
    const dy = yaw - prevYaw;
    tmpOff.subVectors(camera.position, controls.target).applyAxisAngle(UP, dy);
    controls.target.set(bikeRoot.position.x, 1.05, bikeRoot.position.z);
    camera.position.copy(controls.target).add(tmpOff);
    controls.update();
  } else {
    controls.update();
  }
  prevYaw = yaw;

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

/* 自适应 */
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 0.8 ? 55 : 42;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
}
window.addEventListener('resize', onResize);
onResize();
</script>
<script src="../prompt-panel.js" data-id="pelican-opus"></script>
</body>
</html>
