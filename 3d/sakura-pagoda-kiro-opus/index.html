<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= 基础工具 ================= */
// 可复现的伪随机数
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261021);
const rr = (a, b) => a + (b - a) * rand();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = arr => arr[Math.floor(rand() * arr.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// 整数哈希 + 值噪声
function hash3(x, y, z) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1440662683);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c = (a, b, d) => hash3(xi + a, yi + b, zi + d);
  const x00 = lerp(c(0, 0, 0), c(1, 0, 0), u), x10 = lerp(c(0, 1, 0), c(1, 1, 0), u);
  const x01 = lerp(c(0, 0, 1), c(1, 0, 1), u), x11 = lerp(c(0, 1, 1), c(1, 1, 1), u);
  return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w) * 2 - 1;
}
function fbm2(x, z) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let o = 0; o < 4; o++) { s += a * noise3(x * f + o * 31.7, o * 7.3, z * f - o * 13.1); n += a; a *= 0.5; f *= 2.07; }
  return s / n;
}

// 颜色亮度抖动，让体素色块更丰富
const _jc = new THREE.Color();
function jit(hex, amt = 0.07) {
  _jc.setHex(hex);
  const f = 1 + (rand() - 0.5) * 2 * amt;
  _jc.r = Math.min(1, _jc.r * f); _jc.g = Math.min(1, _jc.g * f); _jc.b = Math.min(1, _jc.b * f);
  return _jc.getHex();
}

/* ================= 体素容器 ================= */
const K = (x, y, z) => ((x + 512) * 1024 + (y + 512)) * 1024 + (z + 512);
const XZ = (x, z) => (x + 512) * 1024 + (z + 512);
class VoxMap {
  constructor() { this.s = new Map(); this.g = new Map(); this.w = new Set(); }
  set(x, y, z, c) { const k = K(Math.round(x), Math.round(y), Math.round(z)); this.s.set(k, c); this.g.delete(k); this.w.delete(k); }
  setJ(x, y, z, c, a = 0.07) { this.set(x, y, z, jit(c, a)); }
  glow(x, y, z, c) { const k = K(Math.round(x), Math.round(y), Math.round(z)); this.g.set(k, c); this.s.delete(k); this.w.delete(k); }
  water(x, y, z) { const k = K(Math.round(x), Math.round(y), Math.round(z)); if (!this.s.has(k) && !this.g.has(k)) this.w.add(k); }
  del(x, y, z) { const k = K(Math.round(x), Math.round(y), Math.round(z)); this.s.delete(k); this.g.delete(k); this.w.delete(k); }
  solid(x, y, z) { const k = K(x, y, z); return this.s.has(k) || this.g.has(k); }
  empty(x, y, z) { const k = K(Math.round(x), Math.round(y), Math.round(z)); return !this.s.has(k) && !this.g.has(k) && !this.w.has(k); }
}

/* ================= 面剔除 + 体素 AO 网格生成 ================= */
const AX = [[0, 1, 2], [1, 2, 0], [2, 0, 1]];
const CORN = [[0, 0], [1, 0], [1, 1], [0, 1]];
const AO_F = [0.42, 0.62, 0.82, 1];
const _cc = new THREE.Color();
function buildGeo(src, cull, occ) {
  const isMap = src instanceof Map;
  const pos = [], nor = [], col = [], idx = [];
  const p = [0, 0, 0], q = [0, 0, 0], aov = [0, 0, 0, 0];
  let vi = 0;
  for (const e of src) {
    const k = isMap ? e[0] : e;
    _cc.setHex(isMap ? e[1] : 0xffffff);
    const z = (k % 1024) - 512, t = Math.floor(k / 1024), y = (t % 1024) - 512, x = Math.floor(t / 1024) - 512;
    for (let a = 0; a < 3; a++) {
      const u = AX[a][1], v = AX[a][2];
      for (let si = 0; si < 2; si++) {
        const s = si === 0 ? 1 : -1;
        p[0] = x; p[1] = y; p[2] = z; p[a] += s;
        if (cull(p[0], p[1], p[2])) continue;
        for (let j = 0; j < 4; j++) {
          const cj = s > 0 ? j : (4 - j) % 4;
          const cu = CORN[cj][0], cv = CORN[cj][1];
          q[0] = x - 0.5; q[1] = y - 0.5; q[2] = z - 0.5;
          q[a] += s > 0 ? 1 : 0; q[u] += cu; q[v] += cv;
          pos.push(q[0], q[1], q[2]);
          nor.push(a === 0 ? s : 0, a === 1 ? s : 0, a === 2 ? s : 0);
          let ao = 3;
          if (occ) {
            const du = cu ? 1 : -1, dv = cv ? 1 : -1;
            p[u] += du; const s1 = occ(p[0], p[1], p[2]);
            p[v] += dv; const cr = occ(p[0], p[1], p[2]);
            p[u] -= du; const s2 = occ(p[0], p[1], p[2]);
            p[v] -= dv;
            ao = (s1 && s2) ? 0 : 3 - ((s1 ? 1 : 0) + (s2 ? 1 : 0) + (cr ? 1 : 0));
          }
          aov[j] = ao;
          const f = AO_F[ao];
          col.push(_cc.r * f, _cc.g * f, _cc.b * f);
        }
        // 根据 AO 选择对角线，避免明暗插值出现折痕
        if (aov[0] + aov[2] < aov[1] + aov[3]) idx.push(vi + 1, vi + 2, vi + 3, vi + 1, vi + 3, vi);
        else idx.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
        vi += 4;
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeBoundingSphere();
  return g;
}

/* ================= 渲染器 / 场景 / 相机 ================= */
const isMobile = Math.min(window.innerWidth, window.innerHeight) < 700;
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffd9e6, 130, 360);
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 1200);
camera.position.set(62, 44, 74);
if (camera.aspect < 0.8) camera.position.multiplyScalar(1.55);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 22;
controls.maxDistance = 240;
controls.maxPolarAngle = Math.PI * 0.78;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.screenSpacePanning = true;

// 灯光
const DAY_SUN = new THREE.Vector3(55, 80, 38);
const NIGHT_SUN = new THREE.Vector3(-48, 70, -30);
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6);
sun.position.copy(DAY_SUN);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 240 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
scene.add(sun);
const hemi = new THREE.HemisphereLight(0xd6ecff, 0x7a6a50, 0.95);
scene.add(hemi);

// 材质
const solidMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.88, metalness: 0 });
const glowMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5, emissive: 0xffffff, emissiveIntensity: 0.35 });
// 自发光颜色跟随顶点色
glowMat.onBeforeCompile = sh => {
  sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>',
    '#include <emissivemap_fragment>\n\ttotalEmissiveRadiance *= vColor.rgb;');
};
const waterU = { value: 0 };
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x48b4d8, transparent: true, opacity: 0.74, roughness: 0.12, metalness: 0.05, depthWrite: false
});
waterMat.onBeforeCompile = sh => {
  sh.uniforms.uTime = waterU;
  sh.vertexShader = 'uniform float uTime;\nvarying vec3 vWP;\nvarying float vNy;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
    vNy = normal.y;
    if (normal.y > 0.5) {
      transformed.y += sin(position.x * 0.9 + uTime * 1.6) * 0.035 + cos(position.z * 0.8 + uTime * 1.3) * 0.035;
    }
    vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;`);
  sh.fragmentShader = 'uniform float uTime;\nvarying vec3 vWP;\nvarying float vNy;\n' + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
    float side = 1.0 - abs(vNy);
    float st = smoothstep(0.55, 1.0, sin(vWP.y * 2.6 + uTime * 9.0 + sin(vWP.z * 4.0) * 1.5) * 0.5 + 0.5);
    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.92, 0.98, 1.0), side * (0.35 + st * 0.5));
    float cs = sin(vWP.x * 1.3 + uTime * 0.9) * sin(vWP.z * 1.1 - uTime * 1.1);
    diffuseColor.rgb += max(vNy, 0.0) * 0.08 * cs;
    diffuseColor.a = mix(diffuseColor.a, 0.88, side);`);
};

// 体素地图转网格
function voxMeshes(vm, opts = {}) {
  const g = new THREE.Group();
  const occ = (x, y, z) => vm.solid(x, y, z);
  if (vm.s.size) {
    const m = new THREE.Mesh(buildGeo(vm.s, occ, occ), opts.mat || solidMat);
    m.castShadow = opts.cast !== false; m.receiveShadow = true;
    g.add(m);
  }
  if (vm.g.size) g.add(new THREE.Mesh(buildGeo(vm.g, occ, null), glowMat));
  if (vm.w.size) {
    const wc = (x, y, z) => occ(x, y, z) || vm.w.has(K(x, y, z));
    const m = new THREE.Mesh(buildGeo(vm.w, wc, null), waterMat);
    m.receiveShadow = true; m.renderOrder = 2;
    g.add(m);
  }
  return g;
}

// 小尺寸装饰（花、草、荷叶、风铃）统一用实例化方块
const thin = [];
function addThin(x, y, z, sx, sy, sz, color, ry = 0) { thin.push({ x, y, z, sx, sy, sz, color, ry }); }

/* ================= 布局常量 ================= */
const world = new VoxMap();
const PX = 4, PZ = -8;                                // 宝塔中心
const POND = { x: -10, z: 8, rx: 7.5, rz: 6 };        // 锦鲤池
const pondE = (x, z) => ((x - POND.x) / POND.rx) ** 2 + ((z - POND.z) / POND.rz) ** 2;
const BRIDGE = { x0: -11, x1: -9, z0: 0, z1: 16 };
const deckY = z => 1 + Math.round(3 * Math.sin(Math.PI * (z - BRIDGE.z0) / (BRIDGE.z1 - BRIDGE.z0)));
const ZEN = { x0: 13, x1: 22, z0: -17, z1: -8 };
const ZEN_ROCKS = [{ x: 16, z: -12, r: 2.1 }, { x: 20, z: -10, r: 1.4 }, { x: 18, z: -15, r: 1.6 }];
const BAMBOO = { x: 4, z: -22, r: 5.5 };

const PAL = {
  pink:  { c: [0xffb7d0, 0xffc4da, 0xffa6c6, 0xf9a0c0, 0xffd3e3], dark: 0xe57aa3, hi: 0xffe8f0 },
  deep:  { c: [0xff8fb8, 0xf77fac, 0xff9ec3, 0xe96d9e, 0xffb0cc], dark: 0xc9507f, hi: 0xffc9dc },
  white: { c: [0xfff6f9, 0xffeef3, 0xffe2ec, 0xffffff], dark: 0xe8c4d2, hi: 0xffffff },
  light: { c: [0xffd6e5, 0xffe3ed, 0xffc8dc, 0xffdbe8], dark: 0xf0a5c3, hi: 0xfff2f7 }
};
const TREES = [
  { x: 16, z: 6, h: 9, r: 6, pal: 'pink', weep: true },
  { x: -3, z: 21, h: 7, r: 4.6, pal: 'pink' },
  { x: 15, z: 19, h: 8, r: 5, pal: 'deep' },
  { x: -21, z: -8, h: 7, r: 4.5, pal: 'white' },
  { x: -8, z: -19, h: 8, r: 5, pal: 'light' },
  { x: 22, z: -3, h: 6, r: 4, pal: 'deep' },
  { x: -17, z: 19, h: 6, r: 4.2, pal: 'light', weep: true }
];

const GRASS = [0x5aa838, 0x66b43c, 0x74bf44, 0x82c74e, 0x91d15a];
const DIRT = [0x8b5e34, 0x7d532e, 0x96683b];
const STONE = [0x8a8178, 0x7b736b, 0x958c80, 0x6e6760];
const PEBBLE = [0x9a9a92, 0x85857e, 0xb0aca2, 0xa39d90];
const WOOD = [0x5b3a29, 0x4a2f22, 0x6b4632];

/* ================= 岛屿地形 ================= */
function edgeR(x, z) {
  const a = Math.atan2(z, x);
  return 27.5 + 1.5 * Math.sin(a * 3 + 0.7) + 1.0 * Math.sin(a * 5 + 2.1) + fbm2(x * 0.08, z * 0.08) * 1.8;
}
const inCliff = (x, z) => x >= -23 && x <= -18 && z >= 3 && z <= 12;
const inChannel = (x, z) => x >= -22 && x <= -18 && z >= 6 && z <= 9;
const inMainPath = (x, z) => x >= 2 && x <= 6 && z >= 1 && z <= 29;
const inPath = (x, z) => inMainPath(x, z) || (z >= 16 && z <= 17 && x >= -11 && x <= 1) || (z >= -1 && z <= 0 && x >= -11 && x <= -4);
const inPlat = (x, z) => Math.abs(x - PX) <= 7 && Math.abs(z - PZ) <= 7;
const inZen = (x, z) => x >= ZEN.x0 && x <= ZEN.x1 && z >= ZEN.z0 && z <= ZEN.z1;
const inBamboo = (x, z) => Math.hypot(x - BAMBOO.x, z - BAMBOO.z) < BAMBOO.r;
const hillH = (x, z) => 6 * smoothstep(13, 2, Math.hypot(x + 17, z + 15)) + fbm2(x * 0.2, z * 0.2) * 0.8;

const topMap = new Map();     // 每列顶面高度
const cellType = new Map();   // 每列地表类型

for (let x = -33; x <= 33; x++) for (let z = -33; z <= 33; z++) {
  const d = Math.hypot(x, z), er = edgeR(x, z);
  if (d > er) continue;
  const inner = 1 - d / er;
  const nb = fbm2(x * 0.15 + 9, z * 0.15 - 4);
  const bottom = -Math.round(2 + Math.pow(inner, 0.8) * 16 + nb * 3);
  const e = pondE(x, z);
  const xz = XZ(x, z);

  // 地下：泥土 + 岩层
  const strata = (y, h) => {
    if (y >= h - 3) return pick(DIRT);
    if (y <= bottom + 1) return 0x5f5650;
    const n = noise3(x * 0.3, y * 0.5, z * 0.3);
    return STONE[((Math.floor((y + n * 2.5) / 2) % 4) + 4) % 4];
  };

  // 锦鲤池：挖出池底并灌水
  if (e < 1 && !inCliff(x, z)) {
    const floor = -2 - Math.round((1 - e) * 2.5);
    for (let y = bottom; y <= floor; y++) {
      world.setJ(x, y, z, y === floor ? (hash3(x, 3, z) < 0.5 ? 0xc9b98a : pick(PEBBLE)) : strata(y, floor), 0.06);
    }
    for (let y = floor + 1; y <= -1; y++) world.water(x, y, z);
    topMap.set(xz, -1); cellType.set(xz, 'pond');
    continue;
  }

  let h = Math.max(0, Math.round(hillH(x, z)));
  let type = h > 0 ? 'hill' : 'grass';
  if (inCliff(x, z)) {
    h = 8 + Math.floor((noise3(x * 0.4, 1.3, z * 0.4) * 0.5 + 0.5) * 3) + (x === -23 ? 2 : 0);
    if (inChannel(x, z)) h = 7;
    type = 'cliff';
  } else if (inPath(x, z)) type = 'path';
  else if (inPlat(x, z)) type = 'plat';
  else if (inZen(x, z)) type = 'zen';
  else if (e < 1.45) type = 'ring';
  else if (inBamboo(x, z)) type = 'bamboo';
  if (type !== 'hill' && type !== 'cliff') h = 0;

  for (let y = bottom; y < h; y++) {
    if (type === 'cliff') world.setJ(x, y, z, y >= h - 1 ? 0x6a6560 : STONE[((y + ri(0, 1)) % 4 + 4) % 4], 0.06);
    else world.setJ(x, y, z, y === h - 1 && h > 0 ? 0x5b9a3c : strata(y, h), 0.06);
  }

  // 顶面着色

    const d = Math.hypot(x, z), er = r + noise3(x * 0.4 + seed, 2, z * 0.4) * 1.1;
    if (d > er) continue;
    const inner = 1 - d / er;
    const bot = -Math.round(1 + inner * depth + noise3(x * 0.5, seed, z * 0.5) * 1.5);
    for (let y = bot; y <= 0; y++) vm.setJ(x, y, z, y === 0 ? pick(GRASS) : y >= -2 ? pick(DIRT) : pick(STONE), 0.07);

  return vm;
}

const clock = new THREE.Clock();
let wind = 0;
applyNight(0, 0);
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  night += (nightTarget - night) * Math.min(1, dt * 1.8);
  applyNight(night, t);
  waterU.value = t;

  // 阵风：花吹雪
  gust = Math.max(0, gust - dt);
  const wTarget = gust > 0 ? 1 : 0;
  wind += (wTarget - wind) * Math.min(1, dt * 1.5);
  petalActive += ((gust > 0 ? PETAL_MAX : PETAL_BASE) - petalActive) * Math.min(1, dt * 2);
  updatePetals(dt, t, wind);
  updateFalls(dt, t);

  // 锦鲤
  for (const k of koi) {
    const a = k.ph + t * k.sp;
    const x = POND.x + Math.cos(a) * k.ax, z = POND.z + Math.sin(a) * k.az;
    const tx = -Math.sin(a) * k.ax * Math.sign(k.sp), tz = Math.cos(a) * k.az * Math.sign(k.sp);
    k.g.position.set(x, k.y + Math.sin(t * 1.3 + k.ph) * 0.05, z);
    k.g.rotation.y = Math.atan2(tx, tz);
    k.tailP.rotation.y = Math.sin(t * 7 + k.ph) * 0.45;
  }
  // 蝴蝶
  for (const b of butterflies) {
    const a = b.ph + t * b.sp;
    const x = b.cx + Math.sin(a) * b.rx, z = b.cz + Math.sin(a * 2 + 1) * b.rz * 0.6;
    const y = Math.max(0, topOf(x, z) ?? 0) + b.y + Math.sin(t * 2.3 + b.ph) * 0.6;
    _pv.set(b.cx + Math.sin(a + 0.05) * b.rx, y, b.cz + Math.sin(a * 2 + 1.1) * b.rz * 0.6);
    b.g.position.set(x, y, z);
    b.g.lookAt(_pv);
    const f = Math.sin(t * 16 + b.ph) * 0.9;
    b.wR.rotation.z = f; b.wL.rotation.z = -f;
    b.g.visible = night < 0.7;
  }
  // 萤火虫
  for (let i = 0; i < FF_N; i++) {
    const f = ffBase[i], a = t * f.sp + f.ph;
    ffPos[i * 3] = f.x + Math.sin(a) * 1.6;
    ffPos[i * 3 + 1] = f.y + Math.sin(a * 1.7) * 0.8;
    ffPos[i * 3 + 2] = f.z + Math.cos(a * 1.3) * 1.6;
  }
  ffGeo.attributes.position.needsUpdate = true;
  fireflies.visible = night > 0.05;

  // 浮岛与云
  for (const s of islets) {
    s.g.position.y = s.y + Math.sin(t * 0.6 + s.ph) * 0.8;
    s.g.rotation.y = Math.sin(t * 0.15 + s.ph) * 0.2;
  }
  cloudGroup.rotation.y += dt * 0.012;
  for (const c of clouds) c.g.position.y = c.y + Math.sin(t * 0.4 + c.ph) * 0.6;

  controls.update();
  // 限制平移范围，避免场景跑出视野
  if (controls.target.length() > 35) controls.target.setLength(35);
  composer.render();
}
renderer.setAnimationLoop(tick);

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const pr = Math.min(window.devicePixelRatio, 2);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h);
  composer.setPixelRatio(pr);
  composer.setSize(w, h);
});
</script>
