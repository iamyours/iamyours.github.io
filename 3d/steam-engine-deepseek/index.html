<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>3D 蒸汽机工作原理原型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0b0f12;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  }
  #c { display: block; width: 100%; height: 100%; outline: none; }

  .back-link {
    position: fixed; top: 16px; left: 16px; z-index: 20;
    display: inline-flex; align-items: center;
    padding: 9px 15px;
    border-radius: 999px;
    background: rgba(245, 236, 215, 0.82);
    color: #2a2118;
    font-size: 13px; font-weight: 500; line-height: 1;
    text-decoration: none;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.35);
    transition: background .2s ease, transform .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .back-link:hover { background: rgba(245, 236, 215, 0.98); transform: translateY(-1px); }
  .back-link:active { transform: translateY(0); }

  .hud {
    position: fixed; right: 16px; bottom: 16px; z-index: 20;
    display: flex; flex-direction: column; gap: 9px;
    min-width: 196px;
    padding: 13px 15px;
    border-radius: 15px;
    background: rgba(18, 24, 28, 0.72);
    border: 1px solid rgba(245, 236, 215, 0.14);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    color: #e8e2d4;
    font-size: 12px; line-height: 1.4;
    -webkit-user-select: none; user-select: none;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }
  .hud .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hud .label { color: rgba(232, 226, 212, 0.72); letter-spacing: .04em; }
  .hud .val {
    font-variant-numeric: tabular-nums;
    color: #f0c674; font-weight: 600;
    min-width: 42px; text-align: right;
  }
  .hud input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 108px; height: 3px; border-radius: 3px;
    background: rgba(245, 236, 215, 0.22);
    outline: none; cursor: pointer;
  }
  .hud input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #f5ecd7; cursor: pointer;
    box-shadow: 0 0 0 4px rgba(245, 236, 215, 0.12);
  }
  .hud input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border: none; border-radius: 50%;
    background: #f5ecd7; cursor: pointer;
    box-shadow: 0 0 0 4px rgba(245, 236, 215, 0.12);
  }
  .hud .hint {
    font-size: 11px;
    color: rgba(232, 226, 212, 0.38);
    letter-spacing: .02em;
  }
  @media (max-width: 620px) {
    .hud { min-width: 0; padding: 10px 12px; font-size: 11px; border-radius: 13px; }
    .hud input[type="range"] { width: 84px; }
    .hud .hint { display: none; }
    .back-link { top: 12px; left: 12px; padding: 8px 13px; font-size: 12px; }
  }
</style>
<style>/* 避开右下角「📜 提示词」按钮 */.hud{bottom:76px}</style>
</head>
<body>

<a class="back-link" href="../">← 返回 3D 作品</a>

<canvas id="c"></canvas>

<div class="hud">
  <div class="row">
    <span class="label">曲轴转速</span>
    <input id="speed" type="range" min="0" max="2.5" step="0.01" value="1" aria-label="曲轴转速" />
    <span class="val" id="speedVal">1.00</span>
  </div>
  <div class="hint">拖动旋转 · 滚轮 / 双指缩放</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================
   全局参数（机构尺寸，单位：米）
   ========================================================= */
const AXIS_Y   = 1.60;   // 主轴线高度
const CRANK_X  = 3.20;   // 曲轴中心 X
const CRANK_R  = 0.35;   // 曲柄半径（行程 0.70）
const CONROD_L = 1.80;   // 连杆长度
const ROD_LEN  = 1.40;   // 活塞中心 → 十字头中心距离

/* =========================================================
   渲染器
   ========================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;

/* =========================================================
   场景 / 相机 / 控制
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f12);
scene.fog = new THREE.FogExp2(0x0b0f12, 0.028);

const camera = new THREE.PerspectiveCamera(
  42,
  window.innerWidth / window.innerHeight,
  0.1,
  200
);
camera.position.set(5.2, 4.3, 7.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.25, 1.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.9;
controls.panSpeed = 0.7;
controls.minDistance = 2.6;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minPolarAngle = 0.12;
controls.update();

/* =========================================================
   环境光照（程序化 RoomEnvironment，无外部资源）
   ========================================================= */
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new RoomEnvironment();
scene.environment = pmrem.fromScene(envScene, 0.04).texture;
pmrem.dispose();

/* =========================================================
   灯光
   ========================================================= */
const hemi = new THREE.HemisphereLight(0x9fc3e0, 0x2a2018, 0.5);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff2e0, 2.35);
keyLight.position.set(6.8, 9.5, 6.6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 32;
keyLight.shadow.bias = -0.0007;
keyLight.shadow.normalBias = 0.022;
keyLight.target.position.set(1.25, 1.1, 0);
scene.add(keyLight);
scene.add(keyLight.target);

const rimLight = new THREE.DirectionalLight(0x7fb4ff, 1.15);
rimLight.position.set(-7, 4.5, -6);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffd7a0, 0.55);
fillLight.position.set(-3.5, 2.2, 7);
scene.add(fillLight);

/* =========================================================
   程序化贴图
   ========================================================= */
function makeWoodTexture() {
  const S = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');

  ctx.fillStyle = '#3a2b1e';
  ctx.fillRect(0, 0, S, S);

  const rows = 8;
  const plankH = S / rows;

  for (let row = 0; row < rows; row++) {
    const y = row * plankH;
    const l = 21 + Math.random() * 9;
    const h = 26 + Math.random() * 9;
    const s = 24 + Math.random() * 10;
    ctx.fillStyle = `hsl(${h}, ${s}%, ${l}%)`;
    ctx.fillRect(0, y, S, plankH - 3);

    // 木纹
    for (let i = 0; i < 38; i++) {
      ctx.beginPath();
      ctx.strokeStyle = `rgba(28, 17, 9, ${0.03 + Math.random() * 0.065})`;
      ctx.lineWidth = 0.6 + Math.random() * 1.7;
      const gy = y + Math.random() * plankH;
      ctx.moveTo(0, gy);
      for (let x = 0; x <= S; x += 22) {
        ctx.lineTo(
          x,
          gy + Math.sin(x * 0.021 + i * 1.7) * 1.8 + (Math.random() - 0.5) * 2.4
        );
      }
      ctx.stroke();
    }

    // 木结
    if (Math.random() > 0.58) {
      const kx = Math.random() * S;
      const ky = y + plankH * (0.28 + Math.random() * 0.44);
      const grad = ctx.createRadialGradient(kx, ky, 1, kx, ky, 11);
      grad.addColorStop(0, 'rgba(24, 13, 6, 0.6)');
      grad.addColorStop(1, 'rgba(24, 13, 6, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(kx, ky, 15, 7, Math.random() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }

    // 横向接缝
    ctx.fillStyle = 'rgba(10, 6, 3, 0.55)';
    ctx.fillRect(0, y + plankH - 3, S, 3);

    // 纵向接缝（错缝）
    const off = ((row % 2) * (S / 2) + Math.random() * 45) % S;
    ctx.fillStyle = 'rgba(10, 6, 3, 0.42)';
    ctx.fillRect(off, y, 2, plankH - 3);
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(9, 9);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeSmokeTexture() {
  const S = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.42)');
  g.addColorStop(0.72, 'rgba(255,255,255,0.10)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* =========================================================
   地面
   ========================================================= */
const floorTex = makeWoodTexture();
const floorMat = new THREE.MeshStandardMaterial({
  map: floorTex,
  color: 0xffffff,
  roughness: 0.78,
  metalness: 0.06
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

/* =========================================================
   材质
   ========================================================= */
const matIron = new THREE.MeshStandardMaterial({
  color: 0x4b5a63, metalness: 0.92, roughness: 0.52
});
const matDarkIron = new THREE.MeshStandardMaterial({
  color: 0x232c33, metalness: 0.85, roughness: 0.62
});
const matSteel = new THREE.MeshStandardMaterial({
  color: 0xc2cbd2, metalness: 1.0, roughness: 0.24
});
const matBrass = new THREE.MeshStandardMaterial({
  color: 0xc9a13c, metalness: 1.0, roughness: 0.28
});
const matCopper = new THREE.MeshStandardMaterial({
  color: 0xa9613a, metalness: 1.0, roughness: 0.36
});
const matPaint = new THREE.MeshStandardMaterial({
  color: 0x2c5b4e, metalness: 0.55, roughness: 0.62
});
const matCap = new THREE.MeshStandardMaterial({
  color: 0x3a464e, metalness: 0.9, roughness: 0.5,
  side: THREE.DoubleSide
});

/* =========================================================
   工具函数
   ========================================================= */
const machine = new THREE.Group();
scene.add(machine);

function mesh(geo, mat, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  (parent || machine).add(m);
  return m;
}

const _UP = new THREE.Vector3(0, 1, 0);
const _dir = new THREE.Vector3();

function placeBar(obj, a, b) {
  _dir.subVectors(b, a);
  const len = _dir.length();
  if (len < 1e-6) return;
  obj.position.copy(a).addScaledVector(_dir, 0.5);
  const nd = _dir.clone().divideScalar(len);
  obj.quaternion.setFromUnitVectors(_UP, nd);
  obj.scale.set(1, len, 1);
}

const parts = {};

/* =========================================================
   底座
   ========================================================= */
{
  const plinth = mesh(new THREE.BoxGeometry(6.65, 0.14, 2.35), matDarkIron);
  plinth.position.set(1.2, 0.07, 0);

  const base = mesh(new THREE.BoxGeometry(5.95, 0.32, 1.92), matPaint);
  base.position.set(1.35, 0.30, 0);          // 顶面 y = 0.46

  const trim = mesh(new THREE.BoxGeometry(6.02, 0.05, 1.98), matBrass);
  trim.position.set(1.35, 0.455, 0);

  // 地脚螺栓
  const boltGeo = new THREE.CylinderGeometry(0.055, 0.055, 0.1, 10);
  const boltPositions = [
    [-1.35, 0.72], [-1.35, -0.72],
    [4.05, 0.72], [4.05, -0.72]
  ];
  for (const [bx, bz] of boltPositions) {
    const bolt = mesh(boltGeo, matBrass);
    bolt.position.set(bx, 0.505, bz);
  }
}

/* =========================================================
   汽缸鞍座
   ========================================================= */
{
  const saddle = mesh(new THREE.BoxGeometry(1.55, 0.72, 1.12), matPaint);
  saddle.position.set(0, 0.82, 0);           // 0.46 → 1.18

  const saddleTop = mesh(new THREE.BoxGeometry(1.62, 0.06, 1.18), matDarkIron);
  saddleTop.position.set(0, 1.19, 0);
}

/* =========================================================
   汽缸（带纵向剖口，便于观察活塞）
   ========================================================= */
{
  const CYL_R = 0.47;
  const CYL_LEN = 1.2;

  // 开口：正面（+Z）方向 90° 剖口
  const cylGeo = new THREE.CylinderGeometry(
    CYL_R, CYL_R, CYL_LEN,
    80, 1, true,
    0.25 * Math.PI, 1.5 * Math.PI
  );
  const cylinder = mesh(cylGeo, new THREE.MeshStandardMaterial({
    color: 0x2c5b4e, metalness: 0.88, roughness: 0.38,
    side: THREE.DoubleSide
  }));
  cylinder.rotation.z = -Math.PI / 2;
  cylinder.position.set(0, AXIS_Y, 0);

  // 加强箍
  const bandGeo = new THREE.TorusGeometry(CYL_R + 0.012, 0.032, 8, 48);
  for (const bx of [-0.42, 0, 0.42]) {
    const band = mesh(bandGeo, matIron);
    band.position.set(bx, AXIS_Y, 0);
  }

  // 两端盖板
  const capPts = [
    new THREE.Vector2(0.062, 0.00),
    new THREE.Vector2(CYL_R, 0.00),
    new THREE.Vector2(CYL_R, 0.09),
    new THREE.Vector2(0.062, 0.09),
    new THREE.Vector2(0.062, 0.00)
  ];
  const capGeo = new THREE.LatheGeometry(capPts, 48);

  const capR = mesh(capGeo, matCap);
  capR.rotation.z = -Math.PI / 2;
  capR.position.set(0.55, AXIS_Y, 0);

  const capL = mesh(capGeo, matCap);
  capL.rotation.z = -Math.PI / 2;
  capL.position.set(-0.64, AXIS_Y, 0);

  // 端盖螺栓
  const studGeo = new THREE.CylinderGeometry(0.024, 0.024, 0.14, 8);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    for (const cx of [0.60, -0.60]) {
      const s = mesh(studGeo, matBrass);
      s.rotation.z = -Math.PI / 2;
      s.position.set(cx, AXIS_Y + Math.cos(a) * 0.40, Math.sin(a) * 0.40);
    }
  }
}

/* =========================================================
   活塞 / 活塞杆
   ========================================================= */
{
  parts.piston = mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.16, 48), matBrass);
  parts.piston.rotation.z = -Math.PI / 2;

  // 活塞环
  const ringGeo = new THREE.TorusGeometry(0.452, 0.016, 8, 44);
  for (const rx of [-0.045, 0.045]) {
    const r = mesh(ringGeo, matDarkIron, parts.piston);
    r.rotation.y = Math.PI / 2;
    r.position.x = rx;
  }

  parts.rod = mesh(new THREE.CylinderGeometry(0.055, 0.055, 1, 16), matSteel);
}

/* =========================================================
   十字头与导轨
   ========================================================= */
{
  parts.crosshead = mesh(new THREE.BoxGeometry(0.36, 0.32, 0.36), matSteel);
  parts.crosshead.position.set(1.40, AXIS_Y, 0);

  // 十字头销
  const pin = mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.44, 16), matBrass, parts.crosshead);
  pin.rotation.x = Math.PI / 2;

  // 两侧滑轨
  const railGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.42, 16);
  for (const s of [-1, 1]) {
    const rail = mesh(railGeo, matSteel);
    rail.rotation.z = Math.PI / 2;
    rail.position.set(1.36, AXIS_Y, s * 0.245);
  }

  // 导轨支架
  const brace = mesh(new THREE.BoxGeometry(0.18, 1.10, 0.70), matPaint);
  brace.position.set(0.78, 1.01, 0);

  const braceTop = mesh(new THREE.BoxGeometry(0.30, 0.08, 0.72), matIron);
  braceTop.position.set(0.78, 1.53, 0);
}

/* =========================================================
   连杆
   ========================================================= */
{
  parts.conrod = mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 16), matSteel);
  parts.bigEnd = mesh(new THREE.TorusGeometry(0.088, 0.046, 10, 26), matBrass);
  parts.smallEnd = mesh(new THREE.TorusGeometry(0.076, 0.040, 10, 26), matBrass);
}

/* =========================================================
   曲柄组
   ========================================================= */
{
  parts.crank = new THREE.Group();
  parts.crank.position.set(CRANK_X, AXIS_Y, 0);
  machine.add(parts.crank);

  // 曲柄臂
  const armGeo = new THREE.BoxGeometry(0.56, 0.26, 0.09);
  for (const s of [-1, 1]) {
    const arm = mesh(armGeo, matIron, parts.crank);
    arm.position.set(0.175, 0, s * 0.11);
  }

  // 曲柄轴套
  const crankHub = mesh(new THREE.CylinderGeometry(0.165, 0.165, 0.36, 28), matIron, parts.crank);
  crankHub.rotation.x = Math.PI / 2;

  // 曲柄销
  const crankPin = mesh(new THREE.CylinderGeometry(0.068, 0.068, 0.32, 22), matSteel, parts.crank);
  crankPin.rotation.x = Math.PI / 2;
  crankPin.position.set(CRANK_R, 0, 0);

  // 配重块
  const cw = mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.16, 24, 1, false, 0, Math.PI), matDarkIron, parts.crank);
  cw.rotation.x = Math.PI / 2;
  cw.rotation.z = Math.PI;
  cw.position.set(-0.16, 0, 0);
}

/* =========================================================
   飞轮
   ========================================================= */
{
  parts.flywheel = new THREE.Group();
  parts.flywheel.position.set(CRANK_X, AXIS_Y, -0.82);
  machine.add(parts.flywheel);

  // 轮缘
  const rim = mesh(new THREE.TorusGeometry(0.90, 0.10, 14, 80), matIron, parts.flywheel);
  rim.scale.z = 1.35;

  // 轮毂
  const hub = mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.40, 32), matIron, parts.flywheel);
  hub.rotation.x = Math.PI / 2;

  const hubRing = mesh(new THREE.TorusGeometry(0.192, 0.028, 8, 32), matBrass, parts.flywheel);

  // 辐条
  const spokeGeo = new THREE.CylinderGeometry(0.042, 0.062, 0.70, 10);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const sp = mesh(spokeGeo, matIron, parts.flywheel);
    sp.position.set(Math.cos(a) * 0.52, Math.sin(a) * 0.52, 0);
    sp.rotation.z = a - Math.PI / 2;
  }
}

/* =========================================================
   主轴与轴承座
   ========================================================= */
{
  const shaft = mesh(new THREE.CylinderGeometry(0.085, 0.085, 2.05, 24), matSteel);
  shaft.rotation.x = Math.PI / 2;
  shaft.position.set(CRANK_X, AXIS_Y, -0.05);

  const pedGeo = new THREE.BoxGeometry(0.50, 1.10, 0.24);
  const capGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.28, 22);

  for (const z of [-0.40, 0.50]) {
    const ped = mesh(pedGeo, matPaint);
    ped.position.set(CRANK_X, 1.01, z);      // 0.46 → 1.56

    const cap = mesh(capGeo, matBrass);
    cap.rotation.x = Math.PI / 2;
    cap.position.set(CRANK_X, AXIS_Y, z);
  }
}

/* =========================================================
   蒸汽管（程序化 TubeGeometry）
   ========================================================= */
let EMIT = new THREE.Vector3(-0.10, AXIS_Y + 1.00, 0.55);
{
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.00, AXIS_Y + 0.34, 0.00),
    new THREE.Vector3(0.00, AXIS_Y + 0.74, 0.00),
    new THREE.Vector3(-0.04, AXIS_Y + 0.94, 0.24),
    new THREE.Vector3(-0.10, AXIS_Y + 1.00, 0.55)
  ]);
  const tube = mesh(new THREE.TubeGeometry(curve, 44, 0.062, 14, false), matCopper);
  tube.castShadow = true;

  // 管口法兰
  const flange = mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.05, 20), matBrass);
  flange.position.copy(EMIT);
  flange.rotation.x = Math.PI / 2.1;

  // 汽缸顶部接口
  const nozzle = mesh(new THREE.CylinderGeometry(0.10, 0.13, 0.16, 20), matBrass);
  nozzle.position.set(0, AXIS_Y + 0.41, 0);
}

/* =========================================================
   蒸汽粒子系统（自定义 Shader，逐粒子 alpha）
   ========================================================= */
const STEAM_N = 90;
const steamGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(STEAM_N * 3);
const sLife = new Float32Array(STEAM_N);
const sSize = new Float32Array(STEAM_N);
const sVel = [];

for (let i = 0; i < STEAM_N; i++) {
  sLife[i] = Math.random();
  sSize[i] = 0.6 + Math.random() * 0.7;
  sVel.push(new THREE.Vector3(0, 0, 0));
  sPos[i * 3] = EMIT.x;
  sPos[i * 3 + 1] = EMIT.y;
  sPos[i * 3 + 2] = EMIT.z;
}

steamGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
steamGeo.setAttribute('aLife', new THREE.BufferAttribute(sLife, 1));
steamGeo.setAttribute('aSize', new THREE.BufferAttribute(sSize, 1));

const smokeTex = makeSmokeTexture();

const steamMat = new THREE.ShaderMaterial({
  uniforms: { uTex: { value: smokeTex } },
  vertexShader: `
    attribute float aLife;
    attribute float aSize;
    varying float vLife;
    void main() {
      vLife = aLife;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = max(-mv.z, 0.1);
      gl_PointSize = aSize * (210.0 / dist) * (1.0 + (1.0 - aLife) * 1.7);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uTex;
    varying float vLife;
    void main() {
      vec4 t = texture2D(uTex, gl_PointCoord);
      float a = t.a * smoothstep(0.0, 0.35, vLife) * 0.42;
      if (a < 0.004) discard;
      gl_FragColor = vec4(0.90, 0.94, 1.0, a);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending
});

const steamSystem = new THREE.Points(steamGeo, steamMat);
steamSystem.frustumCulled = false;
scene.add(steamSystem);

function updateSteam(dt, intensity) {
  for (let i = 0; i < STEAM_N; i++) {
    sLife[i] -= dt * (0.34 + intensity * 0.14);

    if (sLife[i] <= 0) {
      sLife[i] = 1.0;
      sPos[i * 3]     = EMIT.x + (Math.random() - 0.5) * 0.10;
      sPos[i * 3 + 1] = EMIT.y + (Math.random() - 0.5) * 0.04;
      sPos[i * 3 + 2] = EMIT.z + (Math.random() - 0.5) * 0.10;
      sVel[i].set(
        (Math.random() - 0.5) * 0.28,
        0.34 + Math.random() * 0.38,
        (Math.random() - 0.5) * 0.28
      );
      sSize[i] = 0.6 + Math.random() * 0.7;
    }

    const v = sVel[i];
    sPos[i * 3]     += v.x * dt;
    sPos[i * 3 + 1] += v.y * dt;
    sPos[i * 3 + 2] += v.z * dt;

    v.y += dt * 0.18;
    v.x *= (1 - dt * 0.55);
    v.z *= (1 - dt * 0.55);
  }

  steamGeo.attributes.position.needsUpdate = true;
  steamGeo.attributes.aLife.needsUpdate = true;
  steamGeo.attributes.aSize.needsUpdate = true;
}

/* =========================================================
   机构运动学更新
   ========================================================= */
const _A = new THREE.Vector3();
const _B = new THREE.Vector3();

function updateMechanism(theta) {
  const sinT = Math.sin(theta);
  const cosT = Math.cos(theta);

  // 曲柄销位置
  const pinX = CRANK_X + CRANK_R * cosT;
  const pinY = AXIS_Y + CRANK_R * sinT;

  // 十字头位置（曲柄滑块机构解析解）
  const inside = CONROD_L * CONROD_L - CRANK_R * CRANK_R * sinT * sinT;
  const root = Math.sqrt(inside > 0 ? inside : 0.0001);
  const crossX = pinX - root;

  // 活塞位置
  const pistonX = crossX - ROD_LEN;

  // 旋转部件
  parts.crank.rotation.z = theta;
  parts.flywheel.rotation.z = theta;

  // 往复部件
  parts.crosshead.position.x = crossX;
  parts.piston.position.x = pistonX;

  // 活塞杆
  _A.set(pistonX, AXIS_Y, 0);
  _B.set(crossX, AXIS_Y, 0);
  placeBar(parts.rod, _A, _B);

  // 连杆
  _A.set(crossX, AXIS_Y, 0);
  _B.set(pinX, pinY, 0);
  placeBar(parts.conrod, _A, _B);

  // 连杆两端轴瓦
  parts.bigEnd.position.set(pinX, pinY, 0);
  parts.smallEnd.position.set(crossX, AXIS_Y, 0);
}

/* =========================================================
   交互：转速控制
   ========================================================= */
let speed = 1.0;
const speedInput = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');

function syncSpeed() {
  speed = parseFloat(speedInput.value);
  speedVal.textContent = speed.toFixed(2);
}
speedInput.addEventListener('input', syncSpeed);
syncSpeed();

/* =========================================================
   响应式
   ========================================================= */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => {
  setTimeout(onResize, 120);
});

/* =========================================================
   主循环
   ========================================================= */
let crankAngle = 0;
const clock = new THREE.Clock();

updateMechanism(crankAngle);

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  // 曲轴角速度
  crankAngle += dt * speed * 1.75;
  if (crankAngle > Math.PI * 2) crankAngle -= Math.PI * 2;

  updateMechanism(crankAngle);
  updateSteam(dt, speed);

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
