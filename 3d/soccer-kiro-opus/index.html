  html, body { margin: 0; height: 100%; overflow: hidden; background: #dde5ff; }

    position: fixed; top: 14px; right: 16px; z-index: 5; pointer-events: none;

  .ui { position: fixed; top: 52px; right: 14px; z-index: 10; display: flex; gap: 8px; }

  }
  .ui button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(20, 12, 40, 0.5); }
  .hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 5;
    padding: 6px 14px; border-radius: 999px; pointer-events: none; white-space: nowrap;
    background: rgba(255, 246, 225, 0.8); color: #3d2f22; font-size: 13px; font-weight: 600;
    border: 2px solid #2a1f3d;
  }
  #goal {
    position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0;

    font-size: min(22vw, 170px); line-height: 1; letter-spacing: 6px; color: #ffe066;

    margin-top: 14px; font-size: min(6.5vw, 38px); font-weight: 900; color: #fff;

    0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
    12% { opacity: 1; transform: scale(1.18) rotate(3deg); }
    22% { transform: scale(1) rotate(0deg); }
    80% { opacity: 1; transform: scale(1.03); }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 5; }
  #flash.on { animation: flash .7s ease-out; }

  #fade { position: fixed; inset: 0; background: #120f3a; opacity: 0; pointer-events: none; z-index: 7; transition: opacity .45s; }
  #fade.on { opacity: 1; }
  #slowmo {
    position: fixed; top: 96px; left: 50%; transform: translateX(-50%); z-index: 6; pointer-events: none;
    padding: 4px 14px; border-radius: 6px; background: rgba(255, 0, 110, 0.8); color: #fff;
    font-weight: 900; letter-spacing: 4px; font-size: 15px; opacity: 0; transition: opacity .25s;
    border: 2px solid #2a1f3d;
  }
  #slowmo.on { opacity: 1; }
  @media (max-width: 600px) {
    .title { font-size: 15px; top: 18px; }
    .ui { top: 50px; }
    .ui button { font-size: 12px; padding: 5px 10px; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 基础工具 ================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261021);
const rr = (a, b) => a + (b - a) * rand();
const pick = arr => arr[Math.floor(rand() * arr.length)];
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = u => 1 - (1 - clamp(u, 0, 1)) ** 2;
const easeInOut = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
const headingOf = (dx, dz) => Math.atan2(dx, dz);
function lerpAngle(a, b, t) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
const V3 = THREE.Vector3;

/* ================= 渲染器 / 场景 / 相机 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdde5ff, 150, 380);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 6;
controls.maxDistance = 140;
controls.maxPolarAngle = Math.PI * 0.48;
controls.rotateSpeed = 0.7;

// 灯光
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x4a7a3a, 1.1));
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6);
sun.position.set(35, 70, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
{
  const c = sun.shadow.camera;
  c.left = -62; c.right = 62; c.top = 62; c.bottom = -62; c.near = 10; c.far = 180;
}
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// 渐变天空
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(450, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    vertexShader: `
      varying vec3 vP;
      void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec3 vP;
      void main(){
        float h = vP.y;
        vec3 hor = vec3(0.87, 0.90, 1.0);
        vec3 mid = vec3(0.52, 0.70, 1.0);
        vec3 top = vec3(0.20, 0.38, 0.92);
        vec3 c = mix(hor, mid, smoothstep(0.02, 0.3, h));
        c = mix(c, top, smoothstep(0.3, 0.9, h));
        c = mix(c, vec3(1.0, 0.80, 0.72), 0.45 * exp(-pow((h - 0.06) / 0.05, 2.0)));
        if (h < 0.0) c = mix(hor, vec3(0.55, 0.62, 0.55), smoothstep(0.0, -0.3, h));
        gl_FragColor = vec4(c, 1.0);
      }`
  }));
  sky.renderOrder = -1;
  scene.add(sky);
}

/* ================= 常量 ================= */
const FL = 90, FW = 58, HL = FL / 2, HW = FW / 2;   // 球场长宽
const GOAL_W = 8, GOAL_H = 2.8, GOAL_D = 2.4;       // 球门
const BALL_R = 0.35;
const SEAT_PAL = [0xff4d6d, 0xffd166, 0x06d6a0, 0x118ab2, 0x9b5de5, 0xf15bb5, 0xff8c42];

// 材质缓存
const matCache = new Map();
function mat(color) {
  let m = matCache.get(color);
  if (!m) { m = new THREE.MeshStandardMaterial({ color, roughness: 0.75 }); matCache.set(color, m); }
  return m;
}
// 体素方块：写入顶点色后放进列表，最终合并成一个网格（减少 draw call）
const _vc = new THREE.Color();
function vbox(list, w, h, d, x, y, z, color, rotY = 0, ox = 0, oz = 0) {
  const g = new THREE.BoxGeometry(w, h, d);
  g.translate(x, y, z);
  if (rotY) g.rotateY(rotY);
  if (ox || oz) g.translate(ox, 0, oz);
  _vc.set(color);
  const n = g.attributes.position.count, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = _vc.r; arr[i * 3 + 1] = _vc.g; arr[i * 3 + 2] = _vc.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  g.deleteAttribute('uv');
  list.push(g);
}
function makeCanvas(w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  return [cv, cv.getContext('2d')];
}
function canvasTex(cv) {
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function scaleUV(geo, sx, sy) {
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * sx, uv.getY(i) * sy);
}

/* ================= 球场草皮（Canvas 程序化贴图） ================= */
{
  const GW = 120, GD = 84, W = 2048, H = Math.round(W * GD / GW), s = W / GW;
  const [cv, g] = makeCanvas(W, H);
  const X = x => (x + GW / 2) * s, Z = z => (z + GD / 2) * s;
  g.fillStyle = '#3e8e3a'; g.fillRect(0, 0, W, H);
  // 割草条纹
  for (let i = 0, x = -GW / 2; x < GW / 2; x += 5, i++) {
    g.fillStyle = i % 2 ? '#4caf47' : '#43a13f';
    g.fillRect(X(x), 0, 5 * s + 1, H);
  }
  g.fillStyle = 'rgba(255,255,255,0.04)';
  for (let i = 0, z = -GD / 2; z < GD / 2; z += 5, i++) if (i % 2) g.fillRect(0, Z(z), W, 5 * s);
  // 像素颗粒感
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = rand() < 0.5 ? 'rgba(0,40,0,0.08)' : 'rgba(255,255,200,0.05)';
    const px = rand() * W | 0, py = rand() * H | 0;
    g.fillRect(px - px % 4, py - py % 4, 4, 4);
  }
  // 场外区域略深
  g.fillStyle = 'rgba(0,30,0,0.2)';
  const m = 3;
  g.fillRect(0, 0, W, Z(-HW - m));
  g.fillRect(0, Z(HW + m), W, H - Z(HW + m));
  g.fillRect(0, Z(-HW - m), X(-HL - m), (FW + 2 * m) * s);
  g.fillRect(X(HL + m), Z(-HW - m), W - X(HL + m), (FW + 2 * m) * s);
  // 白线
  g.strokeStyle = '#f4fff0'; g.fillStyle = '#f4fff0';
  g.lineWidth = 0.16 * s; g.lineCap = 'square';
  const line = (x0, z0, x1, z1) => { g.beginPath(); g.moveTo(X(x0), Z(z0)); g.lineTo(X(x1), Z(z1)); g.stroke(); };
  const dot = (x, z, r) => { g.beginPath(); g.arc(X(x), Z(z), r * s, 0, Math.PI * 2); g.fill(); };
  g.strokeRect(X(-HL), Z(-HW), FL * s, FW * s);
  line(0, -HW, 0, HW);
  g.beginPath(); g.arc(X(0), Z(0), 8 * s, 0, Math.PI * 2); g.stroke();
  dot(0, 0, 0.3);
  for (const sg of [-1, 1]) {
    const gx = sg * HL;
    g.strokeRect(Math.min(X(gx), X(gx - sg * 14)), Z(-17), 14 * s, 34 * s);
    g.strokeRect(Math.min(X(gx), X(gx - sg * 5)), Z(-8), 5 * s, 16 * s);
    dot(gx - sg * 10, 0, 0.25);
    g.beginPath();
    if (sg > 0) g.arc(X(gx - 10), Z(0), 8 * s, Math.PI * 2 / 3, Math.PI * 4 / 3);
    else g.arc(X(gx + 10), Z(0), 8 * s, -Math.PI / 3, Math.PI / 3);
    g.stroke();
    // 角球区弧线：取朝向场内的四分之一圆
    for (const sz of [-1, 1]) {
      const a0 = sz > 0 ? (sg > 0 ? Math.PI : Math.PI * 1.5) : (sg > 0 ? Math.PI * 0.5 : 0);
      g.beginPath();
      g.arc(X(gx), Z(sz * HW), 1 * s, a0, a0 + Math.PI / 2);
      g.stroke();
    }
  }
  const tex = canvasTex(cv);
  tex.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
  const pitch = new THREE.Mesh(new THREE.PlaneGeometry(GW, GD).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 }));
  pitch.receiveShadow = true;
  scene.add(pitch);
  // 场馆地面与外部草地
  const concourse = new THREE.Mesh(new THREE.PlaneGeometry(170, 130).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xb8b2c8, roughness: 1 }));
  concourse.position.y = -0.06;
  concourse.receiveShadow = true;
  scene.add(concourse);
  const outer = new THREE.Mesh(new THREE.PlaneGeometry(900, 900).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x6aa84f }));
  outer.position.y = -0.18;
  scene.add(outer);
}

/* ================= 看台 / 观众 / 顶棚 / 灯塔 ================= */
const staticBoxes = [], glowBoxes = [];
const fans = [];
const FAN_SHIRTS = [0xff4d6d, 0xffffff, 0xffd166, 0x3a86ff, 0x06d6a0, 0xff8c42, 0x9b5de5, 0xf15bb5, 0xe63946, 0x4cc9f0];
const SKINS = [0xffd7b5, 0xf1c27d, 0xc68642, 0x8d5524, 0xffe0bd];

// 在“看台局部坐标”中建造：沿 x 方向延伸，z 为离场心距离，最后整体绕 Y 旋转到对应一侧
function buildStand(len, d0, rot, rows = 10) {
  const rowD = 1.3, rise = 0.75;
  const c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i < rows; i++) {
    const zc = d0 + i * rowD + rowD / 2;
    const top = 0.9 + i * rise;
    vbox(staticBoxes, len, top, rowD, 0, top / 2, zc, i % 2 ? 0xdcd7ea : 0xc9c3da, rot);
    // 彩色座椅分区
    const segN = Math.round(len / 6), segL = len / segN;
    for (let k = 0; k < segN; k++) {
      const col = SEAT_PAL[(k + Math.floor(i / 3)) % SEAT_PAL.length];
      vbox(staticBoxes, segL - 0.12, 0.22, 0.55, -len / 2 + segL * (k + 0.5), top + 0.11, zc + 0.3, col, rot);
    }
    // 观众
    for (let a = -len / 2 + 0.6; a < len / 2 - 0.4; a += 0.82) {
      if (rand() < 0.12) continue;
      const lx = a + rr(-0.08, 0.08), lz = zc - 0.05;
      const wx = lx * c + lz * s, wz = -lx * s + lz * c;
      fans.push({ x: wx, y: top + 0.22, z: wz, rot: rot + Math.PI, phi: Math.atan2(wz, wx), ph: rand() * 6.28, sp: rand() * 3, shirt: pick(FAN_SHIRTS), skin: pick(SKINS) });
    }
  }
  const backH = 0.9 + rows * rise + 1.6;
  vbox(staticBoxes, len + 0.8, backH, 0.8, 0, backH / 2, d0 + rows * rowD + 0.4, 0x6c5ce7, rot);
  vbox(staticBoxes, len, 1.1, 0.4, 0, 0.55, d0 - 0.2, 0x2b2d42, rot);
  // 后墙顶部彩条
  for (let k = 0; k < Math.round(len / 4); k++) {
    vbox(staticBoxes, 3.9, 0.5, 0.9, -len / 2 + 4 * (k + 0.5), backH + 0.25, d0 + rows * rowD + 0.4, SEAT_PAL[k % SEAT_PAL.length], rot);
  }
}
buildStand(100, 35, 0);
buildStand(100, 35, Math.PI);
buildStand(66, 52, Math.PI / 2);
buildStand(66, 52, -Math.PI / 2);

// 长边看台顶棚
for (const rot of [0, Math.PI]) {
  const L = 102, z0 = 35.5, z1 = 50.5, y = 15;
  vbox(staticBoxes, L, 0.5, z1 - z0, 0, y, (z0 + z1) / 2, 0xf4f1ff, rot);
  for (let k = 0; k < 17; k++) vbox(staticBoxes, 5.8, 0.2, z1 - z0 - 1, -L / 2 + 6 * (k + 0.5), y + 0.35, (z0 + z1) / 2, SEAT_PAL[k % 7], rot);
  for (let x = -48; x <= 48; x += 12) vbox(staticBoxes, 0.7, y, 0.7, x, y / 2, z1 - 0.6, 0xbcb6d6, rot);
  vbox(staticBoxes, L, 1.0, 0.4, 0, y - 0.3, z0, 0x2b2d42, rot);
}

// 四角灯塔
const glowSprites = [];
{
  const [cv, g] = makeCanvas(128, 128);
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.25, 'rgba(255,244,214,0.75)');
  grd.addColorStop(1, 'rgba(255,240,200,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const glowMat = new THREE.SpriteMaterial({ map: canvasTex(cv), color: 0xfff4d6, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  for (const [tx, tz] of [[58, 45], [-58, 45], [58, -45], [-58, -45]]) {
    const rot = Math.atan2(-tx, -tz);
    vbox(staticBoxes, 1, 33, 1, 0, 16.5, 0, 0xe9e4f5, 0, tx, tz);
    vbox(staticBoxes, 2.4, 0.6, 2.4, 0, 0.3, 0, 0x2b2d42, 0, tx, tz);
    vbox(staticBoxes, 7.2, 4.4, 0.8, 0, 34.5, 0, 0x2b2d42, rot, tx, tz);
    for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) {
      vbox(glowBoxes, 1.4, 1.0, 0.25, -2.4 + 1.6 * i, 33.3 + 1.2 * j, 0.45, 0xfffbe6, rot, tx, tz);
    }
    const sp = new THREE.Sprite(glowMat);
    sp.position.set(tx * 0.98, 34.5, tz * 0.98);
    sp.scale.set(18, 18, 1);
    scene.add(sp);
    glowSprites.push(sp);
  }
}

/* ================= LED 广告板 ================= */
const [ledCv, ledG] = makeCanvas(1280, 64);
const ledTexA = canvasTex(ledCv), ledTexB = canvasTex(ledCv);
for (const t of [ledTexA, ledTexB]) t.wrapS = THREE.RepeatWrapping;
ledTexA.repeat.x = 96 / 20;
ledTexB.repeat.x = 62 / 20;
function drawLED(goal) {
  const g = ledG;
  const items = goal
    ? [['GOAL!!!', '#ff006e'], ['进球啦！', '#ffbe0b'], ['GOAL!!!', '#3a86ff'], ['10 号绝杀', '#8338ec'], ['GOAL!!!', '#06d6a0']]
    : [['VOXEL CUP 2026', '#ff006e'], ['像素足球联赛', '#3a86ff'], ['方块能量饮料', '#ffbe0b'], ['KIRO SPORTS', '#8338ec'], ['绿茵像素风', '#06d6a0']];
  g.textAlign = 'center'; g.textBaseline = 'middle';
  items.forEach(([txt, bg], i) => {
    g.fillStyle = bg; g.fillRect(i * 256, 0, 256, 64);
    g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(i * 256, 0, 256, 10);
    g.font = '900 28px "PingFang SC", "Microsoft YaHei", sans-serif';
    g.fillStyle = '#2a1f3d'; g.fillText(txt, i * 256 + 130, 36);
    g.fillStyle = '#ffffff'; g.fillText(txt, i * 256 + 128, 34);
  });
  g.fillStyle = 'rgba(0,0,0,0.28)';
  for (let x = 0; x < 1280; x += 4) g.fillRect(x, 0, 1, 64);
  for (let y = 0; y < 64; y += 4) g.fillRect(0, y, 1280, 1);
  ledTexA.needsUpdate = ledTexB.needsUpdate = true;
}
drawLED(false);
{

function updateCrowd(t, excite) {
  const ab = fanBody.instanceMatrix.array, ah = fanHead.instanceMatrix.array, aa = fanArms.instanceMatrix.array;
  const wave = (t * 0.8) % (Math.PI * 2) - Math.PI;   // 人浪角度
  const calm = 1 - excite;
  for (let i = 0; i < FAN_N; i++) {
    const f = fans[i];
    let d = f.phi - wave;
    d = ((d + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    const w = Math.exp(-d * d * 18) * calm;
    let j = w * 0.55 + Math.max(0, Math.sin(t * 2.2 + f.ph)) * 0.04;
    j += excite * Math.abs(Math.sin(t * (8 + f.sp) + f.ph)) * 0.75;
    const y = f.y + j, o = i * 16;
    ab[o + 13] = y; ah[o + 13] = y;
    aa[o + 13] = y + 0.55;
    aa[o + 5] = Math.max(0.01, w, excite * (0.75 + 0.25 * Math.sin(t * 10 + f.ph)));
  }
  fanBody.instanceMatrix.needsUpdate = fanHead.instanceMatrix.needsUpdate = fanArms.instanceMatrix.needsUpdate = true;
}

const ball = (() => {
  const parts = [];
  // 二十面体 12 个顶点方向 → 黑色五边形块
  const ico = new THREE.IcosahedronGeometry(1, 0).attributes.position;
  const dirs = [];
  for (let i = 0; i < ico.count; i++) {
    const v = new V3().fromBufferAttribute(ico, i).normalize();
    if (!dirs.some(d => d.distanceTo(v) < 1e-3)) dirs.push(v);
  }
  const n = 7, c = 0.1, v = new V3();
  for (let ix = 0; ix < n; ix++) for (let iy = 0; iy < n; iy++) for (let iz = 0; iz < n; iz++) {
    v.set((ix - 3) * c, (iy - 3) * c, (iz - 3) * c);
    const d = v.length();
    if (d > 0.36 || d < 0.2) continue;
    v.normalize();
    let best = -1;
    for (const p of dirs) best = Math.max(best, p.dot(v));
    vbox(parts, c, c, c, (ix - 3) * c, (iy - 3) * c, (iz - 3) * c, best > 0.9 ? 0x1a1a24 : 0xffffff);
  }
  const m = new THREE.Mesh(mergeGeometries(parts), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.45 }));
  m.castShadow = true;
  scene.add(m);
  return m;
})();

class Particles {
  constructor(max, geo, material) {
    this.max = max; this.n = 0;
    this.mesh = new THREE.InstancedMesh(geo, material, max);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    const white = new THREE.Color(1, 1, 1);
    for (let i = 0; i < max; i++) this.mesh.setColorAt(i, white);
    this.mesh.count = 0;
    this.p = new Float32Array(max * 3); this.v = new Float32Array(max * 3);
    this.r = new Float32Array(max * 3); this.rv = new Float32Array(max * 3);
    this.life = new Float32Array(max); this.maxLife = new Float32Array(max);
    this.size = new Float32Array(max); this.grav = new Float32Array(max);
    this.drag = new Float32Array(max); this.flut = new Float32Array(max);
    this._m = new THREE.Matrix4(); this._q = new THREE.Quaternion(); this._e = new THREE.Euler();
    this._s = new V3(); this._p = new V3(); this._c = new THREE.Color();
    scene.add(this.mesh);
  }
  spawn(x, y, z, vx, vy, vz, life, size, color, grav = -9.8, drag = 0.5, flut = 0) {
    if (this.n >= this.max) return;
    const i = this.n++, i3 = i * 3;
    this.p[i3] = x; this.p[i3 + 1] = y; this.p[i3 + 2] = z;
    this.v[i3] = vx; this.v[i3 + 1] = vy; this.v[i3 + 2] = vz;
    this.r[i3] = rand() * 6.28; this.r[i3 + 1] = rand() * 6.28; this.r[i3 + 2] = rand() * 6.28;
    this.rv[i3] = rr(-9, 9); this.rv[i3 + 1] = rr(-9, 9); this.rv[i3 + 2] = rr(-9, 9);
    this.life[i] = this.maxLife[i] = life;
    this.size[i] = size; this.grav[i] = grav; this.drag[i] = drag; this.flut[i] = flut;
    this.mesh.setColorAt(i, this._c.set(color));
  }

    const p = ball.position;
    for (let i = 0; i < 7; i++) {
      sparks.spawn(p.x + rr(-0.15, 0.15), p.y + rr(-0.15, 0.15), p.z + rr(-0.15, 0.15), rr(-1.2, 1.2), rr(-0.5, 1.5), rr(-1.2, 1.2), rr(0.35, 0.75), rr(0.1, 0.22), pick(SPARK_COLS), 0, 2.2);
    }
    return;
  }
  // 入网后的简单物理
  const p = ball.position, v = bs.vel;
  if (!bs.active) {
    bs.active = true;
    p.copy(SHOT_T);
    v.subVectors(SHOT_T, SHOT_C).multiplyScalar(2 / FLIGHT).multiplyScalar(0.8);
  }
  v.y -= 16 * sdt;
  const dmp = Math.exp(-2.5 * sdt);
  v.x *= dmp; v.z *= dmp;
  p.addScaledVector(v, sdt);
  const backX = HL + GOAL_D - BALL_R - 0.05;
  if (p.x > backX) {
    p.x = backX;
    if (v.x > 0) {
      if (!bs.bulged) { bs.bulged = true; bulge.t0 = t; bulge.y = p.y; bulge.z = p.z; }
      v.x *= -0.15;
    }
  }
  if (p.x < HL + BALL_R && v.x < 0) { p.x = HL + BALL_R; v.x *= -0.3; }
  const zl = GOAL_W / 2 - BALL_R - 0.05;
  if (Math.abs(p.z) > zl) { p.z = Math.sign(p.z) * zl; v.z *= -0.2; }
  if (p.y > GOAL_H - BALL_R) { p.y = GOAL_H - BALL_R; v.y *= -0.2; }
  if (p.y < BALL_R) {
    p.y = BALL_R;
    if (v.y < 0) v.y *= -0.42;
    v.x *= 0.85; v.z *= 0.85;
    if (Math.abs(v.y) < 0.6) v.y = 0;
  }
  const sp = v.length();
  if (sp > 1e-3) {
    _t.set(v.z, 0, -v.x);
    if (_t.lengthSq() > 1e-8) ball.quaternion.premultiply(_q.setFromAxisAngle(_t.normalize(), sp * sdt / BALL_R));
  }
}
function updateNet(t) {
  const pos = netBack.geometry.attributes.position, base = netBack.userData.base;
  if (bulge.t0 < 0) {
    if (netBack.userData.dirty) { pos.array.set(base); pos.needsUpdate = true; netBack.userData.dirty = false; }
    return;
  }
  const tau = t - bulge.t0;
  const amp = 0.9 * Math.exp(-2.2 * tau) * Math.cos(7 * tau);
  for (let i = 0; i < pos.count; i++) {
    const y = base[i * 3 + 1], z = base[i * 3 + 2];
    const f = Math.exp(-((y - bulge.y) ** 2 + (z - bulge.z) ** 2) / 0.9);
    pos.setX(i, base[i * 3] + amp * f);
  }
  pos.needsUpdate = true;
  netBack.userData.dirty = true;
}

/* ================= 进球庆祝特效 ================= */
const goalEl = document.getElementById('goal');
const flashEl = document.getElementById('flash');
const fadeEl = document.getElementById('fade');
const slowEl = document.getElementById('slowmo');
function restartAnim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function onGoal() {
  restartAnim(goalEl, 'show');
  restartAnim(flashEl, 'on');
  score++;
  drawLED(true);
  shake = 0.7;
  // 球门两侧礼花炮
  for (const z of [-GOAL_W / 2, GOAL_W / 2]) {
    for (let i = 0; i < 260; i++) {
      confetti.spawn(HL + 0.2, GOAL_H, z, rr(-6, 1), rr(9, 18), rr(-3, 3) + Math.sign(z) * rr(0, 3), rr(3.5, 6), 1, pick(CONF_COLS), -5, 1.6, 8);
    }
  }
  // 撞网火花
  const p = ball.position;
  for (let i = 0; i < 260; i++) {
    randomDir(_rd).multiplyScalar(rr(4, 12));
    sparks.spawn(p.x, p.y, p.z, _rd.x - 3, _rd.y + 2, _rd.z, rr(0.5, 1.2), rr(0.1, 0.24), pick(SPARK_COLS), -5, 1.6);
  }
}
function launchFirework() {
  const side = Math.floor(rand() * 4);
  const pos = side < 2
    ? new V3(rr(-42, 42), 10, side ? 42 : -42)
    : new V3(side === 2 ? 60 : -60, 10, rr(-25, 25));
  fireworks.push({ pos, vel: new V3(-pos.x * 0.05 + rr(-2, 2), rr(26, 31), -pos.z * 0.05 + rr(-2, 2)), age: 0, burstAt: rr(0.9, 1.2), cols: pick(FW_COLS) });
}
function updateFireworks(sdt) {
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const f = fireworks[i];
    f.age += sdt;
    f.vel.y -= 9.8 * sdt;
    f.pos.addScaledVector(f.vel, sdt);
    sparks.spawn(f.pos.x, f.pos.y, f.pos.z, rr(-0.6, 0.6), rr(-1.5, -0.3), rr(-0.6, 0.6), rr(0.3, 0.55), rr(0.12, 0.2), 0xffd6a0, -2, 1);
    if (f.age >= f.burstAt) {
      const sp = rr(8, 11);
      for (let k = 0; k < 150; k++) {
        randomDir(_rd).multiplyScalar(sp * rr(0.85, 1));
        sparks.spawn(f.pos.x, f.pos.y, f.pos.z, _rd.x, _rd.y, _rd.z, rr(1.2, 2.0), rr(0.22, 0.34), f.cols[k % 2], -4.5, 1.1);
      }
      fireworks.splice(i, 1);
    }
  }
}
function celebrationEffects(t, sdt) {
  if (!ev.goal && t >= T_GOAL) { ev.goal = true; onGoal(); }
  if (!ev.goal) return;
  FW_TIMES.forEach((ft, k) => {
    if (!ev.fw[k] && t >= T_GOAL + ft) { ev.fw[k] = true; launchFirework(); if (k % 3 === 0) launchFirework(); }
  });
  // 漫天彩纸
  if (t > T_GOAL + 0.2 && t < T_GOAL + 4.2) {
    const n = Math.round(sdt * 170 + rand());
    for (let i = 0; i < n; i++) {
      confetti.spawn(rr(10, 52), rr(18, 26), rr(-32, 32), rr(-1, 1), rr(-2, 0), rr(-1, 1), rr(5, 7), 1, pick(CONF_COLS), -2.2, 2, 6);
    }
    // 看台抛洒
    const m = Math.round(sdt * 60 + rand());
    for (let i = 0; i < m; i++) {
      const sz = rand() < 0.5 ? 1 : -1;
      confetti.spawn(rr(-45, 45), rr(8, 12), sz * rr(36, 44), rr(-1, 1), rr(4, 8), -sz * rr(3, 6), rr(4, 6), 1, pick(CONF_COLS), -3, 1.4, 6);
    }
  }
}

/* ================= 重置一轮 ================= */
let simT = 0;
function resetMatch() {
  simT = 0;
  st.mode = 0; st.vel.set(0, 0, 0);
  bs.active = false; bs.bulged = false;
  bulge.t0 = -1;
  ev.goal = false; ev.fw = []; ev.fade = false;
  fireworks.length = 0;
  confetti.clear(); sparks.clear();
  score = 0; scrKey = '';
  drawLED(false);
  goalEl.classList.remove('show');
  ballPosAt(0, ball.position);
  ballPrev.copy(ball.position);
  d1.root.position.copy(D1P.start);
  d2.root.position.copy(D2P.start);
  gk.root.position.set(HL - 0.9, 0, 0);
  curve.getTangentAt(0, _t);
  att.root.rotation.y = headingOf(_t.x, _t.z);
  d1.root.rotation.y = headingOf(-_t.x, -_t.z);
  d2.root.rotation.y = headingOf(-_t.x, -_t.z);
  setTimeout(() => fadeEl.classList.remove('on'), 60);
}

/* ================= 相机跟随 ================= */
let follow = true;
const focus = new V3(), _prevT = new V3(), _shake = new V3();
function computeFocus(t, out) {
  if (t < T_SHOT) out.copy(att.root.position).lerp(ball.position, 0.5);
  else if (t < T_GOAL + 0.6) out.copy(ball.position).lerp(GOAL_CENTER, 0.25);
  else out.copy(att.root.position).lerp(GOAL_CENTER, 0.35);
  out.y = 1.0;
  return out;
}
resetMatch();
updateAttacker(0, 0);
computeFocus(0, focus);
controls.target.copy(focus);
{
  const off = new V3(-15, 10.5, 15);
  if (camera.aspect < 0.8) off.multiplyScalar(1.7);
  camera.position.copy(focus).add(off);
}
controls.update();

const followBtn = document.getElementById('followBtn');
followBtn.addEventListener('click', () => {
  follow = !follow;
  followBtn.textContent = `镜头跟随：${follow ? '开' : '关'}`;
});
document.getElementById('replayBtn').addEventListener('click', () => resetMatch());

/* ================= 主循环 ================= */
function timeScale(t) {
  return 1 - 0.7 * smoothstep(T_SHOT - 0.2, T_SHOT + 0.02, t) * (1 - smoothstep(T_GOAL - 0.02, T_GOAL + 0.3, t));
}
let last = performance.now(), realT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  realT += dt;
  const ts = timeScale(simT);
  const sdt = dt * ts;
  simT += sdt;
  if (!ev.fade && simT > T_END - 0.5) { ev.fade = true; fadeEl.classList.add('on'); }
  if (simT >= T_END) resetMatch();
  const t = simT;
  slowEl.classList.toggle('on', ts < 0.6);

  updateAttacker(t, sdt);
  updateBall(t, sdt);
  updateD1(t, sdt);
  updateD2(t, sdt);
  updateGK(t, sdt);
  updateNet(t);
  celebrationEffects(t, sdt);
  updateFireworks(sdt);
  confetti.update(sdt);
  sparks.update(sdt);

  const excite = Math.max(
    smoothstep(T_SHOT - 1.2, T_SHOT, t) * 0.25,
    smoothstep(T_GOAL, T_GOAL + 0.4, t) * (1 - smoothstep(T_END - 1.5, T_END, t))
  );
  updateCrowd(t, excite);
  drawScreen(t);

  // 场景小动画
  ledTexA.offset.x = (ledTexA.offset.x + dt * 0.08) % 1;
  ledTexB.offset.x = (ledTexB.offset.x + dt * 0.08) % 1;
  cornerFlags.forEach((f, i) => { f.rotation.y = Math.sin(realT * 3 + i) * 0.35; });
  clouds.rotation.y += dt * 0.004;
  const gl = ev.goal && t < T_GOAL + 4 ? 1 + 0.4 * Math.abs(Math.sin(realT * 14)) : 1;
  glowSprites.forEach(s => s.scale.set(18 * gl, 18 * gl, 1));

  // 镜头：目标点平滑跟随，相机同步平移，保留用户的旋转与缩放
  if (follow) {
    computeFocus(t, focus);
    _prevT.copy(controls.target);
    controls.target.lerp(focus, 1 - Math.exp(-2.5 * dt));
    camera.position.add(_prevT.subVectors(controls.target, _prevT));
  }
  controls.update();

  shake *= Math.exp(-5 * dt);
  _shake.set(rr(-1, 1), rr(-1, 1), rr(-1, 1)).multiplyScalar(shake * 0.35);
  camera.position.add(_shake);
  renderer.render(scene, camera);
  camera.position.sub(_shake);
}
requestAnimationFrame(frame);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
