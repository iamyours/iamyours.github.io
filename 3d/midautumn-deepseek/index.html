<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

/* ============================================================
   基础：渲染器 / 场景 / 相机
   ============================================================ */
const DPR = Math.min(window.devicePixelRatio || 1, 2);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const MAX_ANISO = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08101f, 0.0085);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 700);
camera.position.set(6.8, 3.7, 11.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.7, -1.6);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 7;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.492;
controls.minPolarAngle = Math.PI * 0.085;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.7;
controls.update();

/* ============================================================
   工具函数
   ============================================================ */
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function canvasTex(w, h, draw, opts) {
  opts = opts || {};
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = opts.wrap === false ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
  tex.wrapT = opts.wrap === false ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
  tex.anisotropy = MAX_ANISO;
  if (opts.repeat) tex.repeat.set(opts.repeat[0], opts.repeat[1]);
  return tex;
}

/* ============================================================
   程序化贴图
   ============================================================ */

/* --- 木纹 --- */
const woodTex = canvasTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#6b4a2e';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 420; i++) {
    const y = Math.random() * h;
    const lum = 14 + Math.random() * 30;
    ctx.strokeStyle = `hsla(${20 + Math.random() * 14}, ${32 + Math.random() * 26}%, ${lum}%, ${0.14 + Math.random() * 0.34})`;
    ctx.lineWidth = 0.6 + Math.random() * 3.2;
    ctx.beginPath();
    let yy = y;
    ctx.moveTo(0, yy);
    for (let x = 0; x <= w; x += 16) {
      yy = y + Math.sin(x * 0.012 + i * 0.7) * 4 + Math.sin(x * 0.052 + i * 2.3) * 1.6;
      ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  for (let i = 0; i < 7; i++) {
    const x = Math.random() * w, y = Math.random() * h, r = 7 + Math.random() * 15;
    const g = ctx.createRadialGradient(x, y, 1, x, y, r);
    g.addColorStop(0, 'rgba(38,22,11,0.85)');
    g.addColorStop(0.55, 'rgba(72,46,26,0.45)');
    g.addColorStop(1, 'rgba(96,66,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(x, y, r * 1.7, r, 0, 0, Math.PI * 2); ctx.fill();
  }
}, { repeat: [1, 1] });
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;

/* --- 石材 --- */
const stoneTex = canvasTex(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#7c7c74';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 10000; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const r = Math.random() * 3 + 0.4;
    const v = 96 + Math.random() * 78;
    ctx.fillStyle = `rgba(${v},${v},${v - 8},${Math.random() * 0.17})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.3); ctx.fill();
  }
  for (let i = 0; i < 28; i++) {
    ctx.strokeStyle = `rgba(38,38,36,${0.12 + Math.random() * 0.24})`;
    ctx.lineWidth = 0.5 + Math.random() * 1.6;
    ctx.beginPath();
    let x = Math.random() * w, y = Math.random() * h;
    ctx.moveTo(x, y);
    for (let k = 0; k < 8; k++) {
      x += (Math.random() - 0.5) * 74;
      y += (Math.random() - 0.5) * 74;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}, { repeat: [2, 2] });

/* --- 月面 --- */
const moonTex = canvasTex(1024, 512, (ctx, w, h) => {
  const g0 = ctx.createLinearGradient(0, 0, 0, h);
  g0.addColorStop(0, '#fff8e2');
  g0.addColorStop(0.5, '#ffeec6');
  g0.addColorStop(1, '#fff4d8');
  ctx.fillStyle = g0;
  ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < 26; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const r = 40 + Math.random() * 140;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(186,174,146,0.40)');
    g.addColorStop(0.7, 'rgba(204,192,163,0.16)');
    g.addColorStop(1, 'rgba(220,208,180,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.3); ctx.fill();
  }

  for (let i = 0; i < 620; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const r = 2 + Math.pow(Math.random(), 2.4) * 26;
    const g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.05, x, y, r);
    g.addColorStop(0, `rgba(158,148,126,${0.10 + Math.random() * 0.22})`);
    g.addColorStop(0.6, `rgba(190,180,155,${0.10 + Math.random() * 0.18})`);
    g.addColorStop(1, 'rgba(255,248,228,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.3); ctx.fill();

    ctx.strokeStyle = `rgba(255,250,232,${0.08 + Math.random() * 0.16})`;
    ctx.lineWidth = r * 0.16 + 0.4;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.92, Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
  }

  for (let i = 0; i < 4500; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    ctx.fillStyle = `rgba(${200 + Math.random() * 55},${200 + Math.random() * 45},${180 + Math.random() * 50},${Math.random() * 0.11})`;
    ctx.beginPath(); ctx.arc(x, y, Math.random() * 2.2 + 0.3, 0, 6.3); ctx.fill();
  }
}, { wrap: false });

/* --- 柔光光斑 --- */
const glowTex = canvasTex(256, 256, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(255,250,235,0.72)');
  g.addColorStop(0.45, 'rgba(255,240,200,0.20)');
  g.addColorStop(1.00, 'rgba(255,230,180,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}, { wrap: false });

/* --- 星点 --- */
const starTex = canvasTex(64, 64, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(220,235,255,0.55)');
  g.addColorStop(1, 'rgba(180,210,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}, { wrap: false });

/* --- 月饼顶面纹样 --- */
const mooncakeTex = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#d9a24a';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(150,92,26,0.85)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(w / 2, h / 2, 100, 0, 6.3); ctx.stroke();
  ctx.beginPath(); ctx.arc(w / 2, h / 2, 82, 0, 6.3); ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.save();
    ctx.translate(w / 2 + Math.cos(a) * 58, h / 2 + Math.sin(a) * 58);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.ellipse(0, 0, 20, 9, 0, 0, 6.3);
    ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(150,92,26,0.9)';
  ctx.beginPath(); ctx.arc(w / 2, h / 2, 16, 0, 6.3); ctx.fill();
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = `rgba(${120 + Math.random() * 90},${70 + Math.random() * 60},${20 + Math.random() * 40},${Math.random() * 0.12})`;
    ctx.beginPath(); ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 2, 0, 6.3); ctx.fill();
  }
}, { wrap: false });

/* ============================================================
   灯光
   ============================================================ */
const hemi = new THREE.HemisphereLight(0x2c4270, 0x080d18, 0.55);
scene.add(hemi);

const moonLight = new THREE.DirectionalLight(0xd6e5ff, 2.5);
moonLight.position.set(-16, 24, -22);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(1024, 1024);
moonLight.shadow.camera.left = -16;
moonLight.shadow.camera.right = 16;
moonLight.shadow.camera.top = 16;
moonLight.shadow.camera.bottom = -16;
moonLight.shadow.camera.near = 1;
moonLight.shadow.camera.far = 90;
moonLight.shadow.bias = -0.0008;
moonLight.shadow.normalBias = 0.022;
scene.add(moonLight);

const ambient = new THREE.AmbientLight(0x24304a, 0.55);
scene.add(ambient);

/* ============================================================
   夜空 + 星星
   ============================================================ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  uniforms: {
    uTop: { value: new THREE.Color(0x03060d) },
    uBottom: { value: new THREE.Color(0x16294a) },
    uMoonDir: { value: new THREE.Vector3(-0.10, 0.30, -0.95).normalize() }
  },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uTop;
    uniform vec3 uBottom;
    uniform vec3 uMoonDir;
    varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      float hgt = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 col = mix(uBottom, uTop, pow(hgt, 0.75));
      float m = max(dot(d, uMoonDir), 0.0);
      col += vec3(0.30, 0.26, 0.17) * pow(m, 26.0) * 0.85;
      col += vec3(0.10, 0.13, 0.22) * pow(m, 5.0) * 0.55;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(240, 32, 18), skyMat);
sky.frustumCulled = false;
scene.add(sky);

/* --- 星星 --- */
(function buildStars() {
  const COUNT = 950;
  const positions = new Float32Array(COUNT * 3);
  const colors = new Float32Array(COUNT * 3);
  const v = new THREE.Vector3();
  for (let i = 0; i < COUNT; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(1 - Math.random() * 0.92);
    const r = 190;
    v.set(
      r * Math.sin(phi) * Math.cos(theta),
      Math.abs(r * Math.cos(phi)) * 0.98 + 12,
      r * Math.sin(phi) * Math.sin(theta)
    );
    positions[i * 3] = v.x;
    positions[i * 3 + 1] = v.y;
    positions[i * 3 + 2] = v.z;
    const t = Math.random();
    colors[i * 3] = 0.72 + t * 0.28;
    colors[i * 3 + 1] = 0.80 + t * 0.20;
    colors[i * 3 + 2] = 1.0;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 1.8,
    map: starTex,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexColors: true,
    sizeAttenuation: true,
    fog: false,
    opacity: 0.85
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);
})();

/* ============================================================
   巨型满月
   ============================================================ */
const MOON_RADIUS = 7.2;
const MOON_POS = new THREE.Vector3(-4.0, 17.5, -54);

const moonMat = new THREE.ShaderMaterial({
  fog: false,
  uniforms: {
    uMap: { value: moonTex },
    uIntensity: { value: 1.42 }
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vNormalW;
    void main() {
      vUv = uv;
      vNormalW = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D uMap;
    uniform float uIntensity;
    varying vec2 vUv;
    varying vec3 vNormalW;
    void main() {
      vec3 tex = texture2D(uMap, vUv).rgb;
      float rim = pow(clamp(vNormalW.z * 0.5 + 0.5, 0.0, 1.0), 0.4);
      vec3 col = tex * uIntensity * mix(0.82, 1.05, rim);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(MOON_RADIUS, 64, 40), moonMat);
moonMesh.position.copy(MOON_POS);
scene.add(moonMesh);

/* 月晕 */
const haloMat = new THREE.SpriteMaterial({
  map: glowTex,
  color: 0xffe6b0,
  transparent: true,
  opacity: 0.62,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false,
  fog: false
});
const halo = new THREE.Sprite(haloMat);
halo.scale.set(58, 58, 1);
halo.position.copy(MOON_POS);
scene.add(halo);

const halo2Mat = haloMat.clone();
halo2Mat.opacity = 0.22;
halo2Mat.color = new THREE.Color(0xcfe0ff);
const halo2 = new THREE.Sprite(halo2Mat);
halo2.scale.set(120, 120, 1);
halo2.position.copy(MOON_POS);
scene.add(halo2);

/* ============================================================
   水面（Reflector + 自定义着色器）
   ============================================================ */
const waterShader = {
  uniforms: {
    color: { value: new THREE.Color(0x0a1a2c) },
    tDiffuse: { value: null },
    textureMatrix: { value: null },
    uTime: { value: 0 }
  },
  vertexShader: `
    uniform mat4 textureMatrix;
    varying vec4 vUv;
    varying vec3 vWorldPos;
    void main() {
      vUv = textureMatrix * vec4(position, 1.0);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 color;
    uniform sampler2D tDiffuse;
    uniform float uTime;
    varying vec4 vUv;
    varying vec3 vWorldPos;

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }

    void main() {
      vec2 p = vWorldPos.xz;
      float t = uTime;

      float n1 = vnoise(p * 0.34 + vec2(t * 0.050, t * 0.032));
      float n2 = vnoise(p * 0.86 - vec2(t * 0.082, -t * 0.048));
      float n3 = vnoise(p * 2.20 + vec2(-t * 0.130, t * 0.100));
      float n4 = vnoise(p * 5.40 + vec2(t * 0.220, -t * 0.170));

      vec2 ripple = vec2(
        vnoise(p * 0.92 + vec2(t * 0.12, 0.0)) - 0.5,
        vnoise(p * 0.92 + vec2(0.0, t * 0.12)) - 0.5
      );

      vec4 uvp = vUv;
      uvp.xy += ripple * 0.050 * uvp.w;
      uvp.xy += (vec2(n4, n3) - 0.5) * 0.013 * uvp.w;

      vec3 refl = texture2DProj(tDiffuse, uvp).rgb;

      vec3 V = normalize(cameraPosition - vWorldPos);
      float fres = pow(1.0 - clamp(V.y, 0.0, 1.0), 3.0);
      fres = clamp(0.05 + fres * 1.15, 0.0, 1.0);

      vec3 deep = color * (0.55 + 0.45 * n1);
      vec3 col = mix(deep, refl, fres);

      vec3 N = normalize(vec3((n2 - n3) * 1.7, 1.0, (n1 - n4) * 1.7));
      vec3 moonDir = normalize(vec3(-0.14, 0.42, -0.90));
      vec3 H = normalize(moonDir + V);
      float spec = pow(max(dot(N, H), 0.0), 240.0);
      col += vec3(1.0, 0.94, 0.79) * spec * 1.9;

      float sparkle = pow(max(n4, 0.0), 20.0) * 0.30;
      col += vec3(0.48, 0.60, 0.82) * sparkle;

      float band = smoothstep(0.35, 1.0, n1) * 0.035;
      col += vec3(0.30, 0.42, 0.62) * band;

      gl_FragColor = vec4(col, 0.86);
    }
  `
};

const reflSize = Math.max(512, Math.min(1024, Math.round(window.innerWidth * 0.55)));
const waterGeo = new THREE.PlaneGeometry(90, 90);
const water = new Reflector(waterGeo, {
  clipBias: 0.0035,
  textureWidth: reflSize,
  textureHeight: reflSize,
  color: 0xffffff,
  shader: waterShader
});
water.rotation.x = -Math.PI / 2;
water.position.y = 0;
water.material.transparent = true;
water.material.depthWrite = false;
scene.add(water);

/* ============================================================
   材质库
   ============================================================ */
const woodTexClone = woodTex.clone();
woodTexClone.needsUpdate = true;

const matWood = new THREE.MeshStandardMaterial({ map: woodTex, color: 0xa08060, roughness: 0.85, metalness: 0.02, bumpMap: woodTex, bumpScale: 0.02 });
const matWoodDark = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x6a4a30, roughness: 0.9, metalness: 0.02 });
const matStone = new THREE.MeshStandardMaterial({ map: stoneTex, color: 0x9a9a92, roughness: 0.93, metalness: 0.03, bumpMap: stoneTex, bumpScale: 0.035 });
const matStoneDark = new THREE.MeshStandardMaterial({ map: stoneTex, color: 0x6d6d68, roughness: 0.95, metalness: 0.02 });
const matRoof = new THREE.MeshStandardMaterial({ color: 0x262b36, roughness: 0.68, metalness: 0.22, side: THREE.DoubleSide });
const matGold = new THREE.MeshStandardMaterial({ color: 0xd9a63a, roughness: 0.30, metalness: 0.85, emissive: 0x3a2600, emissiveIntensity: 0.6 });
const matPorcelain = new THREE.MeshStandardMaterial({ color: 0xf3f6ff, roughness: 0.12, metalness: 0.04, side: THREE.DoubleSide });
const matBark = new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 0.96, metalness: 0.0 });

/* ============================================================
   岩石
   ============================================================ */
function createRock(radius, heightScale, seed, mat) {
  const geo = new THREE.IcosahedronGeometry(radius, 1);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = 1
      + Math.sin(v.x * 2.7 + seed) * 0.13
      + Math.cos(v.z * 3.4 + seed * 1.7) * 0.11
      + Math.sin(v.y * 4.6 + seed * 2.3) * 0.09;
    v.multiplyScalar(n);
    v.y *= heightScale;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/* 屋顶 */
function buildRoofSurface(R, yEave, yApex, rise, mat, SU, SV) {
  const group = new THREE.Group();
  const corners = [
    new THREE.Vector3(-R, yEave + rise, -R),
    new THREE.Vector3(R, yEave + rise, -R),
    new THREE.Vector3(R, yEave + rise, R),
    new THREE.Vector3(-R, yEave + rise, R)
  ];

  for (let f = 0; f < 4; f++) {
    const A = corners[f];
    const B = corners[(f + 1) % 4];
    const yMid = yEave;

    const positions = [];
    const uvs = [];
    const indices = [];

    for (let iv = 0; iv <= SV; iv++) {
      const v = iv / SV;
      const s = 1 - v;
      const hs = Math.pow(s, 0.92);
      const ys = Math.pow(s, 0.70);

      for (let iu = 0; iu <= SU; iu++) {
        const u = iu / SU;
        const bx = lerp(A.x, B.x, u);
        const bz = lerp(A.z, B.z, u);
        const by = yMid + (A.y - yMid) * Math.pow(2 * u - 1, 2);
        const y = yApex - (yApex - by) * ys;
        positions.push(bx * hs, y, bz * hs);
        uvs.push(u, v);
      }
    }

    for (let iv = 0; iv < SV; iv++) {
      for (let iu = 0; iu < SU; iu++) {
        const a = iv * (SU + 1) + iu;
        const b = a + 1;
        const c = a + SU + 1;
        const d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
  }
  return group;
}

function createBridge(x0, x1, z, yBase, rise) {
  const g = new THREE.Group();
  const span = x1 - x0;
  const N = 30;

  const topY = (t) => yBase + rise * Math.sin(Math.PI * t);
  const botY = (t) => yBase - 0.42 + (rise - 0.62) * Math.sin(Math.PI * t);

  const shape = new THREE.Shape();
  shape.moveTo(x0, topY(0));
  for (let i = 1; i <= N; i++) {
    const t = i / N;
    shape.lineTo(x0 + span * t, topY(t));
  }
  for (let i = N; i >= 0; i--) {
    const t = i / N;
    shape.lineTo(x0 + span * t, botY(t));
  }
  shape.closePath();

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: 2.0,
    bevelEnabled: true,
    bevelSize: 0.035,
    bevelThickness: 0.035,
    bevelSegments: 2,
    curveSegments: 1
  });
  geo.translate(0, 0, -1.0);
  geo.computeVertexNormals();

  const deck = new THREE.Mesh(geo, matStone);
  deck.castShadow = true;
  deck.receiveShadow = true;
  g.add(deck);

  /* 栏杆立柱 */
  for (let i = 0; i <= 9; i++) {
    const t = 0.07 + (i / 9) * 0.86;
    const px = x0 + span * t;
    const py = topY(t);
    for (const zz of [-0.86, 0.86]) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.42, 0.09), matStoneDark);
      post.position.set(px, py + 0.20, z + zz);
      post.castShadow = true;
      g.add(post);
    }
  }

  /* 扶手 */
  for (const zz of [-0.86, 0.86]) {
    const pts = [];
    for (let i = 0; i <= 20; i++) {
      const t = i / 20;
      pts.push(new THREE.Vector3(x0 + span * t, topY(t) + 0.41, z + zz));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const railGeo = new THREE.TubeGeometry(curve, 32, 0.045, 6, false);
    const rail = new THREE.Mesh(railGeo, matStoneDark);
    rail.castShadow = true;
    g.add(rail);
  }

  return g;
}

function makeBranchMesh(start, end, r0, r1, mat) {
  const dir = new THREE.Vector3().subVectors(end, start);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(r1, r0, len, 8, 1);
  geo.translate(0, len / 2, 0);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(start);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function createLotusPad(radius, seed) {
  const geo = new THREE.CircleGeometry(radius, 26, 0.42, Math.PI * 2 - 0.84);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const r = Math.hypot(v.x, v.y);
    const a = Math.atan2(v.y, v.x);
    const k = r / radius;
    const z = Math.sin(a * 7 + seed) * 0.030 * k + Math.pow(k, 2.2) * 0.085;
    pos.setZ(i, z);
  }
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: 0x2f6b34,
    roughness: 0.72,
    metalness: 0.02,
    side: THREE.DoubleSide,
    emissive: 0x0a1c0c,
    emissiveIntensity: 0.5
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.receiveShadow = true;
  return mesh;
}

const MIST_COUNT = 220;
const mistGeo = new THREE.BufferGeometry();
const mistPos = new Float32Array(MIST_COUNT * 3);
const mistSize = new Float32Array(MIST_COUNT);
const mistAlpha = new Float32Array(MIST_COUNT);
const mistPhase = new Float32Array(MIST_COUNT);
for (let i = 0; i < MIST_COUNT; i++) {
  mistPos[i * 3] = rnd(-14, 14);
  mistPos[i * 3 + 1] = rnd(0.03, 1.1);
  mistPos[i * 3 + 2] = rnd(-14, 12);
  mistSize[i] = rnd(0.6, 2.4);
  mistAlpha[i] = rnd(0.10, 0.42);
  mistPhase[i] = Math.random() * 6.28;
}
mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPos, 3));
mistGeo.setAttribute('aSize', new THREE.BufferAttribute(mistSize, 1));
mistGeo.setAttribute('aAlpha', new THREE.BufferAttribute(mistAlpha, 1));

const mistMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uTex: { value: glowTex },
    uTime: { value: 0 }
  },
  vertexShader: `
    attribute float aSize;
    attribute float aAlpha;
    varying float vAlpha;
    void main() {
      vAlpha = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (260.0 / max(-mv.z, 0.1));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uTex;
    varying float vAlpha;
    void main() {
      vec4 tex = texture2D(uTex, gl_PointCoord);
      gl_FragColor = vec4(0.58, 0.70, 0.90, tex.a * vAlpha * 0.55);
    }
  `
});
const mist = new THREE.Points(mistGeo, mistMat);
mist.frustumCulled = false;

const composer = new EffectComposer(renderer);
composer.setPixelRatio(DPR);
composer.setSize(window.innerWidth, window.innerHeight);

const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.68,   // strength
  0.72,   // radius
  0.86    // threshold
);
composer.addPass(bloomPass);

const outputPass = new OutputPass();
composer.addPass(outputPass);

/* ============================================================
   响应式
   ============================================================ */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);

  composer.setPixelRatio(dpr);
  composer.setSize(w, h);

  bloomPass.setSize(w, h);
}
window.addEventListener('resize', onResize);

/* ============================================================
   动画
   ============================================================ */
const clock = new THREE.Clock();
const dummyM = new THREE.Object3D();

function updatePetals(dt, t) {
  for (let i = 0; i < PETAL_COUNT; i++) {
    const p = petalData[i];

    if (p.state === 'falling') {
      p.pos.x += (p.vel.x + Math.sin(t * 1.35 + p.phase) * 0.30) * dt;
      p.pos.z += (p.vel.z + Math.cos(t * 1.05 + p.phase * 1.7) * 0.30) * dt;
      p.pos.y += p.vel.y * dt;

      p.rx += p.vrx * dt;
      p.ry += p.vry * dt;
      p.rz += p.vrz * dt;

      if (p.pos.y <= 0.022) {
        p.pos.y = 0.022;
        p.state = 'floating';
        p.floatT = 0;
        p.driftAngle = Math.random() * 6.28;
        p.rx = -Math.PI / 2 + rnd(-0.12, 0.12);
        p.ry = Math.random() * 6.28;
        p.rz = rnd(-0.12, 0.12);
      }
    } else {
      p.floatT += dt;
      p.driftAngle += dt * 0.16;
      p.pos.x += Math.cos(p.driftAngle) * 0.055 * dt;
      p.pos.z += Math.sin(p.driftAngle) * 0.055 * dt;
      p.pos.y = 0.022 + Math.sin(t * 1.6 + p.phase) * 0.006;
      p.ry += dt * 0.25;

      if (p.floatT > 9.0) {
        resetPetal(p, false);
      }
    }

    dummyM.position.copy(p.pos);
    dummyM.rotation.set(p.rx, p.ry, p.rz);
    dummyM.scale.setScalar(p.scale);
    dummyM.updateMatrix();
    petalInst.setMatrixAt(i, dummyM.matrix);
  }
  petalInst.instanceMatrix.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* 水面时间 */
  if (water.material.uniforms.uTime) {
    water.material.uniforms.uTime.value = t;
  }

  /* 桂花树随风摇曳 */
  treeGroup.rotation.z = Math.sin(t * 0.62) * 0.016 + Math.sin(t * 1.31 + 1.2) * 0.007;
  treeGroup.rotation.x = Math.cos(t * 0.51 + 0.7) * 0.012;
  treeGroup.rotation.y = Math.sin(t * 0.34) * 0.010;

  /* 花瓣 */
  updatePetals(dt, t);

  /* 灯笼轻微摇晃 + 呼吸光 */
  for (let i = 0; i < lanterns.length; i++) {
    const L = lanterns[i];
    L.group.rotation.z = Math.sin(t * 0.9 + L.phase) * 0.045;
    L.group.rotation.x = Math.cos(t * 0.75 + L.phase * 1.3) * 0.035;
    const pulse = 0.88 + Math.sin(t * 2.1 + L.phase) * 0.12;
    L.light.intensity = 7.5 * pulse;
    L.glow.material.opacity = 0.55 * pulse;
    L.body.material.emissiveIntensity = 1.45 * pulse;
  }

  /* 玉兔耳朵转动 */
  for (const e of rabbitEars) {
    const wig = Math.sin(t * 0.85 + e.side * 1.7) * 0.055
               + Math.sin(t * 2.7 + e.side * 0.9) * 0.018;
    e.pivot.rotation.z = e.baseZ + wig * e.side;
    e.pivot.rotation.x = -0.10 + Math.cos(t * 0.7 + e.side) * 0.035;
  }

  /* 锦鲤游动 */
  for (const k of koiList) {
    k.angle += k.speed * dt * 0.55;
    const x = k.cx + Math.cos(k.angle) * k.r;
    const z = k.cz + Math.sin(k.angle) * k.r * 0.78;
    const y = -0.16 + Math.sin(t * 1.4 + k.ph) * 0.035;
    k.obj.position.set(x, y, z);

    const nx = k.cx + Math.cos(k.angle + 0.08 * Math.sign(k.speed)) * k.r;
    const nz = k.cz + Math.sin(k.angle + 0.08 * Math.sign(k.speed)) * k.r * 0.78;
    k.obj.lookAt(nx, y, nz);

    k.obj.rotation.z += Math.sin(t * 2.2 + k.ph) * 0.0015;
  }

  /* 荷叶随波起伏 */
  for (const p of padMeshes) {
    p.mesh.position.y = p.baseY + Math.sin(t * 0.9 + p.phase) * 0.010;
    p.mesh.rotation.z = Math.sin(t * 0.62 + p.phase) * 0.020;
  }

  /* 雾气流动 */
  const mp = mistGeo.attributes.position;
  for (let i = 0; i < MIST_COUNT; i++) {
    let x = mp.getX(i);
    let y = mp.getY(i);
    let z = mp.getZ(i);
    x += Math.sin(t * 0.25 + mistPhase[i]) * 0.0035;
    z += Math.cos(t * 0.19 + mistPhase[i] * 1.4) * 0.0035;
    y += Math.sin(t * 0.55 + mistPhase[i] * 2.1) * 0.0009;
    if (y < 0.02) y = 0.02;
    if (y > 1.4) y = 1.4;
    mp.setXYZ(i, x, y, z);
  }
  mp.needsUpdate = true;
  mistMat.uniforms.uTime.value = t;

  /* 月晕呼吸 */
  haloMat.opacity = 0.58 + Math.sin(t * 0.7) * 0.05;
  halo2Mat.opacity = 0.20 + Math.sin(t * 0.45 + 1.1) * 0.03;

  controls.update();
  composer.render();
}

/* 启动 */
onResize();
animate();
