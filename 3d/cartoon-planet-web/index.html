<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>奇趣漫游星 - 3D 卡通漫画风活力星球</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #161224;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
    }

    /* 左上角返回按钮：半透明奶油色圆角小按钮 */
    .back-btn {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      background: rgba(255, 248, 231, 0.86);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #2b231d;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      border-radius: 999px;
      border: 2px solid rgba(43, 35, 29, 0.85);
      box-shadow: 0 3px 0 rgba(43, 35, 29, 0.85), 0 6px 16px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .back-btn:hover {
      background: rgba(255, 252, 242, 0.96);
      transform: translateY(-1px);
      box-shadow: 0 4px 0 rgba(43, 35, 29, 0.9), 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .back-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(43, 35, 29, 0.9);
    }

    /* 漫画风标题徽章 */
    .comic-badge {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 90;
      background: #ffd942;
      color: #1c162b;
      padding: 8px 16px;
      border-radius: 14px;
      border: 2.5px solid #1c162b;
      box-shadow: 4px 4px 0 #1c162b;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      transform: rotate(1.5deg);
      pointer-events: none;
    }

    .comic-badge span {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      background: #ff5964;
      color: #fff;
      border-radius: 6px;
      border: 1.5px solid #1c162b;
      font-size: 11px;
    }

    /* 底部漫画交互控制栏 */
    .hud-bar {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 8px 12px;
      background: rgba(255, 248, 231, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2.5px solid #1c162b;
      border-radius: 999px;
      box-shadow: 4px 4px 0 #1c162b, 0 10px 25px rgba(0, 0, 0, 0.35);
      max-width: 94vw;
    }

    .hud-btn {
      appearance: none;
      border: 2px solid #1c162b;
      background: #ffffff;
      color: #1c162b;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 2px 2px 0 #1c162b;
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
      white-space: nowrap;
    }

    .hud-btn:hover {
      background: #fff3b0;
      transform: translateY(-1px);
      box-shadow: 3px 3px 0 #1c162b;
    }

    .hud-btn.active {
      background: #ff5964;
      color: #ffffff;
      box-shadow: 2px 2px 0 #1c162b;
    }

    .hud-btn:active {
      transform: translateY(1px);
      box-shadow: 1px 1px 0 #1c162b;
    }

    @media (max-width: 600px) {
      .comic-badge {
        display: none;
      }
      .hud-bar {
        bottom: 14px;
        padding: 6px 9px;
        gap: 6px;
      }
      .hud-btn {
        font-size: 12px;
        padding: 5px 11px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
<style>/* 避开右下角「📜 提示词」按钮 */@media (max-width:600px){.hud-bar{bottom:76px}}</style>
</head>
<body>
  <a href="../" class="back-btn">← 返回 3D 作品</a>

  <div class="comic-badge">
    奇趣漫游星 <span>拖拽旋转 · 滚轮缩放</span>
  </div>

  <div class="hud-bar">
    <button class="hud-btn active" data-mode="orbit">🌍 全景漫游</button>
    <button class="hud-btn" data-mode="car">🚗 跟车兜风</button>
    <button class="hud-btn" data-mode="plane">✈️ 云端伴飞</button>
    <button class="hud-btn" id="toggle-time">🌞 昼夜切换</button>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ==========================================
    // 1. 初始化场景、相机、渲染器与控制器
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b1530);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(0, 12, 31);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 12.2;
    controls.maxDistance = 65;
    controls.rotateSpeed = 0.85;
    controls.zoomSpeed = 1.0;

    // 漫游星球主容器
    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    const INK_COLOR = 0x1a1426;
    const PLANET_RADIUS = 10.0;

    // ==========================================
    // 2. 程序化漫画贴图与色阶生成器
    // ==========================================
    function createToonGradientTexture(steps = [65, 135, 210, 255]) {
      const canvas = document.createElement('canvas');
      canvas.width = steps.length;
      canvas.height = 1;
      const ctx = canvas.getContext('2d');
      steps.forEach((val, i) => {
        ctx.fillStyle = `rgb(${val},${val},${val})`;
        ctx.fillRect(i, 0, 1, 1);
      });
      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.NearestFilter;
      texture.magFilter = THREE.NearestFilter;
      texture.generateMipmaps = false;
      return texture;
    }

    const toonGradient = createToonGradientTexture([70, 145, 220, 255]);
    const softToonGradient = createToonGradientTexture([95, 165, 225, 255]);

    // 漫画描边材质缓存
    const outlineMatCache = new Map();
    function getOutlineMaterial(thickness = 1.045, color = INK_COLOR) {
      const key = `${thickness}_${color}`;
      if (!outlineMatCache.has(key)) {
        outlineMatCache.set(
          key,
          new THREE.MeshBasicMaterial({
            color,
            side: THREE.BackSide
          })
        );
      }
      return outlineMatCache.get(key);
    }

    // 为网格添加反面漫画黑边
    function addComicOutline(mesh, scaleFactor = 1.06, color = INK_COLOR) {
      const outline = new THREE.Mesh(mesh.geometry, getOutlineMaterial(scaleFactor, color));
      outline.scale.setScalar(scaleFactor);
      mesh.add(outline);
      return outline;
    }

    // 为建筑方块添加硬朗漫画墨线
    const edgeLineMaterial = new THREE.LineBasicMaterial({ color: INK_COLOR });
    function addBoxInkLines(mesh) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 25);
      const line = new THREE.LineSegments(edges, edgeLineMaterial);
      mesh.add(line);
      return line;
    }

    // 生成程序化建筑立面贴图（白天颜色 + 夜晚发光贴图）
    function createBuildingMaterials(baseHex, windowCols = 3, windowRows = 6) {
      const w = 128;
      const h = 256;
      const diffCanvas = document.createElement('canvas');
      diffCanvas.width = w;
      diffCanvas.height = h;
      const dCtx = diffCanvas.getContext('2d');

      const emiCanvas = document.createElement('canvas');
      emiCanvas.width = w;
      emiCanvas.height = h;
      const eCtx = emiCanvas.getContext('2d');

      // 背景墙面
      dCtx.fillStyle = baseHex;
      dCtx.fillRect(0, 0, w, h);

      // 漫画水平装饰线条
      dCtx.fillStyle = 'rgba(26, 20, 38, 0.16)';
      dCtx.fillRect(0, 0, w, 14);
      dCtx.fillRect(0, h - 18, w, 18);

      // 发光底色全黑
      eCtx.fillStyle = '#000000';
      eCtx.fillRect(0, 0, w, h);

      const padX = 14;
      const padY = 24;
      const cellW = (w - padX * 2) / windowCols;
      const cellH = (h - padY * 2) / windowRows;

      for (let r = 0; r < windowRows; r++) {
        for (let c = 0; c < windowCols; c++) {
          const wx = padX + c * cellW + 4;
          const wy = padY + r * cellH + 5;
          const ww = cellW - 8;
          const wh = cellH - 10;

          const isLit = Math.sin(r * 17.3 + c * 31.7 + baseHex.charCodeAt(1)) > -0.15;

          // 窗框黑边
          dCtx.fillStyle = '#1a1426';
          dCtx.fillRect(wx - 2, wy - 2, ww + 4, wh + 4);

          // 白天窗户反光与亮灯色
          dCtx.fillStyle = isLit ? '#fff1a8' : '#5887b8';
          dCtx.fillRect(wx, wy, ww, wh);

          // 漫画高光斜杠
          dCtx.fillStyle = 'rgba(255,255,255,0.45)';
          dCtx.fillRect(wx + 2, wy + 2, ww * 0.35, wh - 4);

          if (isLit) {
            eCtx.fillStyle = Math.random() > 0.3 ? '#ffe066' : '#ff9f43';
            eCtx.fillRect(wx, wy, ww, wh);
          }
        }
      }

      const diffTex = new THREE.CanvasTexture(diffCanvas);
      diffTex.colorSpace = THREE.SRGBColorSpace;
      diffTex.magFilter = THREE.NearestFilter;

      const emiTex = new THREE.CanvasTexture(emiCanvas);
      emiTex.colorSpace = THREE.SRGBColorSpace;
      emiTex.magFilter = THREE.NearestFilter;

      const sideMat = new THREE.MeshToonMaterial({
        map: diffTex,
        emissive: new THREE.Color(0xffd166),
        emissiveMap: emiTex,
        emissiveIntensity: 0.2,
        gradientMap: toonGradient
      });

      const roofMat = new THREE.MeshToonMaterial({
        color: new THREE.Color(baseHex).offsetHSL(0, -0.05, -0.12),
        gradientMap: toonGradient
      });

      return { sideMat, roofMat };
    }

    // 生成漫画公路贴图
    function createRoadTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // 柏油路面底色
      ctx.fillStyle = '#383649';
      ctx.fillRect(0, 0, 128, 256);

      // 路肩墨线与黄色边线
      ctx.fillStyle = '#1a1426';
      ctx.fillRect(0, 0, 10, 256);
      ctx.fillRect(118, 0, 10, 256);

      ctx.fillStyle = '#ffd166';
      ctx.fillRect(12, 0, 6, 256);
      ctx.fillRect(110, 0, 6, 256);

      // 中央白色虚线
      ctx.fillStyle = '#fff9eb';
      for (let y = 12; y < 256; y += 64) {
        ctx.fillRect(60, y, 8, 36);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 36);
      return tex;
    }

    // 生成漫画海洋波纹网点贴图
    function createOceanTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#24a8e8';
      ctx.fillRect(0, 0, 512, 256);

      // 漫画半调圆点与白色波浪短线
      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      for (let y = 12; y < 256; y += 24) {
        for (let x = (y % 48 === 0 ? 12 : 0); x < 512; x += 32) {
          ctx.beginPath();
          ctx.arc(x, y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      for (let i = 0; i < 45; i++) {
        const rx = (i * 73) % 480 + 16;
        const ry = (i * 41) % 230 + 12;
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.quadraticCurveTo(rx + 8, ry - 4, rx + 16, ry);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 2);
      return tex;
    }

    // ==========================================
    // 3. 光照与太空背景（太阳、月亮、繁星）
    // ==========================================
    const ambientLight = new THREE.AmbientLight(0xfffaed, 0.95);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xfff6d6, 0x3b2d54, 0.65);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff4d2, 2.1);
    sunLight.position.set(28, 22, 24);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 70;
    const d = 16;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0015;
    scene.add(sunLight);

    // 太空太阳与月亮天体组
    const celestialGroup = new THREE.Group();
    scene.add(celestialGroup);

    // 卡通太阳
    const sunGroup = new THREE.Group();
    sunGroup.position.set(42, 28, 32);
    celestialGroup.add(sunGroup);

    const sunCore = new THREE.Mesh(
      new THREE.IcosahedronGeometry(3.6, 2),
      new THREE.MeshBasicMaterial({ color: 0xffd93d })
    );
    addComicOutline(sunCore, 1.08, INK_COLOR);
    sunGroup.add(sunCore);

    // 太阳光芒三角片
    const rayGeo = new THREE.ConeGeometry(0.65, 1.7, 4);
    const rayMat = new THREE.MeshBasicMaterial({ color: 0xff9f1c });
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const ray = new THREE.Mesh(rayGeo, rayMat);
      ray.position.set(Math.cos(angle) * 4.8, Math.sin(angle) * 4.8, 0);
      ray.rotation.z = angle - Math.PI / 2;
      addComicOutline(ray, 1.12, INK_COLOR);
      sunGroup.add(ray);
    }

    // 卡通月亮
    const moonGroup = new THREE.Group();
    moonGroup.position.set(-42, -24, -30);
    celestialGroup.add(moonGroup);

    const moonMesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(2.6, 2),
      new THREE.MeshToonMaterial({
        color: 0xf4f1de,
        emissive: 0x4a4e69,
        emissiveIntensity: 0.4,
        gradientMap: toonGradient
      })
    );
    addComicOutline(moonMesh, 1.08, INK_COLOR);
    moonGroup.add(moonMesh);

    // 漫画星空背景粒子
    const starCount = 320;
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);
    const paletteStars = [
      new THREE.Color(0xffffff),
      new THREE.Color(0xffe66d),
      new THREE.Color(0x7bdff2),
      new THREE.Color(0xff99c8)
    ];

    for (let i = 0; i < starCount; i++) {
      const r = 75 + Math.random() * 65;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPositions[i * 3 + 2] = r * Math.cos(phi);

      const c = paletteStars[i % paletteStars.length];
      starColors[i * 3] = c.r;
      starColors[i * 3 + 1] = c.g;
      starColors[i * 3 + 2] = c.b;
    }

    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
    const starMat = new THREE.PointsMaterial({
      size: 0.75,
      vertexColors: true,
      transparent: true,
      opacity: 0.9
    });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    // ==========================================
    // 4. 球面地形高度函数与环形公路系统
    // ==========================================
    // 连续伪随机球面高度噪声
    function rawSphericalNoise(dir) {
      const x = dir.x;
      const y = dir.y;
      const z = dir.z;

      let n = 0;
      n += Math.sin(x * 2.6 + z * 1.9) * Math.cos(y * 2.4 - x * 1.5) * 0.55;
      n += Math.sin(y * 4.3 - z * 3.2 + 1.1) * Math.cos(x * 3.8 + y * 2.2) * 0.32;
      n += Math.sin(z * 7.5 + x * 6.2 - y * 5.1) * 0.16;
      n += Math.cos(x * 11.0 - y * 9.5 + z * 8.0) * 0.07;

      // 让大陆与海洋分布更鲜明
      return n + 0.08;
    }

    // 定义两条环绕星球的蜿蜒闭合公路环线
    const roadLoops = [];

    function createRoadLoop(samples, evalDirFn) {
      const pointsDir = [];
      const rawRadii = [];

      for (let i = 0; i < samples; i++) {
        const t = (i / samples) * Math.PI * 2;
        const dir = evalDirFn(t).normalize();
        pointsDir.push(dir);

        const h = rawSphericalNoise(dir);
        // 在陆地上贴合地形，在海洋上方架起跨海高架桥
        const targetR = h > 0.08 ? PLANET_RADIUS + Math.min(h * 0.75, 0.52) + 0.08 : PLANET_RADIUS + 0.34;
        rawRadii.push(targetR);
      }

      // 对公路高度进行多轮平滑滤波，保证车辆行驶平顺
      let smoothedRadii = [...rawRadii];
      for (let pass = 0; pass < 6; pass++) {
        const next = [];
        for (let i = 0; i < samples; i++) {
          const prev = smoothedRadii[(i - 1 + samples) % samples];
          const curr = smoothedRadii[i];
          const nxt = smoothedRadii[(i + 1) % samples];
          next.push(prev * 0.25 + curr * 0.5 + nxt * 0.25);
        }
        smoothedRadii = next;
      }

      const frames = [];
      for (let i = 0; i < samples; i++) {
        const dir = pointsDir[i];
        const r = smoothedRadii[i];
        const pos = dir.clone().multiplyScalar(r);
        frames.push({ dir, r, pos });
      }

      for (let i = 0; i < samples; i++) {
        const prevPos = frames[(i - 1 + samples) % samples].pos;
        const nextPos = frames[(i + 1) % samples].pos;
        const up = frames[i].dir.clone();
        const forward = nextPos.clone().sub(prevPos).normalize();
        const right = new THREE.Vector3().crossVectors(forward, up).normalize();
        forward.crossVectors(up, right).normalize();
        frames[i].up = up;
        frames[i].forward = forward;
        frames[i].right = right;
      }

      return { samples, frames };
    }

    // 1号公路：赤道微波形黄金环线
    roadLoops.push(
      createRoadLoop(240, (t) => {
        const lat = 0.32 * Math.sin(2 * t) + 0.14 * Math.cos(3 * t);
        const cosLat = Math.cos(lat);
        return new THREE.Vector3(cosLat * Math.cos(t), Math.sin(lat), cosLat * Math.sin(t));
      })
    );

    // 2号公路：倾角交错的南北纵贯环线
    const tiltQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(1.08, 0.45, 0.32));
    roadLoops.push(
      createRoadLoop(240, (t) => {
        const lat = 0.26 * Math.cos(2 * t - 0.6);
        const cosLat = Math.cos(lat);
        const v = new THREE.Vector3(cosLat * Math.cos(t), Math.sin(lat), cosLat * Math.sin(t));
        return v.applyQuaternion(tiltQuat);
      })
    );

    // 查询任意球面方向距离公路的最近信息
    function getNearestRoadInfo(dir) {
      let minDist = Infinity;
      let nearestFrame = null;

      for (let l = 0; l < roadLoops.length; l++) {
        const frames = roadLoops[l].frames;
        // 粗略步进加速 + 局部精查
        for (let i = 0; i < frames.length; i += 2) {
          const d = dir.distanceTo(frames[i].dir);
          if (d < minDist) {
            minDist = d;
            nearestFrame = frames[i];
          }
        }
      }
      return { minDist, nearestFrame };
    }

    // 综合地形高度：融合自然起伏、高山与公路路基平整
    function getPlanetSurfaceRadius(dir) {
      const rawH = rawSphericalNoise(dir);
      const { minDist, nearestFrame } = getNearestRoadInfo(dir);

      let height = rawH;
      if (height > 0.42) {
        // 高山区域隆起放大
        height = 0.42 + Math.pow(height - 0.42, 1.25) * 1.75;
      } else if (height > 0) {
        height *= 0.85;
      } else {
        height *= 0.65;
      }

      // 如果在陆地且靠近公路，将地形平滑过渡到公路路基高度
      if (rawH > 0.06 && minDist < 0.11 && nearestFrame) {
        const roadBaseH = nearestFrame.r - PLANET_RADIUS - 0.025;
        const blend = THREE.MathUtils.smoothstep(minDist, 0.032, 0.11);
        height = THREE.MathUtils.lerp(roadBaseH, height, blend);
      }

      return {
        radius: PLANET_RADIUS + height,
        height,
        rawH,
        roadDist: minDist
      };
    }

    // ==========================================
    // 5. 构建星球主体（海洋球 + 漫画描边 + 大陆地形）
    // ==========================================
    // 5.1 海洋球体
    const oceanTex = createOceanTexture();
    const oceanGeo = new THREE.SphereGeometry(PLANET_RADIUS, 64, 48);
    const oceanMat = new THREE.MeshToonMaterial({
      color: 0xffffff,
      map: oceanTex,
      gradientMap: softToonGradient
    });
    const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
    oceanMesh.receiveShadow = true;
    worldGroup.add(oceanMesh);

    // 星球整体漫画粗外轮廓线
    const planetOutline = new THREE.Mesh(
      new THREE.SphereGeometry(PLANET_RADIUS + 0.14, 48, 36),
      new THREE.MeshBasicMaterial({ color: INK_COLOR, side: THREE.BackSide })
    );
    worldGroup.add(planetOutline);

    // 5.2 大陆与高山彩色网格
    const landGeo = new THREE.IcosahedronGeometry(PLANET_RADIUS, 36);
    const posAttr = landGeo.attributes.position;
    const vertexCount = posAttr.count;
    const colorsAttr = new Float32Array(vertexCount * 3);

    const cDeepSea = new THREE.Color(0x168aad);
    const cFoam = new THREE.Color(0xe0fbfc);
    const cSand = new THREE.Color(0xffe599);
    const cGrass = new THREE.Color(0x52b788);
    const cLush = new THREE.Color(0x40916c);
    const cRock = new THREE.Color(0x8d869c);
    const cSnow = new THREE.Color(0xffffff);

    const tempVec = new THREE.Vector3();
    const tempCol = new THREE.Color();

    for (let i = 0; i < vertexCount; i++) {
      tempVec.fromBufferAttribute(posAttr, i).normalize();
      const info = getPlanetSurfaceRadius(tempVec);
      posAttr.setXYZ(i, tempVec.x * info.radius, tempVec.y * info.radius, tempVec.z * info.radius);

      const h = info.height;
      if (h < -0.02) {
        tempCol.copy(cDeepSea);
      } else if (h < 0.038) {
        tempCol.copy(cFoam);
      } else if (h < 0.12) {
        tempCol.copy(cSand);
      } else if (h < 0.36) {
        tempCol.copy(cGrass);
      } else if (h < 0.56) {
        tempCol.copy(cLush);
      } else if (h < 0.92) {
        tempCol.copy(cRock);
      } else {
        tempCol.copy(cSnow);
      }

      colorsAttr[i * 3] = tempCol.r;
      colorsAttr[i * 3 + 1] = tempCol.g;
      colorsAttr[i * 3 + 2] = tempCol.b;
    }

    landGeo.setAttribute('color', new THREE.BufferAttribute(colorsAttr, 3));
    landGeo.computeVertexNormals();

    const landMat = new THREE.MeshToonMaterial({
      vertexColors: true,
      gradientMap: toonGradient
    });
    const landMesh = new THREE.Mesh(landGeo, landMat);
    landMesh.castShadow = true;
    landMesh.receiveShadow = true;
    worldGroup.add(landMesh);

    // ==========================================
    // 6. 构建环绕星球的公路网格与跨海大桥桥墩
    // ==========================================
    const roadTex = createRoadTexture();
    const roadMat = new THREE.MeshToonMaterial({
      map: roadTex,
      gradientMap: toonGradient
    });
    const pillarMat = new THREE.MeshToonMaterial({
      color: 0xd8d4e3,
      gradientMap: toonGradient
    });
    const archRailMat = new THREE.MeshToonMaterial({
      color: 0xff5964,
      gradientMap: toonGradient
    });

    const ROAD_HALF_WIDTH = 0.24;
    const ROAD_THICKNESS = 0.045;

    roadLoops.forEach((loop) => {
      const N = loop.samples;
      const frames = loop.frames;

      const positions = [];
      const normals = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= N; i++) {
        const f = frames[i % N];
        const vCoord = i / N;

        const topL = f.pos
          .clone()
          .addScaledVector(f.right, -ROAD_HALF_WIDTH)
          .addScaledVector(f.up, ROAD_THICKNESS);
        const topR = f.pos
          .clone()
          .addScaledVector(f.right, ROAD_HALF_WIDTH)
          .addScaledVector(f.up, ROAD_THICKNESS);

        positions.push(topL.x, topL.y, topL.z, topR.x, topR.y, topR.z);
        normals.push(f.up.x, f.up.y, f.up.z, f.up.x, f.up.y, f.up.z);
        uvs.push(0, vCoord, 1, vCoord);

        if (i < N) {
          const a = i * 2;
          const b = a + 1;
          const c = a + 2;
          const d = a + 3;
          indices.push(a, b, c, b, d, c);
        }

        // 在跨海或低谷路段生成桥墩与红色护栏拱架
        if (i < N && i % 6 === 0) {
          const groundInfo = getPlanetSurfaceRadius(f.dir);
          if (f.r - groundInfo.radius > 0.14) {
            const pillarLen = f.r - PLANET_RADIUS + 0.35;
            const pillar = new THREE.Mesh(
              new THREE.CylinderGeometry(0.055, 0.075, pillarLen, 8),
              pillarMat
            );
            const midR = f.r - pillarLen * 0.5;
            pillar.position.copy(f.dir).multiplyScalar(midR);
            pillar.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), f.up);
            addComicOutline(pillar, 1.15, INK_COLOR);
            worldGroup.add(pillar);

            // 跨海大桥两侧漫画红色护栏立柱
            [-1, 1].forEach((side) => {
              const post = new THREE.Mesh(
                new THREE.BoxGeometry(0.04, 0.16, 0.22),
                archRailMat
              );
              const m = new THREE.Matrix4().makeBasis(f.right, f.up, f.forward);
              post.quaternion.setFromRotationMatrix(m);
              post.position
                .copy(f.pos)
                .addScaledVector(f.right, side * (ROAD_HALF_WIDTH - 0.02))
                .addScaledVector(f.up, 0.08);
              addBoxInkLines(post);
              worldGroup.add(post);
            });
          }
        }
      }

      const rGeo = new THREE.BufferGeometry();
      rGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      rGeo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      rGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      rGeo.setIndex(indices);

      const rMesh = new THREE.Mesh(rGeo, roadMat);
      rMesh.receiveShadow = true;
      worldGroup.add(rMesh);
    });

    // ==========================================
    // 7. 城市建筑群、漫画山峰、森林树木与海面帆船
    // ==========================================
    // 预生成 6 套不同色彩风格的漫画建筑材质
    const buildingPalettes = ['#ff6b6b', '#ffd166', '#4ecdc4', '#a29bfe', '#ff9f43', '#f8a5c2'];
    const buildingMatSets = buildingPalettes.map((hex, idx) =>
      createBuildingMaterials(hex, idx % 2 === 0 ? 3 : 4, 5 + (idx % 3))
    );

    const nightEmissiveMaterials = [];
    buildingMatSets.forEach((set) => nightEmissiveMaterials.push(set.sideMat));

    // 路灯发光材质
    const lampBulbMat = new THREE.MeshBasicMaterial({ color: 0xffe66d });

    // 辅助函数：将对象对齐到星球表面法线
    function alignToSurface(obj, dir, radius) {
      obj.position.copy(dir).multiplyScalar(radius);
      const up = new THREE.Vector3(0, 1, 0);
      obj.quaternion.setFromUnitVectors(up, dir);
      obj.rotateY(Math.random() * Math.PI * 2);
    }

    // 创建一栋漫画城市建筑
    function createCartoonBuilding(dir, surfaceR, scaleMultiplier = 1.0) {
      const group = new THREE.Group();
      const set = buildingMatSets[Math.floor(Math.random() * buildingMatSets.length)];

      const w = (0.36 + Math.random() * 0.26) * scaleMultiplier;
      const d = (0.36 + Math.random() * 0.26) * scaleMultiplier;
      const h = (0.65 + Math.random() * 1.15) * scaleMultiplier;

      const bodyGeo = new THREE.BoxGeometry(w, h, d);
      bodyGeo.translate(0, h * 0.5 - 0.08, 0);
      const bodyMats = [
        set.sideMat,
        set.sideMat,
        set.roofMat,
        set.roofMat,
        set.sideMat,
        set.sideMat
      ];
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMats);
      bodyMesh.castShadow = true;
      bodyMesh.receiveShadow = true;
      addBoxInkLines(bodyMesh);
      group.add(bodyMesh);

      // 屋顶天台细节（水塔 / 信号塔 / 二层阁楼）
      const roofType = Math.random();
      if (roofType < 0.45) {
        const topW = w * 0.62;
        const topH = 0.24;
        const topGeo = new THREE.BoxGeometry(topW, topH, d * 0.62);
        topGeo.translate(0, h + topH * 0.5 - 0.08, 0);
        const topMesh = new THREE.Mesh(topGeo, set.roofMat);
        addBoxInkLines(topMesh);
        group.add(topMesh);

        // 天线与闪烁红灯
        const antGeo = new THREE.CylinderGeometry(0.015, 0.02, 0.38, 6);
        antGeo.translate(0, h + topH + 0.1, 0);
        const ant = new THREE.Mesh(antGeo, new THREE.MeshBasicMaterial({ color: INK_COLOR }));
        group.add(ant);

        const beacon = new THREE.Mesh(
          new THREE.SphereGeometry(0.045, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xff3b30 })
        );
        beacon.position.set(0, h + topH + 0.3, 0);
        group.add(beacon);
      } else if (roofType < 0.8) {
        // 漫画风屋顶水塔
        const tank = new THREE.Mesh(
          new THREE.CylinderGeometry(0.11, 0.11, 0.2, 10),
          new THREE.MeshToonMaterial({ color: 0xd4a373, gradientMap: toonGradient })
        );
        tank.position.set(w * 0.15, h + 0.06, d * 0.15);
        addComicOutline(tank, 1.12, INK_COLOR);
        group.add(tank);

        const cone = new THREE.Mesh(
          new THREE.ConeGeometry(0.13, 0.1, 10),
          new THREE.MeshToonMaterial({ color: 0xe63946, gradientMap: toonGradient })
        );
        cone.position.set(w * 0.15, h + 0.21, d * 0.15);
        addComicOutline(cone, 1.12, INK_COLOR);
        group.add(cone);
      }

      alignToSurface(group, dir, surfaceR);
      worldGroup.add(group);
    }

    // 创建漫画风立体山峰（带雪顶与墨线轮廓）
    const rockMountainMat = new THREE.MeshToonMaterial({
      color: 0x7f7994,
      gradientMap: toonGradient
    });
    const snowCapMat = new THREE.MeshToonMaterial({
      color: 0xffffff,
      gradientMap: toonGradient
    });

    function createCartoonMountain(dir, surfaceR) {
      const group = new THREE.Group();
      const baseR = 0.45 + Math.random() * 0.38;
      const peakH = 0.85 + Math.random() * 0.75;

      const rockGeo = new THREE.ConeGeometry(baseR, peakH, 7);
      rockGeo.translate(0, peakH * 0.42, 0);
      const rockMesh = new THREE.Mesh(rockGeo, rockMountainMat);
      rockMesh.castShadow = true;
      rockMesh.receiveShadow = true;
      addComicOutline(rockMesh, 1.06, INK_COLOR);
      group.add(rockMesh);

      // 山顶积雪帽
      const capR = baseR * 0.46;
      const capH = peakH * 0.44;
      const capGeo = new THREE.ConeGeometry(capR, capH, 7);
      capGeo.translate(0, peakH * 0.92 - capH * 0.48 + 0.02, 0);
      const capMesh = new THREE.Mesh(capGeo, snowCapMat);
      addComicOutline(capMesh, 1.07, INK_COLOR);
      group.add(capMesh);

      alignToSurface(group, dir, surfaceR - 0.08);
      worldGroup.add(group);
    }

    // 创建漫画风树木（松树 & 蓬松圆树）
    const trunkMat = new THREE.MeshToonMaterial({ color: 0x7f4f24, gradientMap: toonGradient });
    const foliageColors = [0x2ec4b6, 0x52b788, 0x80ed99, 0xff99c8, 0xffbe0b];
    const foliageMats = foliageColors.map(
      (c) => new THREE.MeshToonMaterial({ color: c, gradientMap: toonGradient })
    );

    function createCartoonTree(dir, surfaceR, isPine = false) {
      const group = new THREE.Group();
      const scale = 0.75 + Math.random() * 0.55;

      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.065, 0.26, 7), trunkMat);
      trunk.position.y = 0.1;
      addComicOutline(trunk, 1.15, INK_COLOR);
      group.add(trunk);

      const fMat = foliageMats[Math.floor(Math.random() * foliageMats.length)];

      if (isPine) {
        const c1 = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.36, 7), fMat);
        c1.position.y = 0.32;
        addComicOutline(c1, 1.09, INK_COLOR);
        group.add(c1);

        const c2 = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.3, 7), fMat);
        c2.position.y = 0.5;
        addComicOutline(c2, 1.09, INK_COLOR);
        group.add(c2);
      } else {
        const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 1), fMat);
        crown.position.y = 0.34;
        addComicOutline(crown, 1.09, INK_COLOR);
        group.add(crown);

        const sub = new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 1), fMat);
        sub.position.set(0.1, 0.28, 0.06);
        addComicOutline(sub, 1.1, INK_COLOR);
        group.add(sub);
      }

      group.scale.setScalar(scale);
      alignToSurface(group, dir, surfaceR);
      worldGroup.add(group);
    }

    // 创建海面卡通小帆船
    const boats = [];
    function createSailboat(dir) {
      const group = new THREE.Group();

      const hull = new THREE.Mesh(
        new THREE.BoxGeometry(0.22, 0.1, 0.42),
        new THREE.MeshToonMaterial({ color: 0xff595e, gradientMap: toonGradient })
      );
      hull.position.y = 0.03;
      addBoxInkLines(hull);
      group.add(hull);

      const mast = new THREE.Mesh(
        new THREE.CylinderGeometry(0.015, 0.015, 0.38, 6),
        new THREE.MeshBasicMaterial({ color: INK_COLOR })
      );
      mast.position.y = 0.22;
      group.add(mast);

      const sailGeo = new THREE.ConeGeometry(0.16, 0.32, 3);
      const sail = new THREE.Mesh(
        sailGeo,
        new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: toonGradient })
      );
      sail.position.set(0, 0.24, 0.02);
      sail.rotation.y = Math.PI / 4;
      addComicOutline(sail, 1.08, INK_COLOR);
      group.add(sail);

      alignToSurface(group, dir, PLANET_RADIUS);
      worldGroup.add(group);
      boats.push({ group, dir: dir.clone(), phase: Math.random() * Math.PI * 2 });
    }

    // 使用斐波那契球面分布算法在星球上均匀布置山脉、城市建筑、森林与帆船
    const fibCount = 920;
    const goldenRatio = (1 + Math.sqrt(5)) / 2;

    for (let i = 0; i < fibCount; i++) {
      const theta = (2 * Math.PI * i) / goldenRatio;
      const phi = Math.acos(1 - (2 * (i + 0.5)) / fibCount);
      const dir = new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta),
        Math.cos(phi),
        Math.sin(phi) * Math.sin(theta)
      ).normalize();

      const info = getPlanetSurfaceRadius(dir);

      // 避开路面及紧邻路肩区域
      if (info.roadDist < 0.048) continue;

      if (info.height > 0.62) {
        if (Math.random() < 0.68) {
          createCartoonMountain(dir, info.radius);
        }
      } else if (info.height > 0.13 && info.roadDist < 0.21) {
        // 沿公路两侧形成繁华的漫画城市街区
        if (Math.random() < 0.72) {
          const tallFactor = info.roadDist < 0.11 ? 1.18 : 0.88;
          createCartoonBuilding(dir, info.radius, tallFactor);
        } else {
          createCartoonTree(dir, info.radius, false);
        }
      } else if (info.height > 0.14 && info.height <= 0.62) {
        if (Math.random() < 0.62) {
          createCartoonTree(dir, info.radius, info.height > 0.42);
        }
      } else if (info.height < -0.18 && info.roadDist > 0.14) {
        if (boats.length < 10 && Math.random() < 0.06) {
          createSailboat(dir);
        }
      }
    }

    // 在公路沿线布置卡通街灯
    roadLoops.forEach((loop) => {
      const frames = loop.frames;
      for (let i = 0; i < frames.length; i += 10) {
        const f = frames[i];
        const side = (i / 10) % 2 === 0 ? 1 : -1;
        const lampGroup = new THREE.Group();

        const pole = new THREE.Mesh(
          new THREE.CylinderGeometry(0.015, 0.02, 0.34, 6),
          new THREE.MeshBasicMaterial({ color: INK_COLOR })
        );
        pole.position.y = 0.17;
        lampGroup.add(pole);

        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), lampBulbMat);
        bulb.position.y = 0.35;
        addComicOutline(bulb, 1.18, INK_COLOR);
        lampGroup.add(bulb);

        const m = new THREE.Matrix4().makeBasis(f.right, f.up, f.forward);
        lampGroup.quaternion.setFromRotationMatrix(m);
        lampGroup.position
          .copy(f.pos)
          .addScaledVector(f.right, side * (ROAD_HALF_WIDTH + 0.05))
          .addScaledVector(f.up, 0.02);

        worldGroup.add(lampGroup);
      }
    });

    // ==========================================
    // 8. 漫游汽车系统（双车道、多种车型、尾气泡泡）
    // ==========================================
    const cars = [];
    const carColors = [0xff595e, 0xffca3a, 0x1982c4, 0x8ac926, 0xff924c, 0xc77dff];
    const wheelGeo = new THREE.CylinderGeometry(0.048, 0.048, 0.04, 10);
    wheelGeo.rotateZ(Math.PI / 2);
    const wheelMat = new THREE.MeshBasicMaterial({ color: INK_COLOR });
    const headlightMat = new THREE.MeshBasicMaterial({ color: 0xfff3b0 });
    const windshieldMat = new THREE.MeshToonMaterial({
      color: 0x90e0ef,
      gradientMap: toonGradient
    });

    function createCartoonVehicle(typeIndex, colorHex) {
      const carGroup = new THREE.Group();
      const bodyMat = new THREE.MeshToonMaterial({ color: colorHex, gradientMap: toonGradient });

      if (typeIndex % 3 === 0) {
        // 卡通双层巴士 / 城市公交
        const chassis = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.18, 0.36), bodyMat);
        chassis.position.y = 0.12;
        addBoxInkLines(chassis);
        carGroup.add(chassis);

        const glass = new THREE.Mesh(new THREE.BoxGeometry(0.176, 0.07, 0.32), windshieldMat);
        glass.position.y = 0.14;
        carGroup.add(glass);
      } else if (typeIndex % 3 === 1) {
        // 卡通小货车
        const cab = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.13, 0.14), bodyMat);
        cab.position.set(0, 0.1, 0.09);
        addBoxInkLines(cab);
        carGroup.add(cab);

        const cargo = new THREE.Mesh(
          new THREE.BoxGeometry(0.165, 0.17, 0.2),
          new THREE.MeshToonMaterial({ color: 0xfff8e7, gradientMap: toonGradient })
        );
        cargo.position.set(0, 0.12, -0.07);
        addBoxInkLines(cargo);
        carGroup.add(cargo);
      } else {
        // 卡通圆润小轿车
        const lower = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.085, 0.3), bodyMat);
        lower.position.y = 0.075;
        addBoxInkLines(lower);
        carGroup.add(lower);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.135, 0.075, 0.16), windshieldMat);
        cabin.position.set(0, 0.145, -0.01);
        addBoxInkLines(cabin);
        carGroup.add(cabin);
      }

      // 四个车轮
      const wheelOffsets = [
        [-0.08, 0.045, 0.09],
        [0.08, 0.045, 0.09],
        [-0.08, 0.045, -0.09],
        [0.08, 0.045, -0.09]
      ];
      wheelOffsets.forEach(([wx, wy, wz]) => {
        const w = new THREE.Mesh(wheelGeo, wheelMat);
        w.position.set(wx, wy, wz);
        carGroup.add(w);
      });

      // 车头灯
      [-0.05, 0.05].forEach((lx) => {
        const light = new THREE.Mesh(new THREE.SphereGeometry(0.024, 6, 6), headlightMat);
        light.position.set(lx, 0.08, 0.16);
        carGroup.add(light);
      });

      return carGroup;
    }

    // 在两条环线公路上生成 18 辆双向行驶的汽车
    roadLoops.forEach((loop, loopIdx) => {
      const count = 9;
      for (let i = 0; i < count; i++) {
        const dirSign = i % 2 === 0 ? 1 : -1;
        const laneOffset = dirSign * 0.1;
        const color = carColors[(i + loopIdx * 3) % carColors.length];
        const mesh = createCartoonVehicle(i, color);
        worldGroup.add(mesh);

        cars.push({
          mesh,
          loop,
          t: (i / count) * loop.samples,
          speed: (9.5 + (i % 3) * 2.2) * dirSign,
          dirSign,
          laneOffset,
          bouncePhase: Math.random() * Math.PI * 2
        });
      }
    });

    // ==========================================
    // 9. 翱翔飞机与漫画尾迹粒子系统
    // ==========================================
    const planes = [];
    const puffParticles = [];
    const puffGeo = new THREE.IcosahedronGeometry(0.09, 1);
    const puffMat = new THREE.MeshToonMaterial({
      color: 0xffffff,
      gradientMap: softToonGradient
    });

    function spawnPuff(worldPos, initialScale = 1.0) {
      let p = puffParticles.find((item) => !item.active);
      if (!p) {
        if (puffParticles.length >= 90) return;
        const m = new THREE.Mesh(puffGeo, puffMat);
        addComicOutline(m, 1.12, INK_COLOR);
        worldGroup.add(m);
        p = { mesh: m, active: false, age: 0, maxAge: 1.2, scale: 1 };
        puffParticles.push(p);
      }
      p.active = true;
      p.age = 0;
      p.maxAge = 0.9 + Math.random() * 0.5;
      p.scale = initialScale;
      p.mesh.visible = true;
      p.mesh.position.copy(worldPos);
      p.mesh.scale.setScalar(initialScale);
    }

    function createCartoonPlane(bodyColorHex, wingColorHex) {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshToonMaterial({ color: bodyColorHex, gradientMap: toonGradient });
      const wingMat = new THREE.MeshToonMaterial({ color: wingColorHex, gradientMap: toonGradient });

      // 机身
      const fuselageGeo = new THREE.CylinderGeometry(0.13, 0.08, 0.72, 10);
      fuselageGeo.rotateX(Math.PI / 2);
      const fuselage = new THREE.Mesh(fuselageGeo, bodyMat);
      fuselage.castShadow = true;
      addComicOutline(fuselage, 1.08, INK_COLOR);
      group.add(fuselage);

      // 机头整流罩
      const nose = new THREE.Mesh(
        new THREE.SphereGeometry(0.132, 10, 10),
        new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: toonGradient })
      );
      nose.position.z = 0.36;
      addComicOutline(nose, 1.08, INK_COLOR);
      group.add(nose);

      // 主机翼
      const mainWing = new THREE.Mesh(new THREE.BoxGeometry(1.12, 0.045, 0.24), wingMat);
      mainWing.position.set(0, 0.03, 0.06);
      mainWing.castShadow = true;
      addBoxInkLines(mainWing);
      group.add(mainWing);

      // 驾驶舱玻璃罩
      const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), windshieldMat);
      cockpit.scale.set(0.9, 0.8, 1.4);
      cockpit.position.set(0, 0.11, 0.05);
      addComicOutline(cockpit, 1.1, INK_COLOR);
      group.add(cockpit);

      // 尾翼
      const tailFin = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.22, 0.18), wingMat);
      tailFin.position.set(0, 0.12, -0.28);
      addBoxInkLines(tailFin);
      group.add(tailFin);

      const tailWing = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.035, 0.14), wingMat);
      tailWing.position.set(0, 0.04, -0.28);
      addBoxInkLines(tailWing);
      group.add(tailWing);

      // 旋转螺旋桨
      const propGroup = new THREE.Group();
      propGroup.position.set(0, 0, 0.5);
      const blade1 = new THREE.Mesh(
        new THREE.BoxGeometry(0.42, 0.045, 0.015),
        new THREE.MeshBasicMaterial({ color: INK_COLOR })
      );
      const blade2 = blade1.clone();
      blade2.rotation.z = Math.PI / 2;
      propGroup.add(blade1, blade2);
      group.add(propGroup);

      return { group, propGroup };
    }

    const planeConfigs = [
      { c1: 0xff595e, c2: 0xffca3a, alt: 13.0, speed: 0.42, euler: [0.3, 0.0, 0.2] },
      { c1: 0x4ecdc4, c2: 0xffffff, alt: 13.7, speed: 0.36, euler: [-0.8, 0.5, 0.4] },
      { c1: 0xff9f1c, c2: 0x1982c4, alt: 13.3, speed: 0.45, euler: [1.1, -0.4, -0.6] },
      { c1: 0xa29bfe, c2: 0xffe66d, alt: 14.2, speed: 0.34, euler: [-0.4, 1.2, -0.8] },
      { c1: 0x06d6a0, c2: 0xff6b6b, alt: 13.5, speed: 0.39, euler: [0.7, 1.8, 0.5] }
    ];

    planeConfigs.forEach((cfg, idx) => {
      const { group, propGroup } = createCartoonPlane(cfg.c1, cfg.c2);
      worldGroup.add(group);
      const orbitQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(...cfg.euler));
      planes.push({
        group,
        propGroup,
        orbitQuat,
        altitude: cfg.alt,
        speed: cfg.speed,
        angle: (idx / planeConfigs.length) * Math.PI * 2,
        puffTimer: 0
      });
    });

    // ==========================================
    // 10. 蓬松漫画白云群
    // ==========================================
    const clouds = [];
    const cloudMat = new THREE.MeshToonMaterial({
      color: 0xffffff,
      gradientMap: softToonGradient
    });

    function createComicCloudCluster() {
      const cluster = new THREE.Group();
      const puffs = [
        { x: 0, y: 0, z: 0, r: 0.46 },
        { x: 0.36, y: -0.04, z: 0.08, r: 0.34 },
        { x: -0.36, y: -0.05, z: -0.04, r: 0.36 },
        { x: 0.16, y: 0.16, z: -0.14, r: 0.32 },
        { x: -0.14, y: 0.12, z: 0.18, r: 0.3 }
      ];

      puffs.forEach((p) => {
        const geo = new THREE.IcosahedronGeometry(p.r, 2);
        const mesh = new THREE.Mesh(geo, cloudMat);
        mesh.position.set(p.x, p.y, p.z);
        mesh.castShadow = true;
        addComicOutline(mesh, 1.07, INK_COLOR);
        cluster.add(mesh);
      });

      return cluster;
    }

    for (let i = 0; i < 20; i++) {
      const cloud = createComicCloudCluster();
      const s = 0.8 + Math.random() * 0.65;
      cloud.scale.setScalar(s);

      const orbitQuat = new THREE.Quaternion().setFromEuler(
        new THREE.Euler(
          Math.random() * Math.PI,
          Math.random() * Math.PI,
          Math.random() * Math.PI
        )
      );
      const altitude = 12.1 + Math.random() * 2.1;
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.04 + Math.random() * 0.05;

      worldGroup.add(cloud);
      clouds.push({
        mesh: cloud,
        orbitQuat,
        altitude,
        angle,
        speed,
        bobPhase: Math.random() * Math.PI * 2
      });
    }

    // ==========================================
    // 11. 视角切换与昼夜交互逻辑
    // ==========================================
    let viewMode = 'orbit'; // 'orbit' | 'car' | 'plane'
    let isNightMode = false;

    const modeButtons = document.querySelectorAll('.hud-btn[data-mode]');
    modeButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        modeButtons.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        viewMode = btn.dataset.mode;

        if (viewMode === 'orbit') {
          controls.minDistance = 12.2;
          controls.maxDistance = 65;
        } else {
          controls.minDistance = 1.8;
          controls.maxDistance = 18;
        }
      });
    });

    const timeBtn = document.getElementById('toggle-time');
    timeBtn.addEventListener('click', () => {
      isNightMode = !isNightMode;
      timeBtn.textContent = isNightMode ? '🌙 霓虹夜景' : '🌞 昼夜切换';
      timeBtn.classList.toggle('active', isNightMode);
    });

    // 窗口自适应
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    // ==========================================
    // 12. 动画主循环
    // ==========================================
    const clock = new THREE.Clock();
    const matBasis = new THREE.Matrix4();
    const targetVec = new THREE.Vector3();
    const desiredCamPos = new THREE.Vector3();

    const dayBg = new THREE.Color(0x1b1530);
    const nightBg = new THREE.Color(0x090714);

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // 1. 昼夜平滑过渡
      const targetNight = isNightMode ? 1.0 : 0.0;
      scene.background.lerp(isNightMode ? nightBg : dayBg, dt * 3.0);
      sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, isNightMode ? 0.45 : 2.1, dt * 3.0);
      ambientLight.intensity = THREE.MathUtils.lerp(ambientLight.intensity, isNightMode ? 0.38 : 0.95, dt * 3.0);

      nightEmissiveMaterials.forEach((mat) => {
        mat.emissiveIntensity = THREE.MathUtils.lerp(
          mat.emissiveIntensity,
          isNightMode ? 1.35 : 0.15,
          dt * 4.0
        );
      });

      // 2. 海洋波纹缓慢流动 & 帆船摇摆
      oceanTex.offset.x = (elapsed * 0.015) % 1;
      oceanTex.offset.y = Math.sin(elapsed * 0.4) * 0.01;

      boats.forEach((b) => {
        const wave = Math.sin(elapsed * 2.4 + b.phase) * 0.06;
        b.group.position.copy(b.dir).multiplyScalar(PLANET_RADIUS + wave * 0.25);
        b.group.rotateZ(Math.cos(elapsed * 2.0 + b.phase) * 0.002);
      });

      // 3. 太空太阳旋转与星空缓慢漂移
      sunGroup.rotation.z = elapsed * 0.35;
      starField.rotation.y = elapsed * 0.015;

      // 4. 更新公路上的所有漫游汽车
      cars.forEach((car, idx) => {
        const N = car.loop.samples;
        car.t = (car.t + car.speed * dt + N) % N;

        const i0 = Math.floor(car.t);
        const i1 = (i0 + 1) % N;
        const alpha = car.t - i0;

        const f0 = car.loop.frames[i0];
        const f1 = car.loop.frames[i1];

        const pos = f0.pos.clone().lerp(f1.pos, alpha);
        const up = f0.up.clone().lerp(f1.up, alpha).normalize();
        const right = f0.right.clone().lerp(f1.right, alpha).normalize();
        const forward = f0.forward
          .clone()
          .lerp(f1.forward, alpha)
          .multiplyScalar(car.dirSign)
          .normalize();
        const correctedRight = new THREE.Vector3().crossVectors(forward, up).normalize();

        const bounce = Math.abs(Math.sin(elapsed * 18 + car.bouncePhase)) * 0.018;

        car.mesh.position
          .copy(pos)
          .addScaledVector(f0.right, car.laneOffset)
          .addScaledVector(up, ROAD_THICKNESS + bounce);

        matBasis.makeBasis(correctedRight, up, forward);
        car.mesh.quaternion.setFromRotationMatrix(matBasis);

        // 领头车偶尔冒出白色尾气小云朵
        if (idx % 3 === 0 && Math.random() < 0.16) {
          const exhaustPos = car.mesh.position
            .clone()
            .addScaledVector(forward, -0.18)
            .addScaledVector(up, 0.05);
          spawnPuff(exhaustPos, 0.45);
        }
      });

      // 5. 更新空中翱翔的飞机与尾迹云
      planes.forEach((p, idx) => {
        p.angle += p.speed * dt;
        p.propGroup.rotation.z += dt * 28;

        const localPos = new THREE.Vector3(
          Math.cos(p.angle) * p.altitude,
          Math.sin(p.angle * 3) * 0.28,
          Math.sin(p.angle) * p.altitude
        ).applyQuaternion(p.orbitQuat);

        const nextAngle = p.angle + 0.02;
        const nextPos = new THREE.Vector3(
          Math.cos(nextAngle) * p.altitude,
          Math.sin(nextAngle * 3) * 0.28,
          Math.sin(nextAngle) * p.altitude
        ).applyQuaternion(p.orbitQuat);

        const up = localPos.clone().normalize();
        const forward = nextPos.sub(localPos).normalize();
        const right = new THREE.Vector3().crossVectors(forward, up).normalize();
        up.crossVectors(right, forward).normalize();

        p.group.position.copy(localPos);
        matBasis.makeBasis(right, up, forward);
        p.group.quaternion.setFromRotationMatrix(matBasis);
        // 飞机侧倾微摆动画
        p.group.rotateZ(Math.sin(elapsed * 2.2 + idx) * 0.18);

        p.puffTimer += dt;
        if (p.puffTimer > 0.14) {
          p.puffTimer = 0;
          const trailPos = localPos.clone().addScaledVector(forward, -0.42);
          spawnPuff(trailPos, 0.78);
        }
      });

      // 6. 更新尾气与飞机尾迹云团缩放消散
      puffParticles.forEach((p) => {
        if (!p.active) return;
        p.age += dt;
        if (p.age >= p.maxAge) {
          p.active = false;
          p.mesh.visible = false;
        } else {
          const progress = p.age / p.maxAge;
          const s = p.scale * (1.0 - progress * 0.85);
          p.mesh.scale.setScalar(Math.max(0.01, s));
        }
      });

      // 7. 更新漂浮白云
      clouds.forEach((c) => {
        c.angle += c.speed * dt;
        const radialBob = Math.sin(elapsed * 1.4 + c.bobPhase) * 0.14;
        const r = c.altitude + radialBob;

        const pos = new THREE.Vector3(Math.cos(c.angle) * r, 0, Math.sin(c.angle) * r).applyQuaternion(
          c.orbitQuat
        );
        const nextPos = new THREE.Vector3(
          Math.cos(c.angle + 0.02) * r,
          0,
          Math.sin(c.angle + 0.02) * r
        ).applyQuaternion(c.orbitQuat);

        const up = pos.clone().normalize();
        const forward = nextPos.sub(pos).normalize();
        const right = new THREE.Vector3().crossVectors(forward, up).normalize();

        c.mesh.position.copy(pos);
        matBasis.makeBasis(right, up, forward);
        c.mesh.quaternion.setFromRotationMatrix(matBasis);
      });

      // 8. 相机聚焦模式平滑追踪
      if (viewMode === 'orbit') {
        targetVec.set(0, 0, 0);
        controls.target.lerp(targetVec, dt * 4.5);
      } else if (viewMode === 'car') {
        const heroCar = cars[0];
        targetVec.copy(heroCar.mesh.position);
        const prevTarget = controls.target.clone();
        controls.target.lerp(targetVec, dt * 8.0);
        const deltaMove = controls.target.clone().sub(prevTarget);
        camera.position.add(deltaMove);

        // 保持相机在星球外侧不穿入地面
        const camDistFromCenter = camera.position.length();
        if (camDistFromCenter < PLANET_RADIUS + 1.2) {
          camera.position.normalize().multiplyScalar(PLANET_RADIUS + 1.2);
        }
      } else if (viewMode === 'plane') {
        const heroPlane = planes[0];
        targetVec.copy(heroPlane.group.position);
        const prevTarget = controls.target.clone();
        controls.target.lerp(targetVec, dt * 8.0);
        const deltaMove = controls.target.clone().sub(prevTarget);
        camera.position.add(deltaMove);

        const camDistFromCenter = camera.position.length();
        if (camDistFromCenter < PLANET_RADIUS + 1.5) {
          camera.position.normalize().multiplyScalar(PLANET_RADIUS + 1.5);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
  <script src="../prompt-panel.js" data-id="cartoon-planet-web"></script>
</body>
</html>
