<div class="title"><h1>蒸汽机工作原型</h1><p>双作用卧式单缸 · 滑阀配汽 · 离心调速</p></div>
<div id="panel">
  <div class="row"><span>节气门开度</span><span id="thrV">60%</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 渲染器 / 场景 / 相机 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1915);
scene.fog = new THREE.Fog(0x1d1915, 20, 46);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
const TARGET = new THREE.Vector3(-2.2, 2.0, -1.4);
camera.position.set(6.2, 5.0, 8.8);
if (camera.aspect < 0.8) camera.position.sub(TARGET).multiplyScalar(1.7).add(TARGET);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 2.5;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.autoRotateSpeed = 0.6;
controls.update();

/* ================= 灯光 ================= */
scene.add(new THREE.HemisphereLight(0xffe6c4, 0x2a2018, 0.55));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.3);
sun.position.set(7, 13, 9);
sun.target.position.set(-2, 0, -1.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0x9fb6ff, 0.45);
fill.position.set(-9, 6, 7);
scene.add(fill);
const lamp = new THREE.PointLight(0xffc98a, 25, 16, 2);
lamp.position.set(-1.5, 6.5, 1.5);
scene.add(lamp);

/* ================= 程序化贴图 ================= */
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
// 金属/铸铁表面的灰度噪声（用作粗糙度与凹凸）
const noiseTex = canvasTex(256, 256, (g, w, h) => {
  const img = g.createImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    const v = 150 + (Math.random() - 0.5) * 70;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  for (let i = 0; i < 60; i++) {
    g.fillStyle = `rgba(${Math.random() < 0.5 ? '90,90,90' : '220,220,220'},0.12)`;
    g.beginPath(); g.arc(Math.random() * w, Math.random() * h, 4 + Math.random() * 18, 0, 6.29); g.fill();
  }
}, false);
// 锅炉木质保温条
const plankTex = canvasTex(512, 256, (g, w, h) => {
  const n = 16, pw = w / n;
  for (let i = 0; i < n; i++) {
    const l = 26 + Math.random() * 12;
    g.fillStyle = `hsl(${24 + Math.random() * 8}, ${40 + Math.random() * 15}%, ${l}%)`;
    g.fillRect(i * pw, 0, pw, h);
    for (let k = 0; k < 14; k++) {
      g.strokeStyle = `rgba(40,20,8,${0.15 + Math.random() * 0.25})`; g.lineWidth = 0.6 + Math.random();
      const x0 = i * pw + Math.random() * pw;
      g.beginPath(); g.moveTo(x0, 0);
      for (let y = 0; y <= h; y += 16) g.lineTo(x0 + Math.sin(y * 0.03 + k) * 2, y);
      g.stroke();
    }
    g.fillStyle = 'rgba(20,10,4,0.7)'; g.fillRect(i * pw, 0, 2, h);
  }
});
plankTex.repeat.set(2, 1);
// 石板地面
const floorTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#2a2622'; g.fillRect(0, 0, w, h);
  const n = 4, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const l = 30 + Math.random() * 10;
    g.fillStyle = `hsl(30, ${6 + Math.random() * 8}%, ${l}%)`;
    g.fillRect(i * s + 3, j * s + 3, s - 6, s - 6);
    for (let k = 0; k < 140; k++) {
      g.fillStyle = `rgba(${Math.random() < 0.5 ? '0,0,0' : '255,240,220'},${Math.random() * 0.08})`;
      g.fillRect(i * s + Math.random() * s, j * s + Math.random() * s, 2 + Math.random() * 6, 2 + Math.random() * 6);
    }
  }
  // 油渍
  for (let k = 0; k < 6; k++) {
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, 60);
    gr.addColorStop(0, 'rgba(10,8,6,0.35)'); gr.addColorStop(1, 'rgba(10,8,6,0)');
    g.save(); g.translate(Math.random() * w, Math.random() * h); g.fillStyle = gr; g.fillRect(-60, -60, 120, 120); g.restore();
  }
});
floorTex.repeat.set(15, 15);
// 砖墙
const brickTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#4a3b30'; g.fillRect(0, 0, w, h);
  const bw = 64, bh = 32;
  for (let r = 0; r < h / bh; r++) for (let c = -1; c < w / bw + 1; c++) {
    const x = c * bw + (r % 2) * bw / 2, y = r * bh;
    g.fillStyle = `hsl(${10 + Math.random() * 10}, ${35 + Math.random() * 20}%, ${24 + Math.random() * 10}%)`;
    g.fillRect(x + 2, y + 2, bw - 4, bh - 4);
    g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(x + 2, y + bh - 8, bw - 4, 6);
  }
});
brickTex.repeat.set(10, 4);
// 皮带纹理（滚动以表现运动）
const beltTex = canvasTex(32, 128, (g, w, h) => {
  g.fillStyle = '#3a2416'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 16) { g.fillStyle = '#20140b'; g.fillRect(0, y, w, 3); }
  g.fillStyle = 'rgba(255,220,180,0.08)'; g.fillRect(4, 0, 3, h);
});
beltTex.repeat.set(1, 8);
// 压力表盘
const gaugeTex = canvasTex(256, 256, (g) => {
  const cx = 128, cy = 128;
  g.fillStyle = '#f2e8cf'; g.beginPath(); g.arc(cx, cy, 126, 0, Math.PI * 2); g.fill();
  const ang = v => (-135 + v * 27) * Math.PI / 180;
  g.strokeStyle = '#b8261b'; g.lineWidth = 12;
  g.beginPath(); g.arc(cx, cy, 98, ang(8) - Math.PI / 2, ang(10) - Math.PI / 2); g.stroke();
  g.strokeStyle = '#2a1e14';
  for (let v = 0; v <= 10.001; v += 0.5) {
    const a = ang(v), major = Math.abs(v - Math.round(v)) < 0.01;
    const r1 = major ? 84 : 92, r2 = 106;
    g.lineWidth = major ? 4 : 2;
    g.beginPath(); g.moveTo(cx + r1 * Math.sin(a), cy - r1 * Math.cos(a)); g.lineTo(cx + r2 * Math.sin(a), cy - r2 * Math.cos(a)); g.stroke();
    if (major) {
      g.fillStyle = '#2a1e14'; g.font = 'bold 22px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(String(Math.round(v)), cx + 66 * Math.sin(a), cy - 66 * Math.cos(a));
    }
  }
  g.font = 'bold 20px sans-serif'; g.fillText('bar', cx, cy + 40);
  g.font = '15px sans-serif'; g.fillText('蒸汽压力', cx, cy + 66);
});
gaugeTex.wrapS = gaugeTex.wrapT = THREE.ClampToEdgeWrapping;

/* ================= 材质 ================= */
const std = (color, metalness, roughness, extra = {}) => new THREE.MeshStandardMaterial({
  color, metalness, roughness, roughnessMap: noiseTex, bumpMap: noiseTex, bumpScale: 0.3, envMapIntensity: 0.9, ...extra
});
const M = {
  green: std(0x2f4b3a, 0.35, 0.5),
  shell: std(0x2f4b3a, 0.35, 0.5),          // 气缸与汽室外壳（剖视时变透明）
  iron: std(0x2a2b2e, 0.6, 0.55),
  steel: std(0xc3c7cc, 1.0, 0.22, { bumpScale: 0.15 }),
  darkSteel: std(0x7d8288, 1.0, 0.32, { bumpScale: 0.2 }),
  brass: std(0xd1a24e, 1.0, 0.26, { bumpScale: 0.15 }),
  copper: std(0xb8693c, 1.0, 0.32),
  red: std(0x7e1c16, 0.35, 0.42),
  black: std(0x19191b, 0.5, 0.6),
  stone: std(0x6d665e, 0.0, 0.9),
  wood: new THREE.MeshStandardMaterial({ map: plankTex, roughness: 0.75, metalness: 0.0, envMapIntensity: 0.5 }),
  belt: new THREE.MeshStandardMaterial({ map: beltTex, roughness: 0.85, metalness: 0.0 }),
  coal: new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.5, metalness: 0.3 }),
};

/* ================= 几何工具 ================= */
const cylX = (r, l, s = 24, rTop = r) => new THREE.CylinderGeometry(rTop, r, l, s).rotateZ(-Math.PI / 2); // 沿 +x，顶端朝 +x
const cylY = (r, l, s = 24, rTop = r) => new THREE.CylinderGeometry(rTop, r, l, s);
const cylZ = (r, l, s = 24) => new THREE.CylinderGeometry(r, r, l, s).rotateX(Math.PI / 2);
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
function add(parent, geo, mat, x = 0, y = 0, z = 0, label) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (label) m.userData.label = label;
  parent.add(m);
  return m;
}
// 给组内未标注的网格统一标注部件名
function labelAll(obj, label) { obj.traverse(o => { if (o.isMesh && !o.userData.label) o.userData.label = label; }); return obj; }
// 圆周螺栓（轴向沿 x）
function boltsX(parent, x, cy, cz, R, n, mat = M.darkSteel) {
  const g = cylX(0.032, 0.06, 6);
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    add(parent, g, mat, x, cy + Math.cos(a) * R, cz + Math.sin(a) * R);
  }
}

/* ================= 尺寸与运动学参数 ================= */
const H = 1.9;       // 曲轴中心高度
const CR = 0.4;      // 曲柄半径（行程 0.8）
const CL = 1.6;      // 连杆长度
const ROD = 1.4;     // 活塞杆长度（活塞中心 → 十字头）
const ECC = 0.12;    // 偏心距
const ECL = 1.4;     // 偏心杆长度
const VROD = 1.6;    // 阀杆长度
const LEAD = 0.18;   // 配汽超前角
const ZV = -0.82;    // 汽室 / 配汽机构所在 z
const CYL_X = -3.0;  // 气缸中心
const BORE_L = -3.55, BORE_R = -2.45; // 气缸内腔两端

/* ================= 厂房环境 ================= */
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
    new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.92, metalness: 0.0 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  const wallMat = new THREE.MeshStandardMaterial({ map: brickTex, roughness: 0.95 });
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 12), wallMat);
  wall.position.set(-2, 6, -7.2);
  wall.receiveShadow = true;
  scene.add(wall);
  // 墙上挂灯
  const lampShade = add(scene, new THREE.ConeGeometry(0.45, 0.35, 24, 1, true), M.iron, -1.5, 6.9, 1.5);
  lampShade.material = M.iron.clone(); lampShade.material.side = THREE.DoubleSide;
  add(scene, new THREE.SphereGeometry(0.12, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffe2b0 }), -1.5, 6.72, 1.5);
  add(scene, cylY(0.012, 3), M.black, -1.5, 8.5, 1.5);
}

/* ================= 机座 / 基础 ================= */
const engine = new THREE.Group();
scene.add(engine);
{
  const g = new THREE.Group(); engine.add(g);
  add(g, box(6.0, 0.25, 3.5), M.stone, -1.6, 0.125, 0.05);           // 石砌基础
  add(g, box(5.3, 0.25, 2.2), M.green, -1.65, 0.375, -0.35);         // 铸铁机座
  add(g, box(5.4, 0.06, 2.3), M.iron, -1.65, 0.28, -0.35);           // 机座底缘
  add(g, box(1.0, H - 0.35 - 0.5, 0.7), M.green, CYL_X, 0.5 + (H - 0.85) / 2, 0); // 气缸支座
  add(g, box(1.1, 0.08, 0.8), M.iron, CYL_X, H - 0.39, 0);
  // 地脚螺栓
  const nut = cylY(0.05, 0.07, 6);
  for (const x of [-4.1, -2.9, -1.7, -0.5, 0.8]) for (const z of [-1.35, 0.6]) add(g, nut, M.darkSteel, x, 0.53, z);
  labelAll(g, '机座');
}

/* ================= 气缸（双作用） ================= */
const shellMeshes = [];
{
  const g = new THREE.Group(); engine.add(g);
  const shell = (geo, x, y, z) => { const m = add(g, geo, M.shell, x, y, z); shellMeshes.push(m); return m; };
  shell(cylX(0.5, BORE_R - BORE_L, 40), CYL_X, H, 0);                  // 缸体
  shell(cylX(0.56, 0.08, 40), BORE_L - 0.04, H, 0);                     // 后缸盖
  shell(cylX(0.56, 0.08, 40), BORE_R + 0.04, H, 0);                     // 前缸盖
  shell(cylX(0.54, 0.06, 40), CYL_X - 0.3, H, 0);                       // 加强环
  shell(cylX(0.54, 0.06, 40), CYL_X + 0.3, H, 0);
  boltsX(g, BORE_L - 0.09, H, 0, 0.48, 10);
  boltsX(g, BORE_R + 0.09, H, 0, 0.48, 10);
  add(g, cylX(0.14, 0.18, 24), M.brass, BORE_R + 0.17, H, 0);           // 填料函
  add(g, cylX(0.18, 0.04, 24), M.brass, BORE_R + 0.27, H, 0);
  add(g, cylY(0.03, 0.18, 12), M.brass, CYL_X - 0.45, H - 0.55, 0);     // 排水阀
  add(g, cylY(0.03, 0.18, 12), M.brass, CYL_X + 0.45, H - 0.55, 0);
  labelAll(g, '气缸');

  // 汽室
  const c = new THREE.Group(); engine.add(c);
  const cs = add(c, box(1.0, 0.6, 0.56), M.shell, CYL_X, H, ZV); shellMeshes.push(cs);
  const cc = add(c, box(1.08, 0.08, 0.64), M.shell, CYL_X, H + 0.32, ZV); shellMeshes.push(cc);
  const nb = cylY(0.03, 0.05, 6);
  for (let i = 0; i < 5; i++) for (const dz of [-0.28, 0.28]) add(c, nb, M.darkSteel, CYL_X - 0.48 + i * 0.24, H + 0.38, ZV + dz);
  add(c, cylX(0.07, 0.15, 16), M.brass, CYL_X + 0.57, H, ZV);           // 阀杆填料函
  labelAll(c, '汽室');
}

/* 剖视用：内腔蒸汽体积与汽道 */
const volGeo = cylX(0.44, 1, 32).translate(0.5, 0, 0);
const volMatL = new THREE.MeshBasicMaterial({ color: 0xff8a2a, transparent: true, opacity: 0.55, depthWrite: false });
const volMatR = volMatL.clone();
const volL = new THREE.Mesh(volGeo, volMatL), volR = new THREE.Mesh(volGeo, volMatR);
volL.position.set(BORE_L, H, 0); volR.position.set(0, H, 0);
volL.userData.label = volR.userData.label = '气缸内蒸汽';
const portMatL = volMatL.clone(), portMatR = volMatL.clone();
const portL = new THREE.Mesh(box(0.1, 0.14, 0.5), portMatL), portR = new THREE.Mesh(box(0.1, 0.14, 0.5), portMatR);
portL.position.set(CYL_X - 0.45, H, ZV + 0.3); portR.position.set(CYL_X + 0.45, H, ZV + 0.3);

class Particles {
  constructor(max, color, opts) {
    this.max = max; this.cursor = 0;
    Object.assign(this, { buoy: 0.4, drag: 0.6, grow: 3, wind: 0.25, opacity: 0.6 }, opts);
    this.pos = new Float32Array(max * 3);
    this.vel = new Float32Array(max * 3);
    this.age = new Float32Array(max);
    this.life = new Float32Array(max);
    this.size0 = new Float32Array(max);
    this.size = new Float32Array(max);
    this.alpha = new Float32Array(max);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage));
    this.mat = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color(color) }, uScale: { value: 400 } },
      vertexShader: `
        attribute float aSize; attribute float aAlpha; uniform float uScale; varying float vAlpha;
        void main(){
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = aSize * uScale / max(0.1, -mv.z);
          vAlpha = aAlpha;
        }`,
      fragmentShader: `
        uniform vec3 uColor; varying float vAlpha;
        void main(){
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5 || vAlpha < 0.003) discard;
          float a = smoothstep(0.5, 0.08, d) * vAlpha;
          gl_FragColor = vec4(uColor * (0.85 + 0.15 * (1.0 - d * 2.0)), a);
        }`,
      transparent: true, depthWrite: false
    });
    this.points = new THREE.Points(geo, this.mat);
    this.points.frustumCulled = false;
    this.points.renderOrder = 3;
    scene.add(this.points);
  }
  emit(x, y, z, vx, vy, vz, life, size) {
    const i = this.cursor; this.cursor = (this.cursor + 1) % this.max;
    this.pos.set([x, y, z], i * 3); this.vel.set([vx, vy, vz], i * 3);
    this.age[i] = 0; this.life[i] = life; this.size0[i] = size;
  }
  update(dt) {
    const { pos, vel, age, life, size0, size, alpha } = this;
    const damp = Math.exp(-this.drag * dt);
    for (let i = 0; i < this.max; i++) {
      if (life[i] <= 0) { alpha[i] = 0; size[i] = 0; continue; }
      age[i] += dt;
      const t = age[i] / life[i];
      if (t >= 1) { life[i] = 0; alpha[i] = 0; size[i] = 0; continue; }
      const k = i * 3;
      vel[k] = vel[k] * damp + this.wind * dt;
      vel[k + 1] = vel[k + 1] * damp + this.buoy * dt;
      vel[k + 2] *= damp;
      pos[k] += vel[k] * dt; pos[k + 1] += vel[k + 1] * dt; pos[k + 2] += vel[k + 2] * dt;
      size[i] = size0[i] * (1 + this.grow * t);
      alpha[i] = this.opacity * Math.min(1, t * 8) * Math.pow(1 - t, 1.6);
    }
    const a = this.points.geometry.attributes;
    a.position.needsUpdate = a.aSize.needsUpdate = a.aAlpha.needsUpdate = true;
  }
}

/* ================= 物理与运动学 ================= */
const COLD = new THREE.Color(0x4aa3ff), HOT = new THREE.Color(0xff8a2a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function simulate(dt) {
  const s = state;
  // 调速器：转速超过约 86 rpm 后逐步关小进汽
  s.govOpen = clamp(1 - (s.omega - 9) / 4, 0.15, 1);
  const steamFlow = s.throttle * s.govOpen * (s.pressure / 7);
  // 双作用：死点附近有效力矩小，中间行程最大
  const drive = 12 * steamFlow * (0.55 + 0.45 * Math.abs(Math.sin(s.theta)));
  const torque = drive - 0.9 * s.omega - (s.omega > 0.01 ? 0.3 : 0);
  s.omega = Math.max(0, s.omega + torque * dt / 1.4);
  s.theta = (s.theta + s.omega * dt) % (Math.PI * 2);
  // 锅炉压力：耗汽越多压力越低；过压时安全阀泄放
  const use = s.throttle * s.govOpen * Math.min(1, s.omega / 8 + 0.3);
  const pTarget = 8.15 - 1.7 * use;
  s.pressure += (pTarget - s.pressure) * Math.min(1, dt * 0.35);
  s.lift += ((s.pressure > 7.9 ? 1 : 0) - s.lift) * Math.min(1, dt * 4);
  if (s.lift > 0.3) s.pressure -= dt * 0.05;
}

function updateMechanism() {
  const th = state.theta;
  crank.rotation.z = th;
  // 曲柄连杆机构
  const px = CR * Math.cos(th), py = CR * Math.sin(th);
  const xc = px - Math.sqrt(CL * CL - py * py);
  crosshead.position.x = xc;
  pistonGroup.position.x = xc;
  conrod.position.set(xc, H, 0);
  conrod.rotation.z = Math.atan2(py, px - xc);
  // 偏心配汽
  const psi = th + Math.PI / 2 + LEAD;
  const ex = ECC * Math.cos(psi), ey = ECC * Math.sin(psi);
  const xv = ex - Math.sqrt(ECL * ECL - ey * ey);
  eccRod.position.set(ex, H + ey, ZV);
  eccRod.rotation.z = Math.atan2(-ey, xv - ex);
  valveGroup.position.x = xv;
  // 气缸两腔蒸汽体积
  const pc = xc - ROD;
  volL.scale.x = Math.max(0.001, pc - 0.08 - BORE_L);
  volR.position.x = pc + 0.08;
  volR.scale.x = Math.max(0.001, BORE_R - (pc + 0.08));
  // k > 0：滑阀右移，缸头侧进汽
  const k = -Math.sin(th + LEAD);
  const hl = smooth(-0.12, 0.12, k);
  volMatL.color.lerpColors(COLD, HOT, hl); portMatL.color.copy(volMatL.color);
  volMatR.color.lerpColors(COLD, HOT, 1 - hl); portMatR.color.copy(volMatR.color);
  volMatL.opacity = 0.3 + 0.35 * hl; volMatR.opacity = 0.3 + 0.35 * (1 - hl);
  portMatL.opacity = volMatL.opacity; portMatR.opacity = volMatR.opacity;
  // 调速器
  const ratio = 0.33 / 0.23;
  govPulley.rotation.z = th * ratio;
  const a = state.ball;
  for (const { pivot, side } of govArms) pivot.rotation.z = side * a;
  const Ay = GOV_TOP - LINK_AT * Math.cos(a), Ax = LINK_AT * Math.sin(a) - 0.05;
  const ys = Ay - Math.sqrt(Math.max(0, LINK_L * LINK_L - Ax * Ax));
  govSleeve.position.y = ys;
  for (const { link, side } of govLinks) {
    const x0 = side * LINK_AT * Math.sin(a), x1 = side * 0.05;
    link.position.set((x0 + x1) / 2, (Ay + ys) / 2, 0);
    link.rotation.z = Math.atan2(-(x0 - x1), Ay - ys);
  }
  return k;
}

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let elapsed = 0, statT = 0, smokeAcc = 0, wispAcc = 0, jetAcc = 0, glandAcc = 0;
const R = Math.random;
const EXH_TOP = new THREE.Vector3(-3.3, 4.95, -1.7);
const CHIMNEY_TOP = new THREE.Vector3(BX + BL / 2 + 0.3, BY + BR + 4.2, BZ);
const SV_TOP = new THREE.Vector3(-4.2, BY + BR + 0.45, BZ);

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const s = state;

  if (!s.paused) {
    // 分步积分，保证高速时排汽节拍不丢失
    const n = Math.max(1, Math.ceil(s.omega * dt / 0.15));
    for (let i = 0; i < n; i++) {
      simulate(dt / n);
      const k = updateMechanism();
      if (Math.sign(k) !== Math.sign(s.prevK) && s.omega > 0.4) {
        // 每次换向排出一团乏汽
        const cnt = Math.round(6 + 12 * s.throttle * s.govOpen);
        const up = 2.2 + s.omega * 0.18;
        for (let j = 0; j < cnt; j++)
          steam.emit(EXH_TOP.x + (R() - 0.5) * 0.12, EXH_TOP.y, EXH_TOP.z + (R() - 0.5) * 0.12,
            (R() - 0.5) * 0.8, up * (0.7 + R() * 0.5), (R() - 0.5) * 0.8, 1.6 + R() * 1.0, 0.3 + R() * 0.15);
      }
      s.prevK = k;
    }
    const tgtBall = 0.32 + 0.7 * Math.pow(clamp(s.omega / 11, 0, 1), 2);
    s.ball += (tgtBall - s.ball) * Math.min(1, dt * 3);
    beltTex.offset.y -= s.omega * dt * 0.5;
    throttleWheel.rotation.x += ((s.throttle * 5) - throttleWheel.rotation.x) * Math.min(1, dt * 6);
  } else {
    updateMechanism();
  }

  // 烟囱烟气：火越旺烟越多
  const burn = 0.3 + 0.7 * s.throttle;
  smokeAcc += dt * (5 + 22 * burn);
  while (smokeAcc > 1) {
    smokeAcc -= 1;
    smoke.emit(CHIMNEY_TOP.x + (R() - 0.5) * 0.25, CHIMNEY_TOP.y, CHIMNEY_TOP.z + (R() - 0.5) * 0.25,
      (R() - 0.5) * 0.3, 1.1 + R() * 0.7 + burn * 0.6, (R() - 0.5) * 0.3, 4 + R() * 2.5, 0.45 + R() * 0.2);
  }
  // 排汽口残余白汽
  wispAcc += dt * (s.omega > 0.4 && !s.paused ? 4 : 0.6);
  while (wispAcc > 1) {
    wispAcc -= 1;
    steam.emit(EXH_TOP.x, EXH_TOP.y, EXH_TOP.z, (R() - 0.5) * 0.2, 0.6 + R() * 0.4, (R() - 0.5) * 0.2, 1.5, 0.18);
  }
  // 活塞杆填料函轻微漏汽
  glandAcc += dt * (s.omega > 0.4 && !s.paused ? 3 * s.throttle : 0);
  while (glandAcc > 1) {
    glandAcc -= 1;
    steam.emit(BORE_R + 0.3, H + 0.05, (R() - 0.5) * 0.1, 0.2 + R() * 0.2, 0.25 + R() * 0.2, (R() - 0.5) * 0.3, 0.9, 0.07);
  }
  // 安全阀泄放
  safetyLever.rotation.z = s.lift * 0.12;
  jetAcc += dt * 70 * s.lift;
  while (jetAcc > 1) {
    jetAcc -= 1;
    steam.emit(SV_TOP.x + (R() - 0.5) * 0.08, SV_TOP.y, SV_TOP.z + (R() - 0.5) * 0.08,
      (R() - 0.5) * 0.9, 4.5 + R() * 1.5, (R() - 0.5) * 0.9, 0.9 + R() * 0.4, 0.14);
  }
  smoke.update(dt);
  steam.update(dt);

  // 火焰 / 火光
  fireUniforms.uTime.value = elapsed;
  fireUniforms.uIntensity.value = 0.75 + 0.55 * s.throttle;
  const flick = 0.82 + 0.18 * Math.sin(elapsed * 13.1) * Math.sin(elapsed * 7.3 + 1.7) + 0.06 * Math.sin(elapsed * 31);
  fireLight.intensity = (5 + 10 * s.throttle) * flick;

  // 仪表
  gaugeNeedle.rotation.z = THREE.MathUtils.degToRad(135 - s.pressure * 27) + Math.sin(elapsed * 9) * 0.004 * s.omega;
  waterLevel.scale.y = 0.32 + 0.015 * Math.sin(elapsed * 1.3) + 0.01 * Math.sin(elapsed * 5.1) * s.throttle;

  statT += dt;
  if (statT > 0.12) {
    statT = 0;
    ui.rpm.textContent = Math.round(s.omega * 60 / (Math.PI * 2));
    ui.p.textContent = s.pressure.toFixed(1);
    ui.ang.textContent = Math.round(THREE.MathUtils.radToDeg(s.theta));
    ui.side.textContent = s.omega < 0.05 ? '—' : (s.prevK > 0 ? '缸头侧' : '曲柄侧');
  }

  // 悬停拾取（节流）
  if (needPick) { needPick = false; pick(); }
  if (tipTimer > 0) { tipTimer -= dt; if (tipTimer <= 0) ui.tip.style.display = 'none'; }

  controls.update();
  renderer.render(scene, camera);
}
updateMechanism();
renderer.setAnimationLoop(frame);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  setParticleScale();
});
</script>
<script src="../prompt-panel.js" data-id="steam-engine-kiro-opus"></script>
</body>
