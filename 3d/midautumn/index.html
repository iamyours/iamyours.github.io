<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>中秋月夜 · 水榭桂花</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #040711;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 左上角固定返回按钮：半透明奶油色圆角小按钮样式 */
    .back-btn {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 248, 235, 0.88);
      color: #3d2817;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-decoration: none;
      border: 1px solid rgba(255, 226, 185, 0.85);
      box-shadow: 0 4px 18px rgba(10, 15, 30, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s ease, box-shadow 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 252, 245, 0.98);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(10, 15, 30, 0.5);
    }

    .back-btn:active {
      transform: translateY(0);
    }

    /* 顶部右侧意境标题卡 */
    .scene-header {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 25;
      text-align: right;
      pointer-events: none;
      padding: 10px 18px;
      border-radius: 16px;
      background: rgba(14, 20, 36, 0.58);
      border: 1px solid rgba(240, 215, 160, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(4, 8, 18, 0.5);
    }

    .scene-header h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.16em;
      margin-bottom: 3px;
      color: #ffefa8;
      text-shadow: 0 2px 12px rgba(255, 215, 110, 0.45);
    }

    .scene-header p {
      font-size: 11.5px;
      color: rgba(255, 235, 205, 0.88);
      letter-spacing: 0.08em;
    }

    /* 底部居中镜头预设切换按钮 */
    .camera-hud {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(12, 18, 32, 0.65);
      border: 1px solid rgba(255, 220, 160, 0.3);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }

    .cam-btn {
      appearance: none;
      border: 1px solid rgba(255, 230, 180, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: #f7eedc;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .cam-btn:hover {
      background: rgba(255, 230, 170, 0.22);
      border-color: rgba(255, 230, 180, 0.6);
      transform: translateY(-1px);
    }

    .cam-btn.active {
      background: linear-gradient(135deg, rgba(235, 170, 60, 0.88) 0%, rgba(200, 120, 40, 0.88) 100%);
      border-color: #ffe89e;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 14px rgba(240, 160, 50, 0.45);
    }

    @media (max-width: 640px) {
      .back-btn {
        top: 12px;
        left: 12px;
        padding: 6px 12px;
        font-size: 12px;
      }
      .scene-header {
        top: 12px;
        right: 12px;
        padding: 6px 12px;
      }
      .scene-header h1 {
        font-size: 14px;
      }
      .scene-header p {
        display: none;
      }
      .camera-hud {
        bottom: 76px;
        gap: 5px;
        padding: 4px 8px;
        max-width: calc(100vw - 24px);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .camera-hud::-webkit-scrollbar {
        display: none;
      }
      .cam-btn {
        padding: 5px 9px;
        font-size: 11px;
        white-space: nowrap;
        flex-shrink: 0;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <a href="../" class="back-btn">← 返回 3D 作品</a>

  <div class="scene-header">
    <h1>中秋月夜 · 水榭桂花</h1>
    <p>金风送爽 · 玉兔凭栏 · 桂子月中落</p>
  </div>

  <div class="camera-hud">
    <button class="cam-btn active" data-cam="full">🌸 亭榭全景</button>
    <button class="cam-btn" data-cam="tea">🍵 月饼茶席</button>
    <button class="cam-btn" data-cam="rabbit">🐇 玉兔伴月</button>
    <button class="cam-btn" data-cam="lotus">🪷 桂雨清涟</button>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ============================================================================
    // 1. 初始化场景、摄像机、渲染器与后期处理
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040711);
    scene.fog = new THREE.FogExp2(0x060b18, 0.022);

    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
    // 视觉视角：近距离平视与微俯瞰视角，优雅构图将水榭、巨月、桂花树、石拱桥、玉兔与水面尽收眼底
    camera.position.set(0.4, 2.5, 7.8);

    function updateCameraAspect() {
      const baseFov = 45;
      if (camera.aspect < 1) {
        // 竖屏（宽高比 < 1）时增大 FOV，保证主体完整可见
        camera.fov = 2 * Math.atan(Math.tan((baseFov * Math.PI) / 360) / Math.max(camera.aspect, 0.1)) * (180 / Math.PI);
      } else {
        camera.fov = baseFov;
      }
      camera.updateProjectionMatrix();
    }
    updateCameraAspect();

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(width, height);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0.1, 1.25, 0.0);
    controls.minDistance = 1.8;
    controls.maxDistance = 16.0;
    controls.minPolarAngle = Math.PI * 0.12;
    controls.maxPolarAngle = Math.PI * 0.48; // 杜绝穿入水下

    // 后期处理：UnrealBloomPass 带来柔美中秋月晕与暖红宫灯辉光
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(width, height),
      0.46, // strength
      0.32, // radius
      0.75  // threshold
    );
    composer.addPass(bloomPass);

    const outputPass = new OutputPass();
    composer.addPass(outputPass);

    // ============================================================================
    // 2. 程序化 Canvas 纹理生成器（贴图完全代码生成，无外部资源依赖）
    // ============================================================================
    // 2.1 古朴老木纹理
    function createWoodTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      // 底色：温润古木深栗色
      ctx.fillStyle = '#2b1910';
      ctx.fillRect(0, 0, 512, 512);

      // 顺纹木纤维
      for (let i = 0; i < 512; i += 2) {
        const val = Math.sin(i * 0.08) * 14 + Math.sin(i * 0.25) * 8;
        const alpha = 0.14 + Math.sin(i * 0.15) * 0.08;
        ctx.fillStyle = `rgba(${52 + val * 0.8}, ${30 + val * 0.5}, ${18 + val * 0.3}, ${alpha})`;
        ctx.fillRect(0, i, 512, 2);
      }

      // 木板接缝与倒角阴影
      for (let y = 0; y < 512; y += 128) {
        ctx.fillStyle = 'rgba(8, 4, 2, 0.8)';
        ctx.fillRect(0, y, 512, 3);
        ctx.fillStyle = 'rgba(85, 55, 35, 0.28)';
        ctx.fillRect(0, y + 3, 512, 2);
      }

      // 细微木髓噪点
      for (let n = 0; n < 1500; n++) {
        const rx = Math.random() * 512;
        const ry = Math.random() * 512;
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(75, 45, 25, 0.18)' : 'rgba(12, 6, 3, 0.25)';
        ctx.fillRect(rx, ry, Math.random() * 25 + 10, 1);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 2.2 青石板砖与砌石纹理
    function createStoneTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#363d44';
      ctx.fillRect(0, 0, 512, 512);

      // 石料细密杂色噪点
      for (let i = 0; i < 2500; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const w = Math.random() * 5 + 2;
        const h = Math.random() * 5 + 2;
        const shade = 40 + Math.random() * 32;
        ctx.fillStyle = `rgba(${shade}, ${shade + 4}, ${shade + 8}, 0.25)`;
        ctx.fillRect(x, y, w, h);
      }

      // 青苔绿斑点
      for (let m = 0; m < 35; m++) {
        const mx = Math.random() * 512;
        const my = Math.random() * 512;
        const mr = Math.random() * 30 + 10;
        const grad = ctx.createRadialGradient(mx, my, 2, mx, my, mr);
        grad.addColorStop(0, 'rgba(40, 60, 32, 0.45)');
        grad.addColorStop(1, 'rgba(40, 60, 32, 0.0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(mx, my, mr, 0, Math.PI * 2);
        ctx.fill();
      }

      // 石砖嵌缝
      ctx.strokeStyle = 'rgba(18, 22, 26, 0.75)';
      ctx.lineWidth = 3.5;
      const step = 64;
      for (let y = 0; y <= 512; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(512, y);
        ctx.stroke();

        const offset = (y / step) % 2 === 0 ? 0 : step;
        for (let x = offset; x <= 512; x += step * 2) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y + step);
          ctx.stroke();
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 2.3 黛瓦青瓦纹理（真实江南古建小青瓦）
    function createRoofTileTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#1e2329';
      ctx.fillRect(0, 0, 256, 256);

      // 筒瓦脊向明暗交替
      const tileW = 32;
      for (let x = 0; x < 256; x += tileW) {
        const g = ctx.createLinearGradient(x, 0, x + tileW, 0);
        g.addColorStop(0, 'rgba(12, 14, 18, 0.95)');
        g.addColorStop(0.3, 'rgba(48, 56, 65, 0.85)');
        g.addColorStop(0.65, 'rgba(68, 78, 88, 0.95)');
        g.addColorStop(0.9, 'rgba(20, 24, 28, 0.85)');
        g.addColorStop(1, 'rgba(8, 10, 14, 0.98)');
        ctx.fillStyle = g;
        ctx.fillRect(x, 0, tileW, 256);
      }

      // 横向瓦槽层叠缝
      for (let y = 0; y < 256; y += 32) {
        ctx.fillStyle = 'rgba(8, 10, 12, 0.75)';
        ctx.fillRect(0, y, 256, 3);
        ctx.fillStyle = 'rgba(75, 88, 100, 0.28)';
        ctx.fillRect(0, y + 3, 256, 2);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 2.4 巨型满月表面纹理（细致月海与环形山放射纹）
    function createMoonTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 512;
      const ctx = c.getContext('2d');

      // 底色：温润明亮的金白光晕月岩
      const bgGrad = ctx.createLinearGradient(0, 0, 1024, 0);
      bgGrad.addColorStop(0, '#fffbf0');
      bgGrad.addColorStop(0.5, '#fff6de');
      bgGrad.addColorStop(1, '#fffbf0');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1024, 512);

      function drawMare(cx, cy, rx, ry, rot, darkness) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rot);
        const g = ctx.createRadialGradient(0, 0, 5, 0, 0, Math.max(rx, ry));
        g.addColorStop(0, `rgba(125, 115, 100, ${darkness})`);
        g.addColorStop(0.6, `rgba(145, 135, 120, ${darkness * 0.75})`);
        g.addColorStop(0.9, `rgba(175, 165, 150, ${darkness * 0.3})`);
        g.addColorStop(1, 'rgba(255, 250, 240, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 正面月海群
      drawMare(380, 200, 110, 140, -0.2, 0.45); // 风暴洋
      drawMare(490, 170, 75, 75, 0.1, 0.42);   // 雨海
      drawMare(600, 210, 65, 60, -0.1, 0.40);  // 澄海
      drawMare(660, 260, 70, 55, 0.2, 0.44);   // 静海
      drawMare(750, 220, 42, 38, 0.0, 0.46);   // 危海
      drawMare(550, 320, 80, 50, 0.1, 0.38);   // 云海
      drawMare(410, 320, 60, 45, -0.3, 0.35);  // 湿海

      // 背面微量阴影
      drawMare(160, 220, 55, 45, 0.3, 0.25);
      drawMare(890, 260, 50, 40, -0.2, 0.28);

      // 第谷环形山及放射状明亮亮线 (Tycho Crater Rays)
      const tychoX = 520, tychoY = 390;
      for (let a = 0; a < 24; a++) {
        const angle = (a / 24) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
        const len = 120 + Math.random() * 180;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 1.2 + Math.random() * 2;
        ctx.beginPath();
        ctx.moveTo(tychoX, tychoY);
        ctx.lineTo(tychoX + Math.cos(angle) * len, tychoY + Math.sin(angle) * len);
        ctx.stroke();
      }

      // 第谷坑心明亮光点
      const tychoGrad = ctx.createRadialGradient(tychoX, tychoY, 1, tychoX, tychoY, 18);
      tychoGrad.addColorStop(0, '#ffffff');
      tychoGrad.addColorStop(0.3, 'rgba(255, 250, 230, 0.9)');
      tychoGrad.addColorStop(1, 'rgba(255, 245, 220, 0)');
      ctx.fillStyle = tychoGrad;
      ctx.beginPath();
      ctx.arc(tychoX, tychoY, 18, 0, Math.PI * 2);
      ctx.fill();

      // 散布微小陨石坑
      for (let k = 0; k < 150; k++) {
        const kx = Math.random() * 1024;
        const ky = Math.random() * 512;
        const kr = Math.random() * 4.5 + 1.5;
        ctx.fillStyle = 'rgba(100, 90, 80, 0.25)';
        ctx.beginPath();
        ctx.arc(kx, ky, kr, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.beginPath();
        ctx.arc(kx - kr * 0.25, ky - kr * 0.25, kr * 0.65, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 2.5 柔和金色月晕贴图
    function createMoonHaloTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      const grad = ctx.createRadialGradient(256, 256, 30, 256, 256, 256);
      grad.addColorStop(0, 'rgba(255, 252, 230, 0.98)');
      grad.addColorStop(0.2, 'rgba(255, 232, 160, 0.75)');
      grad.addColorStop(0.45, 'rgba(245, 210, 120, 0.38)');
      grad.addColorStop(0.72, 'rgba(140, 190, 235, 0.15)');
      grad.addColorStop(1, 'rgba(20, 40, 80, 0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      const tex = new THREE.CanvasTexture(c);
      return tex;
    }

    // 2.6 水面微波波动法线贴图
    function createWaterNormalTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      const imgData = ctx.createImageData(512, 512);
      const data = imgData.data;

      for (let y = 0; y < 512; y++) {
        for (let x = 0; x < 512; x++) {
          const idx = (y * 512 + x) * 4;
          const nx = Math.sin(x * 0.06 + y * 0.03) * 0.4 + Math.sin(x * 0.12 - y * 0.08) * 0.3 + Math.sin(x * 0.24 + y * 0.22) * 0.3;
          const ny = Math.cos(y * 0.07 - x * 0.04) * 0.4 + Math.cos(y * 0.13 + x * 0.1) * 0.3 + Math.cos(y * 0.25 - x * 0.24) * 0.3;

          data[idx] = Math.floor((nx * 0.5 + 0.5) * 255);
          data[idx + 1] = Math.floor((ny * 0.5 + 0.5) * 255);
          data[idx + 2] = 238;
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(5, 5);
      return tex;
    }

    // 2.7 碧绿荷叶放射纹理
    function createLotusLeafTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      const grad = ctx.createRadialGradient(256, 256, 8, 256, 256, 250);
      grad.addColorStop(0, '#5fa848');
      grad.addColorStop(0.35, '#2e6b28');
      grad.addColorStop(0.85, '#1e521c');
      grad.addColorStop(1, '#163d15');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // 放射状微细叶脉
      ctx.strokeStyle = 'rgba(150, 225, 120, 0.45)';
      ctx.lineWidth = 2.4;
      const veins = 22;
      for (let i = 0; i < veins; i++) {
        const ang = (i / veins) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(256, 256);
        const cx1 = 256 + Math.cos(ang) * 120 + (Math.random() - 0.5) * 20;
        const cy1 = 256 + Math.sin(ang) * 120 + (Math.random() - 0.5) * 20;
        const ex = 256 + Math.cos(ang) * 250;
        const ey = 256 + Math.sin(ang) * 250;
        ctx.quadraticCurveTo(cx1, cy1, ex, ey);
        ctx.stroke();
      }

      ctx.fillStyle = '#9ee67c';
      ctx.beginPath();
      ctx.arc(256, 256, 12, 0, Math.PI * 2);
      ctx.fill();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 2.8 红纸灯笼纹理
    function createLanternTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#b71c1c';
      ctx.fillRect(0, 0, 256, 256);

      const ribs = 16;
      for (let i = 0; i < ribs; i++) {
        const x = (i / ribs) * 256;
        ctx.fillStyle = 'rgba(70, 8, 8, 0.7)';
        ctx.fillRect(x, 0, 3, 256);
        ctx.fillStyle = 'rgba(255, 100, 100, 0.3)';
        ctx.fillRect(x + 3, 0, 2, 256);
      }

      ctx.fillStyle = '#d4af37';
      ctx.fillRect(0, 0, 256, 14);
      ctx.fillRect(0, 242, 256, 14);
      ctx.fillStyle = '#fff4a3';
      ctx.fillRect(0, 14, 256, 3);
      ctx.fillRect(0, 239, 256, 3);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 2.9 中秋传统月饼顶面花纹
    function createMooncakeTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');

      const g = ctx.createRadialGradient(128, 128, 20, 128, 128, 128);
      g.addColorStop(0, '#e59d48');
      g.addColorStop(0.7, '#b86b24');
      g.addColorStop(1, '#7a3e10');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);

      ctx.strokeStyle = '#632f08';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(128, 128, 108, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#ffd885';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(128, 128, 104, 0, Math.PI * 2);
      ctx.stroke();

      for (let p = 0; p < 12; p++) {
        const ang = (p / 12) * Math.PI * 2;
        const px = 128 + Math.cos(ang) * 72;
        const py = 128 + Math.sin(ang) * 72;
        ctx.fillStyle = '#e8a85a';
        ctx.beginPath();
        ctx.arc(px, py, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#5a2a07';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.fillStyle = '#532204';
      ctx.font = 'bold 36px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('中秋', 128, 128);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 2.10 柔和夜雾微粒圆形羽化贴图（杜绝方块噪点）
    function createMistParticleTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      g.addColorStop(0.25, 'rgba(215, 235, 255, 0.6)');
      g.addColorStop(0.65, 'rgba(160, 200, 240, 0.16)');
      g.addColorStop(1, 'rgba(120, 160, 220, 0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    // 2.11 真实桂花树叶形贴图（带叶脉与自然外形透明通道）
    function createLeafTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 64;
      const ctx = c.getContext('2d');

      ctx.clearRect(0, 0, 128, 64);
      // 绘制柳叶形/桂花椭圆革质叶片
      ctx.beginPath();
      ctx.ellipse(64, 32, 56, 22, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#1e5224';
      ctx.fill();

      // 叶缘明亮微反光
      ctx.strokeStyle = '#2d6e35';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 主叶脉
      ctx.strokeStyle = '#4da359';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(10, 32);
      ctx.lineTo(118, 32);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 2.12 粉白荷花花瓣渐变贴图（玉白透粉红，晶莹剔透）
    function createPetalTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 256;
      const ctx = c.getContext('2d');

      ctx.clearRect(0, 0, 128, 256);

      // 花瓣椭圆轮廓
      ctx.beginPath();
      ctx.moveTo(64, 15);
      ctx.bezierCurveTo(120, 70, 120, 200, 64, 245);
      ctx.bezierCurveTo(8, 200, 8, 70, 64, 15);
      ctx.closePath();

      // 从下至上：玉白渐变至娇嫩粉红
      const grad = ctx.createLinearGradient(64, 250, 64, 20);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.45, '#fff0f5');
      grad.addColorStop(0.75, '#f8a5c2');
      grad.addColorStop(1, '#e05688');
      ctx.fillStyle = grad;
      ctx.fill();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 准备全局复用贴图与材质

    bankMesh2.receiveShadow = true;

    // 驳岸边缘散置错落自然怪石（带青苔）
    const rockCoords = [
      { x: -1.3, z: 0.3, s: 0.65 },

    rockCoords.forEach((r) => {

    // 6.2 横跨水面的微型石拱桥 (Stone Arch Bridge)
    const bridgeGroup = new THREE.Group();

    // ============================================================================

    // 7.3 水榭围栏与临水“美人靠”木椅

      for (let i = 0; i <= count; i++) {
        const factor = count > 0 ? (i / count) - 0.5 : 0;
        const px = w > d ? x + factor * w : x;
        const pz = d >= w ? z + factor * d : z;
        const pG = new THREE.CylinderGeometry(0.018, 0.018, 0.4, 8);

        pM.position.set(px, y + 0.25, pz);

    // 7.5 带翘角飞檐的古建筑传统歇山/攒尖大屋顶 (Curved Flying Eaves Roof)
    const roofNx = 32;
    const roofNz = 32;
    const roofHalfW = 2.25;
    const roofHalfD = 2.15;
    const roofApexH = 4.15;
    const roofEaveH = 2.82;

    const roofPositions = [];
    const roofUvs = [];
    const roofIndices = [];

    for (let iz = 0; iz <= roofNz; iz++) {
      const v = iz / roofNz;
      const z = (v - 0.5) * 2 * roofHalfD;
      const absZ = Math.abs(z) / roofHalfD;

      for (let ix = 0; ix <= roofNx; ix++) {
        const u = ix / roofNx;
        const x = (u - 0.5) * 2 * roofHalfW;
        const absX = Math.abs(x) / roofHalfW;

        const distFromCenter = Math.max(absX, absZ);
        let y = roofApexH - Math.pow(distFromCenter, 1.25) * (roofApexH - roofEaveH);

        const cornerFactor = Math.pow(absX * absZ, 2.2);
        const cornerLift = cornerFactor * 0.58;
        y += cornerLift;

        const pushOut = cornerFactor * 0.32;
        const finalX = x * (1.0 + pushOut * 0.2);
        const finalZ = z * (1.0 + pushOut * 0.2);

        roofPositions.push(finalX, y, finalZ);
        roofUvs.push(u * 5.0, v * 5.0);
      }
    }

    for (let iz = 0; iz < roofNz; iz++) {
      for (let ix = 0; ix < roofNx; ix++) {
        const a = iz * (roofNx + 1) + ix;
        const b = a + 1;
        const c = a + (roofNx + 1);
        const d = c + 1;
        roofIndices.push(a, c, b);
        roofIndices.push(b, c, d);
      }
    }

    roofGeo.setAttribute('position', new THREE.Float32BufferAttribute(roofPositions, 3));
    roofGeo.setAttribute('uv', new THREE.Float32BufferAttribute(roofUvs, 2));

    const leftEarPivot = new THREE.Group();
    leftEarPivot.position.set(0.05, 0.38, 0.12);
    const leftEarMesh = new THREE.Mesh(earGeo, rabbitMat);
    leftEarMesh.scale.set(0.7, 1.0, 0.4);
    leftEarMesh.castShadow = true;
    leftEarPivot.add(leftEarMesh);
    leftEarPivot.rotation.z = -0.15;
    leftEarPivot.rotation.x = -0.18;
    rabbitGroup.add(leftEarPivot);

    const rightEarPivot = new THREE.Group();
    rightEarPivot.position.set(-0.05, 0.38, 0.12);
    const rightEarMesh = new THREE.Mesh(earGeo, rabbitMat);
    rightEarMesh.scale.set(0.7, 1.0, 0.4);
    rightEarMesh.castShadow = true;
    rightEarPivot.add(rightEarMesh);
    rightEarPivot.rotation.z = 0.15;
    rightEarPivot.rotation.x = -0.12;
    rabbitGroup.add(rightEarPivot);

    scene.add(rabbitGroup);

    // ============================================================================
    // 11. 荷花、荷苞与翠绿荷叶水景区
    // ============================================================================
    const lotusGroup = new THREE.Group();
    lotusGroup.position.set(0.8, 0.0, 1.6);

    // 11.1 大小错落的平展荷叶
    const lotusLeafCoords = [
      { x: 0.0, z: 0.0, r: 0.58, h: 0.02, tiltX: 0.05, tiltZ: -0.04 },
      { x: -0.7, z: 0.5, r: 0.45, h: 0.08, tiltX: -0.08, tiltZ: 0.06 },
      { x: 0.65, z: -0.4, r: 0.52, h: 0.03, tiltX: 0.06, tiltZ: 0.08 },
      { x: -0.5, z: -0.7, r: 0.38, h: 0.15, tiltX: 0.12, tiltZ: -0.05 },
      { x: 0.9, z: 0.6, r: 0.48, h: 0.02, tiltX: -0.05, tiltZ: -0.06 },
      { x: -1.3, z: 0.1, r: 0.35, h: 0.02, tiltX: 0.04, tiltZ: 0.04 }
    ];

    lotusLeafCoords.forEach(c => {
      const leafG = new THREE.CylinderGeometry(c.r, c.r, 0.015, 32);
      const leafM = new THREE.MeshStandardMaterial({
        map: lotusLeafTex,
        roughness: 0.35,
        metalness: 0.05,
        side: THREE.DoubleSide
      });
      const lMesh = new THREE.Mesh(leafG, leafM);
      lMesh.position.set(c.x, c.h, c.z);
      lMesh.rotation.set(c.tiltX, Math.random() * Math.PI, c.tiltZ);
      lMesh.castShadow = true;
      lMesh.receiveShadow = true;
      lotusGroup.add(lMesh);

      if (c.h > 0.05) {
        const stemG = new THREE.CylinderGeometry(0.018, 0.018, c.h + 0.4, 8);
        const stemM = new THREE.MeshStandardMaterial({ color: 0x1f4a1c, roughness: 0.7 });
        const stem = new THREE.Mesh(stemG, stemM);
        stem.position.set(c.x, (c.h - 0.4) / 2, c.z);
        lotusGroup.add(stem);
      }

      // 晶莹水珠
      const dropG = new THREE.SphereGeometry(0.022, 12, 12);
      const dropM = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.02,
        metalness: 0.9,
        transparent: true,
        opacity: 0.85
      });
      const drop = new THREE.Mesh(dropG, dropM);
      drop.position.set(c.x + 0.06, c.h + 0.015, c.z - 0.04);
      lotusGroup.add(drop);
    });

    // 11.2 粉白相间的盛开荷花
    function createLotusFlower(fx, fz, fh, scale, isBud = false) {
      const fGroup = new THREE.Group();
      fGroup.position.set(fx, fh, fz);

      if (!isBud) {
        const petalMat = new THREE.MeshStandardMaterial({
          map: petalTex,
          roughness: 0.28,
          metalness: 0.05,
          transparent: true,
          side: THREE.DoubleSide
        });

        const podGeo = new THREE.CylinderGeometry(0.045 * scale, 0.03 * scale, 0.035 * scale, 12);
        const podMat = new THREE.MeshStandardMaterial({ color: 0xc8dd45, roughness: 0.4 });
        const pod = new THREE.Mesh(podGeo, podMat);
        pod.position.y = 0.04 * scale;
        fGroup.add(pod);

        const stamenGeo = new THREE.TorusGeometry(0.052 * scale, 0.008 * scale, 8, 16);
        const stamenMat = new THREE.MeshBasicMaterial({ color: 0xffc107 });
        const stamen = new THREE.Mesh(stamenGeo, stamenMat);
        stamen.rotation.x = Math.PI / 2;
        stamen.position.y = 0.042 * scale;
        fGroup.add(stamen);

        const layers = [
          { count: 6, rad: 0.12 * scale, lift: 0.03 * scale, slant: 0.75, pScale: 0.08 * scale },
          { count: 8, rad: 0.18 * scale, lift: 0.02 * scale, slant: 0.52, pScale: 0.11 * scale },
          { count: 8, rad: 0.24 * scale, lift: 0.01 * scale, slant: 0.32, pScale: 0.13 * scale }
        ];

        layers.forEach(l => {
          for (let p = 0; p < l.count; p++) {
            const pAng = (p / l.count) * Math.PI * 2;
            const pMesh = new THREE.Mesh(new THREE.PlaneGeometry(l.pScale * 0.9, l.pScale * 1.6), petalMat);
            pMesh.position.set(Math.cos(pAng) * l.rad, l.lift + l.pScale * 0.45, Math.sin(pAng) * l.rad);
            pMesh.rotation.y = -pAng - Math.PI / 2;
            pMesh.rotation.x = l.slant;
            fGroup.add(pMesh);
          }
        });
      } else {
        const budGeo = new THREE.ConeGeometry(0.05 * scale, 0.18 * scale, 8);
        const budMat = new THREE.MeshStandardMaterial({ color: 0xf48fb1, roughness: 0.35 });
        const bud = new THREE.Mesh(budGeo, budMat);
        bud.position.y = 0.09 * scale;
        fGroup.add(bud);
      }

      const stemG = new THREE.CylinderGeometry(0.015 * scale, 0.018 * scale, fh + 0.3, 8);
      const stemM = new THREE.MeshStandardMaterial({ color: 0x275924, roughness: 0.7 });
      const stem = new THREE.Mesh(stemG, stemM);
      stem.position.y = -(fh + 0.3) / 2 + 0.02;
      fGroup.add(stem);

      return fGroup;
    }

    lotusGroup.add(createLotusFlower(-0.15, 0.28, 0.18, 1.15, false));
    lotusGroup.add(createLotusFlower(0.45, 0.15, 0.26, 0.95, false));
    lotusGroup.add(createLotusFlower(-0.85, -0.2, 0.22, 0.85, true));
    scene.add(lotusGroup);

    // ============================================================================
    // 12. 池水中小金鱼/锦鲤游弋系统
    // ============================================================================
    const fishGroup = new THREE.Group();
    const fishCount = 5;
    const fishList = [];

    for (let f = 0; f < fishCount; f++) {
      const fSub = new THREE.Group();

      const fishColor = (f % 2 === 0) ? 0xf44336 : 0xff9800;
      const fishMat = new THREE.MeshStandardMaterial({
        color: fishColor,
        roughness: 0.2,
        metalness: 0.1,
        emissive: new THREE.Color(fishColor),
        emissiveIntensity: 0.2
      });

      const fBody = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.24, 12), fishMat);
      fBody.rotation.x = Math.PI / 2;
      fBody.scale.set(0.65, 1.0, 1.0);
      fSub.add(fBody);

      const tailJoint = new THREE.Group();
      tailJoint.position.set(0, 0, -0.12);

      const tailFinGeo = new THREE.PlaneGeometry(0.08, 0.14);
      const tailFinMat = new THREE.MeshStandardMaterial({
        color: 0xffccaa,
        transparent: true,
        opacity: 0.8,
        roughness: 0.3,
        side: THREE.DoubleSide
      });
      const tailFin = new THREE.Mesh(tailFinGeo, tailFinMat);
      tailFin.position.set(0, 0, -0.07);
      tailFin.rotation.y = Math.PI / 2;
      tailJoint.add(tailFin);
      fSub.add(tailJoint);

      const finGeo = new THREE.PlaneGeometry(0.04, 0.07);
      const leftFin = new THREE.Mesh(finGeo, tailFinMat);
      leftFin.position.set(0.035, -0.01, 0.04);
      leftFin.rotation.set(0.4, 0.6, -0.5);
      const rightFin = new THREE.Mesh(finGeo, tailFinMat);
      rightFin.position.set(-0.035, -0.01, 0.04);
      rightFin.rotation.set(0.4, -0.6, 0.5);
      fSub.add(leftFin, rightFin);

      const swimRadius = 1.1 + f * 0.45;
      const swimSpeed = 0.5 + Math.random() * 0.4;
      const swimPhase = (f / fishCount) * Math.PI * 2;
      const swimDepth = -0.08 - (f % 3) * 0.07;

      fishList.push({
        group: fSub,
        tail: tailJoint,
        radius: swimRadius,
        speed: swimSpeed,
        phase: swimPhase,
        depth: swimDepth,
        centerX: 0.4 + (f % 2) * 0.4,
        centerZ: 1.2 - (f % 3) * 0.4
      });

      fishGroup.add(fSub);
    }
    scene.add(fishGroup);

    // ============================================================================
    // 13. 水面缭绕薄薄微光夜雾粒子 (Gentle Shimmering Night Mist)
    // ============================================================================
    const mistCount = 45;
    const mistGeo = new THREE.BufferGeometry();
    const mistPositions = new Float32Array(mistCount * 3);
    const mistData = [];

    for (let m = 0; m < mistCount; m++) {
      const mx = (Math.random() - 0.5) * 12;
      const my = 0.12 + Math.random() * 0.4;
      const mz = (Math.random() - 0.5) * 12;
      mistPositions[m * 3] = mx;
      mistPositions[m * 3 + 1] = my;
      mistPositions[m * 3 + 2] = mz;
      mistData.push({
        baseX: mx,
        baseZ: mz,
        phase: Math.random() * Math.PI * 2
      });
    }
    mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPositions, 3));
    const mistMat = new THREE.PointsMaterial({
      color: 0xa8c5e2,
      map: mistParticleTex,
      size: 1.6,
      transparent: true,
      opacity: 0.28,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const mistPoints = new THREE.Points(mistGeo, mistMat);
    scene.add(mistPoints);

    // ============================================================================
    // 14. 交互式多视角平滑运镜系统
    // ============================================================================
    const cameraPresets = {
      full: {
        pos: new THREE.Vector3(0.6, 3.2, 8.4),
        target: new THREE.Vector3(0.1, 1.25, 0.0)
      },
      tea: {
        pos: new THREE.Vector3(-1.35, 1.55, 0.45),
        target: new THREE.Vector3(-1.7, 0.95, -0.85)
      },
      rabbit: {
        pos: new THREE.Vector3(-0.15, 1.35, 2.35),
        target: new THREE.Vector3(-0.6, 0.78, 0.82)
      },
      lotus: {
        pos: new THREE.Vector3(2.4, 1.95, 3.7),
        target: new THREE.Vector3(0.8, 0.38, 1.4)
      }
    };

    let targetCamPos = cameraPresets.full.pos.clone();
    let targetCamLook = cameraPresets.full.target.clone();
    let isTransitioningCam = false;

    const camButtons = document.querySelectorAll('.cam-btn');
    camButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        camButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const key = btn.dataset.cam;
        if (cameraPresets[key]) {
          targetCamPos.copy(cameraPresets[key].pos);
          targetCamLook.copy(cameraPresets[key].target);
          isTransitioningCam = true;
        }
      });
    });

    controls.addEventListener('start', () => {
      isTransitioningCam = false;
    });

    // ============================================================================
    // 15. 主动画循环 (Animation Loop - 稳健 60FPS)
    // ============================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // 15.1 镜头平滑插值过渡
      if (isTransitioningCam) {
        camera.position.lerp(targetCamPos, 0.06);
        controls.target.lerp(targetCamLook, 0.06);
        if (camera.position.distanceTo(targetCamPos) < 0.02) {
          isTransitioningCam = false;
        }
      }
      controls.update();

      // 15.2 水面微波流动法线贴图偏移
      if (waterMat.normalMap) {
        waterMat.normalMap.offset.x = (elapsedTime * 0.016) % 1;
        waterMat.normalMap.offset.y = (elapsedTime * 0.011) % 1;
      }
      moonReflectMesh.material.opacity = 0.38 + Math.sin(elapsedTime * 1.8) * 0.06;

      // 15.3 桂花树枝在夜风中轻微优雅摇曳
      treeGroup.rotation.z = Math.sin(elapsedTime * 0.85) * 0.016;
      treeGroup.rotation.x = Math.cos(elapsedTime * 0.65) * 0.012;

      // 15.4 桂花花瓣飘落与水面涟漪漂浮计算
      const dummyP = new THREE.Object3D();
      for (let p = 0; p < petalParticleCount; p++) {
        const pd = petalData[p];

        if (pd.state === 'falling') {
          pd.x += pd.vx + Math.sin(elapsedTime * 1.5 + p) * 0.003;
          pd.y += pd.vy;
          pd.z += pd.vz + Math.cos(elapsedTime * 1.2 + p) * 0.003;
          pd.rotX += pd.vRotX;
          pd.rotY += pd.vRotY;
          pd.rotZ += pd.vRotZ;

          if (pd.y <= 0.015) {
            pd.y = 0.012;
            pd.state = 'floating';
            pd.floatTimer = 0;
            pd.rotX = Math.PI / 2;
            pd.rotZ = Math.random() * Math.PI * 2;
          }
        } else {
          pd.floatTimer += 0.016;
          pd.x -= 0.0022;
          pd.z += Math.sin(elapsedTime * 2.0 + p) * 0.0014;

          if (pd.floatTimer > 6.5) {
            pd.x = treeGroup.position.x - 1.2 + (Math.random() - 0.5) * 2.8;
            pd.y = 2.4 + Math.random() * 2.2;
            pd.z = treeGroup.position.z + 0.6 + (Math.random() - 0.5) * 2.8;
            pd.state = 'falling';
          }
        }

        dummyP.position.set(pd.x, pd.y, pd.z);
        dummyP.rotation.set(pd.rotX, pd.rotY, pd.rotZ);
        dummyP.scale.setScalar(pd.state === 'floating' ? 0.95 : 1.0);
        dummyP.updateMatrix();
        fallingPetalsMesh.setMatrixAt(p, dummyP.matrix);
      }
      fallingPetalsMesh.instanceMatrix.needsUpdate = true;

      // 15.5 玉兔灵动行为：耳朵偶尔转动扇动、微弱呼吸起伏
      const earTwitchCycle = Math.sin(elapsedTime * 0.7);
      if (earTwitchCycle > 0.88) {
        const twitch = Math.sin(elapsedTime * 22) * 0.18;
        leftEarPivot.rotation.z = -0.15 + twitch;
        rightEarPivot.rotation.z = 0.15 - twitch * 0.8;
        rightEarPivot.rotation.x = -0.12 + Math.cos(elapsedTime * 18) * 0.12;
      } else {
        leftEarPivot.rotation.z = -0.15 + Math.sin(elapsedTime * 1.2) * 0.03;
        rightEarPivot.rotation.z = 0.15 + Math.cos(elapsedTime * 1.5) * 0.03;
      }
      rBody.scale.y = 0.9 + Math.sin(elapsedTime * 2.2) * 0.02;

      // 15.6 小金鱼池中摆尾环游
      fishList.forEach(fish => {
        fish.phase += fish.speed * 0.018;
        const fx = fish.centerX + Math.cos(fish.phase) * fish.radius;
        const fz = fish.centerZ + Math.sin(fish.phase) * (fish.radius * 0.85);

        fish.group.position.set(fx, fish.depth + Math.sin(elapsedTime * 2.0 + fish.phase) * 0.015, fz);

        const nextX = fish.centerX + Math.cos(fish.phase + 0.02) * fish.radius;
        const nextZ = fish.centerZ + Math.sin(fish.phase + 0.02) * (fish.radius * 0.85);
        fish.group.rotation.y = Math.atan2(nextX - fx, nextZ - fz);

        fish.tail.rotation.y = Math.sin(elapsedTime * 7.5 + fish.phase * 3) * 0.45;
      });

      // 15.7 水面薄雾缓步漂浮与热茶蒸汽升腾
      const mPos = mistGeo.attributes.position;
      for (let m = 0; m < mistCount; m++) {
        const md = mistData[m];
        const newX = md.baseX + Math.sin(elapsedTime * 0.22 + md.phase) * 1.2;
        const newZ = md.baseZ + Math.cos(elapsedTime * 0.18 + md.phase) * 1.2;
        mPos.setX(m, newX);
        mPos.setZ(m, newZ);
      }
      mistGeo.attributes.position.needsUpdate = true;

      const sPos = steamGeo.attributes.position;
      for (let s = 0; s < steamCount; s++) {
        let sy = sPos.getY(s) + steamSeeds[s].speed * 0.016;
        if (sy > 0.88) {
          sy = 0.58;
          sPos.setX(s, steamSeeds[s].baseX + (Math.random() - 0.5) * 0.03);
          sPos.setZ(s, steamSeeds[s].baseZ + (Math.random() - 0.5) * 0.03);
        }
        sPos.setY(s, sy);
        sPos.setX(s, sPos.getX(s) + Math.sin(elapsedTime * 3.0 + s) * 0.0008);
      }
      steamGeo.attributes.position.needsUpdate = true;

      // 15.8 红纸灯笼微弱烛光呼吸明暗
      const flicker = Math.sin(elapsedTime * 4.5) * 0.08 + Math.cos(elapsedTime * 9.2) * 0.05;
      lanternLightList.forEach(l => {
        l.intensity = 1.85 + flicker;
      });

      // 15.9 后期辉光合成渲染
      composer.render();
    }

    // ============================================================================
    // 16. 窗口自适应缩放响应
    // ============================================================================
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      updateCameraAspect();

      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      composer.setSize(w, h);
      bloomPass.resolution.set(w, h);
    });

    animate();
  </script>

  <script src="../prompt-panel.js" data-id="midautumn"></script>
</body>
</html>
