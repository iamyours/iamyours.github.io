<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================= 渲染器 / 场景 / 相机 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.className = 'labels';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
const HOME_TARGET = new THREE.Vector3(0, 1.1, -0.5);
const EXP_TARGET = new THREE.Vector3(0, 1.9, -1.1);
const mobileK = () => (camera.aspect < 0.8 ? 1.65 : 1);
camera.position.set(7.5, 5.2, 8.5).sub(HOME_TARGET).multiplyScalar(mobileK()).add(HOME_TARGET);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 3;
controls.maxDistance = 45;
controls.update();

// 程序化环境贴图，金属反射更真实
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2622, 0.55));
const keyLight = new THREE.DirectionalLight(0xfff4e6, 2.2);
keyLight.position.set(6, 12, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
Object.assign(keyLight.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 });
keyLight.shadow.camera.updateProjectionMatrix();
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight, keyLight.target);
const rimLight = new THREE.DirectionalLight(0x9cc4ff, 0.9);
rimLight.position.set(-8, 5, -6);
scene.add(rimLight);

const FLOOR_Y = -4.1;
const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.ShadowMaterial({ opacity: 0.35 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = FLOOR_Y;
floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(24, 48, 0x6b7686, 0x3a424e);
grid.position.y = FLOOR_Y + 0.002;
grid.material.transparent = true;
grid.material.opacity = 0.22;
grid.material.depthWrite = false;
scene.add(grid);

/* ================= 常量与工具 ================= */
const XS = [1.425, 0.475, -0.475, -1.425];   // 缸 1~4 的 x 坐标（缸 1 位于正时皮带端）
const OFF = [0, 540, 180, 360];              // 各缸做功上止点相对缸 1 的循环角（点火顺序 1-3-4-2）
const PHASE = [0, Math.PI, Math.PI, 0];      // 曲柄销相位：1/4 缸同相，2/3 缸相差 180°
const CR = 0.4, ROD = 1.4, BORE = 0.37, DECK = 2.1;
const TILT = THREE.MathUtils.degToRad(20);   // 气门夹角
const SEAT_Y = 2.14, LMAX = 0.1, CAM_D = 0.92;
const CAM_Y = SEAT_Y + CAM_D * Math.cos(TILT);
const CAM_Z = 0.15 + CAM_D * Math.sin(TILT);
const BELT_X = 2.25;
const JOURNALS = [-1.9, -0.95, 0, 0.95, 1.9];
const IN_OPEN = 345, EX_OPEN = 135, DUR = 240; // 气门正时（曲轴角，度）
const D2R = Math.PI / 180;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp01 = x => Math.min(1, Math.max(0, x));
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

const cylX = (r1, r2, len, seg = 32) => new THREE.CylinderGeometry(r1, r2, len, seg).rotateZ(Math.PI / 2);
const cylY = (r1, r2, len, seg = 32, open = false) => new THREE.CylinderGeometry(r1, r2, len, seg, 1, open);
const cylZ = (r1, r2, len, seg = 32) => new THREE.CylinderGeometry(r1, r2, len, seg).rotateX(Math.PI / 2);
// 在 YZ 平面内的截面沿 X 轴拉伸（截面 x→世界 -z，截面 y→世界 y）
function extrudeX(shape, depth, seg = 24) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: seg });
  g.translate(0, 0, -depth / 2);
  g.rotateY(Math.PI / 2);
  return g;
}
function mesh(geo, mat, parent, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
function gearShape(n, rRoot, rTip, rHole) {
  const s = new THREE.Shape();
  const step = Math.PI * 2 / n;
  for (let k = 0; k < n; k++) {
    const a = k * step;
    const pts = [[a, rRoot], [a + step * 0.2, rTip], [a + step * 0.5, rTip], [a + step * 0.7, rRoot]];
    pts.forEach(([aa, r], j) => {
      const x = r * Math.cos(aa), y = r * Math.sin(aa);
      if (k === 0 && j === 0) s.moveTo(x, y); else s.lineTo(x, y);
    });
  }
  if (rHole > 0) { const h = new THREE.Path(); h.absarc(0, 0, rHole, 0, Math.PI * 2, true); s.holes.push(h); }
  return s;
}

/* ================= 程序化贴图 ================= */
function makeCastTex() {
  const s = 256, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const g = cv.getContext('2d');
  const img = g.createImageData(s, s);
  for (let i = 0; i < s * s; i++) {
    const v = 150 + (Math.random() * 56 - 28);
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  for (let k = 0; k < 600; k++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.09)' : 'rgba(255,255,255,0.09)';
    g.beginPath();
    g.arc(Math.random() * s, Math.random() * s, Math.random() * 3 + 0.5, 0, Math.PI * 2);
    g.fill();
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 2);
  return t;
}
function makeBeltTex() {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 32;
  const g = cv.getContext('2d');
  g.fillStyle = '#1c1d20'; g.fillRect(0, 0, 256, 32);
  g.fillStyle = '#26272b';
  for (let x = 0; x < 256; x += 16) g.fillRect(x, 0, 7, 32);
  g.fillStyle = '#e6e6e6'; g.fillRect(24, 13, 50, 6);
  g.fillStyle = '#ffb347'; g.fillRect(92, 13, 14, 6);
  g.fillStyle = '#d8d8d8'; g.font = 'bold 15px sans-serif'; g.fillText('正时 TIMING', 120, 22);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping;
  return t;
}
function makeGlowTex(inner, outer) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, inner); gr.addColorStop(0.35, outer); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const castTex = makeCastTex();
const sparkTex = makeGlowTex('rgba(255,255,255,1)', 'rgba(120,180,255,0.7)');
const dotTex = makeGlowTex('rgba(255,255,255,1)', 'rgba(255,255,255,0.35)');

/* ================= 材质 ================= */
const std = o => new THREE.MeshStandardMaterial(o);
const M = {
  alu: () => std({ color: 0xb4b9bf, metalness: 0.7, roughness: 0.5, bumpMap: castTex, bumpScale: 0.5 }),
  aluDark: () => std({ color: 0x7f858c, metalness: 0.7, roughness: 0.55, bumpMap: castTex, bumpScale: 0.5 }),
  iron: () => std({ color: 0x5b6067, metalness: 0.8, roughness: 0.45 }),
  steel: () => std({ color: 0xd6dade, metalness: 1, roughness: 0.22 }),
  forged: () => std({ color: 0x8a9098, metalness: 0.95, roughness: 0.38 }),
  black: () => std({ color: 0x1c1e22, metalness: 0.1, roughness: 0.62 }),
  rubber: () => std({ color: 0x151517, metalness: 0, roughness: 0.9 }),
  paint: c => std({ color: c, metalness: 0.3, roughness: 0.45 }),
  ceramic: () => std({ color: 0xf1eee6, metalness: 0, roughness: 0.3 }),
  exhaust: () => std({ color: 0x7a6656, metalness: 0.85, roughness: 0.55, bumpMap: castTex, bumpScale: 0.4 }),
};
// 标记可透视的材质（xo 为透视时的不透明度）
const xr = (m, o) => { m.userData.xo = o; return m; };

/* ================= 部件系统 ================= */
const engine = new THREE.Group();
scene.add(engine);
const parts = [];
function makePart(name, desc, offset, labelAt, delay = 0) {
  const g = new THREE.Group();
  engine.add(g);
  const el = document.createElement('div');
  el.className = 'tag';
  el.textContent = name;
  el.style.opacity = '0';
  const label = new CSS2DObject(el);
  label.position.set(...labelAt);
  g.add(label);
  const p = { name, desc, g, el, label, offset: V(...offset), delay, e: 0, h: 0, mats: [] };
  parts.push(p);
  return p;
}

// 带四个缸孔的平板（缸体 / 缸垫共用）
function boredPlate(depth, w = 3.9, d = 1.24) {
  const sh = new THREE.Shape();
  sh.moveTo(-w / 2, -d / 2); sh.lineTo(w / 2, -d / 2); sh.lineTo(w / 2, d / 2); sh.lineTo(-w / 2, d / 2); sh.closePath();
  XS.forEach(x => { const h = new THREE.Path(); h.absarc(x, 0, BORE, 0, Math.PI * 2, true); sh.holes.push(h); });
  const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: false, curveSegments: 40 });
  g.rotateX(-Math.PI / 2); // 拉伸方向变为 +Y
  return g;
}

/* ---------- 缸体 ---------- */
const pBlock = makePart('缸体', '铸铝骨架，内含四个气缸套、冷却水道与曲轴主轴承座。', [0, 0, 0], [-1.0, 1.5, -0.8], 0);
{
  const mat = xr(M.alu(), 0.2);
  const linerM = xr(M.iron(), 0.16);
  linerM.side = THREE.DoubleSide;
  mesh(boredPlate(DECK - 0.27).translate(0, 0.27, 0), mat, pBlock.g);
  mesh(new RoundedBoxGeometry(3.9, 0.64, 1.46, 3, 0.05), mat, pBlock.g, 0, -0.05, 0); // 曲轴箱
  XS.forEach(x => mesh(cylY(BORE, BORE, DECK - 0.27, 40, true), linerM, pBlock.g, x, (DECK + 0.27) / 2, 0));
  const ribG = new THREE.BoxGeometry(0.07, 1.5, 0.05);
  JOURNALS.forEach(x => [-1, 1].forEach(s => mesh(ribG, mat, pBlock.g, x, 1.1, s * 0.645)));
  const ribH = new THREE.BoxGeometry(3.7, 0.06, 0.05);
  [-1, 1].forEach(s => mesh(ribH, mat, pBlock.g, 0, 1.95, s * 0.645));
  const capM = xr(M.iron(), 0.35);
  JOURNALS.forEach(x => mesh(new THREE.BoxGeometry(0.16, 0.16, 0.62), capM, pBlock.g, x, -0.24, 0));
  // 机油滤清器
  mesh(cylZ(0.2, 0.2, 0.05, 32), M.aluDark(), pBlock.g, 0.7, 0.55, -0.645);
  mesh(cylZ(0.17, 0.17, 0.36, 32), M.paint(0x1f4fa0), pBlock.g, 0.7, 0.55, -0.85);
  mesh(cylZ(0.12, 0.17, 0.04, 32), M.paint(0x1f4fa0), pBlock.g, 0.7, 0.55, -1.05);
  // 发动机支架
  [-1, 1].forEach(s => mesh(new RoundedBoxGeometry(0.3, 0.3, 0.12, 2, 0.03), M.iron(), pBlock.g, -0.95 + s * 0.3, 0.75, s * 0.68));
}

/* ---------- 缸盖 ---------- */
const pHead = makePart('缸盖', '封闭燃烧室顶部，集成进排气道、气门座与凸轮轴轴承座。', [0, 2.2, 0], [-1.55, 2.85, 0.75], 0.06);
{
  const mat = xr(M.alu(), 0.22);
  mesh(new RoundedBoxGeometry(3.9, 0.68, 1.24, 3, 0.04), mat, pHead.g, 0, 2.44, 0);
  mesh(boredPlate(0.02, 3.92, 1.26).translate(0, 2.09, 0), xr(M.paint(0x3b3d40), 0.5), pHead.g); // 缸垫
  const carM = xr(M.alu(), 0.4);
  const carG = new THREE.BoxGeometry(0.13, 0.24, 0.28), capG = new RoundedBoxGeometry(0.13, 0.12, 0.3, 2, 0.03);
  JOURNALS.forEach(x => [-1, 1].forEach(s => {
    mesh(carG, carM, pHead.g, x, 2.88, s * CAM_Z);
    mesh(capG, carM, pHead.g, x, 3.06, s * CAM_Z);
  }));
  // 进排气道
  const portM = M.aluDark();
  XS.forEach(x => [-1, 1].forEach(s => {
    const c = new THREE.CatmullRomCurve3([V(x, 2.45, s * 0.66), V(x, 2.42, s * 0.42), V(x, 2.3, s * 0.22), V(x, 2.17, s * 0.15)]);
    mesh(new THREE.TubeGeometry(c, 16, 0.075, 12), portM, pHead.g);
  }));
  const flG = new THREE.BoxGeometry(3.7, 0.36, 0.04);
  [-1, 1].forEach(s => mesh(flG, mat, pHead.g, 0, 2.45, s * 0.635));
  [-1, 1].forEach(s => mesh(cylX(0.1, 0.1, 0.05, 24), mat, pHead.g, 1.97, CAM_Y, s * CAM_Z)); // 凸轮轴油封座
  const eye = mesh(new THREE.TorusGeometry(0.09, 0.025, 8, 20), M.iron(), pHead.g, -1.8, 2.9, 0.3); // 吊耳
  eye.rotation.y = Math.PI / 2;
}

/* ---------- 气门组（16 气门） ---------- */
class Helix extends THREE.Curve {
  constructor(r, h, turns) { super(); this.r = r; this.h = h; this.turns = turns; }
  getPoint(t, target = new THREE.Vector3()) {
    const a = t * this.turns * Math.PI * 2;
    return target.set(this.r * Math.cos(a), t * this.h, this.r * Math.sin(a));
  }
}
const pValves = makePart('气门组 ×16', '每缸两进两排，由凸轮顶开、弹簧回位，控制燃烧室的开闭。', [0, 3.0, 0], [-1.85, 2.95, -0.3], 0.1);

function lobeShape() {
  const s = new THREE.Shape(), N = 90, half = Math.PI / 3; // 凸轮作用角 ±60°（对应曲轴 240°）
  for (let k = 0; k <= N; k++) {
    const ang = k / N * Math.PI * 2;
    const psi = ang > Math.PI ? ang - Math.PI * 2 : ang;
    const f = Math.abs(psi) < half ? 0.5 + 0.5 * Math.cos(Math.PI * psi / half) : 0;
    const r = 0.12 + LMAX * f;
    const x = r * Math.sin(ang), y = -r * Math.cos(ang); // 凸轮尖朝 -Y
    if (k === 0) s.moveTo(x, y); else s.lineTo(x, y);
  }
  return s;
}

function hull2D(pts) {
  pts.sort((a, b) => a.u - b.u || a.v - b.v);
  const cross = (o, a, b) => (a.u - o.u) * (b.v - o.v) - (a.v - o.v) * (b.u - o.u);
  const lower = [], upper = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop(); lower.pop();
  return lower.concat(upper); // 逆时针
}
const belt = (() => {
  const raw = [];
  pulleys.forEach(c => {
    for (let k = 0; k < 120; k++) {
      const a = k / 120 * Math.PI * 2;
      raw.push({ u: c.u + (c.r + BELT_T / 2) * Math.cos(a), v: c.v + (c.r + BELT_T / 2) * Math.sin(a) });
    }
  });
  const poly = hull2D(raw), m = poly.length;
  const L = [0];
  for (let i = 0; i < m; i++) {
    const a = poly[i], b = poly[(i + 1) % m];
    L.push(L[i] + Math.hypot(b.u - a.u, b.v - a.v));
  }
  const len = L[m], n = 480, P = [], N = [];
  let j = 0;
  for (let k = 0; k < n; k++) {
    const s = k / n * len;
    while (j < m - 1 && L[j + 1] < s) j++;
    const a = poly[j], b = poly[(j + 1) % m];
    const t = (s - L[j]) / ((L[j + 1] - L[j]) || 1);
    P.push({ u: a.u + (b.u - a.u) * t, v: a.v + (b.v - a.v) * t });
  }
  for (let k = 0; k < n; k++) {
    const a = P[(k - 1 + n) % n], b = P[(k + 1) % n];
    const l = Math.hypot(b.u - a.u, b.v - a.v) || 1;
    N.push({ u: (b.v - a.v) / l, v: -(b.u - a.u) / l }); // 外法线
  }
  return { P, N, len, n };
})();

{

function beltAt(s) {
  const f = (((s % belt.len) + belt.len) % belt.len) / belt.len * belt.n;
  const i = Math.floor(f) % belt.n, j = (i + 1) % belt.n, t = f - Math.floor(f);

  _bp.u = a.u + (b.u - a.u) * t; _bp.v = a.v + (b.v - a.v) * t;
  _bn.u = na.u + (nb.u - na.u) * t; _bn.v = na.v + (nb.v - na.v) * t;

function makeFlow(curves, color) {
  const per = 40, count = curves.length * per;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.11, map: dotTex, vertexColors: true, transparent: true, depthWrite: false, depthTest: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true
  }));
  pts.frustumCulled = false;
  pts.renderOrder = 10;
  fx.add(pts);
  return { pts, curves, per, base: new THREE.Color(color) };
}
const flowIn = makeFlow(XS.map(intakePath), 0x58a6ff);

const _fv = new THREE.Vector3();
function updateFlow(f, phase, gate, vis) {
  f.pts.visible = vis > 0.01;
  if (!f.pts.visible) return;
  const pos = f.pts.geometry.attributes.position, col = f.pts.geometry.attributes.color;
  let idx = 0;
  f.curves.forEach((c, ci) => {
    for (let k = 0; k < f.per; k++, idx++) {
      const t = (k / f.per + phase + ci * 0.013) % 1;
      c.getPointAt(t, _fv);
      pos.setXYZ(idx, _fv.x, _fv.y, _fv.z);
      const b = gate(ci, t) * vis * 0.55;
      col.setXYZ(idx, f.base.r * b, f.base.g * b, f.base.b * b);
    }
  });
  pos.needsUpdate = true;
  col.needsUpdate = true;
}

    o.receiveShadow = true;
    const own = matOwner.get(o.material);
    if (own && own !== p) o.material = o.material.clone();
    matOwner.set(o.material, p);
    if (!p.mats.includes(o.material)) {
      p.mats.push(o.material);
      o.material.userData.em0 = o.material.emissive ? o.material.emissive.clone() : null;
    }
    if (o.material.userData.xo !== undefined) xrayMeshes.push(o);
    o.userData.part = p;
    pickables.push(o);
  });
});

}

/* ================= 动画主循环 ================= */
const inLift = [0, 0, 0, 0], exLift = [0, 0, 0, 0], heat = [0, 0, 0, 0];
const HL = new THREE.Color(0x3d7dff), tmpC = new THREE.Color();
const C_FIRE0 = new THREE.Color(0xffe2a0), C_FIRE1 = new THREE.Color(0xff4a12);
const C_EXH = new THREE.Color(0x8a7d72), C_IN = new THREE.Color(0x4d9bff), C_CMP = new THREE.Color(0xffc75a);
let phi = 0, beltS = 0, flowPhase = 0, E = 0;
const lastStroke = [-1, -1, -1, -1], lastSpark = [false, false, false, false];
// 气门升程（0~1），c 为该缸循环角（度）
function liftAt(c, open) {
  const d = ((c - open) % 720 + 720) % 720;
  return d > DUR ? 0 : 0.5 - 0.5 * Math.cos(2 * Math.PI * d / DUR);
}

function updateEngine(dt) {
  const omega = rpm / 60 * Math.PI * 2;
  phi = (phi + omega * dt) % (Math.PI * 4); // 四冲程循环 = 曲轴两圈
  const th = phi;
  crank.rotation.x = th;
  fly.rotation.x = th;
  crankSp.rotation.x = th;
  camIn.cam.rotation.x = camEx.cam.rotation.x = th / 2;
  camSpIn.rotation.x = camSpEx.rotation.x = th / 2;
  tensioner.rotation.x = th * 0.22 / 0.12;
  pumpPulley.rotation.x = th * 0.22 / 0.19;
  // 皮带：线速度 = 曲轴角速度 × 节圆半径
  const vb = omega * (0.22 + BELT_T / 2);
  beltS -= vb * dt;
  beltTex.offset.x = (beltTex.offset.x + vb * dt / belt.len * BELT_REP) % 1;
  updateTeeth(beltS);
  throttlePlate.rotation.x = (0.12 + 0.8 * (rpm - 10) / 470) * Math.PI / 2;

  const phiDeg = phi / D2R;
  const fadeFx = 1 - E;
  let best = 0, bestI = 0;
  for (let i = 0; i < 4; i++) {
    const a = th + PHASE[i];
    const yc = CR * Math.cos(a), zc = CR * Math.sin(a);
    const pinY = yc + Math.sqrt(ROD * ROD - zc * zc);
    pistons[i].position.set(XS[i], pinY, 0);
    rods[i].position.set(XS[i], yc, zc);
    rods[i].rotation.x = Math.atan2(-zc, pinY - yc);

    const c = ((phiDeg - OFF[i]) % 720 + 720) % 720;
    inLift[i] = liftAt(c, IN_OPEN);
    exLift[i] = liftAt(c, EX_OPEN);

    // 缸内气体：按冲程着色
    const top = pinY + 0.22;
    const gm = gas[i];
    gm.position.y = top;
    gm.scale.y = Math.max(0.005, 2.12 - top);
    const stroke = Math.floor(c / 180);
    let op, fire = 0;
    if (stroke === 0) {
      fire = Math.pow(1 - c / 180, 1.6);
      gm.material.color.copy(C_FIRE0).lerp(C_FIRE1, c / 180);
      op = 0.12 + 0.6 * fire;
    } else if (stroke === 1) {
      gm.material.color.copy(C_EXH);
      op = 0.05 + 0.12 * (1 - (c - 180) / 180);
    } else if (stroke === 2) {
      gm.material.color.copy(C_IN);
      op = 0.05 + 0.15 * Math.sin((c - 360) / 180 * Math.PI);
    } else {
      const t = (c - 540) / 180;
      gm.material.color.copy(C_IN).lerp(C_CMP, t);
      op = 0.1 + 0.14 * t;
    }
    gm.material.opacity = op * fadeFx * (xray ? 1 : 0.35);
    gm.visible = gm.material.opacity > 0.003;

    // 火花：压缩上止点前后瞬间放电
    const spark = c < 18 ? 1 - c / 18 : (c > 712 ? (c - 712) / 8 : 0);
    const sp = sparks[i];
    sp.material.opacity = Math.min(1, spark * 1.3);
    sp.scale.setScalar(0.12 + 0.5 * spark);
    sp.visible = spark > 0.001;
    const glow = Math.max(spark, fire);
    if (glow > best) { best = glow; bestI = i; }

    const isSpark = spark > 0.15 || fire > 0.75;
    if (isSpark !== lastSpark[i]) {
      lastSpark[i] = isSpark;
      cyEls[i].classList.toggle('spark', isSpark);
      cylEls[i].classList.toggle('on', isSpark);
    }
    if (stroke !== lastStroke[i]) {
      lastStroke[i] = stroke;
      cyEls[i].className = 'cy s' + stroke + (isSpark ? ' spark' : '');
      cyEls[i].querySelector('span').textContent = STROKES[stroke];
    }

    // 排气歧管热辉光
    heat[i] += (exLift[i] - heat[i]) * Math.min(1, dt * 2.5);
    exhaustPipes[i].material.userData.em0.setRGB(0.9, 0.24, 0.05).multiplyScalar(heat[i] * 0.55);
  }
  fireLight.position.set(XS[bestI], 2.05 + E * pSpark.offset.y, 0);
  fireLight.intensity = best * 7;

  valves.forEach(v => {
    const L = (v.side < 0 ? inLift : exLift)[v.i] * LMAX;
    v.g.position.copy(v.seat).addScaledVector(v.axis, -L);
    v.spring.scale.y = (0.26 - L) / 0.26;
  });

  // 气流粒子：靠近气门的一段随气门升程明暗变化
  flowPhase = (flowPhase + dt * 0.2 * rpm / 60) % 1;
  const vis = flowOn ? fadeFx : 0;
  updateFlow(flowIn, flowPhase, (ci, t) => (t > 0.6 ? 0.12 + 0.88 * inLift[ci] : 0.45), vis);
  updateFlow(flowEx, flowPhase, (ci, t) => (t < 0.35 ? 0.12 + 0.88 * exLift[ci] : 0.5), vis);
}

function updateExplode(dt) {
  E = exploded ? Math.min(1, E + dt / 1.4) : Math.max(0, E - dt / 0.6);
  parts.forEach(p => {
    const k = easeInOut(clamp01((E - p.delay) / (1 - 0.32)));
    p.e = k;
    p.g.position.copy(p.offset).multiplyScalar(k);
    const lo = clamp01((k - 0.55) / 0.45);
    p.el.style.opacity = lo.toFixed(3);
  });
}

function updateHighlight(dt) {
  parts.forEach(p => {
    const target = p === hovered ? 1 : 0;
    p.h += (target - p.h) * Math.min(1, dt * 12);
    p.el.classList.toggle('hl', p === hovered);
    tmpC.copy(HL).multiplyScalar(p.h * 0.45);
    p.mats.forEach(m => { if (m.userData.em0) m.emissive.copy(m.userData.em0).add(tmpC); });
  });
  if (hovered && E > 0.5) hovered.el.style.opacity = '1';
}

function updateCamera(dt) {
  if (!camTween) return;
  camTween.t = Math.min(1, camTween.t + dt / 1.1);
  const k = easeInOut(camTween.t);
  camera.position.lerpVectors(camTween.p0, camTween.p1, k);
  controls.target.lerpVectors(camTween.t0, camTween.t1, k);
  if (camTween.t >= 1) camTween = null;
}
// 用户开始拖动时停止相机补间，避免抢夺控制
controls.addEventListener('start', () => { camTween = null; });

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateExplode(dt);
  updateEngine(dt);
  if (pointerIn && (needPick || (E > 0 && E < 1))) { pick(); needPick = false; }
  updateHighlight(dt);
  updateTip();
  updateCamera(dt);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
frame();
</script>
