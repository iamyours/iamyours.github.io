<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   0. 基础工具
   ========================================================= */

const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const lerp = (a, b, t) => a + (b - a) * t;
function smoothstep(e0, e1, x) {
  if (e0 === e1) return x < e0 ? 0 : 1;
  const t = clamp01((x - e0) / (e1 - e0));
  return t * t * (3 - 2 * t);
}

function hash2i(x, y) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

/* =========================================================
   1. Perlin 噪声
   ========================================================= */

const PERM = (() => {
  const p = new Uint8Array(512);
  const base = new Uint8Array(256);
  for (let i = 0; i < 256; i++) base[i] = i;
  let s = 20240613 >>> 0;
  const rnd = () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
  for (let i = 255; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    const t = base[i]; base[i] = base[j]; base[j] = t;
  }
  for (let i = 0; i < 512; i++) p[i] = base[i & 255];
  return p;
})();

function grad3(hash, x, y, z) {
  const h = hash & 15;
  const u = h < 8 ? x : y;
  const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
  return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
}

function perlin3(x, y, z) {
  const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z);
  const X = fx & 255, Y = fy & 255, Z = fz & 255;
  x -= fx; y -= fy; z -= fz;

  const u = x * x * x * (x * (x * 6 - 15) + 10);
  const v = y * y * y * (y * (y * 6 - 15) + 10);
  const w = z * z * z * (z * (z * 6 - 15) + 10);

  const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A + 1] + Z;
  const B = PERM[X + 1] + Y, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;

  const x1 = x - 1, y1 = y - 1, z1 = z - 1;

  const g000 = grad3(PERM[AA], x, y, z);
  const g100 = grad3(PERM[BA], x1, y, z);
  const g010 = grad3(PERM[AB], x, y1, z);
  const g110 = grad3(PERM[BB], x1, y1, z);
  const g001 = grad3(PERM[AA + 1], x, y, z1);
  const g101 = grad3(PERM[BA + 1], x1, y, z1);
  const g011 = grad3(PERM[AB + 1], x, y1, z1);
  const g111 = grad3(PERM[BB + 1], x1, y1, z1);

  const lx00 = g000 + u * (g100 - g000);
  const lx10 = g010 + u * (g110 - g010);
  const lx01 = g001 + u * (g101 - g001);
  const lx11 = g011 + u * (g111 - g011);

  const ly0 = lx00 + v * (lx10 - lx00);
  const ly1 = lx01 + v * (lx11 - lx01);

  return ly0 + w * (ly1 - ly0);
}

function fbm3(x, y, z, octaves) {
  let amp = 1.0, freq = 1.0, sum = 0.0, norm = 0.0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * perlin3(x * freq, y * freq, z * freq);
    norm += amp;
    amp *= 0.5;
    freq *= 2.0;
  }
  return sum / norm;
}

/* =========================================================
   2. 渲染器 / 场景 / 相机
   ========================================================= */

const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 4000);
camera.position.set(0, 1.05, 3.35);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.75;
controls.panSpeed = 0.5;
controls.enablePan = false;
controls.minDistance = 1.32;
controls.maxDistance = 9.0;
controls.target.set(0, 0, 0);

/* =========================================================
   3. 程序化纹理生成
   ========================================================= */

const LAT_STOPS = [
  { lat: 0,  g: [ 30,  84,  46], d: [150, 146,  96] },
  { lat: 12, g: [ 42,  96,  48], d: [176, 158, 104] },
  { lat: 22, g: [ 76, 112,  56], d: [206, 182, 120] },
  { lat: 32, g: [ 92, 116,  62], d: [200, 176, 118] },
  { lat: 44, g: [ 68, 104,  58], d: [160, 150, 108] },
  { lat: 56, g: [ 54,  88,  62], d: [136, 136, 118] },
  { lat: 66, g: [ 64,  92,  82], d: [150, 152, 148] },
  { lat: 76, g: [186, 196, 202], d: [196, 204, 210] },
  { lat: 90, g: [236, 242, 248], d: [240, 245, 250] }
];

function samplePalette(latDeg, g, d) {
  const n = LAT_STOPS.length;
  let i = 0;
  while (i < n - 2 && latDeg > LAT_STOPS[i + 1].lat) i++;
  const a = LAT_STOPS[i], b = LAT_STOPS[i + 1];
  const span = (b.lat - a.lat) || 1;
  const t = clamp01((latDeg - a.lat) / span);
  g[0] = a.g[0] + (b.g[0] - a.g[0]) * t;
  g[1] = a.g[1] + (b.g[1] - a.g[1]) * t;
  g[2] = a.g[2] + (b.g[2] - a.g[2]) * t;
  d[0] = a.d[0] + (b.d[0] - a.d[0]) * t;
  d[1] = a.d[1] + (b.d[1] - a.d[1]) * t;
  d[2] = a.d[2] + (b.d[2] - a.d[2]) * t;
}

/* ---------- 3.1 高度场 ---------- */
async function generateHeightField(W, H, onProgress) {
  const N = W * H;
  const height = new Float32Array(N);
  let lastYield = performance.now();

  for (let y = 0; y < H; y++) {
    const lat = Math.PI * 0.5 - (y + 0.5) / H * Math.PI;
    const cl = Math.cos(lat), sl = Math.sin(lat);
    const base = y * W;

    for (let x = 0; x < W; x++) {
      const lon = (x + 0.5) / W * Math.PI * 2 - Math.PI;
      const cp = Math.cos(lon), sp = Math.sin(lon);
      const px = cl * cp, py = sl, pz = cl * sp;

      // 域扭曲，让大陆轮廓更破碎自然
      const wx = perlin3(px * 1.6 + 13.1, py * 1.6 - 7.4, pz * 1.6 + 3.9);
      const wy = perlin3(px * 1.6 - 5.7, py * 1.6 + 11.2, pz * 1.6 - 9.6);
      const wz = perlin3(px * 1.6 + 8.4, py * 1.6 + 2.7, pz * 1.6 + 15.3);

      const A = 0.32;
      height[base + x] = fbm3(
        (px + A * wx) * 2.5,
        (py + A * wy) * 2.5,
        (pz + A * wz) * 2.5,
        5
      );
    }

    if (performance.now() - lastYield > 20) {
      onProgress((y + 1) / H);
      await new Promise(r => setTimeout(r, 0));
      lastYield = performance.now();
    }
  }

  // 直方图统计 → 让陆地占比约 30%
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < N; i++) {
    const v = height[i];
    if (v < mn) mn = v;
    if (v > mx) mx = v;
  }
  const BINS = 2048;
  const hist = new Uint32Array(BINS);
  const inv = (BINS - 1) / ((mx - mn) || 1);
  for (let i = 0; i < N; i++) {
    let b = ((height[i] - mn) * inv) | 0;
    if (b < 0) b = 0; else if (b >= BINS) b = BINS - 1;
    hist[b]++;
  }

  let acc = 0, seaBin = 0;
  const targetLand = N * 0.70;
  for (let b = 0; b < BINS; b++) {
    acc += hist[b];
    if (acc >= targetLand) { seaBin = b; break; }
  }
  const seaLevel = mn + (seaBin + 0.5) / BINS * (mx - mn);

  let acc2 = 0, maxBin = BINS - 1;
  const targetMax = N * 0.997;
  for (let b = 0; b < BINS; b++) {
    acc2 += hist[b];
    if (acc2 >= targetMax) { maxBin = b; break; }
  }
  const maxH = mn + (maxBin + 0.5) / BINS * (mx - mn);

  return { height, seaLevel, maxH };
}

/* ---------- 3.2 昼夜地表着色 ---------- */
async function paintSurface(W, H, height, seaLevel, maxH, onProgress) {
  const N = W * H;
  const day = new Uint8ClampedArray(N * 4);
  const night = new Uint8ClampedArray(N * 4);
  const span = Math.max(1e-4, maxH - seaLevel);

  const palG = [0, 0, 0];
  const palD = [0, 0, 0];
  let lastYield = performance.now();

  for (let y = 0; y < H; y++) {
    const lat = Math.PI * 0.5 - (y + 0.5) / H * Math.PI;
    const cl = Math.cos(lat), sl = Math.sin(lat);
    const latDeg = Math.abs(lat) * 180 / Math.PI;

    samplePalette(latDeg, palG, palD);
    const iceT = smoothstep(64, 77, latDeg);
    const base = y * W;

    for (let x = 0; x < W; x++) {
      const idx = base + x;
      const o = idx * 4;
      const lon = (x + 0.5) / W * Math.PI * 2 - Math.PI;
      const px = cl * Math.cos(lon), py = sl, pz = cl * Math.sin(lon);

      const h = height[idx];
      const det = fbm3(px * 7.0 + 2.1, py * 7.0 - 1.7, pz * 7.0 + 4.3, 2);

      let R, G, B;
      let nr = 2, ng = 4, nb = 9;

      if (h > seaLevel) {
        /* -------- 陆地 -------- */
        const altN = Math.min(1, (h - seaLevel) / span);

        const t = clamp01(det * 2.4 + 0.5);
        R = palG[0] + (palD[0] - palG[0]) * t;
        G = palG[1] + (palD[1] - palG[1]) * t;
        B = palG[2] + (palD[2] - palG[2]) * t;

        // 岩石带
        const rockT = smoothstep(0.34, 0.74, altN);
        R += (112 - R) * rockT;
        G += (104 - G) * rockT;
        B += ( 94 - B) * rockT;

        // 高山积雪
        const snowT = smoothstep(0.70, 0.95, altN);
        R += (241 - R) * snowT;
        G += (245 - G) * snowT;
        B += (250 - B) * snowT;

        // 极地冰盖
        R += (238 - R) * iceT;
        G += (245 - G) * iceT;
        B += (252 - B) * iceT;

        // 夜间城市灯光
        const latOk = 1 - smoothstep(56, 74, latDeg);
        const altOk = 1 - smoothstep(0.35, 0.78, altN);
        const density = clamp01(det * 1.9 + 0.42);
        const prob = 0.45 * density * latOk * altOk;
        if (hash2i(x, y) < prob) {
          const br = 0.35 + 0.65 * hash2i(x + 7919, y + 104729);
          nr = 255 * br;
          ng = 198 * br;
          nb = 104 * br;
        } else {
          const glow = density * 11;
          nr = glow * 0.9;
          ng = glow * 0.65;
          nb = glow * 0.35;
        }
      } else {
        /* -------- 海洋 -------- */
        const d = clamp01((seaLevel - h) / 0.42);
        const t1 = smoothstep(0.0, 0.40, d);
        const t2 = smoothstep(0.40, 1.0, d);

        let wr = 44 + (14 - 44) * t1;
        let wg = 134 + (64 - 134) * t1;
        let wb = 168 + (118 - 168) * t1;

        wr += (3 - wr) * t2;
        wg += (17 - wg) * t2;
        wb += (46 - wb) * t2;

        const vv = 1 + det * 0.30;
        R = wr * vv;
        G = wg * vv;
        B = wb * vv;

        // 极地海冰
        if (iceT > 0.001) {
          R += (216 - R) * iceT * 0.95;
          G += (230 - G) * iceT * 0.95;
          B += (240 - B) * iceT * 0.95;
        }
      }

      day[o]     = R;
      day[o + 1] = G;
      day[o + 2] = B;
      day[o + 3] = 255;

      night[o]     = nr;
      night[o + 1] = ng;
      night[o + 2] = nb;
      night[o + 3] = 255;
    }

    if (performance.now() - lastYield > 20) {
      onProgress((y + 1) / H);
      await new Promise(r => setTimeout(r, 0));
      lastYield = performance.now();
    }
  }

  return { day, night };
}

/* ---------- 3.3 法线贴图 ---------- */
function buildNormalData(W, H, height, seaLevel) {
  const N = W * H;
  const land = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const v = height[i] - seaLevel;
    land[i] = v > 0 ? v : 0;
  }

  const data = new Uint8ClampedArray(N * 4);
  const s = 26624 / W;

  for (let y = 0; y < H; y++) {
    const yU = y > 0 ? y - 1 : 0;
    const yD = y < H - 1 ? y + 1 : H - 1;
    const rowB = y * W;

    for (let x = 0; x < W; x++) {
      const xL = x > 0 ? x - 1 : W - 1;
      const xR = x < W - 1 ? x + 1 : 0;

      const hL = land[rowB + xL];
      const hR = land[rowB + xR];
      const hN = land[yU * W + x];
      const hS = land[yD * W + x];

      let nx = -(hR - hL) * s;
      let ny = (hN - hS) * s;
      let nz = 1.0;

      const inv = 1 / Math.sqrt(nx * nx + ny * ny + nz * nz);
      nx *= inv; ny *= inv; nz *= inv;

      const o = (rowB + x) * 4;
      data[o]     = (nx * 0.5 + 0.5) * 255;
      data[o + 1] = (ny * 0.5 + 0.5) * 255;
      data[o + 2] = (nz * 0.5 + 0.5) * 255;
      data[o + 3] = 255;
    }
  }
  return data;
}

/* ---------- 3.4 海洋高光遮罩 ---------- */
function buildSpecData(W, H, height, seaLevel, sw, sh) {
  const data = new Uint8ClampedArray(sw * sh * 4);
  for (let y = 0; y < sh; y++) {
    const sy = Math.min(H - 1, ((y + 0.5) / sh * H) | 0);
    for (let x = 0; x < sw; x++) {
      const sx = Math.min(W - 1, ((x + 0.5) / sw * W) | 0);
      const v = height[sy * W + sx] <= seaLevel ? 255 : 8;
      const o = (y * sw + x) * 4;
      data[o] = v;
      data[o + 1] = v;
      data[o + 2] = v;
      data[o + 3] = 255;
    }
  }
  return data;
}

/* ---------- 3.5 云层 ---------- */
async function generateClouds(W, H, onProgress) {
  const N = W * H;
  const data = new Uint8ClampedArray(N * 4);
  let lastYield = performance.now();

  for (let y = 0; y < H; y++) {
    const lat = Math.PI * 0.5 - (y + 0.5) / H * Math.PI;
    const cl = Math.cos(lat), sl = Math.sin(lat);
    const latAbs = Math.abs(lat) * 180 / Math.PI;

    const itcz    = Math.exp(-Math.pow((latAbs - 4) / 11, 2));
    const subtrop = Math.exp(-Math.pow((latAbs - 27) / 13, 2));
    const storm   = Math.exp(-Math.pow((latAbs - 57) / 17, 2));
    const polar   = smoothstep(70, 90, latAbs);

    const cov = clamp01(
      0.52 + 0.55 * itcz - 0.42 * subtrop + 0.55 * storm + 0.18 * polar
    );

    const base = y * W;

    for (let x = 0; x < W; x++) {
      const lon = (x + 0.5) / W * Math.PI * 2 - Math.PI;
      const px = cl * Math.cos(lon), py = sl, pz = cl * Math.sin(lon);

      const wx = perlin3(px * 2.1 + 3.3,  py * 2.1 - 8.1,  pz * 2.1 + 5.7);
      const wy = perlin3(px * 2.1 - 6.9,  py * 2.1 + 2.4,  pz * 2.1 - 11.3);
      const wz = perlin3(px * 2.1 + 9.6,  py * 2.1 + 12.8, pz * 2.1 + 1.9);

      const qx = px + wx * 0.45;
      const qy = py + wy * 0.45;
      const qz = pz + wz * 0.45;

      const n = fbm3(qx * 3.4, qy * 3.4, qz * 3.4, 5);
      const a = clamp01(smoothstep(0.02, 0.30, n) * cov);

      const o = (base + x) * 4;
      data[o]     = 255;
      data[o + 1] = 255;
      data[o + 2] = 255;
      data[o + 3] = a * 255;
    }

    if (performance.now() - lastYield > 20) {
      onProgress((y + 1) / H);
      await new Promise(r => setTimeout(r, 0));
      lastYield = performance.now();
    }
  }

  return data;
}

/* ---------- 3.6 Canvas → Texture ---------- */
function makeTexture(data, w, h, srgb) {
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.putImageData(new ImageData(data, w, h), 0, 0);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = MAX_ANISO;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true;
  tex.needsUpdate = true;
  return tex;
}

/* =========================================================
   4. 着色器
   ========================================================= */

const earthVert = /* glsl */`
  varying vec2 vUv;
  varying vec3 vNormalW;
  varying vec3 vPosW;

  void main() {
    vUv = uv;
    vNormalW = normalize(mat3(modelMatrix) * normal);
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vPosW = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const earthFrag = /* glsl */`
  uniform sampler2D dayMap;
  uniform sampler2D nightMap;
  uniform sampler2D normalMap;
  uniform sampler2D specMap;
  uniform vec3 sunDirection;

  varying vec2 vUv;
  varying vec3 vNormalW;
  varying vec3 vPosW;

  void main() {
    vec3 N0 = normalize(vNormalW);
    vec3 V  = normalize(cameraPosition - vPosW);

    // 切线空间基底（等距柱状映射下 u 沿经线切线方向）
    vec3 up = vec3(0.0, 1.0, 0.0);
    vec3 T = cross(up, N0);
    float tl = length(T);
    if (tl < 1e-5) {
      T = vec3(1.0, 0.0, 0.0);
    } else {
      T = T / tl;
    }
    vec3 B = cross(N0, T);

    vec3 nTex = texture2D(normalMap, vUv).xyz * 2.0 - 1.0;
    vec3 N = normalize(T * nTex.x + B * nTex.y + N0 * nTex.z);

    vec3 albedo = texture2D(dayMap, vUv).rgb;
    float ocean = texture2D(specMap, vUv).r;

    float ndl  = dot(N, sunDirection);
    float ndlG = dot(N0, sunDirection);

    float diff = max(ndl, 0.0);

    vec3 lit = albedo * (diff * 1.02 + 0.035);

    // 晨昏线附近大气散射造成的冷色偏移
    vec3 tint = mix(vec3(0.52, 0.64, 0.96), vec3(1.0), smoothstep(0.0, 0.30, diff));
    lit *= tint;

    // 海面镜面高光
    vec3 Hv = normalize(sunDirection + V);
    float sp = pow(max(dot(N, Hv), 0.0), 120.0);
    float specMask = ocean * smoothstep(-0.05, 0.25, ndlG);
    lit += vec3(1.0, 0.97, 0.90) * sp * specMask * 1.7;

    // 夜面城市灯光
    float nightMix = smoothstep(0.10, -0.20, ndlG);
    lit += texture2D(nightMap, vUv).rgb * nightMix;

    // 边缘大气辉光
    float fres = pow(1.0 - max(dot(N0, V), 0.0), 3.5);
    lit += vec3(0.28, 0.52, 0.98) * fres
         * (0.18 + 0.82 * smoothstep(-0.25, 0.35, ndlG)) * 0.9;

    gl_FragColor = vec4(lit, 1.0);
    #include <colorspace_fragment>
  }
`;

const atmoVert = /* glsl */`
  varying vec3 vNormalW;
  varying vec3 vPosW;

  void main() {
    vNormalW = normalize(mat3(modelMatrix) * normal);
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vPosW = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const atmoFrag = /* glsl */`
  uniform vec3 sunDirection;
  varying vec3 vNormalW;
  varying vec3 vPosW;

  void main() {
    vec3 N = normalize(vNormalW);
    vec3 V = normalize(cameraPosition - vPosW);

    float rim = 1.0 - max(dot(N, V), 0.0);
    float glow = pow(rim, 2.6);

    float sunF = smoothstep(-0.45, 0.50, dot(N, sunDirection));
    float lit = 0.15 + 0.85 * sunF;

    vec3 col = vec3(0.30, 0.58, 1.0) * glow * lit;

    gl_FragColor = vec4(col * 1.45, glow * lit);
    #include <colorspace_fragment>
  }
`;

const cloudVert = /* glsl */`
  varying vec2 vUv;
  varying vec3 vNormalW;
  varying vec3 vPosW;

  void main() {
    vUv = uv;
    vNormalW = normalize(mat3(modelMatrix) * normal);
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vPosW = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const cloudFrag = /* glsl */`
  uniform sampler2D cloudMap;
  uniform vec3 sunDirection;

  varying vec2 vUv;
  varying vec3 vNormalW;
  varying vec3 vPosW;

  void main() {
    float a = texture2D(cloudMap, vUv).a;
    if (a < 0.008) discard;

    vec3 N = normalize(vNormalW);
    float ndl = max(dot(N, sunDirection), 0.0);

    // 云层明暗：受光面雪白，背光面偏冷灰蓝
    vec3 bright = vec3(1.0, 0.99, 0.97);
    vec3 shade  = vec3(0.12, 0.16, 0.26);
    vec3 col = mix(shade, bright, pow(ndl, 0.75));

    // 略微的边缘增亮
    vec3 V = normalize(cameraPosition - vPosW);
    float rim = pow(1.0 - max(dot(N, V), 0.0), 2.0);
    col += vec3(0.25, 0.40, 0.65) * rim * ndl * 0.55;

    gl_FragColor = vec4(col, a * 0.92);
    #include <colorspace_fragment>
  }
`;

/* =========================================================
   5. 星空
   ========================================================= */

function createStarfield() {
  const count = 7000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    // 球壳随机分布
    const u = Math.random() * 2 - 1;
    const theta = Math.random() * Math.PI * 2;
    const r = 320 + Math.random() * 380;
    const s = Math.sqrt(Math.max(0, 1 - u * u));

    positions[i * 3]     = Math.cos(theta) * s * r;
    positions[i * 3 + 1] = u * r;
    positions[i * 3 + 2] = Math.sin(theta) * s * r;

    const t = Math.random();
    let cr, cg, cb;
    if (t < 0.68) {
      cr = 1.0; cg = 1.0; cb = 1.0;
    } else if (t < 0.86) {
      cr = 0.72; cg = 0.82; cb = 1.0;
    } else if (t < 0.96) {
      cr = 1.0; cg = 0.92; cb = 0.78;
    } else {
      cr = 1.0; cg = 0.74; cb = 0.62;
    }
    const bright = 0.45 + Math.random() * 0.55;
    colors[i * 3]     = cr * bright;
    colors[i * 3 + 1] = cg * bright;
    colors[i * 3 + 2] = cb * bright;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  // 程序化星点精灵
  const sc = document.createElement('canvas');
  sc.width = sc.height = 64;
  const sctx = sc.getContext('2d');
  const grd = sctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0.0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.22, 'rgba(255,255,255,0.82)');
  grd.addColorStop(0.52, 'rgba(255,255,255,0.22)');
  grd.addColorStop(1.0, 'rgba(255,255,255,0)');
  sctx.fillStyle = grd;
  sctx.fillRect(0, 0, 64, 64);

  const spriteTex = new THREE.CanvasTexture(sc);
  spriteTex.colorSpace = THREE.SRGBColorSpace;

  const mat = new THREE.PointsMaterial({
    size: 1.55,
    map: spriteTex,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    sizeAttenuation: true,
    blending: THREE.AdditiveBlending
  });

  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  return points;
}

/* =========================================================
   6. 主流程
   ========================================================= */

const loadingEl = document.getElementById('loading');
const barFillEl = document.getElementById('bar-fill');
const statusEl  = document.getElementById('status');

function setProgress(p, text) {
  barFillEl.style.width = (clamp01(p) * 100).toFixed(1) + '%';
  if (text) statusEl.textContent = text;
}

const isMobile =
  /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent) ||
  Math.min(window.innerWidth, window.innerHeight) < 620;

const clock = new THREE.Clock();

let earthMesh = null;
let cloudMesh = null;

async function main() {
  const W = isMobile ? 1024 : 2048;
  const H = W >> 1;

  setProgress(0.02, '正在构建地形高度场…');
  const hf = await generateHeightField(W, H, (p) =>
    setProgress(0.02 + p * 0.40, '正在构建地形高度场…'));

  setProgress(0.43, '正在描绘大陆与海洋…');
  const surf = await paintSurface(W, H, hf.height, hf.seaLevel, hf.maxH, (p) =>
    setProgress(0.43 + p * 0.27, '正在描绘大陆与海洋…'));

  setProgress(0.71, '正在生成法线细节…');
  const normalData = buildNormalData(W, H, hf.height, hf.seaLevel);
  await new Promise(r => setTimeout(r, 0));

  setProgress(0.76, '正在生成云层…');
  const cloudH = Math.max(256, H >> 1);
  const cloudW = cloudH * 2;
  const cloudData = await generateClouds(cloudW, cloudH, (p) =>
    setProgress(0.76 + p * 0.14, '正在生成云层…'));

  setProgress(0.91, '正在组装星球…');
  await new Promise(r => setTimeout(r, 0));

  // ---- 纹理 ----
  const dayTex    = makeTexture(surf.day, W, H, true);
  const nightTex  = makeTexture(surf.night, W, H, true);
  const normalTex = makeTexture(normalData, W, H, false);
  const specData  = buildSpecData(W, H, hf.height, hf.seaLevel, 256, 128);
  const specTex   = makeTexture(specData, 256, 128, false);
  const cloudTex  = makeTexture(cloudData, cloudW, cloudH, true);

  // ---- 太阳方向 ----
  const sunDirection = new THREE.Vector3(-0.62, 0.30, 0.72).normalize();

  // ---- 地球 ----
  const earthGroup = new THREE.Group();
  earthGroup.rotation.z = -0.404; // 约 23.2° 地轴倾角
  scene.add(earthGroup);

  const earthMat = new THREE.ShaderMaterial({
    uniforms: {
      dayMap:      { value: dayTex },
      nightMap:    { value: nightTex },
      normalMap:   { value: normalTex },
      specMap:     { value: specTex },
      sunDirection:{ value: sunDirection }
    },
    vertexShader: earthVert,
    fragmentShader: earthFrag
  });

  earthMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 168, 84), earthMat);
  earthGroup.add(earthMesh);

  // ---- 云层 ----
  const cloudMat = new THREE.ShaderMaterial({
    uniforms: {
      cloudMap:     { value: cloudTex },
      sunDirection: { value: sunDirection }
    },
    vertexShader: cloudVert,
    fragmentShader: cloudFrag,
    transparent: true,
    depthWrite: false,
    side: THREE.FrontSide
  });

  cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(1.009, 112, 56), cloudMat);
  cloudMesh.renderOrder = 1;
  earthGroup.add(cloudMesh);

  // ---- 大气辉光 ----
  const atmoMat = new THREE.ShaderMaterial({
    uniforms: { sunDirection: { value: sunDirection } },
    vertexShader: atmoVert,
    fragmentShader: atmoFrag,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.FrontSide
  });

  const atmoMesh = new THREE.Mesh(new THREE.SphereGeometry(1.045, 96, 48), atmoMat);
  atmoMesh.renderOrder = 2;
  earthGroup.add(atmoMesh);

  // ---- 星空 ----
  scene.add(createStarfield());

  // ---- 收尾 ----
  setProgress(1.0, '完成');
  renderer.compile(scene, camera);

  setTimeout(() => {
    loadingEl.style.opacity = '0';
    setTimeout(() => { loadingEl.style.display = 'none'; }, 950);
  }, 220);

  clock.start();
  animate();
}

/* =========================================================
   7. 动画循环
   ========================================================= */

let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;

  if (earthMesh) earthMesh.rotation.y = elapsed * 0.048;
  if (cloudMesh) cloudMesh.rotation.y = elapsed * 0.064;

  controls.update();
  renderer.render(scene, camera);
}

/* =========================================================
   8. 自适应
   ========================================================= */

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
}

window.addEventListener('resize', onResize, { passive: true });
window.addEventListener('orientationchange', () => setTimeout(onResize, 180), { passive: true });

/* 启动 */
main().catch((err) => {
  console.error(err);
  statusEl.textContent = '初始化失败：' + (err && err.message ? err.message : err);
});
</script>
