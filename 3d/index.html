<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧊 3D 作品 · 团子去旅行</title>
  <style>
    :root {
      --bg-outer: #dfe8cc;
      --bg-cream: #fbf4e2;
      --bg-card: #fffaf0;
      --ink: #3a2e24;
      --highlight: #f3d77a;
      --highlight-hover: #f7e08e;
      --secondary-bg: #fffaf0;
      --secondary-hover: #f3e8cc;
      --topbar-grad: linear-gradient(#a6cc7a, #8cbc63);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-outer);
      color: var(--ink);
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    /* 主容器：奶油色背景 #fbf4e2 + 深棕 2px 描边 + 圆角 16px */
    .gallery-shell {
      max-width: 1040px;
      margin: 0 auto;
      background-color: var(--bg-cream);
      border: 2px solid var(--ink);
      border-radius: 16px;
      box-shadow: 0 6px 0 var(--ink);
      overflow: hidden;
    }

    /* 顶栏：绿色渐变 + 粗体 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 22px;
      background: var(--topbar-grad);
      border-bottom: 2px solid var(--ink);
      font-weight: bold;
      flex-wrap: wrap;
    }

    .topbar-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 通用按钮：圆角 14px、2px 深棕描边、底部 0 3px 0 #3a2e24 硬阴影 */
    .btn {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
      background-color: var(--highlight);
      border: 2px solid var(--ink);
      border-radius: 14px;
      box-shadow: 0 3px 0 var(--ink);
      padding: 8px 14px;
      cursor: pointer;
      text-decoration: none;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background-color: var(--highlight-hover);
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 var(--ink);
    }

    .btn-secondary {
      background-color: var(--secondary-bg);
    }

    .btn-secondary:hover {
      background-color: var(--secondary-hover);
    }

    .btn-topbar {
      background-color: var(--bg-cream);
      padding: 8px 14px;
    }

    .btn-topbar:hover {
      background-color: var(--highlight);
    }

    /* 主内容区 */
    .gallery-main {
      padding: 22px 24px 30px;
    }

    .intro-banner {
      margin: 0 0 22px;
      padding: 14px 18px;
      background-color: var(--bg-card);
      border: 2px solid var(--ink);
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      box-shadow: 0 3px 0 rgba(58, 46, 36, 0.12);
      line-height: 1.6;
    }

    /* 分类导航 */
    .cat-nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      margin: -4px 0 24px;
      font-size: 14px;
      font-weight: 800;
    }

    .cat-nav-label {
      color: var(--ink);
      font-weight: 800;
      font-size: 14px;
    }

    .cat-nav .btn {
      padding: 6px 12px;
      font-size: 13.5px;
    }

    /* 分类区块 */
    .category-section {
      margin-top: 36px;
      scroll-margin-top: 16px;
    }

    .category-section:first-of-type {
      margin-top: 12px;
    }

    .category-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin: 0 0 18px;
      padding: 14px 18px;
      background: var(--topbar-grad);
      border: 2px solid var(--ink);
      border-radius: 16px;
      box-shadow: 0 4px 0 var(--ink);
    }

    .category-titles {
      flex: 1;
      min-width: 200px;
    }

    .category-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    .category-desc {
      margin: 2px 0 0;
      font-size: 13.5px;
      font-weight: 600;
      opacity: 0.9;
    }

    /* 卡片网格：桌面 3 列，平板 2 列，390px 手机单列 */
    .scene-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    @media (max-width: 960px) {
      .scene-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
    }

    @media (max-width: 600px) {
      .scene-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* 单张场景卡片 */
    .scene-card {
      background-color: var(--bg-card);
      border: 2px solid var(--ink);
      border-radius: 16px;
      box-shadow: 0 4px 0 var(--ink);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 16:9 缩略图容器，加载失败时显示柔和渐变色块 */
    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #d7ebc2 0%, #f5df9d 52%, #f1c397 100%);
      border-bottom: 2px solid var(--ink);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }

    .thumb-fallback-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px;
      text-align: center;
      color: var(--ink);
      font-weight: 800;
      font-size: 16px;
      opacity: 0.85;
      pointer-events: none;
    }

    .thumb-fallback-label span.thumb-id {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background-color: rgba(255, 250, 240, 0.85);
      border: 1.5px solid var(--ink);
    }

    .scene-thumb {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }

    .scene-card:hover .scene-thumb {
      transform: scale(1.02);
    }

    .scene-thumb.is-error {
      opacity: 0;
      pointer-events: none;
    }

    .card-body {
      padding: 16px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .scene-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.3;
    }

    .scene-title-link {
      color: inherit;
      text-decoration: none;
    }

    .scene-title-link:hover {
      text-decoration: underline;
    }

    .source-link {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      opacity: 0.8;
      text-decoration: none;
      white-space: nowrap;
    }

    .source-link:hover {
      text-decoration: underline;
      opacity: 1;
    }

    .scene-desc {
      margin: 0;
      font-size: 13.5px;
      color: var(--ink);
      opacity: 0.9;
      line-height: 1.5;
      min-height: 2.8em;
    }

    /* 可用版本徽章 */
    .scene-badges {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .model-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--ink);
      background-color: var(--highlight);
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      line-height: 1.2;
    }

    .model-badge.is-web { background-color: #bcd9f5; }
    .model-badge.is-flash { background-color: #bfe6c8; }
    .model-badge.is-deepseek { background-color: #c9c3f2; }
    .model-badge.is-opus { background-color: #f2c6a8; }

    .card-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
      padding-top: 4px;
    }

    .card-actions .btn {
      padding: 7px 12px;
      font-size: 13px;
    }

    /* 提示词折叠区域 */
    .prompt-section {
      display: none;
      margin-top: 8px;
      padding: 10px;
      background-color: var(--bg-cream);
      border: 2px solid var(--ink);
      border-radius: 12px;
      flex-direction: column;
      gap: 8px;
    }

    .prompt-section.is-open {
      display: flex;
    }

    .prompt-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .prompt-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
    }

    .btn-copy {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 10px;
    }

    .prompt-pre {
      margin: 0;
      padding: 10px;
      max-height: 240px;
      overflow-y: auto;
      overflow-x: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 12px;
      line-height: 1.55;
      color: var(--ink);
      background-color: var(--bg-card);
      border: 1.5px solid var(--ink);
      border-radius: 10px;
    }

    .prompt-diff-box {
      font-size: 12px;
      line-height: 1.5;
      padding: 8px 10px;
      background-color: var(--bg-card);
      border: 1.5px dashed var(--ink);
      border-radius: 10px;
      color: var(--ink);
      word-break: break-word;
      white-space: pre-wrap;
    }

    @media (max-width: 720px) {
      body {
        padding: 12px 10px 32px;
      }

      .topbar {
        padding: 12px 14px;
      }

      .topbar-title {
        font-size: 19px;
      }

      .gallery-main {
        padding: 16px 12px 22px;
      }

      .category-head {
        padding: 12px 14px;
      }

      .category-title {
        font-size: 20px;
      }

      .scene-desc {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <div class="gallery-shell">
    <header class="topbar">
      <h1 class="topbar-title">🧊 3D 作品</h1>
      <a class="btn btn-topbar" href="/">← 回到团子去旅行</a>
    </header>

    <main class="gallery-main">
      <p class="intro-banner">
        每个场景一张卡片，同一提示词由不同模型生成的版本点「<b>对比全部版本</b>」并排实时运行、每个版本可单独全屏；四个合集可「<b>▶ 播放合集</b>」连续播放；Gemini 网页版（4 Argon / 3.8 Flash）会陆续补上。
      </p>

      <nav class="cat-nav" id="cat-nav" aria-label="分类导航"></nav>

      <div id="category-sections"></div>
    </main>
  </div>

  <script src="catalog.js"></script>
  <script>
    (function () {
      'use strict';

      const MODELS = window.GALLERY_MODELS || {};
      const ORDER = window.GALLERY_MODEL_ORDER || ['cli', 'web', 'flash', 'deepseek', 'opus'];
      const CATS = window.GALLERY_CATEGORIES || [];

      // 复制功能
      async function copyText(text) {
        if (!text) return false;
        if (
          typeof navigator !== 'undefined' &&
          navigator.clipboard &&
          typeof navigator.clipboard.writeText === 'function'
        ) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (err) {
            // 回退
          }
        }
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', 'readonly');
          textarea.style.position = 'fixed';
          textarea.style.top = '-9999px';
          textarea.style.left = '-9999px';
          textarea.style.width = '1px';
          textarea.style.height = '1px';
          textarea.style.opacity = '0';
          textarea.style.pointerEvents = 'none';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          textarea.setSelectionRange(0, textarea.value.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(textarea);
          return !!ok;
        } catch (err) {
          return false;
        }
      }

      const promptCache = new Map();
      const promptInflight = new Map();

      function loadPromptText(idWithSuffix) {
        if (promptCache.has(idWithSuffix)) {
          return Promise.resolve(promptCache.get(idWithSuffix));
        }
        if (promptInflight.has(idWithSuffix)) {
          return promptInflight.get(idWithSuffix);
        }
        const p = fetch('prompts/' + idWithSuffix + '.txt')
          .then((res) => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
          })
          .then((txt) => {
            promptCache.set(idWithSuffix, txt);
            promptInflight.delete(idWithSuffix);
            return txt;
          })
          .catch(() => {
            promptInflight.delete(idWithSuffix);
            return '';
          });
        promptInflight.set(idWithSuffix, p);
        return p;
      }

      function filterPromptLines(text) {
        return text.split('\n').filter((l) => !l.includes('data-id='));
      }

      async function computePromptDiff(scene, avail) {
        if (avail.length <= 1) {
          return '各版本使用同一提示词';
        }
        const texts = await Promise.all(
          avail.map((m) => {
            const suf = MODELS[m] ? MODELS[m].suffix : ('-' + m);
            return loadPromptText(scene.id + suf);
          })
        );
        const baseLines = filterPromptLines(texts[0]);
        const diffEntries = [];

        for (let i = 1; i < avail.length; i++) {
          const m = avail[i];
          const linesM = filterPromptLines(texts[i]);
          const differs = [];
          const maxLen = Math.max(baseLines.length, linesM.length);
          for (let li = 0; li < maxLen; li++) {
            const l0 = baseLines[li] !== undefined ? baseLines[li].trim() : '';
            const lm = linesM[li] !== undefined ? linesM[li].trim() : '';
            if (l0 !== lm && lm) {
              differs.push(linesM[li].trim());
            }
          }
          if (differs.length > 0) {
            diffEntries.push({
              badge: (MODELS[m] && MODELS[m].badge) || m,
              lines: differs
            });
          }
        }

        if (diffEntries.length === 0) {
          return '各版本使用同一提示词';
        }

        let out = '各版本提示词差异：\n';
        diffEntries.forEach((entry) => {
          out += '• ' + entry.badge + '：' + entry.lines.join('；') + '\n';
        });
        return out.trim();
      }

      function createSceneCard(scene, catId) {
        const avail = ORDER.filter((m) => (scene.models || []).indexOf(m) !== -1 && MODELS[m]);
        const firstModel = avail[0] || 'deepseek';
        const firstSuffix = MODELS[firstModel] ? MODELS[firstModel].suffix : '';
        const compareHref = 'compare/?s=' + encodeURIComponent(scene.id) + '&c=' + encodeURIComponent(catId);

        const card = document.createElement('article');
        card.className = 'scene-card';
        card.dataset.sceneId = scene.id;

        // 缩略图
        const thumbWrap = document.createElement('a');
        thumbWrap.className = 'thumb-wrap';
        thumbWrap.href = compareHref;
        thumbWrap.title = '对比全部版本';
        if (scene.gradient) {
          thumbWrap.style.background = scene.gradient;
        }

        const fallbackLabel = document.createElement('div');
        fallbackLabel.className = 'thumb-fallback-label';
        const fallbackTitle = document.createElement('span');
        fallbackTitle.textContent = '🧊 ' + scene.title;
        const fallbackId = document.createElement('span');
        fallbackId.className = 'thumb-id';
        fallbackId.textContent = scene.id;
        fallbackLabel.appendChild(fallbackTitle);
        fallbackLabel.appendChild(fallbackId);

        const img = document.createElement('img');
        img.className = 'scene-thumb';
        img.src = 'thumbs/' + scene.id + firstSuffix + '.jpg';
        img.alt = scene.title;
        img.loading = 'lazy';
        img.addEventListener('error', () => {
          img.classList.add('is-error');
        });

        thumbWrap.appendChild(fallbackLabel);
        thumbWrap.appendChild(img);

        // 卡片主体
        const body = document.createElement('div');
        body.className = 'card-body';

        const head = document.createElement('div');
        head.className = 'card-head';

        const titleEl = document.createElement('h3');
        titleEl.className = 'scene-title';
        const titleLink = document.createElement('a');
        titleLink.className = 'scene-title-link';
        titleLink.href = compareHref;
        titleLink.textContent = scene.title;
        titleEl.appendChild(titleLink);
        head.appendChild(titleEl);

        if (scene.source) {
          const srcLink = document.createElement('a');
          srcLink.className = 'source-link';
          srcLink.href = scene.source;
          srcLink.target = '_blank';
          srcLink.rel = 'noopener';
          srcLink.textContent = '原帖 ↗';
          head.appendChild(srcLink);
        }

        const descEl = document.createElement('p');
        descEl.className = 'scene-desc';
        descEl.textContent = scene.description;

        // 可用版本徽章
        const badgesEl = document.createElement('div');
        badgesEl.className = 'scene-badges';
        badgesEl.setAttribute('aria-label', '可用版本');
        avail.forEach((m) => {
          const mm = MODELS[m];
          const b = document.createElement('span');
          b.className = 'model-badge' + (mm.badgeClass ? ' ' + mm.badgeClass : '');
          b.textContent = mm.short;
          badgesEl.appendChild(b);
        });

        // 按钮组
        const actionsEl = document.createElement('div');
        actionsEl.className = 'card-actions';

        const compareBtn = document.createElement('a');
        compareBtn.className = 'btn';
        compareBtn.href = compareHref;
        compareBtn.textContent = '⚖️ 对比全部版本';

        const togglePromptBtn = document.createElement('button');
        togglePromptBtn.type = 'button';
        togglePromptBtn.className = 'btn btn-secondary';
        togglePromptBtn.setAttribute('aria-expanded', 'false');
        togglePromptBtn.textContent = '📜 查看提示词';

        actionsEl.appendChild(compareBtn);
        actionsEl.appendChild(togglePromptBtn);

        // 提示词展开区
        const promptSection = document.createElement('div');
        promptSection.className = 'prompt-section';

        const promptToolbar = document.createElement('div');
        promptToolbar.className = 'prompt-toolbar';

        const promptLabel = document.createElement('span');
        promptLabel.className = 'prompt-label';
        promptLabel.textContent = '场景生成提示词';

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'btn btn-copy';
        copyBtn.textContent = '复制';

        promptToolbar.appendChild(promptLabel);
        promptToolbar.appendChild(copyBtn);

        const preEl = document.createElement('pre');
        preEl.className = 'prompt-pre';
        preEl.textContent = '正在加载提示词…';

        const diffBox = document.createElement('div');
        diffBox.className = 'prompt-diff-box';
        diffBox.textContent = '正在对比各版本提示词…';

        promptSection.appendChild(promptToolbar);
        promptSection.appendChild(preEl);
        promptSection.appendChild(diffBox);

        let promptLoaded = false;
        async function ensurePromptLoaded() {
          if (promptLoaded) return;
          promptLoaded = true;
          const firstText = await loadPromptText(scene.id + firstSuffix);
          preEl.textContent = firstText || '未能加载提示词文本。';
          const diffResult = await computePromptDiff(scene, avail);
          diffBox.textContent = diffResult;
        }

        let isExpanded = false;
        togglePromptBtn.addEventListener('click', () => {
          isExpanded = !isExpanded;
          promptSection.classList.toggle('is-open', isExpanded);
          togglePromptBtn.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
          if (isExpanded) {
            ensurePromptLoaded();
          }
        });

        let copyTimer = null;
        copyBtn.addEventListener('click', async () => {
          await ensurePromptLoaded();
          const firstText = promptCache.get(scene.id + firstSuffix) || '';
          const ok = await copyText(firstText);
          if (copyTimer) clearTimeout(copyTimer);
          copyBtn.textContent = ok ? '已复制' : '复制失败';
          copyTimer = setTimeout(() => {
            copyBtn.textContent = '复制';
            copyTimer = null;
          }, 1500);
        });

        body.appendChild(head);
        body.appendChild(descEl);
        body.appendChild(badgesEl);
        body.appendChild(actionsEl);
        body.appendChild(promptSection);

        card.appendChild(thumbWrap);
        card.appendChild(body);

        return card;
      }

      function renderApp() {
        const host = document.getElementById('category-sections');
        const nav = document.getElementById('cat-nav');
        if (!host || !CATS.length) return;

        if (nav) {
          nav.innerHTML = '';
          const label = document.createElement('span');
          label.className = 'cat-nav-label';
          label.textContent = '合集分类：';
          nav.appendChild(label);
          CATS.forEach((cat) => {
            const a = document.createElement('a');
            a.className = 'btn btn-secondary';
            a.href = '#cat-' + cat.id;
            a.textContent = cat.emoji + ' ' + cat.title;
            nav.appendChild(a);
          });
        }

        const frag = document.createDocumentFragment();
        CATS.forEach((cat) => {
          const section = document.createElement('section');
          section.className = 'category-section';
          section.id = 'cat-' + cat.id;

          const head = document.createElement('div');
          head.className = 'category-head';

          const titles = document.createElement('div');
          titles.className = 'category-titles';
          const h = document.createElement('h2');
          h.className = 'category-title';
          h.textContent = cat.emoji + ' ' + cat.title;
          const d = document.createElement('p');
          d.className = 'category-desc';
          const activeScenes = (cat.scenes || []).filter((s) => s.models && s.models.length > 0);
          d.textContent = cat.description + '（' + activeScenes.length + ' 个场景）';
          titles.appendChild(h);
          titles.appendChild(d);

          const play = document.createElement('a');
          play.className = 'btn';
          play.href = 'collection/?c=' + encodeURIComponent(cat.id);
          play.textContent = '▶ 播放合集';

          head.appendChild(titles);
          head.appendChild(play);
          section.appendChild(head);

          const grid = document.createElement('div');
          grid.className = 'scene-grid';
          activeScenes.forEach((scene) => {
            grid.appendChild(createSceneCard(scene, cat.id));
          });

          section.appendChild(grid);
          frag.appendChild(section);
        });

        host.appendChild(frag);

        if (location.hash && location.hash.indexOf('#cat-') === 0) {
          const target = document.getElementById(location.hash.slice(1));
          if (target) {
            setTimeout(() => target.scrollIntoView(), 50);
          }
        }
      }

      renderApp();
    })();
  </script>
</body>
</html>
