<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧊 3D 作品 · 团子去旅行</title>
  <style>
    :root {
      --bg-outer: #dfe8cc;
      --bg-cream: #fbf4e2;
      --bg-card: #fffaf0;
      --ink: #3a2e24;
      --highlight: #f3d77a;
      --highlight-hover: #f7e08e;
      --secondary-bg: #fffaf0;
      --secondary-hover: #f3e8cc;
      --topbar-grad: linear-gradient(#a6cc7a, #8cbc63);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-outer);
      color: var(--ink);
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    /* 主容器：奶油色背景 #fbf4e2 + 深棕 2px 描边 + 圆角 16px */
    .gallery-shell {
      max-width: 1040px;
      margin: 0 auto;
      background-color: var(--bg-cream);
      border: 2px solid var(--ink);
      border-radius: 16px;
      box-shadow: 0 6px 0 var(--ink);
      overflow: hidden;
    }

    /* 顶栏：绿色渐变 + 粗体 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 22px;
      background: var(--topbar-grad);
      border-bottom: 2px solid var(--ink);
      font-weight: bold;
      flex-wrap: wrap;
    }

    .topbar-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 通用按钮：圆角 14px、2px 深棕描边、底部 0 3px 0 #3a2e24 硬阴影 */
    .btn {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
      background-color: var(--highlight);
      border: 2px solid var(--ink);
      border-radius: 14px;
      box-shadow: 0 3px 0 var(--ink);
      padding: 9px 16px;
      cursor: pointer;
      text-decoration: none;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.15s ease;
    }

    .btn:hover {
      background-color: var(--highlight-hover);
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 var(--ink);
    }

    .btn-secondary {
      background-color: var(--secondary-bg);
    }

    .btn-secondary:hover {
      background-color: var(--secondary-hover);
    }

    .btn-topbar {
      background-color: var(--bg-cream);
      padding: 8px 14px;
    }

    .btn-topbar:hover {
      background-color: var(--highlight);
    }

    /* 主内容区 */
    .gallery-main {
      padding: 22px 24px 30px;
    }

    .intro-banner {
      margin: 0 0 22px;
      padding: 14px 18px;
      background-color: var(--bg-card);
      border: 2px solid var(--ink);
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      box-shadow: 0 3px 0 rgba(58, 46, 36, 0.12);
    }

    /* 卡片网格：宽屏 2 列，手机 1 列 */
    .scene-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      align-items: start;
    }

    .scene-card {
      background-color: var(--bg-card);
      border: 2px solid var(--ink);
      border-radius: 16px;
      box-shadow: 0 4px 0 var(--ink);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 16:9 缩略图容器，加载失败时显示柔和渐变色块 */
    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #d7ebc2 0%, #f5df9d 52%, #f1c397 100%);
      border-bottom: 2px solid var(--ink);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-fallback-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 16px;
      text-align: center;
      color: var(--ink);
      font-weight: 800;
      font-size: 18px;
      opacity: 0.85;
      pointer-events: none;
    }

    .thumb-fallback-label span.thumb-id {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      background-color: rgba(255, 250, 240, 0.78);
      border: 1.5px solid var(--ink);
    }

    .scene-thumb {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }

    .scene-card:hover .scene-thumb {
      transform: scale(1.02);
    }

    .scene-thumb.is-error {
      opacity: 0;
      pointer-events: none;
    }

    .card-body {
      padding: 18px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .scene-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.3;
    }

    .scene-desc {
      margin: 0;
      font-size: 14px;
      color: var(--ink);
      opacity: 0.92;
      min-height: 2.8em;
    }

    .card-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 2px;
    }

    /* 可展开/收起的提示词区域 */
    .prompt-section {
      display: none;
      margin-top: 6px;
      padding: 12px;
      background-color: var(--bg-cream);
      border: 2px solid var(--ink);
      border-radius: 14px;
      flex-direction: column;
      gap: 10px;
    }

    .prompt-section.is-open {
      display: flex;
    }

    .prompt-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .prompt-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
    }

    .btn-copy {
      padding: 5px 12px;
      font-size: 13px;
    }

    .prompt-pre {
      margin: 0;
      padding: 12px;
      max-height: 320px;
      overflow-y: auto;
      overflow-x: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--ink);
      background-color: var(--bg-card);
      border: 2px solid var(--ink);
      border-radius: 12px;
    }

    @media (max-width: 720px) {
      body {
        padding: 12px 10px 32px;
      }

      .topbar {
        padding: 12px 14px;
      }

      .topbar-title {
        font-size: 19px;
      }

      .gallery-main {
        padding: 16px 14px 22px;
      }

      .scene-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .scene-desc {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <div class="gallery-shell">
    <header class="topbar">
      <h1 class="topbar-title">🧊 3D 作品</h1>
      <a class="btn btn-topbar" href="/">← 回到团子去旅行</a>
    </header>

    <main class="gallery-main">
      <p class="intro-banner">
        这些 3D 场景都由 Gemini 通过 Antigravity CLI 根据提示词生成，纯代码程序化建模，可以拖动旋转、缩放。
      </p>

      <div id="scene-grid" class="scene-grid"></div>
    </main>
  </div>

  <script>
    // 场景列表（写成 JS 数组，方便以后扩展）
    const SCENES = [
      {
        id: 'pelican',
        title: '鹈鹕骑自行车',
        description: '社区经典基准题：鹈鹕踩着脚踏沿环形小路骑行，腿、曲柄、车轮联动。',
        gradient: 'linear-gradient(135deg, #d8efc2 0%, #f7e3a1 55%, #f5c396 100%)'
      },
      {
        id: 'midautumn',
        title: '中秋月夜水榭',
        description: '满月、金桂花雨、水榭倒影与灯笼暖光，一个静谧的中秋角落。',
        gradient: 'linear-gradient(135deg, #c7d4ec 0%, #e4d5ec 50%, #f6dca6 100%)'
      },
      {
        id: 'jet-engine',
        title: '交互式喷气发动机',
        description: '风扇与轴旋转，点「分解」看各级部件沿轴线展开，悬停查看作用。',
        gradient: 'linear-gradient(135deg, #cde4ec 0%, #dfeaf2 50%, #f5d9a8 100%)'
      },
      {
        id: 'temple',
        title: '天坛祈年殿',
        description: '三重蓝色琉璃圆顶与汉白玉台基，可一键爆炸 / 重组。',
        gradient: 'linear-gradient(135deg, #bfd8ee 0%, #e5ecf4 52%, #f4d599 100%)'
      },
      {
        id: 'sunset-voxel',
        title: '永恒日落 · 体素世界',
        description: '程序生成的方块海岸，一颗低悬海面的橙色落日。',
        gradient: 'linear-gradient(135deg, #f7c59f 0%, #f7dca8 50%, #bfe1d9 100%)'
      }
    ];

    // 复制功能（与 prompt-panel.js 共用同一逻辑）
    async function copyText(text) {
      if (!text) return false;
      if (
        typeof navigator !== 'undefined' &&
        navigator.clipboard &&
        typeof navigator.clipboard.writeText === 'function'
      ) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (err) {
          // 回退为隐藏 textarea + document.execCommand('copy')
        }
      }
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', 'readonly');
        textarea.style.position = 'fixed';
        textarea.style.top = '-9999px';
        textarea.style.left = '-9999px';
        textarea.style.width = '1px';
        textarea.style.height = '1px';
        textarea.style.opacity = '0';
        textarea.style.pointerEvents = 'none';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(textarea);
        return !!ok;
      } catch (err) {
        return false;
      }
    }

    const promptCache = new Map();
    const promptInflight = new Map();

    function loadPrompt(id) {
      if (promptCache.has(id)) {
        return Promise.resolve(promptCache.get(id));
      }
      if (promptInflight.has(id)) {
        return promptInflight.get(id);
      }
      const p = fetch('prompts/' + id + '.txt')
        .then((res) => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then((txt) => {
          promptCache.set(id, txt);
          promptInflight.delete(id);
          return txt;
        })
        .catch(() => {
          promptInflight.delete(id);
          return '';
        });
      promptInflight.set(id, p);
      return p;
    }

    function createSceneCard(scene) {
      const card = document.createElement('article');
      card.className = 'scene-card';
      card.dataset.sceneId = scene.id;

      // 缩略图区域
      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumb-wrap';
      if (scene.gradient) {
        thumbWrap.style.background = scene.gradient;
      }

      const fallbackLabel = document.createElement('div');
      fallbackLabel.className = 'thumb-fallback-label';
      const fallbackTitle = document.createElement('span');
      fallbackTitle.textContent = '🧊 ' + scene.title;
      const fallbackId = document.createElement('span');
      fallbackId.className = 'thumb-id';
      fallbackId.textContent = scene.id;
      fallbackLabel.appendChild(fallbackTitle);
      fallbackLabel.appendChild(fallbackId);

      const img = document.createElement('img');
      img.className = 'scene-thumb';
      img.src = 'thumbs/' + scene.id + '.jpg';
      img.alt = scene.title;
      img.loading = 'lazy';
      img.addEventListener('error', () => {
        img.classList.add('is-error');
      });

      thumbWrap.appendChild(fallbackLabel);
      thumbWrap.appendChild(img);

      // 卡片内容区域
      const body = document.createElement('div');
      body.className = 'card-body';

      const titleEl = document.createElement('h2');
      titleEl.className = 'scene-title';
      titleEl.textContent = scene.title;

      const descEl = document.createElement('p');
      descEl.className = 'scene-desc';
      descEl.textContent = scene.description;

      const actionsEl = document.createElement('div');
      actionsEl.className = 'card-actions';

      const enterLink = document.createElement('a');
      enterLink.className = 'btn';
      enterLink.href = scene.id + '/';
      enterLink.textContent = '进入场景 →';

      const togglePromptBtn = document.createElement('button');
      togglePromptBtn.type = 'button';
      togglePromptBtn.className = 'btn btn-secondary';
      togglePromptBtn.setAttribute('aria-expanded', 'false');
      togglePromptBtn.textContent = '📜 查看提示词';

      actionsEl.appendChild(enterLink);
      actionsEl.appendChild(togglePromptBtn);

      // 提示词展开区域
      const promptSection = document.createElement('div');
      promptSection.className = 'prompt-section';

      const promptToolbar = document.createElement('div');
      promptToolbar.className = 'prompt-toolbar';

      const promptLabel = document.createElement('span');
      promptLabel.className = 'prompt-label';
      promptLabel.textContent = '场景生成提示词';

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'btn btn-copy';
      copyBtn.textContent = '复制';

      promptToolbar.appendChild(promptLabel);
      promptToolbar.appendChild(copyBtn);

      const preEl = document.createElement('pre');
      preEl.className = 'prompt-pre';
      preEl.textContent = '正在加载提示词…';

      promptSection.appendChild(promptToolbar);
      promptSection.appendChild(preEl);

      async function ensurePromptRendered() {
        const text = await loadPrompt(scene.id);
        preEl.textContent = text || '未能加载提示词文本。';
        return text;
      }

      let isExpanded = false;
      togglePromptBtn.addEventListener('click', () => {
        isExpanded = !isExpanded;
        promptSection.classList.toggle('is-open', isExpanded);
        togglePromptBtn.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
        if (isExpanded) {
          ensurePromptRendered();
        }
      });

      let copyTimer = null;
      copyBtn.addEventListener('click', async () => {
        const text = promptCache.has(scene.id)
          ? promptCache.get(scene.id)
          : await ensurePromptRendered();
        const ok = await copyText(text);
        if (copyTimer) clearTimeout(copyTimer);
        copyBtn.textContent = ok ? '已复制' : '复制失败';
        copyTimer = setTimeout(() => {
          copyBtn.textContent = '复制';
          copyTimer = null;
        }, 1500);
      });

      body.appendChild(titleEl);
      body.appendChild(descEl);
      body.appendChild(actionsEl);
      body.appendChild(promptSection);

      card.appendChild(thumbWrap);
      card.appendChild(body);

      return card;
    }

    function renderGallery() {
      const grid = document.getElementById('scene-grid');
      if (!grid) return;
      const frag = document.createDocumentFragment();
      SCENES.forEach((scene) => {
        frag.appendChild(createSceneCard(scene));
      });
      grid.appendChild(frag);
    }

    renderGallery();
  </script>
</body>
</html>
