<div class="title">落日河谷 · 蒸汽火车<small>Voxel Steam Train at Sunset</small></div>
<div class="ui">
  <span class="hint">拖动旋转 · 滚轮 / 双指缩放 · 右键平移</span>
  <button class="btn" id="followBtn" type="button">跟随火车</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 基础工具 ================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(1829);
const rr = (a, b) => a + (b - a) * rand();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// 2D 值噪声 + 分形
const perm = new Uint8Array(512);
{
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
}
const h2 = (i, j) => perm[(i & 255) + perm[j & 255]] / 255;
function vnoise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(h2(xi, yi), h2(xi + 1, yi), u), lerp(h2(xi, yi + 1), h2(xi + 1, yi + 1), u), v) * 2 - 1;
}
function fbm2(x, y) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let o = 0; o < 4; o++) { s += a * vnoise2(x * f + o * 13.1, y * f - o * 7.7); n += a; a *= 0.5; f *= 2.07; }
  return s / n;
}
// 整数坐标哈希，用于体素颜色抖动
function hash3(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 1274126177) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

/* ================= 渲染器 / 场景 / 相机 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COL = new THREE.Color(0xe08a6e);
scene.fog = new THREE.Fog(FOG_COL, 160, 480);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 3000);
camera.position.set(40, 24, 74);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 12, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.screenSpacePanning = true;
controls.minDistance = 12;
controls.maxDistance = 230;
controls.maxPolarAngle = 1.5;
controls.rotateSpeed = 0.6;
if (camera.aspect < 0.8) camera.position.sub(controls.target).multiplyScalar(1.8).add(controls.target);
controls.update();

/* ================= 天空 / 光照 ================= */
const SUN_DIR = new THREE.Vector3(-0.3, 0.2, -0.93).normalize();
const SKY = {
  top: new THREE.Color(0x1d1640), mid: new THREE.Color(0x6e3a78), low: new THREE.Color(0xff7a52),
  horizon: new THREE.Color(0xffb46a), bottom: new THREE.Color(0x2a1a3a), sun: new THREE.Color(0xfff0c2)
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1000, 48, 24),
  new THREE.ShaderMaterial({
    uniforms: {
      uTop: { value: SKY.top }, uMid: { value: SKY.mid }, uLow: { value: SKY.low },
      uHorizon: { value: SKY.horizon }, uBottom: { value: SKY.bottom }, uSunCol: { value: SKY.sun },
      uSun: { value: SUN_DIR }
    },
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uTop, uMid, uLow, uHorizon, uBottom, uSunCol, uSun;
      varying vec3 vDir;
      float hash(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
      void main(){
        vec3 d = normalize(vDir);
        float h = d.y;
        vec3 col = mix(uHorizon, uLow, smoothstep(0.0, 0.08, h));
        col = mix(col, uMid, smoothstep(0.06, 0.34, h));
        col = mix(col, uTop, smoothstep(0.3, 0.9, h));
        col = mix(col, uBottom, 1.0 - smoothstep(-0.25, 0.0, h));
        float sd = max(dot(d, uSun), 0.0);
        // 太阳光晕与沿地平线的暖色散射
        col += uSunCol * (pow(sd, 6.0) * 0.35 + pow(sd, 48.0) * 0.7);
        col += vec3(1.0, 0.45, 0.2) * pow(sd, 2.0) * 0.25 * (1.0 - smoothstep(0.0, 0.3, abs(h)));
        col = mix(col, uSunCol * 3.0, smoothstep(0.99905, 0.99935, sd));
        // 东侧天空的早出星星
        vec3 g = floor(d * 320.0);
        float st = step(0.9982, hash(g)) * smoothstep(0.35, 0.8, h) * (1.0 - smoothstep(0.2, 0.8, sd));
        col += vec3(st) * 0.9;
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    side: THREE.BackSide, depthWrite: false, fog: false
  })
);
sky.renderOrder = -1;
sky.frustumCulled = false;
scene.add(sky);

const sun = new THREE.DirectionalLight(0xffb27a, 3.2);
sun.position.copy(SUN_DIR).multiplyScalar(170);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
{
  const sc = sun.shadow.camera;
  sc.left = -85; sc.right = 85; sc.top = 55; sc.bottom = -55; sc.near = 20; sc.far = 400;
}
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.06;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xffa98a, 0x3b2a55, 1.15));
const fill = new THREE.DirectionalLight(0x9a8cff, 0.55);
fill.position.set(60, 40, 90);
scene.add(fill);

/* ================= 体素世界：网格与类型 ================= */
const GX0 = -64, GX1 = 64, GZ0 = -40, GZ1 = 40, GH = 56;
const NX = GX1 - GX0, NZ = GZ1 - GZ0;
const TRACK_Y = 15;          // 路基顶面高度
const WATER_Y = 4;           // 水位（水面 = WATER_Y - 0.25）
const TUN_X = 44;            // 隧道洞口所在 |x|
const RAIL_Y = TRACK_Y + 0.61;
const T = {
  GRASS: 1, GRASS2: 2, DIRT: 3, STONE: 4, SAND: 5, GRAVEL: 6, VIADUCT: 7, DECK: 8, PORTAL: 9,
  TRUNK: 10, PINE: 11, PINE2: 12, AUTUMN: 13, AUTUMN2: 14, WALL: 15, ROOF: 16, WOOD: 17, YLEAF: 18, ROCK: 19,
  GLOW: 20, LAMP: 21
};
const PAL = [];
PAL[T.GRASS] = 0x6aa83f; PAL[T.GRASS2] = 0x5a9636; PAL[T.DIRT] = 0x8b5e3c; PAL[T.STONE] = 0x8f8780;
PAL[T.SAND] = 0xdcbc82; PAL[T.GRAVEL] = 0x7f766f; PAL[T.VIADUCT] = 0xb39a82; PAL[T.DECK] = 0x8a7a6c;
PAL[T.PORTAL] = 0xa08d78; PAL[T.TRUNK] = 0x5b3a22; PAL[T.PINE] = 0x2f5e36; PAL[T.PINE2] = 0x3d7040;
PAL[T.AUTUMN] = 0xe08a2c; PAL[T.AUTUMN2] = 0xc9502a; PAL[T.WALL] = 0xf0e2c6; PAL[T.ROOF] = 0xa63a2b;
PAL[T.WOOD] = 0x6b4426; PAL[T.YLEAF] = 0xe8c03a; PAL[T.ROCK] = 0x77707a; PAL[T.GLOW] = 0xffc86a; PAL[T.LAMP] = 0xfff0b0;

const grid = new Uint8Array(NX * NZ * GH);
const gi = (x, y, z) => ((x - GX0) * NZ + (z - GZ0)) * GH + y;
const inGrid = (x, y, z) => x >= GX0 && x < GX1 && z >= GZ0 && z < GZ1 && y >= 0 && y < GH;
function getV(x, y, z) {
  if (y < 0) return 255; // 底部视为实心，不生成底面
  if (!inGrid(x, y, z)) return 0;
  return grid[gi(x, y, z)];
}
function setV(x, y, z, t) { if (inGrid(x, y, z)) grid[gi(x, y, z)] = t; }
function setIfEmpty(x, y, z, t) { if (inGrid(x, y, z) && !grid[gi(x, y, z)]) grid[gi(x, y, z)] = t; }

/* ================= 地形高度 ================= */
const riverX = z => 5 * Math.sin(z * 0.055 + 0.4) + 2.5 * Math.sin(z * 0.14 + 1.3);
const inBand = z => z >= -3 && z <= 2; // 铁路占用的格子（世界 z ∈ [-3, 3)）
function naturalH(x, z) {
  const n = fbm2(x * 0.045 + 10, z * 0.045 - 5);
  const d = Math.abs(x - riverX(z));
  let h = 1.2 + 18 * smoothstep(3.5, 32, d + n * 4) + n * 3 * smoothstep(4, 14, d);
  h += smoothstep(-12, -40, z) * (6 + 6 * fbm2(x * 0.08, z * 0.08 + 3)); // 后方远山
  h -= smoothstep(22, 40, z) * 3;                                          // 前景略低，便于观察
  const ax = Math.abs(x);
  h += smoothstep(TUN_X - 16, TUN_X + 6, ax) * 14 * (1 - 0.6 * smoothstep(8, 36, Math.abs(z)));
  // 保证隧道所在山体足够高
  const need = TRACK_Y + 9 - Math.max(0, Math.abs(z) - 7) * 0.9;
  h = Math.max(h, lerp(h, need, smoothstep(TUN_X - 10, TUN_X - 1, ax)));
  return clamp(Math.floor(h), 1, GH - 12);
}
const Hn = new Int16Array(NX * NZ), Hf = new Int16Array(NX * NZ);
const hI = (x, z) => (x - GX0) * NZ + (z - GZ0);
const getH = (x, z) => Hf[hI(clamp(x, GX0, GX1 - 1), clamp(z, GZ0, GZ1 - 1))];
for (let x = GX0; x < GX1; x++) for (let z = GZ0; z < GZ1; z++) Hn[hI(x, z)] = naturalH(x + 0.5, z + 0.5);

// 找出需要架桥的区段（路基下方地面明显低于轨面）
let bx0 = null, bx1 = null;
for (let x = -TUN_X + 2; x < TUN_X - 2; x++) {
  let mn = 1e9;
  for (let z = -3; z <= 2; z++) mn = Math.min(mn, Hn[hI(x, z)]);
  if (mn < TRACK_Y - 2) { if (bx0 === null) bx0 = x; bx1 = x; }
}
if (bx0 === null) { bx0 = -4; bx1 = 4; }
Hf.set(Hn);
for (let x = GX0; x < GX1; x++) {
  if (Math.abs(x + 0.5) >= TUN_X - 1) continue;
  for (let z = -3; z <= 2; z++) {
    const i = hI(x, z);
    if (x >= bx0 - 1 && x <= bx1 + 1) Hf[i] = Math.min(Hn[i], TRACK_Y - 1);
    else Hf[i] = TRACK_Y; // 路堑 / 路堤
  }
}
// 河边小屋地基压平
const HOUSE = { x: Math.round(riverX(18) + 10), z: 16 };
HOUSE.h = Math.max(Hn[hI(HOUSE.x, HOUSE.z)], WATER_Y + 1);
for (let x = HOUSE.x - 4; x <= HOUSE.x + 4; x++) for (let z = HOUSE.z - 3; z <= HOUSE.z + 3; z++) Hf[hI(x, z)] = HOUSE.h;

/* ================= 填充地形柱 ================= */
for (let x = GX0; x < GX1; x++) for (let z = GZ0; z < GZ1; z++) {
  const h = Hf[hI(x, z)];
  let slope = 0;
  for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) slope = Math.max(slope, Math.abs(h - getH(x + dx, z + dz)));
  const railCut = inBand(z) && Math.abs(x + 0.5) < TUN_X - 1 && !(x >= bx0 - 1 && x <= bx1 + 1);
  const gn = vnoise2(x * 0.15, z * 0.15);
  let top;
  if (railCut) top = T.GRAVEL;
  else if (h - 1 < WATER_Y - 1) top = T.GRAVEL;
  else if (h - 1 <= WATER_Y) top = T.SAND;
  else if (slope >= 3 || h > 28) top = hash3(x, h, z) > 0.5 ? T.STONE : T.ROCK;
  else top = (gn > 0.15 || h > 20) ? T.GRASS2 : T.GRASS;
  for (let y = 0; y < h; y++) {
    const depth = h - 1 - y;
    let t;
    if (depth === 0) t = top;
    else if (depth <= 2 && (top === T.GRASS || top === T.GRASS2 || top === T.GRAVEL)) t = T.DIRT;
    else if (top === T.SAND && depth <= 2) t = T.SAND;
    else t = (Math.floor((y + gn * 2) / 3) % 2) ? T.STONE : T.ROCK; // 岩层条纹
    grid[gi(x, y, z)] = t;
  }
}

/* ================= 隧道与洞口 ================= */
for (let x = GX0; x < GX1; x++) {
  const ax = Math.abs(x + 0.5);
  if (ax > TUN_X && ax < 62) {
    for (let z = -3; z <= 2; z++) {
      setV(x, TRACK_Y - 1, z, T.GRAVEL);
      for (let y = TRACK_Y; y < TRACK_Y + 6; y++) {
        if (y === TRACK_Y + 5 && (z === -3 || z === 2)) continue; // 圆角拱顶
        setV(x, y, z, 0);
      }
    }
  }
  if (ax > TUN_X - 2 && ax < TUN_X) {
    const protrude = ax < TUN_X - 1;
    for (let z = -5; z <= 4; z++) for (let y = TRACK_Y; y < TRACK_Y + 8; y++) {
      const opening = z >= -3 && z <= 2 && y < TRACK_Y + 6 && !(y === TRACK_Y + 5 && (z === -3 || z === 2));
      if (opening) setV(x, y, z, 0);
      else setV(x, y, z, T.PORTAL);
    }
    if (protrude) { setV(x, TRACK_Y + 3, -4, T.LAMP); setV(x, TRACK_Y + 3, 3, T.LAMP); }
    for (let z = -5; z <= 4; z++) if (!protrude) setV(x, TRACK_Y + 8, z, T.PORTAL);
  }
}

/* ================= 石拱高架桥 ================= */
{
  const L = bx1 - bx0 + 1;
  const k = Math.max(1, Math.round(L / 8));
  const p = L / k;
  const a = p / 2 - 1;
  for (let x = bx0; x <= bx1; x++) {
    const t = (x + 0.5) - bx0;
    const i = Math.min(k - 1, Math.floor(t / p));
    const local = t - i * p;
    const e = Math.min(local, p - local);
    if (e < 1.0) {
      // 桥墩：从地面一直砌到桥面，略宽于拱圈
      for (let z = -4; z <= 3; z++) for (let y = 0; y < TRACK_Y - 1; y++) setIfEmpty(x, y, z, T.VIADUCT);
    } else {
      const u = local - p / 2;
      const under = TRACK_Y - 2 - a + Math.sqrt(Math.max(0, a * a - u * u));
      for (let z = -3; z <= 2; z++) for (let y = Math.floor(under); y < TRACK_Y - 1; y++) setIfEmpty(x, y, z, T.VIADUCT);
    }
  }
  for (let x = bx0 - 1; x <= bx1 + 1; x++) for (let z = -4; z <= 3; z++) setV(x, TRACK_Y - 1, z, T.DECK);
  for (let x = bx0 - 2; x <= bx1 + 2; x++) { setIfEmpty(x, TRACK_Y, -4, T.DECK); setIfEmpty(x, TRACK_Y, 3, T.DECK); }
  // 桥墩上方的护栏灯柱
  for (let i = 0; i <= k; i++) {
    const x = Math.min(bx1 + 1, Math.floor(bx0 + i * p));
    for (const z of [-4, 3]) { setV(x, TRACK_Y + 1, z, T.WOOD); setV(x, TRACK_Y + 2, z, T.LAMP); }
  }
}

/* ================= 河边小屋 ================= */
{
  const { x: cx, z: cz, h } = HOUSE;
  for (let x = cx - 3; x <= cx + 2; x++) for (let z = cz - 2; z <= cz + 1; z++) for (let y = h; y < h + 3; y++) {
    const edgeX = x === cx - 3 || x === cx + 2, edgeZ = z === cz - 2 || z === cz + 1;
    if (!edgeX && !edgeZ) continue;
    setV(x, y, z, edgeX && edgeZ ? T.WOOD : T.WALL);
  }
  for (let z = cz - 2; z <= cz + 1; z++) { setV(cx - 3, h + 3, z, T.WALL); setV(cx + 2, h + 3, z, T.WALL); }
  // 窗户 + 门
  setV(cx - 2, h + 1, cz + 1, T.GLOW); setV(cx + 1, h + 1, cz + 1, T.GLOW);
  setV(cx + 2, h + 1, cz - 1, T.GLOW); setV(cx - 3, h + 1, cz, T.GLOW);
  setV(cx - 1, h, cz + 1, T.WOOD); setV(cx - 1, h + 1, cz + 1, T.WOOD);
  // 阶梯式坡屋顶
  for (let x = cx - 4; x <= cx + 3; x++) {
    for (let z = cz - 3; z <= cz + 2; z++) if (z === cz - 3 || z === cz + 2) setV(x, h + 3, z, T.ROOF);
    for (let z = cz - 2; z <= cz + 1; z++) if (z === cz - 2 || z === cz + 1) setV(x, h + 4, z, T.ROOF);
    for (let z = cz - 1; z <= cz; z++) setV(x, h + 5, z, T.ROOF);
  }
  for (let y = h + 3; y < h + 7; y++) setV(cx + 1, y, cz - 1, T.STONE);
  // 木栈桥伸向河面
  const rx = Math.round(riverX(cz + 3));
  for (let x = rx + 2; x < cx - 3; x++) { setV(x, WATER_Y, cz + 3, T.WOOD); }
  setV(rx + 2, WATER_Y - 1, cz + 3, T.WOOD);
}

/* ================= 树木与岩石 ================= */
{
  const trees = [];
  for (let tries = 0; tries < 6000 && trees.length < 190; tries++) {
    const x = ri(GX0 + 2, GX1 - 3), z = ri(GZ0 + 2, GZ1 - 3);
    if (Math.abs(z) <= 6) continue;
    if (Math.abs(x - HOUSE.x) < 7 && Math.abs(z - HOUSE.z) < 6) continue;
    const h = getH(x, z);
    const top = getV(x, h - 1, z);
    if (top !== T.GRASS && top !== T.GRASS2) continue;
    if (h + 9 >= GH) continue;
    let flat = true;
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (Math.abs(getH(x + dx, z + dz) - h) > 1) flat = false;
    if (!flat) continue;
    if (trees.some(t => Math.abs(t[0] - x) < 3 && Math.abs(t[1] - z) < 3)) continue;
    trees.push([x, z]);
    const autumn = h < 12 ? rand() < 0.55 : rand() < 0.15;
    if (autumn) {
      const th = ri(2, 3);
      for (let i = 0; i < th; i++) setV(x, h + i, z, T.TRUNK);
      const cy = h + th + 1, lt = pick3();
      for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 2; dy++) for (let dz = -2; dz <= 2; dz++) {
        if (dx * dx + dy * dy * 1.3 + dz * dz > 5.2) continue;
        if (hash3(x + dx, cy + dy, z + dz) > 0.93) continue;
        setIfEmpty(x + dx, cy + dy, z + dz, hash3(x + dx * 3, cy + dy, z + dz) > 0.75 ? T.AUTUMN2 : lt);
      }
    } else {
      const th = ri(1, 2);
      for (let i = 0; i < th; i++) setV(x, h + i, z, T.TRUNK);
      const radii = rand() < 0.5 ? [2, 2, 1, 1, 0, 0] : [2, 1, 1, 0];
      const leaf = rand() < 0.5 ? T.PINE : T.PINE2;
      radii.forEach((r, j) => {
        const y = h + th + j;
        for (let dx = -r; dx <= r; dx++) for (let dz = -r; dz <= r; dz++) {
          if (r > 0 && Math.abs(dx) === r && Math.abs(dz) === r) continue;
          setV(x + dx, y, z + dz, leaf);
        }
      });
    }
  }
  function pick3() { const r = rand(); return r < 0.45 ? T.AUTUMN : r < 0.8 ? T.YLEAF : T.AUTUMN2; }
  // 零散岩石
  for (let n = 0, tries = 0; n < 50 && tries < 3000; tries++) {
    const x = ri(GX0 + 1, GX1 - 2), z = ri(GZ0 + 1, GZ1 - 2);
    if (Math.abs(z) <= 5) continue;
    const h = getH(x, z);
    if (getV(x, h, z) || h < WATER_Y - 1) continue;
    setV(x, h, z, T.ROCK);
    if (rand() < 0.5) setIfEmpty(x + 1, h, z, T.STONE);
    if (rand() < 0.3) setIfEmpty(x, h + 1, z, T.STONE);
    n++;
  }
}

/* ================= 体素网格化（面剔除 + 顶点 AO） ================= */
function buildVoxelMeshes() {
  const B = [{ pos: [], nor: [], col: [], idx: [], n: 0 }, { pos: [], nor: [], col: [], idx: [], n: 0 }];
  const AO_K = [0.5, 0.68, 0.84, 1.0];
  const CW = [[0, 0], [1, 0], [1, 1], [0, 1]], CCW = [[0, 0], [0, 1], [1, 1], [1, 0]];
  const isS = (x, y, z) => getV(x, y, z) !== 0 ? 1 : 0;
  const col = new THREE.Color();
  const q = [0, 0, 0], vp = [0, 0, 0], ao = [0, 0, 0, 0];
  for (let x = GX0; x < GX1; x++) for (let z = GZ0; z < GZ1; z++) for (let y = 0; y < GH; y++) {
    const t = grid[gi(x, y, z)];
    if (!t) continue;
    const glow = t >= 20;
    const b = B[glow ? 1 : 0];
    col.setHex(PAL[t]);
    const j = glow ? 1.7 : 0.9 + hash3(x, y, z) * 0.2;
    for (let f = 0; f < 6; f++) {
      const a = f >> 1, s = (f & 1) ? -1 : 1;
      q[0] = x; q[1] = y; q[2] = z; q[a] += s;
      if (isS(q[0], q[1], q[2])) continue;
      const u = (a + 1) % 3, v = (a + 2) % 3;
      const cs = s > 0 ? CW : CCW;
      const shade = a === 1 ? (s > 0 ? 1.0 : 0.7) : 0.92;
      const nrm = [0, 0, 0]; nrm[a] = s;
      for (let k = 0; k < 4; k++) {
        const du = cs[k][0], dv = cs[k][1];
        vp[0] = x; vp[1] = y; vp[2] = z;
        vp[a] += s > 0 ? 1 : 0; vp[u] += du; vp[v] += dv;
        const su = du ? 1 : -1, sv = dv ? 1 : -1;
        q[u] += su; const s1 = isS(q[0], q[1], q[2]);
        q[v] += sv; const c = isS(q[0], q[1], q[2]);
        q[u] -= su; const s2 = isS(q[0], q[1], q[2]);
        q[v] -= sv;
        const o = (s1 && s2) ? 0 : 3 - (s1 + s2 + c);
        ao[k] = o;
        const m = (glow ? 1 : AO_K[o] * shade) * j;
        b.pos.push(vp[0], vp[1], vp[2]);
        b.nor.push(nrm[0], nrm[1], nrm[2]);
        b.col.push(col.r * m, col.g * m, col.b * m);
      }
      const n = b.n;
      if (ao[0] + ao[2] < ao[1] + ao[3]) b.idx.push(n + 1, n + 2, n + 3, n + 1, n + 3, n);
      else b.idx.push(n, n + 1, n + 2, n, n + 2, n + 3);
      b.n += 4;
    }
  }
  return B.map(b => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(b.nor, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(b.col, 3));
    g.setIndex(b.idx);
    g.computeBoundingSphere();
    return g;
  });
}
{

const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  vertexShader: `
    varying vec3 vWorld;
    #include <fog_pars_vertex>
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      vec4 mvPosition = viewMatrix * wp;
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uSun, uDeep, uSkyLow, uSkyHigh, uSunCol;
    varying vec3 vWorld;
    #include <fog_pars_fragment>
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
    }
    void main(){
      vec2 p = floor(vWorld.xz * 2.0) / 2.0;  // 半格像素化，保持体素风格
      float t = uTime;
      float n1 = noise(p * 0.25 + vec2(0.0, t * 0.5));
      float n2 = noise(p * 0.6 + vec2(t * 0.15, t * 0.9));
      vec3 nrm = normalize(vec3((n1 - 0.5) * 0.5, 1.0, (n2 - 0.5) * 0.5));
      vec3 V = normalize(cameraPosition - vWorld);
      vec3 R = reflect(-V, nrm);
      float fres = pow(1.0 - max(dot(nrm, V), 0.0), 3.0);
      vec3 skyC = mix(uSkyLow, uSkyHigh, smoothstep(0.0, 0.6, R.y));

      vec3 col = mix(uDeep, skyC, 0.35 + 0.55 * fres);
      float sparkle = step(0.9, noise(p * 1.7 + vec2(t * 0.7, -t * 1.3))) * pow(sd, 3.0);
      col += uSunCol * sparkle * 1.6;
      col += vec3(0.9, 0.8, 0.75) * smoothstep(0.8, 0.84, n2) * 0.2;
      gl_FragColor = vec4(col, 0.86);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }`,
  transparent: true, fog: true
});

const trainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5, metalness: 0.25 });

function colBox(x0, y0, z0, x1, y1, z1, hex, mul = 1) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  const c = new THREE.Color(hex).multiplyScalar(mul);
  const n = g.attributes.position.count, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) arr.set([c.r, c.g, c.b], i * 3);
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return g;
}
class Parts {
  constructor() { this.s = []; this.g = []; }
  box(x0, y0, z0, x1, y1, z1, hex) { this.s.push(colBox(x0, y0, z0, x1, y1, z1, hex)); return this; }
  sym(x0, y0, z0, x1, y1, z1, hex) { this.box(x0, y0, z0, x1, y1, z1, hex); return this.box(x0, y0, -z1, x1, y1, -z0, hex); }
  glow(x0, y0, z0, x1, y1, z1, hex) { this.g.push(colBox(x0, y0, z0, x1, y1, z1, hex, 1.6)); return this; }
  gsym(x0, y0, z0, x1, y1, z1, hex) { this.glow(x0, y0, z0, x1, y1, z1, hex); return this.glow(x0, y0, -z1, x1, y1, -z0, hex); }
  build() {
    const grp = new THREE.Group();
    const m = new THREE.Mesh(mergeGeometries(this.s), trainMat);
    m.castShadow = m.receiveShadow = true;
    grp.add(m);
    if (this.g.length) grp.add(new THREE.Mesh(mergeGeometries(this.g), trainGlowMat));
    return grp;
  }
}

function makeWheel(r, mat, crank = 0) {
  const g = new THREE.Group();
  const tire = new THREE.Mesh(cachedGeo('t' + r, () => new THREE.CylinderGeometry(r, r, 0.2, 12).rotateX(Math.PI / 2)), tireMat);
  const disc = new THREE.Mesh(cachedGeo('d' + r, () => new THREE.CylinderGeometry(r * 0.8, r * 0.8, 0.24, 12).rotateX(Math.PI / 2)), mat);
  const spokeGeo = cachedGeo('s' + r, () => new THREE.BoxGeometry(r * 1.55, r * 0.16, 0.28));

  s2.rotation.z = Math.PI / 2;
  const hub = new THREE.Mesh(cachedGeo('hub', () => new THREE.BoxGeometry(0.24, 0.24, 0.32)), brassMat);
  g.add(tire, disc, s1, s2, hub);
  if (crank) {

    const cw = new THREE.Mesh(cachedGeo('cw' + r, () => new THREE.BoxGeometry(r * 0.8, r * 0.35, 0.27)), tireMat);
    cw.position.y = -r * 0.5;

  g.traverse(o => { if (o.isMesh) o.castShadow = true; });

}

  for (let i = 0; i < 3; i++) for (const s of [1, -1]) addWheel(car, DRV_R, redWheelMat, DRV_X[i], s * 0.72, CRANK, s > 0 ? 0 : Math.PI / 2);
  for (const x of [2.55, 3.55]) for (const s of [1, -1]) addWheel(car, 0.42, redWheelMat, x, s * 0.72);
  // 连杆：每侧一根联动杆、一根主连杆、十字头与活塞杆
  car.rods = [1, -1].map(s => {
    const coup = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.14, 0.08), steelMat);
    const main = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.13, 0.08), steelMat);
    const xh = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.22, 0.14), brassMat);
    const piston = new THREE.Mesh(new THREE.BoxGeometry(1, 0.07, 0.07), steelMat);
    [coup, main, xh, piston].forEach(o => { o.castShadow = true; car.body.add(o); });
    return { s, coup, main, xh, piston, phase: s > 0 ? 0 : Math.PI / 2 };
  });
  // 前照灯 / 炉火光（挂在 root 上，避免隐藏时灯光数量变化导致着色器重编译）
  const head = new THREE.SpotLight(0xffe0a8, 60, 50, 0.42, 0.6, 1.3);
  head.position.set(4.3, 3.45, 0);
  head.target.position.set(24, 0, 0);
  car.root.add(head, head.target);
  const fire = new THREE.PointLight(0xff7a30, 6, 9, 1.6);
  fire.position.set(-4.4, 2.6, 0);
  car.root.add(fire);
  car.head = head; car.fire = fire;
  return car;
})();

/* ================= 体素蒸汽烟雾 ================= */
const P_N = 460;
const smokeMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x2c1626 });
const smoke = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), smokeMat, P_N);
smoke.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
smoke.frustumCulled = false;
scene.add(smoke);
const particles = [];
{
  const zero = new THREE.Matrix4().makeScale(0, 0, 0), white = new THREE.Color(1, 1, 1);
  for (let i = 0; i < P_N; i++) {
    smoke.setMatrixAt(i, zero);
    smoke.setColorAt(i, white);
    particles.push({ alive: false, p: new THREE.Vector3(), v: new THREE.Vector3(), age: 0, life: 1, s0: 0.5, s1: 2, q: new THREE.Quaternion(), spin: new THREE.Vector3(), steam: false });
  }
  smoke.instanceColor.setUsage(THREE.DynamicDrawUsage);
}
let pHead = 0;
function emit(pos, vel, life, s0, s1, steam) {
  const q = particles[pHead]; pHead = (pHead + 1) % P_N;
  q.alive = true; q.age = 0; q.life = life; q.s0 = s0; q.s1 = s1; q.steam = steam;
  q.p.copy(pos); q.v.copy(vel);
  q.q.setFromEuler(new THREE.Euler(rr(0, 3), rr(0, 3), rr(0, 3)));
  q.spin.set(rr(-1, 1), rr(-1, 1), rr(-1, 1));
}
const WIND = new THREE.Vector3(-1.4, 0, 0.6);
const SMOKE_A = new THREE.Color(0xfffaf2), SMOKE_B = new THREE.Color(0xd8b8b8), SMOKE_C = new THREE.Color(0x8d7c96);
const _m4 = new THREE.Matrix4(), _s3 = new THREE.Vector3(), _c = new THREE.Color(), _dq = new THREE.Quaternion(), _e = new THREE.Euler();
function updateSmoke(dt) {
  for (let i = 0; i < P_N; i++) {
    const q = particles[i];
    if (!q.alive) continue;
    q.age += dt;
    if (q.age >= q.life) {
      q.alive = false;
      smoke.setMatrixAt(i, _m4.makeScale(0, 0, 0));
      continue;
    }
    const t = q.age / q.life;
    q.v.y *= 1 - (q.steam ? 2.5 : 0.45) * dt;
    q.v.x += (WIND.x - q.v.x) * 0.5 * dt;
    q.v.z += (WIND.z - q.v.z) * 0.5 * dt;
    q.p.addScaledVector(q.v, dt);
    _dq.setFromEuler(_e.set(q.spin.x * dt, q.spin.y * dt, q.spin.z * dt));
    q.q.multiply(_dq);
    let s = lerp(q.s0, q.s1, 1 - (1 - t) * (1 - t));
    if (t > 0.72) s *= 1 - (t - 0.72) / 0.28;
    _m4.compose(q.p, q.q, _s3.set(s, s, s));
    smoke.setMatrixAt(i, _m4);
    if (q.steam) _c.copy(SMOKE_A);
    else if (t < 0.4) _c.copy(SMOKE_A).lerp(SMOKE_B, t / 0.4);
    else _c.copy(SMOKE_B).lerp(SMOKE_C, (t - 0.4) / 0.6);
    smoke.setColorAt(i, _c);
  }
  smoke.instanceMatrix.needsUpdate = true;
  smoke.instanceColor.needsUpdate = true;
}

/* ================= 交互：跟随火车 ================= */
let follow = false;
const followBtn = document.getElementById('followBtn');
followBtn.addEventListener('click', () => {
  follow = !follow;
  followBtn.classList.toggle('on', follow);
  followBtn.textContent = follow ? '自由视角' : '跟随火车';
});

/* ================= 动画循环 ================= */
const SPEED = 7;                         // 火车速度（格/秒）
const S_START = -(TUN_X + 6), S_END = 84; // 车头从左隧道驶出，整列没入右隧道后稍作停顿
const CYCLE = S_END - S_START;
let dist = 40, lastChuff = -1, steamSide = 1;
const clock = new THREE.Clock();
const _v = new THREE.Vector3(), _v2 = new THREE.Vector3(), _goal = new THREE.Vector3(), _prevT = new THREE.Vector3();

function updateTrain(dt, time) {
  dist += SPEED * dt;
  const s = (dist % CYCLE) + S_START;
  for (let i = 0; i < cars.length; i++) {
    const car = cars[i];
    const x = s + car.offset;
    car.root.position.set(x, RAIL_Y + Math.sin(dist * 2.3 + i * 1.7) * 0.012, 0);
    car.body.visible = !(x - car.halfB > TUN_X || x + car.halfF < -TUN_X);
    for (const wh of car.wheels) wh.w.rotation.z = -dist / wh.r + wh.phase;
  }
  // 机车连杆运动学
  const alpha = -dist / DRV_R;
  const CYL_Y = 0.92, MAIN_L = 3.0;
  for (const r of loco.rods) {
    const a = alpha + r.phase;
    const px = -CRANK * Math.sin(a), py = DRV_R + CRANK * Math.cos(a);
    r.coup.position.set(DRV_X[1] + px, py, r.s * 0.95);
    const pinX = DRV_X[1] + px;
    const dy = CYL_Y - py, dx = Math.sqrt(MAIN_L * MAIN_L - dy * dy);
    const chx = pinX + dx;
    r.main.position.set((pinX + chx) / 2, (py + CYL_Y) / 2, r.s * 1.05);
    r.main.rotation.z = Math.atan2(dy, dx);
    r.xh.position.set(chx, CYL_Y, r.s * 1.05);
    const pl = Math.max(0.05, 2.0 - chx);
    r.piston.scale.x = pl;
    r.piston.position.set(chx + pl / 2, CYL_Y, r.s * 1.05);
  }
  // 灯光：隐藏时只把强度归零
  const lx = loco.root.position.x;
  const lit = loco.body.visible;
  loco.head.intensity = lit ? 60 : 0;
  loco.fire.intensity = lit ? 5 + Math.sin(time * 23) * 1.2 + Math.sin(time * 9.7) * 1.5 : 0;

  // 排气节奏：每圈动轮 4 次 "咔嚓"
  const chuff = Math.floor(dist / (Math.PI * 2 * DRV_R) * 4);
  const chimneyX = lx + 3.575;
  const inOpen = chimneyX > -TUN_X + 0.6 && chimneyX < TUN_X - 0.6;
  if (chuff !== lastChuff) {
    lastChuff = chuff;
    if (inOpen) {
      const top = _v.set(chimneyX, RAIL_Y + 4.9, 0);
      for (let k = 0; k < 4; k++) {
        emit(_v2.copy(top).add(new THREE.Vector3(rr(-0.15, 0.15), rr(0, 0.3), rr(-0.15, 0.15))),
          new THREE.Vector3(SPEED * 0.12 + rr(-0.4, 0.4), rr(3.6, 5.2), rr(-0.5, 0.5)),
          rr(2.8, 4.2), rr(0.4, 0.6), rr(2.0, 3.2), false);
      }
      // 汽缸排出的白色蒸汽
      steamSide = -steamSide;
      if (rand() < 0.6) {
        for (let k = 0; k < 2; k++) emit(_v2.set(lx + 3.1, RAIL_Y + 0.6, steamSide * 1.35),
          new THREE.Vector3(rr(-1.5, -0.5), rr(0.3, 1.0), steamSide * rr(0.8, 1.6)), rr(0.5, 0.8), 0.25, rr(0.8, 1.2), true);
      }
    }
  } else if (inOpen && rand() < dt * 10) {
    emit(_v2.set(chimneyX + rr(-0.1, 0.1), RAIL_Y + 4.9, rr(-0.1, 0.1)), new THREE.Vector3(rr(-0.3, 0.3), rr(2.2, 3), rr(-0.3, 0.3)), rr(2, 3), 0.3, rr(1.2, 1.8), false);
  }
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;
  updateTrain(dt, time);
  updateSmoke(dt);
  waterUniforms.uTime.value = time;

  for (const c of clouds) {
    c.mesh.position.x += c.speed * dt;
    if (c.mesh.position.x > 260) c.mesh.position.x = -260;
  }
  for (const b of birds) {
    const a = b.phase + time * b.speed;
    const x = b.cx + Math.cos(a) * b.R, z = b.cz + Math.sin(a) * b.R * 0.6;
    const dx = -Math.sin(a) * Math.sign(b.speed), dz = Math.cos(a) * 0.6 * Math.sign(b.speed);
    b.g.position.set(x, b.y + Math.sin(time * 0.9 + b.phase) * 1.2, z);
    b.g.rotation.y = Math.atan2(-dz, dx);
    const f = Math.sin(time * 7 + b.phase * 3) * 0.6;
    b.wl.rotation.x = f;
    b.wr.rotation.x = -f;
  }

  if (follow) {
    _goal.copy(loco.root.position);
    _goal.x = clamp(_goal.x - 8, -TUN_X + 6, TUN_X - 6);
    _goal.y += 2;
    _prevT.copy(controls.target);
    controls.target.lerp(_goal, 1 - Math.exp(-dt * 2.5));
    camera.position.add(_v.subVectors(controls.target, _prevT));
  }
  controls.update();
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
