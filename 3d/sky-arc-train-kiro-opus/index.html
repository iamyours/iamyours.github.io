{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ============================================================
// 常量 & 轨道参数方程（Y 轴朝上，轨道全程 y = 0）
// ============================================================
const R = 185, S_MIN = -430, S_MAX = 440, LOOP = 25;
const UP = new THREE.Vector3(0, 1, 0);
const SUN_DIR = new THREE.Vector3(-0.82, 0.13, -0.56).normalize();
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

// θ = s/R；x = (R+lat)·sinθ；z = (R+lat)·cosθ − R
function arcPos(s, lat = 0, y = 0, out = new THREE.Vector3()) {
  const th = s / R, r = R + lat;
  return out.set(r * Math.sin(th), y, r * Math.cos(th) - R);
}
const _q = new THREE.Quaternion(), _pv = new THREE.Vector3(), _one = new THREE.Vector3(1, 1, 1);
function arcMatrix(s, lat = 0, y = 0, out = new THREE.Matrix4()) {
  _q.setFromAxisAngle(UP, s / R);              // rotation.y = θ（局部 +X 前进，+Z 外侧）
  arcPos(s, lat, y, _pv);
  return out.compose(_pv, _q, _one);
}
function placeOnArc(obj, s, lat = 0, y = 0) { arcPos(s, lat, y, obj.position); obj.rotation.set(0, s / R, 0); }
function placed(geo, s, lat = 0, y = 0) { return geo.clone().applyMatrix4(arcMatrix(s, lat, y)); }

const clamp01 = x => Math.min(1, Math.max(0, x));
function smoother(a, b, x) { const t = clamp01((x - a) / (b - a)); return t * t * t * (t * (t * 6 - 15) + 10); }
function smootherInt(x) { x = clamp01(x); return x * x * x * x * (x * x - 3 * x + 2.5); } // ∫₀ˣ smootherstep

// ---------- 几何工具 ----------
function box(w, h, d, x = 0, y = 0, z = 0) { const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); return g; }
function cylX(rFront, rBack, len, seg, x = 0, y = 0, z = 0) { const g = new THREE.CylinderGeometry(rFront, rBack, len, seg); g.rotateZ(-Math.PI / 2); g.translate(x, y, z); return g; }
function cylY(rTop, rBot, len, seg, x = 0, y = 0, z = 0) { const g = new THREE.CylinderGeometry(rTop, rBot, len, seg); g.translate(x, y, z); return g; }
function cylZ(r, len, seg, x = 0, y = 0, z = 0) { const g = new THREE.CylinderGeometry(r, r, len, seg); g.rotateX(Math.PI / 2); g.translate(x, y, z); return g; }
// 局部 (z,y) 平面内两点之间的杆件
function barZY(z1, y1, z2, y2, t, x = 0) {
  const dz = z2 - z1, dy = y2 - y1, L = Math.hypot(dz, dy);
  const g = new THREE.BoxGeometry(t, L, t); g.rotateX(Math.atan2(dz, dy)); g.translate(x, (y1 + y2) / 2, (z1 + z2) / 2); return g;
}
// 统一属性后合并（按材质合并静态零件）
function merge(list) {
  const arr = list.map(g => {
    const n = g.index ? g.toNonIndexed() : g;
    for (const k of Object.keys(n.attributes)) if (k !== 'position' && k !== 'normal' && k !== 'uv') n.deleteAttribute(k);
    if (!n.attributes.normal) n.computeVertexNormals();
    if (!n.attributes.uv) n.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n.attributes.position.count * 2), 2));
    return n;
  });
  const m = mergeGeometries(arr, false); m.computeBoundingSphere(); return m;
}
// 沿圆弧扫掠截面（profile: [[lat,y],...] 逆时针 → 法线朝外），绝不用直线段拼弯道
function sweep(profile, s0, s1, step, closed = true, uvS = 0.25) {
  const n = Math.max(1, Math.ceil((s1 - s0) / step));
  const pos = [], nor = [], uv = [], idx = [];
  let vi = 0, acc = 0;
  const E = closed ? profile.length : profile.length - 1;
  for (let e = 0; e < E; e++) {
    const a = profile[e], b = profile[(e + 1) % profile.length];
    const dl = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dl, dy) || 1e-6;
    const nl = dy / L, ny = -dl / L;
    for (let i = 0; i <= n; i++) {
      const s = s0 + (s1 - s0) * i / n, th = s / R, sn = Math.sin(th), cs = Math.cos(th);
      for (let k = 0; k < 2; k++) {
        const p = k ? b : a, r = R + p[0];
        pos.push(r * sn, p[1], r * cs - R); nor.push(nl * sn, ny, nl * cs); uv.push(s * uvS, (acc + k * L) * uvS);
      }
      if (i < n) { const o = vi + i * 2; idx.push(o, o + 2, o + 1, o + 1, o + 2, o + 3); }
    }
    vi += (n + 1) * 2; acc += L;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); return g;
}
const rect = (l0, l1, y0, y1) => [[l1, y1], [l0, y1], [l0, y0], [l1, y0]];
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

// ============================================================
// 渲染器 / 场景 / 相机
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const MAX_PT = Math.min(renderer.getContext().getParameter(renderer.getContext().ALIASED_POINT_SIZE_RANGE)[1] || 256, 512);

const scene = new THREE.Scene();
const FOG_COL = new THREE.Color().setRGB(0.018, 0.040, 0.095);   // 与地平线同色（线性值，压得很低）
scene.fog = new THREE.FogExp2(FOG_COL.clone(), 0.0011);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 6000);
camera.position.set(105, 95, 200);

const ptU = { uScale: { value: 1 }, uMaxPt: { value: MAX_PT } };      // 点精灵：世界尺寸 → 像素
const timeU = { value: 0 };

// ============================================================
// 天幕 shader（深蓝渐变 + 星点 + 低垂的太阳）
// ============================================================
const SKY_GLSL = /* glsl */`
uniform vec3 uSun;
vec3 skyBase(vec3 d){
  float h = clamp(d.y, 0.0, 1.0);
  vec3 zen = vec3(0.0012, 0.0026, 0.010);
  vec3 hor = vec3(0.018, 0.040, 0.095);
  vec3 c = mix(hor, zen, pow(h, 0.42));
  float sd = max(dot(d, uSun), 0.0);
  float band = exp(-abs(d.y - uSun.y * 0.3) * 7.0);
  c += vec3(1.0, 0.50, 0.24) * (pow(sd, 5.0) * 0.08 * band + pow(sd, 32.0) * 0.17 + pow(sd, 260.0) * 0.6);
  return c;
}`;
const NOISE_GLSL = /* glsl */`
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1,0)), u.x), mix(hash12(i + vec2(0,1)), hash12(i + vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ float a = 0.5, s = 0.0; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = m * p; a *= 0.5; } return s; }`;

function makeSkyMat(core) {
  return new THREE.ShaderMaterial({
    uniforms: { uSun: { value: SUN_DIR }, uTime: timeU, uCore: { value: core } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `varying vec3 vDir; uniform float uTime; uniform float uCore; ${SKY_GLSL} ${NOISE_GLSL}
      void main(){
        vec3 d = normalize(vDir);
        vec3 c = skyBase(d);
        float sd = max(dot(d, uSun), 0.0);
        c += vec3(1.0, 0.86, 0.66) * (pow(sd, 2400.0) * 20.0 + pow(sd, 600.0) * 1.5) * uCore;   // 耀眼核心
        vec3 p = d * 220.0; vec3 id = floor(p); float h = hash13(id);
        if (h > 0.9965) {
          vec3 f = fract(p) - 0.5 - (vec3(hash13(id + 1.7), hash13(id + 3.1), hash13(id + 5.3)) - 0.5) * 0.4;
          float st = smoothstep(0.32, 0.0, length(f));
          float tw = 0.65 + 0.35 * sin(uTime * (1.5 + h * 40.0) + h * 600.0);
          c += st * tw * mix(vec3(0.7, 0.8, 1.0), vec3(1.0, 0.9, 0.75), fract(h * 313.0)) * (0.5 + 2.5 * fract(h * 97.0))
               * smoothstep(0.02, 0.25, d.y) * (1.0 - smoothstep(0.96, 1.0, sd)) * uCore;
        }
        gl_FragColor = vec4(c, 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false, fog: false
  });
}
const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 48, 24), makeSkyMat(1));
sky.renderOrder = -10; sky.frustumCulled = false; scene.add(sky);

// 环境反射：天空 shader → PMREM
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), makeSkyMat(0.05)));
  scene.environment = pmrem.fromScene(envScene, 0.02, 0.1, 500).texture;
  pmrem.dispose();
}

// ============================================================
// 太阳光 / 环境光
// ============================================================
const sunLight = new THREE.DirectionalLight(new THREE.Color().setRGB(1.0, 0.72, 0.48), 2.4);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -62, right: 62, top: 62, bottom: -62, near: 40, far: 700 });
sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = 0.04;
sunLight.target.position.copy(arcPos(35, 0, 0));
sunLight.position.copy(sunLight.target.position).addScaledVector(SUN_DIR, 320);
scene.add(sunLight, sunLight.target);
scene.add(new THREE.HemisphereLight(0x1d3463, 0x07090f, 0.45));

// ============================================================
// 土星（右上，倾斜光环 + 卡西尼缝）与伴星
// ============================================================
function planetMat(map, amb, bright) {
  return new THREE.ShaderMaterial({
    uniforms: { map: { value: map }, uL: { value: new THREE.Vector3() }, uAmb: { value: amb }, uB: { value: bright } },
    vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vW;
      void main(){ vUv = uv; vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform sampler2D map; uniform vec3 uL; uniform float uAmb; uniform float uB; varying vec2 vUv; varying vec3 vN; varying vec3 vW;
      void main(){ vec3 n = normalize(vN); vec3 col = texture2D(map, vUv).rgb;
        float wrap = smoothstep(-0.2, 0.7, dot(n, uL));
        vec3 v = normalize(cameraPosition - vW); float rim = pow(1.0 - max(dot(n, v), 0.0), 3.0);
        gl_FragColor = vec4(col * (wrap + uAmb) * uB + vec3(0.25, 0.35, 0.6) * rim * 0.12, 1.0); }`,
    fog: false
  });
}
function bandTex() {
  const [c, g] = canvas(64, 512);
  for (let y = 0; y < 512; y++) {
    const v = y / 511, lat = Math.abs(v - 0.5) * 2;
    const n = Math.sin(v * 58) * 0.45 + Math.sin(v * 131 + 1.3) * 0.25 + Math.sin(v * 23 + 0.4) * 0.35;
    const k = 0.78 + 0.13 * n;
    const r = 196 * k * (1 - lat * 0.35), gg = 168 * k * (1 - lat * 0.3), b = 122 * k * (1 - lat * 0.12) + lat * 18;
    g.fillStyle = `rgb(${r | 0},${gg | 0},${b | 0})`; g.fillRect(0, y, 64, 1);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function moonTex() {
  const [c, g] = canvas(256, 128);
  g.fillStyle = '#7d8a99'; g.fillRect(0, 0, 256, 128);
  for (let i = 0; i < 140; i++) {
    const x = Math.random() * 256, y = Math.random() * 128, r = 1 + Math.random() * Math.random() * 14;
    g.fillStyle = `rgba(40,50,64,${0.15 + Math.random() * 0.3})`; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(200,210,225,0.18)'; g.lineWidth = 1; g.beginPath(); g.arc(x - 0.5, y - 0.5, r, 0, Math.PI * 2); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
{
  const satDir = V3(-0.017, 0.101, -1).normalize();
  const saturn = new THREE.Group(); saturn.position.copy(satDir).multiplyScalar(2200); scene.add(saturn);
  saturn.lookAt(0, 0, 0);
  const roll = new THREE.Group(); roll.rotation.z = 0.42; saturn.add(roll);
  const tilt = new THREE.Group(); tilt.rotation.x = 1.18; roll.add(tilt);
  const pm = planetMat(bandTex(), 0.06, 0.75);
  pm.uniforms.uL.value.copy(SUN_DIR).add(satDir.clone().negate()).normalize();
  const ball = new THREE.Mesh(new THREE.SphereGeometry(170, 64, 32), pm); ball.rotation.x = Math.PI / 2; tilt.add(ball);
  const ring = new THREE.Mesh(new THREE.RingGeometry(205, 400, 180, 1), new THREE.ShaderMaterial({
    vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `varying vec2 vP; void main(){
      float r = (length(vP) - 205.0) / 195.0;
      float d = 0.55 + 0.25 * sin(r * 95.0) + 0.15 * sin(r * 240.0 + 1.0);
      d *= smoothstep(0.0, 0.12, r) * smoothstep(1.0, 0.93, r);
      d *= mix(0.08, 1.0, smoothstep(0.012, 0.03, abs(r - 0.63)));   // 卡西尼缝
      d *= mix(0.5, 1.0, smoothstep(0.25, 0.4, r));
      vec3 col = mix(vec3(0.42, 0.36, 0.27), vec3(0.62, 0.55, 0.42), 0.5 + 0.5 * sin(r * 37.0));
      gl_FragColor = vec4(col * 0.7, clamp(d, 0.0, 1.0) * 0.85); }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false
  }));
  tilt.add(ring);
  const moonDir = V3(0.16, 0.04, -1).normalize();
  const mm = planetMat(moonTex(), 0.08, 0.55);
  mm.uniforms.uL.value.copy(SUN_DIR).add(moonDir.clone().negate()).normalize();
  const moon = new THREE.Mesh(new THREE.SphereGeometry(52, 48, 24), mm);
  moon.position.copy(moonDir).multiplyScalar(2100); scene.add(moon);
}

// ============================================================
// 云海（fbm 流动翻滚 + 暖色前向散射 + 远处融入地平线）
// ============================================================
const END_POS = arcPos(S_MAX, 0, 1.5);
const seaMat = new THREE.ShaderMaterial({
  uniforms: { uSun: { value: SUN_DIR }, uTime: timeU, uEnd: { value: END_POS } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uTime; uniform vec3 uEnd; varying vec3 vW; ${SKY_GLSL} ${NOISE_GLSL}
    void main(){
      vec3 toP = vW - cameraPosition; float dist = length(toP); vec3 v = toP / dist;
      vec2 p = vW.xz * 0.012;
      vec2 q = vec2(fbm(p + vec2(uTime * 0.020, uTime * 0.010)), fbm(p * 1.3 - vec2(uTime * 0.015, 0.0) + 5.2));
      float d = fbm(p * 1.7 + q * 1.8 + vec2(uTime * 0.03, -uTime * 0.012));
      d = smoothstep(0.28, 0.85, d);
      vec3 col = mix(vec3(0.008, 0.013, 0.028), vec3(0.050, 0.068, 0.110), d);
      float hl = max(length(v.xz), 1e-4);                       // 防止正下方视线归一化出 NaN（CubeCamera 的 -Y 面）
      vec3 vh = vec3(v.x / hl, 0.0, v.z / hl), sh = normalize(vec3(uSun.x, 0.0, uSun.z));
      float fs = max(dot(vh, sh), 0.0);
      float far = smoothstep(40.0, 900.0, dist);
      col += vec3(0.9, 0.45, 0.2) * (pow(fs, 4.0) * 0.07 + pow(fs, 24.0) * 0.22) * (0.3 + d) * (0.35 + 0.65 * far);
      col += vec3(1.0, 0.6, 0.3) * d * (1.0 - d) * pow(fs, 10.0) * 0.18;           // 云边银边
      col += vec3(0.35, 0.65, 1.0) * 0.45 * exp(-length(vW.xz - uEnd.xz) / 55.0) * (0.4 + d);   // 轨道尽头映照
      float f = 1.0 - exp(-dist * 0.00085);
      col = mix(col, skyBase(vh), clamp(f, 0.0, 1.0));
      gl_FragColor = vec4(col, 1.0);
    }`,
  fog: false
});
const sea = new THREE.Mesh(new THREE.CircleGeometry(3600, 72).rotateX(-Math.PI / 2), seaMat);
sea.position.y = -8; sea.frustumCulled = false; scene.add(sea);

// 柔边云团贴图（云柱、贴面云团、蒸汽共用）
const puffTex = (() => {
  const [c, g] = canvas(128, 128);
  for (let i = 0; i < 24; i++) {
    const x = 64 + (Math.random() - 0.5) * 52, y = 64 + (Math.random() - 0.5) * 52, r = 16 + Math.random() * 30;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);

function wheelsetGeo(r, spokes, crank) {

    if (crank) { const cw = new THREE.BoxGeometry(r * 0.62, r * 0.2, 0.09); cw.translate(0, -r * 0.6, 0); cw.rotateZ(ph + Math.PI * 1.5); cw.translate(0, 0, z); rim.push(cw); }

}

function lightCone(len, rad, intensity) {
  const geo = new THREE.ConeGeometry(rad, len, 32, 1, true); geo.rotateZ(Math.PI / 2); geo.translate(len / 2, 0, 0);
  return new THREE.Mesh(geo, new THREE.ShaderMaterial({
    uniforms: { uLen: { value: len }, uI: { value: intensity } },
    vertexShader: `uniform float uLen; varying float vX; varying vec3 vN; varying vec3 vV;
      void main(){ vX = position.x / uLen; vec4 w = modelMatrix * vec4(position, 1.0); vN = normalize(mat3(modelMatrix) * normal); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform float uI; varying float vX; varying vec3 vN; varying vec3 vV;
      void main(){ float f = pow(1.0 - clamp(vX, 0.0, 1.0), 1.6) * smoothstep(0.0, 0.04, vX);
        float e = abs(dot(normalize(vN), normalize(vV)));
        gl_FragColor = vec4(vec3(1.0, 0.92, 0.76) * uI, f * pow(e, 1.5) * 0.2); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false
  }));
}

function updateRods(loco, s) {

    DRV_X.forEach((x, i) => sd.pins[i].position.set(x + px, AXLE_Y + py, i === 1 ? (sd.z + sd.zc) / 2 + (sd.z > 0 ? -0.04 : 0.04) : sd.zc));
    const cx = -0.6 + px, cy = AXLE_Y + py;
    const xh = cx + Math.sqrt(MAIN_L * MAIN_L - py * py);                 // 十字头：只沿水平滑杆往复
    sd.main.position.set((cx + xh) / 2, (cy + AXLE_Y) / 2, sd.z);
    sd.main.rotation.z = Math.atan2(AXLE_Y - cy, xh - cx);
    sd.cross.position.set(xh, AXLE_Y, sd.z);
    sd.piston.position.set(xh, AXLE_Y, sd.z); sd.piston.scale.x = Math.max(0.01, 3.0 - xh);
  }
}

const sLocoAt = t => -250 + 24 * t;
const _a = new THREE.Vector3(), _b = new THREE.Vector3();
function updateTrain(t) {
  const sl = sLocoAt(t);
  for (const c of cars) {
    const s = sl - c.off;
    placeOnArc(c.obj, s);                                                     // 每节车独立计算位置与 rotation.y
    for (const w of c.wheels) w.obj.rotation.z = -s / w.r;                    // 角度 = -s / 半径，不打滑
  }
  updateRods(loco, sl);
  for (let i = 0; i < bellows.length; i++) {
    const A = cars[i], B = cars[i + 1];
    arcPos(sl - A.off - A.back, 0, 0, _a); arcPos(sl - B.off + B.front, 0, 0, _b);
    const b = bellows[i], d = _a.distanceTo(_b);
    b.position.addVectors(_a, _b).multiplyScalar(0.5); b.position.y = b.userData.y;
    b.rotation.set(0, Math.atan2(-(_a.z - _b.z), _a.x - _b.x), 0);
    b.scale.set(d + 0.1, b.userData.h, b.userData.w);
  }
}

// ============================================================
// 蒸汽粒子：单个自定义 shader 的 Points（世界空间模拟，自然拖在车后）
// ============================================================
const SN = 1000;
const sp = { pos: new Float32Array(SN * 3), vel: new Float32Array(SN * 3), age: new Float32Array(SN), life: new Float32Array(SN),
  s0: new Float32Array(SN), s1: new Float32Array(SN), a0: new Float32Array(SN), cur: 0, acc: 0, chuff: 0, prev: new THREE.Vector3(), hasPrev: false };
const smokeGeo = new THREE.BufferGeometry();
const aSize = new Float32Array(SN), aAlpha = new Float32Array(SN), aSeedS = new Float32Array(SN), aKind = new Float32Array(SN);
for (let i = 0; i < SN; i++) aSeedS[i] = Math.random();
smokeGeo.setAttribute('position', new THREE.BufferAttribute(sp.pos, 3).setUsage(THREE.DynamicDrawUsage));
smokeGeo.setAttribute('aSize', new THREE.BufferAttribute(aSize, 1).setUsage(THREE.DynamicDrawUsage));
smokeGeo.setAttribute('aAlpha', new THREE.BufferAttribute(aAlpha, 1).setUsage(THREE.DynamicDrawUsage));
smokeGeo.setAttribute('aSeed', new THREE.BufferAttribute(aSeedS, 1));
smokeGeo.setAttribute('aKind', new THREE.BufferAttribute(aKind, 1).setUsage(THREE.DynamicDrawUsage));
const smoke = new THREE.Points(smokeGeo, new THREE.ShaderMaterial({
  uniforms: { ...ptU, uTex: { value: puffTex }, uFog: { value: FOG_COL } },
  vertexShader: `attribute float aSize; attribute float aAlpha; attribute float aSeed; attribute float aKind;
    uniform float uScale; uniform float uMaxPt; varying float vA; varying float vSeed; varying float vKind; varying float vFog;
    void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv; float dz = -mv.z;
      gl_PointSize = aAlpha <= 0.0 ? 0.0 : clamp(aSize * uScale / max(dz, 0.1), 0.0, uMaxPt);
      vA = aAlpha * smoothstep(0.6, 4.5, dz); vSeed = aSeed; vKind = aKind; float fd = dz * 0.0011; vFog = 1.0 - exp(-fd * fd); }`,
  fragmentShader: `uniform sampler2D uTex; uniform vec3 uFog; varying float vA; varying float vSeed; varying float vKind; varying float vFog;
    void main(){ vec2 c = gl_PointCoord - 0.5; float a = vSeed * 6.2831; vec2 rc = mat2(cos(a), -sin(a), sin(a), cos(a)) * c;
      float al = texture2D(uTex, rc + 0.5).a * vA; if (al < 0.003) discard;
      float lit = 0.6 + 0.4 * clamp(-c.y * 2.0 - c.x * 0.6, -1.0, 1.0);
      vec3 col = mix(vec3(0.17, 0.19, 0.24), vec3(0.62, 0.61, 0.64), lit) + vec3(0.22, 0.10, 0.03) * clamp(-c.x * 2.0, 0.0, 1.0);
      if (vKind > 0.5) col = vec3(0.72, 0.74, 0.78) * lit;
      gl_FragColor = vec4(mix(col, uFog, vFog), al); }`,
  transparent: true, depthWrite: false, fog: false
}));
smoke.frustumCulled = false; scene.add(smoke);

function emit(p, vx, vy, vz, life, s0, s1, a0, kind) {
  const i = sp.cur; sp.cur = (sp.cur + 1) % SN;
  sp.pos[i * 3] = p.x; sp.pos[i * 3 + 1] = p.y; sp.pos[i * 3 + 2] = p.z;
  sp.vel[i * 3] = vx; sp.vel[i * 3 + 1] = vy; sp.vel[i * 3 + 2] = vz;
  sp.age[i] = 0; sp.life[i] = life; sp.s0[i] = s0; sp.s1[i] = s1; sp.a0[i] = a0; aKind[i] = kind;
}
const _ch = new THREE.Vector3(), _e = new THREE.Vector3();
function simStep(t, dt) {
  updateTrain(t);
  loco.obj.updateMatrixWorld(true);
  const th = sLocoAt(t) / R, hx = Math.cos(th) * 24, hz = -Math.sin(th) * 24;      // 列车速度向量
  loco.obj.localToWorld(_ch.set(4.45, 4.85, 0));
  if (!sp.hasPrev) { sp.prev.copy(_ch); sp.hasPrev = true; }
  sp.acc += dt * 46;                                                           // 烟囱：持续白烟
  while (sp.acc >= 1) {
    sp.acc -= 1; const k = Math.random();
    _e.lerpVectors(sp.prev, _ch, k);
    emit(_e, hx * 0.55 + (Math.random() - 0.5) * 1.2, 5.5 + Math.random() * 2.5, hz * 0.55 + (Math.random() - 0.5) * 1.2,
      5.5 + Math.random() * 2.0, 0.9 + Math.random() * 0.4, 8 + Math.random() * 5, 0.62, 0);
  }
  sp.prev.copy(_ch);
  const ch = Math.floor(sLocoAt(t) / DRV_R / (Math.PI / 2));                   // 汽缸：每 1/4 转一次短促排汽
  if (ch !== sp.chuff) {
    sp.chuff = ch; const side = (ch & 1) ? 1 : -1;
    for (let k = 0; k < 5; k++) {
      loco.obj.localToWorld(_e.set(3.9 + Math.random() * 0.3, 0.55, side * 1.35));
      const out = side * (3.5 + Math.random() * 2.5);
      emit(_e, hx * 0.8 + Math.sin(th) * out, 0.4 + Math.random() * 0.8, hz * 0.8 + Math.cos(th) * out,
        0.55 + Math.random() * 0.3, 0.3, 1.8 + Math.random(), 0.42, 1);
    }
  }
  const drag = Math.exp(-1.6 * dt);
  for (let i = 0; i < SN; i++) {
    if (sp.life[i] <= 0) { aAlpha[i] = 0; continue; }
    sp.age[i] += dt; const x = sp.age[i] / sp.life[i];
    if (x >= 1) { sp.life[i] = 0; aAlpha[i] = 0; continue; }
    const o = i * 3;
    sp.vel[o] *= drag; sp.vel[o + 2] *= drag; sp.vel[o + 1] = sp.vel[o + 1] * drag + 0.35 * dt;
    sp.pos[o] += (sp.vel[o] + 0.6) * dt; sp.pos[o + 1] += sp.vel[o + 1] * dt; sp.pos[o + 2] += (sp.vel[o + 2] + 0.3) * dt;
    aSize[i] = sp.s0[i] + (sp.s1[i] - sp.s0[i]) * (1 - (1 - x) * (1 - x));
    aAlpha[i] = sp.a0[i] * smoother(0, 0.06, x) * Math.pow(1 - x, 1.4);
  }
}
function flushSmoke() { for (const k of ['position', 'aSize', 'aAlpha', 'aKind']) smokeGeo.attributes[k].needsUpdate = true; }
function resetSim(t) {                                                         // 预模拟 6 秒，一打开就有完整烟迹
  sp.life.fill(0); aAlpha.fill(0); sp.acc = 0; sp.hasPrev = false; sp.chuff = Math.floor(sLocoAt(t - 6) / DRV_R / (Math.PI / 2));
  const h = 1 / 30;
  for (let tau = t - 6; tau < t - 1e-6; tau += h) simStep(tau, h);
  updateTrain(t); flushSmoke();
}

// ============================================================
// 一镜到底运镜（smootherstep + 二次贝塞尔，无跳变）
// ============================================================
const A0 = V3(105, 95, 200), A1 = V3(82, 78, 168), L1 = V3(-50, -10, -120);
const C1 = arcPos(52.5, 45, 10), C2 = arcPos(52.5, 14, 2.4), J = C1.clone().add(C2).multiplyScalar(0.5), P2 = arcPos(52.5, 4.3, 2.15);
const LAT_F = -30, Y_F = 38, RAMP = 4;
function bez(p0, p1, p2, u, out) { const a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u; return out.set(p0.x * a + p1.x * b + p2.x * c, p0.y * a + p1.y * b + p2.y * c, p0.z * a + p1.z * b + p2.z * c); }
const _l2 = new THREE.Vector3(), _l3 = new THREE.Vector3();
function camScript(t, pos, look) {
  const sl = sLocoAt(t);
  if (t < 7) pos.lerpVectors(A0, A1, smoother(0, 7, t));                      // 广角远景
  else if (t < 10.6) { const u = smoother(7, 10.6, t) * 2; if (u < 1) bez(A1, C1, J, u, pos); else bez(J, C2, P2, u - 1, pos); }  // 压低 → 立柱间穿入
  else {                                                                        // 站台机位 → 出站尾随（轨道坐标系）
    const sc = 52.5 + 24 * RAMP * smootherInt((t - 13.5) / RAMP) + 24 * Math.max(0, t - 13.5 - RAMP);
    const lat = 4.3 + (1.0 - 4.3) * smoother(15, 16.4, t) + (LAT_F - 1.0) * smoother(16.6, 21.5, t);
    const y = 2.15 + (8 - 2.15) * smoother(14, 15.8, t) + (Y_F - 8) * smoother(16.6, 21.5, t);
    arcPos(sc, lat, y, pos);
  }
  arcPos(52.5 + (sl - 30 - 52.5) * 0.55, -3, 2.0, _l2);                         // 迎着来车 → 跟随掠过的车厢
  arcPos(sl + 22, -4, -12, _l3);                                               // 俯瞰机车前方
  look.copy(L1).lerp(_l2, smoother(7, 10.6, t)).lerp(_l3, smoother(14.8, 18.5, t));
  const sh = 0.045 * Math.exp(-(((t - 13.2) / 1.1) ** 2));                     // 列车掠过时的轻微震动
  pos.x += Math.sin(t * 41.0) * sh; pos.y += Math.sin(t * 53.0 + 1.0) * sh; pos.z += Math.sin(t * 37.0 + 2.0) * sh;
  return 50 + 10 * smoother(7, 11, t) - 5 * smoother(16, 21, t);
}

// ============================================================
// 后期：RenderPass → UnrealBloom → OutputPass（ACES）
// ============================================================
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.35, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ============================================================
// 交互 & 界面
// ============================================================
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance = 2; controls.maxDistance = 1500;
let auto = true;
const curLook = new THREE.Vector3();
const bAuto = document.getElementById('bAuto'), bReplay = document.getElementById('bReplay');
const capEl = document.getElementById('cap'), barEl = document.getElementById('barI'), fadeEl = document.getElementById('fade');
function setAuto(v) { auto = v; bAuto.classList.toggle('on', v); }
controls.addEventListener('start', () => { if (auto) { setAuto(false); controls.target.copy(curLook); } });
bAuto.addEventListener('click', () => setAuto(true));
let simT = 0;
bReplay.addEventListener('click', () => { simT = 0; resetSim(0); setAuto(true); });
const qt = parseFloat(new URLSearchParams(location.search).get('t'));
if (Number.isFinite(qt)) simT = ((qt % LOOP) + LOOP) % LOOP;
const PAUSED = new URLSearchParams(location.search).has('pause');   // ?pause 定格画面（调试/截图用）
resetSim(simT);

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);

const SEG = [[7, '一 · 云海远眺 · 星轨大弯'], [15, '二 · 俯冲进站 · 云海站'], [25, '三 · 出站远行 · 驶向光之尽头']];
let frameNo = 0, last = performance.now();
const STATION_C = arcPos(35, 0, 3);
function frame(now) {
  requestAnimationFrame(frame);
  const dt = PAUSED ? 0 : Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  let nt = simT + dt;
  if (nt >= LOOP) { nt -= LOOP; simT = nt; resetSim(nt); }
  else { simStep(nt, dt); simT = nt; flushSmoke(); }
  timeU.value = now / 1000;
  loco.fire.intensity = 8 + 4 * Math.sin(now * 0.023) * Math.sin(now * 0.0071) + 2 * Math.random();   // 炉火闪烁

  if (auto) {
    const fov = camScript(simT, camera.position, curLook);
    if (Math.abs(camera.fov - fov) > 1e-4) { camera.fov = fov; camera.updateProjectionMatrix(); }
    camera.lookAt(curLook);
  } else controls.update();

  sky.position.copy(camera.position);
  sea.position.x = camera.position.x; sea.position.z = camera.position.z;
  ptU.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  sortClouds();

  // 湿润站台倒影：CubeCamera 每 4 帧更新一次（更新时隐藏站台本身）
  if (frameNo++ % 4 === 0 && camera.position.distanceTo(STATION_C) < 160) {
    for (const m of hideOnCube) m.visible = false;
    smoke.visible = clouds.visible = false;                                   // 粒子不进反射探针（省性能，也避免点精灵在立方体面上的异常值）
    cubeCam.update(renderer, scene);
    for (const m of hideOnCube) m.visible = true;
    smoke.visible = clouds.visible = true;
  }
  composer.render();

  // 界面
  if (auto) { const seg = SEG.find(s => simT < s[0]) || SEG[2]; capEl.textContent = seg[1]; }
  else capEl.textContent = '自由视角 · 点「自动运镜」返回脚本镜头';
  barEl.style.width = (simT / LOOP * 100).toFixed(2) + '%';
  fadeEl.style.opacity = Math.max(0, 1 - simT / 0.7, (simT - (LOOP - 0.7)) / 0.7).toFixed(3);   // 循环衔接黑场
}
requestAnimationFrame(frame);
</script>
<script src="../prompt-panel.js" data-id="sky-arc-train-kiro-opus"></script>
