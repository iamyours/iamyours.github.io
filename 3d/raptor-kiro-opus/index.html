<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 常量与工具 ================= */
const V3 = THREE.Vector3;
const Y_AXIS = new V3(0, 1, 0);
const GIMBAL_Y = 2.92;      // 万向节中心高度
const TEX_H = 2.2;          // 喷管贴图 v 坐标对应的高度范围
const GROUND_Y = -2.4;
const ACT_ANGLES = [Math.PI / 3, Math.PI * 2 / 3]; // 两个作动器的方位角（相差 60°，避开涡轮泵）

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261021);

/* ================= 渲染器 / 场景 / 相机 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0xffffff, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  // 程序化室内环境，用于金属反射
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  pmrem.dispose();
}

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 100);
const TARGET = new V3(0, 1.0, 0);
const camDist = () => (window.innerWidth / window.innerHeight < 0.75 ? 10 : 6.8);
camera.position.copy(new V3(0.62, 0.28, 0.73).normalize().multiplyScalar(camDist())).add(TARGET);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minDistance = 2.2;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.93;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.update();

// 灯光：柔和天光 + 主光（投影）+ 冷色轮廓光
scene.add(new THREE.HemisphereLight(0xffffff, 0xdde2e8, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(2.6, 8, 3.6);
key.target.position.set(0, 0.8, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3.2, right: 3.2, top: 3.6, bottom: -3.6, near: 1, far: 25 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xdfe8ff, 1.3);
rim.position.set(-5, 3, -4);
scene.add(rim);

// 地面：阴影接收 + 柔和圆形托盘 + 刻线环
{
  const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.13 }));
  shadowPlane.rotation.x = -Math.PI / 2;
  shadowPlane.position.y = GROUND_Y;
  shadowPlane.receiveShadow = true;
  scene.add(shadowPlane);

  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(140,150,165,0.28)');
  grd.addColorStop(0.6, 'rgba(160,170,182,0.12)');
  grd.addColorStop(1, 'rgba(180,188,198,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  const discTex = new THREE.CanvasTexture(cv); discTex.colorSpace = THREE.SRGBColorSpace;
  const disc = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), new THREE.MeshBasicMaterial({ map: discTex, transparent: true, depthWrite: false }));
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = GROUND_Y + 0.002;
  scene.add(disc);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xc3c9d1, transparent: true, opacity: 0.7, depthWrite: false });
  [1.6, 2.4].forEach(r => {
    const ring = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.008, 160), ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = GROUND_Y + 0.004;
    scene.add(ring);
  });
}

/* ================= 程序化贴图 ================= */
// 拉丝金属粗糙度贴图
function makeBrushedTex() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#9a9a9a'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1400; i++) {
    const v = Math.floor(120 + rand() * 80);
    g.fillStyle = `rgba(${v},${v},${v},0.35)`;
    g.fillRect(rand() * 256, rand() * 256, 20 + rand() * 120, 1);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 2);
  return t;
}

// 喷管：再生冷却通道颜色 / 法线 / 内壁发光贴图（v = 高度 / TEX_H，flipY 关闭）
const NOZ_W = 1920, CHANNELS = 240;
function makeNozzleMaps() {
  const W = NOZ_W, H = 1024, sw = W / CHANNELS;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, H);
  // 行 0 = 喷管出口，行 H = 顶部；喉部附近呈现高温回火色
  [[0, '#74777c'], [0.25, '#80838a'], [0.5, '#8b8a88'], [0.56, '#94846f'], [0.62, '#8a6c58'],
   [0.66, '#6c5d78'], [0.7, '#5a5c86'], [0.74, '#7f6b5a'], [0.8, '#9f9a93'], [1, '#b1afab']]
    .forEach(([s, col]) => grad.addColorStop(s, col));
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  for (let i = 0; i < CHANNELS; i++) {
    const x = i * sw;
    g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(x + 2, 0, sw * 0.35, H);
    g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(x, 0, 1, H);
  }
  for (let i = 0; i < 2600; i++) {
    const dark = rand() < 0.55;
    g.fillStyle = `rgba(${dark ? '40,30,22' : '255,244,228'},${(rand() * 0.06).toFixed(3)})`;
    g.fillRect(rand() * W, rand() * H, 2 + rand() * 34, 1 + rand() * 7);
  }
  // 环形焊缝
  [0.5 / TEX_H, 1.18 / TEX_H].forEach(s => { g.fillStyle = 'rgba(30,30,36,0.35)'; g.fillRect(0, s * H - 3, W, 6); });
  const map = new THREE.CanvasTexture(c);
  map.colorSpace = THREE.SRGBColorSpace; map.flipY = false;
  map.wrapS = THREE.RepeatWrapping;
  map.anisotropy = renderer.capabilities.getMaxAnisotropy();

  // 法线贴图：沿圆周方向的凸起冷却管
  const nc = document.createElement('canvas'); nc.width = W; nc.height = 4;
  const ng = nc.getContext('2d');
  const img = ng.createImageData(W, 4);
  for (let x = 0; x < W; x++) {
    const ph = (x % sw) / sw * Math.PI * 2;
    const nx = Math.sin(ph) * 0.9, nz = 1, l = Math.hypot(nx, nz);
    const r = (nx / l * 0.5 + 0.5) * 255, b = (nz / l * 0.5 + 0.5) * 255;
    for (let y = 0; y < 4; y++) {
      const k = (y * W + x) * 4;
      img.data[k] = r; img.data[k + 1] = 128; img.data[k + 2] = b; img.data[k + 3] = 255;
    }
  }
  ng.putImageData(img, 0, 0);
  const nmap = new THREE.CanvasTexture(nc);
  nmap.flipY = false; nmap.wrapS = THREE.RepeatWrapping;

  // 内壁炽热发光（喉部最亮）
  const ec = document.createElement('canvas'); ec.width = 8; ec.height = 512;
  const eg = ec.getContext('2d');
  const eGrad = eg.createLinearGradient(0, 0, 0, 512);
  [[0, '#1a0500'], [0.35, '#3a0e00'], [0.55, '#a03000'], [0.68, '#ffb070'], [0.72, '#ffe0b0'],
   [0.86, '#ff9040'], [1, '#ff7a28']].forEach(([s, col]) => eGrad.addColorStop(s, col));
  eg.fillStyle = eGrad; eg.fillRect(0, 0, 8, 512);
  const emap = new THREE.CanvasTexture(ec);
  emap.colorSpace = THREE.SRGBColorSpace; emap.flipY = false;
  return { map, nmap, emap };
}

// 喷注器面板：同轴喷注单元阵列
function makeInjectorFaceTex() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  const g = cv.getContext('2d');
  g.fillStyle = '#3b3936'; g.fillRect(0, 0, 512, 512);
  for (let k = 0; k <= 6; k++) {
    const r = k * 37;
    const n = k === 0 ? 1 : Math.round(2 * Math.PI * r / 31);
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2 + k * 0.3;
      const x = 256 + Math.cos(a) * r, y = 256 + Math.sin(a) * r;
      g.fillStyle = '#7d766d'; g.beginPath(); g.arc(x, y, 11, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#18171a'; g.beginPath(); g.arc(x, y, 6.5, 0, Math.PI * 2); g.fill();
    }
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ================= 材质 ================= */
const brushed = makeBrushedTex();
const std = p => new THREE.MeshStandardMaterial(p);
const M = {
  steel: std({ color: 0xc8ccd2, metalness: 1, roughness: 0.55, roughnessMap: brushed }),
  darkSteel: std({ color: 0x6d727a, metalness: 0.95, roughness: 0.7, roughnessMap: brushed }),
  inconel: std({ color: 0xa39d94, metalness: 1, roughness: 0.75, roughnessMap: brushed }),
  alu: std({ color: 0xe4e7eb, metalness: 0.85, roughness: 0.45, roughnessMap: brushed }),
  black: std({ color: 0x24262b, metalness: 0.3, roughness: 0.6 }),
  bolt: std({ color: 0x8e939a, metalness: 1, roughness: 0.35 }),
  rod: std({ color: 0xf0f2f5, metalness: 1, roughness: 0.12 }),
  orange: std({ color: 0xe8681c, metalness: 0.1, roughness: 0.55 }),
  cable: std({ color: 0x2b2d31, metalness: 0, roughness: 0.85 }),
  gold: std({ color: 0xd9a441, metalness: 1, roughness: 0.3 }),
  loxTag: std({ color: 0x2f74d6, metalness: 0.2, roughness: 0.45 }),
  ch4Tag: std({ color: 0xe0902c, metalness: 0.2, roughness: 0.45 }),
};
const nozMaps = makeNozzleMaps();
const nozzleMat = std({
  map: nozMaps.map, normalMap: nozMaps.nmap, normalScale: new THREE.Vector2(0.9, 0.9),
  metalness: 0.85, roughness: 0.5, side: THREE.DoubleSide,
});
const innerMat = std({
  color: 0x4a3328, metalness: 0.7, roughness: 0.55, side: THREE.DoubleSide,
  emissive: 0xffffff, emissiveMap: nozMaps.emap, emissiveIntensity: 0,
});
const injFaceMat = std({ map: makeInjectorFaceTex(), metalness: 0.6, roughness: 0.6, emissive: 0xff7a30, emissiveIntensity: 0 });

/* ================= 建模辅助 ================= */
function add(parent, geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
const parts = [];
function makePart(parent, name, desc, off = [0, 0, 0]) {
  const g = new THREE.Group();
  g.userData.info = { name, desc };
  g.userData.off = new V3(...off);
  parent.add(g);
  parts.push(g);
  return g;
}
function basisOf(n) {
  const a = Math.abs(n.y) < 0.9 ? Y_AXIS : new V3(1, 0, 0);
  const u = new V3().crossVectors(a, n).normalize();
  const v = new V3().crossVectors(n, u).normalize();
  return { u, v };
}

// 螺栓：按部件收集，最后合并为 InstancedMesh
const boltGeo = new THREE.CylinderGeometry(0.0085, 0.0085, 0.014, 6);
const boltBuckets = new Map();
function addBolts(part, center, normal, radius, count, lift = 0) {
  const n = normal.clone().normalize();
  const { u, v } = basisOf(n);
  const q = new THREE.Quaternion().setFromUnitVectors(Y_AXIS, n);
  const one = new V3(1, 1, 1);
  if (!boltBuckets.has(part)) boltBuckets.set(part, []);
  const arr = boltBuckets.get(part);
  for (let i = 0; i < count; i++) {
    const a = i / count * Math.PI * 2;
    const p = center.clone()
      .addScaledVector(u, Math.cos(a) * radius).addScaledVector(v, Math.sin(a) * radius)
      .addScaledVector(n, lift);
    arr.push(new THREE.Matrix4().compose(p, q, one));
  }
}
function flushBolts() {
  for (const [part, arr] of boltBuckets) {
    const im = new THREE.InstancedMesh(boltGeo, M.bolt, arr.length);
    arr.forEach((m, i) => im.setMatrixAt(i, m));
    im.castShadow = true;
    part.add(im);
  }
}
function flange(part, pos, normal, r, t = 0.022, bolts = 8, mat = M.steel) {
  const n = normal.clone().normalize();
  const m = add(part, new THREE.CylinderGeometry(r, r, t, 28), mat, pos.x, pos.y, pos.z);
  m.quaternion.setFromUnitVectors(Y_AXIS, n);
  if (bolts) addBolts(part, pos, n, r * 0.8, bolts, t / 2 + 0.004);
  return m;
}
function pipe(part, pts, r, mat = M.steel, { f0 = true, f1 = true, seg = 64, radial = 16 } = {}) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new V3(...p)), false, 'centripetal');
  add(part, new THREE.TubeGeometry(curve, seg, r, radial, false), mat);
  if (f0) flange(part, curve.getPointAt(0.06), curve.getTangentAt(0.06), r * 1.45, r * 0.5, 8);
  if (f1) flange(part, curve.getPointAt(0.94), curve.getTangentAt(0.94), r * 1.45, r * 0.5, 8);
  return curve;
}
function cable(part, pts, r = 0.009, mat = M.cable) {
  return pipe(part, pts, r, mat, { f0: false, f1: false, seg: 48, radial: 6 });
}
// 阀门：沿管路的阀体 + 垂直方向的执行机构
function valve(part, curve, t, r, hint) {
  const p = curve.getPointAt(t), tan = curve.getTangentAt(t);
  const vb = add(part, new THREE.CylinderGeometry(r * 1.6, r * 1.6, r * 3, 24), M.darkSteel, p.x, p.y, p.z);
  vb.quaternion.setFromUnitVectors(Y_AXIS, tan);
  addBolts(part, p.clone().addScaledVector(tan, r * 1.5), tan, r * 1.3, 8, 0.004);
  const d = hint.clone().addScaledVector(tan, -hint.dot(tan)).normalize();
  const act = add(part, new THREE.BoxGeometry(r * 2.2, r * 2.6, r * 2.2), M.black,
    p.x + d.x * r * 2.6, p.y + d.y * r * 2.6, p.z + d.z * r * 2.6);
  act.quaternion.setFromUnitVectors(Y_AXIS, d);
  const cap = add(part, new THREE.CylinderGeometry(r * 0.7, r * 0.7, r * 0.5, 16), M.orange,
    p.x + d.x * r * 4.1, p.y + d.y * r * 4.1, p.z + d.z * r * 4.1);
  cap.quaternion.setFromUnitVectors(Y_AXIS, d);
}

/* ================= 喷管型面 ================= */
const RT = 0.135, RE = 0.65, RC = 0.23;      // 喉部 / 出口 / 燃烧室半径
const Y_T = 1.55, Y_C = 1.86, Y_INJ = 2.14;  // 喉部 / 收敛段起点 / 喷注面高度
function profileR(y) {
  if (y <= Y_T) {
    const s = (Y_T - y) / Y_T; // 钟形扩张段
    return RT + (RE - RT) * (0.92 * (1 - Math.pow(1 - s, 2.3)) + 0.08 * s);
  }
  if (y < Y_C) {
    const t = (y - Y_T) / (Y_C - Y_T); // 收敛段
    return RT + (RC - RT) * (1 - Math.cos(Math.PI * t)) / 2;
  }
  return RC;
}
function latheY(y0, y1, n, off) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const y = y0 + (y1 - y0) * i / n;
    pts.push(new THREE.Vector2(profileR(y) + off, y));
  }
  return pts;
}
function makeLathe(pts) {
  const geo = new THREE.LatheGeometry(pts, 160);
  const p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setY(i, p.getY(i) / TEX_H);
  return geo;
}

const _a = new V3(), _b = new V3(), _x = new V3(), _y = new V3(), _z = new V3(), _m4 = new THREE.Matrix4();
function updateActuators() {
  engine.updateMatrixWorld(true);
  for (const A of actuators) {
    engine.worldToLocal(A.top.getWorldPosition(_a));
    engine.worldToLocal(A.bot.getWorldPosition(_b));
    _y.subVectors(_a, _b);
    const L = _y.length();
    _y.divideScalar(L);
    _x.set(Math.cos(A.ang), 0, Math.sin(A.ang));
    _x.addScaledVector(_y, -_x.dot(_y)).normalize();
    _z.crossVectors(_x, _y);
    _m4.makeBasis(_x, _y, _z);
    A.g.quaternion.setFromRotationMatrix(_m4);
    A.g.position.copy(_a);
    A.rod.scale.y = Math.max(0.05, L - 0.5);
    A.eye.position.y = -L;
  }
}

/* ================= 尾焰：甲烷/液氧蓝紫色羽流 + 马赫环 ================= */
const PLUME_VS = `
  uniform float uTime;
  varying vec2 vUv; varying vec3 vN; varying vec3 vV;
  void main(){
    vUv = uv;
    vec3 p = position;
    float x = 1.0 - uv.y;
    p.xz *= 1.0 + 0.045 * sin(uTime * 55.0 + x * 18.0) * x;
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    vN = normalize(normalMatrix * normal);
    vV = normalize(-mv.xyz);
    gl_Position = projectionMatrix * mv;
  }`;
const PLUME_FS = `
  uniform float uTime, uPower, uDiam, uGain;
  uniform vec3 uColA, uColB;
  varying vec2 vUv; varying vec3 vN; varying vec3 vV;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
  }
  void main(){
    float x = 1.0 - vUv.y;
    float facing = abs(dot(normalize(vN), normalize(vV)));
    float core = pow(facing, 1.6);
    float n = noise(vec2(vUv.x * 24.0, x * 10.0 - uTime * 14.0)) * 0.6
            + noise(vec2(vUv.x * 60.0, x * 30.0 - uTime * 31.0)) * 0.4;
    float fade = smoothstep(1.0, 0.22, x) * smoothstep(0.0, 0.025, x);
    float bands = pow(0.5 + 0.5 * cos(x * uDiam * 6.2831853), 8.0) * smoothstep(0.85, 0.0, x);
    vec3 col = mix(uColA, uColB, smoothstep(0.0, 0.8, x));
    col = mix(col, vec3(1.0, 0.45, 0.75), bands * 0.6 * core);
    float a = (core * 0.55 + bands * core * 0.35) * fade * (0.7 + 0.5 * n) * uPower * uGain;
    gl_FragColor = vec4(col, clamp(a, 0.0, 0.95));
    #include <colorspace_fragment>
  }`;
const FRESNEL_VS = `
  varying vec3 vN; varying vec3 vV;
  void main(){
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vN = normalize(normalMatrix * normal);
    vV = normalize(-mv.xyz);
    gl_Position = projectionMatrix * mv;
  }`;
const DIAMOND_FS = `
  uniform float uPower; uniform vec3 uCol, uEdge;
  varying vec3 vN; varying vec3 vV;
  void main(){
    float f = abs(dot(normalize(vN), normalize(vV)));
    vec3 c = mix(uEdge, uCol, pow(f, 1.5));
    gl_FragColor = vec4(c, clamp(pow(f, 1.3) * uPower, 0.0, 0.95));
    #include <colorspace_fragment>
  }`;

    transparent: true, depthWrite: false,
  });
  const d = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), mat);
  d.renderOrder = 4;
  d.userData.k = k;
  flame.add(d);
  diamonds.push(d);
}
flame.traverse(o => { o.raycast = () => {}; });
const flameLight = new THREE.PointLight(0xb08cff, 0, 6, 2);
flameLight.position.set(0, -0.5, 0);
body.add(flameLight);
const throatLight = new THREE.PointLight(0xff8a3a, 0, 2.5, 2);
throatLight.position.set(0, 0.9, 0);
body.add(throatLight);

/* ================= 交互：按钮 / 悬停提示 ================= */
const state = { firing: false, power: 0, flash: 0, throttle: 1, explode: false, ex: 0, gimbal: false, gAmp: 0 };
const $ = id => document.getElementById(id);
const btnFire = $('btnFire'), btnExplode = $('btnExplode'), btnGimbal = $('btnGimbal'), btnRotate = $('btnRotate');
function setFire(on) {
  state.firing = on;
  if (on) state.flash = 1;
  btnFire.classList.toggle('on', on);
  btnFire.textContent = on ? '熄火' : '点火';
}
btnFire.addEventListener('click', () => setFire(!state.firing));
btnExplode.addEventListener('click', () => { state.explode = !state.explode; btnExplode.classList.toggle('on', state.explode); });
btnGimbal.addEventListener('click', () => { state.gimbal = !state.gimbal; btnGimbal.classList.toggle('on', state.gimbal); });
btnRotate.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; btnRotate.classList.toggle('on', controls.autoRotate); });
$('thr').addEventListener('input', e => {
  state.throttle = Number(e.target.value) / 100;
  $('thrV').textContent = e.target.value + '%';
});
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setFire(!state.firing); }
  else if (e.code === 'KeyE') btnExplode.click();
  else if (e.code === 'KeyG') btnGimbal.click();
});

// 悬停高亮：为部件材质生成高亮副本
const tip = $('tip');
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const hiCache = new Map();
function hiMat(m) {
  if (!hiCache.has(m)) {
    const h = m.clone();
    h.emissive = new THREE.Color(0x3d7bff);
    h.emissiveMap = null;
    h.emissiveIntensity = 0.35;
    hiCache.set(m, h);
  }
  return hiCache.get(m);
}
let hovered = null, pendingEvt = null;
function setHover(part) {
  if (part === hovered) return;
  if (hovered) hovered.traverse(o => { if (o.isMesh && o.userData.baseMat) { o.material = o.userData.baseMat; delete o.userData.baseMat; } });
  hovered = part;
  if (hovered) hovered.traverse(o => { if (o.isMesh) { o.userData.baseMat = o.material; o.material = hiMat(o.material); } });
}
function doHover(e) {
  pointer.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(parts, true)[0];
  let part = null;
  if (hit) for (let o = hit.object; o; o = o.parent) if (o.userData.info) { part = o; break; }
  setHover(part);
  if (!part) { tip.style.opacity = 0; return; }
  const { name, desc } = part.userData.info;
  tip.innerHTML = `<b>${name}</b>${desc}`;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 16, window.innerWidth - w - 8) + 'px';
  tip.style.top = Math.min(e.clientY + 16, window.innerHeight - h - 8) + 'px';
  tip.style.opacity = 1;
}
renderer.domElement.addEventListener('pointermove', e => { pendingEvt = e; });
renderer.domElement.addEventListener('pointerdown', e => { pendingEvt = e; });
renderer.domElement.addEventListener('pointerleave', () => { pendingEvt = null; setHover(null); tip.style.opacity = 0; });

/* ================= 动画循环 ================= */
const clock = new THREE.Clock();
const smooth = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * dt));
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 点火 / 熄火功率曲线
  const target = state.firing ? 0.55 + 0.45 * state.throttle : 0;
  state.power = smooth(state.power, target, state.firing ? 2.6 : 4.5, dt);
  state.flash = Math.max(0, state.flash - dt * 1.6);
  const P = state.power, flick = 1 + 0.06 * Math.sin(t * 61) * Math.sin(t * 23.7);
  const visP = Math.min(1.2, P * flick + state.flash * 0.35 * (state.firing ? 1 : 0));
  flame.visible = P > 0.003;
  if (flame.visible) {
    const len = 0.7 + 0.4 * state.throttle;
    flame.scale.set(0.92 + 0.08 * state.throttle, len * (0.75 + 0.25 * Math.min(1, P / 0.6)) * flick, 0.92 + 0.08 * state.throttle);
    plumeMats.forEach(m => { m.uniforms.uTime.value = t; m.uniforms.uPower.value = visP; });
    diamonds.forEach(d => {
      const k = d.userData.k;
      const r = (0.21 - k * 0.035) * (1 + 0.05 * Math.sin(t * 40 + k * 2));
      d.position.y = -(0.3 + k * 0.56) * 0.95;
      d.scale.set(r, 0.2 - k * 0.025, r);
      d.material.uniforms.uPower.value = visP * (1 - k * 0.2) * 0.85;
    });
  }
  innerMat.emissiveIntensity = P * 2.4 + state.flash * 0.6 * (state.firing ? 1 : 0);
  injFaceMat.emissiveIntensity = P * 1.8;
  flameLight.intensity = P * 9 * flick;
  throatLight.intensity = P * 3;

  // 推力矢量摆动
  state.gAmp = smooth(state.gAmp, state.gimbal ? 1 : 0, 2, dt);
  pivot.rotation.x = state.gAmp * 0.09 * Math.sin(t * 0.9);
  pivot.rotation.z = state.gAmp * 0.09 * Math.sin(t * 0.63 + 1.2);

  // 爆炸视图
  state.ex = smooth(state.ex, state.explode ? 1 : 0, 3.2, dt);
  const e = state.ex * state.ex * (3 - 2 * state.ex);
  for (const p of parts) p.position.copy(p.userData.off).multiplyScalar(e);

  // 点火时轻微振动
  const sh = 0.004 * P;
  engine.position.set((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);

  updateActuators();
  controls.update(dt);

  if (pendingEvt) { doHover(pendingEvt); pendingEvt = null; }
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
<script src="../prompt-panel.js" data-id="raptor-kiro-opus"></script>
</body>
