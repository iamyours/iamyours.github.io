<style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 工具函数 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (cur, target, k, dt) => lerp(cur, target, 1 - Math.exp(-k * dt));
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

function canvasTex(w, h, draw, srgb = true) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function pointInPoly(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const a = pts[i], b = pts[j];
    if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}
function distToPoly(x, y, pts) {
  let best = Infinity;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const a = pts[j], b = pts[i];
    const dx = b.x - a.x, dy = b.y - a.y;
    const t = clamp(((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy || 1), 0, 1);
    best = Math.min(best, Math.hypot(x - a.x - dx * t, y - a.y - dy * t));
  }
  return best;
}
/*
 * 平滑挤出：ExtrudeGeometry 的侧面 + 自己用 Steiner 点细分的端面，
 * 这样端面内部也有足够顶点，可以做"内收/鼓包"等曲面变形，得到圆润车身。
 */
function smoothExtrude(shape, hw, o, deform) {
  const ex = new THREE.ExtrudeGeometry(shape, {
    depth: hw * 2, steps: o.steps, bevelEnabled: true, bevelThickness: o.bt,
    bevelSize: o.bs, bevelSegments: o.bseg, curveSegments: o.curve
  });
  ex.translate(0, 0, -hw);
  const src = ex.attributes.position.array;
  const g1 = ex.groups.find(g => g.materialIndex === 1);
  const out = Array.from(src.slice(g1.start * 3, (g1.start + g1.count) * 3));
  ex.dispose();
  const contour = shape.extractPoints(o.curve).shape.slice();
  if (contour.length > 2 && contour[0].equals(contour[contour.length - 1])) contour.pop();
  const box = new THREE.Box2().setFromPoints(contour);
  const holes = [];
  for (let x = box.min.x + o.grid * 0.5; x < box.max.x; x += o.grid) {
    for (let y = box.min.y + o.grid * 0.5; y < box.max.y; y += o.grid) {
      if (pointInPoly(x, y, contour) && distToPoly(x, y, contour) > o.grid * 0.45) holes.push([new THREE.Vector2(x, y)]);
    }
  }
  const all = contour.concat(holes.map(h => h[0]));
  const faces = THREE.ShapeUtils.triangulateShape(contour, holes);
  const zc = hw + o.bt;
  for (const sgn of [1, -1]) {
    for (const f of faces) {
      let [a, b, c] = f.map(i => all[i]);
      const area = (b.x - a.x) * (c.y - a.y) - (c.x - a.x) * (b.y - a.y);
      if ((area > 0) !== (sgn > 0)) [b, c] = [c, b];
      out.push(a.x, a.y, zc * sgn, b.x, b.y, zc * sgn, c.x, c.y, zc * sgn);
    }
  }
  const v = new THREE.Vector3();
  for (let i = 0; i < out.length; i += 3) {
    deform(v.set(out[i], out[i + 1], out[i + 2]), zc);
    out[i] = v.x; out[i + 1] = v.y; out[i + 2] = v.z;
  }
  let geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(out, 3));
  geo = mergeVertices(geo, 1e-4);
  geo.computeVertexNormals();
  return geo;
}
// 圆柱连接两点（单位圆柱几何体，沿 y 轴长度 1）
const UNIT_CYL = new THREE.CylinderGeometry(1, 1, 1, 10);
const _up = V3(0, 1, 0), _dv = new THREE.Vector3();
function setBetween(mesh, a, b, r) {
  _dv.subVectors(b, a);
  const len = _dv.length() || 1e-4;
  mesh.position.addVectors(a, b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(_up, _dv.multiplyScalar(1 / len));
  mesh.scale.set(r, len, r);
}

/* ================= 渲染器 / 场景 / 相机 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.id = 'c';
document.body.prepend(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.className = 'labels';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const DAY_BG = new THREE.Color(0xe7e4df), NIGHT_BG = new THREE.Color(0x0b0e15);
scene.background = DAY_BG.clone();
scene.fog = new THREE.Fog(DAY_BG.getHex(), 13, 32);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(6.2, 2.6, 6.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 1.2;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0.55, 0);
controls.autoRotateSpeed = 0.8;

const hemi = new THREE.HemisphereLight(0xffffff, 0xb5aea4, 0.7);
scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xffffff, 2.3);
keyLight.position.set(4, 8, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
Object.assign(keyLight.shadow.camera, { left: -4.5, right: 4.5, top: 4.5, bottom: -4.5, near: 1, far: 20 });
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xffe6cc, 0.9);
rimLight.position.set(-6, 3, -4);
scene.add(rimLight);

/* ================= 地面（展台） ================= */
const floorTex = canvasTex(512, 512, (g, w) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, w);
  g.fillStyle = 'rgba(0,0,0,0.035)';
  for (let i = 0; i < w; i += 32) { g.fillRect(i, 0, 1, w); g.fillRect(0, i, w, 1); }
  g.fillStyle = 'rgba(0,0,0,0.09)';
  for (let i = 0; i < w; i += 128) { g.fillRect(i, 0, 2, w); g.fillRect(0, i, w, 2); }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(30, 30);
const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, color: 0xdcd8d1, roughness: 0.82, metalness: 0 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
// 软接触阴影
const blobTex = canvasTex(256, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.save(); g.scale(1, h / w); g.fillRect(0, 0, w, w); g.restore();
});
const blob = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 2.8), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false }));
blob.rotation.x = -Math.PI / 2; blob.position.y = 0.003;
scene.add(blob);
const ring = new THREE.Mesh(new THREE.RingGeometry(3.3, 3.36, 96), new THREE.MeshBasicMaterial({ color: 0xd40000, transparent: true, opacity: 0.35 }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.004;
scene.add(ring);

/* ================= 材质 / 贴图 ================= */
const carbonTex = canvasTex(64, 64, (g) => {
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const on = (x + y) % 2 === 0;
    const gr = on ? g.createLinearGradient(x * 8, 0, x * 8 + 8, 0) : g.createLinearGradient(0, y * 8, 0, y * 8 + 8);
    gr.addColorStop(0, '#1a1a1d'); gr.addColorStop(0.5, '#3a3b40'); gr.addColorStop(1, '#1a1a1d');
    g.fillStyle = gr; g.fillRect(x * 8, y * 8, 8, 8);
  }
});
carbonTex.wrapS = carbonTex.wrapT = THREE.RepeatWrapping;
carbonTex.repeat.set(6, 6);
const badgeTex = canvasTex(128, 160, (g, w, h) => {
  g.fillStyle = '#ffcf00';
  g.beginPath(); g.moveTo(8, 8); g.lineTo(w - 8, 8); g.lineTo(w - 8, h * 0.62);
  g.quadraticCurveTo(w - 10, h - 20, w / 2, h - 6); g.quadraticCurveTo(10, h - 20, 8, h * 0.62); g.closePath(); g.fill();
  g.fillStyle = '#009246'; g.fillRect(8, 8, (w - 16) / 3, 12);
  g.fillStyle = '#ffffff'; g.fillRect(8 + (w - 16) / 3, 8, (w - 16) / 3, 12);
  g.fillStyle = '#ce2b37'; g.fillRect(8 + (w - 16) * 2 / 3, 8, (w - 16) / 3, 12);
  g.fillStyle = '#111'; g.font = 'bold 86px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('♞', w / 2, h * 0.55);
});
const capTex = canvasTex(128, 128, (g, w) => {

/* ================= 车身（中置发动机跑车造型） ================= */
const WR = 0.34;                 // 车轮半径
const AXF = 1.40, AXR = -1.42;   // 前后轴位置
const HW = 0.86, BT = 0.07;      // 车身半宽 / 倒角
function sideF(x, y) {
  let f = 1;
  f -= sstep(0.6, 1.05, y) * 0.17;
  f -= (1 - sstep(0.18, 0.42, y)) * 0.05;
  f -= Math.pow(sstep(1.75, 2.42, x), 1.5) * 0.22;
  f -= sstep(-1.95, -2.42, x) * 0.07;
  const hip = Math.exp(-((x - AXF) ** 2) / 0.22) * 0.035 + Math.exp(-((x - AXR) ** 2) / 0.3) * 0.055;
  f += hip * sstep(0.3, 0.6, y) * (1 - sstep(0.8, 1.0, y));
  f -= Math.exp(-((x + 0.1) ** 2) / 0.35) * 0.02 * sstep(0.3, 0.5, y) * (1 - sstep(0.7, 0.85, y));
  return f;
}
function bodyDeform(v, zc) {
  const nz = clamp(v.z / zc, -1, 1);
  const crown = 0.05 * (1 - nz * nz) * sstep(0.45, 0.65, v.y) * (1 - 0.6 * Math.exp(-((v.x - 1.5) ** 2) / 0.3));
  const hump = (0.045 * Math.exp(-((v.x - AXF) ** 2) / 0.1) + 0.03 * Math.exp(-((v.x - AXR) ** 2) / 0.15))
    * sstep(0.4, 0.9, Math.abs(nz)) * sstep(0.6, 0.75, v.y);
  const f = sideF(v.x, v.y);
  v.set(v.x, v.y + crown + hump, v.z * f);
}
const BODY_ZC = HW + BT;
// 车身侧面上某点 (x,y) 的真实位置（用于车门、进气口贴合）
function sidePoint(x, y, side, off = 0) {
  const v = V3(x, y, side * BODY_ZC);
  bodyDeform(v, BODY_ZC);
  v.z += side * off;
  return v;
}

const DOOR = { xf: v => 0.74 - 0.1 * (1 - v), xr: v => -0.52 + 0.12 * (1 - v), y0: 0.3, y1: 0.82 };
function doorSurface(side, off, grow, nu = 22, nv = 10) {
  const pos = [], idx = [];
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
    const u = i / nu, v = j / nv;
    const x = lerp(DOOR.xf(v) + grow, DOOR.xr(v) - grow, u);
    const y = lerp(DOOR.y0 - grow, DOOR.y1 + grow, v);
    const p = sidePoint(x, y, side, off);
    pos.push(p.x, p.y, p.z);
  }
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1;
    if (side > 0) idx.push(a, c, b, b, c, d); else idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function gearGeo(r, teeth, th) {
  const s = new THREE.Shape();
  const n = teeth * 4;

    const a = i / n * Math.PI * 2;
    const rr = (i % 4 === 1 || i % 4 === 2) ? r : r * 0.86;
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;

}

let downXY = null;
renderer.domElement.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downXY) return;
  const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
  downXY = null;
  if (moved > 6) return;
  ndc.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  for (const h of hits) {
    let o = h.object, vis = true;
    while (o) { if (!o.visible) { vis = false; break; } o = o.parent; }
    if (!vis) continue;
    const m = h.object.material;
    if (m.transparent && m.opacity < 0.25) continue;
    select(h.object.userData.info, false);
    return;
  }
  select(null);
});

/* ---------- 相机飞行（球面插值，避免穿过车身） ---------- */
function flyTo(pos, tgt, dur = 1.5) {
  if (camera.aspect < 0.8) pos = tgt.clone().add(pos.clone().sub(tgt).multiplyScalar(1.55));
  const s0 = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  const s1 = new THREE.Spherical().setFromVector3(pos.clone().sub(tgt));
  let dth = s1.theta - s0.theta;
  while (dth > Math.PI) dth -= Math.PI * 2;
  while (dth < -Math.PI) dth += Math.PI * 2;
  fly = { s0, s1, dth, t0: controls.target.clone(), t1: tgt.clone(), t: 0, dur };
}
controls.addEventListener('start', () => { fly = null; });
const _sph = new THREE.Spherical();

/* ---------- 引擎声浪（WebAudio 合成） ---------- */
let audio = null;
function setSound(on) {
  if (on && !audio) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    o1.type = 'sawtooth'; o2.type = 'square';
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 3;
    const g = ctx.createGain(); g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(ctx.destination);
    o1.start(); o2.start();
    audio = { ctx, o1, o2, f, g };
  }
  if (audio) {
    if (on) audio.ctx.resume();
    audio.g.gain.setTargetAtTime(on ? 0.05 : 0, audio.ctx.currentTime, 0.1);
  }
}

/* ================= 动画循环 ================= */
const STROKE = [['做功', '#f97316'], ['排气', '#6b7280'], ['进气', '#3b82f6'], ['压缩', '#16a34a']];
const STROKE_E = [new THREE.Color(0xff6a00), new THREE.Color(0x3a3d42), new THREE.Color(0x1d5cff), new THREE.Color(0x13a84a)];
const allMats = new Set();
scene.traverse(o => { if (o.isMesh && o.material.envMapIntensity !== undefined) allMats.add(o.material); });
const floorDay = new THREE.Color(0xdcd8d1), floorNight = new THREE.Color(0x262a31);
const clock = new THREE.Clock();
let frame = 0, lastNight = -1;
const steerAngles = [0, 0, 0];

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;
  const ms = state.slowmo ? 0.22 : 1; // 机械动画时间缩放
  simTime += dt * ms;
  frame++;

  // ---- 平滑过渡 ----
  A.xray = damp(A.xray, state.xray ? 1 : 0, 5, dt);
  A.air = damp(A.air, state.airflow ? 1 : 0, 4, dt);
  A.spoiler = damp(A.spoiler, state.spoiler || speed > 200 ? 1 : 0, 3, dt);
  A.doors = damp(A.doors, state.doors ? 1 : 0, 2.6, dt);
  A.lights = damp(A.lights, state.lights ? 1 : 0, 6, dt);
  A.night = damp(A.night, state.night ? 1 : 0, 3, dt);
  A.explode = damp(A.explode, state.explode, A.explode > 1.05 ? 1.6 : 3, dt);
  A.cut = damp(A.cut, state.cutaway ? 1 : 0, 5, dt);

  // ---- 车速 / 挡位 / 转速 ----
  let target = state.targetSpeed;
  if (brakePhase === 1) { target = 200; if (speed >= 195) brakePhase = 2; }
  if (brakePhase === 2) target = 0;
  const rate = brakePhase === 2 ? 115 : brakePhase === 1 ? 140 : (target > speed ? 60 : 45);
  speed = target > speed ? Math.min(target, speed + rate * dt) : Math.max(target, speed - rate * dt);
  const braking = brakePhase === 2 || target < speed - 3;
  if (brakePhase === 2 && speed <= 0.05) { brakePhase = 0; state.targetSpeed = 0; syncUI(); }
  A.brake = damp(A.brake, braking ? 1 : 0, 8, dt);
  gear = speed < 0.5 ? 0 : GEAR_TOP.findIndex(t => speed <= t) + 1;
  const rpmTarget = gear === 0 ? 1000 : Math.max(1400, 1000 + 7000 * speed / GEAR_TOP[gear - 1]);
  rpm = damp(rpm, rpmTarget + Math.sin(time * 23) * 15, 6, dt);

  // ---- 发动机 ----
  const omega = rpm / 60 * Math.PI * 2 * 0.05;
  crankAngle += omega * dt * ms;
  crank.rotation.x = crankAngle;
  ENG.banks.forEach((B, bi) => {
    B.cyl.forEach((c, i) => {
      const rel = crankAngle + PIN[i] - B.beta;
      const sr = Math.sin(rel), s = CR * Math.cos(rel) + Math.sqrt(ROD * ROD - CR * CR * sr * sr);
      c.piston.position.set(c.x, s, 0);
      setBetween(c.rod, _a.set(c.x, CR * Math.cos(rel), CR * sr), _b.set(c.x, s - 0.012, 0), 0.011);
      let cyc = (rel + FIRE[i]) % (Math.PI * 4); if (cyc < 0) cyc += Math.PI * 4;
      const st = Math.floor(cyc / Math.PI);
      c.chMat.emissive.copy(STROKE_E[st]);
      c.chMat.emissiveIntensity = st === 0 ? 0.6 + 3 * Math.exp(-(cyc % Math.PI) * 2.5) : 0.6;
      if (frame % 4 === 0) {
        const cell = strokeCells[i * 2 + bi];
        cell.textContent = `${bi ? 'B' : 'A'}${i + 1} ${STROKE[st][0]}`;
        cell.style.background = STROKE[st][1];
      }
    });
  });
  for (const t of ENG.turbos) t.rotation.z += dt * ms * (8 + rpm * 0.006);
  for (const p of ENG.cutParts) p.visible = A.cut < 0.5;
  ENG.sleeveMat.opacity = lerp(0.32, 0.12, A.cut);
  exMat.emissiveIntensity = clamp((rpm - 3500) / 4500, 0, 1) * 0.7;

  // ---- 变速箱 ----
  GB.inShaft.rotation.x = crankAngle;
  GB.clutch.rotation.x = crankAngle;
  GB.outGears.forEach((o, k) => { o.g.rotation.x = -crankAngle * o.ratio; });
  GB.gearMats.forEach((m, k) => {
    if (selected === 'gearbox') return;
    const on = gear === k + 1;
    m.emissive.setHex(on ? 0xffb000 : 0x000000);
    m.emissiveIntensity = on ? 0.7 + 0.3 * Math.sin(time * 6) : 0;
  });

  // ---- 车轮 / 转向 / 悬挂 ----
  const vVis = speed / 3.6 * 0.12;
  wheelAngle -= vVis / WR * dt * ms;
  floorTex.offset.x += vVis * dt * ms / 2;
  if (state.steerAuto) { state.steer = Math.sin(time * 0.8) * 0.9; $('sSteer').value = state.steer.toFixed(2); }
  A.steer = damp(A.steer, state.steer, 8, dt);
  const base = -A.steer * 0.55;
  if (Math.abs(base) > 1e-3) {
    const L = AXF - AXR, T = 1.56, R = L / Math.tan(Math.abs(base));
    const inner = Math.atan(L / (R - T / 2)) * Math.sign(base), outer = Math.atan(L / (R + T / 2)) * Math.sign(base);
    // base < 0 为右转：右侧（+z）是内侧轮
    steerAngles[0] = base < 0 ? outer : inner;
    steerAngles[1] = base < 0 ? inner : outer;
  } else { steerAngles[0] = steerAngles[1] = 0; }
  steerAngles[2] = A.steer;
  $('vSteer').textContent = Math.round(base * 180 / Math.PI) + '°';
  steeringWheel.children[0].rotation.z = A.steer * 3.3;
  corners.forEach((c, i) => {
    c.spin.rotation.z = wheelAngle;
    if (c.front) c.steer.rotation.y = steerAngles[c.side > 0 ? 1 : 0];
    const bt = state.bump ? 0.055 * Math.sin(simTime * 7 + i * 1.7 + (c.front ? 0 : 1.2)) * Math.max(0, Math.sin(simTime * 2.3 + i)) : 0;
    c.bumpY = damp(c.bumpY, bt, 12, dt);
    c.bump.position.y = c.bumpY;
  });

  // ---- 爆炸视图 ----
  const e = Math.max(0, A.explode);
  for (const x of explodables) x.obj.position.copy(x.base).addScaledVector(x.off, e);
  car.position.y = 0.35 * Math.min(e, 1.2);
  car.rotation.z = -0.018 * A.brake * (speed > 1 ? 1 : 0);
  updateSuspension(steerAngles, e, wheelAngle);
  blob.material.opacity = 1 - clamp(e, 0, 1) * 0.6;
  $('vExplode').textContent = Math.round(clamp(A.explode, 0, 1) * 100) + '%';

  // ---- 车门 / 尾翼 ----
  const dO = ease(clamp(A.doors, 0, 1));
  for (const d of doors) {
    d.pivot.quaternion.setFromAxisAngle(V3(1, 0, 0), d.side * 0.5 * dO)
      .multiply(_q.setFromAxisAngle(V3(0, 0, 1), -1.05 * dO));
  }
  wing.position.y = 0.2 * A.spoiler;
  wing.rotation.z = -0.2 * A.spoiler;

  // ---- 透视 ----
  for (const x of xrayMats) {
    const t = x.baseT || A.xray > 0.01;
    if (t !== x.m.transparent) { x.m.transparent = t; x.m.needsUpdate = true; }
    x.m.opacity = lerp(x.base, x.min, A.xray);
    x.m.depthWrite = !t || (x.baseT ? false : A.xray < 0.01);
  }
  const edges = bodyGroup.userData.edges;
  edges.visible = A.xray > 0.02;
  edges.material.opacity = A.xray * 0.45;

  // ---- 灯光 / 夜间 ----
  const brakeL = A.brake * (speed > 0.5 || brakePhase ? 1 : 0);
  lightParts.headMat.emissiveIntensity = 0.15 + A.lights * 4;
  lightParts.drlMat.emissiveIntensity = 0.6 + A.lights * 2;
  lightParts.tailMat.emissiveIntensity = 0.2 + A.lights * 1.6 + brakeL * 3;
  lightParts.glows.forEach(g => { g.material.opacity = g.userData.tail ? clamp(A.lights * 0.6 + brakeL, 0, 1) * 0.9 : A.lights * 0.95; });
  lightParts.spots.forEach(s => { s.intensity = A.lights * 60; });
  if (Math.abs(A.night - lastNight) > 0.002) {
    lastNight = A.night;
    scene.background.copy(DAY_BG).lerp(NIGHT_BG, A.night);
    scene.fog.color.copy(scene.background);
    hemi.intensity = lerp(0.7, 0.06, A.night);
    keyLight.intensity = lerp(2.3, 0.12, A.night);
    rimLight.intensity = lerp(0.9, 0.35, A.night);
    rimLight.color.setHex(A.night > 0.5 ? 0x7fa2ff : 0xffe6cc);
    floorMat.color.copy(floorDay).lerp(floorNight, A.night);
    ring.material.opacity = lerp(0.35, 0.6, A.night);
    for (const m of allMats) m.envMapIntensity = (m.userData.envBase ??= m.envMapIntensity) * lerp(1, 0.18, A.night);
  }

  // ---- 制动热量 ----
  heat = clamp(heat + (braking && speed > 2 ? dt * 0.55 : -dt * 0.12), 0, 1);
  discMat.emissive.setHex(0xff3300);
  discMat.emissiveIntensity = heat * heat * 2.5;

  // ---- 空气动力 ----
  updateFlow(dt * ms, A.air * (1 - clamp(e * 3, 0, 1)), speed);
  const df = (speed / 340) ** 2;
  arrows.forEach((a, i) => {
    a.visible = A.air > 0.3 && speed > 5 && e < 0.05;
    const len = 0.15 + df * (i ? 1.3 : 0.9) * (1 + 0.4 * A.spoiler * i);
    a.position.y = 1.35 + len + (i ? 0.1 : 0);
    a.setLength(len, 0.14, 0.09);
  });

  // ---- 选中高亮脉冲 ----
  if (selected && infoMats.has(selected)) {
    const k = 0.35 + 0.3 * Math.sin(time * 5);
    for (const m of infoMats.get(selected)) { if (m.emissive) { m.emissive.copy(HL); m.emissiveIntensity = k; } }
  }

  // ---- 声音 ----
  if (audio && state.sound) {
    const f = rpm / 60 * 4;
    audio.o1.frequency.setTargetAtTime(f, audio.ctx.currentTime, 0.05);
    audio.o2.frequency.setTargetAtTime(f / 2, audio.ctx.currentTime, 0.05);
    audio.f.frequency.setTargetAtTime(300 + rpm * 0.28, audio.ctx.currentTime, 0.05);
    audio.g.gain.setTargetAtTime(0.035 + rpm / 8000 * 0.05, audio.ctx.currentTime, 0.1);
  }

  // ---- HUD ----
  if (frame % 3 === 0) {
    $('hSpeed').textContent = Math.round(speed);
    $('hGear').textContent = gear === 0 ? 'N' : gear;
    $('hRpm').textContent = Math.round(rpm / 10) * 10;
    $('hRpmBar').style.width = (rpm / 8500 * 100).toFixed(1) + '%';
  }

  // ---- 相机 ----
  if (fly) {
    fly.t += dt;
    const k = ease(Math.min(1, fly.t / fly.dur));
    controls.target.lerpVectors(fly.t0, fly.t1, k);
    _sph.set(lerp(fly.s0.radius, fly.s1.radius, k), lerp(fly.s0.phi, fly.s1.phi, k), fly.s0.theta + fly.dth * k);
    camera.position.setFromSpherical(_sph).add(controls.target);
    if (k >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

applyStep(0);
state.explode = 0;
animate();

</script>
<script src="../prompt-panel.js" data-id="lego-ferrari-kiro-opus"></script>
