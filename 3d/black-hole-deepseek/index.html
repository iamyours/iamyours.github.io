<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>卡冈图雅 · 黑洞引力透镜可视化</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:#efe6d8;
    -webkit-tap-highlight-color:transparent;
  }

  #back-btn{
    position:fixed;top:18px;left:18px;z-index:30;
    padding:8px 16px;border-radius:999px;
    background:rgba(245,238,225,.14);
    border:1px solid rgba(245,238,225,.30);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    color:#f5eee2;font-size:13px;line-height:1.2;text-decoration:none;
    letter-spacing:.02em;
    transition:background .22s ease, border-color .22s ease, transform .22s ease;
  }
  #back-btn:hover{background:rgba(245,238,225,.28);border-color:rgba(245,238,225,.55);transform:translateY(-1px);}

  #panel{
    position:fixed;top:18px;right:18px;z-index:30;
    width:238px;padding:14px 16px 15px;
    border-radius:15px;
    background:rgba(12,10,17,.60);
    border:1px solid rgba(255,214,170,.16);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 10px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,235,210,.07);
    font-size:12px;user-select:none;
  }
  #panel .p-title{
    font-size:11px;letter-spacing:.28em;color:rgba(255,214,170,.85);
    margin-bottom:12px;font-weight:600;text-indent:.28em;
  }
  .row{margin-bottom:11px;}
  .row:last-child{margin-bottom:0;}
  .lab{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:5px;color:rgba(232,222,208,.82);font-size:11.5px;letter-spacing:.03em;
  }
  .val{color:#ffb877;font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:.02em;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:3px;border-radius:3px;outline:none;cursor:pointer;
    background:linear-gradient(90deg, rgba(255,150,60,.85), rgba(255,220,170,.22));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:13px;height:13px;border-radius:50%;
    background:#ffcf9a;border:none;
    box-shadow:0 0 8px rgba(255,170,90,.85), 0 0 0 3px rgba(255,170,90,.14);
    transition:transform .15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18);}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;border:none;background:#ffcf9a;
    box-shadow:0 0 8px rgba(255,170,90,.85);
  }
  input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,220,170,.25);}

  .switch{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding-top:2px;}
  .switch span{color:rgba(232,222,208,.82);font-size:11.5px;letter-spacing:.03em;}
  .sw{
    position:relative;width:36px;height:19px;border-radius:999px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.16);
    transition:background .22s ease, border-color .22s ease;
  }
  .sw::after{
    content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
    background:#cfc4b4;transition:transform .22s ease, background .22s ease, box-shadow .22s ease;
  }
  .switch.on .sw{background:rgba(255,150,60,.42);border-color:rgba(255,180,110,.55);}
  .switch.on .sw::after{transform:translateX(17px);background:#ffe2bd;box-shadow:0 0 10px rgba(255,170,90,.9);}

  #hint{
    position:fixed;left:0;right:0;bottom:16px;z-index:25;
    text-align:center;padding:0 18px;
    font-size:11.5px;letter-spacing:.06em;color:rgba(226,214,198,.52);
    text-shadow:0 1px 10px rgba(0,0,0,.9);
    pointer-events:none;
  }
  #hint b{color:rgba(255,186,120,.85);font-weight:500;}

  @media (max-width:640px){
    #panel{width:186px;padding:11px 12px 12px;top:12px;right:12px;border-radius:13px;}
    #panel .p-title{font-size:10px;margin-bottom:9px;letter-spacing:.22em;}
    .lab{font-size:10.5px;} .val{font-size:10px;}
    .row{margin-bottom:8px;}
    #back-btn{top:12px;left:12px;padding:7px 13px;font-size:12px;}
    #hint{font-size:10px;bottom:10px;letter-spacing:.03em;}
    .switch span{font-size:10.5px;}
  }
</style>
</head>
<body>

<a id="back-btn" href="../">← 返回 3D 作品</a>

<div id="panel">
  <div class="p-title">观 测 控 制</div>

  <div class="row">
    <div class="lab"><span>黑洞质量</span><span class="val" id="v-mass">1.00</span></div>
    <input type="range" id="s-mass" min="0.40" max="2.20" step="0.01" value="1.00">
  </div>

  <div class="row">
    <div class="lab"><span>吸积盘亮度</span><span class="val" id="v-bright">1.00</span></div>
    <input type="range" id="s-bright" min="0.15" max="3.00" step="0.01" value="1.00">
  </div>

  <div class="row">
    <div class="lab"><span>旋转速度</span><span class="val" id="v-speed">1.00</span></div>
    <input type="range" id="s-speed" min="0.00" max="3.00" step="0.01" value="1.00">
  </div>

  <div class="row">
    <div class="lab"><span>粒子数量</span><span class="val" id="v-parts">6000</span></div>
    <input type="range" id="s-parts" min="1000" max="15000" step="500" value="6000">
  </div>

  <div class="row">
    <div class="switch on" id="sw-lens">
      <span>透镜效果</span>
      <div class="sw"></div>
    </div>
  </div>
</div>

<div id="hint">正在观测：史瓦西黑洞 · 事件视界阴影 · 引力透镜强度 <b id="h-strength">0%</b> · 视距 <b id="h-dist">0</b> rₛ · 吸积盘近侧受多普勒增亮</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* =========================================================
   0. 全局参数
   ========================================================= */
const params = {
  mass: 1.00,
  brightness: 1.00,
  speed: 1.00,
  particles: 6000,
  lens: true
};

const BH_RADIUS = 1.0;
const DISK_INNER = 1.45;
const DISK_OUTER = 5.60;

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.style.cssText = 'display:block;position:fixed;inset:0;width:100%;height:100%;';
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  55, window.innerWidth / window.innerHeight, 0.05, 4000
);
camera.position.set(0, 2.45, 9.40);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.8;
controls.enablePan = false;
controls.minDistance = 2.6;
controls.maxDistance = 40.0;
controls.minPolarAngle = 0.10;
controls.maxPolarAngle = Math.PI - 0.10;
controls.target.set(0, 0, 0);

/* =========================================================
   2. 程序化星空 + 银河背景（大球体，背面渲染）
   ========================================================= */
const skyMaterial = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {},
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec3 vDir;

    float hash31(vec3 p){
      p = fract(p * vec3(0.1031, 0.1030, 0.0973));
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }

    float vnoise3(vec3 x){
      vec3 i = floor(x);
      vec3 f = fract(x);
      f = f * f * (3.0 - 2.0 * f);
      float n000 = hash31(i + vec3(0.0, 0.0, 0.0));
      float n100 = hash31(i + vec3(1.0, 0.0, 0.0));
      float n010 = hash31(i + vec3(0.0, 1.0, 0.0));
      float n110 = hash31(i + vec3(1.0, 1.0, 0.0));
      float n001 = hash31(i + vec3(0.0, 0.0, 1.0));
      float n101 = hash31(i + vec3(1.0, 0.0, 1.0));
      float n011 = hash31(i + vec3(0.0, 1.0, 1.0));
      float n111 = hash31(i + vec3(1.0, 1.0, 1.0));
      return mix(
        mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),
        mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y),
        f.z
      );
    }

    float fbm3(vec3 p){
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 5; i++){
        v += a * vnoise3(p);
        p *= 2.03;
        a *= 0.5;
      }
      return v;
    }

    float starLayer(vec3 d, float scale, float thresh, float size){
      vec3 p = d * scale;
      vec3 id = floor(p);
      vec3 f = fract(p) - 0.5;
      float h = hash31(id);
      float on = step(thresh, h);
      vec3 j = vec3(
        hash31(id + 11.3),
        hash31(id + 27.7),
        hash31(id + 51.1)
      ) - 0.5;
      float dist = length(f - j * 0.55);
      float s = smoothstep(size, 0.0, dist);
      float bri = pow(max(h - thresh, 0.0) / max(1.0 - thresh, 0.001), 2.0);
      return on * s * (0.35 + bri);
    }

    void main(){
      vec3 d = normalize(vDir);

      /* ---- 银河带 ---- */
      vec3 galN = normalize(vec3(0.42, 0.55, -0.72));
      float lat = dot(d, galN);
      float band = exp(-(lat / 0.20) * (lat / 0.20));
      float bandCore = exp(-(lat / 0.075) * (lat / 0.075));

      float n1 = fbm3(d * 3.0 + 1.7);
      float n2 = fbm3(d * 7.0 + 5.3);
      float dust = fbm3(d * 13.0 + 21.0);

      vec3 galCol = mix(vec3(0.145, 0.130, 0.245), vec3(0.520, 0.420, 0.380), n1);
      galCol = mix(galCol, vec3(0.740, 0.610, 0.470), bandCore * 0.65);
      float dustMask = 1.0 - 0.78 * smoothstep(0.44, 0.86, dust);

      vec3 col = galCol * band * (0.30 + 0.95 * n2) * dustMask * 0.62;

      /* ---- 远处星云 ---- */
      float neb = smoothstep(0.52, 0.96, fbm3(d * 2.2 + 9.4));
      col += vec3(0.040, 0.075, 0.150) * neb;

      /* ---- 星点（三个层次） ---- */
      col += vec3(0.82, 0.88, 1.00) * starLayer(d, 260.0, 0.9860, 0.42) * 1.45;
      col += vec3(1.00, 0.94, 0.82) * starLayer(d, 110.0, 0.9760, 0.40) * 2.10;
      col += vec3(1.00, 1.00, 1.00) * starLayer(d, 520.0, 0.9930, 0.44) * 0.95;

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const sky = new THREE.Mesh(new THREE.SphereGeometry(1600, 64, 48), skyMaterial);
sky.renderOrder = -100;
scene.add(sky);

/* =========================================================
   3. 事件视界（纯黑球）
   ========================================================= */
const horizon = new THREE.Mesh(
  new THREE.SphereGeometry(BH_RADIUS, 64, 48),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
horizon.renderOrder = 1;
scene.add(horizon);

/* =========================================================
   4. 吸积盘
   ========================================================= */
const diskGeometry = new THREE.RingGeometry(DISK_INNER, DISK_OUTER, 256, 72);
diskGeometry.rotateX(-Math.PI / 2);

const diskMaterial = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  depthTest: true,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uTime:   { value: 0.0 },
    uBright: { value: 1.0 },
    uSpeed:  { value: 1.0 },
    uInner:  { value: DISK_INNER },
    uOuter:  { value: DISK_OUTER }
  },
  vertexShader: /* glsl */`
    varying vec3 vWorld;
    varying vec3 vVel;
    varying vec2 vLocal;

    void main(){
      vLocal = position.xz;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;

      vec3 tang = normalize(vec3(position.z, 0.0, -position.x));
      vVel = normalize((modelMatrix * vec4(tang, 0.0)).xyz);

      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;

    uniform float uTime;
    uniform float uBright;
    uniform float uSpeed;
    uniform float uInner;
    uniform float uOuter;

    varying vec3 vWorld;
    varying vec3 vVel;
    varying vec2 vLocal;

    float hash21(vec2 p){
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float noise2(vec2 p){
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }

    float fbm2(vec2 p){
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 5; i++){
        v += a * noise2(p);
        p *= 2.07;
        a *= 0.5;
      }
      return v;
    }

    void main(){
      float r = length(vLocal);
      float t = clamp((r - uInner) / (uOuter - uInner), 0.0, 1.0);

      /* --- 开普勒差速旋转：内圈快，外圈慢 --- */
      float omega = uSpeed * 3.0 / pow(max(r, 0.60), 1.5);
      float a = omega * uTime;
      float ca = cos(a);
      float sa = sin(a);
      vec2 rp = mat2(ca, -sa, sa, ca) * vLocal;

      /* --- 湍流 --- */
      float n1 = fbm2(rp * 0.55);
      float n2 = fbm2(rp * 1.90 + n1 * 1.40);
      float turb = mix(n1, n2, 0.45);
      turb = pow(clamp(turb, 0.0, 1.0), 0.90);

      /* --- 温度色阶：白热 → 橙黄 → 暗红 --- */
      vec3 cHot  = vec3(1.00, 0.97, 0.88);
      vec3 cMid  = vec3(1.00, 0.62, 0.20);
      vec3 cCool = vec3(0.42, 0.065, 0.018);

      vec3 col = mix(cHot, cMid, smoothstep(0.0, 0.30, t));
      col = mix(col, cCool, smoothstep(0.30, 1.0, t));

      /* --- 亮度 --- */
      float radial = pow(1.0 - t, 1.70);
      float bright = uBright * (0.35 + 1.45 * radial) * (0.42 + 0.95 * turb);

      /* --- 内缘白热细线 --- */
      float innerLine = exp(-((t - 0.012) / 0.034) * ((t - 0.012) / 0.034));
      bright += innerLine * 2.40 * uBright;
      col += vec3(1.0, 0.96, 0.90) * innerLine * 0.55;

      /* --- 内外边缘渐隐 --- */
      float edge = smoothstep(0.0, 0.045, t) * smoothstep(1.0, 0.78, t);

      /* --- 相对论多普勒增亮 --- */
      vec3 viewDir = normalize(cameraPosition - vWorld);
      float dop = dot(vVel, viewDir);
      float boost = 0.28 + 1.80 * smoothstep(-1.0, 1.0, dop);

      float alpha = edge * clamp(0.32 + 0.92 * turb, 0.0, 1.0);

      gl_FragColor = vec4(col * bright * boost, alpha);
    }
  `
});

const disk = new THREE.Mesh(diskGeometry, diskMaterial);
disk.renderOrder = 2;
scene.add(disk);

/* =========================================================
   5. 环绕等离子体粒子（线段拖尾）
   ========================================================= */
const MAX_PARTICLES = 15000;

const particleGeometry = new THREE.BufferGeometry();

const pPosition = new Float32Array(MAX_PARTICLES * 2 * 3);
const pAngle    = new Float32Array(MAX_PARTICLES * 2);
const pRadius   = new Float32Array(MAX_PARTICLES * 2);
const pSpeed    = new Float32Array(MAX_PARTICLES * 2);
const pY        = new Float32Array(MAX_PARTICLES * 2);
const pEnd      = new Float32Array(MAX_PARTICLES * 2);

for (let i = 0; i < MAX_PARTICLES; i++) {
  const ang  = Math.random() * Math.PI * 2.0;
  const rad  = Math.random();
  const spd  = 0.45 + Math.random() * 1.35;
  const yy   = (Math.random() * 2.0 - 1.0) * (0.25 + Math.random() * 0.85);

  for (let k = 0; k < 2; k++) {
    const idx = i * 2 + k;
    pAngle[idx]  = ang;
    pRadius[idx] = rad;
    pSpeed[idx]  = spd;
    pY[idx]      = yy;
    pEnd[idx]    = k;   // 0 = 头部, 1 = 尾部
  }
}

particleGeometry.setAttribute('position', new THREE.BufferAttribute(pPosition, 3));
particleGeometry.setAttribute('aAngle',   new THREE.BufferAttribute(pAngle, 1));
particleGeometry.setAttribute('aRadius',  new THREE.BufferAttribute(pRadius, 1));
particleGeometry.setAttribute('aSpeed',   new THREE.BufferAttribute(pSpeed, 1));
particleGeometry.setAttribute('aY',       new THREE.BufferAttribute(pY, 1));
particleGeometry.setAttribute('aEnd',     new THREE.BufferAttribute(pEnd, 1));
particleGeometry.setDrawRange(0, params.particles * 2);

const particleMaterial = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  depthTest: true,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uTime:  { value: 0.0 },
    uSpeed: { value: 1.0 },
    uInner: { value: 1.05 },
    uOuter: { value: 7.20 }
  },
  vertexShader: /* glsl */`
    precision highp float;

    uniform float uTime;
    uniform float uSpeed;
    uniform float uInner;
    uniform float uOuter;

    attribute float aAngle;
    attribute float aRadius;
    attribute float aSpeed;
    attribute float aY;
    attribute float aEnd;

    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      float t = uTime * (0.35 + uSpeed * 0.85);

      /* 尾部相对头部的时间偏移，形成拖尾 */
      float tt = t - aEnd * 0.16;

      /* 半径持续向内漂移，用 fract 循环 */
      float phase = fract(aRadius + tt * 0.048 * (0.45 + aSpeed * 0.9));
      float rad = mix(uOuter, uInner, phase);

      /* 开普勒角速度 */
      float angVel = 1.70 / pow(rad * 0.85 + 0.55, 1.5);
      float ang = aAngle + tt * angVel * (0.6 + aSpeed * 0.9) * 2.2;

      /* 越靠近黑洞，垂直高度被压扁 */
      float y = aY * (rad * 0.085 + 0.02) * (1.0 - 0.75 * phase);

      vec3 pos = vec3(cos(ang) * rad, y, sin(ang) * rad);
      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mv;

      /* 颜色：内侧炽白，外侧暗橙 */
      float heat = 1.0 - smoothstep(uInner, uOuter, rad);
      vec3 warm = vec3(1.00, 0.30, 0.055);
      vec3 hot  = vec3(1.00, 0.93, 0.78);
      vCol = mix(warm, hot, heat * heat);

      /* 亮度：头部亮、尾部暗，内圈更亮 */
      float headFade = 1.0 - aEnd * 0.80;
      float radialFade = 0.20 + 0.80 * heat;
      vAlpha = headFade * radialFade * 0.55;
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      gl_FragColor = vec4(vCol, vAlpha);
    }
  `
});

const particles = new THREE.LineSegments(particleGeometry, particleMaterial);
particles.renderOrder = 3;
scene.add(particles);

/* =========================================================
   6. 后处理：引力透镜 Pass
   ========================================================= */
const LensShader = {
  uniforms: {
    tDiffuse:  { value: null },
    uCenter:   { value: new THREE.Vector2(0.5, 0.5) },
    uAspect:   { value: 1.0 },
    uShadow:   { value: 0.10 },
    uStrength: { value: 0.12 },
    uEnabled:  { value: 1.0 },
    uTime:     { value: 0.0 }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;

    uniform sampler2D tDiffuse;
    uniform vec2  uCenter;
    uniform float uAspect;
    uniform float uShadow;
    uniform float uStrength;
    uniform float uEnabled;
    uniform float uTime;

    varying vec2 vUv;

    void main(){
      vec2 p = (vUv - uCenter) * vec2(uAspect, 1.0);
      float r = length(p);
      float rs = max(r, 1e-4);
      vec2 dir = p / rs;

      vec3 col;

      if (uEnabled > 0.5) {

        /* ---- 点质量引力透镜映射：r' = r + θE² / r ---- */
        float srcR = r + (uStrength * uStrength) / rs;
        vec2 srcP = dir * srcR;
        vec2 suv = uCenter + srcP / vec2(uAspect, 1.0);

        vec2 cuv = clamp(suv, vec2(0.0008), vec2(0.9992));
        col = texture2D(tDiffuse, cuv).rgb;

        /* 采样越界时淡出到黑，避免硬边 */
        vec2 ov = abs(suv - 0.5) - 0.5;
        float outOfView = max(max(ov.x, ov.y), 0.0);
        col *= 1.0 - smoothstep(0.0, 0.05, outOfView);

        /* ---- 事件视界阴影 ---- */
        float mask = smoothstep(uShadow * 0.965, uShadow * 1.035, r);
        col *= mask;

        /* ---- 光子环（细亮锐边） ---- */
        float ringR = uShadow * 1.005;
        float ringW = max(uShadow * 0.032, 0.0009);
        float dr = (r - ringR) / ringW;
        float ring = exp(-dr * dr);
        col += vec3(1.00, 0.965, 0.90) * ring * 2.60;

        /* ---- 光子环外辉光 ---- */
        float dw = (r - ringR) / (ringW * 5.5);
        float halo = exp(-dw * dw);
        col += vec3(1.00, 0.74, 0.44) * halo * 0.24;

        /* ---- 外圈极淡的暖色晕染 ---- */
        float dh = (r - ringR * 1.55) / (ringR * 1.10);
        col += vec3(0.85, 0.42, 0.16) * exp(-dh * dh) * 0.055;

      } else {
        col = texture2D(tDiffuse, vUv).rgb;
      }

      gl_FragColor = vec4(col, 1.0);
    }
  `
};

/* =========================================================
   7. 后处理：最终调色 Pass（ACES + sRGB + 暗角 + 颗粒）
   ========================================================= */
const FinalShader = {
  uniforms: {
    tDiffuse:    { value: null },
    uExposure:   { value: 1.0 },
    uResolution: { value: new THREE.Vector2(1, 1) },
    uTime:       { value: 0.0 }
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;

    uniform sampler2D tDiffuse;
    uniform float uExposure;
    uniform vec2  uResolution;
    uniform float uTime;

    varying vec2 vUv;

    vec3 acesFilm(vec3 x){
      const float a = 2.51;
      const float b = 0.03;
      const float c = 2.43;
      const float d = 0.59;
      const float e = 0.14;
      return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
    }

    float hash12(vec2 p){
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }

    void main(){
      vec3 col = texture2D(tDiffuse, vUv).rgb * uExposure;

      /* ACES 电影感色调映射 */
      col = acesFilm(col);

      /* 暗部稍偏冷，模拟冷调胶片 */
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col, col * vec3(0.93, 0.97, 1.08), (1.0 - smoothstep(0.0, 0.45, lum)) * 0.30);

      /* 暗角 */
      vec2 q = vUv - 0.5;
      float vig = 1.0 - dot(q, q) * 0.62;
      col *= clamp(vig, 0.0, 1.0);

      /* 轻微胶片颗粒 */
      float g = hash12(vUv * uResolution + fract(uTime) * 137.0) - 0.5;
      col += g * 0.011;

      /* sRGB 编码 */
      col = pow(max(col, 0.0), vec3(1.0 / 2.2));

      gl_FragColor = vec4(col, 1.0);
    }
  `
};

/* =========================================================
   8. 组装 Composer
   ========================================================= */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
composer.setSize(window.innerWidth, window.innerHeight);

composer.addPass(new RenderPass(scene, camera));

const lensPass = new ShaderPass(LensShader);
composer.addPass(lensPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.92,   // strength
  0.78,   // radius
  0.55    // threshold
);
composer.addPass(bloomPass);

const finalPass = new ShaderPass(FinalShader);
finalPass.renderToScreen = true;
finalPass.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
composer.addPass(finalPass);

/* =========================================================
   9. UI 绑定
   ========================================================= */
const $ = (id) => document.getElementById(id);

const vMass   = $('v-mass');
const vBright = $('v-bright');
const vSpeed  = $('v-speed');
const vParts  = $('v-parts');
const swLens  = $('sw-lens');

const sMass   = $('s-mass');
const sBright = $('s-bright');
const sSpeed  = $('s-speed');
const sParts  = $('s-parts');

sMass.addEventListener('input', () => {
  params.mass = parseFloat(sMass.value);
  vMass.textContent = params.mass.toFixed(2);
});

sBright.addEventListener('input', () => {
  params.brightness = parseFloat(sBright.value);
  vBright.textContent = params.brightness.toFixed(2);
  diskMaterial.uniforms.uBright.value = params.brightness;
});

sSpeed.addEventListener('input', () => {
  params.speed = parseFloat(sSpeed.value);
  vSpeed.textContent = params.speed.toFixed(2);
  diskMaterial.uniforms.uSpeed.value = params.speed;
  particleMaterial.uniforms.uSpeed.value = params.speed;
});

sParts.addEventListener('input', () => {
  params.particles = parseInt(sParts.value, 10);
  vParts.textContent = String(params.particles);
  particleGeometry.setDrawRange(0, params.particles * 2);
});

swLens.addEventListener('click', () => {
  params.lens = !params.lens;
  swLens.classList.toggle('on', params.lens);
  lensPass.uniforms.uEnabled.value = params.lens ? 1.0 : 0.0;
});

/* =========================================================
   10. 尺寸自适应
   ========================================================= */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);

  composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  composer.setSize(w, h);

  bloomPass.setSize(w, h);

  lensPass.uniforms.uAspect.value = camera.aspect;
  finalPass.uniforms.uResolution.value.set(w, h);
}
window.addEventListener('resize', onResize, { passive: true });
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));

/* =========================================================
   11. 动画主循环
   ========================================================= */
const clock = new THREE.Clock();
let elapsed = 0;
let hudFrame = 0;

const hintStrength = $('h-strength');
const hintDist = $('h-dist');

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  controls.update();
  controls.target.set(0, 0, 0);

  /* ---- 吸积盘 & 粒子 ---- */
  diskMaterial.uniforms.uTime.value = elapsed;
  particleMaterial.uniforms.uTime.value = elapsed;

  /* ---- 引力透镜参数（随视距变化） ---- */
  const fovRad = THREE.MathUtils.degToRad(camera.fov);
  const dist = Math.max(camera.position.length(), 0.6);

  // 黑洞在屏幕上的角半径，换算到 p 坐标（半高 = 0.5）
  const shadowP = 0.5 * ((BH_RADIUS * 1.06) / dist) / Math.tan(fovRad * 0.5);

  // 爱因斯坦半径，随质量放大
  const strength = Math.min(shadowP * 1.18 * params.mass, 0.44);

  lensPass.uniforms.uShadow.value = shadowP;
  lensPass.uniforms.uStrength.value = strength;
  lensPass.uniforms.uAspect.value = camera.aspect;
  lensPass.uniforms.uTime.value = elapsed;

  finalPass.uniforms.uTime.value = elapsed;

  /* ---- HUD 节流更新 ---- */
  hudFrame++;
  if (hudFrame % 8 === 0) {
    const pct = Math.round(Math.min(strength / 0.30, 1.0) * 100);
    hintStrength.textContent = pct + '%';
    hintDist.textContent = (dist / BH_RADIUS).toFixed(1);
  }

  composer.render();
}

/* 初始 uniform 同步 */
diskMaterial.uniforms.uBright.value = params.brightness;
diskMaterial.uniforms.uSpeed.value = params.speed;
particleMaterial.uniforms.uSpeed.value = params.speed;
lensPass.uniforms.uAspect.value = camera.aspect;

animate();
</script>
