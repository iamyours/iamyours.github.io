<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>北京天坛祈年殿 - 3D 交互式程序化场景</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #7bb5e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      color: #2b2b2b;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 左上角返回按钮：半透明奶油色圆角小按钮样式 */
    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(255, 248, 232, 0.88);
      color: #2c251d;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 999px;
      border: 1px solid rgba(255, 252, 244, 0.95);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .back-btn:hover {
      background: rgba(255, 252, 242, 0.98);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
    }

    /* 右上角 HUD 建筑简介卡片 */
    .hud-header {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-title-card {
      background: rgba(255, 253, 248, 0.92);
      border: 1px solid rgba(212, 180, 131, 0.45);
      border-radius: 14px;
      padding: 12px 18px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: right;
      box-shadow: 0 10px 30px rgba(44, 32, 18, 0.12);
      max-width: 320px;
    }

    .hud-title-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef7ee;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
      transition: all 0.3s ease;
    }

    .status-badge.exploded {
      background: #fff3e0;
      color: #e65100;
      border-color: #ffe0b2;
    }

    .status-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .hud-main-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #1a202c;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
    }

    .hud-subtitle {
      font-size: 11.5px;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .hud-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
    }

    .hud-tag {
      font-size: 10px;
      background: rgba(15, 63, 136, 0.08);
      color: #0f3f88;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    /* 底部中央主控制台 */
    .control-dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      max-width: 95vw;
    }

    .dock-main-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 252, 246, 0.92);
      border: 1px solid rgba(212, 180, 131, 0.45);
      border-radius: 40px;
      padding: 6px 10px;
      box-shadow: 0 12px 36px rgba(44, 32, 18, 0.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
      white-space: nowrap;
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #134e9e 0%, #0d3873 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 63, 136, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #185eb8 0%, #10438a 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(15, 63, 136, 0.45);
    }

    .btn-primary.active {
      background: linear-gradient(135deg, #c43818 0%, #9e270d 100%);
      box-shadow: 0 4px 14px rgba(196, 56, 24, 0.4);
    }

    .btn-sub {
      background: rgba(245, 240, 230, 0.8);
      color: #3e3223;
      border: 1px solid rgba(200, 180, 155, 0.4);
    }

    .btn-sub:hover {
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-1px);
    }

    .btn-sub.active {
      background: #e9f2ff;
      color: #0f3f88;
      border-color: #adc8ff;
      font-weight: 700;
    }

    .view-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 253, 248, 0.88);
      border: 1px solid rgba(212, 180, 131, 0.35);
      border-radius: 999px;
      padding: 4px 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .view-btn {
      white-space: nowrap;
      flex-shrink: 0;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      color: #554433;
      background: transparent;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-btn:hover {
      background: rgba(0, 0, 0, 0.06);
      color: #111;
    }

    .view-btn.active {
      background: #0f3f88;
      color: #ffffff;
      font-weight: 600;
    }

    /* 结构分解层次实时浮标提示 */
    .explosion-guide {
      position: fixed;
      left: 18px;
      bottom: 24px;
      z-index: 25;
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid rgba(212, 180, 131, 0.45);
      border-radius: 12px;
      padding: 12px 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(44, 32, 18, 0.1);
      font-size: 11.5px;
      line-height: 1.6;
      max-width: 270px;
      color: #4b3d2c;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    .explosion-guide.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .explosion-guide-title {
      font-weight: 700;
      color: #0f3f88;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .layer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 3px 0;
    }

    .layer-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .hud-title-card {
        padding: 8px 12px;
        max-width: 240px;
      }
      .hud-main-title {
        font-size: 15px;
      }
      .hud-subtitle {
        display: none;
      }
      .control-dock {
        bottom: 76px;
      }
      .btn {
        padding: 7px 12px;
        font-size: 12px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .view-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        max-width: 95vw;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .view-row::-webkit-scrollbar {
        display: none;
      }
      .view-btn {
        padding: 4px 8px;
        font-size: 11px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .explosion-guide {
        display: none;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 左上角返回按钮 -->
  <a class="back-btn" href="../">← 返回 3D 作品</a>

  <!-- 3D 渲染画布容器 -->
  <div id="webgl-container"></div>

  <!-- 右上角 HUD 建筑简介卡片 -->
  <div class="hud-header">
    <div class="hud-title-card">
      <div class="hud-title-row">
        <span class="status-badge" id="statusBadge">
          <span class="status-badge-dot"></span>
          <span id="statusText">建筑完整呈现</span>
        </span>
        <div class="hud-main-title">北京天坛 · 祈年殿</div>
      </div>
      <div class="hud-subtitle">明清两代帝王孟春祈谷大典之圜丘天坛核心 · 纯代码程序化营造</div>
      <div class="hud-tags">
        <span class="hud-tag">三重孔雀蓝飞檐</span>
        <span class="hud-tag">鎏金铜葫芦宝顶</span>
        <span class="hud-tag">28宿四季时辰柱</span>
        <span class="hud-tag">三层汉白玉圆坛</span>
      </div>
    </div>
  </div>

  <!-- 分解层级浮标向导（分解时显示） -->
  <div class="explosion-guide" id="explosionGuide">
    <div class="explosion-guide-title">
      <span>🏛️ 营造法式层级解构</span>
    </div>
    <div class="layer-item"><span class="layer-dot" style="background: #f1c40f;"></span>1. 鎏金宝顶（皇权与天意相通）</div>
    <div class="layer-item"><span class="layer-dot" style="background: #104285;"></span>2. 三重曲线微翘深蓝琉璃瓦圆顶</div>
    <div class="layer-item"><span class="layer-dot" style="background: #27ae60;"></span>3. 金龙和玺彩绘额枋与环形斗拱群</div>
    <div class="layer-item"><span class="layer-dot" style="background: #a92424;"></span>4. 殿身外檐三交六椀菱花隔扇门窗</div>
    <div class="layer-item"><span class="layer-dot" style="background: #c0392b;"></span>5. 28根内外三圈金丝楠木朱漆柱</div>
    <div class="layer-item"><span class="layer-dot" style="background: #ecf0f1;"></span>6. 三层汉白玉台基、云龙丹陛与雕栏</div>
  </div>

  <!-- 底部交互控制坞 -->
  <div class="control-dock">
    <div class="dock-main-row">
      <button class="btn btn-primary" id="btnExplode">
        <span id="btnExplodeIcon">💥</span>
        <span id="btnExplodeText">层次分解 / 爆炸透视</span>
      </button>
      <button class="btn btn-sub" id="btnOrbit">
        <span>🔄</span>
        <span id="btnOrbitText">自动环绕: 关</span>
      </button>
    </div>
    <div class="view-row">
      <button class="view-btn active" data-view="overview">恢弘全景</button>
      <button class="view-btn" data-view="heroic">仰视雄姿</button>
      <button class="view-btn" data-view="eaves">飞檐斗拱</button>
      <button class="view-btn" data-view="danbi">南向丹陛</button>
      <button class="view-btn" data-view="topdown">俯瞰圆坛</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ==========================================================================
       1. 全局配置与渲染器初始化
       ========================================================================== */
    const container = document.getElementById('webgl-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x6aa6e2);
    scene.fog = new THREE.FogExp2(0x9bc2e8, 0.005);

    const BASE_FOV = 40;
    const camera = new THREE.PerspectiveCamera(BASE_FOV, width / height, 0.5, 600);
    // 初始位置：南偏东经典 3/4 恢弘仰角机位，纵览三层圆台与飞檐宝顶
    camera.position.set(0, 18, 58);

    function updateCameraFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      if (camera.aspect < 1) {
        // 竖屏（宽高比 < 1）根据 aspect 动态增大 FOV，保证主体及三层圆台完整可见
        camera.fov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(BASE_FOV / 2)) / (camera.aspect * 0.92)) * (180 / Math.PI);
      } else {
        camera.fov = BASE_FOV;
      }
      camera.updateProjectionMatrix();
    }
    updateCameraFraming();

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 12.0, 0);
    controls.maxPolarAngle = Math.PI / 2 - 0.03;
    controls.minDistance = 6;
    controls.maxDistance = 150;

    /* ==========================================================================
       2. 高保真程序化 Canvas 纹理生成器
       ========================================================================== */

    // 2.1 天坛专属深孔雀宝蓝琉璃瓦与金黄剪边纹理
    function createRoofTileTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext('2d');

      // 皇家深沉宝石孔雀蓝底色
      const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
      grad.addColorStop(0, '#051838');
      grad.addColorStop(0.3, '#092552');
      grad.addColorStop(0.65, '#0e3a78');
      grad.addColorStop(1, '#071f45');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      // 64 垄精致密实瓦垄（阴阳瓦、筒瓦弧光与板瓦深沟）
      const numTiles = 48;
      const tileWidth = 1024 / numTiles;

      for (let i = 0; i < numTiles; i++) {
        const x = i * tileWidth;
        const tileGrad = ctx.createLinearGradient(x, 0, x + tileWidth, 0);
        tileGrad.addColorStop(0.0, 'rgba(2, 8, 20, 0.9)');
        tileGrad.addColorStop(0.25, 'rgba(10, 42, 92, 0.25)');
        tileGrad.addColorStop(0.5, 'rgba(120, 185, 255, 0.42)'); // 釉彩高光反射
        tileGrad.addColorStop(0.75, 'rgba(10, 42, 92, 0.25)');
        tileGrad.addColorStop(1.0, 'rgba(2, 8, 20, 0.9)');

        ctx.fillStyle = tileGrad;
        ctx.fillRect(x, 0, tileWidth, 1024);

        // 瓦垄接缝深线
        ctx.fillStyle = 'rgba(1, 4, 12, 0.95)';
        ctx.fillRect(x, 0, 2.0, 1024);
      }

      // 横向压瓦叠缝线
      ctx.strokeStyle = 'rgba(1, 6, 18, 0.5)';
      ctx.lineWidth = 1.2;
      for (let y = 0; y < 1024; y += 24) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(1024, y);
        ctx.stroke();

        ctx.fillStyle = 'rgba(110, 175, 255, 0.10)';
        ctx.fillRect(0, y + 1, 1024, 1);
      }

      // 檐口金黄色琉璃剪边与瓦当滴水装饰带 (最下部 140px)
      const goldY = 884;
      const goldGrad = ctx.createLinearGradient(0, goldY, 0, 1024);
      goldGrad.addColorStop(0, '#be8507');
      goldGrad.addColorStop(0.25, '#ffcf2e');
      goldGrad.addColorStop(0.7, '#d6970e');
      goldGrad.addColorStop(1, '#784e02');
      ctx.fillStyle = goldGrad;
      ctx.fillRect(0, goldY, 1024, 140);

      // 瓦当圆形团龙金印与倒三角滴水
      ctx.fillStyle = '#ffea78';
      ctx.strokeStyle = '#5a3702';
      ctx.lineWidth = 2.0;
      for (let i = 0; i < numTiles; i++) {
        const cx = i * tileWidth + tileWidth / 2;
        const cy = goldY + 70;
        ctx.beginPath();
        ctx.arc(cx, cy, tileWidth * 0.42, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#8a5c05';
        ctx.beginPath();
        ctx.arc(cx, cy, tileWidth * 0.18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffea78';

        // 尖角滴水牙
        ctx.beginPath();
        ctx.moveTo(cx - 6, 1024);
        ctx.lineTo(cx + 6, 1024);
        ctx.lineTo(cx, 1010);
        ctx.closePath();
        ctx.fillStyle = '#5a3702';
        ctx.fill();
        ctx.fillStyle = '#ffea78';
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    // 2.2 瓦垄法线/凹凸贴图
    function createRoofBumpMap() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, 512, 512);

      const num = 24;
      const w = 512 / num;
      for (let i = 0; i < num; i++) {
        const x = i * w;
        const g = ctx.createLinearGradient(x, 0, x + w, 0);
        g.addColorStop(0.0, '#222222');
        g.addColorStop(0.5, '#ffffff');
        g.addColorStop(1.0, '#222222');
        ctx.fillStyle = g;
        ctx.fillRect(x, 0, w, 512);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    // 2.3 清工部最高规制「金龙和玺彩画」额枋贴图
    function createHexiPaintTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 256;
      const ctx = c.getContext('2d');

      // 赭红底色
      ctx.fillStyle = '#7a1414';
      ctx.fillRect(0, 0, 1024, 256);

      // 上下双重青绿叠晕带
      const greenGrad = ctx.createLinearGradient(0, 0, 0, 256);
      greenGrad.addColorStop(0.0, '#0a3820');
      greenGrad.addColorStop(0.12, '#187042');
      greenGrad.addColorStop(0.22, '#0c3866');
      greenGrad.addColorStop(0.78, '#0c3866');
      greenGrad.addColorStop(0.88, '#187042');
      greenGrad.addColorStop(1.0, '#0a3820');
      ctx.fillStyle = greenGrad;
      ctx.fillRect(0, 16, 1024, 224);

      // 沥粉贴金箍头线条
      ctx.fillStyle = '#ffcf26';
      ctx.fillRect(0, 14, 1024, 5);
      ctx.fillRect(0, 237, 1024, 5);
      ctx.fillRect(0, 44, 1024, 3);
      ctx.fillRect(0, 207, 1024, 3);

      // 祥云金龙团花图案
      ctx.strokeStyle = '#ffe46b';
      ctx.lineWidth = 3.5;
      ctx.fillStyle = '#145632';

      for (let x = 0; x < 1024; x += 128) {
        ctx.beginPath();
        ctx.arc(x + 64, 128, 44, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffcf10';
        ctx.beginPath();
        ctx.arc(x + 64, 128, 24, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0c3866';
        ctx.beginPath();
        ctx.arc(x + 64, 128, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#145632';
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    // 2.4 殿身外檐隔扇门窗（三交六椀菱花格与团龙裙板）
    function createLatticeDoorTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 1024;
      const ctx = c.getContext('2d');

      // 朱砂红大漆外框
      ctx.fillStyle = '#8f1616';
      ctx.fillRect(0, 0, 512, 1024);

      // 框体金细线
      ctx.strokeStyle = '#ffc822';
      ctx.lineWidth = 4;
      ctx.strokeRect(8, 8, 496, 1008);
      ctx.strokeRect(18, 18, 476, 988);

      // 上截格心 (菱花花格透光白绢窗纱)
      const latticeH = 630;
      ctx.fillStyle = '#fbf8f0';
      ctx.fillRect(26, 26, 460, latticeH);

      // 三交六椀细红木棱与金线
      ctx.strokeStyle = '#9c1c1c';
      ctx.lineWidth = 3.2;
      const step = 26;
      for (let x = 26; x <= 486; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 26);
        ctx.lineTo(x, 26 + latticeH);
        ctx.stroke();
      }
      for (let y = 26; y <= 26 + latticeH; y += step) {
        ctx.beginPath();
        ctx.moveTo(26, y);
        ctx.lineTo(486, y);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(218, 165, 32, 0.72)';
      ctx.lineWidth = 1.8;
      for (let d = -latticeH; d <= 486 + latticeH; d += step * 1.5) {
        ctx.beginPath();
        ctx.moveTo(26, 26 + d);
        ctx.lineTo(486, 26 + d + 460);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(486, 26 + d);
        ctx.lineTo(26, 26 + d + 460);
        ctx.stroke();
      }

      // 绦环板 (中段装饰腰线)
      const midY = 26 + latticeH + 12;
      ctx.fillStyle = '#721212';
      ctx.fillRect(26, midY, 460, 72);
      ctx.strokeStyle = '#ffcf33';
      ctx.lineWidth = 3;
      ctx.strokeRect(32, midY + 6, 448, 60);

      ctx.fillStyle = '#ffcf33';
      ctx.beginPath();
      ctx.arc(256, midY + 36, 18, 0, Math.PI * 2);
      ctx.fill();

      // 下截裙板 (实木浮雕金彩框与金龙团花)
      const skirtY = midY + 86;
      const skirtH = 1024 - skirtY - 26;
      ctx.fillStyle = '#721212';
      ctx.fillRect(26, skirtY, 460, skirtH);
      ctx.strokeStyle = '#ffc822';
      ctx.lineWidth = 4;
      ctx.strokeRect(34, skirtY + 8, 444, skirtH - 16);

      // 团龙金纹
      ctx.fillStyle = '#ffc51a';
      ctx.beginPath();
      ctx.arc(256, skirtY + skirtH / 2, 60, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#721212';
      ctx.beginPath();
      ctx.arc(256, skirtY + skirtH / 2, 44, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffc51a';
      ctx.beginPath();
      ctx.arc(256, skirtY + skirtH / 2, 20, 0, Math.PI * 2);
      ctx.fill();

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    // 2.5 汉白玉大理石微纹理与柔和凹凸
    function createMarbleTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#f5f3ec';
      ctx.fillRect(0, 0, 1024, 1024);

      ctx.fillStyle = 'rgba(205, 198, 186, 0.22)';
      for (let i = 0; i < 400; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const rx = 35 + Math.random() * 85;
        const ry = 10 + Math.random() * 35;
        const rot = Math.random() * Math.PI;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const imgData = ctx.getImageData(0, 0, 1024, 1024);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const noise = (Math.random() - 0.5) * 8;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
      }
      ctx.putImageData(imgData, 0, 0);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // 2.6 祈谷坛艾叶青石庭院铺地
    function createGroundPavingTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#949b9e';
      ctx.fillRect(0, 0, 1024, 1024);

      const rows = 16;
      const cols = 16;
      const rw = 1024 / cols;
      const rh = 1024 / rows;

      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (rw / 2);
        for (let col = -1; col <= cols + 1; col++) {
          const x = col * rw + offset;
          const y = r * rh;

          const stoneLum = 142 + Math.floor((Math.sin(r * 4.3 + col * 7.1) + 1) * 16);
          ctx.fillStyle = `rgb(${stoneLum - 6}, ${stoneLum + 4}, ${stoneLum - 2})`;
          ctx.fillRect(x + 1, y + 1, rw - 2, rh - 2);

          ctx.strokeStyle = '#62686b';
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, rw, rh);
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(16, 16);
      return tex;
    }

    /* ==========================================================================
       6. 曲线轮廓旋转体屋顶生成器 (LatheGeometry 舒展微翘重檐)
       ========================================================================== */

    /**
     * 构建具有真实厚度、中国传统「反宇向阳、生起举折、微翘飞檐」曲线轮廓的实体 LatheGeometry
     */
    function createCurvedRoofGeometry(rIn, yIn, rOut, yOut, flareLift, thickness, rInnerUnderside, yInnerUnderside) {
      const points = [];
      const steps = 32;

      // 1. 上表面曲线（从上到下，由陡变缓，末端微翘）
      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        const r = rIn + (rOut - rIn) * Math.pow(u, 0.88);
        const drop = (yIn - yOut) * Math.pow(u, 1.30);
        const flare = flareLift * Math.pow(u, 3.6); // 飞檐末梢微翘扬角
        const y = yIn - drop + flare;
        points.push(new THREE.Vector2(r, y));
      }

      // 2. 檐口垂直厚度边
      const tipR = points[points.length - 1].x;
      const tipY = points[points.length - 1].y;
      points.push(new THREE.Vector2(tipR, tipY - thickness));

      // 3. 檐下望板下表面（向内收拢至支承梁）
      for (let i = steps; i >= 0; i--) {
        const u = i / steps;
        const r = rInnerUnderside + (tipR - rInnerUnderside) * u;
        const y = yInnerUnderside + (tipY - thickness - yInnerUnderside) * Math.pow(u, 1.15);
        points.push(new THREE.Vector2(r, y));
      }

      // 4. 闭合
      points.push(new THREE.Vector2(rIn, yIn));

      const latheGeo = new THREE.LatheGeometry(points, 72);
      latheGeo.computeVertexNormals();
      return latheGeo;
    }

    // 严格按照天坛祈年殿黄金营造比例配置三层屋面尺寸与出檐：
    // 6.1 下层重檐屋顶 (Lower Roof)

      13.5, 7.8,   // 檐口外挑 r, y
      0.32,        // 飞檐微翘高度
      0.20,        // 檐口厚度
      8.5, 7.9     // 檐底内收 r, y
    );
    const lowRoofMesh = new THREE.Mesh(lowRoofGeo, roofMaterial);

    lowRoofMesh.receiveShadow = true;

    // 6.4 为三重屋顶增设立体放射状屋脊瓦垄 (垂脊与檐角脊饰)
    function addRadialRidgeRibs(targetGroup, rIn, yIn, rOut, yOut, flareLift, count) {
      const ribGeo = new THREE.BoxGeometry(0.10, 0.10, 1.0);
      const ribMat = new THREE.MeshStandardMaterial({
        color: 0x092248,
        roughness: 0.28,
        metalness: 0.25
      });

      for (let i = 0; i < count; i++) {
        const theta = (i / count) * Math.PI * 2;
        const segs = 9;
        for (let s = 0; s < segs; s++) {
          const u1 = s / segs;
          const u2 = (s + 1) / segs;

          const r1 = rIn + (rOut - rIn) * Math.pow(u1, 0.88);
          const y1 = yIn - (yIn - yOut) * Math.pow(u1, 1.30) + flareLift * Math.pow(u1, 3.6) + 0.06;

          const r2 = rIn + (rOut - rIn) * Math.pow(u2, 0.88);
          const y2 = yIn - (yIn - yOut) * Math.pow(u2, 1.30) + flareLift * Math.pow(u2, 3.6) + 0.06;

          const p1 = new THREE.Vector3(Math.cos(theta) * r1, y1, Math.sin(theta) * r1);
          const p2 = new THREE.Vector3(Math.cos(theta) * r2, y2, Math.sin(theta) * r2);

          const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
          const len = p1.distanceTo(p2);

          const ribMesh = new THREE.Mesh(ribGeo, ribMat);
          ribMesh.position.copy(mid);
          ribMesh.scale.set(1, 1, len);
          ribMesh.lookAt(p2);
          ribMesh.castShadow = true;
          targetGroup.add(ribMesh);
        }
      }
    }

    addRadialRidgeRibs(groupMidRoof, 6.6, 13.0, 11.0, 11.2, 0.30, 28);

      const uvs = [];

      geos.forEach(g => {

        for (let i = 0; i < n.length; i++) norm.push(n[i]);
        for (let i = 0; i < u.length; i++) uvs.push(u[i]);
      });

      mergedGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      mergedGeo.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
      mergedGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      return mergedGeo;

        dummy.rotation.set(0, -theta + Math.PI / 2, 0);
        dummy.updateMatrix();
        instMesh.setMatrixAt(i, dummy.matrix);

      return instMesh;

        for (let i = 0; i < p.length; i++) pos.push(p[i]);
        for (let i = 0; i < n.length; i++) norm.push(n[i]);
        for (let i = 0; i < u.length; i++) uvs.push(u[i]);

    let totalPostsCount = 0;

    const gargoylesInst = new THREE.InstancedMesh(gargoyleGeo, marbleMaterial, totalPostsCount);

    gargoylesInst.castShadow = true;

    let globalPostIdx = 0;

    balustradeTiers.forEach((tier) => {

        const theta = i * stepTheta;

        const angleMod = Math.abs((theta + Math.PI / 4) % (Math.PI / 2) - Math.PI / 4);
        if (angleMod < tier.stairHalfWidthAngle) {
          dummyObj.position.set(0, -100, 0);
          dummyObj.scale.set(0, 0, 0);
          dummyObj.updateMatrix();
          postsInst.setMatrixAt(globalPostIdx, dummyObj.matrix);
          gargoylesInst.setMatrixAt(globalPostIdx, dummyObj.matrix);
          tierPanelsInst.setMatrixAt(i, dummyObj.matrix);
          globalPostIdx++;
          continue;
        }

        const px = Math.cos(theta) * tier.r;
        const pz = Math.sin(theta) * tier.r;

        dummyObj.position.set(px, tier.y, pz);
        dummyObj.rotation.set(0, -theta + Math.PI / 2, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        postsInst.setMatrixAt(globalPostIdx, dummyObj.matrix);

        dummyObj.position.set(px, tier.y, pz);
        dummyObj.updateMatrix();
        gargoylesInst.setMatrixAt(globalPostIdx, dummyObj.matrix);

        const midTheta = theta + stepTheta / 2;
        const mx = Math.cos(midTheta) * tier.r;
        const mz = Math.sin(midTheta) * tier.r;
        dummyObj.position.set(mx, tier.y, mz);
        dummyObj.rotation.set(0, -midTheta + Math.PI / 2, 0);
        dummyObj.updateMatrix();
        tierPanelsInst.setMatrixAt(i, dummyObj.matrix);

        globalPostIdx++;
      }

      tierPanelsInst.instanceMatrix.needsUpdate = true;
      groupBalustrade.add(tierPanelsInst);
    });

    postsInst.instanceMatrix.needsUpdate = true;
    gargoylesInst.instanceMatrix.needsUpdate = true;
    groupBalustrade.add(postsInst);
    groupBalustrade.add(gargoylesInst);

    /* ==========================================================================
       10. 庭院古柏生态 (天坛百年苍劲苍翠古柏)
       ========================================================================== */
    function createAncientCypress(x, z, scaleFactor) {
      const treeGroup = new THREE.Group();
      treeGroup.position.set(x, 0, z);

      const trunkMat = new THREE.MeshStandardMaterial({
        color: 0x2e2318,
        roughness: 0.94,
        metalness: 0.04
      });
      // 苍劲盘虬树干
      const trunkGeo = new THREE.CylinderGeometry(0.28 * scaleFactor, 0.55 * scaleFactor, 5.2 * scaleFactor, 8);
      const trunkMesh = new THREE.Mesh(trunkGeo, trunkMat);
      trunkMesh.position.y = 2.6 * scaleFactor;
      trunkMesh.rotation.z = (Math.random() - 0.5) * 0.18;
      trunkMesh.castShadow = true;
      treeGroup.add(trunkMesh);

      const branchGeo = new THREE.CylinderGeometry(0.14 * scaleFactor, 0.24 * scaleFactor, 2.4 * scaleFactor, 6);
      const branchMesh = new THREE.Mesh(branchGeo, trunkMat);
      branchMesh.position.set(0.55 * scaleFactor, 3.6 * scaleFactor, 0);
      branchMesh.rotation.z = -0.62;
      branchMesh.castShadow = true;
      treeGroup.add(branchMesh);

      // 云片状深松柏绿树冠簇（古典园林松柏云朵团簇感）
      const foliageMat = new THREE.MeshStandardMaterial({
        color: 0x123d20,
        roughness: 0.85,
        metalness: 0.02
      });

      const foliageClusters = [
        { y: 5.4, rx: 1.6, ry: 0.8, rz: 1.6, ox: 0, oz: 0 },
        { y: 4.5, rx: 2.1, ry: 0.9, rz: 2.0, ox: 0.3, oz: 0.2 },
        { y: 3.6, rx: 2.4, ry: 1.0, rz: 2.2, ox: -0.3, oz: -0.2 },
        { y: 3.9, rx: 1.5, ry: 0.7, rz: 1.4, ox: 1.1, oz: 0.1 }
      ];

      foliageClusters.forEach(c => {
        const sphereGeo = new THREE.SphereGeometry(1, 10, 8);
        sphereGeo.scale(c.rx * scaleFactor, c.ry * scaleFactor, c.rz * scaleFactor);
        const fMesh = new THREE.Mesh(sphereGeo, foliageMat);
        fMesh.position.set(c.ox * scaleFactor, c.y * scaleFactor, c.oz * scaleFactor);
        fMesh.castShadow = true;
        fMesh.receiveShadow = true;
        treeGroup.add(fMesh);
      });

      return treeGroup;
    }

    const treePositions = [
      [-36, -36], [36, -36], [-36, 36], [36, 36],
      [-42, -10], [42, -10], [-42, 10], [42, 10],
      [-16, -42], [16, -42], [-18, 42], [18, 42],
      [-46, -26], [46, -26], [-46, 26], [46, 26]
    ];
    treePositions.forEach(([tx, tz]) => {
      const s = 0.9 + Math.random() * 0.35;
      scene.add(createAncientCypress(tx, tz, s));
    });

    /* ==========================================================================
       11. 结构平滑分解 / 爆炸重组核心动画驱动引擎
       ========================================================================== */
    let isExploded = false;
    let explodeProgress = 0.0;

    function smoothRange(t, start, end) {
      if (t <= start) return 0;
      if (t >= end) return 1;
      const p = (t - start) / (end - start);
      return p * p * (3 - 2 * p);
    }

    /**
     * 根据当前错峰进程参数，计算并更新每个建筑子系统的空间位移与径向绽放
     */
    function updateExplosionAnimation(dt) {
      const target = isExploded ? 1.0 : 0.0;
      explodeProgress = THREE.MathUtils.damp(explodeProgress, target, 4.0, dt);

      // 1. 鎏金宝顶：垂直拔高升入顶空 (+8.0)
      const pFinial = smoothRange(explodeProgress, 0.00, 0.44);
      groupFinial.position.y = THREE.MathUtils.lerp(0, 5.6, pFinial);

      // 2. 上层攒尖圆顶：上升 (+6.2)
      const pTopRoof = smoothRange(explodeProgress, 0.08, 0.52);
      groupTopRoof.position.y = THREE.MathUtils.lerp(0, 4.3, pTopRoof);

      // 3. 上层彩绘额枋与斗拱群：上升 (+4.8)
      const pTopBeams = smoothRange(explodeProgress, 0.16, 0.60);
      groupTopBeams.position.y = THREE.MathUtils.lerp(0, 3.3, pTopBeams);

      // 4. 中层飞檐微翘圆顶：上升 (+3.5)
      const pMidRoof = smoothRange(explodeProgress, 0.24, 0.68);
      groupMidRoof.position.y = THREE.MathUtils.lerp(0, 2.4, pMidRoof);

      // 5. 中层彩绘额枋与斗拱群：上升 (+2.5)
      const pMidBeams = smoothRange(explodeProgress, 0.32, 0.74);
      groupMidBeams.position.y = THREE.MathUtils.lerp(0, 1.7, pMidBeams);

      // 6. 下层重檐飞檐：上升 (+1.6)
      const pLowRoof = smoothRange(explodeProgress, 0.40, 0.80);
      groupLowRoof.position.y = THREE.MathUtils.lerp(0, 1.1, pLowRoof);

      // 7. 下层外檐额枋与斗拱群：上升 (+0.9)
      const pLowBeams = smoothRange(explodeProgress, 0.46, 0.84);
      groupLowBeams.position.y = THREE.MathUtils.lerp(0, 0.6, pLowBeams);

      // 8. 祈年殿殿身隔扇门窗墙体：水平径向向外扩张绽开 (X/Z * 1.25) + 微升 (+0.4)
      const pWalls = smoothRange(explodeProgress, 0.52, 0.88);
      const wallScale = THREE.MathUtils.lerp(1.0, 1.25, pWalls);
      groupWalls.scale.set(wallScale, 1.0, wallScale);
      groupWalls.position.y = THREE.MathUtils.lerp(0, 0.4, pWalls);

      // 9. 柱网按层次分别展开：
      // 外圈12檐柱向外散开
      const pOuterCols = smoothRange(explodeProgress, 0.56, 0.90);
      const outerScale = THREE.MathUtils.lerp(1.0, 1.18, pOuterCols);
      groupOuterCols.scale.set(outerScale, 1.0, outerScale);
      groupOuterCols.position.y = THREE.MathUtils.lerp(0, 0.3, pOuterCols);

      // 中圈12金柱向外散开 + 拔高
      const pMidCols = smoothRange(explodeProgress, 0.60, 0.92);
      const midScale = THREE.MathUtils.lerp(1.0, 1.10, pMidCols);
      groupMidCols.scale.set(midScale, 1.0, midScale);
      groupMidCols.position.y = THREE.MathUtils.lerp(0, 0.8, pMidCols);

      // 内圈4根四季龙井大柱垂直拔升显露
      const pInnerCols = smoothRange(explodeProgress, 0.64, 0.94);
      groupInnerCols.position.y = THREE.MathUtils.lerp(0, 1.4, pInnerCols);

      // 10. 汉白玉栏杆整体径向微扩与分层上浮
      const pBalustrade = smoothRange(explodeProgress, 0.68, 0.96);
      const balScale = THREE.MathUtils.lerp(1.0, 1.06, pBalustrade);
      groupBalustrade.scale.set(balScale, 1.0, balScale);
      groupBalustrade.position.y = THREE.MathUtils.lerp(0, 0.3, pBalustrade);

      // 11. 汉白玉三层基台微调分层
      const pTerrace = smoothRange(explodeProgress, 0.72, 1.00);
      groupTerrace.position.y = THREE.MathUtils.lerp(0, -0.3, pTerrace);
    }

    /* ==========================================================================
       12. 交互控制逻辑与视角预设
       ========================================================================== */
    let autoOrbit = false;

    const cameraViews = {
      overview: { pos: new THREE.Vector3(0, 18, 58), target: new THREE.Vector3(0, 12.0, 0) },
      heroic:   { pos: new THREE.Vector3(0, 4.8, 34), target: new THREE.Vector3(0, 13.5, 0) },
      eaves:    { pos: new THREE.Vector3(14, 13.5, 14), target: new THREE.Vector3(5, 12.0, 5) },
      danbi:    { pos: new THREE.Vector3(0, 4.0, 38), target: new THREE.Vector3(0, 3.2, 21) },
      topdown:  { pos: new THREE.Vector3(0, 60, 44), target: new THREE.Vector3(0, 8.5, 0) }
    };

    let targetCamPos = cameraViews.overview.pos.clone();
    let targetCamTarget = cameraViews.overview.target.clone();
    let isTransitioningCamera = false;

    const btnExplode = document.getElementById('btnExplode');
    const btnExplodeText = document.getElementById('btnExplodeText');
    const btnExplodeIcon = document.getElementById('btnExplodeIcon');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const explosionGuide = document.getElementById('explosionGuide');

    btnExplode.addEventListener('click', () => {
      isExploded = !isExploded;
      if (isExploded) {
        btnExplode.classList.add('active');
        btnExplodeText.textContent = '重构原位 / 复原合拢';
        btnExplodeIcon.textContent = '🔄';
        statusBadge.classList.add('exploded');
        statusText.textContent = '结构层级已分解';
        explosionGuide.classList.add('visible');
      } else {
        btnExplode.classList.remove('active');
        btnExplodeText.textContent = '层次分解 / 爆炸透视';
        btnExplodeIcon.textContent = '💥';
        statusBadge.classList.remove('exploded');
        statusText.textContent = '建筑完整呈现';
        explosionGuide.classList.remove('visible');
      }
    });

    const btnOrbit = document.getElementById('btnOrbit');
    const btnOrbitText = document.getElementById('btnOrbitText');

    btnOrbit.addEventListener('click', () => {
      autoOrbit = !autoOrbit;
      controls.autoRotate = autoOrbit;
      controls.autoRotateSpeed = 1.0;
      if (autoOrbit) {
        btnOrbit.classList.add('active');
        btnOrbitText.textContent = '自动环绕: 开';
      } else {
        btnOrbit.classList.remove('active');
        btnOrbitText.textContent = '自动环绕: 关';
      }
    });

    const viewButtons = document.querySelectorAll('.view-btn');
    viewButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const viewKey = e.target.getAttribute('data-view');
        if (cameraViews[viewKey]) {
          viewButtons.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          targetCamPos.copy(cameraViews[viewKey].pos);
          targetCamTarget.copy(cameraViews[viewKey].target);
          isTransitioningCamera = true;
        }
      });
    });

    controls.addEventListener('start', () => {
      isTransitioningCamera = false;
    });

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      updateCameraFraming();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    /* ==========================================================================
       13. 动画与渲染主循环 (稳定的 60FPS 渲染管线)
       ========================================================================== */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);

      if (isTransitioningCamera) {
        camera.position.lerp(targetCamPos, 0.08);
        controls.target.lerp(targetCamTarget, 0.08);
        if (camera.position.distanceTo(targetCamPos) < 0.1) {
          isTransitioningCamera = false;
        }
      }

      updateExplosionAnimation(dt);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>

  <!-- 提示词展示组件（原样保留） -->
  <script src="../prompt-panel.js" data-id="temple"></script>
