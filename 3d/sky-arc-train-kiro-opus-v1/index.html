<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ======================= 基础工具 ======================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261023);
const rr = (a, b) => a + (b - a) * rand();
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const smoother = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); };
function makeCanvas(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTex(c, srgb = true) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* ======================= 全局常量 ======================= */
const R = 185;                    // 水平圆弧半径，圆心 (0,0,-R)
const S_MIN = -430, S_MAX = 440;  // 轨道弧长范围（C 形大弯道）
const LOOP = 25;                  // 一镜到底时长
const SPEED = 24, S_START = -250;
const sLoco = t => S_START + SPEED * t;   // 机车弧长随时间
const SUN_DIR = new THREE.Vector3(-0.82, 0.13, -0.56).normalize();
const FOG_COLOR = new THREE.Color().setRGB(0.055, 0.095, 0.2);
const FOG_DENSITY = 0.0011;

// 水平圆弧参数方程：θ = s/R，x = (R+lat)·sinθ，z = (R+lat)·cosθ - R
function arcPos(s, lat = 0, y = 0, out = new THREE.Vector3()) {
  const th = s / R, r = R + lat;
  return out.set(r * Math.sin(th), y, r * Math.cos(th) - R);
}
// 沿圆弧放置物体：局部 +x 为前进方向，局部 +z 为外侧（lat 正方向）
function place(o, s, lat = 0, y = 0) { arcPos(s, lat, y, o.position); o.rotation.set(0, s / R, 0); return o; }

// 沿圆弧扫掠截面（profile: [[lat, y], ...]）
function sweep(profile, s0, s1, segs, uvs = 0.25) {
  const np = profile.length, pos = [], uv = [], idx = [], cum = [0];
  for (let j = 1; j < np; j++) cum[j] = cum[j - 1] + Math.hypot(profile[j][0] - profile[j - 1][0], profile[j][1] - profile[j - 1][1]);
  const v = new THREE.Vector3();
  for (let i = 0; i <= segs; i++) {
    const s = s0 + (s1 - s0) * i / segs;
    for (let j = 0; j < np; j++) {
      arcPos(s, profile[j][0], profile[j][1], v);
      pos.push(v.x, v.y, v.z); uv.push(s * uvs, cum[j] * uvs);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < np - 1; j++) {
    const a = i * np + j, b = a + np;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function sweepBox(l0, l1, y0, y1, s0, s1, segs, uvs = 0.25) {
  const faces = [[[l0, y1], [l1, y1]], [[l1, y1], [l1, y0]], [[l1, y0], [l0, y0]], [[l0, y0], [l0, y1]]];
  return mergeGeometries(faces.map(f => sweep(f, s0, s1, segs, uvs)));
}

// 几何合并构建器：按材质合并静态零件，减少 draw call
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _sc = new THREE.Vector3();
class Builder {
  constructor() { this.map = new Map(); }
  add(geo, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
    _m4.compose(_p.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz)), _sc.set(sx, sy, sz));
    const g = geo.clone().applyMatrix4(_m4);
    if (!this.map.has(mat)) this.map.set(mat, []);
    this.map.get(mat).push(g);
    return this;
  }
  box(w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) { return this.add(new THREE.BoxGeometry(w, h, d), mat, x, y, z, rx, ry, rz); }
  build(parent, { cast = true, receive = false } = {}) {
    for (const [mat, geos] of this.map) {
      const mesh = new THREE.Mesh(mergeGeometries(geos, false), mat);
      mesh.castShadow = cast && !mat.transparent;
      mesh.receiveShadow = receive;
      if (mat.transparent) mesh.renderOrder = 2;
      parent.add(mesh);
    }
  }
}
const cylX = (b, r, len, mat, x, y, z, seg = 24) => b.add(new THREE.CylinderGeometry(r, r, len, seg), mat, x, y, z, 0, 0, Math.PI / 2);
// 沿 x 轴的上半圆拱（flat 为竖向压扁系数）
function archGeo(r, len, flat, seg = 24) {
  return new THREE.CylinderGeometry(r, r, len, seg, 1, true, 0, Math.PI).scale(flat, 1, 1).rotateZ(Math.PI / 2);
}

/* ======================= 渲染器 / 场景 / 相机 ======================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.78;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG_COLOR, FOG_DENSITY);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 7000);
camera.position.set(105, 95, 200);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxDistance = 1500;
controls.minDistance = 2;

/* ======================= 宇宙天幕 ======================= */
const SKY_GLSL = /* glsl */`
uniform vec3 uSunDir;
vec3 skyColor(vec3 d){
  float y = d.y;
  vec3 zen = vec3(0.002, 0.004, 0.020);
  vec3 mid = vec3(0.010, 0.026, 0.080);
  vec3 hor = vec3(0.055, 0.095, 0.200);
  float h = clamp(y, 0.0, 1.0);
  vec3 col = mix(hor, mid, smoothstep(0.0, 0.16, h));
  col = mix(col, zen, smoothstep(0.12, 0.7, h));
  float s = max(dot(d, uSunDir), 0.0);
  float band = 1.0 - smoothstep(0.0, 0.3, abs(y - uSunDir.y));
  col += vec3(1.0, 0.45, 0.18) * pow(s, 6.0) * 0.22 * band;
  col += vec3(1.0, 0.70, 0.40) * pow(s, 40.0) * 0.7;
  col += vec3(1.0, 0.90, 0.75) * pow(s, 320.0) * 3.0;
  return col;
}`;
const skyUniforms = { uSunDir: { value: SUN_DIR } };
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: SKY_GLSL + `varying vec3 vDir; void main(){ gl_FragColor = vec4(skyColor(normalize(vDir)), 1.0); }`,
  side: THREE.BackSide, depthWrite: false, fog: false
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(3000, 48, 24), skyMat);
skyDome.renderOrder = -10; skyDome.frustumCulled = false;
scene.add(skyDome);

// 星空
const stars = (() => {
  const n = 2600, pos = [], col = [];
  for (let i = 0; i < n; i++) {
    const u = rand() * 2 - 1, a = rand() * TAU, y = Math.abs(u) * 0.98 + 0.02;
    const r = Math.sqrt(1 - y * y);
    pos.push(Math.cos(a) * r * 2800, y * 2800, Math.sin(a) * r * 2800);
    const b = Math.pow(rand(), 3) * 1.4 + 0.2, warm = rand();
    col.push(b * (0.8 + warm * 0.2), b * 0.9, b * (1.0 - warm * 0.15));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({
    size: 1.7 * renderer.getPixelRatio(), sizeAttenuation: false, vertexColors: true,
    transparent: true, depthWrite: false, fog: false
  }));
  p.renderOrder = -9; p.frustumCulled = false;
  return p;
})();
scene.add(stars);

// 太阳光晕
function glowTexture(stops) {
  const c = makeCanvas(256), x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  stops.forEach(([o, s]) => g.addColorStop(o, s));
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  return canvasTex(c);
}
const glowTex = glowTexture([[0, 'rgba(255,255,255,1)'], [0.12, 'rgba(255,240,215,0.9)'], [0.35, 'rgba(255,190,120,0.3)'], [1, 'rgba(255,140,60,0)']]);
const sunCore = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color(4, 3.3, 2.5), blending: THREE.AdditiveBlending, depthWrite: false, fog: false, toneMapped: false, transparent: true }));
sunCore.scale.setScalar(520);
const sunHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color(0.9, 0.55, 0.3), blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true, opacity: 0.35 }));
sunHalo.scale.setScalar(2200);
sunCore.renderOrder = sunHalo.renderOrder = -8;
scene.add(sunCore, sunHalo);

// 土星（倾斜环状气态巨行星）
function saturnTexture() {
  const W = 1024, H = 512, c = makeCanvas(W, H), x = c.getContext('2d');
  const c1 = [232, 214, 172], c2 = [176, 140, 94], c3 = [205, 178, 130];
  for (let y = 0; y < H; y++) {
    const v = y / H;
    let n = Math.sin(v * 42) * 0.5 + Math.sin(v * 97 + 1.3) * 0.3 + Math.sin(v * 13 + 0.4) * 0.6 + (rand() - 0.5) * 0.25;
    n = clamp((n + 1.4) / 2.8, 0, 1);
    const k = Math.sin(v * 230) * 0.5 + 0.5;
    let col = c1.map((a, i) => lerp(lerp(a, c2[i], n), c3[i], k * 0.25));
    const pole = smooth(0.12, 0.0, v) + smooth(0.88, 1.0, v);
    col = col.map((a, i) => lerp(a, [120, 130, 140][i], pole * 0.6));
    x.fillStyle = `rgb(${col[0] | 0},${col[1] | 0},${col[2] | 0})`;
    x.fillRect(0, y, W, 1);
  }
  for (let i = 0; i < 80; i++) {
    x.fillStyle = `rgba(${rand() > 0.5 ? '250,236,200' : '150,115,75'},${rr(0.05, 0.15)})`;
    x.beginPath(); x.ellipse(rand() * W, rr(0.15, 0.85) * H, rr(30, 140), rr(2, 7), 0, 0, TAU); x.fill();
  }
  return canvasTex(c);
}
function ringTexture() {
  const W = 1024, c = makeCanvas(W, 4), x = c.getContext('2d');
  for (let i = 0; i < W; i++) {
    const r = i / W;
    let a = 0;
    if (r < 0.2) a = 0.18 + 0.1 * Math.sin(r * 300);
    else if (r < 0.6) a = 0.82 + 0.12 * Math.sin(r * 420);
    else if (r < 0.66) a = 0.05;
    else if (r < 0.95) a = 0.58 + 0.12 * Math.sin(r * 260);
    else a = 0.15 * (1 - (r - 0.95) / 0.05);
    a *= 0.85 + rand() * 0.15;
    const t = 200 + r * 30;
    x.fillStyle = `rgba(${t | 0},${(t * 0.88) | 0},${(t * 0.7) | 0},${clamp(a, 0, 1)})`;
    x.fillRect(i, 0, 1, 4);
  }
  return canvasTex(c);
}
const saturn = new THREE.Group();
{
  const planet = new THREE.Mesh(new THREE.SphereGeometry(190, 64, 32),
    new THREE.MeshStandardMaterial({ map: saturnTexture(), roughness: 1, metalness: 0, fog: false, emissive: 0x141a2a }));
  const RIN = 240, ROUT = 430;
  const rg = new THREE.RingGeometry(RIN, ROUT, 160, 1);
  const p = rg.attributes.position, uv = rg.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, (Math.hypot(p.getX(i), p.getY(i)) - RIN) / (ROUT - RIN), 0.5);
  const ring = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({
    map: ringTexture(), color: new THREE.Color(0.75, 0.68, 0.58), transparent: true, side: THREE.DoubleSide, depthWrite: false, fog: false
  }));
  ring.rotation.x = -Math.PI / 2;
  ring.renderOrder = -7;
  saturn.add(planet, ring);
  saturn.position.set(620, 640, -1780);
  saturn.rotation.set(0.38, 0.2, -0.45);
}
scene.add(saturn);

// 蓝灰色伴星 / 月球
function moonTexture() {
  const c = makeCanvas(512, 256), x = c.getContext('2d');
  x.fillStyle = '#7d8ea6'; x.fillRect(0, 0, 512, 256);
  for (let i = 0; i < 260; i++) {
    const r = rr(2, 26), px = rand() * 512, py = rand() * 256;
    x.fillStyle = `rgba(${rand() > 0.5 ? '40,52,72' : '190,205,225'},${rr(0.08, 0.3)})`;
    x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill();
  }
  return canvasTex(c);
}
const moon = new THREE.Mesh(new THREE.SphereGeometry(58, 48, 24),
  new THREE.MeshStandardMaterial({ map: moonTexture(), roughness: 1, fog: false, emissive: 0x0d1220 }));
moon.position.set(1020, 430, -1450);
scene.add(moon);

/* ======================= 灯光 / 环境贴图 ======================= */
const hemi = new THREE.HemisphereLight(0x6a88c8, 0x9a90b8, 1.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffd2a0, 3.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -110, right: 110, top: 110, bottom: -110, near: 1, far: 900 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.08;
sun.target.position.copy(arcPos(40, 0, 0));
sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 400);
scene.add(sun, sun.target);

{
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), skyMat));
  const floor = new THREE.Mesh(new THREE.CircleGeometry(3000, 32), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.32, 0.36, 0.55) }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -120;
  envScene.add(floor);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.02, 1, 5000).texture;
}

/* ======================= 平铺翻滚云海 ======================= */
const seaUniforms = { uSunDir: skyUniforms.uSunDir, uTime: { value: 0 }, uCam: { value: new THREE.Vector3() } };
const seaMat = new THREE.ShaderMaterial({
  uniforms: seaUniforms, fog: false,
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: SKY_GLSL + /* glsl */`
    varying vec3 vW;
    uniform float uTime; uniform vec3 uCam;
    float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
    }
    float fbm(vec2 p){
      float v = 0.0, a = 0.5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
      for (int i = 0; i < 6; i++){ v += a * noise(p); p = m * p + vec2(0.17, 0.31); a *= 0.5; }
      return v;
    }
    void main(){
      vec2 q = vW.xz * 0.0042 + vec2(uTime * 0.010, uTime * 0.004);
      float h2 = fbm(q * 3.1 + vec2(-uTime * 0.02, 0.0));
      float H  = fbm(q) * 0.75 + h2 * 0.25;
      float e = 0.02;
      float hx = fbm(q + vec2(e, 0.0)) * 0.75 + h2 * 0.25;
      float hz = fbm(q + vec2(0.0, e)) * 0.75 + h2 * 0.25;
      vec3 n = normalize(vec3((H - hx) * 18.0, 1.0, (H - hz) * 18.0));
      float b = smoothstep(0.30, 0.76, H);
      float diff = clamp(dot(n, uSunDir) * 0.6 + 0.5, 0.0, 1.0);
      vec3 col = mix(vec3(0.04, 0.06, 0.15), vec3(0.24, 0.28, 0.46), b);
      col = mix(col, vec3(0.88, 0.82, 0.80), b * b * diff);
      vec3 v = normalize(vW - uCam);
      float sc = pow(max(dot(v, uSunDir), 0.0), 5.0);
      col += vec3(1.0, 0.55, 0.25) * sc * (0.2 + 0.55 * b);
      float d = length(vW.xz - uCam.xz);
      col = mix(col, skyColor(normalize(vec3(v.x, 0.01, v.z))), smoothstep(300.0, 3600.0, d));
      gl_FragColor = vec4(col, 1.0);
    }`
});
const sea = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), seaMat);

class PuffSystem {
  constructor(max, renderOrder) {
    this.max = max; this.count = 0;
    this.px = new Float32Array(max * 3); this.sz = new Float32Array(max);
    this.al = new Float32Array(max); this.co = new Float32Array(max * 3);
    this.dist = new Float32Array(max); this.order = new Uint32Array(max);
    const g = new THREE.BufferGeometry();
    this.aPos = new THREE.BufferAttribute(new Float32Array(max * 3), 3).setUsage(THREE.DynamicDrawUsage);
    this.aSize = new THREE.BufferAttribute(new Float32Array(max), 1).setUsage(THREE.DynamicDrawUsage);
    this.aAlpha = new THREE.BufferAttribute(new Float32Array(max), 1).setUsage(THREE.DynamicDrawUsage);
    this.aColor = new THREE.BufferAttribute(new Float32Array(max * 3), 3).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position', this.aPos); g.setAttribute('aSize', this.aSize);
    g.setAttribute('aAlpha', this.aAlpha); g.setAttribute('aColor', this.aColor);
    this.mat = new THREE.ShaderMaterial({
      uniforms: { uTex: { value: puffTex }, uScale: { value: 1 }, uFogColor: { value: FOG_COLOR }, uFogDensity: { value: FOG_DENSITY } },
      vertexShader: /* glsl */`
        attribute float aSize; attribute float aAlpha; attribute vec3 aColor;
        uniform float uScale; uniform float uFogDensity;
        varying float vA; varying vec3 vC; varying float vFog;
        void main(){
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          float d = max(-mv.z, 0.1);
          gl_PointSize = aSize * uScale / d;
          vA = aAlpha; vC = aColor;
          float f = uFogDensity * d; vFog = 1.0 - exp(-f * f);
        }`,
      fragmentShader: /* glsl */`
        uniform sampler2D uTex; uniform vec3 uFogColor;
        varying float vA; varying vec3 vC; varying float vFog;
        void main(){
          float a = texture2D(uTex, gl_PointCoord).a * vA;
          if (a < 0.003) discard;
          gl_FragColor = vec4(mix(vC, uFogColor, vFog), a);
        }`,
      transparent: true, depthWrite: false
    });
    this.points = new THREE.Points(g, this.mat);
    this.points.frustumCulled = false;
    this.points.renderOrder = renderOrder;
    g.setDrawRange(0, 0);
  }
  // 由远及近排序后上传，保证半透明叠加正确
  upload(cam) {
    const n = this.count, d = this.dist, o = this.order, P = this.px;
    const cx = cam.position.x, cy = cam.position.y, cz = cam.position.z;
    for (let i = 0; i < n; i++) {
      const dx = P[i * 3] - cx, dy = P[i * 3 + 1] - cy, dz = P[i * 3 + 2] - cz;
      d[i] = dx * dx + dy * dy + dz * dz; o[i] = i;
    }
    o.subarray(0, n).sort((a, b) => d[b] - d[a]);
    const ap = this.aPos.array, as = this.aSize.array, aa = this.aAlpha.array, ac = this.aColor.array;
    for (let k = 0; k < n; k++) {
      const i = o[k];
      ap[k * 3] = P[i * 3]; ap[k * 3 + 1] = P[i * 3 + 1]; ap[k * 3 + 2] = P[i * 3 + 2];
      as[k] = this.sz[i]; aa[k] = this.al[i];
      ac[k * 3] = this.co[i * 3]; ac[k * 3 + 1] = this.co[i * 3 + 1]; ac[k * 3 + 2] = this.co[i * 3 + 2];
    }
    this.aPos.needsUpdate = this.aSize.needsUpdate = this.aAlpha.needsUpdate = this.aColor.needsUpdate = true;
    this.points.geometry.setDrawRange(0, n);
  }
  push(x, y, z, size, alpha, r, g, b) {
    const i = this.count++;
    this.px[i * 3] = x; this.px[i * 3 + 1] = y; this.px[i * 3 + 2] = z;
    this.sz[i] = size; this.al[i] = alpha;
    this.co[i * 3] = r; this.co[i * 3 + 1] = g; this.co[i * 3 + 2] = b;
  }
}

function wheelGeo(r, spokes) {
  const parts = [
    new THREE.TorusGeometry(r * 0.9, r * 0.1, 8, 32),
    new THREE.CylinderGeometry(r, r, 0.14, 32, 1, true).rotateX(Math.PI / 2),
    new THREE.CylinderGeometry(r * 0.2, r * 0.2, 0.22, 14).rotateX(Math.PI / 2)
  ];
  for (let k = 0; k < spokes; k++) parts.push(new THREE.BoxGeometry(r * 0.08, r * 0.8, 0.06).translate(0, r * 0.48, 0).rotateZ(k * TAU / spokes));
  return mergeGeometries(parts);
}
const WHEEL_GEO = { d: wheelGeo(0.8, 12), b: wheelGeo(0.45, 8), t: wheelGeo(0.5, 8) };
function addWheels(g, list, geo, r, mat, xs, y, zs = [-0.82, 0.82]) {
  for (const x of xs) for (const z of zs) {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true;
    g.add(m); list.push({ mesh: m, r });
  }
}

function animateLoco(loco, s, time) {
  for (const w of loco.wheels) w.mesh.rotation.z = -s / w.r;
  const a = -s / 0.8;
  for (const r of loco.rods) {
    const ph = a + r.phase, c = Math.cos(ph), sn = Math.sin(ph);
    const pinX = 0.42 * c, pinY = 1.1 + 0.42 * sn;
    r.coupling.position.set(pinX, pinY, r.zc);
    const dy = 1.35 - pinY, dx = Math.sqrt(2.9 * 2.9 - dy * dy), chX = pinX + dx;
    r.main.position.set((pinX + chX) / 2, (pinY + 1.35) / 2, r.zm);
    r.main.rotation.z = Math.atan2(dy, dx);
    r.cross.position.set(chX, 1.35, r.zx);
    r.piston.position.set(chX + 0.62, 1.35, r.zx);
  }
  loco.fire.intensity = 9 + Math.sin(time * 23) * 1.5 + Math.sin(time * 37) * 1.2;
}

/* ======================= 白色蒸汽烟雾 ======================= */
const SMOKE_MAX = 560;
const smoke = new PuffSystem(SMOKE_MAX, 2);
scene.add(smoke.points);
const particles = Array.from({ length: SMOKE_MAX }, () => ({ alive: false }));
let nextP = 0, accChimney = 0, accSteam = 0;
const _v = new THREE.Vector3(), _t = new THREE.Vector3();
function emit(pos, vx, vy, vz, life, s0, s1, shade, a0) {
  const p = particles[nextP]; nextP = (nextP + 1) % SMOKE_MAX;
  Object.assign(p, { alive: true, x: pos.x, y: pos.y, z: pos.z, vx, vy, vz, age: 0, life, s0, s1, shade, a0 });
}
function emitTrain(t, dt) {
  const s = sLoco(t), th = s / R;
  _t.set(Math.cos(th), 0, -Math.sin(th));           // 圆弧切线方向
  accChimney += dt * 30;
  while (accChimney >= 1) {
    accChimney--;
    const k = rand();
    arcPos(s + 5.3 - SPEED * dt * k, rr(-0.15, 0.15), 5.15, _v);
    emit(_v, _t.x * 5 + rr(-0.8, 0.8), rr(5, 7.5), _t.z * 5 + rr(-0.8, 0.8), rr(4, 5.5), rr(1.0, 1.6), rr(8, 12), rr(0.82, 0.95), 0.75);
  }
  accSteam += dt * 18;
  while (accSteam >= 1) {
    accSteam--;
    const sd = rand() > 0.5 ? 1 : -1;
    arcPos(s + 4.0, sd * 1.5, 0.9, _v);
    const nx = Math.sin(th) * sd, nz = Math.cos(th) * sd;
    emit(_v, nx * 2.2, rr(0.4, 1.2), nz * 2.2, rr(0.9, 1.4), 0.4, rr(2.2, 3.2), 0.95, 0.5);
  }
}
function updateSmoke(dt) {
  smoke.count = 0;
  for (const p of particles) {
    if (!p.alive) continue;
    p.age += dt;
    if (p.age >= p.life) { p.alive = false; continue; }
    const k = p.age / p.life, drag = Math.exp(-1.1 * dt);
    p.vx = p.vx * drag + 0.6 * dt; p.vz *= drag; p.vy *= Math.exp(-0.45 * dt);
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    const size = lerp(p.s0, p.s1, 1 - (1 - k) * (1 - k));
    const alpha = p.a0 * smooth(0, 0.06, k) * Math.pow(1 - k, 1.5);
    const sh = p.shade * lerp(1.0, 0.82, k);
    smoke.push(p.x, p.y, p.z, size, alpha, sh, sh * 0.98, sh * 1.02);
  }
}
function resetSmoke(t) {
  particles.forEach(p => (p.alive = false));
  const dt = 1 / 30;
  for (let tt = t - 4.5; tt < t; tt += dt) { emitTrain(tt, dt); updateSmoke(dt); }
}

const camPos = new THREE.Vector3(), camTgt = new THREE.Vector3();
const A_P = new THREE.Vector3(), A_T = new THREE.Vector3(), B_P = new THREE.Vector3(), B_T = new THREE.Vector3();
const C_P = new THREE.Vector3(), C_T = new THREE.Vector3(), K1 = new THREE.Vector3(), K2 = new THREE.Vector3();

arcPos(52.5, 40, 3.5, K1);   // 推近控制点：从柱间侧向贴地进入站台
arcPos(82, 0, 8, K2);        // 拉远控制点：沿轨道上空驶出车站
function bezier(a, k, b, u, out) {
  const w0 = (1 - u) * (1 - u), w1 = 2 * u * (1 - u), w2 = u * u;
  return out.set(a.x * w0 + k.x * w1 + b.x * w2, a.y * w0 + k.y * w1 + b.y * w2, a.z * w0 + k.z * w1 + b.z * w2);
}
function cameraRig(t) {
  // A：广角高机位俯瞰（0–7 秒缓慢升降）
  const ka = clamp(t / 7, 0, 1);
  A_P.set(lerp(105, 82, ka), lerp(95, 78, ka), lerp(200, 168, ka));
  A_T.set(lerp(-60, -45, ka), -10, lerp(-130, -112, ka));
  // B：玻璃站台低机位，迎向弯道来车，随后跟随车厢掠过
  arcPos(52.5, 4.3, 2.15, B_P);
  arcPos(-40, 0.6, 1.6, B_T).lerp(arcPos(sLoco(t) - 20, 0, 2.3, tmp), smooth(10.8, 14.6, t));
  // C：列车左后上方高空尾随
  const s = sLoco(t);
  arcPos(s - 58, -30, 27, C_P);
  arcPos(s + 30, 0, 0, C_T);

  const u1 = smoother(7, 12.4, t), u2 = smoother(15, 21, t);
  if (u2 > 0) {
    bezier(B_P, K2, C_P, u2, camPos);
    camTgt.copy(B_T).lerp(C_T, u2);
  } else {
    bezier(A_P, K1, B_P, u1, camPos);
    camTgt.copy(A_T).lerp(B_T, u1);
  }
  // 列车贴身掠过时的轻微震动
  const shake = smooth(11.6, 12.6, t) * (1 - smooth(13.8, 15, t)) * 0.035;
  if (shake > 0) camPos.add(tmp.set(Math.sin(t * 61) * shake, Math.sin(t * 47 + 1) * shake, Math.cos(t * 53) * shake));
  return lerp(lerp(50, 60, u1), 50, u2);
}
const PHASES = [[7, 'Ⅰ 广角远景 · 云海水平大弯道'], [15, 'Ⅱ 推近 · 玻璃站台迎面进站'], [Infinity, 'Ⅲ 拉远 · 高空尾随驶向云柱之间']];

/* ======================= 后期辉光 ======================= */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.75, 0.55, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ======================= UI ======================= */
const fadeEl = document.getElementById('fade'), phaseEl = document.getElementById('phase');
const barEl = document.getElementById('barFill'), autoBtn = document.getElementById('autoBtn');
let auto = true, tl = 0, lastPhase = '';
function setAuto(v) {
  auto = v;
  autoBtn.classList.toggle('on', v);
  autoBtn.textContent = v ? '自动运镜' : '自由视角（点击恢复运镜）';
}
autoBtn.addEventListener('click', () => setAuto(!auto));
document.getElementById('replayBtn').addEventListener('click', () => { tl = 0; resetSmoke(0); setAuto(true); });
controls.addEventListener('start', () => { if (auto) setAuto(false); });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

/* ======================= 主循环 ======================= */
const clock = new THREE.Clock();
const dbSize = new THREE.Vector2();
let time = 0, frame = 0;
// 支持 ?t=12 直接跳到指定时刻预览
tl = clamp(parseFloat(new URLSearchParams(location.search).get('t')) || 0, 0, LOOP - 0.01);
resetSmoke(tl);
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt; frame++;
  tl += dt;
  if (tl >= LOOP) { tl -= LOOP; resetSmoke(tl); }

  updateTrain(tl, time);
  emitTrain(tl, dt);
  updateSmoke(dt);
  updateBeacons(time);

  if (auto) {
    const fov = cameraRig(tl);
    camera.position.copy(camPos);
    camera.lookAt(camTgt);
    if (Math.abs(camera.fov - fov) > 1e-3) { camera.fov = fov; camera.updateProjectionMatrix(); }
    controls.target.copy(camTgt);
  } else {
    controls.update();
  }

  // 天幕元素跟随相机
  skyDome.position.copy(camera.position);
  stars.position.copy(camera.position);
  sunCore.position.copy(camera.position).addScaledVector(SUN_DIR, 2400);
  sunHalo.position.copy(sunCore.position);
  sea.position.set(camera.position.x, -8, camera.position.z);
  seaUniforms.uTime.value = time;
  seaUniforms.uCam.value.copy(camera.position);

  // 点精灵尺寸换算（随 FOV 与分辨率）
  renderer.getDrawingBufferSize(dbSize);
  const scale = dbSize.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  clouds.mat.uniforms.uScale.value = smoke.mat.uniforms.uScale.value = scale;
  if (frame % 3 === 1) clouds.upload(camera);
  smoke.upload(camera);

  // 湿润站台的动态倒影
  if (frame % 3 === 0) {
    platforms.forEach(m => (m.visible = false));
    cubeCam.update(renderer, scene);
    platforms.forEach(m => (m.visible = true));
  }

  // UI 与循环衔接淡入淡出
  fadeEl.style.opacity = Math.max(smooth(LOOP - 0.7, LOOP, tl), 1 - smooth(0, 0.8, tl)).toFixed(3);
  barEl.style.width = (tl / LOOP * 100).toFixed(2) + '%';
  const ph = PHASES.find(([end]) => tl < end)[1];
  if (ph !== lastPhase) { phaseEl.textContent = ph; lastPhase = ph; }

  composer.render();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
<script src="../prompt-panel.js" data-id="sky-arc-train-kiro-opus-v1"></script>
