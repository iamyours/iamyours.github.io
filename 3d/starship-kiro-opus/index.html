<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ======================= 基础工具 ======================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260121);
const rr = (a, b) => a + (b - a) * rand();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const V2 = (x, y) => new THREE.Vector2(x, y);
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ======================= 关键尺寸（单位：米） ======================= */
const R = 4.5;             // 箭体半径
const BOOSTER_H = 71;      // 助推器高度（含热分离环）
const SHIP_H = 50;         // 星舰高度
const PAD_TOP = 21;        // 发射台顶面（助推器底部）高度
const TX = -21, TW = 10;   // 发射塔中心 X 与塔身宽度
const TOWER_H = 146;
const B_COM = 35, S_COM = 20; // 两级的旋转中心（近似质心）
const isMobile = Math.min(window.innerWidth, window.innerHeight) < 700;

/* ======================= 渲染器 / 场景 / 相机 ======================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', top: '0', left: '0', pointerEvents: 'none', zIndex: '5' });
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xb98d80);
scene.fog = new THREE.FogExp2(FOG_COLOR, 0.0006);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 40000);
const HOME_T = new THREE.Vector3(0, 78, 0);
const HOME_P = new THREE.Vector3(95, 58, 195);
if (camera.aspect < 0.75) HOME_P.sub(HOME_T).multiplyScalar(1.2).add(HOME_T);
camera.position.copy(HOME_P);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_T);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 8;
controls.maxDistance = 900;
controls.maxPolarAngle = Math.PI * 0.62;
controls.screenSpacePanning = true;
controls.rotateSpeed = 0.7;
controls.update();

/* ======================= 天空（黄昏渐变 + 太阳 + 星星） ======================= */
const SUN_DIR = new THREE.Vector3(1.0, 0.13, -0.42).normalize();
function makeSkyMat(forEnv) {
  return new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uSun: { value: SUN_DIR }, uTime: { value: 0 },
      uZenith: { value: new THREE.Color(0x15224a) }, uMid: { value: new THREE.Color(0x4f5f9e) },
      uHorizon: { value: new THREE.Color(0xffb184) },
      uFog: { value: forEnv ? new THREE.Color(0x4a3a34) : FOG_COLOR },
      uStars: { value: forEnv ? 0 : 1 }, uDisk: { value: forEnv ? 1.5 : 14 }
    },
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uSun, uZenith, uMid, uHorizon, uFog;
      uniform float uTime, uStars, uDisk;
      varying vec3 vDir;
      float hash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      void main(){
        vec3 d = normalize(vDir);
        float h = d.y;
        float s = max(dot(d, uSun), 0.0);
        vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.22, h));
        col = mix(col, uZenith, smoothstep(0.18, 0.85, h));
        // 太阳方向的地平线暖光
        col += vec3(1.0, 0.42, 0.16) * pow(s, 6.0) * 0.6 * (1.0 - smoothstep(0.0, 0.45, h));
        col += vec3(1.0, 0.68, 0.42) * pow(s, 64.0) * 0.8;
        col += vec3(1.0, 0.9, 0.72) * smoothstep(0.9993, 0.9997, s) * uDisk;
        // 星空
        if (uStars > 0.0 && h > 0.05) {
          vec3 p = d * 260.0;
          vec3 c = floor(p);
          float r = hash(c);
          if (r > 0.993) {
            float st = 1.0 - smoothstep(0.0, 0.3, length(fract(p) - 0.5));
            float tw = 0.65 + 0.35 * sin(uTime * 2.5 + r * 900.0);
            col += vec3(0.9, 0.93, 1.0) * st * tw * smoothstep(0.12, 0.6, h) * 1.4 * uStars;
          }
        }
        // 地平线以下融入雾色
        col = mix(col, uFog, 1.0 - smoothstep(-0.04, 0.015, h));
        gl_FragColor = vec4(col, 1.0);
      }`
  });
}
const skyMat = makeSkyMat(false);
const sky = new THREE.Mesh(new THREE.SphereGeometry(30000, 48, 24), skyMat);
sky.renderOrder = -10;
sky.frustumCulled = false;
scene.add(sky);

// 用同款天空生成环境反射贴图（不锈钢箭体反射黄昏天空）
const pmrem = new THREE.PMREMGenerator(renderer);
{
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 64, 32), makeSkyMat(true)));
  scene.environment = pmrem.fromScene(envScene, 0.02, 0.1, 1000).texture;
}

/* ======================= 灯光 ======================= */
const sun = new THREE.DirectionalLight(0xffc6a0, 3.2);
sun.position.copy(SUN_DIR).multiplyScalar(420).add(new THREE.Vector3(0, 60, 0));
sun.target.position.set(0, 60, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -130, right: 130, top: 130, bottom: -130, near: 50, far: 900 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.2;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0x8ea3d6, 0x6b5040, 0.9));

// 发动机火光照明（点火时启用）
const fireLight = new THREE.PointLight(0xff8a3a, 0, 600, 1.6);
scene.add(fireLight);
const shipFireLight = new THREE.PointLight(0xff9a50, 0, 400, 1.6);
scene.add(shipFireLight);

/* ======================= 程序化贴图 ======================= */
function toTex(canvas, srgb = true) {
  const t = new THREE.CanvasTexture(canvas);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  return t;
}
function texClone(t, rx, ry) { const c = t.clone(); c.repeat.set(rx, ry); c.needsUpdate = true; return c; }

// 不锈钢环段：颜色 / 粗糙度 / 凹凸三张贴图。一张贴图纵向 4 个环段（每段约 1.83 m），横向一整圈
const STEEL = (() => {
  const W = 512, H = 1024, RING = H / 4;
  const cc = makeCanvas(W, H), rc = makeCanvas(W, H), bc = makeCanvas(W, H);
  const g = cc.getContext('2d'), gr = rc.getContext('2d'), gb = bc.getContext('2d');
  const wrapRect = (ctx, x, y, w, h) => { ctx.fillRect(x, y, w, h); if (x + w > W) ctx.fillRect(x - W, y, w, h); };
  g.fillStyle = '#b4b7bb'; g.fillRect(0, 0, W, H);
  gr.fillStyle = '#4a4a4a'; gr.fillRect(0, 0, W, H);
  gb.fillStyle = '#808080'; gb.fillRect(0, 0, W, H);
  const seams = [];
  for (let r = 0; r < 4; r++) {
    const y0 = r * RING, off = rand() * W, n = 3;
    for (let p = 0; p < n; p++) {
      const x0 = (off + p * W / n) % W;
      const t = rr(-12, 12);
      g.fillStyle = `rgb(${180 + t | 0},${183 + t | 0},${188 + t * 1.1 | 0})`;
      wrapRect(g, x0, y0, W / n, RING);
      const ro = 72 + rr(-18, 18) | 0;
      gr.fillStyle = `rgb(${ro},${ro},${ro})`;
      wrapRect(gr, x0, y0, W / n, RING);
      seams.push([x0, y0]);
    }
  }
  // 竖向拉丝 / 污渍条纹
  for (let i = 0; i < 1500; i++) {
    const x = rand() * W, y = rand() * H, len = rr(10, 170), light = rand() < 0.5;
    g.strokeStyle = light ? `rgba(236,239,243,${rr(0.03, 0.09)})` : `rgba(68,70,74,${rr(0.03, 0.08)})`;
    g.lineWidth = rr(0.5, 1.6);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(-2, 2), y + len); g.stroke();
    const rv = light ? 45 : 115;
    gr.strokeStyle = `rgba(${rv},${rv},${rv},${rr(0.06, 0.16)})`;
    gr.lineWidth = g.lineWidth;
    gr.beginPath(); gr.moveTo(x, y); gr.lineTo(x, y + len); gr.stroke();
  }
  // 轻微的热变色斑块
  for (let i = 0; i < 16; i++) {
    const x = rand() * W, y = rand() * H, rad = rr(20, 80);
    const grd = g.createRadialGradient(x, y, 0, x, y, rad);
    grd.addColorStop(0, 'rgba(150,128,92,0.12)'); grd.addColorStop(1, 'rgba(150,128,92,0)');
    g.fillStyle = grd; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  // 环向焊缝
  for (let r = 0; r < 4; r++) {
    const y = r * RING + 4;
    g.fillStyle = 'rgba(78,78,84,0.6)'; g.fillRect(0, y, W, 3);
    g.fillStyle = 'rgba(238,238,242,0.4)'; g.fillRect(0, y + 3, W, 1);
    gr.fillStyle = 'rgb(150,150,150)'; gr.fillRect(0, y - 1, W, 5);
    gb.fillStyle = 'rgb(205,205,205)'; gb.fillRect(0, y - 1, W, 5);
    gb.fillStyle = 'rgb(165,165,165)'; gb.fillRect(0, y - 3, W, 2); gb.fillRect(0, y + 4, W, 2);
  }
  // 纵向焊缝
  for (const [x, y0] of seams) {
    g.fillStyle = 'rgba(86,86,92,0.5)'; g.fillRect(x, y0, 2, RING);
    gr.fillStyle = 'rgb(140,140,140)'; gr.fillRect(x - 1, y0, 4, RING);
    gb.fillStyle = 'rgb(190,190,190)'; gb.fillRect(x - 1, y0, 4, RING);
  }
  return { map: toTex(cc), rough: toTex(rc, false), bump: toTex(bc, false) };
})();

const steelCache = new Map();
// h：表面高度（米），tint：整体色调，rx：横向重复
function steelMat(h, tint = 0xffffff, rx = 1) {
  const ry = +(h / (4 * 1.83)).toFixed(2);
  const key = ry + '|' + tint + '|' + rx;
  if (steelCache.has(key)) return steelCache.get(key);
  const m = new THREE.MeshStandardMaterial({
    color: tint, map: texClone(STEEL.map, rx, ry), roughnessMap: texClone(STEEL.rough, rx, ry),
    bumpMap: texClone(STEEL.bump, rx, ry), bumpScale: 0.8, metalness: 0.9, roughness: 1.0, envMapIntensity: 1.15
  });
  steelCache.set(key, m);
  return m;
}

// 六边形隔热瓦（可无缝平铺）
const TILE = (() => {
  const COLS = 16, w = 32, s = w / Math.sqrt(3), rowH = 1.5 * s, ROWS = 18;
  const W = COLS * w, H = Math.round(ROWS * rowH);
  const c = makeCanvas(W, H), g = c.getContext('2d');
  g.fillStyle = '#0a0a0b'; g.fillRect(0, 0, W, H);
  for (let row = -1; row <= ROWS + 1; row++) {
    const odd = ((row % 2) + 2) % 2;
    for (let col = -1; col <= COLS + 1; col++) {
      const cx = col * w + (odd ? w / 2 : 0), cy = row * rowH;
      const rnd = rand();
      let v = 26 + rand() * 12 | 0;
      let fill = `rgb(${v},${v},${v + 2})`;
      if (rnd > 0.992) fill = '#bdb8ae';          // 少量白色替换瓦
      else if (rnd > 0.975) fill = '#3c3b3a';     // 略浅的新瓦
      g.fillStyle = fill;
      g.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = Math.PI / 2 + k * Math.PI / 3;
        const px = cx + Math.cos(a) * s * 0.93, py = cy + Math.sin(a) * s * 0.93;
        k ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath(); g.fill();
      // 瓦面高光
      g.fillStyle = 'rgba(255,255,255,0.035)';
      g.beginPath(); g.arc(cx - s * 0.2, cy - s * 0.25, s * 0.45, 0, Math.PI * 2); g.fill();
    }
  }
  const t = toTex(c);
  return { tex: t, texW: COLS * 0.35, texH: H / w * 0.35 };
})();
const tileMatCache = new Map();
function tileMat(widthM, heightM) {

// 海面法线贴图（整数频率正弦叠加，保证无缝）
const WATER_NORMAL = (() => {
  const N = 256, c = makeCanvas(N, N), g = c.getContext('2d');
  const img = g.createImageData(N, N);
  const waves = [];
  for (let i = 0; i < 9; i++) waves.push({ kx: Math.round(rr(-6, 6)) || 1, ky: Math.round(rr(1, 8)), a: rr(0.3, 1), p: rr(0, 6.28) });
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let dx = 0, dy = 0;
    for (const w of waves) {
      const ph = 2 * Math.PI * (w.kx * x + w.ky * y) / N + w.p;
      const cs = Math.cos(ph) * w.a * 2 * Math.PI / N * 9;
      dx += cs * w.kx; dy += cs * w.ky;
    }
    const l = Math.hypot(dx, dy, 1);
    const i = (y * N + x) * 4;
    img.data[i] = (-dx / l * 0.5 + 0.5) * 255;
    img.data[i + 1] = (-dy / l * 0.5 + 0.5) * 255;
    img.data[i + 2] = (1 / l * 0.5 + 0.5) * 255;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = toTex(c, false); t.repeat.set(300, 400);
  return t;
})();

function makeRaptor(exitR, bellLen) {
  const thr = 0.21, N = 22, b = bellLen;
  const bell = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    bell.push(V2(thr + (exitR - thr) * Math.pow(1 - t, 0.62), t * bellLen));
  }
  const head = [V2(thr, b), V2(0.27, b + 0.18), V2(0.3, b + 0.48), V2(0.3, b + 0.72), V2(0.43, b + 0.84),
    V2(0.43, b + 1.22), V2(0.3, b + 1.38), V2(0.06, b + 1.46)];
  const lip = new THREE.TorusGeometry(exitR, 0.035, 6, 28).rotateX(Math.PI / 2);
  const pumpA = new THREE.CylinderGeometry(0.15, 0.15, 0.6, 12).translate(0.42, b + 0.95, 0.1);
  const pumpB = new THREE.CylinderGeometry(0.13, 0.13, 0.55, 12).translate(-0.4, b + 0.95, -0.12);
  const pipe = new THREE.CylinderGeometry(0.06, 0.06, 0.9, 8).rotateZ(0.5).translate(0.25, b + 0.45, 0.25);
  const g0 = mergeGeometries([new THREE.LatheGeometry(bell, 28), lip]);
  const g1 = mergeGeometries([new THREE.LatheGeometry(head, 20), pumpA, pumpB, pipe]);
  const geo = mergeGeometries([g0, g1], true);
  const glowGeo = new THREE.LatheGeometry(bell.map(p => V2(p.x * 0.95, p.y)), 28);
  return { geo, glowGeo, len: bellLen };
}

function makeGlowMat(len) {
  return new THREE.ShaderMaterial({
    uniforms: { uBurn: { value: 0 }, uLen: { value: len } },
    vertexShader: `
      varying float vY;
      void main(){
        vY = position.y;

    fragmentShader: `

const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3(1, 1, 1);
function makeEngineCluster(parent, def, list, exitY) {
  const im = new THREE.InstancedMesh(def.geo, [bellMat, headMat], list.length);

  list.forEach(([x, z], i) => {

// 发动机摆动（推力矢量控制）
function gimbal(cluster, count, amp, time) {
  for (let i = 0; i < count; i++) {
    const [x, z] = cluster.list[i];
    _e.set(Math.sin(time * 2.1 + i * 1.7) * amp, 0, Math.cos(time * 1.7 + i * 2.3) * amp);
    _q.setFromEuler(_e);
    _m4.compose(_v.set(x, cluster.exitY, z), _q, _s);
    cluster.im.setMatrixAt(i, _m4); cluster.glow.setMatrixAt(i, _m4);
  }
  cluster.im.instanceMatrix.needsUpdate = true;
  cluster.glow.instanceMatrix.needsUpdate = true;
}

/* ======================= 尾焰着色器 ======================= */
const plumeVert = `
  varying vec2 vUv; varying vec3 vN; varying vec3 vV;
  void main(){
    vUv = uv;
    vec4 p = vec4(position, 1.0);
    vec3 n = normal;
    #ifdef USE_INSTANCING
      p = instanceMatrix * p;
      n = mat3(instanceMatrix) * n;
    #endif
    vec4 mv = modelViewMatrix * p;
    vN = normalize(normalMatrix * n);
    vV = normalize(-mv.xyz);
    gl_Position = projectionMatrix * mv;
  }`;
const plumeFrag = `
  uniform float uTime, uIntensity, uDiamonds, uSeed, uFade;
  uniform vec3 uCore, uMid, uTail;
  varying vec2 vUv; varying vec3 vN; varying vec3 vV;
  void main(){
    float a = 1.0 - vUv.y;                       // 0 = 喷口，1 = 尾端
    float facing = abs(dot(normalize(vN), normalize(vV)));
    float edge = pow(facing, 1.6);
    float flick = 0.82 + 0.18 * sin(uTime * 47.0 + a * 23.0 + uSeed) * sin(uTime * 31.0 + vUv.x * 40.0 + uSeed);
    float dia = 0.0;
    if (uDiamonds > 0.0) dia = pow(0.5 + 0.5 * cos(a * uDiamonds * 6.2831 - 0.6), 6.0) * (1.0 - smoothstep(0.0, 0.75, a));
    vec3 col = mix(uCore, uMid, smoothstep(0.0, 0.3, a));
    col = mix(col, uTail, smoothstep(0.3, 1.0, a));
    col += vec3(1.0, 0.9, 0.95) * dia * 1.3;
    float alpha = edge * (1.0 - smoothstep(uFade, 1.0, a)) * flick * uIntensity;
    alpha *= smoothstep(0.0, 0.04, a + 0.01);
    gl_FragColor = vec4(col * 2.2, clamp(alpha, 0.0, 1.0));
  }`;
const plumeMats = [];
function makePlumeMat(o) {
  const m = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uIntensity: { value: 0 }, uDiamonds: { value: o.diamonds }, uSeed: { value: rand() * 10 },
      uFade: { value: o.fade }, uCore: { value: new THREE.Color(o.core) }, uMid: { value: new THREE.Color(o.mid) },
      uTail: { value: new THREE.Color(o.tail) }
    },
    vertexShader: plumeVert, fragmentShader: plumeFrag,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
  });
  plumeMats.push(m);
  return m;
}
// 一组发动机的尾焰：每台发动机的激波钻石内核 + 整体外焰
function makePlume(parent, list, exitY, core, big) {
  const coreGeo = new THREE.CylinderGeometry(core.r0, core.r1, core.len, 18, 20, true).translate(0, -core.len / 2, 0);
  const coreMat = makePlumeMat({ diamonds: 5, fade: 0.45, core: 0xe8deff, mid: 0xffb066, tail: 0xff6a2a });
  const cores = new THREE.InstancedMesh(coreGeo, coreMat, list.length);
  list.forEach(([x, z, sc = 1], i) => {
    _m4.compose(_v.set(x, exitY, z), _q.identity(), new THREE.Vector3(sc, sc, sc));
    cores.setMatrixAt(i, _m4);
  });
  const bigGeo = new THREE.CylinderGeometry(big.r0, big.r1, big.len, 48, 24, true).translate(0, -big.len / 2, 0);
  const bigMat = makePlumeMat({ diamonds: 0, fade: 0.35, core: 0xffd9a0, mid: 0xff8a2e, tail: 0x7a2a0a });
  const bigMesh = new THREE.Mesh(bigGeo, bigMat);

      bigMesh.scale.set(spread, 1 + (spread - 1) * 0.4, spread);
    }
  };
}

/* ======================= 烟雾 / 蒸汽粒子 ======================= */
const SMOKE_N = isMobile ? 1500 : 2600;
const sPos = new Float32Array(SMOKE_N * 3), sCol = new Float32Array(SMOKE_N * 3);
const sSize = new Float32Array(SMOKE_N), sAlpha = new Float32Array(SMOKE_N);
const sVel = new Float32Array(SMOKE_N * 3), sAge = new Float32Array(SMOKE_N), sLife = new Float32Array(SMOKE_N);
const sS0 = new Float32Array(SMOKE_N), sGrow = new Float32Array(SMOKE_N), sA0 = new Float32Array(SMOKE_N);
const sBuoy = new Float32Array(SMOKE_N), sDrag = new Float32Array(SMOKE_N);
let sHead = 0;
const smokeGeo = new THREE.BufferGeometry();
smokeGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3).setUsage(THREE.DynamicDrawUsage));
smokeGeo.setAttribute('aColor', new THREE.BufferAttribute(sCol, 3).setUsage(THREE.DynamicDrawUsage));
smokeGeo.setAttribute('aSize', new THREE.BufferAttribute(sSize, 1).setUsage(THREE.DynamicDrawUsage));
smokeGeo.setAttribute('aAlpha', new THREE.BufferAttribute(sAlpha, 1).setUsage(THREE.DynamicDrawUsage));
const smokeMat = new THREE.ShaderMaterial({
  uniforms: { uMap: { value: PUFF_TEX }, uScale: { value: 500 } },
  vertexShader: `
    attribute float aSize; attribute float aAlpha; attribute vec3 aColor;
    uniform float uScale;
    varying float vA; varying vec3 vC;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = min(aSize * uScale / max(1.0, -mv.z), 700.0);
      gl_Position = projectionMatrix * mv;
      vA = aAlpha; vC = aColor;
    }`,
  fragmentShader: `
    uniform sampler2D uMap;
    varying float vA; varying vec3 vC;
    void main(){
      float a = texture2D(uMap, gl_PointCoord).a * vA;
      if (a < 0.004) discard;
      gl_FragColor = vec4(vC, a);
    }`,
  transparent: true, depthWrite: false
});
const smoke = new THREE.Points(smokeGeo, smokeMat);
smoke.frustumCulled = false;
smoke.renderOrder = 4;
scene.add(smoke);

function spawnSmoke(x, y, z, vx, vy, vz, life, size, grow, alpha, r, g, b, buoy = 0.6, drag = 0.6) {
  const i = sHead; sHead = (sHead + 1) % SMOKE_N;
  sPos[i * 3] = x; sPos[i * 3 + 1] = y; sPos[i * 3 + 2] = z;
  sVel[i * 3] = vx; sVel[i * 3 + 1] = vy; sVel[i * 3 + 2] = vz;
  sCol[i * 3] = r; sCol[i * 3 + 1] = g; sCol[i * 3 + 2] = b;
  sAge[i] = 0; sLife[i] = life; sS0[i] = size; sGrow[i] = grow; sA0[i] = alpha; sBuoy[i] = buoy; sDrag[i] = drag;
  sSize[i] = size; sAlpha[i] = 0;
}
function updateSmoke(dt) {
  for (let i = 0; i < SMOKE_N; i++) {
    if (sLife[i] <= 0) continue;
    sAge[i] += dt;
    if (sAge[i] >= sLife[i]) { sLife[i] = 0; sAlpha[i] = 0; sSize[i] = 0; continue; }
    const k = sAge[i] / sLife[i], d = Math.exp(-sDrag[i] * dt), j = i * 3;
    sVel[j] *= d; sVel[j + 1] = sVel[j + 1] * d + sBuoy[i] * dt; sVel[j + 2] *= d;
    sPos[j] += sVel[j] * dt; sPos[j + 1] += sVel[j + 1] * dt; sPos[j + 2] += sVel[j + 2] * dt;
    if (sPos[j + 1] < 0.8) { sPos[j + 1] = 0.8; sVel[j + 1] = Math.abs(sVel[j + 1]) * 0.3; }
    sSize[i] = sS0[i] + sGrow[i] * sAge[i];
    sAlpha[i] = sA0[i] * smooth(0, 0.08, k) * (1 - smooth(0.5, 1, k));
  }
  for (const n of ['position', 'aColor', 'aSize', 'aAlpha']) smokeGeo.attributes[n].needsUpdate = true;
}
function clearSmoke() { sLife.fill(0); sAlpha.fill(0); sSize.fill(0); }

const S = { mode: 'idle', t: 0, explode: 0, explodeTarget: 0, labels: true, sep: false, v: 0, pitch: 0, shipV: 0, armOpen: 0.55, qd: 0, bBurn: 0, sBurn: 0, hot: 0 };
const P = new THREE.Vector3(0, PAD_TOP, 0);   // 堆栈底部位置
const Q = new THREE.Quaternion();              // 堆栈姿态
const ZAX = new THREE.Vector3(0, 0, 1);
const boosterVel = new THREE.Vector3();
const qFlip = new THREE.Quaternion(), shipQ = new THREE.Quaternion();
const followPrev = new THREE.Vector3(), followNow = new THREE.Vector3();

function placeStack() {

/* ---------- 逐帧：发射过程 ---------- */
function exitWorld(obj, rig, y, out) { obj.localToWorld(out.set(0, y, 0)); _dir.set(0, 1, 0).applyQuaternion(rig.quaternion); return out; }
function emitCount(rate, dt) { const n = rate * dt; return Math.floor(n) + (rand() < n % 1 ? 1 : 0); }

function updateLaunch(dt, time) {
  const t = (S.t += dt);
  // 倒计时 / 阶段提示
  if (t < IGN) showCount(`T-${Math.ceil(LIFT - t)}`, '发射倒计时 · 机械臂撤离');
  else if (t < LIFT) showCount('点火', '33 台猛禽发动机依次启动');
  else if (t < LIFT + 2.5) showCount('起飞', 'LIFTOFF');
  else if (S.sep && t < SEP + 3) showCount('热分离', 'HOT STAGING');
  else if (t > END && t < END + 6) showCount('上升段完成', '星舰进入轨道 · 点击「重置」再看一次');
  else hideCount();

  // 推力
  let bBurn = 0;
  if (!S.sep) bBurn = smooth(IGN, IGN + 1.3, t) * (1 - 0.7 * smooth(SEP - 0.6, SEP, t));
  else {
    const ts = t - SEP;
    bBurn = ts < 1.2 ? 0.3 * (1 - smooth(0.6, 1.2, ts)) : (ts > 6 && ts < 12 ? 0.65 * smooth(6, 6.6, ts) * (1 - smooth(11.4, 12, ts)) : 0);
  }
  const sBurn = smooth(SEP - 0.6, SEP + 0.2, t);
  const hot = smooth(SEP - 0.6, SEP - 0.2, t) * (1 - smooth(SEP + 0.4, SEP + 2.5, t));
  S.bBurn = bBurn; S.sBurn = sBurn; S.hot = hot;

  // 运动学
  if (t < LIFT) {
    placeStack();
  } else if (!S.sep) {
    S.explode = 0;
    const tau = t - LIFT;
    S.v = 3.2 * tau + 0.34 * tau * tau;
    S.pitch = clamp((tau - 7) * 0.014, 0, 0.32);
    Q.setFromAxisAngle(ZAX, -S.pitch);
    _up.set(0, 1, 0).applyQuaternion(Q);
    P.addScaledVector(_up, S.v * dt);
    placeStack();
    if (t >= SEP) {
      S.sep = true;
      S.shipV = S.v;
      shipQ.copy(Q);
      boosterVel.copy(_up).multiplyScalar(S.v * 0.97);
    }
  } else if (t < FREEZE) {
    const ts = t - SEP;
    S.shipV += 16 * dt;
    _up.set(0, 1, 0).applyQuaternion(shipQ);
    shipRig.position.addScaledVector(_up, S.shipV * dt);
    boosterVel.multiplyScalar(Math.exp(-0.28 * dt));
    boosterVel.y -= 3.5 * dt;
    boosterRig.position.addScaledVector(boosterVel, dt);
    qFlip.setFromAxisAngle(ZAX, smooth(0.8, 7.5, ts) * Math.PI * 0.92);
    boosterRig.quaternion.copy(Q).multiply(qFlip);
  }

  // 尾焰 / 喷管辉光 / 热分离环
  const alt = Math.max(0, boosterRig.position.y - B_COM - PAD_TOP);
  boosterParts.plume.set(bBurn, 1 + Math.min(alt, 4000) / 1500);
  shipParts.plume.set(sBurn, 1 + Math.min(Math.max(0, shipRig.position.y - 100), 8000) / 2500);
  const be = boosterParts.engines;
  be.glowMat.uniforms.uBurn.value = bBurn; be.glow.visible = bBurn > 0.01;
  for (const c of [shipParts.sl, shipParts.vac]) { c.glowMat.uniforms.uBurn.value = sBurn; c.glow.visible = sBurn > 0.01; }
  if (bBurn > 0.01) gimbal(be, 13, 0.035 * bBurn, time);
  boosterParts.hsInnerMat.emissiveIntensity = hot * 6;

  // 火光
  exitWorld(booster, boosterRig, -8, _tmp);
  fireLight.position.copy(_tmp);
  fireLight.intensity = bBurn * 5000;
  exitWorld(ship, shipRig, -6, _tmp);
  shipFireLight.position.copy(_tmp);
  shipFireLight.intensity = sBurn * 3000;

  // 粒子：发射台烟云
  if (bBurn > 0.05 && alt < 120) {
    const f = 1 - alt / 120;
    for (let n = emitCount(260 * bBurn * f, dt); n > 0; n--) {
      const a = rand() * Math.PI * 2, r = rr(2, 7), sp = rr(18, 42) * (0.5 + 0.5 * f), c = rr(0.55, 0.74);
      spawnSmoke(Math.cos(a) * r, rr(1.5, 5), Math.sin(a) * r, Math.cos(a) * sp, rr(0.5, 5), Math.sin(a) * sp,
        rr(6, 11), rr(6, 10), rr(3, 6), rr(0.35, 0.6), c * 1.15, c * 0.98, c * 0.9, 0.9, 0.45);
    }
    exitWorld(booster, boosterRig, -2, _tmp);
    for (let n = emitCount(70 * bBurn * f, dt); n > 0; n--) {
      spawnSmoke(_tmp.x + rr(-3, 3), _tmp.y, _tmp.z + rr(-3, 3), rr(-4, 4), -rr(20, 35), rr(-4, 4),
        rr(4, 6), rr(4, 6), rr(3, 5), 0.45, 1.25, 0.82, 0.55, 0.6, 0.5);
    }
  }
  // 粒子：上升尾迹
  if (bBurn > 0.2 && alt > 30) {
    const spread = 1 + Math.min(alt, 4000) / 1500;
    exitWorld(booster, boosterRig, -1, _tmp);
    for (let n = emitCount(45, dt); n > 0; n--) {
      const d = rr(22, 60) * spread;
      spawnSmoke(_tmp.x - _dir.x * d + rr(-2, 2), _tmp.y - _dir.y * d, _tmp.z - _dir.z * d + rr(-2, 2), rr(-1, 1), rr(-1, 1), rr(-1, 1),
        rr(7, 12), rr(9, 14) * spread, 3, 0.26, 0.86, 0.72, 0.68, 0.2, 0.3);
    }
  }
  if (sBurn > 0.2) {
    exitWorld(ship, shipRig, 0, _tmp);
    for (let n = emitCount(22, dt); n > 0; n--) {
      const d = rr(25, 55);
      spawnSmoke(_tmp.x - _dir.x * d, _tmp.y - _dir.y * d, _tmp.z - _dir.z * d, rr(-1, 1), rr(-1, 1), rr(-1, 1),
        rr(5, 9), rr(8, 12), 2.5, 0.18, 0.86, 0.74, 0.7, 0, 0.3);
    }
  }
  // 粒子：热分离环喷出的火焰
  if (hot > 0.2 && t < SEP + 0.8) {
    booster.localToWorld(_tmp.set(0, 69.75, 0));
    for (let n = emitCount(420 * hot, dt); n > 0; n--) {
      const a = rand() * Math.PI * 2;
      _tmp2.set(Math.cos(a), 0, Math.sin(a)).applyQuaternion(boosterRig.quaternion);
      const sp = rr(18, 32);
      spawnSmoke(_tmp.x + _tmp2.x * R, _tmp.y + _tmp2.y * R + rr(-1, 1), _tmp.z + _tmp2.z * R,
        _tmp2.x * sp + boosterVel.x * 0.2, _tmp2.y * sp, _tmp2.z * sp,
        rr(1.0, 1.8), rr(2, 3.5), rr(5, 8), 0.85, 1.7, 0.85, 0.38, 0, 1.2);
    }
  }

  // 镜头震动
  const dCam = camera.position.distanceTo(boosterRig.position);
  S.shake = bBurn * 0.9 * clamp(1 - dCam / 500, 0, 1) + hot * 0.4 * clamp(1 - camera.position.distanceTo(shipRig.position) / 400, 0, 1);

  // 遥测
  const altNow = S.sep ? shipRig.position.y - S_COM - PAD_TOP : P.y - PAD_TOP;
  const vNow = S.sep ? S.shipV : S.v;
  const mt = t - LIFT, sgn = mt < 0 ? '-' : '+', am = Math.abs(mt);
  $('tTime').textContent = `T${sgn}${String(Math.floor(am / 60)).padStart(2, '0')}:${String(Math.floor(am % 60)).padStart(2, '0')}`;
  $('tAlt').textContent = (Math.max(0, altNow) / 1000).toFixed(2) + ' km';
  $('tVel').textContent = Math.round(vNow * 3.6).toLocaleString() + ' km/h';
  $('tPhase').textContent = t < IGN ? '终端倒计时' : t < LIFT ? '发动机点火' : !S.sep ? '一级上升' : t < SEP + 3 ? '热分离' : '二级加速 · 助推器返航';
}

/* ---------- 逐帧：待机时的低温蒸汽排放 ---------- */
const VENTS = [
  [booster, new THREE.Vector3(R * 0.99, 61, 0.6), new THREE.Vector3(1, 0, 0)],
  [booster, new THREE.Vector3(-0.8, 58, R * 0.99), new THREE.Vector3(0, 0, 1)],
  [booster, new THREE.Vector3(-R * 0.7, 30, -R * 0.7), new THREE.Vector3(-0.7, 0, -0.7)],
  [booster, new THREE.Vector3(-(R + 0.3), 2.2, 0), new THREE.Vector3(-1, -0.2, 0.3)],
  [ship, new THREE.Vector3(-R * 0.98, 28, 1.2), new THREE.Vector3(-1, 0, 0.2)],
  [ship, new THREE.Vector3(0.6, 3, -R * 0.98), new THREE.Vector3(0, 0, -1)]
];
function updateVents(dt, mult) {
  for (const [obj, p, d] of VENTS) {
    for (let n = emitCount(5 * mult, dt); n > 0; n--) {
      obj.localToWorld(_tmp.copy(p));
      const sp = rr(2, 4.5);
      spawnSmoke(_tmp.x, _tmp.y, _tmp.z, d.x * sp + rr(-0.4, 0.4), d.y * sp + rr(-0.4, 0.4), d.z * sp + rr(-0.4, 0.4),
        rr(2.5, 4.2), rr(0.6, 1.0), rr(1.8, 2.6), 0.42, 0.95, 0.95, 0.98, -0.6, 0.8);
    }
  }
}

function updatePointScale() {
  smokeMat.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
function onResize() {

/* ======================= 主循环 ======================= */
const clock = new THREE.Clock();
let elapsed = 0;
S.shake = 0;
scene.updateMatrixWorld(true);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  if (S.mode === 'idle') {
    S.explode += (S.explodeTarget - S.explode) * Math.min(1, dt * 2.5);
    placeStack();
    updateVents(dt, 1);
    S.shake = 0;
  } else {
    updateLaunch(dt, elapsed);
    if (S.t < LIFT) updateVents(dt, 3);
    followPoint(followNow);
    _tmp.subVectors(followNow, followPrev);
    camera.position.add(_tmp);
    controls.target.add(_tmp);
    followPrev.copy(followNow);
  }

  // 机械臂 / 断接臂
  const armTarget = S.mode === 'launch' && S.t > 0.4 ? 1.05 : 0.55;
  S.armOpen += (armTarget - S.armOpen) * Math.min(1, dt * 1.2);
  towerParts.armL.rotation.y = S.armOpen;
  towerParts.armR.rotation.y = -S.armOpen;
  const qdTarget = S.mode === 'launch' || S.explodeTarget ? 1 : 0;
  S.qd += (qdTarget - S.qd) * Math.min(1, dt * 1.6);
  towerParts.qd.rotation.y = -1.45 * S.qd;
  towerParts.beaconMat.emissiveIntensity = (elapsed % 1.6) < 0.22 ? 7 : 0.5;

  // 襟翼微调
  const flapAct = S.sep ? 0.14 : 0;
  shipParts.flaps.forEach(f => {
    f.hinge.quaternion.setFromAxisAngle(f.axis, Math.sin(elapsed * 0.7 + f.phase) * 0.05 + Math.sin(elapsed * 3 + f.phase) * flapAct);
  });

  // 环境动画
  WATER_NORMAL.offset.x += dt * 0.004;
  WATER_NORMAL.offset.y += dt * 0.0025;
  skyMat.uniforms.uTime.value = elapsed;
  for (const m of plumeMats) m.uniforms.uTime.value = elapsed;
  updateSmoke(dt);

  // 镜头过渡
  if (tween) {
    tween.k += dt / tween.dur;
    const e = easeInOut(Math.min(1, tween.k));
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.k >= 1) tween = null;
  }
  controls.update();
  if (camera.position.y < 1.5) camera.position.y = 1.5;
  sky.position.copy(camera.position);

  // 渲染（带震动偏移）
  const sh = S.shake;
  if (sh > 0.001) _tmp2.set(rr(-1, 1), rr(-1, 1), rr(-1, 1)).multiplyScalar(sh);
  else _tmp2.set(0, 0, 0);
  camera.position.add(_tmp2);
  composer.render();
  labelRenderer.render(scene, camera);
  camera.position.sub(_tmp2);
});
</script>
<script src="../prompt-panel.js" data-id="starship-kiro-opus"></script>
