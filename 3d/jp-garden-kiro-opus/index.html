<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 基础工具 ================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261021);
const rr = (a, b) => a + (b - a) * rand();
const pick = arr => arr[Math.floor(rand() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash3(x, y, z) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1103515245);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise2(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash3(xi, 0, zi), b = hash3(xi + 1, 0, zi), c = hash3(xi, 0, zi + 1), d = hash3(xi + 1, 0, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const pickH = (arr, x, y, z) => arr[Math.floor(hash3(x, y, z) * arr.length)];

/* ================= 体素网格构建器（面剔除 + 顶点 AO） ================= */
const KOFF = 512;
const vkey = (x, y, z) => ((x + KOFF) * 1024 + (y + KOFF)) * 1024 + (z + KOFF);
const AO_LV = [0.5, 0.67, 0.84, 1.0];
const FACES = [];
{
  for (const [ax, s] of [[0, 1], [0, -1], [1, 1], [1, -1], [2, 1], [2, -1]]) {
    const n = [0, 0, 0]; n[ax] = s;
    const b = (ax + 1) % 3, c = (ax + 2) % 3;
    const corners = [[0, 0], [1, 0], [1, 1], [0, 1]].map(([u, v]) => {
      const p = [0, 0, 0]; p[ax] = s > 0 ? 1 : 0; p[b] = u; p[c] = v;
      return { p, du: u ? 1 : -1, dv: v ? 1 : -1 };
    });
    const e1 = [0, 1, 2].map(i => corners[1].p[i] - corners[0].p[i]);
    const e2 = [0, 1, 2].map(i => corners[2].p[i] - corners[0].p[i]);
    const cr = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
    if (cr[0] * n[0] + cr[1] * n[1] + cr[2] * n[2] < 0) corners.reverse(); // 保证逆时针朝外
    FACES.push({ n, b, c, corners });
  }
}
class VoxelSet {
  constructor() { this.m = new Map(); }
  set(x, y, z, c) { this.m.set(vkey(x, y, z), c); }
  get(x, y, z) { return this.m.get(vkey(x, y, z)); }
  has(x, y, z) { return this.m.has(vkey(x, y, z)); }
  del(x, y, z) { this.m.delete(vkey(x, y, z)); }
  box(x0, y0, z0, x1, y1, z1, c) {
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++)
      this.set(x, y, z, typeof c === 'function' ? c(x, y, z) : c);
  }
  build(jitter = 0.06) {
    const pos = [], nor = [], col = [], idx = [];
    const m = this.m, tc = new THREE.Color(), q = [0, 0, 0], aos = [3, 3, 3, 3];
    const solid = () => m.has(vkey(q[0], q[1], q[2])) ? 1 : 0;
    for (const [k, c] of m) {
      const z = (k % 1024) - KOFF, t = Math.floor(k / 1024), y = (t % 1024) - KOFF, x = Math.floor(t / 1024) - KOFF;
      tc.setHex(c);
      const j = 1 + (hash3(x, y, z) - 0.5) * 2 * jitter;
      for (const f of FACES) {
        const nx = x + f.n[0], ny = y + f.n[1], nz = z + f.n[2];
        if (m.has(vkey(nx, ny, nz))) continue;
        const base = pos.length / 3;
        for (let i = 0; i < 4; i++) {
          const cr = f.corners[i];
          pos.push(x + cr.p[0], y + cr.p[1], z + cr.p[2]);
          nor.push(f.n[0], f.n[1], f.n[2]);
          q[0] = nx; q[1] = ny; q[2] = nz; q[f.b] += cr.du; const s1 = solid();
          q[0] = nx; q[1] = ny; q[2] = nz; q[f.c] += cr.dv; const s2 = solid();
          q[0] = nx; q[1] = ny; q[2] = nz; q[f.b] += cr.du; q[f.c] += cr.dv; const s3 = solid();
          const a = (s1 && s2) ? 0 : 3 - (s1 + s2 + s3);
          aos[i] = a;
          const br = AO_LV[a] * j;
          col.push(tc.r * br, tc.g * br, tc.b * br);
        }
        if (aos[0] + aos[2] > aos[1] + aos[3]) idx.push(base + 1, base + 2, base + 3, base + 1, base + 3, base);
        else idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    g.computeBoundingSphere();
    return g;
  }
}
const voxMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const glowMat = new THREE.MeshLambertMaterial({ vertexColors: true, emissive: 0xff9440, emissiveIntensity: 0.05 });
// 构建网格：先平移再缩放
function voxMesh(V, s = 1, t = [0, 0, 0], mat = voxMat, jitter = 0.06) {
  const geo = V.build(jitter);
  geo.translate(t[0], t[1], t[2]).scale(s, s, s);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

/* ================= 渲染器 / 场景 / 相机 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffe1c9, 170, 640);
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 4000);
camera.position.set(64, 50, 80);
if (camera.aspect < 0.8) camera.position.multiplyScalar(1.55);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minDistance = 22;
controls.maxDistance = 240;
controls.maxPolarAngle = Math.PI * 0.53;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.update();
let idleTimer = 0;
controls.addEventListener('start', () => { controls.autoRotate = false; idleTimer = 0; });

// 天空渐变球
const skyU = {
  top: { value: new THREE.Color(0x5fa8f0) },
  mid: { value: new THREE.Color(0xffe1c9) },
  bot: { value: new THREE.Color(0xf6cfd8) }
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `
    varying vec3 vP;
    void main() { vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP;
    void main() {
      float h = vP.y;
      vec3 c = h > 0.0 ? mix(mid, top, pow(clamp(h, 0.0, 1.0), 0.55)) : mix(mid, bot, pow(clamp(-h, 0.0, 1.0), 0.6));
      gl_FragColor = vec4(c, 1.0);
      #include <colorspace_fragment>
    }`
}));
sky.renderOrder = -1;
scene.add(sky);

// 灯光
const hemi = new THREE.HemisphereLight(0xdcecff, 0x8a7a5a, 1.0);
scene.add(hemi);
const SUN_DIR = new THREE.Vector3(0.55, 0.8, 0.35).normalize();
const sun = new THREE.DirectionalLight(0xfff0dc, 2.3);
sun.position.copy(SUN_DIR).multiplyScalar(120);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
{
  const sc = sun.shadow.camera;
  sc.left = -58; sc.right = 58; sc.top = 58; sc.bottom = -58; sc.near = 10; sc.far = 320;
}
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun);

/* ================= 调色板 ================= */
const C = {
  grass: [0x7fb347, 0x8cc152, 0x74a83e, 0x86b94b], dirt: 0x8b6b4a, dirt2: 0x7a5b3d,
  stone: [0x8d8478, 0x7d756a, 0x9a9185], rock: [0x8f8f8f, 0x7e7e80, 0xa3a3a3], moss: 0x5e8c3a,
  sand: 0xcdb98e, pondFloor: 0x6c7a5c, deep: 0x4f5f4c,
  pathA: 0xbdb5a4, pathB: 0xa79f8e, gravel: 0xe9e3d1, groove: 0xd0c7ae,
  red: 0xc0392b, redDark: 0x962d22, black: 0x2b2626, wood: 0x5d4037, woodLight: 0x8d6e63, plank2: 0x7b5a4a,
  white: 0xf3ede0, roof: 0x3f4b55, roof2: 0x36414a, roofEdge: 0x5a6873, gold: 0xd8a31a,
  thatch: [0xc9a66b, 0xb8955a, 0xd4b27a], paper: 0xf7efd9, bark: 0x5d4037, bark2: 0x4e342e,
  pine: [0x2e7d32, 0x1b5e20, 0x388e3c, 0x33691e]
};

/* ================= 世界布局函数 ================= */
const HALF = 30;
function inIsland(x, z) {
  const ax = Math.abs(x + 0.5), az = Math.abs(z + 0.5), r = 7, e = HALF - 0.5 - r;
  const dx = Math.max(0, ax - e), dz = Math.max(0, az - e);
  return dx * dx + dz * dz <= r * r;
}
function hillH(x, z) {
  if (x > -19 && z > -21) return 0;
  const d = Math.hypot(x + 24.5, z + 24.5);
  if (d >= 9) return 0;
  return Math.round(4.5 * Math.pow(1 - d / 9, 0.8));
}
const POND = { cx: -11, cz: 8, rx: 9, rz: 6.5 };
function pondDf(px, pz) {
  const dx = (px - POND.cx) / POND.rx, dz = (pz - POND.cz) / POND.rz;
  const a = Math.atan2(dz, dx);
  const wob = 1 + 0.07 * Math.sin(a * 3 + 1) + 0.04 * Math.sin(a * 5 + 2);
  return Math.sqrt(dx * dx + dz * dz) / wob;
}
const pondD = (x, z) => pondDf(x + 0.5, z + 0.5);
const BX0 = -21, BX1 = -1, ARCH = 3.4;
const bridgeTop = cx => Math.round(ARCH * Math.sin(Math.PI * (cx - BX0 + 0.5) / (BX1 - BX0 + 1)));
const TEA = { x0: -18, x1: -10, z0: -20, z1: -12 };
// 村民行走表面高度
function surfY(x, z) {
  const cx = Math.floor(x), cz = Math.floor(z);
  if (cx >= 6 && cx <= 18 && cz >= -18 && cz <= -6) return 2;
  if (cz === -5 && cx >= 10 && cx <= 14) return 1;
  if (cx >= BX0 && cx <= BX1 && cz >= 7 && cz <= 9) return bridgeTop(cx);
  if (cx >= TEA.x0 && cx <= TEA.x1 && cz >= TEA.z0 && cz <= TEA.z1 + 1) return 1;
  return 0;
}

const G = new VoxelSet();   // 静态世界
const GL = new VoxelSet();  // 夜间发光部件（障子、窗、提灯）
const occ = new Set();
const ck = (x, z) => (x + 512) * 2048 + (z + 512);
const mark = (x, z) => occ.add(ck(x, z));
const isOcc = (x, z) => occ.has(ck(x, z));
function markRect(x0, z0, x1, z1) { for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) mark(x, z); }
function freeRect(x0, z0, x1, z1) {
  for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) if (isOcc(x, z) || !inIsland(x, z)) return false;
  return true;
}

/* ---------- 浮岛地形 ---------- */
for (let x = -HALF; x < HALF; x++) for (let z = -HALF; z < HALF; z++) {
  if (!inIsland(x, z)) continue;
  const ed = HALF - 0.5 - Math.max(Math.abs(x + 0.5), Math.abs(z + 0.5));
  const bottom = -4 - Math.floor(Math.min(ed, 13) * 0.9) - Math.floor(hash3(x, 7, z) * 2.5);
  const top = -1 + hillH(x, z);
  const gn = vnoise2(x * 0.15, z * 0.15);
  for (let y = bottom; y <= top; y++) {
    let c;
    if (y === top) c = gn < 0.35 ? C.grass[2] : gn < 0.6 ? C.grass[0] : gn < 0.8 ? C.grass[1] : C.grass[3];
    else if (y >= top - 2) c = (hash3(x, y, z) < 0.5) ? C.dirt : C.dirt2;
    else c = C.stone[((Math.floor((y + vnoise2(x * 0.2, z * 0.2) * 3) / 2) % 3) + 3) % 3];
    G.set(x, y, z, c);
  }
}

/* ---------- 锦鲤池 ---------- */
for (let x = -22; x <= 1; x++) for (let z = 0; z <= 16; z++) {
  const d = pondD(x, z);
  if (d >= 1) continue;
  mark(x, z);
  const depth = d < 0.45 ? 3 : d < 0.75 ? 2 : 1;
  for (let y = -depth; y <= -1; y++) G.del(x, y, z);
  const fc = d > 0.8 ? C.sand : d > 0.5 ? C.pondFloor : C.deep;
  G.set(x, -1 - depth, z, hash3(x, 3, z) < 0.15 ? pickH(C.rock, x, 1, z) : fc);
}

/* ---------- 小径 ---------- */
const PATHS = [
  { x0: 11, x1: 13, z0: -4, z1: 29, main: true },
  { x0: 0, x1: 10, z0: 7, z1: 9 },
  { x0: -24, x1: -22, z0: -3, z1: 9 },
  { x0: -24, x1: 13, z0: -3, z1: -1 },
  { x0: -15, x1: -13, z0: -10, z1: -4 }
];
for (const p of PATHS) for (let x = p.x0; x <= p.x1; x++) for (let z = p.z0; z <= p.z1; z++) {
  if (!inIsland(x, z)) continue;
  mark(x, z);
  let c;
  if (p.main) c = ((Math.floor((z + 64) / 2) + Math.floor((x + 64) / 2)) % 2) ? C.pathA : C.pathB;
  else c = hash3(x, 9, z) < 0.22 ? C.pathA : (hash3(x, 8, z) < 0.5 ? 0xd9d0bb : 0xcfc5ae);
  G.set(x, -1, z, c);
}

/* ---------- 朱红太鼓桥 ---------- */
for (let cx = BX0; cx <= BX1; cx++) {
  const t = bridgeTop(cx);
  for (let z = 6; z <= 10; z++) mark(cx, z);
  for (let z = 7; z <= 9; z++) G.set(cx, t - 1, z, (cx & 1) ? C.woodLight : C.plank2);
  for (const z of [6, 10]) {
    G.set(cx, t - 1, z, C.red);
    if (t - 2 >= -3) G.set(cx, t - 2, z, C.redDark);
    G.set(cx, t + 1, z, C.red);
    if ((cx - BX0) % 3 === 0 || cx === BX1) G.set(cx, t, z, C.red);
  }
}
for (const z of [6, 10]) {
  G.set(BX0, bridgeTop(BX0) + 2, z, C.gold);
  G.set(BX1, bridgeTop(BX1) + 2, z, C.gold);
  for (const px of [BX0 + 5, BX1 - 5]) for (let y = -3; y <= bridgeTop(px) - 2; y++) G.set(px, y, z, y < -1 ? C.black : C.red);
}

/* ---------- 池边石 ---------- */
function boulder(V, cx, y0, cz, r, h) {
  const R = Math.ceil(r);
  for (let dx = -R; dx <= R; dx++) for (let dz = -R; dz <= R; dz++) {
    const q = (dx * dx + dz * dz) / (r * r);
    if (q > 1) continue;
    const top = Math.max(1, Math.round(h * Math.sqrt(1 - q) + (hash3(cx + dx, 5, cz + dz) - 0.5) * 0.8));
    for (let y = 0; y < top; y++) {
      const isTop = y === top - 1;
      V.set(cx + dx, y0 + y, cz + dz, isTop && hash3(cx + dx, y, cz + dz) < 0.45 ? C.moss : pickH(C.rock, cx + dx, y, cz + dz));
    }
  }
}
for (let x = -23; x <= 2; x++) for (let z = -1; z <= 17; z++) {
  const d = pondD(x, z);
  if (d < 1 || d >= 1.25 || isOcc(x, z) || !inIsland(x, z)) continue;
  if (hash3(x, 11, z) < 0.42) {
    G.set(x, 0, z, pickH(C.rock, x, 0, z));
    if (hash3(x, 12, z) < 0.35) G.set(x, 1, z, hash3(x, 13, z) < 0.5 ? C.moss : pickH(C.rock, x, 1, z));
    mark(x, z);
  }
}

function buildSakura(seed) {
  const R = mulberry32(seed), V = new VoxelSet(), canopies = [];
  const H = 5 + Math.floor(R() * 2);
  for (let y = 0; y <= H; y++) V.set(0, y, 0, y % 2 ? C.bark : C.bark2);
  for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (R() < 0.75) V.set(dx, 0, dz, C.bark2);
  const blob = (cx, cy, cz, r) => {
    canopies.push({ p: new THREE.Vector3(cx, cy + 0.5, cz), r });
    const Rr = Math.ceil(r);
    for (let dx = -Rr; dx <= Rr; dx++) for (let dy = -Rr; dy <= Rr; dy++) for (let dz = -Rr; dz <= Rr; dz++) {
      const d = Math.sqrt(dx * dx + (dy * 1.35) ** 2 + dz * dz);

      const c = dy < -r * 0.35 ? (R() < 0.6 ? 0xf48fb1 : 0xf9a8c6) : PINKS[Math.floor(R() * PINKS.length)];

    const len = 3 + Math.floor(R() * 2);

    for (let s = 1; s <= len; s++) {

      if (s % 2 === 0) y++;

    }

let actx = null, master = null;
function ensureAudio() {

}

  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
let noiseBuf = null;
function noise(dur, type, freq, vol, q = 1, freqEnd = null) {
  if (!actx) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(master);

}

function toggleNight() {
  nightTarget = nightTarget ? 0 : 1;
  btnNight.textContent = nightTarget ? '☀️ 切换白天' : '🌙 切换夜晚';
}
function toggleDragon() {
  dragon.mode = dragon.mode ? 0 : 1;
  btnDragon.textContent = dragon.mode ? '🐉 龙神归天' : '🐉 召唤龙神';
  if (dragon.mode) { ensureAudio(); roar(); }
}
btnNight.addEventListener('click', () => { ensureAudio(); toggleNight(); });
btnDragon.addEventListener('click', toggleDragon);
window.addEventListener('keydown', e => {
  if (e.key === 'n' || e.key === 'N') toggleNight();
  if (e.key === 'd' || e.key === 'D') toggleDragon();
});
const DAY = {
  top: new THREE.Color(0x5fa8f0), mid: new THREE.Color(0xffe1c9), bot: new THREE.Color(0xf6cfd8),
  hemiSky: new THREE.Color(0xdcecff), hemiGround: new THREE.Color(0x8a7a5a), sun: new THREE.Color(0xfff0dc)
};
const NIGHT = {
  top: new THREE.Color(0x060a22), mid: new THREE.Color(0x2b2a55), bot: new THREE.Color(0x14132b),
  hemiSky: new THREE.Color(0x4a5aa0), hemiGround: new THREE.Color(0x1a1a2a), sun: new THREE.Color(0x9fb4ff)
};
function applyNight(n) {
  skyU.top.value.copy(DAY.top).lerp(NIGHT.top, n);
  skyU.mid.value.copy(DAY.mid).lerp(NIGHT.mid, n);
  skyU.bot.value.copy(DAY.bot).lerp(NIGHT.bot, n);
  scene.fog.color.copy(skyU.mid.value);
  hemi.color.copy(DAY.hemiSky).lerp(NIGHT.hemiSky, n);
  hemi.groundColor.copy(DAY.hemiGround).lerp(NIGHT.hemiGround, n);
  hemi.intensity = lerp(1.0, 0.35, n);
  sun.color.copy(DAY.sun).lerp(NIGHT.sun, n);
  sun.intensity = lerp(2.3, 0.45, n);
  stars.material.opacity = n;
  sunSprite.material.opacity = 1 - n;
  moonSprite.material.opacity = n;
  ffMat.opacity = n;
  waterMat.color.setHex(0x4fb0d6).lerp(_col.setHex(0x1d3d66), n);
}

/* ================= 拾取 / 悬停 / 点击 ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tip = document.getElementById('tip');
let hoverDirty = false, hoverX = 0, hoverY = 0, downX = 0, downY = 0, downT = 0, isMouse = true;
function pickAt(cx, cy) {
  pointer.set(cx / window.innerWidth * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(interactives, true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData.ix) o = o.parent;
    // 水面平面延伸到草地下方，只认池内命中
    if (o === water && pondDf(h.point.x, h.point.z) > 1.02) continue;
    if (o) return { ix: o.userData.ix, point: h.point };
  }
  return null;
}
renderer.domElement.addEventListener('pointerdown', e => {
  ensureAudio();
  downX = e.clientX; downY = e.clientY; downT = performance.now();
  isMouse = e.pointerType === 'mouse';
});
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6 || performance.now() - downT > 600) return;
  const r = pickAt(e.clientX, e.clientY);
  if (r) r.ix.onClick(r.point);
});
renderer.domElement.addEventListener('pointermove', e => {
  isMouse = e.pointerType === 'mouse';
  hoverX = e.clientX; hoverY = e.clientY; hoverDirty = true;
});
renderer.domElement.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
let hoverFrame = 0;
function updateHover() {
  if (!hoverDirty || !isMouse || (hoverFrame++ % 3)) return;
  hoverDirty = false;
  const r = pickAt(hoverX, hoverY);
  if (r) {
    tip.textContent = r.ix.label;
    tip.style.display = 'block';
    tip.style.left = (hoverX + 14) + 'px';
    tip.style.top = (hoverY + 12) + 'px';
    renderer.domElement.style.cursor = 'pointer';
  } else {
    tip.style.display = 'none';
    renderer.domElement.style.cursor = 'grab';
  }
}

/* ================= 动画循环 ================= */
const clock = new THREE.Clock();
function updateDragon(dt, time) {
  dragon.k += ((dragon.mode ? 1 : 0) - dragon.k) * Math.min(1, dt * 0.6);
  dragon.boost = Math.max(0, dragon.boost - dt);
  dragon.roar = Math.max(0, dragon.roar - dt);
  dragon.u += dt * 0.042 * (1 + Math.min(1, dragon.boost) * 1.6);
  const u = dragon.u;
  dragonPath(u, _pa); head.position.copy(_pa);
  dragonPath(u + 0.012, _pb); head.lookAt(_pb);
  for (let i = 0; i < DRAGON_N; i++) {
    dragonPath(u - (i + 1) * DU, _pa);
    dragonPath(u - i * DU, _pb);
    segs[i].position.copy(_pa);
    segs[i].lookAt(_pb);
  }
  const open = dragon.roar > 0 ? 0.65 : 0.06 + Math.sin(time * 1.7) * 0.05;
  jaw.rotation.x += (open - jaw.rotation.x) * Math.min(1, dt * 10);
  dragonPath(u + 0.075, _pa);
  pearl.position.copy(_pa).add(_v3.set(0, Math.sin(time * 2.2) * 0.8, 0));
  pearl.rotation.y += dt * 1.5;
  pearl.material.emissiveIntensity = 0.8 + (dragon.roar > 0 ? 1.2 : 0) + Math.sin(time * 4) * 0.15;
}
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  // 昼夜过渡
  night += (nightTarget - night) * Math.min(1, dt * 1.5);
  applyNight(night);
  glowPulse = Math.max(0, glowPulse - dt);
  glowMat.emissiveIntensity = 0.04 + night * 1.25 + glowPulse * 0.8;
  for (const L of lanterns) {
    L.k += ((L.on ? 1 : 0) - L.k) * Math.min(1, dt * 6);
    const fl = 0.9 + Math.sin(time * 9 + L.flick) * 0.05 + Math.sin(time * 23 + L.flick * 2) * 0.05;
    L.fireMat.emissiveIntensity = L.k * (0.25 + night * 1.6) * fl;
    L.light.intensity = L.k * night * 32 * fl;
  }

  updateDragon(dt, time);
  updateFire(dt);
  updateVillagers(dt, time);
  updateKoi(dt, time);
  updateWater(dt, time);
  updateShishi(dt);
  updatePetals(dt, time);
  updateSmoke(dt);
  updateFireflies(time);
  updateRings(dt);
  for (const l of lilies) l.g.position.y = WATER_Y + 0.02 + Math.sin(time * 1.4 + l.phase) * 0.03;
  for (const t of sakuras) {
    t.shake = Math.max(0, t.shake - dt * 0.9);
    t.mesh.rotation.z = Math.sin(time * 0.8 + t.phase) * 0.008 + Math.sin(time * 26) * 0.05 * t.shake;
    t.mesh.rotation.x = Math.cos(time * 0.7 + t.phase) * 0.006 + Math.cos(time * 23) * 0.04 * t.shake;
  }
  for (const b of bamboos) {
    b.mesh.rotation.z = Math.sin(time * 1.2 + b.phase) * b.amp;
    b.mesh.rotation.x = Math.cos(time * 0.9 + b.phase * 1.3) * b.amp * 0.6;
  }
  for (const c of clouds) c.pivot.rotation.y += c.speed * dt;

  // 天空元素跟随相机
  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  sunSprite.position.copy(camera.position).addScaledVector(SUN_DIR, 1400);
  moonSprite.position.copy(sunSprite.position);

  // 闲置后恢复自动旋转
  if (!controls.autoRotate) { idleTimer += dt; if (idleTimer > 10) controls.autoRotate = true; }
  controls.update();
  updateHover();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
