<style>
  :root{
    --ink:#e9e3d3;
    --muted:rgba(219,227,238,.62);
    --gold:#d8b274;
    --cyan:#8ee7f2;
    --glass:rgba(7,16,28,.50);
    --line:rgba(210,226,244,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060d;color:var(--ink);}
  body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif;}
  #scene-container{position:fixed;inset:0;}
  #scene-container canvas{display:block;width:100%;height:100%;touch-action:none;}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:
      radial-gradient(ellipse at 50% 58%, transparent 44%, rgba(0,4,10,.30) 100%),
      linear-gradient(180deg, rgba(0,3,9,.28) 0%, transparent 17%, transparent 76%, rgba(0,3,8,.50) 100%);
    mix-blend-mode:multiply;}
  .grain{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:.055;
    background-image:radial-gradient(rgba(255,255,255,.65) .55px, transparent .8px);
    background-size:3px 3px;}
  header{position:fixed;z-index:8;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;
    padding:clamp(18px,3.1vw,38px) clamp(18px,4vw,54px);pointer-events:none;}
  .brand{pointer-events:none;max-width:min(52vw,500px);}
  .brand .eyebrow{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:10px;letter-spacing:.40em;font-weight:500;text-shadow:0 1px 12px #000;}
  .brand .eyebrow::before{content:"";display:block;width:28px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);}
  .brand h1{font-family:"Songti SC","STSong","Noto Serif CJK SC","Times New Roman",serif;font-weight:500;
    font-size:clamp(26px,4vw,54px);letter-spacing:.20em;line-height:1.08;margin:11px 0 7px;color:#f3ebd8;
    text-shadow:0 2px 26px rgba(0,0,0,.75),0 0 44px rgba(140,200,255,.10);}
  .brand p{margin:0;color:var(--muted);font-size:clamp(9px,1.05vw,12px);letter-spacing:.25em;line-height:1.7;}
  .ui-actions{display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;}
  button{appearance:none;border:1px solid var(--line);background:linear-gradient(180deg,rgba(11,24,40,.64),rgba(5,12,22,.48));
    color:#d8e6f1;padding:10px 17px;border-radius:2px;font-size:12px;letter-spacing:.14em;cursor:pointer;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:border-color .25s,background .25s,color .25s,transform .2s;
    box-shadow:0 8px 28px rgba(0,0,0,.20),inset 0 1px rgba(255,255,255,.04);}
  button:hover{border-color:rgba(216,178,116,.62);color:#fff0d4;background:linear-gradient(180deg,rgba(24,38,51,.72),rgba(7,15,26,.55));}
  button:active{transform:translateY(1px);}
  button.active{border-color:rgba(216,178,116,.70);color:#f2d49c;}
  button .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cyan);margin-right:8px;
    box-shadow:0 0 10px var(--cyan);vertical-align:1px;}
  button.active .dot{background:var(--gold);box-shadow:0 0 12px var(--gold);}
  footer{position:fixed;z-index:8;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:flex-end;gap:18px;
    padding:0 clamp(18px,4vw,54px) calc(22px + env(safe-area-inset-bottom));pointer-events:none;}
  .footer-spacer{min-width:1px;}
  .shot-readout{min-width:160px;text-align:center;}
  .shot-index{font-size:9px;letter-spacing:.34em;color:var(--gold);margin-bottom:6px;}
  .shot-name{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:clamp(15px,1.55vw,20px);letter-spacing:.20em;color:#f0e8da;
    text-shadow:0 2px 20px #000;}
  .progress-wrap{position:fixed;z-index:8;left:0;right:0;bottom:0;height:2px;background:rgba(190,220,255,.11);pointer-events:none;}
  #progress-fill{height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);
    background:linear-gradient(90deg,rgba(113,209,229,.18),rgba(181,235,246,.85) 60%,#f6e5be);box-shadow:0 0 12px rgba(150,225,240,.55);}
  .timecode{font-variant-numeric:tabular-nums;text-align:right;min-width:120px;justify-self:end;color:rgba(225,235,246,.70);font-size:10px;letter-spacing:.2em;line-height:1.6;}
  .timecode strong{color:#f0e8da;font-weight:400;font-size:12px;}
  #free-hint{position:fixed;z-index:7;left:50%;bottom:92px;transform:translate(-50%,8px);opacity:0;pointer-events:none;
    border:1px solid rgba(174,225,239,.18);background:rgba(4,12,21,.55);backdrop-filter:blur(10px);
    padding:8px 15px;border-radius:2px;color:rgba(218,232,241,.78);font-size:10px;letter-spacing:.13em;white-space:nowrap;
    transition:opacity .4s,transform .4s;}
  #free-hint.show{opacity:1;transform:translate(-50%,0);}
  #fade{position:fixed;inset:0;z-index:20;background:#010307;pointer-events:none;opacity:0;}
  #loading{position:fixed;inset:0;z-index:30;background:#02060d;display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity 1.1s ease;letter-spacing:.36em;color:rgba(219,229,240,.55);font-size:10px;}
  #loading.hidden{opacity:0;pointer-events:none;}
  #loading .mark{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:clamp(22px,4vw,38px);letter-spacing:.34em;
    color:#eee6d7;margin-bottom:20px;text-indent:.34em;}
  #loading .rule{width:128px;height:1px;background:linear-gradient(90deg,transparent,rgba(216,178,116,.7),transparent);margin-bottom:22px;}
  #loading .spinner{width:58px;height:1px;background:rgba(160,220,240,.12);overflow:hidden;margin-top:16px;}
  #loading .spinner::after{content:"";display:block;width:45%;height:100%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    animation:sweep 1.5s ease-in-out infinite;}
  @keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(240%)}}
  .webgl-error{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:#02060d;color:#ded6c8;padding:30px;text-align:center;line-height:2;letter-spacing:.1em;}
  @media (max-width:760px){
    header{padding:16px 16px 0;}
    .brand{max-width:62vw;}
    .brand h1{letter-spacing:.13em;font-size:clamp(23px,7vw,36px);}
    .brand p{letter-spacing:.14em;}
    .ui-actions{gap:7px;}
    button{padding:8px 11px;font-size:10px;letter-spacing:.08em;}
    footer{padding:0 16px calc(17px + env(safe-area-inset-bottom));gap:10px;}
    .shot-readout{min-width:0;}
    .shot-name{letter-spacing:.1em;font-size:14px;}
    .timecode{min-width:78px;font-size:9px;letter-spacing:.08em;}
    #free-hint{font-size:9px;bottom:78px;}
  }
  @media (max-width:460px){
    .brand p{display:none;}
    .brand .eyebrow{font-size:8px;letter-spacing:.25em;}
    .ui-actions{position:fixed;right:12px;top:12px;}
    .brand h1{margin-top:14px;}
    .ui-actions button{padding:7px 9px;background:rgba(3,10,18,.55);}
    footer{gap:6px;}
  }

{

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------ *
 *  基础常量 / 数学
 * ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const R = 185;
const TRACK_START = -430;
const TRACK_END = 440;
const LOOP_TIME = 25;
const SUN_DIR = new THREE.Vector3(-0.82, 0.13, -0.56).normalize();
const HORIZON = new THREE.Color(0x081628);
const ZENITH = new THREE.Color(0x01040c);

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoother = (t) => {
  t = clamp(t, 0, 1);
  return t * t * t * (t * (t * 6 - 15) + 10);
};
const qbez = (a, b, c, t, out = new THREE.Vector3()) => {
  const it = 1 - t;
  return out.set(
    it * it * a.x + 2 * it * t * b.x + t * t * c.x,
    it * it * a.y + 2 * it * t * b.y + t * t * c.y,
    it * it * a.z + 2 * it * t * b.z + t * t * c.z
  );
};
const arcPos = (s, lat = 0, y = 0, out = new THREE.Vector3()) => {
  const th = s / R;
  return out.set((R + lat) * Math.sin(th), y, (R + lat) * Math.cos(th) - R);
};
const arcRadial = (s, out = new THREE.Vector3()) => {
  const th = s / R;
  return out.set(Math.sin(th), 0, Math.cos(th));
};
const arcTangent = (s, out = new THREE.Vector3()) => {
  const th = s / R;
  return out.set(Math.cos(th), 0, -Math.sin(th));
};
const randRange = (rand, a, b) => a + (b - a) * rand();
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ------------------------------------------------------------------ *
 *  渲染器 / 相机 / 后期
 * ------------------------------------------------------------------ */
const container = document.getElementById('scene-container');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
} catch (err) {
  document.getElementById('webgl-error').style.display = 'grid';
  document.getElementById('loading').classList.add('hidden');
  throw err;
}
const DPR = Math.min(window.devicePixelRatio || 1, window.innerWidth < 760 ? 1.45 : 1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.80;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(HORIZON.clone(), 0.00062);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 9500);
camera.position.set(105, 95, 200);

const mainTarget = new THREE.WebGLRenderTarget(
  Math.max(2, Math.floor(window.innerWidth * DPR)),
  Math.max(2, Math.floor(window.innerHeight * DPR)),
  { type: THREE.HalfFloatType, samples: window.innerWidth < 760 ? 0 : 2 }
);
mainTarget.texture.colorSpace = THREE.LinearSRGBColorSpace;
const composer = new EffectComposer(renderer, mainTarget);
composer.setPixelRatio(DPR);
composer.setSize(window.innerWidth, window.innerHeight);
const renderPass = new RenderPass(scene, camera);
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.30, 0.15, 1.30
);
const outputPass = new OutputPass();
composer.addPass(renderPass);
composer.addPass(bloomPass);
composer.addPass(outputPass);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled = false;
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.enablePan = false;
controls.minDistance = 3;
controls.maxDistance = 950;
controls.minPolarAngle = 0.03;
controls.maxPolarAngle = Math.PI * 0.94;
controls.zoomSpeed = 0.65;
controls.rotateSpeed = 0.55;

/* ------------------------------------------------------------------ *
 *  Canvas 程序化贴图
 * ------------------------------------------------------------------ */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTexture(canvas, { srgb = true, wrap = true } = {}) {
  const tex = new THREE.CanvasTexture(canvas);
  if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
  if (wrap) {
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
  }
  tex.anisotropy = Math.min(8, maxAniso);
  return tex;
}

function createGlowTexture(inner = 0.05, mid = 0.25, size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(inner, 'rgba(255,255,255,.98)');
  g.addColorStop(mid, 'rgba(255,255,255,.34)');
  g.addColorStop(0.62, 'rgba(255,255,255,.09)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return canvasTexture(c);
}

const glowTex = createGlowTexture(0.04, 0.22, 256);
const softGlowTex = createGlowTexture(0.02, 0.11, 512);

function createCloudTexture(seed) {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const rand = mulberry32(seed);
  ctx.clearRect(0, 0, size, size);
  // A soft central mass, built from overlapping noisy cauliflower lobes.
  for (let i = 0; i < 48; i++) {
    const a = rand() * TAU;
    const rr = Math.pow(rand(), 0.62) * size * 0.22;
    const x = size * 0.5 + Math.cos(a) * rr;
    const y = size * 0.52 + Math.sin(a) * rr * 0.78;
    const radius = size * (0.075 + rand() * 0.155);
    const g = ctx.createRadialGradient(x, y, radius * 0.02, x, y, radius);
    const alpha = 0.095 + rand() * 0.19;
    g.addColorStop(0, `rgba(255,255,255,${alpha})`);
    g.addColorStop(0.36, `rgba(255,255,255,${alpha * 0.78})`);
    g.addColorStop(0.72, `rgba(255,255,255,${alpha * 0.30})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
  }
  // Fade the outer rim so billboards never show a square edge.
  const edge = ctx.createRadialGradient(size / 2, size / 2, size * 0.16, size / 2, size / 2, size * 0.49);
  edge.addColorStop(0, 'rgba(0,0,0,0)');
  edge.addColorStop(0.78, 'rgba(0,0,0,.10)');
  edge.addColorStop(1, 'rgba(0,0,0,.72)');
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = edge;
  ctx.fillRect(0, 0, size, size);
  ctx.globalCompositeOperation = 'source-over';
  return canvasTexture(c);
}
const cloudTextures = [createCloudTexture(19), createCloudTexture(77), createCloudTexture(108), createCloudTexture(311)];

function createTowerTexture(seed) {
  // A soft, fractal cumulonimbus "ghost" silhouette. It is rendered as one
  // billboard behind the particle stack to keep the tower's vertical read.
  const w = 512, h = 1024;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const rand = mulberry32(seed);
  ctx.clearRect(0, 0, w, h);
  for (let i = 0; i < 250; i++) {
    let v;
    const kind = rand();
    if (kind < 0.2) v = Math.pow(rand(), 0.75) * 0.20;
    else if (kind < 0.78) v = 0.14 + rand() * 0.60;
    else v = 0.73 + rand() * 0.27;
    let width;
    if (v < 0.24) width = lerp(112, 76, v / 0.24);
    else if (v < 0.62) width = lerp(76, 55, (v - 0.24) / 0.38);
    else width = lerp(55, 210, Math.pow((v - 0.62) / 0.38, 1.35));
    const y = h * (1 - v);
    const x = w * 0.5 + (rand() - 0.5) * width * 1.55;
    const radius = (w * (0.035 + rand() * 0.11)) * (v > 0.78 ? 1.7 : 1.0);
    const a = (v > 0.78 ? 0.055 : 0.035) + rand() * 0.075;
    const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    g.addColorStop(0, `rgba(255,255,255,${a})`);
    g.addColorStop(0.55, `rgba(255,255,255,${a * 0.55})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }
  // Clean up the rectangular bounds of the billboard.
  const edge = ctx.createLinearGradient(0, 0, 0, h);
  edge.addColorStop(0, 'rgba(0,0,0,0)');
  edge.addColorStop(0.1, 'rgba(0,0,0,.04)');
  edge.addColorStop(0.95, 'rgba(0,0,0,.7)');
  edge.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = edge;
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'source-over';
  return canvasTexture(c);
}
const towerTextures = [createTowerTexture(712), createTowerTexture(1201), createTowerTexture(3901)];

function createBrickTextures() {
  const size = 512;
  const col = document.createElement('canvas');
  col.width = col.height = size;
  const ctx = col.getContext('2d');
  const rgh = document.createElement('canvas');
  rgh.width = rgh.height = size;
  const rctx = rgh.getContext('2d');
  const rand = mulberry32(618);
  ctx.fillStyle = '#11171d';
  ctx.fillRect(0, 0, size, size);
  rctx.fillStyle = '#9d9d9d';
  rctx.fillRect(0, 0, size, size);
  const rows = 17, cols = 7;
  const bh = size / rows, bw = size / cols;
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) * bw * 0.5;
    for (let cIdx = -1; cIdx < cols + 1; cIdx++) {
      const x = cIdx * bw + off;
      const y = r * bh;
      const l = 17 + rand() * 8;
      ctx.fillStyle = `hsl(${206 + rand() * 12} 13% ${l}%)`;
      ctx.fillRect(x + 1.6, y + 1.4, bw - 3.2, bh - 2.8);
      ctx.fillStyle = `rgba(156,184,192,${0.012 + rand() * 0.03})`;
      ctx.fillRect(x + 2.5, y + 2.1, bw - 5, 1.1);
      for (let i = 0; i < 7; i++) {
        ctx.fillStyle = `rgba(${rand() > 0.5 ? '180,205,210' : '0,3,8'},${0.01 + rand() * 0.045})`;
        ctx.fillRect(x + rand() * bw, y + rand() * bh, 1 + rand() * 5, 1 + rand() * 2);
      }
      rctx.fillStyle = `rgb(${118 + rand() * 25},${118 + rand() * 25},${118 + rand() * 25})`;
      rctx.fillRect(x + 1.2, y + 1.2, bw - 2.4, bh - 2.4);
    }
  }
  // wet patches / puddles: very low roughness near black in the roughness map
  for (let i = 0; i < 14; i++) {
    const x = rand() * size, y = rand() * size;
    const rx = 18 + rand() * 66, ry = 8 + rand() * 35;
    const g = rctx.createRadialGradient(x, y, 1, x, y, Math.max(rx, ry));
    g.addColorStop(0, 'rgba(2,2,2,.98)');
    g.addColorStop(0.42, 'rgba(16,16,16,.88)');
    g.addColorStop(0.76, 'rgba(66,66,66,.55)');

function createRingTexture() {
  const w = 1024, h = 16;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const rand = mulberry32(992);
  ctx.clearRect(0, 0, w, h);
  for (let x = 0; x < w; x++) {
    const t = x / w;
    // broad radial bands, fine striations, Cassini division and outer fade
    let a = 0.47 + 0.22 * Math.sin(t * 43.0) + 0.11 * Math.sin(t * 137.0 + 1.7);
    a *= 0.55 + 0.45 * Math.sin(t * 22.0 + 0.4);
    if (t < 0.09) a *= smoothstep01(t / 0.09);
    if (t < 0.17) a *= 0.22;
    if (t > 0.74 && t < 0.80) a *= 0.035;        // Cassini division
    if (t > 0.90 && t < 0.925) a *= 0.10;         // Encke-like gap
    if (t > 0.95) a *= smoothstep01((1 - t) / 0.05) * 0.8;
    a = clamp(a, 0, 0.78);
    const shade = 0.70 + rand() * 0.18;
    ctx.fillStyle = `rgba(${Math.floor(222 * shade)},${Math.floor(196 * shade)},${Math.floor(147 * shade)},${a})`;
    ctx.fillRect(x, 0, 1, h);

      // Deep, almost black-blue zenith fading to a softer navy at the horizon.
      float h = smoothstep(-0.10, 0.92, up);
      vec3 col = mix(uHorizon, uZenith, pow(h, 0.64));

      star *= step(0.986, rnd) * smoothstep(0.01, 0.18, up);

function makeRingGeometry(inner, outer, segments) {
  const positions = [], uvs = [], indices = [];
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * TAU;
    const ca = Math.cos(a), sa = Math.sin(a);
    positions.push(Math.cos(a) * inner, Math.sin(a) * inner, 0);
    positions.push(Math.cos(a) * outer, Math.sin(a) * outer, 0);
    uvs.push(0, i / segments, 1, i / segments);
    if (i < segments) {
      const j = i * 2;
      indices.push(j, j + 1, j + 3, j, j + 3, j + 2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

function sortCloudSprites() {
  const cp = camera.position;
  for (const s of cloudSortList) {
    s.userData.dist = s.position.distanceToSquared(cp);
  }
  cloudSortList.sort((a, b) => b.userData.dist - a.userData.dist);
  for (let i = 0; i < cloudSortList.length; i++) cloudSortList[i].renderOrder = 20 + i;

  for (const p of cloudPuffs) {
    const dx = p.x - cp.x, dy = p.y - cp.y, dz = p.z - cp.z;
    p.dist = dx * dx + dy * dy + dz * dz;
  }
  cloudPuffs.sort((a, b) => b.dist - a.dist);
  camera.updateMatrixWorld();
  _cloudRight.setFromMatrixColumn(camera.matrixWorld, 0);
  _cloudUp.setFromMatrixColumn(camera.matrixWorld, 1);
  cloudInstMat.uniforms.uCamRight.value.copy(_cloudRight);
  cloudInstMat.uniforms.uCamUp.value.copy(_cloudUp);
  const posArr = cloudInstPos.array;
  const scaleArr = cloudInstScale.array;
  const colorArr = cloudInstColor.array;
  const opArr = cloudInstOpacity.array;
  const rotArr = cloudInstRot.array;
  for (let i = 0; i < cloudPuffs.length; i++) {
    const p = cloudPuffs[i];
    posArr[i * 3] = p.x;
    posArr[i * 3 + 1] = p.y;
    posArr[i * 3 + 2] = p.z;
    scaleArr[i * 2] = p.sx;
    scaleArr[i * 2 + 1] = p.sy;
    colorArr[i * 3] = p.color.r;
    colorArr[i * 3 + 1] = p.color.g;
    colorArr[i * 3 + 2] = p.color.b;
    opArr[i] = p.opacity;
    rotArr[i] = p.rot;
  }
  cloudInstPos.needsUpdate = true;
  cloudInstScale.needsUpdate = true;
  cloudInstColor.needsUpdate = true;
  cloudInstOpacity.needsUpdate = true;
  cloudInstRot.needsUpdate = true;
}

function sweptBoxGeometry(lat, yCenter, width, height, s0, s1, step, uScale = 1) {
  const n = Math.max(1, Math.ceil((s1 - s0) / step));
  const positions = [], normals = [], uvs = [], indices = [];
  const halfW = width * 0.5, halfH = height * 0.5;
  const pushQuad = (verts, normal, u0, u1, v0, v1) => {
    const base = positions.length / 3;
    for (let k = 0; k < 4; k++) {
      positions.push(verts[k].x, verts[k].y, verts[k].z);
      normals.push(normal.x, normal.y, normal.z);
    }
    uvs.push(u0, v0, u1, v0, u1, v1, u0, v1);
    indices.push(base, base + 1, base + 2, base, base + 2, base + 3);
  };
  for (let i = 0; i < n; i++) {
    const sa = s0 + (i / n) * (s1 - s0);
    const sb = s0 + ((i + 1) / n) * (s1 - s0);
    const tha = sa / R, thb = sb / R;
    const pa = arcPos(sa, lat, yCenter);
    const pb = arcPos(sb, lat, yCenter);
    const ra = new THREE.Vector3(Math.sin(tha), 0, Math.cos(tha));
    const rb = new THREE.Vector3(Math.sin(thb), 0, Math.cos(thb));
    const at = pa.clone().addScaledVector(_up, halfH);
    const ab = pa.clone().addScaledVector(_up, -halfH);
    const ato = at.clone().addScaledVector(ra, halfW);
    const ati = at.clone().addScaledVector(ra, -halfW);
    const abo = ab.clone().addScaledVector(ra, halfW);
    const abi = ab.clone().addScaledVector(ra, -halfW);
    const bt = pb.clone().addScaledVector(_up, halfH);
    const bb = pb.clone().addScaledVector(_up, -halfH);
    const bto = bt.clone().addScaledVector(rb, halfW);
    const bti = bt.clone().addScaledVector(rb, -halfW);
    const bbo = bb.clone().addScaledVector(rb, halfW);
    const bbi = bb.clone().addScaledVector(rb, -halfW);
    const u0 = (sa - s0) * uScale;
    const u1 = (sb - s0) * uScale;
    const v0 = 0, v1 = Math.max(width, height) * uScale;
    pushQuad([ato, bto, bti, ati], _up, u0, u1, v0, v1);                // top
    pushQuad([abo, bbo, bto, ato], ra, u0, u1, 0, v1);                  // outer flank
    pushQuad([abi, ati, bti, bbi], ra.clone().negate(), u0, u1, 0, v1); // inner flank
    pushQuad([abo, abi, bbi, bbo], _up.clone().negate(), u0, u1, 0, v1); // underside
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  return g;
}

// Curved ribs: double semicircular arches with radial spandrel webs and cast-iron columns.
{
  const ironParts = [];
  const ribS = [];
  for (let s = S0; s <= S1 + 0.01; s += 5) ribS.push(s);
  class ArchCurve extends THREE.Curve {
    constructor(radius, footY) { super(); this.radius = radius; this.footY = footY; }
    getPoint(t, target = new THREE.Vector3()) {
      const a = t * Math.PI;
      return target.set(0, this.footY + Math.sin(a) * this.radius, Math.cos(a) * this.radius);
    }
  }
  const curveOuter = new ArchCurve(10, 4);
  const curveInner = new ArchCurve(9.28, 4.08);
  for (const s of ribS) {
    const world = new THREE.Matrix4().makeRotationY(s / R).setPosition(arcPos(s, 0, 0));
    const outer = new THREE.TubeGeometry(curveOuter, 40, 0.115, 5, false);
    outer.applyMatrix4(world);
    ironParts.push(outer);
    const inner = new THREE.TubeGeometry(curveInner, 36, 0.055, 4, false);
    inner.applyMatrix4(world);
    ironParts.push(inner);
    // radial webs between the double arch rings
    for (let k = 0; k <= 12; k++) {
      const a = 0.10 + (k / 12) * (Math.PI - 0.20);
      const ro = 10.0, ri = 9.24;
      const p1 = worldLocal(s, 0, 4 + Math.sin(a) * ro, Math.cos(a) * ro);
      const p2 = worldLocal(s, 0, 4.06 + Math.sin(a) * ri, Math.cos(a) * ri);
      ironParts.push(cylinderWorld(p1, p2, 0.038, 4));
    }
    // column pairs and capitals
    for (const side of [-1, 1]) {
      const top = worldLocal(s, 0, 4.1, side * 10);
      const bot = worldLocal(s, 0, 0.88, side * 10);
      ironParts.push(cylinderWorld(bot, top, 0.17, 8));
      // ornate base + capital
      const base = new THREE.CylinderGeometry(0.34, 0.49, 0.30, 10);
      const bpos = worldLocal(s, 0, 1.05, side * 10);
      base.translate(bpos.x, bpos.y, bpos.z);
      ironParts.push(base);
      const cap = new THREE.CylinderGeometry(0.30, 0.20, 0.28, 10);
      const cpos = worldLocal(s, 0, 3.94, side * 10);
      cap.translate(cpos.x, cpos.y, cpos.z);
      ironParts.push(cap);
      // decorative ring brackets
      const ring1 = new THREE.TorusGeometry(0.26, 0.035, 4, 14);
      ring1.rotateX(Math.PI / 2);
      const r1p = worldLocal(s, 0, 2.65, side * 10);
      ring1.translate(r1p.x, r1p.y, r1p.z);
      ironParts.push(ring1);
      const ring2 = ring1.clone();
      const r2p = worldLocal(s, 0, 1.72, side * 10);
      ring2.translate(r2p.x, r2p.y, r2p.z);
      ironParts.push(ring2);
    }
    // apex finial
    const fin = new THREE.CylinderGeometry(0.035, 0.13, 0.7, 7);
    fin.translate(worldLocal(s, 0, 14.45, 0).x, 14.45, worldLocal(s, 0, 14.45, 0).z);
    ironParts.push(fin);
  }
  // longitudinal eave beams and segmental purlins
  class ArcLineCurve extends THREE.Curve {
    constructor(lat, y) { super(); this.lat = lat; this.y = y; }
    getPoint(t, target = new THREE.Vector3()) {
      const s = lerp(S0, S1, t);
      return arcPos(s, this.lat, this.y, target);
    }
  }
  for (const side of [-1, 1]) {
    const curve = new ArcLineCurve(side * 10, 4.08);
    ironParts.push(new THREE.TubeGeometry(curve, 46, 0.075, 4, false));
  }
  for (let i = 1; i <= 9; i++) {
    const a = Math.PI * (i / 10);
    const lat = Math.cos(a) * 9.7;
    const y = 4 + Math.sin(a) * 9.7;
    const curve = new ArcLineCurve(lat, y);
    ironParts.push(new THREE.TubeGeometry(curve, 46, 0.035, 3, false));
  }
  // station end frames
  for (const sEnd of [S0, S1]) {
    const world = new THREE.Matrix4().makeRotationY(sEnd / R).setPosition(arcPos(sEnd, 0, 0));
    const outer = new THREE.TubeGeometry(curveOuter, 30, 0.11, 4, false);
    outer.applyMatrix4(world);
    ironParts.push(outer);
  }
  const ironMesh = new THREE.Mesh(mergeAll(ironParts), matIron);
  ironMesh.castShadow = true;
  ironMesh.receiveShadow = true;
  scene.add(ironMesh);
}

// Glass barrel vault
{
  const ss = [];
  for (let i = 0; i <= 32; i++) ss.push(lerp(S0, S1, i / 32));
  const angles = [];
  const aN = 22;
  for (let j = 0; j <= aN; j++) angles.push(0.035 + (j / aN) * (Math.PI - 0.07));
  const pos = [], uvs = [], idx = [];
  for (let j = 0; j < ss.length; j++) {
    const s = ss[j];
    for (let i = 0; i < angles.length; i++) {
      const a = angles[i];
      const p = worldLocal(s, 0, 4 + Math.sin(a) * 10.02, Math.cos(a) * 10.02);
      pos.push(p.x, p.y, p.z);
      uvs.push((s - S0) / 8, (i / aN) * 4);
    }
  }
  const row = angles.length;
  for (let j = 0; j < ss.length - 1; j++) {
    for (let i = 0; i < angles.length - 1; i++) {
      const a = j * row + i;
      const b = a + 1;
      const c = a + row;
      const d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const glass = new THREE.Mesh(g, matGlass);
  glass.renderOrder = 4;
  scene.add(glass);
}

function makeStationSign(s) {
  const group = new THREE.Group();
  group.position.copy(arcPos(s, 0, 0));
  group.rotation.y = s / R;
  const signMaterial = new THREE.MeshBasicMaterial({ map: signTex, side: THREE.FrontSide, transparent: false });
  const board = new THREE.Mesh(new THREE.PlaneGeometry(4.1, 1.28), signMaterial);
  board.position.set(0.035, 7.55, 0);
  board.rotation.y = Math.PI / 2;
  group.add(board);
  // a second unmirrored face for viewers approaching from the other side
  const boardBack = new THREE.Mesh(new THREE.PlaneGeometry(4.1, 1.28), signMaterial);
  boardBack.position.set(-0.035, 7.55, 0);
  boardBack.rotation.y = -Math.PI / 2;
  group.add(boardBack);
  // a true open frame: four thin brass bars, never a blank box over the lettering
  for (const [w, h, d, x, y, z] of [
    [0.11, 0.10, 4.30, 0, 8.23, 0],
    [0.11, 0.10, 4.30, 0, 6.87, 0],
    [0.11, 1.48, 0.10, 0, 7.55, -2.11],
    [0.11, 1.48, 0.10, 0, 7.55, 2.11]
  ]) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matBrassDark);
    bar.position.set(x, y, z);
    group.add(bar);
  }
  const topBar = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.10, 4.5), matIron);
  topBar.position.set(0, 8.34, 0);
  group.add(topBar);
  for (const z of [-1.65, 1.65]) {
    const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.2, 4), matIronSoft);
    chain.position.set(0, 8.84, z);
    group.add(chain);
  }
  scene.add(group);
}

});

function newBucket() { return new Map(); }
function addPart(bucket, material, geometry) {
  if (!bucket.has(material)) bucket.set(material, []);
  bucket.get(material).push(geometry);
  return geometry;
}
function addBoxPart(bucket, material, w, h, d, x, y, z, rx = 0, ry = 0, rz = 0) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (rx || ry || rz) g.rotateX(rx), g.rotateY(ry), g.rotateZ(rz);
  g.translate(x, y, z);
  return addPart(bucket, material, g);
}
function addCylPart(bucket, material, rt, rb, len, x, y, z, axis = 'x', segments = 16) {
  const g = new THREE.CylinderGeometry(rt, rb, len, segments, 1, false);
  if (axis === 'x') g.rotateZ(-Math.PI / 2);
  else if (axis === 'z') g.rotateX(Math.PI / 2);
  g.translate(x, y, z);
  return addPart(bucket, material, g);
}
function addTorusPart(bucket, material, radius, tube, x, y, z, axis = 'x', segments = 24) {
  const g = new THREE.TorusGeometry(radius, tube, 6, segments);
  if (axis === 'x') g.rotateY(Math.PI / 2);
  else if (axis === 'y') g.rotateX(Math.PI / 2);
  g.translate(x, y, z);
  return addPart(bucket, material, g);
}
function addSpherePart(bucket, material, radius, x, y, z, sx = 1, sy = 1, sz = 1, seg = 14) {
  const g = new THREE.SphereGeometry(radius, seg, Math.max(6, Math.round(seg * 0.7)));
  if (sx !== 1 || sy !== 1 || sz !== 1) g.scale(sx, sy, sz);
  g.translate(x, y, z);
  return addPart(bucket, material, g);
}
function bakeBucket(group, bucket, cast = true) {
  for (const [material, list] of bucket) {
    if (!list.length) continue;
    const geo = mergeAll(list);
    const mesh = new THREE.Mesh(geo, material);
    const transparent = material.transparent === true;
    mesh.castShadow = cast && !transparent;
    mesh.receiveShadow = !transparent;
    group.add(mesh);
  }
}

const DRIVE_WHEEL_R = 1.05;
const PILOT_WHEEL_R = 0.56;
const DRIVE_XS = [1.70, 0.10, -1.50];

const ROD_Z = 1.49;

function createSpokedWheel(radius, material, spokes = 12, crank = true) {
  const geos = [];
  const tire = new THREE.TorusGeometry(radius * 0.94, radius * 0.075, 7, 30);
  geos.push(tire);
  const inner = new THREE.TorusGeometry(radius * 0.62, radius * 0.025, 5, 24);
  geos.push(inner);
  for (let i = 0; i < spokes; i++) {
    const a = (i / spokes) * TAU;
    const spoke = new THREE.BoxGeometry(radius * 0.66, radius * 0.048, radius * 0.055);
    spoke.translate(radius * 0.5, 0, 0);
    spoke.rotateZ(a);
    geos.push(spoke);
  }
  const hub = new THREE.CylinderGeometry(radius * 0.16, radius * 0.16, radius * 0.28, 10);
  hub.rotateX(Math.PI / 2);
  geos.push(hub);
  if (crank) {
    const counter = new THREE.BoxGeometry(radius * 0.40, radius * 0.28, radius * 0.20);
    counter.translate(-radius * 0.55, -radius * 0.35, 0);
    geos.push(counter);
  }
  const g = mergeAll(geos);
  const mesh = new THREE.Mesh(g, material);
  mesh.castShadow = true;
  return mesh;
}

    addPart(bucket, matTrainBrass, hr);
    // pipework

    pipe.rotateZ(-Math.PI / 2);
    pipe.translate(1.5, 1.65, side * 1.34);
    addPart(bucket, matTrainBrass, pipe);
  }
  // buffer beam details
  addBoxPart(bucket, matTrainRed, 0.20, 0.23, 1.30, 4.51, 0.68, 0);
  addBoxPart(bucket, matTrainBlack, 0.22, 0.09, 1.0, 4.55, 1.18, 0);

  // boiler
  addCylPart(bucket, matPeacock, 1.12, 1.12, 4.55, 0.68, 2.62, 0, 'x', 28);
  addCylPart(bucket, matTrainBlack, 1.17, 1.17, 1.05, 3.45, 2.62, 0, 'x', 24);
  addCylPart(bucket, matTrainBlack, 1.08, 1.08, 0.10, 4.02, 2.62, 0, 'x', 24);
  addTorusPart(bucket, matSilver, 1.02, 0.035, 4.08, 2.62, 0, 'x', 28);
  // brass boiler bands
  for (const x of [-0.9, 0.25, 1.4, 2.65, 3.92]) {
    addTorusPart(bucket, matTrainBrass, 1.135, 0.045, x, 2.62, 0, 'x', 30);
  }
  // smokebox door X-mark
  {
    const strip1 = new THREE.BoxGeometry(0.035, 0.13, 1.48);
    strip1.rotateX(Math.PI / 4);
    strip1.translate(4.135, 2.62, 0);
    addPart(bucket, matSilver, strip1);
    const strip2 = new THREE.BoxGeometry(0.035, 0.13, 1.48);
    strip2.rotateX(-Math.PI / 4);
    strip2.translate(4.135, 2.62, 0);
    addPart(bucket, matSilver, strip2);
  }
  // domes, chimney, headlight
  addCylPart(bucket, matTrainBrass, 0.46, 0.54, 0.20, 1.26, 3.63, 0, 'y', 18);
  addSpherePart(bucket, matTrainBrass, 0.49, 1.26, 3.84, 0, 1, 0.85, 1, 18);
  addCylPart(bucket, matTrainBrass, 0.28, 0.35, 0.18, 2.20, 3.59, 0, 'y', 14);
  addSpherePart(bucket, matTrainBrass, 0.30, 2.20, 3.77, 0, 1, 0.75, 1, 14);
  addCylPart(bucket, matTrainBlack, 0.31, 0.37, 0.78, 2.80, 4.10, 0, 'y', 16);
  addCylPart(bucket, matTrainBlack, 0.47, 0.33, 0.38, 2.80, 4.64, 0, 'y', 16);
  addTorusPart(bucket, matTrainBrass, 0.36, 0.045, 2.80, 4.16, 0, 'y', 18);
  addCylPart(bucket, matTrainBrass, 0.035, 0.045, 0.9, -0.6, 3.57, 0.24, 'y', 6);
  addSpherePart(bucket, matTrainBrass, 0.10, -0.6, 4.03, 0.24, 1, 1, 1, 10);
  // big headlamp
  addBoxPart(bucket, matTrainBlack, 0.48, 0.56, 0.62, 4.10, 3.97, 0);
  addCylPart(bucket, matTrainBrass, 0.26, 0.28, 0.10, 4.36, 3.97, 0, 'x', 16);
  addCylPart(bucket, matHeadlamp, 0.22, 0.22, 0.035, 4.415, 3.97, 0, 'x', 16);
  // two buffer-beam lamps
  for (const side of [-1, 1]) {
    addBoxPart(bucket, matTrainBlack, 0.22, 0.28, 0.30, 4.44, 1.56, side * 0.73);
    addCylPart(bucket, matHeadlamp, 0.10, 0.10, 0.03, 4.57, 1.56, side * 0.73, 'x', 12);
  }

  // cab: lower body, window band, roof
  addBoxPart(bucket, matPeacockDeep, 2.80, 1.65, 2.72, -2.92, 2.30, 0);
  for (const side of [-1, 1]) {
    addBoxPart(bucket, matPeacockDeep, 2.72, 0.48, 0.12, -2.92, 4.22, side * 1.30);
    addBoxPart(bucket, matTrainBlack, 2.82, 0.10, 0.16, -2.92, 2.98, side * 1.31);
    addBoxPart(bucket, matTrainBrass, 2.76, 0.045, 0.035, -2.92, 3.04, side * 1.36);
    // window frames
    addBoxPart(bucket, matTrainBlack, 0.08, 1.28, 0.08, -3.82, 3.56, side * 1.34);
    addBoxPart(bucket, matTrainBlack, 0.08, 1.28, 0.08, -2.02, 3.56, side * 1.34);
    // side glazing (small, dark, with firelight behind)
    const glass = new THREE.PlaneGeometry(1.72, 1.13);
    glass.rotateY(side > 0 ? 0 : Math.PI);
    glass.translate(-2.92, 3.54, side * 1.345);
    addPart(bucket, matTrainGlass, glass);
    // cab steps
    addBoxPart(bucket, matTrainBlack, 0.45, 0.10, 0.34, -2.42, 0.60, side * 1.58);
    addBoxPart(bucket, matTrainBlack, 0.45, 0.10, 0.34, -2.42, 1.04, side * 1.58);
  }
  // back wall with a window
  addBoxPart(bucket, matPeacockDeep, 0.14, 3.2, 2.72, -4.28, 2.72, 0);
  addBoxPart(bucket, matTrainBlack, 0.19, 2.96, 0.30, -4.54, 1.24, 0);
  addBoxPart(bucket, matTrainBlack, 2.92, 0.17, 2.92, -2.98, 4.72, 0);
  addBoxPart(bucket, matPeacockDeep, 2.78, 0.17, 2.84, -2.98, 4.61, 0);
  addBoxPart(bucket, matTrainBlack, 0.10, 0.85, 0.72, -4.38, 3.55, 0);
  // firebox glow behind cab windows
  addBoxPart(bucket, matCabFire, 0.10, 0.95, 1.15, -3.86, 2.06, 0);
  addBoxPart(bucket, matCabFire, 0.06, 0.30, 0.62, -2.28, 2.15, 0);
  // a little warm ceiling panel
  addBoxPart(bucket, matTrainBrass, 1.30, 0.04, 0.06, -3.0, 4.48, 0);
  bakeBucket(group, bucket, true);

  // soft glow inside cab
  const fireLight = new THREE.PointLight(0xff6d2a, 8.5, 11, 2);
  fireLight.position.set(-3.6, 2.2, 0);
  group.add(fireLight);
  // a low, warm spill from the firebox that catches the side rods and wheels
  const gearLight = new THREE.PointLight(0xff9d58, 1.5, 5.6, 2.0);
  gearLight.position.set(0.2, 1.05, 2.1);
  group.add(gearLight);

  // wheels + running gear
  const wheelGroups = [];
  const driveGroups = [];
  const pilotGroups = [];
  for (const side of [-1, 1]) {
    for (const x of DRIVE_XS) {
      const wheel = createSpokedWheel(DRIVE_WHEEL_R, matWheelRed, 12, true);
      const wg = new THREE.Group();
      wg.position.set(x, DRIVE_WHEEL_R, side * 1.26);
      wg.add(wheel);
      const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.072, 0.26, 8), matTrainBrass);
      pin.rotation.x = Math.PI / 2;
      pin.position.set(CRANK_R, 0, side * 0.16);
      wg.add(pin);
      group.add(wg);
      wheelGroups.push(wg);
      driveGroups.push(wg);
    }
    for (const x of [3.18, 3.96]) {
      const wheel = createSpokedWheel(PILOT_WHEEL_R, matTrainBlack, 8, false);
      const wg = new THREE.Group();
      wg.position.set(x, PILOT_WHEEL_R, side * 1.03);
      wg.add(wheel);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.2, 10), matTrainBrass);
      hub.rotation.x = Math.PI / 2;
      wg.add(hub);
      group.add(wg);
      wheelGroups.push(wg);
      pilotGroups.push(wg);
    }
  }

  // rods, crossheads, pistons (updated each frame)
  const couplingRods = [];
  const mainRods = [];
  const crossheads = [];
  const pistonRods = [];
  const sideData = [];
  for (const side of [-1, 1]) {
    const coupling = new THREE.Mesh(new THREE.BoxGeometry(1, 0.105, 0.07), matSteel);
    coupling.castShadow = true;
    coupling.position.z = side * ROD_Z;
    group.add(coupling);
    couplingRods.push(coupling);
    const main = new THREE.Mesh(new THREE.BoxGeometry(1, 0.09, 0.065), matSteel);
    main.castShadow = true;
    group.add(main);
    mainRods.push(main);
    const cross = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.23, 0.25), matTrainBrass);
    cross.castShadow = true;
    cross.position.set(2.4, CROSS_Y, side * ROD_Z);
    group.add(cross);
    crossheads.push(cross);
    const piston = new THREE.Mesh(new THREE.BoxGeometry(1, 0.062, 0.062), matSteel);
    piston.castShadow = true;
    group.add(piston);
    pistonRods.push(piston);
    sideData.push({ side, coupling, main, cross, piston });
  }

  // headlamp beam
  const spot = new THREE.SpotLight(0xffe2ac, 140, 115, 0.34, 0.72, 1.8);
  spot.position.set(4.5, 3.97, 0);
  spot.target.position.set(55, 0.5, 0);
  spot.castShadow = false;
  group.add(spot, spot.target);
  // additive volume cone
  const coneMat = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(0xffd39b) }, uTime: { value: 0 } },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      varying vec3 vN;
      varying vec3 vV;
      void main(){
        vUv = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vN = normalize(mat3(modelMatrix) * normal);
        vV = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      varying vec2 vUv;
      varying vec3 vN;
      varying vec3 vV;
      uniform vec3 uColor;
      uniform float uTime;
      void main(){
        float facing = abs(dot(normalize(vN), normalize(vV)));
        float body = pow(facing, 1.25);
        float along = smoothstep(0.02, 0.20, vUv.y) * (1.0 - smoothstep(0.65, 1.0, vUv.y));
        float flicker = 0.95 + 0.05 * sin(uTime * 17.0);
        float a = (0.0015 + body * 0.013) * along * flicker;
        gl_FragColor = vec4(uColor, a);
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending
  });
  const coneGeo = new THREE.CylinderGeometry(2.55, 0.16, 25, 22, 1, true);
  coneGeo.rotateZ(-Math.PI / 2);
  coneGeo.translate(16.8, 3.97, 0);
  const cone = new THREE.Mesh(coneGeo, coneMat);
  cone.renderOrder = 25;
  cone.frustumCulled = false;
  group.add(cone);

  group.userData.fireLight = fireLight;
  group.userData.coneMat = coneMat;
  group.userData.wheelGroups = wheelGroups;
  group.userData.driveGroups = driveGroups;
  group.userData.pilotGroups = pilotGroups;
  group.userData.sideData = sideData;
  group.userData.spot = spot;

  group.userData.updateMechanical = (sLoco) => {
    for (const wg of driveGroups) {
      const side = Math.sign(wg.position.z);
      wg.rotation.z = -sLoco / DRIVE_WHEEL_R + (side > 0 ? 0 : Math.PI / 2);
    }
    for (const wg of pilotGroups) wg.rotation.z = -sLoco / PILOT_WHEEL_R;
    for (const data of sideData) {
      const { side, coupling, main, cross, piston } = data;
      const phase = side > 0 ? 0 : Math.PI / 2;
      const angle = -sLoco / DRIVE_WHEEL_R + phase;
      const pinAt = (x) => {
        const px = x + CRANK_R * Math.cos(angle);
        const py = DRIVE_WHEEL_R + CRANK_R * Math.sin(angle);
        return _vA.set(px, py, side * ROD_Z).clone();
      };
      const rear = pinAt(DRIVE_XS[2]);
      const front = pinAt(DRIVE_XS[0]);
      setRod(coupling, rear, front);
      const mainPin = pinAt(MAIN_X);
      const dy = mainPin.y - CROSS_Y;
      const dx = Math.sqrt(Math.max(0.06, MAIN_ROD_LEN * MAIN_ROD_LEN - dy * dy));
      const cx = mainPin.x + dx;
      cross.position.set(cx, CROSS_Y, side * ROD_Z);
      const cPoint = _vB.set(cx, CROSS_Y, side * ROD_Z);
      setRod(main, mainPin, cPoint);
      const pistonEnd = _vC.set(3.78, CROSS_Y, side * ROD_Z);
      setRod(piston, cPoint, pistonEnd);
    }
    coneMat.uniforms.uTime.value = skyUniforms.uTime.value;
  };
  return group;
}

const _rodFrom = new THREE.Vector3();
const _rodTo = new THREE.Vector3();
const _rodDir = new THREE.Vector3();
const _rodMid = new THREE.Vector3();
const _xAxis = new THREE.Vector3(1, 0, 0);
function setRod(mesh, a, b) {
  _rodFrom.copy(a); _rodTo.copy(b);
  _rodDir.copy(_rodTo).sub(_rodFrom);
  const len = _rodDir.length();
  if (len < 0.0001) return;
  _rodMid.copy(_rodFrom).add(_rodTo).multiplyScalar(0.5);
  mesh.position.copy(_rodMid);
  mesh.scale.set(len, 1, 1);
  mesh.quaternion.setFromUnitVectors(_xAxis, _rodDir.normalize());
}

function createTender() {
  const group = new THREE.Group();
  const bucket = newBucket();
  const rand = mulberry32(4221);
  addBoxPart(bucket, matTrainBlack, 7.0, 0.26, 2.55, 0, 0.98, 0);
  addBoxPart(bucket, matPeacockDeep, 6.55, 2.0, 2.62, 0, 2.23, 0);
  addBoxPart(bucket, matPeacock, 6.45, 0.82, 2.68, 0, 3.35, 0);
  addBoxPart(bucket, matTrainBlack, 6.62, 0.14, 2.76, 0, 1.23, 0);
  addBoxPart(bucket, matTrainBlack, 6.62, 0.14, 2.76, 0, 3.78, 0);
  for (const side of [-1, 1]) {
    addBoxPart(bucket, matTrainBrass, 6.28, 0.045, 0.035, 0, 2.72, side * 1.36);
    addBoxPart(bucket, matTrainBrass, 6.12, 0.07, 0.04, 0, 1.29, side * 1.38);
    addBoxPart(bucket, matTrainBrass, 6.12, 0.07, 0.04, 0, 3.74, side * 1.38);
    // rivet strips
    for (let x = -2.8; x <= 2.8; x += 0.45) {
      addSpherePart(bucket, matTrainBrass, 0.035, x, 3.85, side * 1.39, 1, 1, 1, 5);
    }
    // ladder
    for (let k = 0; k < 5; k++) {
      addBoxPart(bucket, matTrainBlack, 0.06, 0.05, 0.28, 3.27, 1.2 + k * 0.44, side * 1.44);
    }
    addBoxPart(bucket, matTrainBlack, 0.06, 2.2, 0.06, 3.28, 2.2, side * 1.54);
    addBoxPart(bucket, matTrainBlack, 0.06, 2.2, 0.06, 3.28, 2.2, side * 1.32);
  }
  // coal heaped above the tender top
  for (let i = 0; i < 74; i++) {
    const x = (rand() - 0.5) * 5.8;
    const z = (rand() - 0.5) * 2.06;
    const y = 3.95 + (1 - Math.abs(x) / 3.0) * 0.58 + rand() * 0.52;
    const g = new THREE.IcosahedronGeometry(0.18 + rand() * 0.27, 0);
    g.scale(1, 0.7 + rand() * 0.5, 1);
    g.rotateX(rand() * TAU);
    g.rotateY(rand() * TAU);
    g.translate(x, y, z);
    addPart(bucket, matCoal, g);
  }
  // rear buffer beam and couplers
  addBoxPart(bucket, matTrainRed, 0.24, 0.50, 2.3, -3.54, 0.94, 0);
  addCylPart(bucket, matSteel, 0.10, 0.10, 0.65, -3.85, 0.94, 0, 'x', 8);
  addBoxPart(bucket, matTrainBlack, 0.40, 0.16, 0.9, -3.22, 1.10, 0);
  bakeBucket(group, bucket, true);

  const wheels = [];
  for (const side of [-1, 1]) {
    for (const x of [-2.35, -1.05, 1.05, 2.35]) {
      const mesh = createSpokedWheel(0.52, matTrainBlack, 8, false);
      const wg = new THREE.Group();
      wg.position.set(x, 0.52, side * 1.25);
      wg.add(mesh);
      group.add(wg);
      wheels.push(wg);
    }
    addBoxPart(bucket, matTrainBlack, 5.5, 0.18, 0.12, 0, 0.74, side * 1.29);
  }
  // side bogie frames (static, merged)
  {
    const b = newBucket();
    for (const side of [-1, 1]) {
      addBoxPart(b, matTrainBlack, 5.3, 0.18, 0.14, 0, 0.72, side * 1.31);
      addBoxPart(b, matTrainBlack, 0.5, 0.24, 0.18, -2.35, 0.82, side * 1.31);
      addBoxPart(b, matTrainBlack, 0.5, 0.24, 0.18, 2.35, 0.82, side * 1.31);
    }
    bakeBucket(group, b, true);
  }
  group.userData.wheels = wheels;
  return group;
}

  }

    bellows[i].position.set(R * Math.sin(th), 0, R * Math.cos(th) - R);
    bellows[i].rotation.y = th;
  }

  const fire = loco.userData.fireLight;

  fire.intensity = 7.2 * flame;

  return sLoco;
}

/* ------------------------------------------------------------------ *
 *  蒸汽 / 烟雾粒子（自定义 Points shader）
 * ------------------------------------------------------------------ */
function computePointScale() {
  return renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5));
}

class SteamSystem {
  constructor({ capacity, color, opacity, renderOrder = 700 }) {
    this.capacity = capacity;
    this.head = 0;
    this.opacity = opacity;
    this.positions = new Float32Array(capacity * 3);
    this.velocities = new Float32Array(capacity * 3);
    this.sizes = new Float32Array(capacity);
    this.baseSizes = new Float32Array(capacity);
    this.alphas = new Float32Array(capacity);
    this.life = new Float32Array(capacity);
    this.maxLife = new Float32Array(capacity);
    this.seeds = new Float32Array(capacity);
    for (let i = 0; i < capacity; i++) {
      this.sizes[i] = 0;
      this.alphas[i] = 0;
      this.seeds[i] = Math.random();
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(this.sizes, 1));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(this.alphas, 1));
    geo.setAttribute('aSeed', new THREE.BufferAttribute(this.seeds, 1));
    this.geometry = geo;
    this.material = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color(color) },
        uPointScale: { value: 900 },
        uTime: { value: 0 }
      },
      vertexShader: /* glsl */`
        precision highp float;
        attribute float aSize;
        attribute float aAlpha;
        attribute float aSeed;
        uniform float uPointScale;
        varying float vAlpha;
        varying float vSeed;
        void main(){
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          vAlpha = aAlpha;
          vSeed = aSeed;
          gl_PointSize = aAlpha > 0.001 ? min(230.0, aSize * uPointScale / max(0.8, -mv.z)) : 0.0;
        }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        varying float vAlpha;
        varying float vSeed;
        uniform vec3 uColor;
        uniform float uTime;
        void main(){
          if (vAlpha < 0.002) discard;
          vec2 uv = gl_PointCoord - 0.5;
          float d = length(uv);
          if (d > 0.5) discard;
          float soft = smoothstep(0.5, 0.06, d);
          float n1 = sin(uv.x * 11.0 + vSeed * 23.0 + uTime * 0.30) * sin(uv.y * 9.0 - vSeed * 17.0 + uTime * 0.22);
          float n2 = sin(uv.x * 21.0 - vSeed * 13.0 + uTime * 0.14) * sin(uv.y * 19.0 + vSeed * 29.0);
          float n = 0.84 + 0.11 * n1 + 0.05 * n2;
          float a = soft * n * vAlpha;
          if (a < 0.002) discard;
          gl_FragColor = vec4(uColor * (0.96 + 0.07 * n1), a);
        }
      `,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.NormalBlending
    });
    this.points = new THREE.Points(geo, this.material);
    this.points.frustumCulled = false;
    this.points.renderOrder = renderOrder;
    scene.add(this.points);
  }
  spawn(x, y, z, vx, vy, vz, size, life) {
    const i = this.head++ % this.capacity;
    const p3 = i * 3;
    this.positions[p3] = x;
    this.positions[p3 + 1] = y;
    this.positions[p3 + 2] = z;
    this.velocities[p3] = vx;
    this.velocities[p3 + 1] = vy;
    this.velocities[p3 + 2] = vz;
    this.life[i] = life;
    this.maxLife[i] = life;
    this.baseSizes[i] = size;
    this.sizes[i] = size;
    this.alphas[i] = 0;
    this.seeds[i] = Math.random();
  }
  update(dt, elapsed) {
    const pos = this.positions, vel = this.velocities;
    for (let i = 0; i < this.capacity; i++) {
      if (this.life[i] <= 0) {
        this.alphas[i] = 0;
        this.sizes[i] = 0;
        continue;
      }
      this.life[i] -= dt;
      if (this.life[i] <= 0) {
        this.alphas[i] = 0;
        this.sizes[i] = 0;
        continue;
      }
      const p3 = i * 3;
      const age = 1 - this.life[i] / this.maxLife[i];
      pos[p3] += vel[p3] * dt;
      pos[p3 + 1] += vel[p3 + 1] * dt;
      pos[p3 + 2] += vel[p3 + 2] * dt;
      vel[p3 + 1] += (1.2 + age * 1.1) * dt;
      const drag = Math.max(0, 1 - dt * 0.55);
      vel[p3] *= drag;
      vel[p3 + 2] *= drag;
      this.sizes[i] = this.baseSizes[i] * (1.0 + age * 2.35);
      const fadeIn = smoother(age / 0.14);
      const fadeOut = 1 - smoother((age - 0.54) / 0.46);
      this.alphas[i] = this.opacity * fadeIn * clamp(fadeOut, 0, 1);
    }
    this.geometry.attributes.position.needsUpdate = true;
    this.geometry.attributes.aSize.needsUpdate = true;
    this.geometry.attributes.aAlpha.needsUpdate = true;
    this.geometry.attributes.aSeed.needsUpdate = true;
    this.material.uniforms.uTime.value = elapsed;
    this.material.uniforms.uPointScale.value = computePointScale();
  }
  clear() {
    this.life.fill(0);
    this.alphas.fill(0);
    this.sizes.fill(0);
    this.geometry.attributes.aAlpha.needsUpdate = true;
    this.geometry.attributes.aSize.needsUpdate = true;
  }
}

const smokeSystem = new SteamSystem({ capacity: 1700, color: 0xcbd6e0, opacity: 0.135, renderOrder: 650 });
const puffSystem = new SteamSystem({ capacity: 460, color: 0xd7e1e9, opacity: 0.12, renderOrder: 651 });
let smokeAccumulator = 0;
let puffAccumulator = 0;

const _emitTangent = new THREE.Vector3();
const _emitRadial = new THREE.Vector3();
const _emitPos = new THREE.Vector3();
function emitSteamParticles(sLoco, dt) {
  smokeAccumulator += dt * 58;
  while (smokeAccumulator >= 1) {
    smokeAccumulator -= 1;
    const s = sLoco + 2.8 + (Math.random() - 0.5) * 0.55;
    const lat = (Math.random() - 0.5) * 0.64;
    arcPos(s, lat, 5.08, _emitPos);
    arcTangent(s, _emitTangent);
    arcRadial(s, _emitRadial);
    const lateral = (Math.random() - 0.5) * 1.5;
    const vForward = 4.0 + Math.random() * 5.0;
    const vUp = 3.3 + Math.random() * 3.8;
    smokeSystem.spawn(
      _emitPos.x, _emitPos.y + Math.random() * 0.4, _emitPos.z,
      _emitTangent.x * vForward + _emitRadial.x * lateral,
      vUp,
      _emitTangent.z * vForward + _emitRadial.z * lateral,
      0.82 + Math.random() * 0.62,
      3.8 + Math.random() * 1.8
    );
  }
  puffAccumulator += dt * 30;
  while (puffAccumulator >= 1) {
    puffAccumulator -= 1;
    const side = Math.random() > 0.5 ? 1 : -1;
    const s = sLoco + 3.55;
    arcPos(s, side * 1.35, 2.03, _emitPos);
    arcTangent(s, _emitTangent);
    arcRadial(s, _emitRadial);
    const lateral = side * (4.0 + Math.random() * 4.5);
    puffSystem.spawn(
      _emitPos.x, _emitPos.y, _emitPos.z,
      _emitTangent.x * (2.5 + Math.random() * 2.5) + _emitRadial.x * lateral,
      1.0 + Math.random() * 1.6,
      _emitTangent.z * (2.5 + Math.random() * 2.5) + _emitRadial.z * lateral,
      0.30 + Math.random() * 0.40,
      0.45 + Math.random() * 0.45
    );
  }
}

function resetParticleTrail(timeEnd) {
  smokeSystem.clear();
  puffSystem.clear();
  smokeAccumulator = 0;
  puffAccumulator = 0;
  const warmup = 4.4;
  const steps = 184;
  const dt = warmup / steps;
  for (let i = 0; i < steps; i++) {
    const t = timeEnd - warmup + (i + 1) * dt;
    const s = updateTrain(t);
    emitSteamParticles(s, dt);
    smokeSystem.update(dt, t);
    puffSystem.update(dt, t);
  }
  updateTrain(timeEnd);
}

function cameraPathAt(t, outPos, outTarget, outFov) {

    if (t < 10.6) {
      const u = smoother((t - 7) / 3.6);
      qbez(CAM_A1, CAM_B_CTRL, CAM_B_OUT, u, outPos);
    } else if (t < 11.8) {
      const u = smoother((t - 10.6) / 1.2);
      outPos.lerpVectors(CAM_B_OUT, CAM_B_LAND, u);
    } else {
      const u = smoother((t - 11.8) / 3.2);
      outPos.lerpVectors(CAM_B_LAND, CAM_B_HOLD, u);
    }
    outFov = lerp(50, 60, smoother((t - 7) / 5.0));
    if (t < 9.4) {
      const u = smoother((t - 7) / 2.4);
      outTarget.lerpVectors(CAM_TA1, LOOK_B_STATION, u);
    } else if (t < 11.6) {
      const u = smoother((t - 9.4) / 2.2);
      outTarget.lerpVectors(LOOK_B_STATION, LOOK_B_DOWNTRACK, u);
    } else if (t < 12.3) {
      const u = smoother((t - 11.6) / 0.7);
      const sNow = -250 + 24 * 12.3;
      const goal = arcPos(sNow + 5, 0, 2.8);
      outTarget.lerpVectors(LOOK_B_DOWNTRACK, goal, u);
    } else if (t < 13.5) {
      const sNow = -250 + 24 * t;
      arcPos(sNow + 5, 0, 2.8, outTarget);
    } else {
      const u = smoother((t - 13.5) / 1.5);
      const fromS = -250 + 24 * 13.5 + 5;
      const from = arcPos(fromS, 0, 2.8);
      const to = arcPos(-250 + 24 * 15 + 18, 0, 3.2);
      outTarget.lerpVectors(from, to, u);
    }
    // station-pass shake, applied later to the final transform
  } else if (t < 20) {
    const sLoco = -250 + 24 * t;
    if (t < 16.0) {
      const u = smoother((t - 15) / 1.0);
      qbez(CAM_B_HOLD, CAM_C_EXIT_CTRL_A, CAM_C_EXIT_A, u, outPos);
    } else if (t < 16.9) {
      const u = smoother((t - 16.0) / 0.9);
      qbez(CAM_C_EXIT_A, CAM_C_EXIT_CTRL_B, CAM_C_EXIT_B, u, outPos);
    } else {
      const u = smoother((t - 16.9) / 3.1);
      qbez(CAM_C_EXIT_B, CAM_C_CHASE_CTRL, CHASE_20, u, outPos);
    }
    const lead = lerp(18, 30, smoother((t - 15) / 5));
    arcPos(sLoco + lead, 0, lerp(3.2, -1.2, smoother((t - 15) / 5)), outTarget);
    outFov = lerp(60, 80, smoother((t - 15) / 5));
  } else {
    const sLoco = -250 + 24 * t;
    arcPos(sLoco - 58, -30, 27, outPos);
    arcPos(sLoco + 30, 0, -1.2, outTarget);
    outFov = 80;
  }
  return outFov;
}

function applyCameraAt(t, instant = false) {
  const fov = cameraPathAt(t, _pathPos, _pathTarget, 50);
  cameraState.pos.copy(_pathPos);
  cameraState.target.copy(_pathTarget);
  cameraState.fov = fov;
  if (!instant && autoBlend < 1) {
    const raw = clamp((performance.now() - autoBlendStart) / 1000, 0, 1);
    const u = smoother(raw / 0.95);
    _tmpPos.lerpVectors(blendStartPos, _pathPos, u);
    _tmpTarget.lerpVectors(blendStartTarget, _pathTarget, u);
    camera.fov = lerp(blendStartFov, fov, u);
    camera.position.copy(_tmpPos);
    currentLook.copy(_tmpTarget);
    camera.lookAt(_tmpTarget);
    camera.updateProjectionMatrix();
    autoBlend = raw >= 1 ? 1 : raw;
    if (autoBlend === 1) {
      camera.position.copy(_pathPos);
      camera.fov = fov;
      currentLook.copy(_pathTarget);
      camera.lookAt(_pathTarget);
      camera.updateProjectionMatrix();
    }
  } else {
    camera.position.copy(_pathPos);
    camera.fov = fov;
    currentLook.copy(_pathTarget);
    camera.lookAt(_pathTarget);
    camera.updateProjectionMatrix();
    autoBlend = 1;
  }
  // subtle physical rumble as the locomotive tears past the platform camera
  if (autoCam && t > 12.35 && t < 13.65) {
    const k = Math.exp(-Math.pow((t - 12.92) / 0.42, 2));
    const shake = 0.055 * k;
    camera.position.x += Math.sin(t * 97.0) * shake;
    camera.position.y += Math.cos(t * 81.0) * shake * 0.78;
    camera.position.z += Math.sin(t * 69.0 + 1.7) * shake;
    currentLook.x += Math.sin(t * 73.0 + 0.5) * k * 0.26;
    currentLook.y += Math.cos(t * 64.0) * k * 0.16;
    currentLook.z += Math.sin(t * 57.0 + 2.1) * k * 0.23;
    camera.lookAt(currentLook);
  }
}

/* ------------------------------------------------------------------ *
 *  界面 / 交互 / 循环
 * ------------------------------------------------------------------ */
const ui = {
  auto: document.getElementById('btn-auto'),
  replay: document.getElementById('btn-replay'),
  shotIndex: document.getElementById('shot-index'),
  shotName: document.getElementById('shot-name'),
  progress: document.getElementById('progress-fill'),
  timeCurrent: document.getElementById('time-current'),
  fade: document.getElementById('fade'),
  freeHint: document.getElementById('free-hint'),
  loading: document.getElementById('loading')
};
const SHOT_NAMES = ['云海启程 · 广角俯瞰', '入站 · 星辉穹顶', '归途 · 驶向星海'];
let activeShotIndex = -1;
let hintTimer = 0;
let firstFrameRendered = false;

function updateUI(t) {
  const idx = t < 7 ? 0 : t < 15 ? 1 : 2;
  if (idx !== activeShotIndex) {
    activeShotIndex = idx;
    ui.shotIndex.textContent = `0${idx + 1} / 03`;
    ui.shotName.textContent = SHOT_NAMES[idx];
    ui.shotName.style.opacity = '0';
    ui.shotName.style.transform = 'translateY(4px)';
    requestAnimationFrame(() => {
      ui.shotName.style.transition = 'opacity .55s ease, transform .55s ease';
      ui.shotName.style.opacity = '1';
      ui.shotName.style.transform = 'translateY(0)';
    });
  }
  ui.progress.style.transform = `scaleX(${clamp(t / LOOP_TIME, 0, 1)})`;
  const seconds = Math.min(25, Math.floor(t));
  ui.timeCurrent.textContent = `00:${String(seconds).padStart(2, '0')}`;
  let fade = 0;
  if (t < 0.7) fade = 1 - smoother(t / 0.7);
  else if (t > 24.3) fade = smoother((t - 24.3) / 0.7);
  ui.fade.style.opacity = String(clamp(fade, 0, 1));
}

function showFreeHint() {
  ui.freeHint.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => ui.freeHint.classList.remove('show'), 3200);
}

function setFreeCamera() {
  if (!autoCam) return;
  autoCam = false;
  autoBlend = 1;
  controls.enabled = true;
  controls.target.copy(currentLook);
  controls.update();
  ui.auto.classList.remove('active');
  showFreeHint();
}

function setAutoCamera() {
  if (autoCam) {
    autoBlend = 1;
    return;
  }
  autoCam = true;
  autoBlend = 0;
  autoBlendStart = performance.now();
  blendStartPos.copy(camera.position);
  blendStartTarget.copy(controls.target);
  blendStartFov = camera.fov;
  controls.enabled = false;
  ui.auto.classList.add('active');
  ui.freeHint.classList.remove('show');
}

function resetToStart() {
  currentTime = 0;
  autoCam = true;
  autoBlend = 1;
  controls.enabled = false;
  ui.auto.classList.add('active');
  resetParticleTrail(0);
  updateCameraAtNow();
  updateUI(0);
}

function updateCameraAtNow() {
  applyCameraAt(currentTime, true);
}

ui.auto.addEventListener('click', setAutoCamera);
ui.replay.addEventListener('click', resetToStart);
renderer.domElement.addEventListener('pointerdown', () => {
  if (autoCam) setFreeCamera();
}, true);
window.addEventListener('resize', onResize);

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(DPR);
  renderer.setSize(w, h);
  composer.setPixelRatio(DPR);
  composer.setSize(w, h);
  bloomPass.resolution.set(w, h);
  trackLightMat.uniforms.uPointScale.value = computePointScale();
}

// Isolated reflection refresh cadence. The floor is hidden during the capture.
let reflectionTicker = 0;
function maybeRefreshReflection(dt) {
  reflectionTicker += dt;
  if (reflectionTicker > 0.30) {
    reflectionTicker = 0;
    updateStationReflection(false);
  }
}

/* ------------------------------------------------------------------ *
 *  启动与主循环
 * ------------------------------------------------------------------ */
const urlParams = new URLSearchParams(window.location.search);
let initialTime = parseFloat(urlParams.get('t') || '0');
if (!Number.isFinite(initialTime)) initialTime = 0;
initialTime = ((initialTime % LOOP_TIME) + LOOP_TIME) % LOOP_TIME;
currentTime = initialTime;

updateTrain(currentTime);
resetParticleTrail(currentTime);
applyCameraAt(currentTime, true);
updateUI(currentTime);
trackLightMat.uniforms.uPointScale.value = computePointScale();

// One immediate reflection capture so the wet platform is alive from frame one.
updateStationReflection(true);

let lastFrame = performance.now();
let debugFreeze = false;
function animate(now) {
  const dt = Math.min(0.055, Math.max(0.001, (now - lastFrame) / 1000));
  lastFrame = now;
  if (!debugFreeze) {
    currentTime += dt;
    if (currentTime >= LOOP_TIME) {
      currentTime -= LOOP_TIME;
      resetParticleTrail(currentTime);
    }
  }
  const sLoco = updateTrain(currentTime);
  emitSteamParticles(sLoco, dt);
  smokeSystem.update(dt, currentTime);
  puffSystem.update(dt, currentTime);

  if (autoCam) {
    applyCameraAt(currentTime, false);
  } else {
    controls.update();
  }

  // Uniforms for shaders.
  skyUniforms.uTime.value = currentTime;
  cloudSeaUniforms.uTime.value = currentTime;
  trackLightMat.uniforms.uTime.value = currentTime;
  trackLightMat.uniforms.uPointScale.value = computePointScale();
  sortCloudSprites();
  maybeRefreshReflection(dt);
  updateUI(currentTime);

  composer.render();
  if (!firstFrameRendered) {
    firstFrameRendered = true;
    requestAnimationFrame(() => ui.loading.classList.add('hidden'));
  }
}
renderer.setAnimationLoop(animate);

// Small debug surface for deep-linking and automated visual checks.
window.__cloudsea = {
  scene, camera, renderer, composer,
  get time() { return currentTime; },
  setTime(t) {
    currentTime = ((t % LOOP_TIME) + LOOP_TIME) % LOOP_TIME;
    updateTrain(currentTime);
    resetParticleTrail(currentTime);
    applyCameraAt(currentTime, true);
    updateUI(currentTime);
  },
  setAuto() { setAutoCamera(); },
  setFreeze(v) { debugFreeze = !!v; },
  freeze: false
};
</script>
<script src="../prompt-panel.js" data-id="sky-arc-train-deepseek"></script>
</body>
