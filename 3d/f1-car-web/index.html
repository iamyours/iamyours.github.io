<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>梅赛德斯-AMG F1 体素赛车 — 3D 互动展厅</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070b10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #eef4f8;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* 左上角固定返回按钮（半透明奶油色圆角小按钮样式） */
    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 15px;
      background: rgba(255, 248, 234, 0.86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #26231e;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 251, 242, 0.96);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 210, 190, 0.25);
    }

    .back-btn:active {
      transform: translateY(0);
    }

    /* 顶部车队仪表盘信息栏 */
    .hud-header {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
    }

    .team-card {
      background: rgba(11, 17, 24, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 210, 190, 0.35);
      border-right: 4px solid #00d2be;
      border-radius: 12px;
      padding: 10px 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      text-align: right;
    }

    .team-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #00d2be;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .team-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00d2be;
      box-shadow: 0 0 8px #00d2be;
    }

    .car-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .telemetry-row {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      color: #9fb1c1;
      font-variant-numeric: tabular-nums;
    }

    .telemetry-row span strong {
      color: #00d2be;
      font-weight: 700;
    }

    .telemetry-row span strong.drs-on {
      color: #26ff80;
    }

    /* 底部交互控制面板 */
    .control-dock {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      max-width: min(94vw, 960px);
      padding: 10px 14px;
      background: rgba(11, 17, 24, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 6px;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ctrl-group:last-child {
      border-right: none;
    }

    .group-label {
      font-size: 11px;
      color: #7c8d9e;
      margin-right: 4px;
      white-space: nowrap;
      font-weight: 600;
    }

    .ctrl-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: #dce6f0;
      padding: 6px 11px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .ctrl-btn:hover {
      background: rgba(0, 210, 190, 0.16);
      border-color: rgba(0, 210, 190, 0.5);
      color: #ffffff;
    }

    .ctrl-btn.active {
      background: linear-gradient(135deg, rgba(0, 210, 190, 0.28), rgba(0, 161, 155, 0.42));
      border-color: #00d2be;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(0, 210, 190, 0.32);
    }

    .tire-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .tire-soft { background: #ff2a3c; box-shadow: 0 0 6px #ff2a3c; }
    .tire-medium { background: #ffd000; box-shadow: 0 0 6px #ffd000; }
    .tire-hard { background: #f2f6fa; box-shadow: 0 0 6px #ffffff; }

    .hint-pill {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      background: rgba(11, 17, 24, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      color: #9ab0c4;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.4s ease;
    }

    @media (max-width: 720px) {
      .hud-header {
        top: 56px;
        left: 16px;
        right: auto;
        align-items: flex-start;
      }
      .team-card {
        text-align: left;
        border-right: 1px solid rgba(0, 210, 190, 0.35);
        border-left: 4px solid #00d2be;
        padding: 8px 12px;
      }
      .telemetry-row {
        justify-content: flex-start;
      }
      .control-dock {
        bottom: 12px;
        padding: 8px 10px;
        gap: 6px;
      }
      .ctrl-group {
        border-right: none;
        padding: 0 2px;
      }
      .group-label {
        display: none;
      }
      .ctrl-btn {
        padding: 5px 9px;
        font-size: 11px;
      }
      .hint-pill {
        display: none;
      }
    }
  </style>

  <!-- 固定版本 Three.js r160 ImportMap -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- 左上角固定返回按钮 -->
  <a href="../" class="back-btn">← 返回 3D 作品</a>

  <!-- 右上角梅赛德斯-AMG F1 遥测信息卡 -->
  <div class="hud-header">
    <div class="team-card">
      <div class="team-badge">
        <span class="dot"></span>
        <span>MERCEDES-AMG PETRONAS F1 TEAM</span>
      </div>
      <div class="car-title">W15 E PERFORMANCE · 体素工程版</div>
      <div class="telemetry-row">
        <span>体素规模: <strong id="voxel-count">0</strong> 块</span>
        <span>车速: <strong id="speed-readout">312 km/h</strong></span>
        <span>DRS: <strong id="drs-readout">CLOSED</strong></span>
      </div>
    </div>
  </div>

  <!-- 交互提示 -->
  <div class="hint-pill">拖动旋转视角 · 滚轮/双指缩放 · 点击下方按钮切换涂装、轮胎与空气动力学模式</div>

  <!-- 底部多功能交互控制台 -->
  <div class="control-dock">
    <div class="ctrl-group">
      <span class="group-label">动态控制</span>
      <button class="ctrl-btn active" id="btn-drive" title="切换赛道巡航与静止检视">⚡ 极速巡航</button>
      <button class="ctrl-btn" id="btn-drs" title="打开或关闭可变尾翼减阻系统">🪽 DRS 尾翼</button>
      <button class="ctrl-btn active" id="btn-aero" title="显示或隐藏风洞空气动力学流线">💨 风洞气流</button>
      <button class="ctrl-btn" id="btn-explode" title="体素组件爆炸拆解视图">🧩 拆解视图</button>
    </div>

    <div class="ctrl-group">
      <span class="group-label">倍耐力轮胎</span>
      <button class="ctrl-btn active" data-tire="soft"><span class="tire-dot tire-soft"></span>软胎 C5</button>
      <button class="ctrl-btn" data-tire="medium"><span class="tire-dot tire-medium"></span>黄胎 C3</button>
      <button class="ctrl-btn" data-tire="hard"><span class="tire-dot tire-hard"></span>硬胎 C1</button>
    </div>

    <div class="ctrl-group">
      <span class="group-label">经典涂装</span>
      <button class="ctrl-btn active" data-livery="w15">W15 银黑</button>
      <button class="ctrl-btn" data-livery="w14">W14 暗夜黑</button>
      <button class="ctrl-btn" data-livery="w11">W11 经典银箭</button>
    </div>

    <div class="ctrl-group">
      <span class="group-label">机位</span>
      <button class="ctrl-btn" data-cam="default">展厅</button>
      <button class="ctrl-btn" data-cam="cockpit">Halo座舱</button>
      <button class="ctrl-btn" data-cam="front">低趴前翼</button>
      <button class="ctrl-btn" data-cam="rear">尾部扩散器</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // =========================================================================
    // 1. 场景、相机与渲染器初始化
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b10);
    scene.fog = new THREE.FogExp2(0x070b10, 0.011);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(-22, 11, -24);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.485;
    controls.minDistance = 7;
    controls.maxDistance = 65;
    controls.target.set(0, 2.2, 0);

    // =========================================================================
    // 2. 程序化生成环境反射贴图与体素立体斜角凹凸贴图
    // =========================================================================
    function createStudioEnvMap() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0.0, '#06111c');
      grad.addColorStop(0.45, '#122636');
      grad.addColorStop(0.5, '#00d2be');
      grad.addColorStop(0.55, '#091017');
      grad.addColorStop(1.0, '#040608');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 256);

      // 顶部风洞灯带高光条
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(40, 28, 180, 16);
      ctx.fillRect(290, 28, 180, 16);
      ctx.fillStyle = '#00f5df';
      ctx.fillRect(60, 62, 390, 8);
      ctx.fillStyle = '#ff1e42';
      ctx.fillRect(180, 96, 150, 6);

      const envTex = new THREE.CanvasTexture(canvas);
      envTex.mapping = THREE.EquirectangularReflectionMapping;
      envTex.colorSpace = THREE.SRGBColorSpace;
      return envTex;
    }

    function createVoxelBevelTextures() {
      const size = 128;
      // 颜色微渐变遮罩贴图（让每个体素方块自带精致的微斜角边框与中心立体感）
      const mapCanvas = document.createElement('canvas');
      mapCanvas.width = size;
      mapCanvas.height = size;
      const mCtx = mapCanvas.getContext('2d');

      mCtx.fillStyle = '#d4d4d4';
      mCtx.fillRect(0, 0, size, size);

      // 内层高亮面
      const innerGrad = mCtx.createLinearGradient(0, 0, size, size);
      innerGrad.addColorStop(0, '#ffffff');
      innerGrad.addColorStop(1, '#eaeaea');
      mCtx.fillStyle = innerGrad;
      mCtx.fillRect(6, 6, size - 12, size - 12);

      // 边缘精致暗缝
      mCtx.strokeStyle = '#9e9e9e';
      mCtx.lineWidth = 4;
      mCtx.strokeRect(2, 2, size - 4, size - 4);

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = size;
      bumpCanvas.height = size;
      const bCtx = bumpCanvas.getContext('2d');
      bCtx.fillStyle = '#404040';
      bCtx.fillRect(0, 0, size, size);
      bCtx.fillStyle = '#b0b0b0';
      bCtx.fillRect(5, 5, size - 10, size - 10);
      bCtx.fillStyle = '#ffffff';
      bCtx.fillRect(10, 10, size - 20, size - 20);

      const colorMap = new THREE.CanvasTexture(mapCanvas);
      colorMap.colorSpace = THREE.SRGBColorSpace;
      colorMap.anisotropy = 4;

      const bumpMap = new THREE.CanvasTexture(bumpCanvas);
      bumpMap.anisotropy = 4;

      return { colorMap, bumpMap };
    }

    const envMap = createStudioEnvMap();
    scene.environment = envMap;
    const { colorMap: voxelColorMap, bumpMap: voxelBumpMap } = createVoxelBevelTextures();

    // =========================================================================
    // 3. 灯光系统（风洞展厅级多光源）
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(0xd4e8ff, 0.65);
    scene.add(ambientLight);

    const mainSpot = new THREE.DirectionalLight(0xffffff, 2.4);
    mainSpot.position.set(16, 28, -14);
    mainSpot.castShadow = true;
    mainSpot.shadow.mapSize.set(2048, 2048);
    mainSpot.shadow.camera.near = 5;
    mainSpot.shadow.camera.far = 70;
    const d = 18;
    mainSpot.shadow.camera.left = -d;
    mainSpot.shadow.camera.right = d;
    mainSpot.shadow.camera.top = d;
    mainSpot.shadow.camera.bottom = -d;
    mainSpot.shadow.bias = -0.0005;
    scene.add(mainSpot);

    // 马石油青色轮廓补光
    const tealRimLight = new THREE.DirectionalLight(0x00d2be, 1.45);
    tealRimLight.position.set(-22, 10, 18);
    scene.add(tealRimLight);

    // INEOS 运动红背光
    const redBackLight = new THREE.PointLight(0xff1e42, 18, 28, 1.5);
    redBackLight.position.set(0, 6, 15);
    scene.add(redBackLight);

    // 前鼻翼冷白辅光
    const frontFillLight = new THREE.PointLight(0xdff6ff, 12, 25, 1.5);
    frontFillLight.position.set(0, 5, -17);
    scene.add(frontFillLight);

    // =========================================================================
    // 4. 梅赛德斯-AMG F1 体素赛车构建器
    // =========================================================================
    const VOXEL_SIZE = 0.24; // 单个体素尺寸
    const voxelGeo = new THREE.BoxGeometry(VOXEL_SIZE * 0.985, VOXEL_SIZE * 0.985, VOXEL_SIZE * 0.985);

    // 调色板标识枚举
    const PAL = {
      CARBON: 'CARBON',             // 裸碳纤维黑
      BODY_PRIMARY: 'BODY_PRIMARY', // 车身主色（随涂装切换：前银/全黑/全银）
      BODY_REAR: 'BODY_REAR',       // 引擎盖色（随涂装切换：碳黑/银箭银）
      SILVER_STAR: 'SILVER_STAR',   // 梅赛德斯三叉星徽银
      PETRONAS: 'PETRONAS',         // 马石油青 #00D2BE
      INEOS: 'INEOS',               // INEOS 进气道深红 #D91438
      TITANIUM: 'TITANIUM',         // 钛合金 / 排气管 / 制动盘
      WHITE: 'WHITE',               // 车号与赞助商白字
      HELMET: 'HELMET',             // 车手头盔亮黄/紫荧光
      VISOR: 'VISOR',               // 头盔炫彩镀膜护目镜
      TIRE_RUBBER: 'TIRE_RUBBER',   // 倍耐力光头胎橡胶
      TIRE_STRIPE: 'TIRE_STRIPE',   // 倍耐力胎壁彩条（红/黄/白可换）
      RIM_DARK: 'RIM_DARK',         // 轮毂空气动力学外罩
      LED_RED: 'LED_RED',           // FIA 尾部防雨灯 & 尾焰
      LED_TEAL: 'LED_TEAL',         // 方向盘换挡灯 & 能源指示
      STEERING: 'STEERING'          // 座舱内方向盘细节
    };

    // 三套经典梅赛德斯涂装配色表
    const LIVERIES = {
      w15: {
        BODY_PRIMARY: 0xd0d7de, // W15 前鼻锥银箭金属银
        BODY_REAR: 0x16191e,    // W15 侧箱及引擎盖裸碳黑
        SILVER_STAR: 0xe6edf5,
        CARBON: 0x121519,
        PETRONAS: 0x00d2be,
        INEOS: 0xd81236
      },
      w14: {
        BODY_PRIMARY: 0x15181d, // W14 全碳纤维暗夜黑
        BODY_REAR: 0x101317,
        SILVER_STAR: 0x9aa6b2,
        CARBON: 0x0e1014,
        PETRONAS: 0x00e0ca,
        INEOS: 0xe0163b
      },
      w11: {
        BODY_PRIMARY: 0xdce3ea, // W11 传奇银箭亮银色
        BODY_REAR: 0xc2ccd6,
        SILVER_STAR: 0xffffff,
        CARBON: 0x171b20,
        PETRONAS: 0x00d2be,
        INEOS: 0xd41132
      }
    };

    const TIRE_COLORS = {
      soft: 0xff2238,   // C5 软胎红
      medium: 0xffcc00, // C3 中性胎黄
      hard: 0xf4f8fc    // C1 硬胎白
    };

    // 当前状态
    const state = {
      livery: 'w15',
      tire: 'soft',
      driving: true,
      drsOpen: false,
      aeroVisible: true,
      exploded: false,
      explodeProgress: 0,
      drsAngle: 0,
      wheelSpin: 0,
      speed: 312
    };

    // 赛车总容器与各个可动/可拆解子模块分组
    const carRoot = new THREE.Group();
    scene.add(carRoot);

    const partGroups = {
      chassis: new THREE.Group(),    // 核心底盘、单壳体、座舱、车手
      frontWing: new THREE.Group(),  // 前鼻翼总成
      sidepods: new THREE.Group(),   // 左右侧箱、底板文丘里通道与边缘翼刀
      engineCover: new THREE.Group(),// 引擎盖、防滚架 INEOS 进气口与鲨鱼鳍
      halo: new THREE.Group(),       // 钛合金 Halo 保护架
      rearWing: new THREE.Group(),   // 尾翼支架与下梁翼
      drsFlap: new THREE.Group(),    // 可开合 DRS 上层尾翼襟翼
      wheelFL: new THREE.Group(),    // 左前轮总成
      wheelFR: new THREE.Group(),    // 右前轮总成
      wheelRL: new THREE.Group(),    // 左后轮总成
      wheelRR: new THREE.Group()     // 右后轮总成
    };

    // 设置特殊旋转轴心位置
    partGroups.drsFlap.position.set(0, 14.5 * VOXEL_SIZE, 33.5 * VOXEL_SIZE);
    partGroups.wheelFL.position.set(-14 * VOXEL_SIZE, 5 * VOXEL_SIZE, -28 * VOXEL_SIZE);
    partGroups.wheelFR.position.set(14 * VOXEL_SIZE, 5 * VOXEL_SIZE, -28 * VOXEL_SIZE);
    partGroups.wheelRL.position.set(-14.5 * VOXEL_SIZE, 5.5 * VOXEL_SIZE, 24 * VOXEL_SIZE);
    partGroups.wheelRR.position.set(14.5 * VOXEL_SIZE, 5.5 * VOXEL_SIZE, 24 * VOXEL_SIZE);

    Object.values(partGroups).forEach(g => carRoot.add(g));

    // 每个模块的爆炸拆解位移目标向量（单位：世界坐标）
    const explodeOffsets = {
      chassis: new THREE.Vector3(0, 0, 0),
      frontWing: new THREE.Vector3(0, -0.2, -3.4),
      sidepods: new THREE.Vector3(0, -1.1, 0),
      engineCover: new THREE.Vector3(0, 2.5, 0.8),
      halo: new THREE.Vector3(0, 2.2, -1.2),
      rearWing: new THREE.Vector3(0, 0.6, 3.2),
      drsFlap: new THREE.Vector3(0, 1.5, 3.6),
      wheelFL: new THREE.Vector3(-2.8, 0, -1.2),
      wheelFR: new THREE.Vector3(2.8, 0, -1.2),
      wheelRL: new THREE.Vector3(-3.0, 0, 1.2),
      wheelRR: new THREE.Vector3(3.0, 0, 1.2)
    };

    const basePositions = {};
    for (const [k, g] of Object.entries(partGroups)) {
      basePositions[k] = g.position.clone();
    }

    // 体素数据收集器：按子模块 + 材质类别存储
    const voxelBuckets = {};
    for (const key of Object.keys(partGroups)) {
      voxelBuckets[key] = new Map();
    }

    // 添加单个体素（自动去重同一坐标）
    function setVoxel(groupName, x, y, z, palKey) {
      const k = `${x},${y},${z}`;
      voxelBuckets[groupName].set(k, { x, y, z, palKey });
    }

    // 镜像添加左右对称体素
    function setSymVoxel(groupName, x, y, z, palKey) {
      setVoxel(groupName, x, y, z, palKey);
      if (x !== 0) {
        setVoxel(groupName, -x, y, z, palKey);
      }
    }

    // 填充长方体区域（支持左右镜像）
    function fillSymBox(groupName, x1, x2, y1, y2, z1, z2, palKey) {
      const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
      const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
      const minZ = Math.min(z1, z2), maxZ = Math.max(z1, z2);
      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            setSymVoxel(groupName, x, y, z, palKey);
          }
        }
      }
    }

    // =========================================================================
    // 5. 精细雕刻梅赛德斯-AMG F1 各空气动力学部件体素模型
    // =========================================================================
    function buildMercedesF1Voxels() {
      // -----------------------------------------------------------------------
      // A. 前鼻翼总成 (frontWing): z = -42 .. -31
      // -----------------------------------------------------------------------
      for (let x = 0; x <= 16; x++) {
        // 前翼多片式层叠倾角结构
        const sweepZ = Math.floor(Math.abs(x) * 0.18);
        // 主翼板 (碳纤维黑)
        setSymVoxel('frontWing', x, 2, -40 + sweepZ, PAL.CARBON);
        setSymVoxel('frontWing', x, 2, -39 + sweepZ, PAL.CARBON);
        // 第二层与第三层襟翼 (马石油青色前缘 + 银色上翼面)
        setSymVoxel('frontWing', x, 2, -41 + sweepZ, PAL.PETRONAS);
        if (x >= 2 && x <= 15) {
          setSymVoxel('frontWing', x, 3, -38 + sweepZ, PAL.BODY_PRIMARY);
          setSymVoxel('frontWing', x, 3, -37 + sweepZ, PAL.CARBON);
          setSymVoxel('frontWing', x, 4, -36 + sweepZ, PAL.PETRONAS);
        }
      }
      // 前翼外侧端板 (Endplates) 与外洗导流片
      for (let y = 2; y <= 6; y++) {
        for (let z = -40; z <= -34; z++) {
          if (y === 6 && z < -38) continue;
          const color = (y === 5 || z === -40) ? PAL.PETRONAS : PAL.CARBON;
          setSymVoxel('frontWing', 16, y, z, color);
        }
      }
      // 端板外侧小翼刀
      setSymVoxel('frontWing', 17, 3, -37, PAL.PETRONAS);
      setSymVoxel('frontWing', 17, 3, -36, PAL.CARBON);

      // 前鼻锥尖端与挂柱 (z = -39 .. -30)
      for (let z = -39; z <= -30; z++) {
        const t = (z + 39) / 9; // 0 -> 1
        const halfW = z < -35 ? 1 : 2;
        const topY = Math.round(3 + t * 3.2);
        const botY = z < -36 ? 3 : 4;
        for (let x = 0; x <= halfW; x++) {
          for (let y = botY; y <= topY; y++) {
            let col = PAL.BODY_PRIMARY;
            if (x === halfW && y === topY) col = PAL.PETRONAS; // 鼻锥两侧青色拉花线条
            if (x === 0 && z === -36 && y === topY) col = PAL.SILVER_STAR; // 梅赛德斯三叉星徽
            if (x === 0 && (z === -33 || z === -32) && y === topY) col = PAL.INEOS; // 鼻尖车号红字点缀
            setSymVoxel('frontWing', x, y, z, col);
          }
        }
      }
      // 前翼吊柱 (Nose Pillars)
      setSymVoxel('frontWing', 1, 3, -37, PAL.CARBON);
      setSymVoxel('frontWing', 1, 3, -36, PAL.CARBON);

      // -----------------------------------------------------------------------
      // B. 单壳体底盘、前悬挂、座舱与车手 (chassis)
      // -----------------------------------------------------------------------
      // 鼻锥中后段向座舱过渡 (z = -29 .. -12)
      for (let z = -29; z <= -12; z++) {
        const t = (z + 29) / 17;
        const halfW = Math.round(2 + t * 2);
        const topY = Math.round(6 + t * 2.8);
        for (let x = 0; x <= halfW; x++) {
          for (let y = 3; y <= topY; y++) {
            let col = PAL.BODY_PRIMARY;
            if (y <= 4) col = PAL.CARBON;
            else if (x === halfW && y >= topY - 1) col = PAL.PETRONAS;
            else if (x === 0 && (z === -21 || z === -20) && y === topY) col = PAL.WHITE; // 44/63 赛号
            setSymVoxel('chassis', x, y, z, col);
          }
        }
      }

      // 前双叉臂推杆悬挂系统 (Front Suspension Wishbones, z = -30 .. -25)
      for (let x = 3; x <= 11; x++) {
        // 下叉臂前/后支臂
        setSymVoxel('chassis', x, 4, -29, PAL.CARBON);
        setSymVoxel('chassis', x, 4, -26, PAL.CARBON);
        // 上叉臂前/后支臂
        const upperY = x < 7 ? 7 : 6;
        setSymVoxel('chassis', x, upperY, -29, PAL.CARBON);
        setSymVoxel('chassis', x, upperY, -27, PAL.CARBON);
        // 推杆斜拉杆 (Pushrod)
        const pushY = Math.round(7.5 - ((x - 3) / 8) * 3);
        setSymVoxel('chassis', x, pushY, -28, PAL.TITANIUM);
      }
      // 前刹车导流罩 (Front Brake Ducts)
      for (let y = 4; y <= 7; y++) {
        for (let z = -29; z <= -27; z++) {
          setSymVoxel('chassis', 11, y, z, y === 7 ? PAL.PETRONAS : PAL.CARBON);
        }
      }

      // 座舱环绕壳体 (z = -11 .. +2)
      for (let z = -11; z <= 2; z++) {
        for (let x = 0; x <= 4; x++) {
          for (let y = 2; y <= 9; y++) {
            // 挖空座舱内部空间 (x <= 2, z = -9 .. -1, y >= 5)
            if (x <= 2 && z >= -9 && z <= -1 && y >= 5) continue;
            let col = z < -4 ? PAL.BODY_PRIMARY : PAL.BODY_REAR;
            if (y <= 3) col = PAL.CARBON;
            if (x === 4 && y === 8) col = PAL.PETRONAS;
            if (x >= 3 && y === 9) col = PAL.CARBON; // 座舱防撞头枕护边
            setSymVoxel('chassis', x, y, z, col);
          }
        }
      }

      // 赛车手模型（头盔、护目镜、赛车服与带换挡灯的 F1 方向盘）
      // 身体与肩膀
      fillSymBox('chassis', 0, 2, 4, 6, -5, -2, PAL.CARBON);
      setSymVoxel('chassis', 2, 6, -5, PAL.PETRONAS);
      // 车手头盔 (z = -5 .. -2, y = 7 .. 10)
      for (let x = 0; x <= 1; x++) {
        for (let y = 7; y <= 10; y++) {
          for (let z = -5; z <= -2; z++) {
            if (y === 10 && z === -5 && x === 1) continue;
            let col = PAL.HELMET;
            // 炫彩镀膜护目镜
            if (z === -5 && (y === 8 || y === 9)) col = PAL.VISOR;
            // 头盔顶部马石油条纹
            if (y === 10 && x === 0) col = PAL.PETRONAS;
            setSymVoxel('chassis', x, y, z, col);
          }
        }
      }
      // F1 蝴蝶形方向盘与 LED 换挡指示灯
      setSymVoxel('chassis', 0, 7, -7, PAL.LED_TEAL);
      setSymVoxel('chassis', 1, 7, -7, PAL.STEERING);
      setSymVoxel('chassis', 1, 6, -7, PAL.STEERING);

      // -----------------------------------------------------------------------
      // C. 钛合金 Halo 座舱安全架 (halo)
      // -----------------------------------------------------------------------
      // 前中央立柱
      setSymVoxel('halo', 0, 9, -10, PAL.CARBON);
      setSymVoxel('halo', 0, 10, -10, PAL.CARBON);
      setSymVoxel('halo', 0, 11, -9, PAL.PETRONAS);
      // 两侧环绕弧形钛合金梁
      const haloPts = [
        [1, 11, -9], [2, 11, -8], [3, 11, -7], [3, 11, -6],
        [3, 11, -5], [3, 11, -4], [3, 10, -3], [3, 10, -2], [3, 10, -1]
      ];
      for (const [hx, hy, hz] of haloPts) {
        const col = (hz >= -7 && hz <= -4) ? PAL.PETRONAS : PAL.CARBON;
        setSymVoxel('halo', hx, hy, hz, col);
      }

      // -----------------------------------------------------------------------
      // D. 侧箱、文丘里底板与零侧箱下洗气流通道 (sidepods)
      // -----------------------------------------------------------------------
      // 1. 地面效应宽体碳纤维底板 (Floor, z = -16 .. +27, y = 1..2)
      for (let z = -16; z <= 27; z++) {
        let floorWidth = 12;
        if (z < -12) floorWidth = 9 + Math.floor((z + 16) * 0.75);
        if (z > 18) floorWidth = Math.max(7, 12 - Math.floor((z - 18) * 0.55));

        for (let x = 0; x <= floorWidth; x++) {
          setSymVoxel('sidepods', x, 1, z, PAL.CARBON);
          // 底板外缘马石油青色空气动力学刀锋拉花與银色导流翼
          if (x === floorWidth && z >= -12 && z <= 18) {
            const edgeCol = (z % 4 === 0) ? PAL.SILVER_STAR : PAL.PETRONAS;
            setSymVoxel('sidepods', x, 2, z, edgeCol);
          }
        }
      }
      // 底板前缘文丘里通道导流栅 (Floor Fences, z = -16 .. -13)
      for (let y = 2; y <= 4; y++) {
        setSymVoxel('sidepods', 6, y, -15, PAL.CARBON);
        setSymVoxel('sidepods', 9, y, -15, PAL.CARBON);
        setSymVoxel('sidepods', 11, y, -14, PAL.PETRONAS);
      }

      // 2. 梅赛德斯雕塑感下切侧箱 (Sculpted Undercut Sidepods, z = -11 .. +19)
      for (let z = -11; z <= 19; z++) {
        const progress = (z + 11) / 30; // 0 (前) -> 1 (后部可乐瓶收窄区)
        const maxW = Math.round(10.5 - progress * 5.2);
        const maxH = Math.round(8.5 - progress * 2.8);

        for (let x = 4; x <= maxW; x++) {
          for (let y = 2; y <= maxH; y++) {
            // 挖出侧箱进气口深腔 (z = -11, x = 5..8, y = 5..7)
            if (z === -11 && x >= 5 && x <= 8 && y >= 5 && y <= 7) continue;
            // 侧箱底部大内切导流槽 (Undercut)
            if (x === maxW && y <= 3 && z > -8) continue;

            let col = PAL.BODY_REAR;
            // 侧箱进气口唇边高光
            if (z === -11) {
              col = PAL.PETRONAS;
            } else if (x === maxW && y === Math.round(6 - progress * 2)) {
              // 贯穿车身侧面的标志性马石油青色流线彩条
              col = PAL.PETRONAS;
            } else if (x === maxW && y === Math.round(5 - progress * 2)) {
              // 青色流线伴随的银箭亮银平行线
              col = PAL.SILVER_STAR;
            } else if (y === maxH && x >= 5 && z >= -9 && z <= 4) {
              // 侧箱顶部散热百叶窗 (Cooling Louvres)
              col = (z % 2 === 0) ? PAL.CARBON : PAL.BODY_REAR;
            }
            setSymVoxel('sidepods', x, y, z, col);
          }
        }
      }
      // 后视镜 (Wing Mirrors)
      setSymVoxel('sidepods', 6, 9, -9, PAL.CARBON);
      setSymVoxel('sidepods', 7, 9, -9, PAL.CARBON);
      setSymVoxel('sidepods', 8, 9, -9, PAL.PETRONAS);

      // -----------------------------------------------------------------------
      // E. 引擎盖、INEOS 红色防滚架进气道、三叉星暗纹与鲨鱼鳍 (engineCover)
      // -----------------------------------------------------------------------
      // 1. 头顶防滚架进气道 (Roll Hoop & INEOS Red Airbox, z = -1 .. +6, y = 10..15)
      for (let z = -1; z <= 6; z++) {
        const topY = z <= 3 ? 15 : 14;
        const halfW = z <= 2 ? 2 : 1;
        for (let x = 0; x <= halfW; x++) {
          for (let y = 10; y <= topY; y++) {
            // 挖空中央进气口内部
            if (z === -1 && x === 0 && y >= 11 && y <= 13) continue;
            let col = PAL.INEOS; // 标志性 INEOS 运动红顶置进气道
            if (z === -1) col = PAL.CARBON;
            if (y === 10 && x === halfW) col = PAL.PETRONAS;
            setSymVoxel('engineCover', x, y, z, col);
          }
        }
      }
      // 车顶荧光黄/黑车载摄像机 (T-Cam)
      setSymVoxel('engineCover', 0, 16, 0, PAL.CARBON);
      setSymVoxel('engineCover', 0, 17, 0, PAL.HELMET);
      setSymVoxel('engineCover', 1, 17, 0, PAL.HELMET);

      // 2. 流线型溜背引擎盖与三叉星矩阵涂装 (z = +3 .. +26)
      for (let z = 3; z <= 26; z++) {
        const t = (z - 3) / 23;
        const spineTopY = Math.round(14 - t * 5.2);
        const bodyHalfW = Math.max(2, Math.round(4.5 - t * 2.5));

        for (let x = 0; x <= bodyHalfW; x++) {
          const maxY = x === 0 ? spineTopY : Math.round(10.5 - t * 3.5 - x * 0.6);
          for (let y = 3; y <= maxY; y++) {
            let col = PAL.BODY_REAR;
            // 引擎盖上的梅赛德斯三叉星银色星雨点阵 & AMG 标识
            if (x >= 1 && y >= 5 && y <= 9 && ((z * 3 + y * 5 + x * 7) % 11 === 0)) {
              col = PAL.SILVER_STAR;
            }
            // 引擎盖侧沿青色掠影线
            if (x === bodyHalfW && y === Math.max(4, maxY - 1) && z <= 20) {
              col = PAL.PETRONAS;
            }
            // 背脊顶部 INEOS 红向后延伸过渡
            if (x === 0 && y >= spineTopY - 1 && z <= 12) {
              col = PAL.INEOS;
            }
            setSymVoxel('engineCover', x, y, z, col);
          }
        }
      }

      // 3. 垂直空气动力学鲨鱼鳍 (Shark Fin, x = 0, z = +7 .. +26)
      for (let z = 7; z <= 26; z++) {
        const finTop = Math.round(14.5 - ((z - 7) / 19) * 2.5);
        for (let y = 9; y <= finTop; y++) {
          let col = PAL.CARBON;
          if (y === finTop) col = PAL.PETRONAS;
          if (z >= 14 && z <= 17 && y >= 11 && y <= 12) col = PAL.WHITE; // 尾鳍赛号标识
          setSymVoxel('engineCover', 0, y, z, col);
        }
      }

      // -----------------------------------------------------------------------
      // F. 后悬挂、中央排气管、尾部扩散器与尾翼总成 (chassis & rearWing & drsFlap)
      // -----------------------------------------------------------------------
      // 后拉杆悬挂 (Rear Suspension Wishbones, z = +21 .. +27)
      for (let x = 3; x <= 11; x++) {
        setSymVoxel('chassis', x, 4, 22, PAL.CARBON);
        setSymVoxel('chassis', x, 4, 26, PAL.CARBON);
        setSymVoxel('chassis', x, 7, 23, PAL.CARBON);
        setSymVoxel('chassis', x, 7, 26, PAL.CARBON);
        const pullY = Math.round(4 + ((x - 3) / 8) * 3);
        setSymVoxel('chassis', x, pullY, 24, PAL.TITANIUM);
      }

      // 尾部双通道文丘里扩散器 (Rear Diffuser, z = +27 .. +33, y = 1..5)
      for (let z = 27; z <= 33; z++) {
        const diffTop = 2 + Math.floor((z - 26) * 0.5);
        for (let x = 0; x <= 9; x++) {
          setSymVoxel('chassis', x, diffTop, z, PAL.CARBON);
          // 扩散器垂直分流叶片 (Diffuser Strakes)
          if ((x === 3 || x === 6 || x === 9) && z >= 29) {
            for (let y = 1; y <= diffTop; y++) {
              setSymVoxel('chassis', x, y, z, y === 1 ? PAL.PETRONAS : PAL.CARBON);
            }
          }
        }
      }

      // FIA 中央闪烁防雨尾灯 (Rain Light, z = +34, y = 3..5)
      setSymVoxel('chassis', 0, 3, 33, PAL.CARBON);
      setSymVoxel('chassis', 0, 4, 33, PAL.CARBON);
      setSymVoxel('chassis', 0, 3, 34, PAL.LED_RED);
      setSymVoxel('chassis', 0, 4, 34, PAL.LED_RED);
      setSymVoxel('chassis', 0, 5, 34, PAL.LED_RED);

      // 大口径中置钛合金排气管与废气旁通管 (Exhaust Pipe, z = +27 .. +32, y = 6..7)
      for (let z = 27; z <= 32; z++) {
        setSymVoxel('chassis', 0, 6, z, PAL.TITANIUM);
        setSymVoxel('chassis', 0, 7, z, PAL.TITANIUM);
        setSymVoxel('chassis', 1, 6, z, PAL.TITANIUM);
      }
      setSymVoxel('chassis', 0, 6, 33, PAL.LED_RED); // 排气管内腔炽热微光

      // 尾翼鹅颈单柱支架 (Swan-neck Rear Wing Pylon) & 下层梁翼 (Beam Wing)
      for (let y = 7; y <= 13; y++) {
        setSymVoxel('rearWing', 0, y, 29 + Math.floor((y - 7) * 0.35), PAL.CARBON);
      }
      // 下层梁翼 (Beam Wing)
      for (let x = 0; x <= 8; x++) {
        setSymVoxel('rearWing', x, 8, 31, PAL.CARBON);
        setSymVoxel('rearWing', x, 9, 32, PAL.PETRONAS);
      }
      // 尾翼端板 (Rear Wing Endplates, x = ±9, y = 7..16, z = +30..+35)
      for (let y = 7; y <= 16; y++) {
        for (let z = 30; z <= 35; z++) {
          if (y <= 9 && z === 30) continue;
          if (y === 16 && (z === 30 || z === 35)) continue;
          let col = PAL.CARBON;
          if (y === 15 || (z === 35 && y >= 10)) col = PAL.PETRONAS;
          if (y === 12 && z >= 31 && z <= 33) col = PAL.INEOS;
          setSymVoxel('rearWing', 9, y, z, col);
        }
      }
      // 尾翼下主翼面 (Rear Wing Mainplane)
      for (let x = 0; x <= 8; x++) {
        setSymVoxel('rearWing', x, 12, 31, PAL.CARBON);
        setSymVoxel('rearWing', x, 12, 32, PAL.CARBON);
        setSymVoxel('rearWing', x, 13, 33, PAL.BODY_PRIMARY);
      }
      // DRS 中央执行器整流罩 (DRS Actuator Pod)
      setSymVoxel('rearWing', 0, 14, 31, PAL.CARBON);
      setSymVoxel('rearWing', 0, 15, 31, PAL.PETRONAS);

      // 可活动 DRS 上层尾翼襟翼 (drsFlap: 使用相对于枢轴 (0, 14.5, 33.5) 的局部体素坐标)
      for (let x = 0; x <= 8; x++) {
        // PETRONAS 字样底色尾翼面
        setSymVoxel('drsFlap', x, 0, -1, PAL.PETRONAS);
        setSymVoxel('drsFlap', x, 0, 0, (x % 2 === 0 && x <= 6) ? PAL.WHITE : PAL.PETRONAS);
        setSymVoxel('drsFlap', x, 1, 1, PAL.CARBON);
      }

      // -----------------------------------------------------------------------
      // G. 四条可独立高速旋转的倍耐力 F1 宽体光头胎 (wheelFL, wheelFR, wheelRL, wheelRR)
      // -----------------------------------------------------------------------
      function buildWheel(groupName, isFront, isRight) {
        const halfWidth = isFront ? 2 : 3; // 前轮宽 5 体素，后轮宽 7 体素
        const radius = isFront ? 5 : 5.4;
        const outerX = isRight ? halfWidth : -halfWidth;
        const innerX = isRight ? -halfWidth : halfWidth;

        const rCeil = Math.ceil(radius);
        for (let lx = -halfWidth; lx <= halfWidth; lx++) {
          for (let ly = -rCeil; ly <= rCeil; ly++) {
            for (let lz = -rCeil; lz <= rCeil; lz++) {
              const dist = Math.sqrt(ly * ly + lz * lz);
              if (dist > radius) continue;

              // 倒角边缘：外侧边缘略微收窄让轮胎更圆润饱满
              if ((lx === -halfWidth || lx === halfWidth) && dist > radius - 0.55) continue;

              let col = PAL.TIRE_RUBBER;

              // 外侧轮毂罩与倍耐力彩色胎壁环
              if (lx === outerX) {
                if (dist >= radius - 1.45 && dist <= radius - 0.65) {
                  // 倍耐力标志性双段彩色胎壁环（留出两个缺口让车轮旋转动态清晰可见）
                  const angle = Math.atan2(ly, lz);
                  if (Math.abs(Math.sin(angle * 2)) > 0.32) {
                    col = PAL.TIRE_STRIPE;
                  }
                } else if (dist < radius - 1.45) {
                  // 18英寸空气动力学轮毂盖 + 马石油青色轮圈亮条 + 中央锁止螺母
                  if (dist < 1.1) {
                    col = isRight ? PAL.INEOS : PAL.PETRONAS; // 中央锁止螺母
                  } else if (Math.abs(ly) === 0 || Math.abs(lz) === 0) {
                    col = PAL.SILVER_STAR; // 轮辐动感条纹
                  } else if (dist > radius - 2.15) {
                    col = PAL.PETRONAS;
                  } else {
                    col = PAL.RIM_DARK;
                  }
                }
              } else if (lx === innerX && dist < radius - 1.6) {
                // 内侧碳陶刹车盘与刹车卡钳
                col = dist < 2.5 ? PAL.TITANIUM : PAL.RIM_DARK;
              }

              setVoxel(groupName, lx, ly, lz, col);
            }
          }
        }
      }

      buildWheel('wheelFL', true, false);
      buildWheel('wheelFR', true, true);
      buildWheel('wheelRL', false, false);
      buildWheel('wheelRR', false, true);
    }

    buildMercedesF1Voxels();

    // =========================================================================
    // 6. 将体素数据合批构建为高性能 InstancedMesh
    // =========================================================================
    const materials = {
      CARBON: new THREE.MeshStandardMaterial({
        color: LIVERIES.w15.CARBON,
        map: voxelColorMap,
        bumpMap: voxelBumpMap,
        bumpScale: 0.015,
        roughness: 0.38,
        metalness: 0.35
      }),
      BODY_PRIMARY: new THREE.MeshStandardMaterial({
        color: LIVERIES.w15.BODY_PRIMARY,
        map: voxelColorMap,
        bumpMap: voxelBumpMap,
        bumpScale: 0.012,
        roughness: 0.18,
        metalness: 0.85
      }),
      BODY_REAR: new THREE.MeshStandardMaterial({
        color: LIVERIES.w15.BODY_REAR,
        map: voxelColorMap,
        bumpMap: voxelBumpMap,
        bumpScale: 0.014,
        roughness: 0.28,
        metalness: 0.55
      }),
      SILVER_STAR: new THREE.MeshStandardMaterial({
        color: LIVERIES.w15.SILVER_STAR,
        map: voxelColorMap,
        roughness: 0.12,
        metalness: 0.92
      }),
      PETRONAS: new THREE.MeshStandardMaterial({
        color: LIVERIES.w15.PETRONAS,
        map: voxelColorMap,
        bumpMap: voxelBumpMap,
        bumpScale: 0.01,
        roughness: 0.2,
        metalness: 0.4,
        emissive: new THREE.Color(0x004a42),
        emissiveIntensity: 0.45
      }),
      INEOS: new THREE.MeshStandardMaterial({
        color: LIVERIES.w15.INEOS,
        map: voxelColorMap,
        bumpMap: voxelBumpMap,
        bumpScale: 0.012,
        roughness: 0.22,
        metalness: 0.45
      }),
      TITANIUM: new THREE.MeshStandardMaterial({
        color: 0x8b95a1,
        map: voxelColorMap,
        roughness: 0.25,
        metalness: 0.88
      }),
      WHITE: new THREE.MeshStandardMaterial({
        color: 0xf5f9fc,
        map: voxelColorMap,
        roughness: 0.2,
        metalness: 0.1
      }),
      HELMET: new THREE.MeshStandardMaterial({
        color: 0xd8ff00,
        map: voxelColorMap,
        roughness: 0.15,
        metalness: 0.3,
        emissive: new THREE.Color(0x3a4400),
        emissiveIntensity: 0.3
      }),
      VISOR: new THREE.MeshStandardMaterial({
        color: 0x00f0ff,
        roughness: 0.05,
        metalness: 0.95,
        emissive: new THREE.Color(0x005577),
        emissiveIntensity: 0.4
      }),
      TIRE_RUBBER: new THREE.MeshStandardMaterial({
        color: 0x181a1d,
        map: voxelColorMap,
        bumpMap: voxelBumpMap,
        bumpScale: 0.025,
        roughness: 0.82,
        metalness: 0.08
      }),
      TIRE_STRIPE: new THREE.MeshStandardMaterial({
        color: TIRE_COLORS.soft,
        map: voxelColorMap,
        roughness: 0.3,
        metalness: 0.15,
        emissive: new THREE.Color(TIRE_COLORS.soft),
        emissiveIntensity: 0.28
      }),
      RIM_DARK: new THREE.MeshStandardMaterial({
        color: 0x0e1115,
        map: voxelColorMap,
        roughness: 0.35,
        metalness: 0.65
      }),
      LED_RED: new THREE.MeshStandardMaterial({
        color: 0xff1e38,
        emissive: new THREE.Color(0xff1122),
        emissiveIntensity: 2.2,
        roughness: 0.15
      }),
      LED_TEAL: new THREE.MeshStandardMaterial({
        color: 0x00ffcc,
        emissive: new THREE.Color(0x00ffcc),
        emissiveIntensity: 1.8,
        roughness: 0.15
      }),
      STEERING: new THREE.MeshStandardMaterial({
        color: 0x262c34,
        map: voxelColorMap,
        roughness: 0.4,
        metalness: 0.5
      })
    };

    let totalVoxelCount = 0;
    const dummy = new THREE.Object3D();

    for (const [groupName, bucketMap] of Object.entries(voxelBuckets)) {
      const byMat = {};
      for (const v of bucketMap.values()) {
        if (!byMat[v.palKey]) byMat[v.palKey] = [];
        byMat[v.palKey].push(v);
        totalVoxelCount++;
      }

      const targetGroup = partGroups[groupName];
      for (const [palKey, list] of Object.entries(byMat)) {
        const instMesh = new THREE.InstancedMesh(voxelGeo, materials[palKey], list.length);
        instMesh.castShadow = true;
        instMesh.receiveShadow = true;

        list.forEach((v, idx) => {
          dummy.position.set(v.x * VOXEL_SIZE, v.y * VOXEL_SIZE, v.z * VOXEL_SIZE);
          dummy.updateMatrix();
          instMesh.setMatrixAt(idx, dummy.matrix);
        });
        instMesh.instanceMatrix.needsUpdate = true;
        targetGroup.add(instMesh);
      }
    }

    document.getElementById('voxel-count').textContent = totalVoxelCount.toLocaleString('zh-CN');

    // =========================================================================
    // 7. 赛道地面、FIA 红白体素路缘石 (Kerbs) 与风洞灯光拱廊
    // =========================================================================
    const trackGroup = new THREE.Group();
    scene.add(trackGroup);

    // 程序化赛道柏油与发车格标线纹理
    function createAsphaltTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#0e1318';
      ctx.fillRect(0, 0, 512, 512);

      // 柏油颗粒质感
      for (let i = 0; i < 9000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const v = 16 + Math.floor(Math.random() * 18);
        ctx.fillStyle = `rgb(${v},${v + 3},${v + 6})`;
        ctx.fillRect(x, y, 2, 2);
      }

      // 赛道两侧白线与马石油风格测速网格线
      ctx.fillStyle = 'rgba(0, 210, 190, 0.14)';
      ctx.fillRect(0, 0, 512, 3);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
      ctx.fillRect(28, 0, 8, 512);
      ctx.fillRect(476, 0, 8, 512);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 8);
      tex.anisotropy = 8;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const asphaltTex = createAsphaltTexture();
    const trackPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 120),
      new THREE.MeshStandardMaterial({
        map: asphaltTex,
        roughness: 0.72,
        metalness: 0.15
      })
    );
    trackPlane.rotation.x = -Math.PI / 2;
    trackPlane.position.y = 0.01;
    trackPlane.receiveShadow = true;
    trackGroup.add(trackPlane);

    // 展厅无尽深色反光地面
    const outerFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(220, 220),
      new THREE.MeshStandardMaterial({
        color: 0x070a0f,
        roughness: 0.4,
        metalness: 0.5
      })
    );
    outerFloor.rotation.x = -Math.PI / 2;
    outerFloor.receiveShadow = true;
    trackGroup.add(outerFloor);

    // FIA 赛道两侧红白相间体素路缘石 (Voxel Kerbs)
    const kerbCount = 120;
    const kerbGeo = new THREE.BoxGeometry(0.65, 0.14, 0.96);
    const kerbRedMat = new THREE.MeshStandardMaterial({
      color: 0xd91834,
      map: voxelColorMap,
      roughness: 0.4
    });
    const kerbWhiteMat = new THREE.MeshStandardMaterial({
      color: 0xeef4f8,
      map: voxelColorMap,
      roughness: 0.35
    });

    const kerbRedMesh = new THREE.InstancedMesh(kerbGeo, kerbRedMat, kerbCount);
    const kerbWhiteMesh = new THREE.InstancedMesh(kerbGeo, kerbWhiteMat, kerbCount);
    kerbRedMesh.receiveShadow = true;
    kerbWhiteMesh.receiveShadow = true;
    trackGroup.add(kerbRedMesh, kerbWhiteMesh);

    const kerbPositions = [];
    for (let i = 0; i < kerbCount; i++) {
      const side = i % 2 === 0 ? -1 : 1;
      const zIdx = Math.floor(i / 2);
      kerbPositions.push({
        side,
        baseZ: -30 + zIdx * 1.0
      });
    }

    function updateKerbs(offsetZ) {
      let rIdx = 0, wIdx = 0;
      for (let i = 0; i < kerbPositions.length; i++) {
        const kp = kerbPositions[i];
        let z = ((kp.baseZ + offsetZ + 30) % 60);
        if (z < 0) z += 60;
        z -= 30;

        dummy.position.set(kp.side * 8.4, 0.07, z);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();

        const blockNum = Math.floor(i / 2);
        if (blockNum % 2 === 0) {
          kerbRedMesh.setMatrixAt(rIdx++, dummy.matrix);
        } else {
          kerbWhiteMesh.setMatrixAt(wIdx++, dummy.matrix);
        }
      }
      kerbRedMesh.instanceMatrix.needsUpdate = true;
      kerbWhiteMesh.instanceMatrix.needsUpdate = true;
    }
    updateKerbs(0);

    // =========================================================================
    // 8. 空气动力学风洞流线系统 (Voxel Wind Tunnel Aero Streamlines)
    // =========================================================================
    const aeroGroup = new THREE.Group();
    scene.add(aeroGroup);

    const STREAM_COUNT = 85;
    const streamGeo = new THREE.BoxGeometry(0.11, 0.11, 1.35);
    const streamMat = new THREE.MeshBasicMaterial({
      color: 0x00f5df,
      transparent: true,
      opacity: 0.68
    });
    const streamInst = new THREE.InstancedMesh(streamGeo, streamMat, STREAM_COUNT);
    aeroGroup.add(streamInst);

    const streamParticles = [];
    for (let i = 0; i < STREAM_COUNT; i++) {
      streamParticles.push({
        laneX: (Math.random() - 0.5) * 7.8,
        baseY: 0.4 + Math.random() * 3.4,
        z: (Math.random() - 0.5) * 32,
        speed: 18 + Math.random() * 14,
        scaleZ: 0.6 + Math.random() * 1.1
      });
    }

    // 计算流线经过车身时的抬升与下洗曲率
    function updateAeroStreamlines(dt, speedFactor) {
      if (!state.aeroVisible) {
        aeroGroup.visible = false;
        return;
      }
      aeroGroup.visible = true;

      for (let i = 0; i < STREAM_COUNT; i++) {
        const p = streamParticles[i];
        p.z += p.speed * dt * speedFactor;
        if (p.z > 18) p.z = -16;

        let x = p.laneX;
        let y = p.baseY;
        let pitch = 0;

        // 当流线流经车身 (-10 < z < +9) 时产生真实的空气动力学绕流曲线
        if (Math.abs(x) < 3.6 && p.z > -11 && p.z < 10) {
          const carEnvelope = Math.exp(-Math.pow((p.z + 0.5) / 5.5, 2));
          if (Math.abs(x) < 1.3) {
            // 越过前翼、Halo与引擎盖上方的流线
            const lift = carEnvelope * 1.65;
            y = Math.max(y, 1.2 + lift * 1.8);
            pitch = -(p.z + 0.5) * 0.04 * carEnvelope;
          } else {
            // 侧箱下洗气流与外洗涡流
            x += Math.sign(x) * carEnvelope * 0.55;
            y += carEnvelope * 0.45;
          }
        }
        // 车尾扩散器与尾翼上扬气流 (Rooster Tail)
        if (Math.abs(x) < 2.5 && p.z >= 7 && p.z < 16) {
          const wake = (p.z - 7) / 9;
          y += wake * (state.drsOpen ? 0.55 : 1.35);
          pitch = state.drsOpen ? -0.05 : -0.14;
        }

        dummy.position.set(x, y, p.z);
        dummy.rotation.set(pitch, 0, 0);
        dummy.scale.set(1, 1, p.scaleZ * (state.drsOpen ? 1.35 : 1.0));
        dummy.updateMatrix();
        streamInst.setMatrixAt(i, dummy.matrix);
      }
      streamInst.instanceMatrix.needsUpdate = true;
    }

    // =========================================================================
    // 9. UI 交互事件绑定与相机平滑运镜
    // =========================================================================
    let camAnim = null;
    function flyToCamera(posArr, targetArr) {
      camAnim = {
        startPos: camera.position.clone(),
        endPos: new THREE.Vector3(...posArr),
        startTarget: controls.target.clone(),
        endTarget: new THREE.Vector3(...targetArr),
        progress: 0
      };
    }

    controls.addEventListener('start', () => {
      camAnim = null; // 用户手动拖拽时立即交还控制权
    });

    // 1. 极速巡航 / 静止检视切换
    const btnDrive = document.getElementById('btn-drive');
    btnDrive.addEventListener('click', () => {
      state.driving = !state.driving;
      btnDrive.classList.toggle('active', state.driving);
      btnDrive.textContent = state.driving ? '⚡ 极速巡航' : '🅿️ 静止检视';
      updateTelemetryHUD();
    });

    // 2. DRS 可变尾翼切换
    const btnDrs = document.getElementById('btn-drs');
    btnDrs.addEventListener('click', () => {
      state.drsOpen = !state.drsOpen;
      btnDrs.classList.toggle('active', state.drsOpen);
      updateTelemetryHUD();
    });

    // 3. 风洞气流开关
    const btnAero = document.getElementById('btn-aero');
    btnAero.addEventListener('click', () => {
      state.aeroVisible = !state.aeroVisible;
      btnAero.classList.toggle('active', state.aeroVisible);
    });

    // 4. 体素爆炸拆解视图切换
    const btnExplode = document.getElementById('btn-explode');
    btnExplode.addEventListener('click', () => {
      state.exploded = !state.exploded;
      btnExplode.classList.toggle('active', state.exploded);
    });

    // 5. 倍耐力轮胎配方切换
    const tireBtns = document.querySelectorAll('[data-tire]');
    tireBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tireBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const compound = btn.dataset.tire;
        state.tire = compound;
        const hex = TIRE_COLORS[compound];
        materials.TIRE_STRIPE.color.setHex(hex);
        materials.TIRE_STRIPE.emissive.setHex(hex);
      });
    });

    // 6. 梅赛德斯三代经典涂装切换
    const liveryBtns = document.querySelectorAll('[data-livery]');
    liveryBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        liveryBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const liv = LIVERIES[btn.dataset.livery];
        materials.BODY_PRIMARY.color.setHex(liv.BODY_PRIMARY);
        materials.BODY_REAR.color.setHex(liv.BODY_REAR);
        materials.SILVER_STAR.color.setHex(liv.SILVER_STAR);
        materials.CARBON.color.setHex(liv.CARBON);
        materials.PETRONAS.color.setHex(liv.PETRONAS);
        materials.INEOS.color.setHex(liv.INEOS);
      });
    });

    // 7. 相机预设机位切换
    const CAM_PRESETS = {
      default: { pos: [-22, 11, -24], target: [0, 2.2, 0] },
      cockpit: { pos: [0, 3.6, -5.2], target: [0, 2.4, -22] },
      front:   { pos: [-9, 3.2, -19], target: [0, 1.8, -4] },
      rear:    { pos: [11, 5.2, 20],  target: [0, 2.2, 2] }
    };

    document.querySelectorAll('[data-cam]').forEach(btn => {
      btn.addEventListener('click', () => {
        const preset = CAM_PRESETS[btn.dataset.cam];
        if (preset) flyToCamera(preset.pos, preset.target);
      });
    });

    function updateTelemetryHUD() {
      const speedEl = document.getElementById('speed-readout');
      const drsEl = document.getElementById('drs-readout');
      if (!state.driving) {
        speedEl.textContent = '0 km/h';
      } else {
        speedEl.textContent = state.drsOpen ? '346 km/h' : '312 km/h';
      }
      drsEl.textContent = state.drsOpen ? 'OPEN (+34 km/h)' : 'CLOSED';
      drsEl.classList.toggle('drs-on', state.drsOpen);
    }

    // =========================================================================
    // 10. 窗口自适应与主动画循环 (60FPS)
    // =========================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    const clock = new THREE.Clock();
    let trackScroll = 0;

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // 1. DRS 襟翼平滑开合动画
      const targetDrsAngle = state.drsOpen ? -0.58 : 0;
      state.drsAngle = THREE.MathUtils.lerp(state.drsAngle, targetDrsAngle, dt * 10);
      partGroups.drsFlap.rotation.x = state.drsAngle;

      // 2. 体素模块爆炸拆解平滑过渡
      const targetExplode = state.exploded ? 1 : 0;
      state.explodeProgress = THREE.MathUtils.lerp(state.explodeProgress, targetExplode, dt * 6.5);

      for (const [key, grp] of Object.entries(partGroups)) {
        const base = basePositions[key];
        const off = explodeOffsets[key];
        grp.position.set(
          base.x + off.x * state.explodeProgress,
          base.y + off.y * state.explodeProgress,
          base.z + off.z * state.explodeProgress
        );
      }

      // 3. 车辆高速行驶动画（车轮旋转、底盘高频下压力微震、赛道与路缘石滚动）
      const speedMultiplier = state.driving ? (state.drsOpen ? 1.38 : 1.0) : 0;

      if (speedMultiplier > 0) {
        const wheelAngularVel = 24 * speedMultiplier;
        state.wheelSpin -= wheelAngularVel * dt;
        partGroups.wheelFL.rotation.x = state.wheelSpin;
        partGroups.wheelFR.rotation.x = state.wheelSpin;
        partGroups.wheelRL.rotation.x = state.wheelSpin;
        partGroups.wheelRR.rotation.x = state.wheelSpin;

        // 地面高速滚动
        trackScroll += dt * 26 * speedMultiplier;
        asphaltTex.offset.y = -(trackScroll * 0.12) % 1;
        updateKerbs(trackScroll);

        // 高速空气动力学下压力微幅高频震动
        carRoot.position.y = Math.sin(elapsed * 42) * 0.018;
        carRoot.rotation.z = Math.sin(elapsed * 19) * 0.003;
      } else {
        carRoot.position.y = THREE.MathUtils.lerp(carRoot.position.y, 0, dt * 8);
        carRoot.rotation.z = THREE.MathUtils.lerp(carRoot.rotation.z, 0, dt * 8);
      }

      // 4. FIA 尾部防雨红灯呼吸闪烁
      const rainBlink = (Math.sin(elapsed * 14) > 0) ? 2.8 : 0.45;
      materials.LED_RED.emissiveIntensity = rainBlink;

      // 5. 更新空气动力学流线
      updateAeroStreamlines(dt, state.driving ? (state.drsOpen ? 1.45 : 1.0) : 0.35);

      // 6. 相机预设运镜平滑插值
      if (camAnim) {
        camAnim.progress = Math.min(1, camAnim.progress + dt * 2.2);
        const ease = 1 - Math.pow(1 - camAnim.progress, 3);
        camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
        controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
        if (camAnim.progress >= 1) camAnim = null;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
  <script src="../prompt-panel.js" data-id="f1-car-web"></script>
</body>
