<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 基础工具 ================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(19840917);
const rr = (a, b) => a + (b - a) * rnd();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const wrapAngle = a => Math.atan2(Math.sin(a), Math.cos(a));
const H = Math.PI / 2;
const qE = (x = 0, y = 0, z = 0) => new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z));

const isTouch = ('ontouchstart' in window) || window.matchMedia('(pointer: coarse)').matches;
if (isTouch) {
  document.body.classList.add('touch');
  document.getElementById('hint').textContent = '左摇杆移动 · 单指拖动旋转视角 · 双指缩放';
}

/* ================= 渲染器 / 场景 / 相机 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY_TOP = new THREE.Color(0x86b7e8), SKY_HOR = new THREE.Color(0xf1e7da), SKY_BOT = new THREE.Color(0xe6dfd2);
scene.background = SKY_HOR.clone();
scene.fog = new THREE.Fog(SKY_HOR, 60, 330);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1400);
camera.position.set(7.5, 3.8, 9.5);
if (camera.aspect < 0.8) camera.position.multiplyScalar(1.45);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * 0.47;
controls.rotateSpeed = 0.7;
let userOrbiting = false, lastInteract = -10;
controls.addEventListener('start', () => { userOrbiting = true; });
controls.addEventListener('end', () => { userOrbiting = false; lastInteract = performance.now() / 1000; });

// 环境反射（程序化房间环境，给金属件柔和高光）
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
pmrem.dispose();

// 灯光：柔和半球光 + 暖色太阳
scene.add(new THREE.HemisphereLight(0xe3efff, 0xbcae94, 0.75));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.3);
const SUN_OFF = new THREE.Vector3(26, 42, 18);
sun.position.copy(SUN_OFF);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 120 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);

// 天空穹顶（渐变着色器）
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1000, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uTop: { value: SKY_TOP }, uHor: { value: SKY_HOR }, uBot: { value: SKY_BOT } },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform vec3 uTop; uniform vec3 uHor; uniform vec3 uBot; varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 c = mix(uHor, uTop, smoothstep(0.0, 0.6, h));
        c = mix(c, uBot, smoothstep(0.0, -0.12, h));
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  })
);
sky.renderOrder = -1;
scene.add(sky);

/* ================= 材质 ================= */
const std = (color, metalness, roughness, extra = {}) => new THREE.MeshStandardMaterial({ color, metalness, roughness, ...extra });
const M = {
  red: std(0xc8161d, 0.35, 0.32),
  redDark: std(0x8f1016, 0.4, 0.38),
  blue: std(0x1f50c2, 0.35, 0.34),
  blueDark: std(0x15306f, 0.4, 0.4),
  silver: std(0xdfe4ea, 1.0, 0.2),
  gray: std(0x646c78, 0.55, 0.45),
  dark: std(0x22262d, 0.3, 0.65),
  glass: std(0x1d3550, 0.9, 0.06, { envMapIntensity: 1.6 }),
  tire: std(0x18191b, 0.0, 0.88),
  light: std(0xfff6d8, 0.0, 0.3, { emissive: 0xfff0b8, emissiveIntensity: 2.2 }),
  amber: std(0xffb340, 0.0, 0.3, { emissive: 0xff9a1a, emissiveIntensity: 1.6 }),
  tail: std(0xff3a30, 0.0, 0.3, { emissive: 0xff1a10, emissiveIntensity: 1.8 }),
  eye: std(0x9fe6ff, 0.0, 0.2, { emissive: 0x4fc8ff, emissiveIntensity: 0.4 }),
};

/* ================= 几何辅助 ================= */
const geoCache = new Map();
function RB(w, h, d, r = 0.04) {
  const key = w + ',' + h + ',' + d + ',' + r;
  let g = geoCache.get(key);
  if (!g) {
    const mn = Math.min(w, h, d);
    g = (mn < 0.08 || r <= 0) ? new THREE.BoxGeometry(w, h, d) : new RoundedBoxGeometry(w, h, d, 2, Math.min(r, mn * 0.45));
    geoCache.set(key, g);
  }
  return g;
}
function box(g, w, h, d, mat, x = 0, y = 0, z = 0, r = 0.04) {
  const m = new THREE.Mesh(RB(w, h, d, r), mat);
  m.position.set(x, y, z);
  g.add(m);
  return m;
}
function cyl(g, rt, rb, h, mat, x = 0, y = 0, z = 0, axis = 'y', seg = 20) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  if (axis === 'x') m.rotation.z = H; else if (axis === 'z') m.rotation.x = H;
  g.add(m);
  return m;
}

/* ================= 车轮 ================= */
const WR = 0.45, WW = 0.3;
const tireGeo = new THREE.CylinderGeometry(WR, WR, WW, 32).rotateZ(H);
const lugGeo = (() => {
  const arr = [];
  for (let i = 0; i < 18; i++) {
    const b = new THREE.BoxGeometry(WW * 0.92, 0.05, 0.11);
    b.translate(0, WR, 0); b.rotateX(i / 18 * Math.PI * 2);
    arr.push(b);
  }
  return mergeGeometries(arr);
})();
const rimGeo = new THREE.CylinderGeometry(WR * 0.6, WR * 0.6, WW + 0.02, 24).rotateZ(H);
const hubGeo = new THREE.CylinderGeometry(WR * 0.18, WR * 0.24, WW + 0.1, 12).rotateZ(H);
const spokeGeo = (() => {
  const arr = [];
  for (let i = 0; i < 5; i++) {
    const b = new THREE.BoxGeometry(WW + 0.05, 0.2, 0.07);
    b.translate(0, 0.13, 0); b.rotateX(i / 5 * Math.PI * 2);
    arr.push(b);
  }
  return mergeGeometries(arr);
})();
const wheels = [];
function makeWheel(front) {
  const pivot = new THREE.Group(), spin = new THREE.Group();
  pivot.add(spin);
  spin.add(new THREE.Mesh(tireGeo, M.tire), new THREE.Mesh(lugGeo, M.tire),
    new THREE.Mesh(rimGeo, M.silver), new THREE.Mesh(spokeGeo, M.gray), new THREE.Mesh(hubGeo, M.redDark));
  const w = { pivot, spin, front };
  wheels.push(w);
  return w;
}

/* ================= 部件造型（同一套部件组成两种形态） ================= */
function buildChest(g) {
  box(g, 2.2, 1.0, 1.0, M.red, 0, 0, 0, 0.07);
  for (const sx of [-1, 1]) {
    box(g, 0.88, 0.5, 0.06, M.glass, sx * 0.5, 0.13, 0.49, 0.02);   // 前挡风玻璃 = 胸窗
    box(g, 0.06, 0.42, 0.55, M.glass, sx * 1.1, 0.13, 0.12, 0.02);  // 侧窗
  }
  box(g, 0.1, 0.56, 0.08, M.red, 0, 0.13, 0.5);
  box(g, 2.0, 0.1, 0.06, M.silver, 0, -0.24, 0.5);
  box(g, 2.16, 0.07, 0.14, M.dark, 0, 0.43, 0.5);
  for (let i = -2; i <= 2; i++) box(g, 0.14, 0.07, 0.08, M.amber, i * 0.3, 0.535, 0.32); // 顶灯
  box(g, 0.5, 0.08, 0.04, M.silver, 0, -0.38, 0.5);
}
function buildHead(g) {
  box(g, 0.56, 0.5, 0.5, M.blue, 0, 0.04, -0.03, 0.08);
  box(g, 0.38, 0.32, 0.1, M.silver, 0, -0.06, 0.23, 0.03);
  for (let i = 0; i < 3; i++) box(g, 0.24, 0.025, 0.02, M.dark, 0, -0.1 - i * 0.05, 0.285);
  box(g, 0.32, 0.065, 0.03, M.eye, 0, 0.07, 0.285);
  box(g, 0.1, 0.16, 0.3, M.blue, 0, 0.33, 0.05);
  box(g, 0.06, 0.1, 0.04, M.silver, 0, 0.32, 0.21);
  for (const sx of [-1, 1]) {
    cyl(g, 0.022, 0.035, 0.34, M.blue, sx * 0.31, 0.25, -0.02, 'y', 10);
    cyl(g, 0.08, 0.08, 0.06, M.silver, sx * 0.29, 0.02, 0, 'x', 16);
  }
  cyl(g, 0.12, 0.14, 0.22, M.gray, 0, -0.3, -0.02, 'y', 14);
}
function buildGrille(g) {
  box(g, 1.2, 0.7, 0.5, M.silver, 0, 0, 0, 0.05);
  box(g, 1.04, 0.56, 0.04, M.dark, 0, 0, 0.24);
  for (let i = 0; i < 7; i++) box(g, 1.0, 0.035, 0.04, M.silver, 0, -0.24 + i * 0.08, 0.265);
}
function buildPelvis(g) {
  box(g, 1.4, 0.5, 0.8, M.gray, 0, 0, 0, 0.06);
  box(g, 0.55, 0.36, 0.06, M.silver, 0, 0, 0.41);
  box(g, 0.28, 0.18, 0.04, M.blue, 0, 0, 0.45);
  for (const sx of [-1, 1]) cyl(g, 0.2, 0.2, 0.22, M.dark, sx * 0.62, -0.18, 0, 'x', 16);
}
function buildSleeper(g) {
  box(g, 2.0, 1.0, 0.4, M.red, 0, 0, 0, 0.06);
  box(g, 1.8, 0.08, 0.05, M.silver, 0, -0.25, -0.2);
  for (const sx of [-1, 1]) for (let i = 0; i < 3; i++) box(g, 0.5, 0.04, 0.04, M.dark, sx * 0.5, 0.08 + i * 0.09, -0.205);
}
function buildStack(g) {
  cyl(g, 0.09, 0.09, 1.2, M.silver, 0, 0, 0, 'y', 16);
  cyl(g, 0.12, 0.12, 0.12, M.gray, 0, -0.5, 0, 'y', 16);
  cyl(g, 0.115, 0.115, 0.06, M.gray, 0, 0.1, 0, 'y', 16);
  cyl(g, 0.098, 0.098, 0.05, M.dark, 0, 0.6, 0, 'y', 16);
}
function buildDoor(g, s) {
  box(g, 0.1, 0.75, 1.0, M.red, 0, 0, 0, 0.03);
  box(g, 0.03, 0.32, 0.55, M.glass, s * 0.05, 0.15, 0.08);
  box(g, 0.04, 0.04, 0.16, M.silver, s * 0.06, -0.08, -0.25);
  box(g, 0.03, 0.06, 0.9, M.silver, s * 0.055, -0.28, 0);
}
function buildBumper(g, s) {
  box(g, 1.1, 0.32, 0.3, M.silver, 0, 0, 0, 0.05);
  box(g, 0.26, 0.17, 0.05, M.light, s * 0.36, 0.02, 0.15);
  box(g, 0.12, 0.1, 0.05, M.amber, s * 0.08, 0.02, 0.15);
  box(g, 0.9, 0.04, 0.03, M.dark, 0, -0.1, 0.155);
}
function buildUpperArm(g, s) {
  box(g, 0.55, 1.1, 0.6, M.red, 0, 0, 0, 0.05);
  box(g, 0.68, 0.32, 0.72, M.redDark, 0, 0.42, 0, 0.06);
  box(g, 0.3, 0.45, 0.05, M.silver, 0, -0.18, 0.31);
  const w = makeWheel(true);
  w.pivot.position.set(s * 0.42, 0.3, 0);
  g.add(w.pivot);
}
function buildForearm(g, s) {
  box(g, 0.6, 1.1, 0.65, M.red, 0, 0, 0, 0.05);
  box(g, 0.64, 0.22, 0.69, M.blue, 0, -0.45, 0, 0.05);
  box(g, 0.34, 0.3, 0.04, M.dark, 0, 0.15, 0.33);
  cyl(g, 0.2, 0.2, 0.9, M.silver, s * 0.42, 0.02, 0, 'y', 22);     // 油箱
  for (const y of [-0.26, 0.3]) cyl(g, 0.212, 0.212, 0.05, M.dark, s * 0.42, y, 0, 'y', 22);
}
function buildFist(g, s) {
  box(g, 0.42, 0.45, 0.45, M.blue, 0, 0, 0, 0.06);
  for (let i = 0; i < 3; i++) box(g, 0.02, 0.3, 0.44, M.dark, -0.1 + i * 0.1, -0.05, 0.02);
  box(g, 0.12, 0.2, 0.2, M.blueDark, -s * 0.2, 0.06, 0.1, 0.03);
}
function buildThigh(g) {
  box(g, 0.6, 0.9, 0.6, M.gray, 0, 0, 0, 0.05);
  cyl(g, 0.06, 0.06, 0.62, M.silver, 0, 0, 0.31, 'y', 12);
  box(g, 0.5, 0.12, 0.5, M.dark, 0, 0.38, 0);
}
function buildShin(g, s) {
  box(g, 0.85, 1.4, 0.9, M.blue, 0, 0, 0, 0.07);
  box(g, 0.6, 0.3, 0.12, M.silver, 0, 0.55, 0.46, 0.04);
  box(g, 0.5, 0.5, 0.04, M.dark, 0, 0.1, -0.46);
  for (let i = 0; i < 4; i++) box(g, 0.46, 0.03, 0.03, M.silver, 0, -0.08 + i * 0.12, -0.48);
  const w = makeWheel(false);
  w.pivot.position.set(s * 0.6, -0.25, 0.1);
  g.add(w.pivot);
}
function buildFoot(g) {
  box(g, 0.8, 0.35, 1.2, M.blue, 0, 0, 0, 0.06);
  box(g, 0.82, 0.22, 0.3, M.gray, 0, -0.06, 0.5, 0.04);
  for (const sx of [-1, 1]) box(g, 0.2, 0.04, 0.12, M.tail, sx * 0.22, -0.18, 0.35);  // 卡车形态的尾灯
}

/* ================= 机器人骨架（不可见代理，用于计算人形姿态） ================= */
const rigRobot = new THREE.Object3D();
function node(parent, x, y, z, rot) {
  const o = new THREE.Object3D();
  o.position.set(x, y, z);
  if (rot) o.quaternion.copy(rot);
  parent.add(o);
  return o;
}
const RJ = {};
RJ.hips = node(rigRobot, 0, 2.85, 0);
RJ.torso = node(RJ.hips, 0, 0.25, 0);
RJ.head = node(RJ.torso, 0, 1.7, 0);
for (const s of [1, -1]) {
  const k = s > 0 ? 'L' : 'R';
  RJ['shoulder' + k] = node(RJ.torso, s * 1.4, 1.5, 0);
  RJ['elbow' + k] = node(RJ['shoulder' + k], 0, -1.05, 0);

/* ================= 碰撞 ================= */

    p.tilt += p.tiltVel * dt;
    p.yaw += p.yawVel * dt;
    const rest = restOf(p);
    if (p.pos.y <= rest) {

/* ================= 主循环 ================= */
const clock = new THREE.Clock();

    }
  }

  // 引擎声
  if (actx && engGain) {
    const g = muted ? 0 : (state === 'truck' || state === 'toRobot' ? tf : 0) * (0.012 + 0.025 * Math.min(1, Math.abs(v) / 22));
    engGain.gain.setTargetAtTime(g, actx.currentTime, 0.08);
    engOsc.frequency.setTargetAtTime(36 + Math.abs(v) * 3.2 + Math.max(0, inp.f) * 8, actx.currentTime, 0.1);
    engFilter.frequency.setTargetAtTime(220 + Math.abs(v) * 25, actx.currentTime, 0.1);
  }

  updateProps(dt);
  updateSparks(dt);

  // 阴影相机跟随
  sun.position.copy(bot.position).add(SUN_OFF);
  sun.target.position.copy(bot.position);

  updateCamera(dt, now);
  sky.position.copy(camera.position);
  updateHUD(dt);

  // 镜头震动（渲染前叠加、渲染后撤销，不干扰轨道控制）
  shakeAmt = Math.max(0, shakeAmt - dt * 0.9);
  const sa = morphing ? Math.max(shakeAmt, 0.015) : shakeAmt;
  _shake.set(rr(-1, 1), rr(-1, 1), rr(-1, 1)).multiplyScalar(sa * 0.25);
  camera.position.add(_shake);
  renderer.render(scene, camera);
  camera.position.sub(_shake);
}
renderer.setAnimationLoop(loop);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
<script src="../prompt-panel.js" data-id="optimus-kiro-opus"></script>
</body>
