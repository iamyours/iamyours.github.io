<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 工具函数 ================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261006);
const rr = (a, b) => a + (b - a) * rand();
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
function hash2(i, j) {
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
}
function fbm2(x, y, o = 4) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < o; i++) { s += a * noise2(x * f + i * 31.7, y * f - i * 17.3); n += a; a *= 0.5; f *= 2.02; }
  return s / n;
}

/* ================= 渲染器 / 场景 / 相机 ================= */
const PR = Math.min(window.devicePixelRatio || 1, 2);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(PR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const FOG_COL = new THREE.Color().setRGB(0.07, 0.085, 0.16);
scene.fog = new THREE.FogExp2(FOG_COL, 0.02);
scene.background = FOG_COL.clone();

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
const TARGET = new THREE.Vector3(-0.5, 2.6, -6);
camera.position.set(6, 4.2, 14);
if (camera.aspect < 0.8) camera.position.sub(TARGET).multiplyScalar(1.45).add(TARGET);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 42;
controls.maxPolarAngle = 1.5;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.8;
controls.update();

/* ================= 月光与灯光 ================= */
const MOON_POS = new THREE.Vector3(-166, 117, -369);
const MOON_DIR = MOON_POS.clone().normalize();
const MOON_R = 38;
const keyDir = new THREE.Vector3(MOON_DIR.x, 0, MOON_DIR.z).normalize().multiplyScalar(Math.cos(0.9));
keyDir.y = Math.sin(0.9);
const moonLight = new THREE.DirectionalLight(0xe4e6ff, 1.8);
moonLight.position.copy(keyDir).multiplyScalar(45).add(new THREE.Vector3(0, 0, -3));
moonLight.target.position.set(0, 0, -3);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
Object.assign(moonLight.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 110 });
moonLight.shadow.bias = -0.0005;
moonLight.shadow.normalBias = 0.03;
scene.add(moonLight, moonLight.target);
const warmMoon = new THREE.DirectionalLight(0xffd9a0, 0.35);
warmMoon.position.copy(MOON_DIR).multiplyScalar(40);
scene.add(warmMoon);
scene.add(new THREE.HemisphereLight(0x3a5384, 0x0e0d10, 0.9));

/* ================= 程序化贴图 ================= */
function canvasTex(w, h, draw, { srgb = true, repeat = false } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;
  return t;
}
function noiseFill(g, w, h, base, amp, sc) {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  const img = g.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < w * h; i++) {
    const x = i % w, y = (i / w) | 0;
    const n = fbm2(x * sc, y * sc, 4) * amp + (rand() - 0.5) * amp * 0.6;
    d[i * 4] += n; d[i * 4 + 1] += n; d[i * 4 + 2] += n * 0.95;
  }
  g.putImageData(img, 0, 0);
}
const woodTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#6b4a32'; g.fillRect(0, 0, w, h);
  const P = 64;
  for (let y = 0; y < h; y += P) {
    const s = rr(-18, 18);
    g.fillStyle = `rgb(${107 + s},${74 + s * 0.8},${50 + s * 0.6})`; g.fillRect(0, y, w, P - 3);
    for (let k = 0; k < 36; k++) {
      g.strokeStyle = `rgba(40,22,10,${rr(0.05, 0.2)})`; g.lineWidth = rr(0.5, 2);
      g.beginPath(); const yy = y + rr(2, P - 5); g.moveTo(0, yy);
      for (let x = 0; x <= w; x += 32) g.lineTo(x, yy + Math.sin(x * 0.02 + k) * rr(0.5, 2));
      g.stroke();
    }
    g.fillStyle = 'rgba(20,10,5,0.8)'; g.fillRect(0, y + P - 3, w, 3);
    g.fillRect(rand() * w, y, 3, P - 3);
  }
}, { repeat: true });
const stoneTex = canvasTex(256, 256, (g, w, h) => noiseFill(g, w, h, '#8a8a86', 40, 0.03), { repeat: true });
const blockTex = canvasTex(512, 512, (g, w, h) => {
  noiseFill(g, w, h, '#8f8d86', 36, 0.025);
  g.strokeStyle = 'rgba(25,25,25,0.75)'; g.lineWidth = 3;
  for (let y = 0; y < h; y += 64) {
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    const off = (y / 64) % 2 ? 64 : 0;
    for (let x = off; x < w; x += 128) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 64); g.stroke(); }
  }
}, { repeat: true });
blockTex.repeat.set(0.5, 0.5);
const barkTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#3b2b20'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    g.strokeStyle = `rgba(${rand() < 0.5 ? '15,10,6' : '90,72,55'},${rr(0.2, 0.6)})`;
    g.lineWidth = rr(1, 3); const x = rand() * w, y = rand() * h;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(-3, 3), y + rr(10, 40)); g.stroke();
  }
}, { repeat: true });
const tileTex = canvasTex(256, 256, (g, w, h) => {
  for (let x = 0; x < w; x += 32) {
    const gr = g.createLinearGradient(x, 0, x + 32, 0);
    gr.addColorStop(0, '#1d1f24'); gr.addColorStop(0.5, '#5a5e68'); gr.addColorStop(1, '#1d1f24');
    g.fillStyle = gr; g.fillRect(x, 0, 32, h);
  }
  g.fillStyle = 'rgba(0,0,0,0.45)';
  for (let y = 0; y < h; y += 32) g.fillRect(0, y, w, 4);
}, { repeat: true });
const rafterTex = canvasTex(256, 64, (g, w, h) => {
  g.fillStyle = '#5c2a1c'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(20,6,3,0.7)';
  for (let x = 0; x < w; x += 16) g.fillRect(x, 0, 5, h);
}, { repeat: true });
const latticeTex = canvasTex(256, 64, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  g.strokeStyle = '#7a2a1a'; g.lineWidth = 4;
  g.strokeRect(2, 2, w - 4, h - 4);
  for (let x = 0; x < w; x += 32) {
    g.strokeRect(x + 6, 8, 20, h - 30);
    g.beginPath(); g.moveTo(x + 16, h - 22); g.lineTo(x + 16, h - 4); g.stroke();
  }
}, {});
const lanternTex = canvasTex(256, 128, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#7a0e06'); gr.addColorStop(0.5, '#ff5a1e'); gr.addColorStop(1, '#7a0e06');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(60,5,0,0.55)';
  for (let x = 0; x < w; x += w / 12) g.fillRect(x, 0, 3, h);
  g.fillStyle = '#d9a640'; g.fillRect(0, 0, w, 7); g.fillRect(0, h - 7, w, 7);
});
const lotusLeafTex = canvasTex(256, 256, (g, w, h) => {
  const gr = g.createRadialGradient(128, 128, 4, 128, 128, 128);
  gr.addColorStop(0, '#6f9a4a'); gr.addColorStop(0.7, '#2f5a2a'); gr.addColorStop(1, '#1f3d1c');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(160,200,120,0.35)'; g.lineWidth = 2;
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * Math.PI * 2;
    g.beginPath(); g.moveTo(128, 128); g.lineTo(128 + Math.cos(a) * 126, 128 + Math.sin(a) * 126); g.stroke();
  }
});
const mooncakeTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#b8702c'; g.fillRect(0, 0, w, h);
  const gr = g.createRadialGradient(128, 128, 10, 128, 128, 128);
  gr.addColorStop(0, '#e0a050'); gr.addColorStop(1, '#a35e22');
  g.fillStyle = gr; g.beginPath(); g.arc(128, 128, 120, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#7a4214'; g.lineWidth = 5;
  g.beginPath(); g.arc(128, 128, 92, 0, Math.PI * 2); g.stroke();
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    g.beginPath(); g.arc(128 + Math.cos(a) * 104, 128 + Math.sin(a) * 104, 9, 0, Math.PI * 2); g.stroke();
  }
  g.fillStyle = '#7a4214'; g.font = 'bold 92px "Songti SC","STSong","SimSun",serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('月', 128, 134);
});
mooncakeTex.repeat.set(1 / 0.17, 1 / 0.17); mooncakeTex.offset.set(0.5, 0.5);

/* 共享风场 uniform：桂树枝叶摇曳 */
const windU = { uTime: { value: 0 } };
function windify(mat, flutter) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = windU.uTime;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uTime;
        vec3 windOffset(vec3 p){
          float h = clamp((p.y - 1.6) / 4.5, 0.0, 1.0); h *= h;
          vec3 o = vec3(sin(uTime*1.1 + p.x*0.35 + p.z*0.2)*0.6 + sin(uTime*2.3 + p.y*1.3)*0.25, 0.0,
                        cos(uTime*0.9 + p.z*0.4)*0.45) * 0.12 * h;
          ${flutter ? 'o += vec3(sin(uTime*7.0 + p.x*13.0 + p.z*11.0), sin(uTime*6.0 + p.y*17.0), cos(uTime*8.0 + p.z*9.0)) * 0.012 * h;' : ''}
          return o;
        }`)
      .replace('#include <project_vertex>', `
        vec4 mvPosition = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          mvPosition = instanceMatrix * mvPosition;
        #endif
        vec4 wPos = modelMatrix * mvPosition;
        wPos.xyz += windOffset(wPos.xyz);
        mvPosition = viewMatrix * wPos;
        gl_Position = projectionMatrix * mvPosition;`);
  };
  mat.customProgramCacheKey = () => 'wind' + (flutter ? 1 : 0);
  return mat;
}

/* ================= 夜空 / 星空 / 满月 / 远山 ================= */
const GLSL_NOISE = `
  float h3(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453); }
  float n3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
    return mix(mix(mix(h3(i), h3(i+vec3(1,0,0)), f.x), mix(h3(i+vec3(0,1,0)), h3(i+vec3(1,1,0)), f.x), f.y),
               mix(mix(h3(i+vec3(0,0,1)), h3(i+vec3(1,0,1)), f.x), mix(h3(i+vec3(0,1,1)), h3(i+vec3(1,1,1)), f.x), f.y), f.z); }
  float fbm3(vec3 p){ float s = 0.0, a = 0.5; for(int i=0;i<5;i++){ s += a*n3(p); p *= 2.03; a *= 0.5; } return s; }
`;
const skyMat = new THREE.ShaderMaterial({
  uniforms: { uMoonDir: { value: MOON_DIR }, uTime: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform vec3 uMoonDir; uniform float uTime; varying vec3 vDir;
    ${GLSL_NOISE}
    void main(){
      vec3 d = normalize(vDir); float y = d.y;
      vec3 col = mix(vec3(0.07,0.085,0.16), vec3(0.03,0.045,0.1), smoothstep(0.0, 0.25, y));
      col = mix(col, vec3(0.01,0.016,0.04), smoothstep(0.25, 0.9, y));
      col = mix(col, vec3(0.05,0.06,0.11), smoothstep(0.0, -0.2, y));
      float md = max(dot(d, uMoonDir), 0.0);
      col += vec3(1.0,0.8,0.5) * pow(md, 14.0) * 0.28 + vec3(0.5,0.6,0.9) * pow(md, 3.0) * 0.04;
      float c = fbm3(d * vec3(3.0, 9.0, 3.0) + vec3(uTime*0.006, 0.0, uTime*0.003));
      c = smoothstep(0.55, 0.82, c) * smoothstep(0.03, 0.2, y) * (1.0 - smoothstep(0.5, 0.9, y));
      vec3 cloudCol = vec3(0.09,0.1,0.16) + vec3(1.0,0.85,0.6) * pow(md, 6.0) * 0.5;
      col = mix(col, cloudCol, c * 0.55);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  side: THREE.BackSide, depthWrite: false, fog: false
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), skyMat);
sky.renderOrder = -10;
scene.add(sky);

// 星空
const starMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uPR: { value: PR }, uMoonDir: { value: MOON_DIR } },
  vertexShader: `
    attribute float aSize; attribute float aPhase; uniform float uTime; uniform float uPR; uniform vec3 uMoonDir; varying float vA;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv;
      vec3 d = normalize(position);
      vA = (0.55 + 0.45 * sin(uTime * (1.2 + aPhase) + aPhase * 20.0)) * (1.0 - smoothstep(0.97, 0.995, dot(d, uMoonDir))) * smoothstep(0.02, 0.15, d.y);
      gl_PointSize = aSize * uPR;
    }`,
  fragmentShader: `varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); gl_FragColor = vec4(vec3(0.85,0.9,1.0) * a * vA * 0.9, 1.0); }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false
});
{
  const N = 1600, pos = new Float32Array(N * 3), sz = new Float32Array(N), ph = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const y = rr(0.03, 1), a = rand() * Math.PI * 2, r = Math.sqrt(1 - y * y);
    pos.set([Math.cos(a) * r * 850, y * 850, Math.sin(a) * r * 850], i * 3);
    sz[i] = rand() < 0.06 ? rr(2.5, 3.5) : rr(1, 2.2); ph[i] = rand() * 6;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  const stars = new THREE.Points(g, starMat); stars.renderOrder = -9; stars.frustumCulled = false;
  scene.add(stars);
}

// 满月：陨石坑 + 月海 + 临边昏暗（Shader）
const moon = new THREE.Mesh(new THREE.SphereGeometry(MOON_R, 64, 48), new THREE.ShaderMaterial({
  vertexShader: `varying vec3 vN; varying vec3 vVN; void main(){ vN = normal; vVN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    varying vec3 vN; varying vec3 vVN;
    ${GLSL_NOISE}
    vec3 hash33(vec3 p){ p = vec3(dot(p,vec3(127.1,311.7,74.7)), dot(p,vec3(269.5,183.3,246.1)), dot(p,vec3(113.5,271.9,124.6))); return fract(sin(p)*43758.5453); }
    float craters(vec3 p, out float rim){
      vec3 i = floor(p), f = fract(p); float shade = 0.0; rim = 0.0;
      for (int x=-1; x<=1; x++) for (int y=-1; y<=1; y++) for (int z=-1; z<=1; z++){
        vec3 g = vec3(float(x), float(y), float(z)); vec3 o = hash33(i + g);
        float d = length(g + o * 0.8 + 0.1 - f);
        float k = d / (0.16 + 0.22 * o.y);
        shade = max(shade, smoothstep(1.0, 0.2, k));
        rim = max(rim, exp(-pow((k - 1.0) * 5.0, 2.0)));
      }
      return shade;
    }
    void main(){
      vec3 p = normalize(vN);
      float maria = smoothstep(0.45, 0.62, fbm3(p * 1.6 + 3.1));
      float detail = fbm3(p * 14.0);
      float r1, r2; float c1 = craters(p * 5.0, r1); float c2 = craters(p * 13.0 + 7.0, r2);
      float b = (1.0 - maria * 0.34) * (0.85 + 0.3 * detail);
      b *= 1.0 - c1 * 0.2 + r1 * 0.14;
      b *= 1.0 - c2 * 0.12 + r2 * 0.08;
      float mu = clamp(dot(normalize(vVN), vec3(0.0, 0.0, 1.0)), 0.0, 1.0);
      b *= 0.7 + 0.3 * sqrt(mu);
      gl_FragColor = vec4(vec3(1.0, 0.93, 0.78) * b * 1.9, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  fog: false
}));
moon.position.copy(MOON_POS);
moon.rotation.set(0.4, 2.2, 0.1);

function ridge(radius, base, amp, freq, c1, seed) {
  const seg = 360, pos = [], cols = [], idx = [];
  const c0 = c1.clone().multiplyScalar(0.55);
  for (let i = 0; i <= seg; i++) {
    const a = i / seg * Math.PI * 2;
    const n = 1 - Math.abs(fbm2(Math.cos(a) * freq + seed, Math.sin(a) * freq - seed, 5));
    const h = base + amp * n * n * n;
    pos.push(Math.cos(a) * radius, h, Math.sin(a) * radius, Math.cos(a) * radius, -20, Math.sin(a) * radius);
    cols.push(c1.r, c1.g, c1.b, c0.r, c0.g, c0.b);
  }
  for (let i = 0; i < seg; i++) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, fog: false, side: THREE.DoubleSide }));
  m.renderOrder = -7;
  scene.add(m);
}

const RIPPLE_N = 16;

  name: 'MoonWater',

    color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null },
    uTime: { value: 0 }, uMoonDir: { value: MOON_DIR.clone() },
    uRipples: { value: Array.from({ length: RIPPLE_N }, () => new THREE.Vector4(0, 0, -100, 0)) }

  vertexShader: `
    uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vWorld;

      vec4 wp = modelMatrix * vec4(position, 1.0); vWorld = wp.xyz;

    uniform vec4 uRipples[${RIPPLE_N}];
    varying vec4 vUv; varying vec3 vWorld;

    #include <fog_pars_fragment>
    #include <logdepthbuf_pars_fragment>

    float hgt(vec2 p){
      vec2 fl = vec2(uTime * 0.12, uTime * 0.03);
      return vn(p * 0.9 - fl) * 0.5 + vn(p * 2.1 + fl * 1.3 + 7.0) * 0.25 + vn(p * 4.7 - fl * 2.0 + 3.0) * 0.12

    for (let t = 0; t < 60 && leaves.some(l => Math.hypot(l.x - x, l.z - z) < l.r + 0.12); t++) { x = x0 + rr(-1, 1); z = z0 + rr(-1, 1); }
    if (waterMask(x, z) < 0.98) continue;
    const h = open ? rr(0.45, 0.75) : rr(0.55, 0.9);
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.016, h + 1.3, 6), stemMat);
    stem.position.set(x, (h - 1.3) / 2, z); scene.add(stem);
    const fl = new THREE.Group(); fl.position.set(x, h, z); fl.rotation.y = rand() * 6.28;
    const fm = new THREE.Mesh(open ? openGeo : budGeo, petalMat); fm.castShadow = true; fl.add(fm);
    if (open) {
      const pod = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.035, 0.05, 16), podMat); pod.position.y = 0.04; fl.add(pod);
      const st = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.012, 6, 20), podMat); st.rotation.x = Math.PI / 2; st.position.y = 0.035; fl.add(st);
    }
    scene.add(fl);
    lotusObstacles.push({ x, z, r: 0.3 });
  }
}

/* ================= 金鱼 ================= */
const fishes = [];
{
  const bodyGeo = new THREE.SphereGeometry(1, 16, 12);
  const finShape = new THREE.Shape();
  finShape.moveTo(0, 0); finShape.quadraticCurveTo(0.08, 0.1, 0.17, 0.12); finShape.quadraticCurveTo(0.12, 0, 0.17, -0.12); finShape.quadraticCurveTo(0.08, -0.1, 0, 0);
  const tailGeo = new THREE.ShapeGeometry(finShape, 6).rotateY(Math.PI / 2);
  const dShape = new THREE.Shape(); dShape.moveTo(0, 0); dShape.quadraticCurveTo(0.03, 0.07, 0.1, 0.05); dShape.lineTo(0.12, 0); dShape.lineTo(0, 0);
  const dorsalGeo = new THREE.ShapeGeometry(dShape, 4).rotateY(Math.PI / 2);
  const palette = [[0xff5a12, 0xffa040], [0xffb030, 0xffe08a], [0xff3a1a, 0xffffff], [0xff7a20, 0xffc070], [0xf04a10, 0xffd0a0], [0xffc040, 0xff6a20]];
  palette.forEach(([c1, c2], k) => {
    const g = new THREE.Group();
    const geo = bodyGeo.clone();
    const p = geo.attributes.position, cols = new Float32Array(p.count * 3), a = new THREE.Color(c1), b = new THREE.Color(c2), c = new THREE.Color();
    for (let i = 0; i < p.count; i++) {
      const n = fbm2(p.getX(i) * 2 + k * 5, p.getZ(i) * 2.5 + p.getY(i) * 2, 3);
      c.copy(a).lerp(b, smooth(0.0, 0.3, n)); cols.set([c.r, c.g, c.b], i * 3);
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    const bodyMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.35, emissive: c1, emissiveIntensity: 0.18 });
    const body = new THREE.Mesh(geo, bodyMat); body.scale.set(0.055, 0.05, 0.16); g.add(body);
    const finMat = new THREE.MeshStandardMaterial({ color: c2, emissive: c1, emissiveIntensity: 0.15, transparent: true, opacity: 0.75, side: THREE.DoubleSide, depthWrite: false });
    const tail = new THREE.Group(); tail.position.z = -0.14; tail.add(new THREE.Mesh(tailGeo, finMat)); g.add(tail);
    const dorsal = new THREE.Mesh(dorsalGeo, finMat); dorsal.position.set(0, 0.035, 0.05); g.add(dorsal);
    const eyeG = new THREE.SphereGeometry(0.009, 8, 6), eyeMt = new THREE.MeshBasicMaterial({ color: 0x111111 });
    for (const sx of [-1, 1]) { const ey = new THREE.Mesh(eyeG, eyeMt); ey.position.set(sx * 0.04, 0.012, 0.12); g.add(ey); }
    const sc = rr(0.85, 1.2); g.scale.setScalar(sc);
    scene.add(g);
    fishes.push({ g, tail, x: 0, z: 0, y: -0.16 - k * 0.04, h: rand() * 6.28, speed: rr(0.45, 0.75), wander: 0, phase: rand() * 6.28, nibble: rr(3, 8) });
  });
}
function fishClear(x, z) {
  if (x > 9 || waterMask(x, z) < 0.985) return 0;
  if (x > PAV.x - 3.6 && x < PAV.x + 3.6 && z > PAV.z - 3.6 && z < PAV.z + 3.6) return 0;
  if (Math.hypot(x - RABBIT_ROCK.x, z - RABBIT_ROCK.z) < 1.9) return 0;
  for (const o of lotusObstacles) if (Math.hypot(x - o.x, z - o.z) < o.r) return 0;
  return 1;
}
for (const f of fishes) {
  for (let t = 0; t < 500; t++) {
    const x = rr(-6, 7), z = rr(-3, 6);
    if (fishClear(x, z) && fishes.every(o => o === f || Math.hypot(o.x - x, o.z - z) > 1)) { f.x = x; f.z = z; break; }
  }
}

/* ================= 飘落桂花粒子 ================= */
const pxScale = () => window.innerHeight * PR / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
const PN = 650;
const pPos = new Float32Array(PN * 3), pRot = new Float32Array(PN), pSize = new Float32Array(PN), pAlpha = new Float32Array(PN);
const pState = new Uint8Array(PN), pLife = new Float32Array(PN), pSpin = new Float32Array(PN), pSeed = new Float32Array(PN), pFall = new Float32Array(PN);
const petalGeo = new THREE.BufferGeometry();
petalGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
petalGeo.setAttribute('aRot', new THREE.BufferAttribute(pRot, 1).setUsage(THREE.DynamicDrawUsage));
petalGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1));
petalGeo.setAttribute('aAlpha', new THREE.BufferAttribute(pAlpha, 1).setUsage(THREE.DynamicDrawUsage));
const petalMat = new THREE.ShaderMaterial({
  uniforms: { uPx: { value: pxScale() } },
  vertexShader: `
    attribute float aRot; attribute float aSize; attribute float aAlpha; uniform float uPx; varying float vRot; varying float vA;
    void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * uPx / max(-mv.z, 0.1); vRot = aRot; vA = aAlpha; }`,
  fragmentShader: `
    varying float vRot; varying float vA;
    void main(){
      vec2 p = gl_PointCoord - 0.5; float c = cos(vRot), s = sin(vRot); p = mat2(c, -s, s, c) * p;
      float r = length(p) * 2.0, a = atan(p.y, p.x);
      float lobe = 0.62 + 0.38 * cos(4.0 * a);
      float m = smoothstep(lobe * 0.9, lobe * 0.9 - 0.15, r);
      if (m * vA < 0.05) discard;
      vec3 col = mix(vec3(1.0, 0.6, 0.1), vec3(1.0, 0.86, 0.42), smoothstep(0.0, 0.7, r));
      col *= (1.0 - 0.35 * smoothstep(0.25, 0.0, r)) * (0.8 + 0.2 * sin(vRot * 2.0));
      gl_FragColor = vec4(col * 1.15, m * vA);
    }`,
  transparent: true, depthWrite: false
});
const petals = new THREE.Points(petalGeo, petalMat);
petals.frustumCulled = false; petals.renderOrder = 2;
scene.add(petals);

function groundAt(x, z) {
  let h = terrainH(x, z);
  const dx = (x - RABBIT_ROCK.x) / 1.3, dz = (z - RABBIT_ROCK.z) / 1.0;
  if (dx * dx + dz * dz < 1) h = Math.max(h, -0.15 + (RABBIT_ROCK.top + 0.15) * Math.sqrt(1 - dx * dx - dz * dz));
  if (Math.abs(x - BR.x) < 1.0 && Math.abs(z - BR.z) < BR.half) h = Math.max(h, bridgeTop(z - BR.z));
  return h;
}
function spawnPetal(i) {
  const f = flowerPts[Math.floor(rand() * flowerPts.length)] || TREE;
  pPos[i * 3] = f.x + rr(-0.1, 0.1); pPos[i * 3 + 1] = f.y; pPos[i * 3 + 2] = f.z + rr(-0.1, 0.1);
  pState[i] = 0; pFall[i] = rr(0.28, 0.5); pSpin[i] = rr(-3, 3); pSeed[i] = rand() * 100; pAlpha[i] = 1; pSize[i] = rr(0.05, 0.08);
}
function updatePetals(dt, t) {
  for (let i = 0; i < PN; i++) {
    const k = i * 3, sd = pSeed[i];
    let x = pPos[k], y = pPos[k + 1], z = pPos[k + 2];
    if (pState[i] === 0) {
      x += (0.32 + 0.25 * Math.sin(t * 0.3 + sd) + Math.sin(t * 2.1 + sd * 10) * 0.35) * dt;
      z += (0.18 + 0.15 * Math.cos(t * 0.23 + sd * 2) + Math.cos(t * 1.7 + sd * 7) * 0.35) * dt;
      y -= pFall[i] * (0.8 + 0.4 * Math.sin(t * 3 + sd * 5)) * dt;
      pRot[i] += pSpin[i] * dt;
      if (x > PAV.x - 4.3 && x < PAV.x + 4.3 && z > PAV.z - 4.3 && z < PAV.z + 4.3) { spawnPetal(i); continue; }
      if (y < 3.2) {
        const g = groundAt(x, z);
        if (y <= g + 0.02) {
          if (g < 0 && waterMask(x, z) > 0.55) { pState[i] = 1; y = 0.03; pLife[i] = rr(10, 22); if (rand() < 0.35) addRipple(x, z, 0.6); }
          else { pState[i] = 2; y = g + 0.02; pLife[i] = rr(3, 6); }
        }
      }
    } else if (pState[i] === 1) {
      if (waterMask(x, z) > 0.75) { x += (0.1 + 0.05 * Math.sin(t * 0.2 + sd)) * dt; z += 0.03 * Math.cos(t * 0.15 + sd) * dt; }
      y = 0.028 + 0.012 * Math.sin(t * 1.5 + sd * 9);
      pRot[i] += pSpin[i] * 0.08 * dt;
      pLife[i] -= dt; pAlpha[i] = Math.min(1, pLife[i] / 2);
      if (pLife[i] <= 0) { spawnPetal(i); continue; }
    } else {
      pLife[i] -= dt; pAlpha[i] = Math.min(1, pLife[i] / 1.5);
      if (pLife[i] <= 0) { spawnPetal(i); continue; }
    }
    pPos[k] = x; pPos[k + 1] = y; pPos[k + 2] = z;
  }
}
for (let i = 0; i < PN; i++) spawnPetal(i);
prerolling = true;
for (let s = 0; s < 400; s++) updatePetals(0.05, s * 0.05);
prerolling = false;

/* ================= 水面夜雾 + 微光 ================= */
const mistMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute vec3 aOffset; attribute float aSize; attribute float aSeed; uniform float uTime; varying vec2 vUv; varying float vA; varying float vY;
    void main(){
      vec3 c = aOffset;
      c.x += sin(uTime * 0.05 + aSeed * 6.28) * 3.0; c.z += cos(uTime * 0.04 + aSeed * 12.0) * 2.0; c.y += sin(uTime * 0.3 + aSeed * 20.0) * 0.1;
      vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
      vec3 up = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
      vec3 w = c + right * position.x * aSize + up * position.y * aSize * 0.55;
      vY = w.y; vUv = uv;
      vec4 mv = viewMatrix * vec4(w, 1.0);
      vA = smoothstep(1.5, 5.0, -mv.z) * (0.6 + 0.4 * sin(uTime * 0.2 + aSeed * 30.0));
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec2 vUv; varying float vA; varying float vY;
    void main(){ float d = length(vUv - 0.5) * 2.0; float a = exp(-d * d * 3.5) * (1.0 - smoothstep(0.8, 1.0, d)) * smoothstep(0.0, 0.35, vY);
      gl_FragColor = vec4(vec3(0.55, 0.62, 0.82) * a * vA * 0.07, 1.0); }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
{
  const base = new THREE.PlaneGeometry(1, 1);
  const g = new THREE.InstancedBufferGeometry();
  g.index = base.index; g.setAttribute('position', base.attributes.position); g.setAttribute('uv', base.attributes.uv);
  const MN = 70, off = [], sz = [], sd = [];
  while (sz.length < MN) {
    const x = rr(-14, 14), z = rr(-9, 8);
    if (waterMask(x, z) < 0.6) continue;
    off.push(x, rr(0.35, 0.9), z); sz.push(rr(2.5, 5.5)); sd.push(rand());
  }
  g.setAttribute('aOffset', new THREE.InstancedBufferAttribute(new Float32Array(off), 3));
  g.setAttribute('aSize', new THREE.InstancedBufferAttribute(new Float32Array(sz), 1));
  g.setAttribute('aSeed', new THREE.InstancedBufferAttribute(new Float32Array(sd), 1));
  g.instanceCount = MN;
  const mist = new THREE.Mesh(g, mistMat); mist.frustumCulled = false; mist.renderOrder = 3; scene.add(mist);
}
const glimMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uPx: { value: pxScale() } },
  vertexShader: `
    attribute float aSeed; uniform float uTime; uniform float uPx; varying float vA; varying float vS;
    void main(){
      vec3 p = position; p.y += sin(uTime * 0.4 + aSeed * 40.0) * 0.25; p.x += sin(uTime * 0.2 + aSeed * 13.0) * 0.4;
      vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv;
      vA = pow(0.5 + 0.5 * sin(uTime * (1.0 + fract(aSeed * 7.0) * 2.0) + aSeed * 60.0), 3.0);
      vS = fract(aSeed * 3.7);
      gl_PointSize = 0.035 * uPx / max(-mv.z, 0.5);
    }`,
  fragmentShader: `varying float vA; varying float vS; void main(){ float d = length(gl_PointCoord - 0.5); float a = exp(-d * d * 30.0);
    gl_FragColor = vec4(mix(vec3(1.0, 0.8, 0.45), vec3(0.8, 0.88, 1.0), vS) * a * vA * 1.6, 1.0); }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
{
  const GN = 240, pos = [], sd = [];
  while (sd.length < GN) {
    const x = rr(-13, 13), z = rr(-9, 8);
    if (waterMask(x, z) < 0.7) continue;
    pos.push(x, rr(0.15, 1.8), z); sd.push(rand());
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.Float32BufferAttribute(sd, 1));
  const glim = new THREE.Points(g, glimMat); glim.frustumCulled = false; glim.renderOrder = 3; scene.add(glim);
}

/* ================= 后期：柔和辉光 ================= */
const composerRT = new THREE.WebGLRenderTarget(window.innerWidth * PR, window.innerHeight * PR, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, composerRT);
composer.setPixelRatio(PR);
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ================= 动画循环 ================= */
const clock = new THREE.Clock();
const _v = new THREE.Vector3();
function updateFish(f, dt, t) {
  f.wander = THREE.MathUtils.clamp(f.wander + rr(-1, 1) * dt * 2, -0.8, 0.8);
  let turn = f.wander * 0.6;
  const look = 1.0, ch = Math.cos(f.h), sh = Math.sin(f.h);
  if (!fishClear(f.x + ch * look, f.z + sh * look)) {
    const l = fishClear(f.x + Math.cos(f.h + 0.9) * look, f.z + Math.sin(f.h + 0.9) * look);
    const r = fishClear(f.x + Math.cos(f.h - 0.9) * look, f.z + Math.sin(f.h - 0.9) * look);
    turn = (l >= r ? 1 : -1) * 2.4;
  }
  for (const o of fishes) {
    if (o === f) continue;
    const dx = o.x - f.x, dz = o.z - f.z, d = Math.hypot(dx, dz);
    if (d < 0.7) turn += (ch * dz - sh * dx > 0 ? -1 : 1) * 1.5;
  }
  f.h += turn * dt;
  const sp = f.speed * (0.85 + 0.25 * Math.sin(t * 0.7 + f.phase));
  const nx = f.x + Math.cos(f.h) * sp * dt, nz = f.z + Math.sin(f.h) * sp * dt;
  if (fishClear(nx, nz)) { f.x = nx; f.z = nz; } else f.h += 2.5 * dt;
  f.g.position.set(f.x, f.y + Math.sin(t * 0.9 + f.phase) * 0.03, f.z);
  f.g.rotation.set(Math.sin(t * 0.9 + f.phase) * 0.08, Math.PI / 2 - f.h + Math.sin(t * 8 + f.phase) * 0.06, 0);
  f.tail.rotation.y = Math.sin(t * 9 + f.phase) * 0.5;
  f.nibble -= dt;
  if (f.nibble < 0) { f.nibble = rr(4, 9); addRipple(f.x + Math.cos(f.h) * 0.2, f.z + Math.sin(f.h) * 0.2, 0.45); }
}
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;
  const t = simTime;
  windU.uTime.value = t;
  skyMat.uniforms.uTime.value = t;
  starMat.uniforms.uTime.value = t;
  waterU.uTime.value = t;
  mistMat.uniforms.uTime.value = t;
  glimMat.uniforms.uTime.value = t;

  updatePetals(dt, t);
  petalGeo.attributes.position.needsUpdate = true;
  petalGeo.attributes.aRot.needsUpdate = true;
  petalGeo.attributes.aAlpha.needsUpdate = true;
  petalGeo.attributes.aSize.needsUpdate = true;

  for (const f of fishes) updateFish(f, dt, t);
  // 玉兔：偶尔转动耳朵、轻轻点头
  for (const e of ears) {
    e.next -= dt;
    if (e.next < 0 && e.t < 0) { e.t = 0; e.next = rr(2, 6); }
    if (e.t >= 0) {
      e.t += dt;
      const k = Math.sin(Math.min(1, e.t / 0.6) * Math.PI);
      e.pv.rotation.set(e.base.x - k * 0.5, e.base.y + e.sx * k * 0.6, e.base.z - e.sx * k * 0.25);
      if (e.t > 0.6) { e.t = -1; e.pv.rotation.copy(e.base); }
    }
  }
  rabbit.userData.head.rotation.set(Math.sin(t * 0.5) * 0.06, Math.sin(t * 0.23) * 0.35, 0);
  rabbit.userData.nose.scale.y = 0.8 + Math.max(0, Math.sin(t * 14)) * 0.25;
  for (const l of lanterns) l.pivot.rotation.set(Math.sin(t * 0.8 + l.phase) * 0.035, 0, Math.cos(t * 0.65 + l.phase) * 0.035);
  for (let i = 0; i < lanternLights.length; i++) lanternLights[i].intensity = 7 * (0.92 + 0.08 * Math.sin(t * 6 + i * 2.1) * Math.sin(t * 2.3 + i));

  _v.copy(MOON_POS).sub(camera.position).normalize();
  halo.position.copy(MOON_POS).addScaledVector(_v, MOON_R * 1.2);
  halo.lookAt(camera.position);

  controls.update();
  composer.render();
}
animate();

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  water.getRenderTarget().setSize(Math.round(w * PR * 0.5), Math.round(h * PR * 0.5));
  petalMat.uniforms.uPx.value = pxScale();
  glimMat.uniforms.uPx.value = pxScale();
});
</script>
