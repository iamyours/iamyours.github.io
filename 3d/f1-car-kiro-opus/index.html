<div class="title">梅赛德斯-AMG F1<small>体素艺术 · 银箭 #44</small></div>
<div class="panel">
  <button id="btnEngine" type="button" aria-pressed="false">🔥 启动引擎</button>
  <button id="btnDrs" type="button" aria-pressed="false">🪽 DRS 开启</button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= 基础工具 ================= */
const V = 0.05;               // 赛车体素尺寸（米）
const DEL = -1;               // 填充函数返回 DEL 表示挖空
const KEY = (i, j, k) => ((i + 512) * 1024 + (j + 512)) * 1024 + (k + 512);
// 整数哈希 → [0,1)，用于体素颜色微扰
function hash3(i, j, k) {
  let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 2147483647);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const clamp = THREE.MathUtils.clamp;

// 体素集合：以整数网格存储颜色和材质类型
class VoxelSet {
  constructor(size = V) { this.size = size; this.map = new Map(); }
  set(i, j, k, c, m = 0) { this.map.set(KEY(i, j, k), { i, j, k, c, m }); }
  del(i, j, k) { this.map.delete(KEY(i, j, k)); }
  get(i, j, k) { return this.map.get(KEY(i, j, k)); }
  has(i, j, k) { return this.map.has(KEY(i, j, k)); }
  // 在包围盒内按体素中心采样，fn 返回 颜色数字 / {c,m} / DEL / null
  fill(x0, x1, y0, y1, z0, z1, fn) {
    const s = this.size;
    for (let i = Math.floor(x0 / s); i <= Math.floor(x1 / s); i++) {
      const x = (i + 0.5) * s; if (x < x0 || x > x1) continue;
      for (let j = Math.floor(y0 / s); j <= Math.floor(y1 / s); j++) {
        const y = (j + 0.5) * s; if (y < y0 || y > y1) continue;
        for (let k = Math.floor(z0 / s); k <= Math.floor(z1 / s); k++) {
          const z = (k + 0.5) * s; if (z < z0 || z > z1) continue;
          const r = fn(x, y, z, Math.abs(x));
          if (r === null || r === undefined) continue;
          if (r === DEL) this.del(i, j, k);
          else if (typeof r === 'number') this.set(i, j, k, r, 0);
          else this.set(i, j, k, r.c, r.m);
        }
      }
    }
  }
  // 球形印章
  stamp(x, y, z, r, c, m = 0) {
    const s = this.size;
    for (let i = Math.floor((x - r) / s); i <= Math.floor((x + r) / s); i++)
      for (let j = Math.floor((y - r) / s); j <= Math.floor((y + r) / s); j++)
        for (let k = Math.floor((z - r) / s); k <= Math.floor((z + r) / s); k++) {
          const dx = (i + 0.5) * s - x, dy = (j + 0.5) * s - y, dz = (k + 0.5) * s - z;
          if (dx * dx + dy * dy + dz * dz <= r * r) this.set(i, j, k, c, m);
        }
  }
  // 管状线段（悬挂臂、Halo 等）
  tube(a, b, r, c, m = 0) {
    const len = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
    const n = Math.max(1, Math.ceil(len / (this.size * 0.4)));
    for (let t = 0; t <= n; t++) {
      const f = t / n;
      this.stamp(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, r, c, m);
    }
  }
  // 给某一列最顶部的体素上色（涂装号码）
  paintTop(i, k, c, m = 0) {
    for (let j = 40; j >= -5; j--) { const v = this.get(i, j, k); if (v) { v.c = c; v.m = m; return; } }
  }
}

/* ================= 渲染器 / 场景 ================= */
const isMobile = Math.min(window.innerWidth, window.innerHeight) < 600;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// 程序化室内环境光照，让银色车漆有反射
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(5.4, 2.7, 5.8);
if (camera.aspect < 0.8) camera.position.setLength(12.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minDistance = 2.2;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.update();

// 灯光
scene.add(new THREE.HemisphereLight(0xdff6ff, 0x2a2420, 0.55));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.4);
sun.position.set(4, 7.5, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -5.5, right: 5.5, top: 5.5, bottom: -5.5, near: 1, far: 20 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x8ff5ea, 0.9);
rim.position.set(-5, 3, -5);
scene.add(rim);

// 体素斜角贴图：中心亮、边缘暗，营造方块拼接感
function makeBevelTex() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 32;
  const g = cv.getContext('2d');
  g.fillStyle = '#c4c4c4'; g.fillRect(0, 0, 32, 32);
  g.fillStyle = '#e6e6e6'; g.fillRect(1, 1, 30, 30);
  g.fillStyle = '#ffffff'; g.fillRect(3, 3, 26, 26);
  g.fillStyle = 'rgba(255,255,255,0.6)'; g.fillRect(3, 3, 26, 2); g.fillRect(3, 3, 2, 26);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const bevelTex = makeBevelTex();
// 材质类型：0 车漆 / 1 哑光（碳纤维、橡胶）/ 2 金属 / 3 发光
const mats = [
  new THREE.MeshStandardMaterial({ map: bevelTex, roughness: 0.3, metalness: 0.45, envMapIntensity: 1.1 }),
  new THREE.MeshStandardMaterial({ map: bevelTex, roughness: 0.82, metalness: 0.05, envMapIntensity: 0.5 }),
  new THREE.MeshStandardMaterial({ map: bevelTex, roughness: 0.22, metalness: 0.9, envMapIntensity: 1.3 }),
  new THREE.MeshStandardMaterial({ map: bevelTex, roughness: 0.4, metalness: 0, emissive: 0xff1a1a, emissiveIntensity: 0.2 })
];
const lightMat = mats[3];
const groundMats = [
  new THREE.MeshStandardMaterial({ map: bevelTex, roughness: 0.92, metalness: 0, envMapIntensity: 0.35 }),
  new THREE.MeshStandardMaterial({ map: bevelTex, roughness: 0.6, metalness: 0, envMapIntensity: 0.5 })
];

// 把体素集合转换为 InstancedMesh（剔除被完全包裹的内部体素）
function buildVoxelMesh(vs, materials, { jitter = 0.08, cast = true, receive = true } = {}) {
  const s = vs.size;
  const geo = new THREE.BoxGeometry(s, s, s);
  const buckets = materials.map(() => []);
  for (const v of vs.map.values()) {
    const { i, j, k } = v;
    if (vs.has(i + 1, j, k) && vs.has(i - 1, j, k) && vs.has(i, j + 1, k) &&
        vs.has(i, j - 1, k) && vs.has(i, j, k + 1) && vs.has(i, j, k - 1)) continue;
    buckets[v.m].push(v);
  }
  const group = new THREE.Group();
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  buckets.forEach((list, mi) => {
    if (!list.length) return;
    const im = new THREE.InstancedMesh(geo, materials[mi], list.length);
    list.forEach((v, n) => {
      m4.makeTranslation((v.i + 0.5) * s, (v.j + 0.5) * s, (v.k + 0.5) * s);
      im.setMatrixAt(n, m4);
      col.setHex(v.c).multiplyScalar(1 + (hash3(v.i, v.j, v.k) - 0.5) * jitter);
      im.setColorAt(n, col);
    });
    im.castShadow = cast; im.receiveShadow = receive;
    im.computeBoundingSphere();
    group.add(im);
  });
  return group;
}

/* ================= 配色（银箭 + 黑 + 石油青） ================= */
const SILVER = 0xc6ccd3, BLACK = 0x15171a, CARBON = 0x23262a, TEAL = 0x00d2be;
const HALO = 0x2a2d31, TIRE = 0x1b1b1d, WHITE = 0xf3f3f3, YELLOW = 0xffd21f, PURPLE = 0x6b2bd6;
const matte = c => ({ c, m: 1 });
const metal = c => ({ c, m: 2 });

// 车身配色：下黑、上银，中间一道石油青腰线
function bodyCol(ax, y, z) {
  if (z > 2.6) return TEAL;
  const line = clamp(0.25 + (z + 1.0) * 0.06, 0.22, 0.36);
  if (y < line - 0.03) return BLACK;
  if (y < line + 0.02) return TEAL;
  return SILVER;
}
// 超椭圆截面（圆角方形）
function inSE(ax, y, hw, bot, top, p = 4) {
  if (hw <= 0 || top <= bot) return false;
  const my = (bot + top) / 2, hh = (top - bot) / 2;
  return Math.pow(ax / hw, p) + Math.pow(Math.abs(y - my) / hh, p) <= 1;
}

/* ================= 车身体素建模 ================= */
const body = new VoxelSet(V);

// 底板
body.fill(-0.9, 0.9, 0.05, 0.1, -1.6, 1.3, (x, y, z, ax) => {
  let w;
  if (z > 0.9) w = 0.85 - (z - 0.9) / 0.4 * 0.5;
  else if (z > -1.1) w = 0.85;
  else w = 0.85 - (-1.1 - z) / 0.5 * 0.35;
  if (ax > w) return null;
  return ax > w - 0.06 ? matte(0x2f3338) : matte(CARBON);
});

// 扩散器：倾斜顶板 + 竖向导流片
body.fill(-0.56, 0.56, 0.05, 0.4, -2.15, -1.55, (x, y, z, ax) => {
  const top = 0.09 + (-1.55 - z) * 0.45;
  if (y > top) return null;
  const strake = Math.abs(ax - 0.2) < 0.026 || Math.abs(ax - 0.4) < 0.026 || ax > 0.5;
  if (y > top - 0.06 || strake) return matte(CARBON);
  return null;
});

// 驾驶舱（生存单元）
body.fill(-0.4, 0.4, 0.09, 0.64, -0.3, 1.3, (x, y, z, ax) => {
  if (!inSE(ax, y, 0.38, 0.06, 0.64, 4)) return null;
  if (z > 0.05 && z < 0.95 && ax < 0.24 && y > 0.42) return null; // 座舱开口
  if (z > 0.0 && z < 1.0 && ax < 0.3 && y > 0.38) return BLACK;  // 座舱内衬
  return bodyCol(ax, y, z);
});

// 车鼻：向前收窄、压低
body.fill(-0.38, 0.38, 0.1, 0.62, 1.3, 2.85, (x, y, z, ax) => {
  const t = (z - 1.3) / 1.55;
  const hw = 0.36 - 0.25 * t, top = 0.62 - 0.28 * t, bot = 0.2 - 0.04 * t;
  if (!inSE(ax, y, hw, bot, top, 3.2)) return null;
  return bodyCol(ax, y, z);
});

// 侧箱：前端进气口，向后收窄
body.fill(-0.75, 0.75, 0.1, 0.52, -0.9, 0.75, (x, y, z, ax) => {
  const sw = z > 0 ? 0.72 : 0.72 - (-z / 0.9) * 0.32;
  const st = 0.24 + (z + 0.9) / 1.65 * 0.26;
  if (ax < 0.36 || ax > sw || y > st) return null;
  const dx = ax - (sw - 0.1), dy = y - (st - 0.1);
  if (dx > 0 && dy > 0 && dx * dx + dy * dy > 0.01) return null; // 外上沿圆角
  if (y < 0.2 && z > 0.25 && ax > sw - 0.14) return null;         // 底部下切
  if (z > 0.66 && ax > 0.44 && ax < sw - 0.05 && y > 0.24 && y < st - 0.04) return matte(0x050506); // 进气口
  return bodyCol(ax, y, z);
});

// 发动机罩
body.fill(-0.36, 0.36, 0.09, 0.84, -1.95, -0.3, (x, y, z, ax) => {
  const t = (-0.3 - z) / 1.65;
  if (!inSE(ax, y, 0.34 - 0.22 * t, 0.04, 0.82 - 0.42 * t, 3)) return null;
  return bodyCol(ax, y, z);
});

// 进气塔（防滚架）
body.fill(-0.18, 0.18, 0.6, 1.0, -0.52, -0.08, (x, y, z, ax) => {
  const hw = 0.17 - (y - 0.6) * 0.2;
  const top = 0.99 - (-0.08 - z) * 0.25;
  if (ax > hw || y > top) return null;
  if (z > -0.2 && ax < 0.09 && y > 0.76 && y < top - 0.04) return matte(0x050506); // 进气口
  return y > 0.9 ? TEAL : SILVER;
});

// 鲨鱼鳍
body.fill(-0.03, 0.03, 0.6, 0.92, -1.75, -0.5, (x, y, z, ax) => {
  const top = 0.9 - 0.3 * ((-0.5 - z) / 1.25);
  return y <= top ? SILVER : null;
});

// 变速箱 / 排气管
body.fill(-0.13, 0.13, 0.15, 0.37, -2.25, -1.9, () => matte(CARBON));
body.tube([0, 0.42, -1.9], [0, 0.42, -2.2], 0.05, 0x7b8088, 2);
body.stamp(0, 0.42, -2.2, 0.03, 0x0a0a0a, 1);

// 车手：头盔 + 肩部 + 方向盘
body.fill(-0.2, 0.2, 0.4, 0.54, 0.05, 0.42, () => matte(0x2d2f36));
body.fill(-0.09, 0.09, 0.47, 0.56, 0.55, 0.62, () => matte(BLACK));
body.fill(-0.15, 0.15, 0.5, 0.78, 0.16, 0.44, (x, y, z, ax) => {
  const dx = ax, dy = y - 0.64, dz = z - 0.3;
  if (dx * dx + dy * dy + dz * dz > 0.0144) return null;
  if (z > 0.33 && y > 0.62 && y < 0.69) return metal(0x1a1a22); // 面罩
  return y > 0.69 ? YELLOW : PURPLE;
});

// Halo 头部保护装置
body.tube([0, 0.6, 1.02], [0, 0.8, 0.9], 0.045, HALO);
for (const sg of [-1, 1]) {
  let prev = null;
  const TH = Math.PI * 0.78;
  for (let n = 0; n <= 24; n++) {
    const th = n / 24 * TH;
    const p = [sg * 0.3 * Math.sin(th), 0.8 - 0.02 * th, 0.47 + 0.43 * Math.cos(th)];
    if (prev) body.tube(prev, p, 0.045, HALO);
    prev = p;
  }
  body.tube(prev, [sg * 0.31, 0.6, 0.1], 0.045, HALO);
}

// 后视镜
for (const sg of [-1, 1]) {
  body.tube([sg * 0.36, 0.55, 0.86], [sg * 0.5, 0.63, 0.86], 0.045, BLACK);
  body.fill(sg > 0 ? 0.46 : -0.61, sg > 0 ? 0.61 : -0.46, 0.6, 0.69, 0.82, 0.91, (x, y, z) =>
    z > 0.88 ? metal(0xaab6c2) : BLACK);
}

// 前翼：主翼面 + 两级襟翼 + 端板 + 支架
body.fill(-0.98, 0.98, 0.05, 0.32, 2.33, 2.97, (x, y, z, ax) => {
  if (ax > 0.9) return (y < 0.3) ? (y > 0.2 ? TEAL : BLACK) : null;        // 端板
  if (y > 0.06 && y < 0.12 && z > 2.55) return ax > 0.7 ? SILVER : BLACK;  // 主翼面
  const lift = (ax - 0.25) * 0.08;                                          // 外侧上扬
  if (ax > 0.24 && z > 2.46 && z < 2.6 && y > 0.12 + lift && y < 0.17 + lift) return SILVER;
  if (ax > 0.3 && z > 2.36 && z < 2.48 && y > 0.17 + lift && y < 0.23 + lift) return ax > 0.82 ? TEAL : BLACK;
  if (ax < 0.07 && z > 2.45 && z < 2.66 && y > 0.1 && y < 0.2) return matte(CARBON); // 支架
  return null;
});

// 悬挂、立柱
const FW = { x: 0.8, y: 0.355, z: 1.75, w: 0.3 };
const RW = { x: 0.78, y: 0.355, z: -1.85, w: 0.4 };
for (const sg of [-1, 1]) {
  const ux = sg * 0.6;
  body.tube([sg * 0.26, 0.5, 1.55], [ux, 0.48, FW.z], 0.045, BLACK);
  body.tube([sg * 0.22, 0.48, 2.0], [ux, 0.48, FW.z], 0.045, BLACK);
  body.tube([sg * 0.24, 0.22, 1.5], [ux, 0.22, FW.z], 0.045, BLACK);
  body.tube([sg * 0.16, 0.22, 2.05], [ux, 0.22, FW.z], 0.045, BLACK);
  body.tube([sg * 0.25, 0.26, 1.7], [ux, 0.46, FW.z], 0.045, CARBON, 1);
  body.fill(sg > 0 ? 0.57 : -0.64, sg > 0 ? 0.64 : -0.57, 0.16, 0.55, FW.z - 0.08, FW.z + 0.08, () => matte(CARBON));
  const rx = sg * 0.53;
  body.tube([sg * 0.2, 0.46, -1.55], [rx, 0.47, RW.z], 0.045, BLACK);
  body.tube([sg * 0.12, 0.44, -2.1], [rx, 0.47, RW.z], 0.045, BLACK);
  body.tube([sg * 0.3, 0.2, -1.5], [rx, 0.22, RW.z], 0.045, BLACK);
  body.tube([sg * 0.12, 0.2, -2.1], [rx, 0.22, RW.z], 0.045, BLACK);
  body.fill(sg > 0 ? 0.5 : -0.57, sg > 0 ? 0.57 : -0.5, 0.16, 0.55, RW.z - 0.09, RW.z + 0.09, () => matte(CARBON));
}

{

/* ================= 车轮（倍耐力轮胎 + 轮毂罩） ================= */
function makeWheel(width, compound) {
  const vs = new VoxelSet(V);
  const R0 = 0.355, hw = width / 2;
  vs.fill(-hw, hw, -R0, R0, -R0, R0, (x, y, z, ax) => {
    const r = Math.hypot(y, z);
    if (r > R0) return null;
    const outer = ax > hw - V;           // 最外层
    const face = ax > hw - 2 * V;        // 轮毂面（内缩一层）
    const seg = Math.floor((Math.atan2(y, z) + Math.PI) / (Math.PI * 2) * 16);
    if (r > 0.25) {
      if (outer && r > 0.335) return null;                                   // 胎肩圆角
      if (outer && r > 0.27 && r < 0.315 && seg % 4 !== 0) return matte(compound); // 胎壁色带（有缺口便于看出转动）
      return matte(TIRE);
    }
    if (outer) return r < 0.06 ? metal(0xd4d8dd) : null;                    // 中心锁止螺母
    if (face) {
      if (r > 0.215) return metal(0x34373c);
      if (r > 0.13 && r < 0.17 && seg % 2 === 0) return TEAL;
      return 0x1d1f23;
    }
    return matte(0x101010);
  });
  return vs;
}

/* ================= 组装赛车 ================= */
const car = new THREE.Group();

const spinGroups = [], steerGroups = [];
for (const [cfg, vs, front] of [[FW, frontWheelVS, true], [RW, rearWheelVS, false]]) {

    steer.add(spin);
    car.add(steer);
    spinGroups.push(spin);
    if (front) steerGroups.push(steer);
  }
}

const G = 0.2;
const ground = new VoxelSet(G);
ground.fill(-4, 4, -0.6, 0, -5.2, 5.2, (x, y, z, ax) => {
  const top = y > -G;
  const h = hash3(Math.floor(x / G), 7, Math.floor(z / G));
  if (ax < 2.4) {
    if (!top) return { c: 0x26282c, m: 0 };
    // 发车格白线
    if ((z > 3.2 && z < 3.4 && ax < 1.2) || (ax > 1.0 && ax < 1.2 && z > 2.0 && z < 3.4)) return { c: 0xeeeeee, m: 1 };
    // 维修区中线（虚线）
    if (ax < 0.2 && (Math.floor((z + 5.2) / 0.8) % 2 === 0) && (z < -2.8 || z > 3.6)) return { c: 0xd9d9d9, m: 1 };
    return { c: h < 0.33 ? 0x3d4046 : h < 0.66 ? 0x373a3f : 0x41444a, m: 0 };
  }
  if (ax < 2.8) {
    if (!top) return { c: 0x26282c, m: 0 };
    return { c: (Math.floor((z + 5.2) / 0.4) % 2) ? 0xf2f2f2 : 0xd62828, m: 1 };
  }
  if (!top) return { c: y > -0.4 ? 0x6b4f3a : 0x553e2e, m: 0 };
  return { c: h < 0.3 ? 0x4caf50 : h < 0.7 ? 0x43a047 : 0x5cbf5f, m: 0 };
});

const props = new VoxelSet(V);
for (const [sx, sz] of [[3.4, 4.3], [-3.4, 4.3], [3.4, -4.3], [-3.4, -4.3], [3.4, 0], [-3.4, 0]]) {
  const n = 3 + (sz === 0 ? 0 : 1);
  for (let l = 0; l < n; l++) {
    const colTire = l % 2 ? 0xf2f2f2 : 0xd62828;
    props.fill(sx - 0.3, sx + 0.3, l * 0.2 + 0.001, l * 0.2 + 0.2, sz - 0.3, sz + 0.3, (x, y, z) => {
      const r = Math.hypot(x - sx, z - sz);
      if (r > 0.3 || r < 0.12) return null;
      const yy = y - l * 0.2;
      return (yy > 0.05 && yy < 0.15 && r > 0.26) ? matte(colTire) : matte(0x1c1c1e);
    });
  }
}
{

  for (let t = 0; t < 140; t++) {

}

/* ================= 排气烟雾（体素粒子） ================= */
const SMOKE_N = 90;
const smokeMat = new THREE.MeshStandardMaterial({ color: 0xc3c8ce, roughness: 1, transparent: true, opacity: 0.42, depthWrite: false });
const smoke = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), smokeMat, SMOKE_N);
smoke.frustumCulled = false;
scene.add(smoke);
const particles = Array.from({ length: SMOKE_N }, () => ({
  p: new THREE.Vector3(), v: new THREE.Vector3(), life: 0, max: 1, rot: new THREE.Euler()
}));
const dummy = new THREE.Object3D();
let smokeHead = 0, smokeAcc = 0;
function spawnSmoke() {
  const s = particles[smokeHead];
  smokeHead = (smokeHead + 1) % SMOKE_N;
  s.p.set((Math.random() - 0.5) * 0.04, 0.42, -2.24);
  s.v.set((Math.random() - 0.5) * 0.25, 0.15 + Math.random() * 0.2, -0.9 - Math.random() * 0.6);
  s.life = 0.0001; s.max = 0.9 + Math.random() * 0.7;
  s.rot.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
}
function updateSmoke(dt, spawning) {
  if (spawning) {
    smokeAcc += dt * 38;
    while (smokeAcc > 1) { smokeAcc--; spawnSmoke(); }
  }
  for (let n = 0; n < SMOKE_N; n++) {
    const s = particles[n];
    if (s.life > 0) {
      s.life += dt;
      s.v.multiplyScalar(1 - dt * 1.2); s.v.y += dt * 0.25;
      s.p.addScaledVector(s.v, dt);
      s.rot.x += dt; s.rot.y += dt * 0.7;
    }
    const f = s.life / s.max;
    if (s.life <= 0 || f >= 1) { s.life = 0; dummy.scale.setScalar(0); }
    else dummy.scale.setScalar(0.04 + f * 0.16 * (1 - f * 0.6));
    dummy.position.copy(s.p).applyMatrix4(car.matrixWorld);
    dummy.rotation.copy(s.rot);
    dummy.updateMatrix();
    smoke.setMatrixAt(n, dummy.matrix);
  }
  smoke.instanceMatrix.needsUpdate = true;
}

const state = { engine: false, drs: false };
const btnEngine = document.getElementById('btnEngine');
const btnDrs = document.getElementById('btnDrs');
const btnRotate = document.getElementById('btnRotate');
function setBtn(btn, on, label) {
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-pressed', String(on));
  btn.textContent = label;
}
btnEngine.addEventListener('click', () => {
  state.engine = !state.engine;
  setBtn(btnEngine, state.engine, state.engine ? '🛑 熄火' : '🔥 启动引擎');
});
btnDrs.addEventListener('click', () => {
  state.drs = !state.drs;
  setBtn(btnDrs, state.drs, state.drs ? '🪽 DRS 关闭' : '🪽 DRS 开启');
});
btnRotate.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;

});

/* ================= 动画循环 ================= */
const clock = new THREE.Clock();
let wheelSpeed = 0, drsAngle = 0, steer = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 车轮转速平滑过渡
  const targetSpeed = state.engine ? 22 : 0;
  wheelSpeed += (targetSpeed - wheelSpeed) * Math.min(1, dt * 1.5);
  for (const s of spinGroups) s.rotation.x += wheelSpeed * dt;
  const targetSteer = state.engine ? Math.sin(t * 0.9) * 0.28 : 0;
  steer += (targetSteer - steer) * Math.min(1, dt * 3);
  for (const g of steerGroups) g.rotation.y = steer;

  // DRS 襟翼开合
  drsAngle += ((state.drs ? -0.6 : 0) - drsAngle) * Math.min(1, dt * 6);
  flapPivot.rotation.x = drsAngle;

  // 引擎振动与雨灯闪烁
  carBody.position.y = state.engine ? Math.sin(t * 95) * 0.0025 : 0;
  lightMat.emissiveIntensity = state.engine ? (Math.sin(t * 22) > 0 ? 3.2 : 0.25) : 0.2;
  updateSmoke(dt, state.engine);

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
