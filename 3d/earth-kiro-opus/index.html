/* =====================================================================
   二、Canvas 栅格化 + 模糊，生成等距圆柱投影的地理特征图
   ===================================================================== */
const lonX = (lon, W) => (lon + 180) / 360 * W;
const latY = (lat, H) => (90 - lat) / 180 * H;

function makeCanvas(W, H) {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  return { cv, g, W, H };
}
function pathPoly(c, pts) {
  c.g.beginPath();
  pts.forEach(([lo, la], i) => {
    const x = lonX(lo, c.W), y = latY(la, c.H);
    i ? c.g.lineTo(x, y) : c.g.moveTo(x, y);
  });
  c.g.closePath();
}
function fillPolys(c, polys, color) {
  c.g.fillStyle = color;
  for (const p of polys) { pathPoly(c, p); c.g.fill(); }
}
// 读取红色通道为浮点数组（0..1）
function readChannel(c) {
  const d = c.g.getImageData(0, 0, c.W, c.H).data;
  const out = new Float32Array(c.W * c.H);
  for (let i = 0; i < out.length; i++) out[i] = d[i * 4] / 255;
  return out;
}
// 可分离盒式模糊：水平方向环绕（经度连续），垂直方向夹紧
function blur(src, W, H, r, passes) {
  let a = src, b = new Float32Array(W * H);
  const inv = 1 / (2 * r + 1);
  for (let p = 0; p < passes; p++) {
    for (let y = 0; y < H; y++) {
      const row = y * W;
      let s = 0;
      for (let k = -r; k <= r; k++) s += a[row + ((k % W) + W) % W];
      for (let x = 0; x < W; x++) {
        b[row + x] = s * inv;
        s += a[row + (x + r + 1) % W] - a[row + ((x - r) % W + W) % W];
      }
    }
    for (let x = 0; x < W; x++) {
      let s = 0;
      for (let k = -r; k <= r; k++) s += b[Math.min(H - 1, Math.max(0, k)) * W + x];
      for (let y = 0; y < H; y++) {
        a[y * W + x] = s * inv;
        s += b[Math.min(H - 1, y + r + 1) * W + x] - b[Math.max(0, y - r) * W + x];
      }
    }
  }
  return a;
}
// 打包四个通道为 DataTexture（同时上下翻转，使 uv.y=1 对应北极）
function packTexture(chs, W, H) {
  const data = new Uint8Array(W * H * 4);
  for (let y = 0; y < H; y++) {
    const sy = H - 1 - y;
    for (let x = 0; x < W; x++) {
      const si = sy * W + x, di = (y * W + x) * 4;
      for (let c = 0; c < 4; c++) {
        const v = chs[c] ? chs[c][si] : 1;
        data[di + c] = Math.max(0, Math.min(255, Math.round(v * 255)));
      }
    }
  }
  const t = new THREE.DataTexture(data, W, H, THREE.RGBAFormat);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  t.minFilter = THREE.LinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  return t;
}

function buildGeoTextures() {
  // 高分辨率陆地遮罩 + 人口分布
  const MW = 2048, MH = 1024;
  const land = makeCanvas(MW, MH);
  fillPolys(land, LAND, '#fff');
  fillPolys(land, WATER, '#000');
  const landArr = readChannel(land);
  const landSharp = blur(landArr.slice(), MW, MH, 1, 2);

  const pop = makeCanvas(MW, MH);
  pop.g.globalCompositeOperation = 'lighter';
  for (const [lo, la, rx, ry, k] of POP) {
    const g = pop.g;
    g.save();
    g.translate(lonX(lo, MW), latY(la, MH));
    g.scale(rx / 360 * MW, ry / 180 * MH);
    const grd = g.createRadialGradient(0, 0, 0, 0, 0, 1);
    const v = Math.round(255 * k);
    grd.addColorStop(0, `rgb(${v},${v},${v})`);
    grd.addColorStop(0.5, `rgb(${Math.round(v * 0.45)},${Math.round(v * 0.45)},${Math.round(v * 0.45)})`);
    grd.addColorStop(1, 'rgb(0,0,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(0, 0, 1, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  const popArr = blur(readChannel(pop), MW, MH, 3, 2);
  const maskTex = packTexture([landSharp, popArr, null, null], MW, MH);

  // 低分辨率特征图：大陆度 / 山脉 / 沙漠 / 冰盖
  const FW = 1024, FH = 512;
  const cont = makeCanvas(FW, FH);
  fillPolys(cont, LAND, '#fff');
  fillPolys(cont, WATER, '#000');
  const contArr = blur(readChannel(cont), FW, FH, 6, 3);

  const mt = makeCanvas(FW, FH);
  mt.g.globalCompositeOperation = 'lighter';
  mt.g.lineCap = 'round'; mt.g.lineJoin = 'round';
  for (const [pts, w, k] of MOUNTAIN_LINES) {
    const v = Math.round(255 * k);
    mt.g.strokeStyle = `rgb(${v},${v},${v})`;
    mt.g.lineWidth = w * FW / 1024;
    mt.g.beginPath();
    pts.forEach(([lo, la], i) => i ? mt.g.lineTo(lonX(lo, FW), latY(la, FH)) : mt.g.moveTo(lonX(lo, FW), latY(la, FH)));
    mt.g.stroke();
  }
  {
    const v = Math.round(255 * PLATEAU[1]);
    fillPolys(mt, [PLATEAU[0]], `rgb(${v},${v},${v})`);
  }
  const mtArr = blur(readChannel(mt), FW, FH, 3, 2);

  const ds = makeCanvas(FW, FH);
  ds.g.globalCompositeOperation = 'lighter';
  for (const [pts, k] of DESERTS) {
    const v = Math.round(255 * k);
    fillPolys(ds, [pts], `rgb(${v},${v},${v})`);
  }
  const dsArr = blur(readChannel(ds), FW, FH, 5, 3);

  const ic = makeCanvas(FW, FH);
  fillPolys(ic, ICE, '#fff');
  const icArr = blur(readChannel(ic), FW, FH, 2, 2);

  const featTex = packTexture([contArr, mtArr, dsArr, icArr], FW, FH);
  return { maskTex, featTex };
}

/* =====================================================================
   三、GLSL 公共函数：3D 单形噪声、分形噪声、球面坐标
   ===================================================================== */
const GLSL_NOISE = /* glsl */`
vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x){ return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v){
  const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
}
float fbm(vec3 p, int oct){
  float s = 0.0, a = 0.5, n = 0.0;
  for (int i = 0; i < 10; i++) {
    if (i >= oct) break;
    s += a * snoise(p); n += a;
    p = p * 2.03 + vec3(1.7, -3.1, 2.3);
    a *= 0.5;
  }
  return s / n;
}
float ridged(vec3 p, int oct){
  float s = 0.0, a = 0.5, w = 1.0, n = 0.0;
  for (int i = 0; i < 10; i++) {
    if (i >= oct) break;
    float r = 1.0 - abs(snoise(p));
    r *= r;
    r *= w; w = clamp(r * 1.6, 0.0, 1.0);
    s += a * r; n += a;
    p = p * 2.07 + vec3(4.1, 1.3, -2.7);
    a *= 0.5;
  }
  return s / n;
}
// 与 SphereGeometry 的 UV 映射一致：u=0 对应经度 -180°，v=1 对应北极
vec3 dirFromUv(vec2 uv){
  float phi = uv.x * 6.28318530718;
  float theta = (1.0 - uv.y) * 3.14159265359;
  return vec3(-cos(phi) * sin(theta), cos(theta), sin(phi) * sin(theta));
}
`;

void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }

  float alat = abs(asin(clamp(p.y, -1.0, 1.0))) / 1.5707963;

  // 域扭曲让海岸线呈现分形细节
  vec3 q = p + 0.06 * vec3(snoise(p * 3.0 + 1.7), snoise(p * 3.0 + 9.2), snoise(p * 3.0 - 4.1));
  float cn = fbm(q * 6.0, 6);
  float cn2 = fbm(q * 42.0, 4);
  float landF = mix(mk.r, ft.r, 0.35) - 0.5 + cn * 0.22 + cn2 * 0.08;
  float land = smoothstep(-0.006, 0.006, landF);

  // ---------- 高度 ----------
  float mountain = smoothstep(0.04, 0.55, ft.g + cn * 0.12);
  float rid = ridged(p * 9.0 + cn * 0.4, 7);
  float hills = fbm(p * 14.0, 5) * 0.5 + 0.5;
  float iceF = smoothstep(0.35, 0.65, ft.a + cn * 0.15);
  float h = 0.03 + clamp(landF, 0.0, 0.4) * 0.12 + hills * 0.1 * (0.4 + ft.r)
          + mountain * (0.25 + rid * 0.65) * (0.6 + 0.4 * ft.g)
          + iceF * 0.12;
  h = clamp(h, 0.0, 1.0) * land;

  // ---------- 生物群系 ----------
  float temp = 1.0 - alat * 1.15 - h * 0.9 + snoise(p * 4.0) * 0.06;
  float desertN = snoise(q * 8.0) * 0.18 + fbm(p * 20.0, 3) * 0.08;
  float desert = smoothstep(0.22, 0.65, ft.b + desertN);
  float sav = smoothstep(0.06, 0.4, ft.b + desertN * 1.2);

  vec3 cTrop   = vec3(0.10, 0.22, 0.07);
  vec3 cTemp   = vec3(0.20, 0.30, 0.12);
  vec3 cBoreal = vec3(0.12, 0.19, 0.11);
  vec3 cTundra = vec3(0.44, 0.41, 0.33);
  vec3 cSav    = vec3(0.53, 0.47, 0.26);
  vec3 cDes1   = vec3(0.86, 0.71, 0.49);
  vec3 cDes2   = vec3(0.74, 0.49, 0.29);
  vec3 cDes3   = vec3(0.91, 0.83, 0.65);
  vec3 cRock   = vec3(0.43, 0.38, 0.33);
  vec3 cSnow   = vec3(0.95, 0.96, 0.98);

  vec3 veg = mix(cBoreal, cTemp, smoothstep(0.25, 0.45, temp));
  veg = mix(veg, cTrop, smoothstep(0.62, 0.82, temp));
  veg = mix(cTundra, veg, smoothstep(0.1, 0.24, temp));
  veg = mix(veg, cSav, sav * smoothstep(0.35, 0.6, temp));
  vec3 des = mix(cDes1, cDes2, smoothstep(-0.2, 0.5, snoise(p * 6.0 + 3.0)));
  des = mix(des, cDes3, smoothstep(0.55, 0.9, fbm(p * 25.0, 3) * 0.5 + 0.5) * 0.6);
  vec3 col = mix(veg, des, desert);
  col *= 0.82 + 0.36 * (fbm(p * 70.0, 4) * 0.5 + 0.5);
  col = mix(col, cRock, smoothstep(0.22, 0.5, h) * 0.8);
  float snowLine = 0.3 + clamp(temp, 0.0, 1.0) * 0.5;
  float snow = smoothstep(-0.03, 0.04, h - snowLine + snoise(p * 60.0) * 0.05);
  snow = max(snow, smoothstep(0.06, -0.02, temp) * 0.9);
  col = mix(col, cSnow, max(snow, iceF));

  // ---------- 海洋 ----------
  float shelf = smoothstep(0.0, 0.5, ft.r * 1.4 + cn * 0.15);
  vec3 deep = vec3(0.02, 0.06, 0.17);
  vec3 mid  = vec3(0.03, 0.12, 0.28);
  vec3 shal = mix(vec3(0.06, 0.28, 0.38), vec3(0.10, 0.46, 0.52), smoothstep(0.6, 0.85, temp));
  vec3 ocean = mix(deep, mid, smoothstep(0.0, 0.35, shelf + fbm(p * 4.0, 4) * 0.12));
  ocean = mix(ocean, shal, smoothstep(0.6, 0.97, shelf));
  float iceThr = p.y > 0.0 ? 0.87 : 0.79;
  float seaIce = smoothstep(iceThr, iceThr + 0.03, alat + snoise(p * 9.0) * 0.035 + snoise(p * 40.0) * 0.01);
  ocean = mix(ocean, vec3(0.86, 0.90, 0.95), seaIce);

  vec3 albedo = mix(ocean, col, land);
  float water = (1.0 - land) * (1.0 - seaIce);

  // ---------- 城市灯光 ----------
  float pop = mk.g;
  float c1 = clamp(snoise(p * 150.0) * 0.5 + 0.5, 0.0, 1.0);
  float c2 = clamp(snoise(p * 420.0) * 0.5 + 0.5, 0.0, 1.0);
  float cities = pow(c1, 5.0) * 2.2 + pow(c2, 6.0) * 1.3;
  float roads = pow(clamp(1.0 - abs(snoise(p * 60.0)), 0.0, 1.0), 16.0) * 0.7;
  float lights = (cities + roads) * smoothstep(0.02, 0.55, pop + cn * 0.08);
  lights += pow(c2, 9.0) * 0.25 * smoothstep(0.3, 0.6, temp);
  lights *= land * (1.0 - iceF) * (1.0 - desert * 0.85) * (1.0 - snow * 0.9);
  lights = clamp(lights, 0.0, 1.0);

  if (uMode == 0) gl_FragColor = vec4(albedo, water);
  else gl_FragColor = vec4(h, lights, land, 1.0);
}
`;

// 云层烘焙：带气旋涡旋与纬度带分布
const CLOUD_BAKE_FRAG = /* glsl */`
varying vec2 vUv;
${GLSL_NOISE}
vec3 swirl(vec3 p, vec3 c, float r, float k){
  float d = distance(p, c);
  float a = k * exp(-d * d / (r * r));
  float s = sin(a), co = cos(a);
  return p * co + cross(c, p) * s + c * dot(c, p) * (1.0 - co);
}
void main(){
  vec3 p = dirFromUv(vUv);
  float lat = asin(clamp(p.y, -1.0, 1.0)) * 57.2958;
  // 气旋：北半球逆时针、南半球顺时针
  p = swirl(p, normalize(vec3(0.55, 0.45, 0.70)), 0.22, 4.5);
  p = swirl(p, normalize(vec3(-0.70, 0.30, -0.65)), 0.18, 4.0);
  p = swirl(p, normalize(vec3(0.20, -0.55, -0.81)), 0.25, -4.5);
  p = swirl(p, normalize(vec3(-0.40, -0.80, 0.45)), 0.30, -3.5);
  p = swirl(p, normalize(vec3(0.85, 0.25, -0.46)), 0.12, 6.0);
  vec3 pp = vec3(p.x, p.y * 1.9, p.z);
  vec3 w = pp + 0.35 * vec3(fbm(pp * 2.0 + 3.1, 4), fbm(pp * 2.0 - 7.4, 4), fbm(pp * 2.0 + 11.9, 4));
  float n = fbm(w * 2.6, 8);
  float al = abs(lat);
  float band = 0.14 * exp(-pow((lat - 6.0) / 8.0, 2.0))
             - 0.16 * exp(-pow((al - 24.0) / 9.0, 2.0))
             + 0.16 * exp(-pow((al - 55.0) / 12.0, 2.0))
             - 0.06 * smoothstep(75.0, 90.0, al);
  float d = smoothstep(0.02, 0.55, n * 0.85 + band + 0.04);
  float detail = fbm(w * 22.0, 5) * 0.5 + 0.5;
  d *= 0.6 + 0.55 * detail;
  d = clamp(d * 1.1 - 0.05, 0.0, 1.0);
  gl_FragColor = vec4(d, d, d, 1.0);
}
`;

// 星空背景烘焙：银河带 + 尘埃带 + 彩色星云
const SKY_BAKE_FRAG = /* glsl */`
varying vec2 vUv;
${GLSL_NOISE}
void main(){
  vec3 d = dirFromUv(vUv);
  vec3 gN = normalize(vec3(0.35, 0.82, -0.45));
  vec3 gC = normalize(cross(gN, vec3(0.0, 0.0, 1.0)));
  float b = dot(d, gN);
  float core = pow(max(dot(d, gC), 0.0), 6.0);
  float band = exp(-b * b / 0.018) * (0.55 + 0.9 * core);
  float n = fbm(d * 4.0, 6) * 0.5 + 0.5;
  float dust = smoothstep(0.45, 0.75, fbm(d * 9.0 + 2.0, 5) * 0.5 + 0.5) * exp(-b * b / 0.004);
  vec3 col = vec3(0.16, 0.15, 0.20) * band * (0.4 + n) * (1.0 - dust * 0.85);
  col += vec3(0.30, 0.24, 0.18) * core * exp(-b * b / 0.006) * (1.0 - dust * 0.8);
  float neb1 = smoothstep(0.55, 0.9, fbm(d * 2.5 + 5.0, 5) * 0.5 + 0.5);
  float neb2 = smoothstep(0.6, 0.95, fbm(d * 3.0 - 8.0, 5) * 0.5 + 0.5);
  col += vec3(0.10, 0.03, 0.07) * neb1 + vec3(0.02, 0.05, 0.11) * neb2;
  col += vec3(0.006, 0.008, 0.016);
  gl_FragColor = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}
`;

// 地表：法线凹凸、海面高光与波纹、云影、晨昏线、夜景灯光、大气散射
const EARTH_FRAG = /* glsl */`
uniform sampler2D tAlbedo;
uniform sampler2D tAux;
uniform sampler2D tCloud;
uniform vec3 uSun;
uniform vec3 uCam;
uniform vec2 uTexel;
uniform float uCloudU;
uniform float uTime;
uniform float uLights;
uniform float uClouds;
uniform float uAtmo;
uniform float uBump;
varying vec2 vUv;
varying vec3 vPos;
${GLSL_NOISE}
void main(){
  vec3 n = normalize(vPos);
  vec3 V = normalize(uCam - vPos);
  vec3 L = normalize(uSun);
  vec4 alb = texture2D(tAlbedo, vUv);
  vec3 albedo = pow(alb.rgb, vec3(2.2));
  float water = alb.a;

  // 局部切线框架（东 / 北）
  vec3 eastR = vec3(n.z, 0.0, -n.x);
  float sinT = max(length(eastR), 0.02);
  vec3 east = eastR / sinT;
  vec3 north = cross(n, east);

  // 由高度图求凹凸法线；采样步长随屏幕导数自适应，远看不闪烁
  float eu = clamp(fwidth(vUv.x), uTexel.x, 0.004);
  float ev = clamp(fwidth(vUv.y), uTexel.y, 0.004);
  float hL = texture2D(tAux, vUv - vec2(eu, 0.0)).r;
  float hR = texture2D(tAux, vUv + vec2(eu, 0.0)).r;
  float hD = texture2D(tAux, vUv - vec2(0.0, ev)).r;
  float hU = texture2D(tAux, vUv + vec2(0.0, ev)).r;
  float dhdu = (hR - hL) / (2.0 * eu) / (6.28318 * sinT);
  float dhdv = (hU - hD) / (2.0 * ev) / 3.14159;
  vec3 nb = normalize(n - uBump * (east * dhdu + north * dhdv));

  // 海面细微波纹
  vec3 N = nb;
  if (water > 0.01) {
    vec3 wp = vPos * 90.0 + vec3(uTime * 0.06, 0.0, uTime * 0.04);
    vec3 w = vec3(snoise(wp), snoise(wp + 19.1), snoise(wp - 7.3));
    w += 0.5 * vec3(snoise(wp * 2.7 + 3.0), snoise(wp * 2.7 - 11.0), snoise(wp * 2.7 + 5.0));
    vec3 nw = normalize(n + (w - n * dot(w, n)) * 0.035);
    N = normalize(mix(nb, nw, water));
  }

  float NLs = dot(n, L);
  float NL = max(dot(N, L), 0.0);
  float day = smoothstep(-0.12, 0.18, NLs);

  // 云影：沿太阳方向偏移采样云层
  vec2 cuv = vec2(vUv.x - uCloudU, vUv.y)
           + vec2(dot(L, east) / (6.28318 * sinT), dot(L, north) / 3.14159) * 0.006;
  float cs = texture2D(tCloud, cuv).r * uClouds;
  float shadow = 1.0 - cs * 0.65;

  vec3 sunCol = vec3(1.0, 0.96, 0.90) * 2.7;
  vec3 sunTint = mix(vec3(1.0, 0.42, 0.18), vec3(1.0), smoothstep(-0.05, 0.35, NLs));

  vec3 col = albedo * sunCol * sunTint * NL * shadow * smoothstep(-0.1, 0.05, NLs);
  col += albedo * vec3(0.012, 0.018, 0.03) * (0.25 + day);

  // 海面高光（太阳耀斑）+ 天空反射
  vec3 H = normalize(L + V);
  float NH = max(dot(N, H), 0.0);
  float NV = max(dot(N, V), 0.0);
  float fres = 0.02 + 0.98 * pow(1.0 - NV, 5.0);
  float spec = (pow(NH, 220.0) * 7.0 + pow(NH, 36.0) * 0.28) * (0.35 + fres);
  col += sunCol * sunTint * spec * water * shadow * smoothstep(0.0, 0.12, NLs);
  col += water * fres * vec3(0.12, 0.26, 0.55) * day * 0.6;

  // 夜景城市灯光
  vec4 aux = texture2D(tAux, vUv);
  float night = 1.0 - smoothstep(-0.18, 0.06, NLs);
  float flick = 0.92 + 0.08 * snoise(vPos * 300.0 + uTime * 0.3);
  vec3 lightCol = mix(vec3(1.0, 0.62, 0.30), vec3(1.0, 0.86, 0.62), aux.g);
  col += lightCol * aux.g * aux.g * 4.0 * night * uLights * (1.0 - cs * 0.75) * flick;

  // 大气透视：边缘蓝色散射、晨昏线暖色
  float vf = 1.0 - max(dot(n, V), 0.0);
  float aL = smoothstep(-0.3, 0.55, NLs);
  vec3 atmoCol = mix(vec3(1.0, 0.45, 0.22), vec3(0.28, 0.55, 1.0), smoothstep(-0.05, 0.35, NLs));
  float haze = clamp(0.04 + pow(vf, 3.0) * 0.9, 0.0, 1.0) * uAtmo;
  col = mix(col, atmoCol * aL * 1.3, haze * aL);
  col += atmoCol * pow(vf, 6.0) * aL * 0.6 * uAtmo;

  gl_FragColor = vec4(col, 1.0);
}
`;

// 云层：立体感凹凸、晨昏染色、夜晚变暗
const CLOUD_FRAG = /* glsl */`
uniform sampler2D tCloud;
uniform vec3 uSun;
uniform vec3 uCam;
uniform vec2 uTexel;
uniform float uOpacity;
varying vec2 vUv;
varying vec3 vPos;
void main(){
  float d = texture2D(tCloud, vUv).r;
  if (d < 0.01) discard;
  vec3 n = normalize(vPos);
  vec3 L = normalize(uSun);
  vec3 V = normalize(uCam - vPos);
  vec3 eastR = vec3(n.z, 0.0, -n.x);
  float sinT = max(length(eastR), 0.02);
  vec3 east = eastR / sinT;
  vec3 north = cross(n, east);
  float eu = clamp(fwidth(vUv.x), uTexel.x, 0.004);
  float ev = clamp(fwidth(vUv.y), uTexel.y, 0.004);
  float dL = texture2D(tCloud, vUv - vec2(eu, 0.0)).r;
  float dR = texture2D(tCloud, vUv + vec2(eu, 0.0)).r;
  float dD = texture2D(tCloud, vUv - vec2(0.0, ev)).r;
  float dU = texture2D(tCloud, vUv + vec2(0.0, ev)).r;
  vec3 g = east * (dR - dL) / (2.0 * eu * 6.28318 * sinT) + north * (dU - dD) / (2.0 * ev * 3.14159);
  vec3 N = normalize(n - g * 0.012);

  float NLs = dot(n, L);
  float NL = clamp(dot(N, L) * 0.75 + 0.25, 0.0, 1.0);
  float day = smoothstep(-0.15, 0.2, NLs);
  vec3 tint = mix(vec3(1.0, 0.5, 0.28), vec3(1.0), smoothstep(-0.02, 0.35, NLs));
  vec3 c = vec3(1.0, 0.98, 0.96) * 2.4 * tint * NL * day * mix(0.75, 1.0, d);
  c += vec3(0.008, 0.01, 0.018);
  float vf = 1.0 - max(dot(n, V), 0.0);
  c = mix(c, vec3(0.3, 0.55, 1.0) * day * 1.5, pow(vf, 4.0) * 0.5);
  float a = smoothstep(0.02, 0.85, d) * uOpacity;
  gl_FragColor = vec4(c, a);
}
`;

// 外层大气辉光：按视线到地心的最近距离做指数衰减，并加入前向散射
const ATMO_VERT = /* glsl */`

void main(){

const ATMO_FRAG = /* glsl */`
uniform vec3 uSunW;
uniform float uStrength;
varying vec3 vWorld;
void main(){
  vec3 ro = cameraPosition;
  vec3 rd = normalize(vWorld - ro);
  float t = max(dot(-ro, rd), 0.0);
  vec3 P = ro + rd * t;
  float b = max(length(P), 1.0);
  float glow = exp(-(b - 1.0) / 0.024);
  vec3 L = normalize(uSunW);
  float s = dot(normalize(P), L);
  float lit = smoothstep(-0.35, 0.4, s);
  vec3 col = mix(vec3(1.0, 0.42, 0.18), vec3(0.30, 0.58, 1.0), smoothstep(-0.1, 0.35, s));
  float mie = pow(max(dot(rd, L), 0.0), 10.0) * smoothstep(-0.5, 0.05, s) * 1.4;
  vec3 c = (col * lit + vec3(1.0, 0.75, 0.5) * mie) * glow * uStrength;
  gl_FragColor = vec4(c, 1.0);
}
`;

const MOON_FRAG = /* glsl */`
uniform vec3 uSunW;
varying vec3 vN;
varying vec3 vP;
${GLSL_NOISE}
void main(){
  vec3 p = normalize(vP);
  float maria = smoothstep(0.05, 0.35, fbm(p * 1.6 + 4.0, 4));
  float cr = snoise(p * 14.0);
  float rim = smoothstep(0.55, 0.65, cr) - smoothstep(0.68, 0.8, cr);
  float pit = smoothstep(0.7, 0.85, cr);
  float tex = fbm(p * 30.0, 4) * 0.5 + 0.5;
  vec3 col = mix(vec3(0.62, 0.60, 0.57), vec3(0.30, 0.30, 0.31), maria);
  col *= 0.8 + 0.35 * tex;
  col += rim * 0.12 - pit * 0.08;
  float NL = max(dot(normalize(vN), normalize(uSunW)), 0.0);
  vec3 c = pow(col, vec3(2.2)) * NL * 2.6 + pow(col, vec3(2.2)) * 0.01;
  gl_FragColor = vec4(c, 1.0);
}
`;

/* =====================================================================

const isMobile = Math.min(window.innerWidth, window.innerHeight) < 700 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 3000);
const initDist = window.innerWidth / window.innerHeight < 0.8 ? 5.2 : 3.4;
camera.position.set(0.9, 0.75, 3.0).setLength(initDist);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 1.12;
controls.maxDistance = 9;
controls.zoomSpeed = 0.8;

const maxAniso = renderer.capabilities.getMaxAnisotropy();
const maxTex = renderer.capabilities.maxTextureSize;
const TEX_W = Math.min(isMobile ? 2048 : 4096, maxTex);
const TEX_H = TEX_W / 2;

/* =====================================================================
   六、GPU 烘焙：一次性生成高分辨率地表 / 云层 / 星空贴图
   ===================================================================== */
const bakeScene = new THREE.Scene();
const bakeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bakeQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
bakeQuad.frustumCulled = false;
bakeScene.add(bakeQuad);

function bake(material, w, h, strips = 4) {
  const rt = new THREE.WebGLRenderTarget(w, h, {
    type: THREE.UnsignedByteType,
    format: THREE.RGBAFormat,
    wrapS: THREE.RepeatWrapping,
    wrapT: THREE.ClampToEdgeWrapping,
    magFilter: THREE.LinearFilter,
    minFilter: THREE.LinearMipmapLinearFilter,
    generateMipmaps: true,
    depthBuffer: false,
  });
  rt.texture.anisotropy = maxAniso;
  material.blending = THREE.NoBlending;
  material.depthTest = false;
  material.depthWrite = false;
  bakeQuad.material = material;
  // 分条带渲染，避免单次绘制耗时过长
  rt.scissorTest = true;
  const sh = Math.ceil(h / strips);
  for (let i = 0; i < strips; i++) {
    rt.scissor.set(0, i * sh, w, Math.min(sh, h - i * sh));
    renderer.setRenderTarget(rt);
    renderer.render(bakeScene, bakeCam);
  }
  rt.scissorTest = false;
  renderer.setRenderTarget(null);
  material.dispose();
  return rt.texture;
}

/* =====================================================================
   七、场景对象
   ===================================================================== */
const sunDir = new THREE.Vector3(1, 0.18, 0.55).normalize();
const sunBase = sunDir.clone();
const tiltGroup = new THREE.Group();
tiltGroup.rotation.z = THREE.MathUtils.degToRad(23.44);
scene.add(tiltGroup);
const spin = new THREE.Group();
// 初始让东亚朝向镜头
spin.rotation.y = -3.05;
tiltGroup.add(spin);

let earthMat, cloudMat, atmoMat, starMat, moonMat, cloudMesh, moonPivot, moon, sunSprite;
const tmpQ = new THREE.Quaternion();
const tmpV = new THREE.Vector3();

function buildWorld() {
  const { maskTex, featTex } = buildGeoTextures();

  const mkBake = (frag, uniforms = {}) => new THREE.ShaderMaterial({ vertexShader: BAKE_VERT, fragmentShader: frag, uniforms });
  const albedoTex = bake(mkBake(EARTH_BAKE_FRAG, { tMask: { value: maskTex }, tFeat: { value: featTex }, uMode: { value: 0 } }), TEX_W, TEX_H);
  const auxTex = bake(mkBake(EARTH_BAKE_FRAG, { tMask: { value: maskTex }, tFeat: { value: featTex }, uMode: { value: 1 } }), TEX_W, TEX_H);
  const cloudTex = bake(mkBake(CLOUD_BAKE_FRAG), TEX_W, TEX_H);
  const skyTex = bake(mkBake(SKY_BAKE_FRAG), 2048, 1024, 2);
  maskTex.dispose(); featTex.dispose();

  // ---------- 地球 ----------
  const segW = isMobile ? 192 : 256, segH = isMobile ? 96 : 128;
  earthMat = new THREE.ShaderMaterial({
    vertexShader: SURF_VERT,
    fragmentShader: EARTH_FRAG,
    uniforms: {
      tAlbedo: { value: albedoTex }, tAux: { value: auxTex }, tCloud: { value: cloudTex },
      uSun: { value: new THREE.Vector3() }, uCam: { value: new THREE.Vector3() },
      uTexel: { value: new THREE.Vector2(1 / TEX_W, 1 / TEX_H) },
      uCloudU: { value: 0 }, uTime: { value: 0 },
      uLights: { value: 1 }, uClouds: { value: 1 }, uAtmo: { value: 1 },
      uBump: { value: 0.022 },
    },
    extensions: { derivatives: true },
  });
  const earth = new THREE.Mesh(new THREE.SphereGeometry(1, segW, segH), earthMat);
  spin.add(earth);

  // ---------- 云层 ----------
  cloudMat = new THREE.ShaderMaterial({
    vertexShader: SURF_VERT,
    fragmentShader: CLOUD_FRAG,
    uniforms: {
      tCloud: { value: cloudTex },
      uSun: { value: new THREE.Vector3() }, uCam: { value: new THREE.Vector3() },
      uTexel: { value: new THREE.Vector2(1 / TEX_W, 1 / TEX_H) },
      uOpacity: { value: 1 },
    },
    transparent: true,
    depthWrite: false,
    extensions: { derivatives: true },
  });
  cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(1.007, segW, segH), cloudMat);
  cloudMesh.renderOrder = 1;
  spin.add(cloudMesh);

  // ---------- 外层大气 ----------
  atmoMat = new THREE.ShaderMaterial({
    vertexShader: ATMO_VERT,
    fragmentShader: ATMO_FRAG,
    uniforms: { uSunW: { value: sunDir }, uStrength: { value: 1.6 } },
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.12, 128, 64), atmoMat);
  atmo.renderOrder = 2;
  scene.add(atmo);

  // ---------- 星空背景 ----------
  skyTex.anisotropy = 1;
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(1000, 64, 32),
    new THREE.ShaderMaterial({ vertexShader: SURF_VERT, fragmentShader: SKY_FRAG, uniforms: { tSky: { value: skyTex } }, side: THREE.BackSide, depthWrite: false })
  );
  sky.renderOrder = -2;
  scene.add(sky);

  // 星点：部分集中在银河带附近
  const N = isMobile ? 6000 : 11000;
  const pos = new Float32Array(N * 3), size = new Float32Array(N), phase = new Float32Array(N), color = new Float32Array(N * 3);
  const gN = new THREE.Vector3(0.35, 0.82, -0.45).normalize();
  const v = new THREE.Vector3(), c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    for (let t = 0; t < 8; t++) {
      v.set(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1);
      if (v.lengthSq() > 1 || v.lengthSq() < 1e-4) continue;
      v.normalize();
      if (i % 3 === 0 && Math.abs(v.dot(gN)) > 0.12 * Math.random() + 0.05) continue;
      break;
    }
    v.multiplyScalar(900);
    pos.set([v.x, v.y, v.z], i * 3);
    const m = Math.pow(Math.random(), 6);
    size[i] = 1.2 + m * 4.5;
    phase[i] = Math.random();
    const tk = Math.random();
    c.setRGB(...(tk < 0.15 ? [0.65, 0.75, 1.0] : tk < 0.75 ? [1.0, 0.97, 0.92] : tk < 0.92 ? [1.0, 0.85, 0.65] : [1.0, 0.68, 0.5]));
    const br = 0.25 + m * 2.5 + Math.random() * 0.4;
    color.set([c.r * br, c.g * br, c.b * br], i * 3);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  sg.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  sg.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  sg.setAttribute('aColor', new THREE.BufferAttribute(color, 3));
  starMat = new THREE.ShaderMaterial({
    vertexShader: STAR_VERT, fragmentShader: STAR_FRAG,
    uniforms: { uPR: { value: renderer.getPixelRatio() }, uTime: { value: 0 } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const stars = new THREE.Points(sg, starMat);
  stars.renderOrder = -1;
  scene.add(stars);

  // ---------- 太阳 ----------
  const scv = document.createElement('canvas');
  scv.width = scv.height = 256;
  const sgx = scv.getContext('2d');
  const grd = sgx.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.06, 'rgba(255,250,235,1)');
  grd.addColorStop(0.12, 'rgba(255,225,170,0.55)');
  grd.addColorStop(0.3, 'rgba(255,180,110,0.14)');
  grd.addColorStop(1, 'rgba(255,150,80,0)');
  sgx.fillStyle = grd;
  sgx.fillRect(0, 0, 256, 256);
  const sunTex = new THREE.CanvasTexture(scv);
  sunTex.colorSpace = THREE.SRGBColorSpace;
  sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: sunTex, color: new THREE.Color(5, 4.6, 4.2), blending: THREE.AdditiveBlending,
    depthWrite: false, transparent: true, fog: false,
  }));
  sunSprite.scale.setScalar(260);
  sunSprite.renderOrder = -1;
  scene.add(sunSprite);

  // ---------- 月球 ----------
  moonPivot = new THREE.Group();
  moonPivot.rotation.z = THREE.MathUtils.degToRad(5.1);
  scene.add(moonPivot);
  moonMat = new THREE.ShaderMaterial({ vertexShader: MOON_VERT, fragmentShader: MOON_FRAG, uniforms: { uSunW: { value: sunDir } } });
  moon = new THREE.Mesh(new THREE.SphereGeometry(0.27, 64, 32), moonMat);
  moon.position.set(12, 0, 0);
  moonPivot.add(moon);
  moonPivot.rotation.y = 2.2;
}

/* =====================================================================
   八、后期：泛光 + 色调映射输出
   ===================================================================== */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.45, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* =====================================================================
   九、交互 UI
   ===================================================================== */
const state = { spin: true, clouds: true, lights: true, atmo: true };
function bindToggle(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('click', () => {
    state[key] = !state[key];
    el.classList.toggle('on', state[key]);
  });
}
bindToggle('bSpin', 'spin');
bindToggle('bCloud', 'clouds');
bindToggle('bLights', 'lights');
bindToggle('bAtmo', 'atmo');
const sunSlider = document.getElementById('sSun');
let sunAngle = 0;
sunSlider.addEventListener('input', () => { sunAngle = THREE.MathUtils.degToRad(+sunSlider.value); });

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  composer.setSize(w, h);
  if (starMat) starMat.uniforms.uPR.value = renderer.getPixelRatio();
});

/* =====================================================================
   十、动画循环
   ===================================================================== */
const clock = new THREE.Clock();
let cloudDelta = 0, cloudFade = 1, lightFade = 1, atmoFade = 1;
const yAxis = new THREE.Vector3(0, 1, 0);

// 把世界空间方向 / 位置转换到某个物体的局部空间
function toLocalDir(obj, dirW, out) {
  obj.getWorldQuaternion(tmpQ).invert();
  return out.copy(dirW).applyQuaternion(tmpQ);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (state.spin) spin.rotation.y += dt * 0.025;
  cloudDelta += dt * 0.0035;
  cloudMesh.rotation.y = cloudDelta;

  // 平滑开关过渡
  const k = 1 - Math.exp(-dt * 6);
  cloudFade += ((state.clouds ? 1 : 0) - cloudFade) * k;
  lightFade += ((state.lights ? 1 : 0) - lightFade) * k;
  atmoFade += ((state.atmo ? 1 : 0) - atmoFade) * k;

  sunDir.copy(sunBase).applyAxisAngle(yAxis, sunAngle);
  sunSprite.position.copy(sunDir).multiplyScalar(800);

  // 缩放越近旋转越慢，便于近距离观察
  const dist = camera.position.length();
  controls.rotateSpeed = THREE.MathUtils.clamp((dist - 1) * 0.35, 0.05, 0.9);
  controls.update();

  scene.updateMatrixWorld();
  const eu = earthMat.uniforms;
  toLocalDir(spin, sunDir, eu.uSun.value);
  spin.worldToLocal(eu.uCam.value.copy(camera.position));
  eu.uCloudU.value = cloudDelta / (Math.PI * 2);
  eu.uTime.value = t;
  eu.uClouds.value = cloudFade;
  eu.uLights.value = lightFade;
  eu.uAtmo.value = atmoFade;

  const cu = cloudMat.uniforms;
  toLocalDir(cloudMesh, sunDir, cu.uSun.value);
  cloudMesh.worldToLocal(cu.uCam.value.copy(camera.position));
  cu.uOpacity.value = cloudFade;
  cloudMesh.visible = cloudFade > 0.01;

  atmoMat.uniforms.uStrength.value = 1.6 * atmoFade;
  starMat.uniforms.uTime.value = t;

  moonPivot.rotation.y += dt * 0.01;
  moon.rotation.y += dt * 0.01;

  composer.render();
}

// 先让“加载中”提示绘制出来，再执行烘焙
requestAnimationFrame(() => requestAnimationFrame(() => {
  buildWorld();
  clock.start();
  animate();
  const ld = document.getElementById('loading');
  ld.style.opacity = '0';
  setTimeout(() => ld.remove(), 900);
}));
</script>
<script src="../prompt-panel.js" data-id="earth-kiro-opus"></script>
