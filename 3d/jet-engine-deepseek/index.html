  }

  /* 3D 部件标签 */
  .part-label {

  @media (max-width: 520px) {

  }
</style>

<body>

<div id="app"></div>

<a class="back-link" href="../">← 返回 3D 作品</a>

<div class="desc-bar" id="descBar">拖动旋转 · 滚轮缩放 · 悬停或点击部件查看说明</div>
<button class="toggle-btn" id="toggleBtn">分解</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================
   常量 / 剖切参数
   ========================================================= */
const DEG = Math.PI / 180;

// 剖面开口朝向 +X 方向，开口角度 140°，保留 220° 的壳体
const OPEN_CENTER = 90 * DEG;
const OPEN_HALF   = 70 * DEG;
const TH_START    = OPEN_CENTER + OPEN_HALF + Math.PI / 2;
const TH_LEN      = 2 * Math.PI - 2 * OPEN_HALF;
const ARC_START   = OPEN_CENTER + OPEN_HALF;
const ARC_LEN     = 2 * Math.PI - 2 * OPEN_HALF;

const HIGHLIGHT_COLOR = new THREE.Color(0x4fb4ff);

/* =========================================================
   渲染器 / 场景 / 相机
   ========================================================= */
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.left = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();

// 程序化生成的径向渐变背景
(function makeBackground() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 190, 20, 256, 256, 400);
  g.addColorStop(0.0, '#1d2a3a');
  g.addColorStop(0.45, '#0c121a');
  g.addColorStop(1.0, '#04060a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.9;
controls.panSpeed = 0.6;
controls.enablePan = false;
controls.minDistance = 4.5;
controls.maxDistance = 62;
controls.target.set(0, 0, 0);

const CAMERA_DIR = new THREE.Vector3(0.74, 0.44, 0.51).normalize();

function fitCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  const vFov = camera.fov * DEG;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
  const R = 7.0;
  const dV = R / Math.sin(vFov / 2);
  const dH = (R / Math.sin(hFov / 2)) * 0.85;
  const d = Math.min(Math.max(dV, dH), 46);
  camera.position.copy(CAMERA_DIR).multiplyScalar(d);
  camera.lookAt(0, 0, 0);
  controls.target.set(0, 0, 0);
  controls.update();
}

/* =========================================================
   环境光照（RoomEnvironment 程序化环境贴图）
   ========================================================= */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;
pmrem.dispose();

scene.add(new THREE.HemisphereLight(0xbcd7ff, 0x101418, 0.55));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
keyLight.position.set(9, 13, 9);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x7fb6ff, 1.7);
rimLight.position.set(-11, 5, -9);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffd7ae, 0.85);
fillLight.position.set(5, -7, 7);
scene.add(fillLight);

const fireLight = new THREE.PointLight(0xff6a18, 26, 7.5, 2);
fireLight.position.set(0, 0, -0.3);
scene.add(fireLight);

/* =========================================================
   通用几何工具
   ========================================================= */

// 半剖外壳（沿 Z 轴）
function makeShell(rFront, rBack, len, segs = 64) {
  const g = new THREE.CylinderGeometry(rFront, rBack, len, segs, 1, true, TH_START, TH_LEN);
  g.rotateX(Math.PI / 2);
  return g;
}

// 半剖圆环（前缘唇口等）
function makeArcRing(radius, tube, radialSeg = 12, tubularSeg = 72) {
  const g = new THREE.TorusGeometry(radius, tube, radialSeg, tubularSeg, ARC_LEN);
  g.rotateZ(ARC_START);
  return g;
}

// 沿 Z 轴的圆柱
function makeTubeZ(r, len, segs = 32) {
  const g = new THREE.CylinderGeometry(r, r, len, segs, 1, false);
  g.rotateX(Math.PI / 2);
  return g;
}

// 单片叶片：径向沿 +Y，弦向沿 X，厚度沿 Z，带扭转与收缩
function bladeGeometry(len, chord, thick, twistRoot, twistTip, taper) {
  const geo = new THREE.BoxGeometry(chord, len, thick, 1, 8, 1);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const t = (v.y + len / 2) / len;                 // 0 叶根 → 1 叶尖
    const ang = twistRoot + (twistTip - twistRoot) * t;
    const c = Math.cos(ang), s = Math.sin(ang);
    const nx = v.x * c - v.z * s;
    const nz = v.x * s + v.z * c;
    const scale = 1 - (1 - taper) * t * t;
    pos.setXYZ(i, nx * scale, v.y, nz);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

// 整圈叶片（合并为单个几何体）
function makeBladeRing(opts) {
  const {
    count, rootR, tipR, chord, thickness,
    twistRoot = 0.9, twistTip = 0.35,
    taper = 0.72, phase = 0
  } = opts;

  const len = tipR - rootR;
  const base = bladeGeometry(len, chord, thickness, twistRoot, twistTip, taper);
  const geos = [];
  const mtx = new THREE.Matrix4();
  const rot = new THREE.Matrix4();
  const trans = new THREE.Matrix4();

  for (let i = 0; i < count; i++) {
    const a = phase + (i * Math.PI * 2) / count;
    const g = base.clone();
    rot.makeRotationZ(a);
    trans.makeTranslation(0, rootR + len / 2, 0);
    mtx.multiplyMatrices(rot, trans);
    g.applyMatrix4(mtx);
    geos.push(g);
  }
  base.dispose();
  return mergeGeometries(geos, false);
}

/* =========================================================
   部件系统
   ========================================================= */
const engine = new THREE.Group();
scene.add(engine);

const parts = [];
const pickables = [];
const rotors = [];

function createPart(cfg) {
  const group = new THREE.Group();
  group.position.z = cfg.z;
  engine.add(group);

  const rotor = new THREE.Group();
  group.add(rotor);

  const part = {
    name: cfg.name,
    desc: cfg.desc,
    group,
    rotor,
    baseZ: cfg.z,
    offset: cfg.offset,
    materials: [],
    hl: 0,
    labelEl: null,
    labelObj: null
  };
  parts.push(part);

  // CSS2D 标签
  const div = document.createElement('div');
  div.className = 'part-label';
  div.textContent = cfg.name;
  div.style.opacity = '0';
  const label = new CSS2DObject(div);
  label.position.set(0, 3.05, 0);
  group.add(label);
  part.labelEl = div;
  part.labelObj = label;

  return part;
}

function regMat(part, mat) {
  mat.userData.baseEmissive = mat.emissive ? mat.emissive.clone() : new THREE.Color(0x000000);
  mat.userData.baseIntensity = mat.emissiveIntensity !== undefined ? mat.emissiveIntensity : 1;
  part.materials.push(mat);
  return mat;
}

function addMesh(part, geo, mat, parent) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.part = part;
  (parent || part.group).add(mesh);
  pickables.push(mesh);
  return mesh;
}

/* ---------- 材质工厂 ---------- */
function metal(color, roughness, metalness, extra) {
  return new THREE.MeshStandardMaterial(Object.assign({
    color, roughness, metalness,
    envMapIntensity: 1.25
  }, extra || {}));
}

/* =========================================================
   1. 进气风扇
   ========================================================= */
{
  const part = createPart({
    name: '进气风扇',
    desc: '宽大的风扇叶片吸入大量空气，其中一部分进入核心机参与燃烧，其余绕过核心机直接向后喷出，产生发动机的大部分推力。',
    z: 3.6,
    offset: 2.4
  });

  const matBlade = regMat(part, metal(0xd2dbe6, 0.17, 1.0));
  const matDark  = regMat(part, metal(0x8792a1, 0.34, 1.0));
  const matCase  = regMat(part, metal(0x9ba7b5, 0.32, 0.95, { side: THREE.DoubleSide }));

  // 风扇叶片
  const blades = makeBladeRing({
    count: 18, rootR: 0.58, tipR: 2.18,
    chord: 0.76, thickness: 0.05,
    twistRoot: 1.18, twistTip: 0.4, taper: 0.7
  });
  addMesh(part, blades, matBlade, part.rotor);

  // 轮毂
  const hub = makeTubeZ(0.6, 0.85, 32);
  addMesh(part, hub, matDark, part.rotor);

  // 整流锥
  const cone = new THREE.ConeGeometry(0.62, 1.25, 36, 1);
  cone.rotateX(Math.PI / 2);
  cone.translate(0, 0, 1.05);
  addMesh(part, cone, matBlade, part.rotor);

  // 风扇机匣（半剖）
  addMesh(part, makeShell(2.42, 2.28, 1.7), matCase);

  // 进气道唇口
  const lip = makeArcRing(2.42, 0.11, 12, 80);
  lip.translate(0, 0, 0.85);
  addMesh(part, lip, matDark);

  rotors.push({ obj: part.rotor, speed: 1.05, phase: 0 });
}

/* =========================================================
   2. 低压压缩机
   ========================================================= */
{
  const part = createPart({
    name: '低压压缩机',
    desc: '低压压气机把流经核心机的空气初步增压，空气的温度和压力在这一段明显升高。',
    z: 2.4,
    offset: 1.6
  });

  const matBlade = regMat(part, metal(0xbfcbd8, 0.26, 1.0));
  const matDrum  = regMat(part, metal(0x7f8b99, 0.4, 1.0));
  const matCase  = regMat(part, metal(0x99a5b3, 0.34, 0.95, { side: THREE.DoubleSide }));

  const drum = makeTubeZ(0.44, 1.4, 32);
  addMesh(part, drum, matDrum, part.rotor);

  for (let s = 0; s < 2; s++) {
    const ring = makeBladeRing({
      count: 24, rootR: 0.45, tipR: 1.3,
      chord: 0.36, thickness: 0.035,
      twistRoot: 1.0, twistTip: 0.4, taper: 0.8,
      phase: s * 0.25
    });
    ring.translate(0, 0, s === 0 ? 0.33 : -0.31);
    addMesh(part, ring, matBlade, part.rotor);
  }

  addMesh(part, makeShell(1.56, 1.5, 1.3), matCase);

  rotors.push({ obj: part.rotor, speed: 1.3, phase: 0.5 });
}

/* =========================================================
   3. 高压压缩机
   ========================================================= */
{
  const part = createPart({
    name: '高压压缩机',
    desc: '高压压气机逐级压缩空气，出口压力可达数十个大气压，为燃烧室提供高温高压的氧化剂。',
    z: 1.2,
    offset: 0.8
  });

  const matBlade = regMat(part, metal(0xc8d3df, 0.24, 1.0));
  const matDrum  = regMat(part, metal(0x78838f, 0.44, 1.0));
  const matCase  = regMat(part, metal(0x94a0ae, 0.36, 0.95, { side: THREE.DoubleSide }));

  const drum = makeTubeZ(0.37, 1.35, 32);
  addMesh(part, drum, matDrum, part.rotor);

  const zs = [0.42, 0.0, -0.42];
  for (let s = 0; s < zs.length; s++) {
    const ring = makeBladeRing({
      count: 30, rootR: 0.38, tipR: 1.0,
      chord: 0.26, thickness: 0.03,
      twistRoot: 1.05, twistTip: 0.45, taper: 0.82,
      phase: s * 0.31
    });
    ring.translate(0, 0, zs[s]);
    addMesh(part, ring, matBlade, part.rotor);
  }

  addMesh(part, makeShell(1.28, 1.22, 1.3), matCase);

  rotors.push({ obj: part.rotor, speed: 2.0, phase: 1.1 });
}

/* =========================================================
   4. 燃烧室
   ========================================================= */
{
  const part = createPart({
    name: '燃烧室',
    desc: '燃油与高压空气在这里混合并持续燃烧，形成高温高压燃气，是整个发动机的能量来源。',
    z: -0.2,
    offset: 0.0
  });

  const matGlow = regMat(part, new THREE.MeshStandardMaterial({
    color: 0x33160a,
    emissive: 0xff5a14,
    emissiveIntensity: 2.1,
    metalness: 0.35,
    roughness: 0.55,
    envMapIntensity: 0.4
  }));

  const matBright = regMat(part, new THREE.MeshStandardMaterial({
    color: 0x552a0a,
    emissive: 0xffa63a,
    emissiveIntensity: 2.8,
    metalness: 0.2,
    roughness: 0.5,
    envMapIntensity: 0.3
  }));

  const matCase = regMat(part, metal(0xa08e78, 0.42, 0.9, { side: THREE.DoubleSide }));
  const matNozzle = regMat(part, metal(0x6d6459, 0.5, 0.9));

  // 主火焰环
  const flame = new THREE.TorusGeometry(0.76, 0.3, 20, 72);
  flame.scale(1, 1, 1.35);
  addMesh(part, flame, matGlow);

  // 内层高亮环
  const inner = new THREE.TorusGeometry(0.52, 0.09, 14, 64);
  inner.scale(1, 1, 1.4);
  addMesh(part, inner, matBright);

  // 燃油喷嘴（环绕分布）
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const nozzle = new THREE.CylinderGeometry(0.05, 0.07, 0.5, 10, 1);
    nozzle.rotateX(Math.PI / 2);
    nozzle.translate(0, 0, 0.72);
    nozzle.translate(Math.cos(a) * 0.82, Math.sin(a) * 0.82, 0);
    addMesh(part, nozzle, matNozzle);
  }

  // 燃烧室外机匣（半剖）
  addMesh(part, makeShell(1.44, 1.4, 1.55), matCase);
}

/* =========================================================
   5. 高压涡轮
   ========================================================= */
{
  const part = createPart({
    name: '高压涡轮',
    desc: '高压涡轮从高温燃气中提取能量，通过高压轴带动高压压气机旋转，是核心机的“动力心脏”。',
    z: -1.5,
    offset: -0.9
  });

  const matBlade = regMat(part, metal(0x9a8b7a, 0.38, 1.0, {
    emissive: 0x2a0c00, emissiveIntensity: 0.55
  }));
  const matDrum = regMat(part, metal(0x766a5c, 0.5, 1.0));
  const matCase = regMat(part, metal(0xa8a296, 0.4, 0.95, { side: THREE.DoubleSide }));

  const drum = makeTubeZ(0.38, 1.25, 32);
  addMesh(part, drum, matDrum, part.rotor);

  const zs = [0.3, -0.28];
  for (let s = 0; s < zs.length; s++) {
    const ring = makeBladeRing({
      count: 32, rootR: 0.38, tipR: 0.98,
      chord: 0.25, thickness: 0.045,
      twistRoot: 0.95, twistTip: 0.5, taper: 0.85,
      phase: s * 0.2
    });
    ring.translate(0, 0, zs[s]);
    addMesh(part, ring, matBlade, part.rotor);
  }

  addMesh(part, makeShell(1.28, 1.34, 1.25), matCase);

  rotors.push({ obj: part.rotor, speed: 2.5, phase: 2.0 });
}

/* =========================================================
   6. 低压涡轮
   ========================================================= */
{
  const part = createPart({
    name: '低压涡轮',
    desc: '低压涡轮继续吸收燃气中剩余的能量，通过内轴驱动前方的风扇和低压压气机。',
    z: -2.8,
    offset: -1.8
  });

  const matBlade = regMat(part, metal(0xa8967f, 0.4, 1.0, {
    emissive: 0x220a00, emissiveIntensity: 0.4
  }));
  const matDrum = regMat(part, metal(0x6f6558, 0.52, 1.0));
  const matCase = regMat(part, metal(0xa9a294, 0.42, 0.95, { side: THREE.DoubleSide }));

  const drum = makeTubeZ(0.42, 1.3, 32);
  addMesh(part, drum, matDrum, part.rotor);

  const zs = [0.4, 0.0, -0.4];
  for (let s = 0; s < zs.length; s++) {
    const ring = makeBladeRing({
      count: 28, rootR: 0.42, tipR: 1.28,
      chord: 0.3, thickness: 0.04,
      twistRoot: 1.0, twistTip: 0.5, taper: 0.85,
      phase: s * 0.22
    });
    ring.translate(0, 0, zs[s]);
    addMesh(part, ring, matBlade, part.rotor);
  }

  addMesh(part, makeShell(1.42, 1.5, 1.35), matCase);

  rotors.push({ obj: part.rotor, speed: 1.6, phase: 0.8 });
}

/* =========================================================
   7. 尾喷管
   ========================================================= */
{
  const part = createPart({
    name: '尾喷管',
    desc: '尾喷管把高温燃气加速排出，形成高速射流，依据反作用原理产生向前的推力。',
    z: -4.4,

  });

  const matCase = regMat(part, metal(0x8f8b82, 0.38, 0.95, { side: THREE.DoubleSide }));
  const matDark = regMat(part, metal(0x5d574e, 0.55, 0.95));
  const matHot  = regMat(part, new THREE.MeshStandardMaterial({
    color: 0x3a2210,
    emissive: 0x7a2c00,
    emissiveIntensity: 0.9,
    metalness: 0.6,

  }));

  // 收敛外壳
  addMesh(part, makeShell(1.5, 0.95, 2.0), matCase);

  // 后端喷口环
  const lip = makeArcRing(0.95, 0.075, 10, 72);

  // 内部尾锥
  const tailCone = new THREE.ConeGeometry(0.5, 1.5, 32, 1);

/* =========================================================
   中央主轴（单独旋转，不参与分解）
   ========================================================= */
const shaftGroup = new THREE.Group();
engine.add(shaftGroup);
{
  const shaftMat = new THREE.MeshStandardMaterial({
    color: 0x5a636e, metalness: 1.0, roughness: 0.4, envMapIntensity: 1.0
  });
  const shaftGeo = new THREE.CylinderGeometry(0.155, 0.155, 9.6, 24, 1, false);
  shaftGeo.rotateX(Math.PI / 2);

  const shaft = new THREE.Mesh(shaftGeo, shaftMat);
  shaftGroup.add(shaft);
}
rotors.push({ obj: shaftGroup, speed: 1.5, phase: 0 });

/* =========================================================
   交互：拾取 / 高亮 / 说明文字
   ========================================================= */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();

const descBar = document.getElementById('descBar');
const DEFAULT_TIP = '拖动旋转 · 滚轮缩放 · 悬停或点击部件查看说明';

let hoveredPart = null;

function setHovered(part) {
  if (hoveredPart === part) return;
  hoveredPart = part;
  if (part) {
    descBar.innerHTML = '<b>' + part.name + '</b> — ' + part.desc;
    descBar.classList.add('active');
  } else {
    descBar.textContent = DEFAULT_TIP;
    descBar.classList.remove('active');
  }
}

function updateHover(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  if (hits.length > 0) {
    setHovered(hits[0].object.userData.part || null);
  } else {
    setHovered(null);
  }
}

let pointerDownX = 0;
let pointerDownY = 0;
let pointerDragged = false;

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownX = e.clientX;
  pointerDownY = e.clientY;
  pointerDragged = false;
}, { passive: true });

renderer.domElement.addEventListener('pointermove', (e) => {
  if (Math.abs(e.clientX - pointerDownX) > 8 || Math.abs(e.clientY - pointerDownY) > 8) {
    pointerDragged = true;
  }
  if (e.pointerType === 'mouse') {
    updateHover(e.clientX, e.clientY);
  }
}, { passive: true });

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDragged) {
    updateHover(e.clientX, e.clientY);
  }
}, { passive: true });

renderer.domElement.addEventListener('pointerleave', (e) => {
  if (e.pointerType === 'mouse') setHovered(null);
}, { passive: true });

/* =========================================================
   分解 / 复原
   ========================================================= */
const toggleBtn = document.getElementById('toggleBtn');
let exploded = false;
let explodeT = 0;      // 0 → 1 平滑过渡值
let explodeTarget = 0;

toggleBtn.addEventListener('click', () => {
  exploded = !exploded;
  explodeTarget = exploded ? 1 : 0;
  toggleBtn.textContent = exploded ? '复原' : '分解';
  toggleBtn.classList.toggle('active', exploded);
});

/* =========================================================
   动画循环
   ========================================================= */
const clock = new THREE.Clock();
const tmpColor = new THREE.Color();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  // 转子旋转
  for (let i = 0; i < rotors.length; i++) {
    const r = rotors[i];
    r.obj.rotation.z += r.speed * dt;
  }

  // 燃烧室火光轻微闪烁
  const flicker = 1 + Math.sin(performance.now() * 0.006) * 0.08 + Math.sin(performance.now() * 0.017) * 0.05;
  fireLight.intensity = 26 * flicker;

  // 分解进度
  const speed = 1.55;
  if (explodeT < explodeTarget) {
    explodeT = Math.min(explodeTarget, explodeT + dt * speed);
  } else if (explodeT > explodeTarget) {
    explodeT = Math.max(explodeTarget, explodeT - dt * speed);
  }

  const eased = THREE.MathUtils.smoothstep(explodeT, 0, 1);

  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.group.position.z = p.baseZ + p.offset * eased;
    if (p.labelEl) {
      p.labelEl.style.opacity = String(eased);
    }
  }

  // 高亮插值
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    const target = (p === hoveredPart) ? 1 : 0;
    p.hl += (target - p.hl) * Math.min(1, dt * 11);
    if (p.hl < 0.002 && target === 0) p.hl = 0;

    for (let j = 0; j < p.materials.length; j++) {
      const m = p.materials[j];
      tmpColor.copy(m.userData.baseEmissive).lerp(HIGHLIGHT_COLOR, p.hl * 0.85);
      m.emissive.copy(tmpColor);
      m.emissiveIntensity = m.userData.baseIntensity + p.hl * 0.85;
    }
  }

  controls.update();

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* =========================================================
   自适应
   ========================================================= */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
}

window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => {
  setTimeout(onResize, 120);
});

/* =========================================================
   启动
   ========================================================= */
fitCamera();
onResize();
animate();
</script>
